<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sottotitoli Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="cache-control" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta http-equiv="pragma" content="no-cache">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --card: rgba(8, 15, 31, 0.82);
      --line: rgba(96, 165, 250, 0.18);
      --text: #f8fbff;
      --muted: #9ec5ff;
      --sub: #dbeafe;
      --radius: 22px;
      --font-base: 52px;
      --font-trans: 34px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: transparent;
      font-family: Inter, sans-serif;
      color: var(--text);
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .stage {
      display: grid;
      gap: 14px;
    }
    .card {
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(0,0,0,.24);
      padding: 20px;
    }
    .live-original {
      font-size: clamp(30px, 4vw, var(--font-base));
      line-height: 1.18;
      font-weight: 800;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
    }
    .live-translation {
      font-size: clamp(22px, 2.6vw, var(--font-trans));
      line-height: 1.3;
      font-weight: 700;
      color: var(--sub);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .label {
      margin-bottom: 10px;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .speaker-pill {
      font-size: 11px;
      text-transform: none;
      letter-spacing: 0;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.6);
      color: var(--sub);
    }
    .meta {
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <div class="card">
        <div class="label">
          <span>Live caption</span>
          <span id="speakerLabel" class="speaker-pill" style="display:none;"></span>
        </div>
        <div id="sourceText" class="live-original">Waiting for captions…</div>
      </div>

      <div class="card">
        <div class="label">Live translation</div>
        <div id="translatedText" class="live-translation">Translated output will appear here.</div>
      </div>

      <div class="card">
        <div class="meta">
          <span>Room: <strong id="roomLabel"></strong></span>
          <span>Socket: <strong id="socketState">connecting</strong></span>
          <span>Last update: <strong id="lastEvent">none</strong></span>
          <span>Version: <strong>v8</strong></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    // ----- Style params -----
    (function applyStyleParams() {
      const root = document.documentElement;

      const fontSize = parseInt(params.get('fontsize'), 10);
      if (!isNaN(fontSize) && fontSize > 0) {
        root.style.setProperty('--font-base', fontSize + 'px');
      }

      const transFontSize = parseInt(params.get('transfontsize'), 10);
      if (!isNaN(transFontSize) && transFontSize > 0) {
        root.style.setProperty('--font-trans', transFontSize + 'px');
      }

      const color = params.get('color');
      if (color) {
        const val = color.startsWith('#') ? color : '#' + color;
        root.style.setProperty('--text', val);
      }

      const subcolor = params.get('subcolor');
      if (subcolor) {
        const val = subcolor.startsWith('#') ? subcolor : '#' + subcolor;
        root.style.setProperty('--sub', val);
      }

      const bg = params.get('bg');
      if (bg) {
        const val = bg.startsWith('#') ? bg : '#' + bg;
        root.style.setProperty('--card', val);
      }

      const radius = parseInt(params.get('radius'), 10);
      if (!isNaN(radius) && radius >= 0) {
        root.style.setProperty('--radius', radius + 'px');
      }
    })();

    // ----- WebSocket + overlay logic -----
    const room = params.get('room') || 'default';
    const socketUrlBase = "wss://sottotitoli-websocket.onrender.com?room=" + encodeURIComponent(room);

    const sourceText = document.getElementById('sourceText');
    const translatedText = document.getElementById('translatedText');
    const roomLabel = document.getElementById('roomLabel');
    const socketState = document.getElementById('socketState');
    const lastEvent = document.getElementById('lastEvent');
    const speakerLabelEl = document.getElementById('speakerLabel');

    roomLabel.textContent = room;

    let socket = null;
    let retryCount = 0;
    const baseDelay = 1000;   // 1s
    const maxDelay  = 30000;  // 30s
    let reconnectTimer = null;

    function getRetryDelay() {
      if (retryCount === 0) return 0; // immediate first retry
      return Math.min(baseDelay * Math.pow(2, retryCount - 1), maxDelay);
    }

    function clearReconnectTimer() {
      if (reconnectTimer) {
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
      }
    }

    function scheduleReconnect() {
      if (reconnectTimer) return;

      const delay = getRetryDelay();
      socketState.textContent = 'reconnecting in ' + (delay / 1000).toFixed(1) + 's';
      lastEvent.textContent = 'socket reconnect scheduled';

      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        retryCount++;
        connectWebSocket();
      }, delay);
    }

    function updateSpeakerLabel(label) {
      const text = (typeof label === 'string' ? label.trim() : '');
      if (!text) {
        speakerLabelEl.style.display = 'none';
        speakerLabelEl.textContent = '';
        return;
      }
      speakerLabelEl.style.display = 'inline-flex';
      speakerLabelEl.textContent = text;
    }

    function handleMessage(event) {
      try {
        const payload = JSON.parse(event.data);

        if (payload.type === 'system') {
          lastEvent.textContent = payload.event || 'system';
          return;
        }

        lastEvent.textContent = payload.serverTs || 'message received';

        updateSpeakerLabel(payload.label);

        if (typeof payload.final === 'string' && payload.final.trim()) {
          sourceText.textContent = payload.final;
        } else if (typeof payload.interim === 'string' && payload.interim.trim()) {
          sourceText.textContent = payload.interim;
        }

        if (typeof payload.translated === 'string' && payload.translated.trim()) {
          translatedText.textContent = payload.translated;
        } else {
          translatedText.textContent = '—';
        }
      } catch (e) {
        lastEvent.textContent = 'parse error';
      }
    }

    function connectWebSocket() {
      if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
        return;
      }

      const ws = new WebSocket(socketUrlBase);
      socket = ws;

      socketState.textContent = 'connecting';
      lastEvent.textContent = 'socket opening…';

      ws.addEventListener('open', function () {
        if (socket !== ws) return;
        socketState.textContent = 'connected';
        lastEvent.textContent = 'socket open';
        retryCount = 0;
        clearReconnectTimer();
      });

      ws.addEventListener('close', function () {
        if (socket !== ws) return;
        socketState.textContent = 'closed';
        lastEvent.textContent = 'socket closed';
        scheduleReconnect();
      });

      ws.addEventListener('error', function () {
        if (socket !== ws) return;
        socketState.textContent = 'error';
        lastEvent.textContent = 'socket error';
      });

      ws.addEventListener('message', handleMessage);
    }

    window.addEventListener('beforeunload', () => {
      clearReconnectTimer();
      if (socket) {
        try { socket.close(); } catch (e) {}
        socket = null;
      }
    });

    connectWebSocket();
  </script>
</body>
</html>
