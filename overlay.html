<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />
  <title>Sottotitoli Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .overlay-root {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .caption-box {
      max-width: 960px;
      width: 100%;
      font-size: 32px;
      line-height: 1.6;
      text-align: center;
      word-wrap: break-word;
      word-break: break-word;
    }

    .pos-verb {
      color: #2563eb;
    }

    .pos-noun {
      color: #16a34a;
    }

    .pos-adj {
      color: #f97316;
    }

    .pos-adv {
      color: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="overlay-root">
    <div id="captionBox" class="caption-box"></div>
  </div>

  <script src="js/jquery.min.js"></script>
  <script src="js/ws-publisher.js?v11"></script>
  <script src="js/pos-coloring.js?v1"></script>
  <script>
    (function (w) {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const room = params.get("room");
      const mode = params.get("mode") || "caption-en";

      const captionBox = document.getElementById("captionBox");

      function modeIsEnglishLesson(modeKey) {
        if (!modeKey) return false;
        return modeKey.indexOf("lesson") !== -1 && modeKey.indexOf("caption") === -1;
      }

      function tokenizeCaption(text) {
        const rawTokens = text.match(/[A-Za-z']+|\S/g) || [];
        return rawTokens.map((t) => ({
          text: t,
          lemma: t.toLowerCase(),
          pos: null
        }));
      }

      function handleCaptionPayload(payload) {
        if (!payload || !payload.final) return;

        const text = payload.final;

        if (modeIsEnglishLesson(payload.mode)) {
          const tokens = tokenizeCaption(text);
          if (w.SottotitoliPosColoring) {
            w.SottotitoliPosColoring.renderColoredCaption(captionBox, tokens);
          } else {
            captionBox.textContent = text;
          }
        } else {
          captionBox.textContent = text;
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        if (!room || !w.createWSOverlaySubscriber) {
          captionBox.textContent = room
            ? "Overlay not connected (missing subscriber script)."
            : "No room specified.";
          return;
        }

        w.createWSOverlaySubscriber(
          w.SOTTOTITOLICONFIG.websocketUrl,
          room,
          function onCaption(payload) {
            handleCaptionPayload(payload);
          },
          function onStateChange(state) {
            if (state === "disconnected" || state === "error") {
              captionBox.textContent = "Overlay connection lost.";
            }
          }
        );
      });
    })(window);
  </script>
</body>
</html>
