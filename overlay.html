<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />
  <title>Sottotitoli Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    :root {
      --overlay-bg: rgba(5, 12, 24, 0.94);
      --overlay-card: rgba(15, 29, 52, 0.96);
      --overlay-border: rgba(96, 165, 250, 0.35);
      --overlay-muted: #9fb4d3;
      --overlay-accent: #60a5fa;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top left, rgba(96, 165, 250, .28), transparent 55%),
                  linear-gradient(180deg, #020617, #020617);
      color: #e5edff;
      font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .overlay-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .overlay-card {
      width: 100%;
      max-width: 1080px;
      background: var(--overlay-card);
      border-radius: 22px;
      border: 1px solid var(--overlay-border);
      box-shadow:
        0 18px 50px rgba(0, 0, 0, .55),
        0 0 0 1px rgba(15, 23, 42, .9);
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      color: var(--overlay-muted);
    }

    .overlay-room {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, .9);
      border: 1px solid rgba(148, 163, 184, .7);
      color: #dbeafe;
    }

    .overlay-status {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .overlay-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #f97316;
      box-shadow: 0 0 0 4px rgba(248, 150, 70, .22);
    }

    .overlay-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, .25);
    }

    .overlay-caption-box {
      margin-top: 4px;
      border-radius: 18px;
      background: radial-gradient(circle at top left, rgba(59, 130, 246, .20), transparent 45%),
                  rgba(15, 23, 42, .96);
      border: 1px solid rgba(148, 163, 184, .35);
      padding: 18px 20px;
      font-size: 30px;
      line-height: 1.6;
      text-align: center;
      word-wrap: break-word;
      word-break: break-word;
      min-height: 96px;
    }

    .overlay-translation-box {
      margin-top: 8px;
      border-radius: 18px;
      background: radial-gradient(circle at top left, rgba(124, 58, 237, .18), transparent 45%),
                  rgba(15, 23, 42, .96);
      border: 1px solid rgba(167, 139, 250, .35);
      padding: 14px 18px;
      font-size: 26px;
      line-height: 1.5;
      text-align: center;
      word-wrap: break-word;
      word-break: break-word;
      min-height: 60px;
      display: none;
    }

    .overlay-translation-box.visible { display: block; }

    .overlay-translation-box .t-label {
      display: block;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: rgba(167, 139, 250, .8);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .caption-placeholder {
      color: rgba(148, 163, 184, .8);
      font-size: 16px;
    }

    .pos-verb { color: #2563eb; }
    .pos-noun { color: #16a34a; }
    .pos-adj  { color: #f97316; }
    .pos-adv  { color: #7c3aed; }

    @media (max-width: 720px) {
      .overlay-card {
        padding: 14px 14px 16px;
      }
      .overlay-caption-box {
        font-size: 22px;
        padding: 14px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay-shell">
    <div class="overlay-card">
      <div class="overlay-header">
        <div>
          <span style="text-transform: uppercase; letter-spacing: .14em; font-size: 11px; color: var(--overlay-accent); font-weight: 700;">Sottotitoli overlay</span>
          <span id="overlayModeLabel" style="margin-left: 8px; color: var(--overlay-muted);"></span>
        </div>
        <div class="overlay-status">
          <span class="overlay-dot" id="overlayDot"></span>
          <span id="overlayStatusText">Connecting…</span>
          <span class="overlay-room" id="overlayRoomLabel"></span>
        </div>
      </div>
      <div class="overlay-caption-box" id="captionBox">
        <span class="caption-placeholder">Waiting for captions…</span>
      </div>
      <div class="overlay-translation-box" id="translationBox">
        <span class="t-label">🌐 Translation</span>
        <span id="translationText"></span>
      </div>
    </div>
  </div>

  <script src="js/jquery.min.js"></script>
  <script src="config.js"></script>
  <script src="ws-publisher.js"></script>
  <script src="js/lemma-pos-map.js"></script>
  <script src="js/pos-coloring.js"></script>

  <script>
    (function (w) {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const room = params.get("room");
      const modeFromQuery = params.get("mode") || "caption-en";

      const captionBox = document.getElementById("captionBox");
      const translationBox = document.getElementById("translationBox");
      const translationText = document.getElementById("translationText");
      const overlayDot = document.getElementById("overlayDot");
      const overlayStatusText = document.getElementById("overlayStatusText");
      const overlayRoomLabel = document.getElementById("overlayRoomLabel");
      const overlayModeLabel = document.getElementById("overlayModeLabel");

      function modeIsEnglishLesson(modeKey) {
        if (!modeKey) return false;
        return modeKey.indexOf("lesson") !== -1 && modeKey.indexOf("caption") === -1;
      }

      function tokenizeCaption(text) {
        const rawTokens = text.match(/[A-Za-z']+|\S/g) || [];
        return rawTokens.map(function (t) {
          const lemma = t.toLowerCase();
          const pos =
            (w.LEMMA_POS_MAP && w.LEMMA_POS_MAP[lemma]) || null;
          return {
            text: t,
            lemma,
            pos
          };
        });
      }

      function clearPlaceholder() {
        const ph = captionBox.querySelector(".caption-placeholder");
        if (ph) ph.remove();
      }

      function handleCaptionPayload(payload) {
        if (!payload) return;

        const text = payload.final || payload.interim || "";
        const modeKey = payload.mode || modeFromQuery;
        const isTranslation = payload.kind === "translation" || !!payload.translated || !!payload.targetLang;

        // Show/hide translation box based on mode
        if (translationBox) {
          translationBox.classList.toggle("visible", isTranslation);
        }

        if (!text && !payload.translated) {
          captionBox.textContent = "";
          captionBox.innerHTML = '<span class="caption-placeholder">Waiting for captions…</span>';
          if (translationText) translationText.textContent = "";
          return;
        }

        // Source caption
        if (text) {
          clearPlaceholder();
          if (modeIsEnglishLesson(modeKey)) {
            const tokens = tokenizeCaption(text);
            if (w.SottotitoliPosColoring) {
              w.SottotitoliPosColoring.renderColoredCaption(captionBox, tokens);
            } else {
              captionBox.textContent = text;
            }
          } else {
            captionBox.textContent = text;
          }
        }

        // Translated text
        if (isTranslation && translationText) {
          translationText.textContent = payload.translated || payload.interim_translated || "";
        } else if (translationText) {
          translationText.textContent = "";
        }
      }

      function setOverlayState(state) {
        if (!overlayDot || !overlayStatusText) return;
        if (state === "connected") {
          overlayDot.classList.add("connected");
          overlayStatusText.textContent = "Connected";
        } else if (state === "connecting") {
          overlayDot.classList.remove("connected");
          overlayStatusText.textContent = "Connecting…";
        } else if (state === "error") {
          overlayDot.classList.remove("connected");
          overlayStatusText.textContent = "Error";
        } else {
          overlayDot.classList.remove("connected");
          overlayStatusText.textContent = "Disconnected";
        }
      }

      var reconnectTimer = null;
      var retryCount = 0;
      var manualClose = false;
      var socket = null;

      function getRetryDelay() {
        if (retryCount === 0) return 0;
        return Math.min(1000 * Math.pow(2, retryCount - 1), 30000);
      }

      function clearReconnectTimer() {
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      }

      function connect() {
        if (manualClose) return;
        clearReconnectTimer();

        const cfgRoot =
          w.SOTTOTITOLI_CONFIG ||
          w.SOTTOTITOLICONFIG ||
          w.SottotitoliConfig ||
          {};

        const wsUrl = cfgRoot.websocketUrl || cfgRoot.websocket_url || "";

        if (!wsUrl) {
          captionBox.textContent =
            "Overlay not connected (no websocket URL in config).";
          setOverlayState("error");
          return;
        }

        try {
          setOverlayState("connecting");
          socket = new WebSocket(wsUrl + "?room=" + encodeURIComponent(room));
        } catch (err) {
          captionBox.textContent =
            "Overlay not connected (websocket error).";
          setOverlayState("error");
          scheduleReconnect();
          return;
        }

        socket.onopen = function () {
          retryCount = 0;
          setOverlayState("connected");
          try {
            socket.send(JSON.stringify({ join: room }));
          } catch (err) {
            console.error("[Overlay] Failed to join room", err);
          }
        };

        socket.onmessage = function (event) {
          try {
            const payload = JSON.parse(event.data);
            // Accept both new format (type: "caption") and legacy format (msg: true)
            if (payload && (payload.type === "caption" || payload.msg === true)) {
              // Normalize legacy format to new format
              if (payload.msg === true && !payload.type) {
                payload.type = "caption";
                if (payload.final) payload.final = payload.final;
                if (payload.interim) payload.interim = payload.interim;
              }
              handleCaptionPayload(payload);
            }
          } catch (e) {
            console.error("[Overlay] Failed to parse message", e);
          }
        };

        socket.onclose = function () {
          if (manualClose) {
            setOverlayState("disconnected");
            return;
          }
          setOverlayState("disconnected");
          scheduleReconnect();
        };

        socket.onerror = function () {
          setOverlayState("error");
        };
      }

      function scheduleReconnect() {
        if (manualClose) return;
        var delay = getRetryDelay();
        retryCount += 1;
        reconnectTimer = setTimeout(connect, delay);
      }

      document.addEventListener("DOMContentLoaded", function () {
        if (overlayRoomLabel) {
          overlayRoomLabel.textContent = room ? ("room " + room) : "no room";
        }
        if (overlayModeLabel) {
          overlayModeLabel.textContent = "(" + (modeFromQuery || "caption-en") + ")";
        }

        if (!room) {
          captionBox.textContent = "No room specified.";
          return;
        }

        connect();
      });
    })(window);
  </script>
</body>
</html>
