<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sottotitoli Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: rgba(2, 6, 23, 0.28);
      --card: rgba(8, 15, 31, 0.82);
      --line: rgba(96, 165, 250, 0.18);
      --text: #f8fbff;
      --muted: #9ec5ff;
      --sub: #dbeafe;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: transparent;
      font-family: Inter, sans-serif;
      color: var(--text);
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .stage {
      display: grid;
      gap: 14px;
    }
    .card {
      border-radius: 22px;
      background: var(--card);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(0,0,0,.24);
      padding: 20px;
    }
    .live-original {
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1.18;
      font-weight: 800;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .live-translation {
      font-size: clamp(22px, 2.6vw, 34px);
      line-height: 1.3;
      font-weight: 700;
      color: var(--sub);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .label {
      margin-bottom: 10px;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
    }
    .history {
      display: grid;
      gap: 10px;
    }
    .history-item {
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.06);
    }
    .history-item:first-child {
      border-top: 0;
      padding-top: 0;
    }
    .history-original {
      font-size: 18px;
      line-height: 1.4;
      font-weight: 700;
    }
    .history-translation {
      margin-top: 4px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--sub);
      opacity: .92;
    }
    .meta {
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--ok);
      margin-right: 7px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <div class="card">
        <div class="label">Live caption</div>
        <div id="sourceText" class="live-original">Waiting for captions…</div>
      </div>

      <div class="card">
        <div class="label">Live translation</div>
        <div id="translatedText" class="live-translation">Translated output will appear here.</div>
      </div>

      <div class="card">
        <div class="label">Recent lines</div>
        <div id="historyList" class="history"></div>
      </div>

      <div class="card">
        <div class="meta">
          <span><span class="dot"></span><span id="socketState">connected</span></span>
          <span>Room: <strong id="roomLabel"></strong></span>
          <span>Last update: <strong id="lastEvent">none</strong></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const room = params.get('room') || 'default';
    const socketUrl = "wss://sottotitoli-websocket.onrender.com?room=" + encodeURIComponent(room);

    const sourceText = document.getElementById('sourceText');
    const translatedText = document.getElementById('translatedText');
    const roomLabel = document.getElementById('roomLabel');
    const socketState = document.getElementById('socketState');
    const lastEvent = document.getElementById('lastEvent');
    const historyList = document.getElementById('historyList');

    roomLabel.textContent = room;

    function addHistory(original, translation) {
      const item = document.createElement('div');
      item.className = 'history-item';

      const originalDiv = document.createElement('div');
      originalDiv.className = 'history-original';
      originalDiv.textContent = original || '';

      item.appendChild(originalDiv);

      if (translation) {
        const translatedDiv = document.createElement('div');
        translatedDiv.className = 'history-translation';
        translatedDiv.textContent = translation;
        item.appendChild(translatedDiv);
      }

      historyList.prepend(item);

      while (historyList.children.length > 6) {
        historyList.removeChild(historyList.lastChild);
      }
    }

    const socket = new WebSocket(socketUrl);

    socket.addEventListener('open', function () {
      socketState.textContent = 'connected';
      lastEvent.textContent = 'socket open';
    });

    socket.addEventListener('close', function () {
      socketState.textContent = 'closed';
      lastEvent.textContent = 'socket closed';
    });

    socket.addEventListener('error', function () {
      socketState.textContent = 'error';
      lastEvent.textContent = 'socket error';
    });

    socket.addEventListener('message', function (event) {
      try {
        const payload = JSON.parse(event.data);

        if (payload.type === 'system') {
          lastEvent.textContent = payload.event || 'system';
          return;
        }

        lastEvent.textContent = payload.serverTs || 'message received';

        if (typeof payload.final === 'string' && payload.final.trim()) {
          sourceText.textContent = payload.final;
        } else if (typeof payload.interim === 'string' && payload.interim.trim()) {
          sourceText.textContent = payload.interim;
        }

        if (typeof payload.translated === 'string' && payload.translated.trim()) {
          translatedText.textContent = payload.translated;
        } else if (typeof payload.final === 'string' && payload.final.trim()) {
          translatedText.textContent = '—';
        }

        if (typeof payload.final === 'string' && payload.final.trim()) {
          addHistory(payload.final, payload.translated || '');
        }
      } catch (e) {
        lastEvent.textContent = 'parse error';
      }
    });
  </script>
</body>
</html>
