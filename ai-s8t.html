<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Voice · Sottotitoli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0f1e; --card: #111827; --line: rgba(255,255,255,.08);
      --text: #f1f5f9; --text-dim: #94a3b8; --text-faint: #64748b;
      --purple: #7c3aed; --cyan: #06b6d4; --green: #10b981;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
    }
    [data-theme="light"] {
      --bg: #f0f2f5; --card: #fff; --line: #e2e8f0;
      --text: #111827; --text-dim: #6b7280; --text-faint: #9ca3af;
    }
    body {
      font-family: var(--font-ui);
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; border-bottom: 1px solid var(--line);
      background: var(--card); flex-shrink: 0;
    }
    .logo { font-size: 18px; font-weight: 800; color: var(--text); text-decoration: none; }
    .logo span { color: var(--purple); }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .btn {
      font-family: var(--font-ui); font-size: 13px; font-weight: 600;
      padding: 8px 18px; border-radius: 99px; border: 1.5px solid var(--line);
      background: var(--card); color: var(--text); cursor: pointer;
      transition: all .15s;
    }
    .btn:hover { border-color: var(--purple); color: var(--purple); }
    .btn-primary { background: var(--purple); color: #fff; border-color: var(--purple); }
    .btn-primary:hover { background: #6d28d9; }
    .theme-btn { font-size: 18px; padding: 4px 10px; border: none; background: none; cursor: pointer; }
    .main-layout {
      display: flex; flex: 1; overflow: hidden;
    }
    .orb-panel {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-width: 0; position: relative;
    }
    .orb-panel iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
    .transcript-panel {
      width: 380px; border-left: 1px solid var(--line);
      background: var(--card); display: flex; flex-direction: column;
      flex-shrink: 0;
    }
    .transcript-head {
      padding: 16px 20px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .transcript-head h2 { font-size: 16px; font-weight: 700; }
    .transcript-body {
      flex: 1; overflow-y: auto; padding: 16px 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .transcript-line {
      font-size: 14px; line-height: 1.6; padding: 8px 12px;
      border-radius: 12px; max-width: 100%; word-break: break-word;
      animation: fadeIn .2s;
    }
    .transcript-line.user { background: rgba(124,58,237,.12); color: var(--text); align-self: flex-end; }
    .transcript-line.ai { background: rgba(6,182,212,.1); color: var(--text); align-self: flex-start; }
    .transcript-line.partial { opacity: .6; font-style: italic; }
    .transcript-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--text-faint); font-size: 14px; text-align: center;
      padding: 40px 20px; line-height: 1.6;
    }
    .transcript-foot {
      padding: 12px 20px; border-top: 1px solid var(--line);
      display: flex; gap: 8px;
    }
    .transcript-foot .btn { flex: 1; text-align: center; }
    .status-bar {
      padding: 6px 20px; font-size: 12px; color: var(--text-dim);
      border-top: 1px solid var(--line); background: var(--bg);
      display: flex; align-items: center; gap: 8px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
    .status-dot.live { background: var(--green); animation: pulse 1.5s infinite; }
    .status-dot.warn { background: #f59e0b; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    @media (max-width: 768px) {
      .main-layout { flex-direction: column; }
      .transcript-panel { width: 100%; max-height: 40vh; border-left: none; border-top: 1px solid var(--line); }
      .orb-panel { min-height: 50vh; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="panoramica.html" class="logo">sottotitoli<span>.ai</span> — AI Voice</a>
    <div class="topbar-actions">
      <button class="btn" onclick="saveTranscript()" id="saveBtn" disabled>💾 Salva Transcript</button>
      <button class="btn" onclick="copyTranscript()" id="copyBtn" disabled>📋 Copia</button>
      <button class="btn" onclick="clearTranscript()">🗑️ Pulisci</button>
      <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="orb-panel" id="orbPanel">
      <iframe src="hugging-voice-kokoro/index.html" title="AI Voice" allow="microphone; camera; autoplay" id="voiceFrame"></iframe>
    </div>
    <div class="transcript-panel" id="transcriptPanel">
      <div class="transcript-head">
        <h2>📝 Transcript</h2>
        <span style="font-size:12px;color:var(--text-faint)" id="lineCount">0 messaggi</span>
      </div>
      <div class="transcript-body" id="transcriptBody">
        <div class="transcript-empty">
          Parla con l'AI — le tue conversazioni<br>appariranno qui in tempo reale.
        </div>
      </div>
      <div class="transcript-foot">
        <button class="btn btn-primary" onclick="saveTranscript()" id="saveBtn2" disabled>💾 Salva</button>
        <button class="btn" onclick="copyTranscript()" id="copyBtn2" disabled>📋 Copia</button>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">In attesa…</span>
  </div>

  <script src="config.js"></script>
  <script>
    // ── Theme ──
    (function(){
      var t = localStorage.getItem('sottotitoli-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
    })();
    function toggleTheme() {
      var el = document.documentElement;
      var next = el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      el.setAttribute('data-theme', next);
      localStorage.setItem('sottotitoli-theme', next);
      document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
    }

    // ── Transcript state ──
    var transcriptLines = []; // { role, text, partial }
    var fullTranscriptText = '';
    var bodyEl = document.getElementById('transcriptBody');
    var emptyEl = bodyEl.querySelector('.transcript-empty');
    var saveBtn = document.getElementById('saveBtn');
    var saveBtn2 = document.getElementById('saveBtn2');
    var copyBtn = document.getElementById('copyBtn');
    var copyBtn2 = document.getElementById('copyBtn2');
    var countEl = document.getElementById('lineCount');
    var statusDot = document.getElementById('statusDot');
    var statusText = document.getElementById('statusText');

    function addLine(role, text, partial) {
      if (emptyEl) { emptyEl.remove(); emptyEl = null; }
      // If last line is partial and same role, replace it
      var last = transcriptLines[transcriptLines.length - 1];
      if (partial && last && last.role === role && last.partial) {
        last.text = text;
        var el = bodyEl.lastElementChild;
        if (el) { el.textContent = (role === 'user' ? 'Tu: ' : 'AI: ') + text; }
        return;
      }
      if (partial && last && last.role === role && !last.partial) {
        // Start a new partial line
      }
      transcriptLines.push({ role: role, text: text, partial: partial });
      var div = document.createElement('div');
      div.className = 'transcript-line ' + role + (partial ? ' partial' : '');
      div.textContent = (role === 'user' ? 'Tu: ' : 'AI: ') + text;
      bodyEl.appendChild(div);
      bodyEl.scrollTop = bodyEl.scrollHeight;
      updateCount();
    }

    function finalizePartial(role) {
      var last = transcriptLines[transcriptLines.length - 1];
      if (last && last.role === role && last.partial) {
        last.partial = false;
        var el = bodyEl.lastElementChild;
        if (el) el.classList.remove('partial');
      }
      updateFullText();
      saveBtn.disabled = false; saveBtn2.disabled = false;
      copyBtn.disabled = false; copyBtn2.disabled = false;
    }

    function updateCount() {
      var final = transcriptLines.filter(function(l) { return !l.partial; });
      countEl.textContent = final.length + ' messaggi';
    }

    function updateFullText() {
      fullTranscriptText = transcriptLines
        .filter(function(l) { return !l.partial; })
        .map(function(l) { return (l.role === 'user' ? 'Tu' : 'AI') + ': ' + l.text; })
        .join('\n');
    }

    function saveTranscript() {
      updateFullText();
      if (!fullTranscriptText) return;
      var blob = new Blob([fullTranscriptText], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sottotitoli-voice-' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function copyTranscript() {
      updateFullText();
      if (!fullTranscriptText) return;
      navigator.clipboard.writeText(fullTranscriptText).then(function() {
        var orig = copyBtn.textContent;
        copyBtn.textContent = '✅ Copiato!'; copyBtn2.textContent = '✅ Copiato!';
        setTimeout(function() { copyBtn.textContent = orig; copyBtn2.textContent = orig; }, 2000);
      }).catch(function() {
        alert('Copia non riuscita. Seleziona e copia manualmente.');
      });
    }

    function clearTranscript() {
      transcriptLines = [];
      fullTranscriptText = '';
      bodyEl.innerHTML = '';
      emptyEl = document.createElement('div');
      emptyEl.className = 'transcript-empty';
      emptyEl.textContent = 'Parla con l\'AI — le tue conversazioni\nappariranno qui in tempo reale.';
      bodyEl.appendChild(emptyEl);
      countEl.textContent = '0 messaggi';
      saveBtn.disabled = true; saveBtn2.disabled = true;
      copyBtn.disabled = true; copyBtn2.disabled = true;
    }

    // ── Listen for messages from the voice iframe ──
    window.addEventListener('message', function(e) {
      var msg = e.data;
      if (!msg || !msg.type) return;

      if (msg.type === 'live-transcript') {
        addLine(msg.role, msg.text, msg.partial);
      }

      if (msg.type === 'transcript') {
        // Final transcript from a completed conversation
        fullTranscriptText = msg.text || '';
        saveBtn.disabled = !fullTranscriptText;
        saveBtn2.disabled = !fullTranscriptText;
        copyBtn.disabled = !fullTranscriptText;
        copyBtn2.disabled = !fullTranscriptText;
      }

      if (msg.type === 'status') {
        statusText.textContent = msg.text + (msg.detail ? ' — ' + msg.detail : '');
        statusDot.className = 'status-dot ' + (msg.level === 'ok' ? 'live' : msg.level === 'warn' ? 'warn' : '');
      }
    });
  </script>
</body>
</html>
