<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translation Pipeline Mockup · Sottotitoli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--card:#1a1d26;--line:rgba(255,255,255,.06);--text:#e8eaed;--text-sec:#9ca3af;--muted:#6b7280;--accent:#a78bfa;--green:#34d399;--amber:#fbbf24;--red:#f87171;--blue:#60a5fa}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px;-webkit-font-smoothing:antialiased;max-width:900px;margin:0 auto}
h1{font-size:24px;font-weight:800;margin-bottom:4px}
h1 span{color:var(--accent)}
.sub{font-size:12px;color:var(--muted);margin-bottom:24px}

/* Controls */
.controls{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.controls select,.controls input,.controls button{font-family:inherit;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:13px}
.controls select:focus,.controls input:focus{outline:none;border-color:var(--accent)}
.controls button{background:var(--accent);color:#fff;border:none;cursor:pointer;font-weight:600;transition:all .15s}
.controls button:hover{opacity:.9}
.controls button:disabled{opacity:.4;cursor:not-allowed}
.controls label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}

/* Pipeline visualization */
.pipeline{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
@media(max-width:600px){.pipeline{grid-template-columns:1fr}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.stage .stage-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.stage .stage-dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.stage .stage-dot.live{background:var(--green);box-shadow:0 0 6px rgba(52,211,153,.5);animation:pulse 1.5s infinite}
.stage .stage-dot.loading{background:var(--amber);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.stage .entry{padding:8px 10px;border-radius:8px;margin-bottom:4px;font-size:13px;line-height:1.4;animation:slideIn .3s ease-out}
.stage .entry.caption{background:rgba(167,139,250,.06);border-left:3px solid var(--accent)}
.stage .entry.translation{background:rgba(52,211,153,.06);border-left:3px solid var(--green)}
.stage .entry.error{background:rgba(248,113,113,.06);border-left:3px solid var(--red)}
.stage .entry .ts{font-size:9px;color:var(--muted);display:block;margin-bottom:2px}
.stage .entry .txt{font-weight:500}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* Stats bar */
.stats{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:center;min-width:80px}
.stat .sv{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .sl{font-size:9px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.stat .sv.green{color:var(--green)}
.stat .sv.amber{color:var(--amber)}
.stat .sv.blue{color:var(--blue)}

/* Log */
.log{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:200px;overflow-y:auto;font-size:11px;font-family:'SF Mono',monospace;color:var(--muted)}
.log .log-line{margin-bottom:3px}
.log .log-line .ll-ts{color:var(--muted);margin-right:6px}
.log .log-line.ll-ok{color:var(--green)}
.log .log-line.ll-err{color:var(--red)}
.log .log-line.ll-cache{color:var(--amber)}
.log .log-line.ll-info{color:var(--blue)}
</style>
</head>
<body>

<h1>Translation Pipeline <span>Mockup</span></h1>
<p class="sub">Decoupled broadcast · LibreTranslate · Cache · Timeout · Async</p>

<!-- Stats -->
<div class="stats">
  <div class="stat"><div class="sv blue" id="stCaptions">0</div><div class="sl">Captions sent</div></div>
  <div class="stat"><div class="sv green" id="stTranslated">0</div><div class="sl">Translated</div></div>
  <div class="stat"><div class="sv amber" id="stCached">0</div><div class="sl">Cache hits</div></div>
  <div class="stat"><div class="sv" id="stAvgMs">—</div><div class="sl">Avg latency</div></div>
</div>

<!-- Controls -->
<div class="controls">
  <select id="srcLang">
    <option value="nl">🇳🇱 Dutch</option>
    <option value="en">🇬🇧 English</option>
    <option value="it">🇮🇹 Italian</option>
    <option value="fr">🇫🇷 French</option>
    <option value="de">🇩🇪 German</option>
    <option value="es">🇪🇸 Spanish</option>
    <option value="pl">🇵🇱 Polish</option>
    <option value="pt">🇵🇹 Portuguese</option>
  </select>
  <span style="color:var(--muted)">→</span>
  <select id="tgtLang">
    <option value="it" selected>🇮🇹 Italian</option>
    <option value="en">🇬🇧 English</option>
    <option value="nl">🇳🇱 Dutch</option>
    <option value="fr">🇫🇷 French</option>
    <option value="de">🇩🇪 German</option>
    <option value="es">🇪🇸 Spanish</option>
    <option value="pl">🇵🇱 Polish</option>
    <option value="pt">🇵🇹 Portuguese</option>
  </select>
  <input type="text" id="textInput" placeholder="Type a sentence to translate…" style="flex:1;min-width:200px">
  <button id="sendBtn">Send</button>
  <button id="micBtn" style="background:var(--card);border:1.5px solid var(--line);color:var(--text)">🎤 Speak</button>
  <label><input type="checkbox" id="cacheToggle" checked> Cache</label>
  <label><input type="checkbox" id="decoupleToggle" checked> Async</label>
</div>

<!-- Pipeline stages -->
<div class="pipeline">
  <div class="stage" id="captionStage">
    <div class="stage-label"><span class="stage-dot live" id="capDot"></span> Caption (instant)</div>
    <div style="color:var(--muted);font-size:11px;font-style:italic" id="capEmpty">Waiting for input…</div>
  </div>
  <div class="stage" id="transStage">
    <div class="stage-label"><span class="stage-dot" id="transDot"></span> Translation (async)</div>
    <div style="color:var(--muted);font-size:11px;font-style:italic" id="transEmpty">Waiting for caption…</div>
  </div>
</div>

<!-- Log -->
<div class="log" id="logBox">
  <div class="log-line ll-info"><span class="ll-ts">--:--:--</span> Ready. Type a sentence or click 🎤 Speak.</div>
</div>

<script>
// ═══════════════ TRANSLATION ENGINE ═══════════════
var translationCache = {};
var captionsSent = 0, translatedCount = 0, cacheHits = 0, totalLatency = 0;

var $ = function(id){ return document.getElementById(id); };
function log(msg, cls) {
  var now = new Date();
  var ts = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  var div = document.createElement('div');
  div.className = 'log-line'+(cls?' ll-'+cls:'');
  div.innerHTML = '<span class="ll-ts">'+ts+'</span>'+msg;
  $('logBox').prepend(div);
}
function updateStats() {
  $('stCaptions').textContent = captionsSent;
  $('stTranslated').textContent = translatedCount;
  $('stCached').textContent = cacheHits;
  $('stAvgMs').textContent = translatedCount > 0 ? Math.round(totalLatency/translatedCount)+'ms' : '—';
}

// ═══════════════ CAPTION (instant) ═══════════════
function emitCaption(text, srcLang) {
  captionsSent++;
  var stage = $('captionStage');
  var empty = $('capEmpty');
  if (empty) empty.remove();
  $('capEmpty') && $('capEmpty').remove();

  var div = document.createElement('div');
  div.className = 'entry caption';
  var now = new Date();
  var ts = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  div.innerHTML = '<span class="ts">'+ts+' · '+srcLang.toUpperCase()+'</span><span class="txt">'+esc(text)+'</span>';
  stage.insertBefore(div, stage.firstChild);

  $('capDot').classList.add('live');
  setTimeout(function(){ $('capDot').classList.remove('live'); }, 600);

  log('📤 Caption sent: "'+text+'"', 'ok');
  updateStats();
}

// ═══════════════ TRANSLATION (async, cached, timeout) ═══════════════
async function translateAsync(text, srcLang, tgtLang, useCache, isAsync) {
  var stage = $('transStage');
  var empty = $('transEmpty');
  if (empty) empty.remove();

  var cacheKey = srcLang+'|'+tgtLang+'|'+text.toLowerCase().trim();

  // Check cache
  if (useCache && translationCache[cacheKey]) {
    cacheHits++;
    var cached = translationCache[cacheKey];
    renderTranslation(text, cached, 0, true);
    log('💾 Cache hit: "'+text+'" → "'+cached+'"', 'cache');
    updateStats();
    return;
  }

  // Create loading placeholder
  var loadingDiv = document.createElement('div');
  loadingDiv.className = 'entry translation';
  loadingDiv.style.opacity = '0.5';
  loadingDiv.innerHTML = '<span class="ts">⏳ Translating…</span><span class="txt">'+esc(text)+'</span>';
  stage.insertBefore(loadingDiv, stage.firstChild);
  $('transDot').classList.add('loading');

  var startTime = Date.now();

  // If async mode, caption is ALREADY sent. Translation follows.
  // If sync mode, caption waits for translation (old behavior).
  if (!isAsync) {
    // Simulate old behavior: caption waits
    log('⏳ (OLD MODE) Caption held, waiting for translation…', 'info');
  } else {
    log('⚡ (NEW MODE) Caption sent instantly, translation in background…', 'info');
  }

  try {
    var translated = await fetchTranslationWithTimeout(text, srcLang, tgtLang);
    var elapsed = Date.now() - startTime;

    // Remove loading placeholder
    if (loadingDiv.parentNode) loadingDiv.remove();

    totalLatency += elapsed;
    translatedCount++;

    // Store in cache
    if (useCache) translationCache[cacheKey] = translated;

    renderTranslation(text, translated, elapsed, false);
    log('✅ Translated in '+elapsed+'ms: "'+text+'" → "'+translated+'"', 'ok');
    updateStats();
  } catch(err) {
    // Remove loading placeholder
    if (loadingDiv.parentNode) loadingDiv.remove();

    renderError(text, err.message);
    log('❌ Translation failed: '+err.message, 'err');
    $('transDot').classList.remove('loading');
    updateStats();
  }
}

function renderTranslation(original, translated, elapsed, fromCache) {
  var stage = $('transStage');
  var div = document.createElement('div');
  div.className = 'entry translation';
  var now = new Date();
  var ts = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  var info = fromCache ? ' · 💾 cached' : (' · ' + elapsed + 'ms');
  div.innerHTML = '<span class="ts">'+ts+info+'</span><span class="txt">'+esc(translated)+'</span>';
  stage.insertBefore(div, stage.firstChild);
  $('transDot').classList.remove('loading');
  $('transDot').classList.add('live');
  setTimeout(function(){ $('transDot').classList.remove('live'); }, 600);
}

function renderError(original, msg) {
  var stage = $('transStage');
  var div = document.createElement('div');
  div.className = 'entry error';
  var now = new Date();
  var ts = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
  div.innerHTML = '<span class="ts">'+ts+' · ERROR</span><span class="txt">'+esc(msg)+'</span>';
  stage.insertBefore(div, stage.firstChild);
}

// ═══════════════ LIBRETRANSLATE API ═══════════════
async function fetchTranslationWithTimeout(text, srcLang, tgtLang) {
  var controller = new AbortController();
  var timeout = setTimeout(function(){ controller.abort(); }, 5000); // 5s timeout

  try {
    var url = 'https://libretranslate.com/translate';
    var resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        q: text,
        source: srcLang,
        target: tgtLang,
        format: 'text'
      }),
      signal: controller.signal
    });
    clearTimeout(timeout);

    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    var data = await resp.json();
    if (data && data.translatedText) return data.translatedText;
    throw new Error('No translation in response');
  } catch(err) {
    clearTimeout(timeout);
    if (err.name === 'AbortError') throw new Error('Timeout (5s) — LibreTranslate may be down');
    throw err;
  }
}

// ═══════════════ MAIN FLOW ═══════════════
async function handleText(text) {
  if (!text.trim()) return;
  var src = $('srcLang').value;
  var tgt = $('tgtLang').value;
  var useCache = $('cacheToggle').checked;
  var asyncMode = $('decoupleToggle').checked;

  // 1) Emit caption INSTANTLY (decoupled from translation)
  emitCaption(text, src);

  // 2) Translate async (doesn't block caption)
  translateAsync(text, src, tgt, useCache, asyncMode);
}

// ═══════════════ SPEECH (simulate or real) ═══════════════
function startSpeech() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    log('⚠️ Speech Recognition not supported. Type instead.', 'err');
    return;
  }
  var rec = new SR();
  rec.lang = $('srcLang').value === 'nl' ? 'nl-NL' :
              $('srcLang').value === 'it' ? 'it-IT' :
              $('srcLang').value === 'fr' ? 'fr-FR' :
              $('srcLang').value === 'de' ? 'de-DE' :
              $('srcLang').value === 'es' ? 'es-ES' :
              $('srcLang').value === 'pl' ? 'pl-PL' :
              $('srcLang').value === 'pt' ? 'pt-PT' : 'en-US';
  rec.interimResults = false;
  rec.continuous = false;
  rec.onresult = function(ev) {
    var text = ev.results[0][0].transcript.trim();
    if (text) {
      $('textInput').value = text;
      handleText(text);
    }
  };
  rec.onerror = function(e) { log('🎤 Mic error: '+e.error, 'err'); };
  rec.onend = function() { $('micBtn').disabled = false; $('micBtn').textContent = '🎤 Speak'; };
  rec.start();
  $('micBtn').disabled = true;
  $('micBtn').textContent = '🔴 Listening…';
  log('🎤 Listening… ('+rec.lang+')', 'info');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══════════════ WIRE UI ═══════════════
$('sendBtn').addEventListener('click', function(){
  handleText($('textInput').value);
  $('textInput').value = '';
});
$('textInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') { handleText($('textInput').value); $('textInput').value = ''; }
});
$('micBtn').addEventListener('click', startSpeech);

log('🚀 Mockup ready. Demonstrates: LibreTranslate + cache + timeout + async caption broadcast.', 'info');
log('Toggle "Async" to compare old (blocking) vs new (decoupled) behavior.', 'info');
</script>
</body>
</html>
