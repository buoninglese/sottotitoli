<!DOCTYPE html>
<html lang="it" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Pagina non trovata — Sottotitoli">
  <meta name="theme-color" content="#050810">
  <meta name="robots" content="noindex, follow">
  <title>404 · Pagina non trovata — Sottotitoli</title>

  <!-- ═══ Security ═══ -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme-2.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" media="print" onload="this.media='all'">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <style>
    :root{
      --bg:#050810;
      --text:#f8fafc;
      --text-secondary:rgba(226,232,240,.70);
      --accent:#22d3ee;
      --accent-glow:rgba(34,211,238,.35);
      --radius:14px;
      --radius-pill:999px;
      --t-micro:180ms cubic-bezier(.2,.8,.2,1);
      --t-lift:280ms cubic-bezier(.34,1.56,.64,1);
    }
    *,*::before,*::after{box-sizing:border-box}
    ::selection{background:rgba(34,211,238,.22);color:#fff}
    html{scrollbar-width:thin;scrollbar-color:rgba(34,211,238,.15) transparent}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
      display:flex;align-items:center;justify-content:center;
    }
    .bg-layer{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;
      background-image:linear-gradient(to bottom,rgba(5,8,16,.75) 0%,rgba(5,8,16,.20) 50%,rgba(5,8,16,.92) 100%),url('img/bg-home.png')}
    .bg-overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;
      background:linear-gradient(to bottom,var(--bg) 0%,transparent 35%,transparent 65%,var(--bg) 100%)}
    .noise-overlay{position:fixed;inset:0;z-index:9996;pointer-events:none;opacity:.028;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");background-repeat:repeat;background-size:150px}

    .error-card{
      position:relative;z-index:2;text-align:center;padding:48px 32px;
      max-width:520px;width:100%;
    }
    .error-code{
      font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(96px,14vw,160px);
      line-height:1;letter-spacing:-0.04em;
      background:linear-gradient(180deg,#22d3ee 0%,#0891b2 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      margin:0 0 8px;user-select:none;
    }
    .eyebrow{
      display:inline-block;font-family:'JetBrains Mono',monospace;
      font-size:10px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
      color:rgba(226,232,240,.45);margin-bottom:18px;
    }
    .headline{
      font-family:'Manrope',sans-serif;font-weight:700;font-size:clamp(20px,3vw,28px);
      color:#fff;letter-spacing:-0.02em;margin:0 0 12px;
    }
    .body-text{
      font-size:15px;color:rgba(255,255,255,.55);line-height:1.65;
      margin:0 auto 32px;max-width:400px;text-wrap:balance;
    }
    .home-btn{
      position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;
      height:48px;padding:0 24px;background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);border-radius:var(--radius-pill);
      color:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;
      text-decoration:none;cursor:pointer;
      transition:background var(--t-micro),border-color var(--t-micro),transform var(--t-lift),box-shadow var(--t-micro);
    }
    .home-btn:hover{
      background:rgba(255,255,255,.10);border-color:rgba(34,211,238,.20);
      transform:translateY(-1px);box-shadow:0 0 24px rgba(34,211,238,.08),0 8px 24px rgba(0,0,0,.20);
    }
    .home-btn:active{transform:translateY(0) scale(.96)}
    .pill-arrow{display:inline-block;transition:transform var(--t-lift)}
    .home-btn:hover .pill-arrow{transform:translateX(4px)}
    .bottom-links{position:fixed;bottom:28px;left:0;right:0;text-align:center;z-index:2}
    .bottom-links a{
      font-family:'Inter',sans-serif;font-size:12px;color:rgba(255,255,255,.35);
      text-decoration:none;margin:0 10px;transition:color var(--t-micro);
    }
    .bottom-links a:hover{color:var(--accent)}
  </style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-overlay"></div>
  <div class="noise-overlay"></div>

  <main class="error-card" role="main">
    <span class="eyebrow">Errore 404</span>
    <h1 class="error-code">404</h1>
    <h2 class="headline">Pagina non trovata</h2>
    <p class="body-text">La pagina che stai cercando non esiste o è stata spostata. Forse hai seguito un link interrotto o hai digitato l'indirizzo sbagliato.</p>
    <a href="index.html" class="home-btn">Torna alla home<span class="pill-arrow">→</span></a>
  </main>

  <nav class="bottom-links" aria-label="Link utili">
    <a href="index.html">Home</a>
    <a href="privacy.html">Privacy</a>
    <a href="termini.html">Termini</a>
  </nav>

</body>
</html>
