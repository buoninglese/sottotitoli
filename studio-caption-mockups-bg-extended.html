<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Extended BG — 12 Toggle Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh;position:relative;transition:background .5s}
body.light{background:#fafaf8;color:#1a1a1a}
body.dark{background:#060610;color:#e8eaed}
#bgLayer{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .6s}
#bgLayer.on{opacity:1}
body.light #bgLayer.on{opacity:.88}
.bg-canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:10px;padding:40px}
#ui h1{font-size:clamp(28px,5vw,56px);font-weight:900;letter-spacing:-1.5px;transition:color .5s}
#ui p{font-size:12px;opacity:.5;max-width:400px;text-align:center;line-height:1.6}
.var-label{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.35;margin-top:2px}
.meter-row{display:flex;align-items:center;gap:8px}
.meter-bar{width:100px;height:2px;border-radius:1px;overflow:hidden}
body.light .meter-bar{background:rgba(0,0,0,.06)}
body.dark .meter-bar{background:rgba(255,255,255,.06)}
.meter-fill{height:100%;border-radius:1px;transition:width .1s;width:0%}
body.light .meter-fill{background:#5b7fc1}
body.dark .meter-fill{background:linear-gradient(90deg,#34d399,#a78bfa)}
.meter-label{font-family:'JetBrains Mono',monospace;font-size:8px;opacity:.3;min-width:40px}
.sens-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.sens-row label{font-size:8px;opacity:.3;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.sens-slider{-webkit-appearance:none;appearance:none;width:80px;height:3px;border-radius:2px;outline:none;cursor:pointer}
body.light .sens-slider{background:rgba(0,0,0,.08)}
body.dark .sens-slider{background:rgba(255,255,255,.08)}
.sens-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;cursor:pointer;border:1.5px solid}
body.light .sens-slider::-webkit-slider-thumb{background:#fff;border-color:#c5c0b8}
body.dark .sens-slider::-webkit-slider-thumb{background:#1a1a2e;border-color:rgba(255,255,255,.2)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{padding:9px 16px;border-radius:100px;border:1.5px solid;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:all .2s}
body.light .btn{background:#fff;color:#666;border-color:#d9d5cc}
body.light .btn:hover{background:#f5f3ef;color:#1a1a1a;border-color:#c5c0b8}
body.dark .btn{background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.08)}
body.dark .btn:hover{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.15)}
.btn.on{background:rgba(52,211,153,.1)!important;border-color:rgba(52,211,153,.25)!important;color:#34d399!important}
.btn.mic-on{background:rgba(239,68,68,.15)!important;border-color:rgba(239,68,68,.3)!important;color:#ef4444!important;animation:micPulse 1.5s ease infinite}
.btn.var-nav{width:28px;height:28px;border-radius:50%;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}

/* Toggle Panel */
#togglePanel{position:fixed;top:50%;right:16px;transform:translateY(-50%);z-index:20;background:rgba(15,18,30,.92);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;max-height:85vh;overflow-y:auto;width:186px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .3s}
body.light #togglePanel{background:rgba(255,255,255,.92);border-color:rgba(0,0,0,.08)}
#togglePanel h4{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.3);margin-bottom:2px}
#togglePanel .tog-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
#togglePanel .tog-row span:first-child{font-size:9px;opacity:.5;min-width:40px}
.tb{padding:3px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:rgba(255,255,255,.4);font-size:9px;cursor:pointer;font-family:inherit;transition:all .15s}
.tb:hover{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.7)}
.tb.on{background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.3);color:#a78bfa}
body.light .tb{border-color:rgba(0,0,0,.08);color:rgba(0,0,0,.4);background:rgba(0,0,0,.02)}
body.light .tb.on{background:rgba(124,58,237,.1);border-color:rgba(124,58,237,.25);color:#7c3aed}
#togglePanel .panel-toggle{position:absolute;left:-32px;top:12px;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(15,18,30,.9);color:rgba(255,255,255,.5);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s}
#togglePanel.collapsed{right:-160px}
#togglePanel.collapsed .panel-toggle{left:-32px}

/* Left Panel */
#leftPanel{position:fixed;top:50%;left:16px;transform:translateY(-50%);z-index:20;background:rgba(15,18,30,.92);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;max-height:85vh;overflow-y:auto;width:186px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .3s}
body.light #leftPanel{background:rgba(255,255,255,.92);border-color:rgba(0,0,0,.08)}
#leftPanel h4{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.3);margin-bottom:2px}
#leftPanel .tog-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
#leftPanel .tog-row span:first-child{font-size:9px;opacity:.5;min-width:40px}
#leftPanel .panel-toggle{position:absolute;right:-32px;top:12px;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(15,18,30,.9);color:rgba(255,255,255,.5);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s}
#leftPanel.collapsed{left:-160px}
#leftPanel.collapsed .panel-toggle{right:-32px}
</style>
</head>
<body class="dark">
<div id="bgLayer" class="on">
  <canvas class="bg-canvas" id="canvasRings"></canvas>
  <canvas class="bg-canvas" id="canvasBars"></canvas>
</div>
<!-- Toggle Panel -->
<div id="togglePanel">
  <button class="panel-toggle" onclick="togglePanel()" title="Toggle panel">⚙</button>
  <h4>🎨 Controls</h4>
  <div class="tog-row"><span>Palette</span><span style="display:flex;gap:3px"><button class="tb" data-key="palette" data-val="default" onclick="setToggle(this)">Def</button><button class="tb" data-key="palette" data-val="ocean" onclick="setToggle(this)">Ocn</button><button class="tb" data-key="palette" data-val="sunset" onclick="setToggle(this)">Sun</button><button class="tb" data-key="palette" data-val="forest" onclick="setToggle(this)">For</button><button class="tb" data-key="palette" data-val="berry" onclick="setToggle(this)">Ber</button></span></div>
  <div class="tog-row"><span>Speed</span><span style="display:flex;gap:3px"><button class="tb" data-key="speed" data-val="0.3" onclick="setToggle(this)">Slow</button><button class="tb on" data-key="speed" data-val="1" onclick="setToggle(this)">1×</button><button class="tb" data-key="speed" data-val="2" onclick="setToggle(this)">2×</button><button class="tb" data-key="speed" data-val="4" onclick="setToggle(this)">4×</button></span></div>
  <div class="tog-row"><span>Density</span><span style="display:flex;gap:3px"><button class="tb" data-key="density" data-val="0.4" onclick="setToggle(this)">Low</button><button class="tb on" data-key="density" data-val="1" onclick="setToggle(this)">Med</button><button class="tb" data-key="density" data-val="2" onclick="setToggle(this)">Hi</button></span></div>
  <div class="tog-row"><span>Size</span><span style="display:flex;gap:3px"><button class="tb" data-key="size" data-val="0.5" onclick="setToggle(this)">Sm</button><button class="tb on" data-key="size" data-val="1" onclick="setToggle(this)">Md</button><button class="tb" data-key="size" data-val="1.8" onclick="setToggle(this)">Lg</button></span></div>
  <div class="tog-row"><span>Glow</span><span style="display:flex;gap:3px"><button class="tb" data-key="glow" data-val="0" onclick="setToggle(this)">Off</button><button class="tb on" data-key="glow" data-val="1" onclick="setToggle(this)">On</button><button class="tb" data-key="glow" data-val="3" onclick="setToggle(this)">Max</button></span></div>
  <div class="tog-row"><span>Wave</span><span style="display:flex;gap:3px"><button class="tb on" data-key="wave" data-val="sine" onclick="setToggle(this)">Sin</button><button class="tb" data-key="wave" data-val="square" onclick="setToggle(this)">Sqr</button><button class="tb" data-key="wave" data-val="triangle" onclick="setToggle(this)">Tri</button></span></div>
  <div class="tog-row"><span>Bar</span><span style="display:flex;gap:3px"><button class="tb on" data-key="barStyle" data-val="solid" onclick="setToggle(this)">Sol</button><button class="tb" data-key="barStyle" data-val="gradient" onclick="setToggle(this)">Grd</button><button class="tb" data-key="barStyle" data-val="outline" onclick="setToggle(this)">Out</button></span></div>
  <div class="tog-row"><span>Rings</span><span style="display:flex;gap:3px"><button class="tb" data-key="rings" data-val="1" onclick="setToggle(this)">1</button><button class="tb" data-key="rings" data-val="2" onclick="setToggle(this)">2</button><button class="tb on" data-key="rings" data-val="3" onclick="setToggle(this)">3</button><button class="tb" data-key="rings" data-val="5" onclick="setToggle(this)">5</button></span></div>
  <div class="tog-row"><span>Opacity</span><span style="display:flex;gap:3px"><button class="tb" data-key="bgOpacity" data-val="0.2" onclick="setToggle(this)">20%</button><button class="tb" data-key="bgOpacity" data-val="0.5" onclick="setToggle(this)">50%</button><button class="tb on" data-key="bgOpacity" data-val="1" onclick="setToggle(this)">100%</button></span></div>
  <div class="tog-row"><span>Anim</span><span style="display:flex;gap:3px"><button class="tb on" data-key="anim" data-val="smooth" onclick="setToggle(this)">Smo</button><button class="tb" data-key="anim" data-val="sharp" onclick="setToggle(this)">Shp</button><button class="tb" data-key="anim" data-val="bouncy" onclick="setToggle(this)">Bnc</button></span></div>
  <div class="tog-row"><span>Mirror</span><span style="display:flex;gap:3px"><button class="tb on" data-key="mirror" data-val="0" onclick="setToggle(this)">Off</button><button class="tb" data-key="mirror" data-val="1" onclick="setToggle(this)">Hor</button><button class="tb" data-key="mirror" data-val="2" onclick="setToggle(this)">Ver</button></span></div>
  <div class="tog-row"><span>Shift</span><span style="display:flex;gap:3px"><button class="tb on" data-key="colorShift" data-val="0" onclick="setToggle(this)">Off</button><button class="tb" data-key="colorShift" data-val="0.5" onclick="setToggle(this)">Slo</button><button class="tb" data-key="colorShift" data-val="2" onclick="setToggle(this)">Fst</button><button class="tb" data-key="colorShift" data-val="5" onclick="setToggle(this)">Fst+</button></span></div>
  <div style="display:flex;gap:4px;margin-top:6px">
    <button class="btn" onclick="copySettings()" style="flex:1;font-size:9px">📋 Copy</button>
    <button class="btn" id="btnSpike" onmousedown="spikeOn()" onmouseup="spikeOff()" ontouchstart="spikeOn()" ontouchend="spikeOff()" style="flex:1;font-size:9px;border-color:rgba(251,191,36,.3);color:var(--amber)">⚡ Spike</button>
  </div>
  <div id="copyToast" style="font-size:8px;color:var(--green);text-align:center;opacity:0;transition:opacity .3s">Copied!</div>
</div>

<!-- Left Panel: Particle/Line Behavior -->
<div id="leftPanel">
  <button class="panel-toggle" onclick="toggleLeftPanel()" title="Toggle panel" style="left:auto;right:-32px">⚙</button>
  <h4>🧪 Particles & Lines</h4>
  <div class="tog-row"><span>Particles</span><span style="display:flex;gap:3px"><button class="tb" data-key="particleCount" data-val="0" onclick="setToggle(this)">Off</button><button class="tb" data-key="particleCount" data-val="30" onclick="setToggle(this)">Lo</button><button class="tb on" data-key="particleCount" data-val="80" onclick="setToggle(this)">Med</button><button class="tb" data-key="particleCount" data-val="200" onclick="setToggle(this)">Hi</button></span></div>
  <div class="tog-row"><span>Speed P.</span><span style="display:flex;gap:3px"><button class="tb" data-key="particleSpeed" data-val="0.2" onclick="setToggle(this)">Slo</button><button class="tb on" data-key="particleSpeed" data-val="0.6" onclick="setToggle(this)">Med</button><button class="tb" data-key="particleSpeed" data-val="1.5" onclick="setToggle(this)">Fst</button><button class="tb" data-key="particleSpeed" data-val="3" onclick="setToggle(this)">Fst+</button></span></div>
  <div class="tog-row"><span>Line W</span><span style="display:flex;gap:3px"><button class="tb" data-key="lineWidth" data-val="0.5" onclick="setToggle(this)">Thin</button><button class="tb on" data-key="lineWidth" data-val="1.5" onclick="setToggle(this)">Med</button><button class="tb" data-key="lineWidth" data-val="3" onclick="setToggle(this)">Thk</button><button class="tb" data-key="lineWidth" data-val="6" onclick="setToggle(this)">Bold</button></span></div>
  <div class="tog-row"><span>Lines #</span><span style="display:flex;gap:3px"><button class="tb" data-key="lineCount" data-val="0" onclick="setToggle(this)">Off</button><button class="tb" data-key="lineCount" data-val="20" onclick="setToggle(this)">Lo</button><button class="tb on" data-key="lineCount" data-val="60" onclick="setToggle(this)">Med</button><button class="tb" data-key="lineCount" data-val="150" onclick="setToggle(this)">Hi</button></span></div>
  <div class="tog-row"><span>Trail</span><span style="display:flex;gap:3px"><button class="tb on" data-key="trail" data-val="0" onclick="setToggle(this)">Off</button><button class="tb" data-key="trail" data-val="0.3" onclick="setToggle(this)">Sho</button><button class="tb" data-key="trail" data-val="0.7" onclick="setToggle(this)">Med</button><button class="tb" data-key="trail" data-val="1" onclick="setToggle(this)">Lon</button></span></div>
  <div class="tog-row"><span>Connect</span><span style="display:flex;gap:3px"><button class="tb on" data-key="connectDist" data-val="0" onclick="setToggle(this)">Off</button><button class="tb" data-key="connectDist" data-val="80" onclick="setToggle(this)">Near</button><button class="tb" data-key="connectDist" data-val="200" onclick="setToggle(this)">Far</button></span></div>
  <div class="tog-row"><span>Gravity</span><span style="display:flex;gap:3px"><button class="tb on" data-key="gravity" data-val="0" onclick="setToggle(this)">Off</button><button class="tb" data-key="gravity" data-val="0.02" onclick="setToggle(this)">Low</button><button class="tb" data-key="gravity" data-val="0.08" onclick="setToggle(this)">Med</button><button class="tb" data-key="gravity" data-val="0.2" onclick="setToggle(this)">Hi</button></span></div>
  <div class="tog-row"><span>Repel</span><span style="display:flex;gap:3px"><button class="tb on" data-key="repulsion" data-val="0" onclick="setToggle(this)">Off</button><button class="tb" data-key="repulsion" data-val="0.5" onclick="setToggle(this)">Low</button><button class="tb" data-key="repulsion" data-val="1.5" onclick="setToggle(this)">Med</button><button class="tb" data-key="repulsion" data-val="3" onclick="setToggle(this)">Hi</button></span></div>
  <div class="tog-row"><span>Random</span><span style="display:flex;gap:3px"><button class="tb" data-key="randomness" data-val="0" onclick="setToggle(this)">Off</button><button class="tb" data-key="randomness" data-val="0.3" onclick="setToggle(this)">Low</button><button class="tb on" data-key="randomness" data-val="0.8" onclick="setToggle(this)">Med</button><button class="tb" data-key="randomness" data-val="2" onclick="setToggle(this)">Hi</button></span></div>
  <div class="tog-row"><span>Color</span><span style="display:flex;gap:3px"><button class="tb on" data-key="colorMode" data-val="mono" onclick="setToggle(this)">Mono</button><button class="tb" data-key="colorMode" data-val="spectrum" onclick="setToggle(this)">Spec</button><button class="tb" data-key="colorMode" data-val="audio" onclick="setToggle(this)">Aud</button></span></div>
  <div style="display:flex;gap:4px;margin-top:6px">
    <button class="btn" onclick="copyLeftSettings()" style="flex:1;font-size:9px">📋 Copy</button>
  </div>
  <div id="copyLeftToast" style="font-size:8px;color:var(--green);text-align:center;opacity:0;transition:opacity .3s">Copied!</div>
</div>

<div id="ui">
  <h1 id="titleText">Sottotitoli</h1>
  <p>Live mic — 3 rings, 3 bars, real voice</p>
  <div class="meter-row">
    <span class="meter-label" id="meterLabel">— dB</span>
    <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
  </div>
  <div class="sens-row">
    <label for="sensSlider">sens</label>
    <input type="range" class="sens-slider" id="sensSlider" min="0.1" max="5" step="0.1" value="1" oninput="updateSensitivity(this.value)">
    <span class="meter-label" id="sensLabel">1.0x</span>
  </div>
  <div class="btn-row">
    <button class="btn" id="btnMic" onclick="toggleMic()">&#127908; Start Mic</button>
    <button class="btn" id="btnDark" onclick="setTheme('dark')">&#127769; Dark</button>
    <button class="btn on" id="btnLight" onclick="setTheme('light')">&#9728;&#65039; Light</button>
    <button class="btn on" id="btnBoth" onclick="setMode('both')">Both</button>
    <button class="btn" id="btnRings" onclick="setMode('rings')">Rings</button>
    <button class="btn" id="btnBars" onclick="setMode('bars')">Bars</button>
  </div>
  <div class="btn-row">
    <button class="btn var-nav" onclick="prevVar()" title="Previous variation">&#8592;</button>
    <span class="var-label" id="varName">Rings 1/10 · Bars 1/10</span>
    <button class="btn var-nav" onclick="nextVar()" title="Next variation">&#8594;</button>
  </div>
  <div class="btn-row" style="margin-top:4px">
    <button class="btn" id="btnDemoDeluxe" onclick="toggleDemoDeluxe()" style="border-color:rgba(251,191,36,.3);color:var(--amber);font-size:11px;padding:10px 20px">✨ DEMO DELUXE</button>
  </div>
</div>
<script>
var audioCtx=null,analyser=null,micStream=null,micOn=false;
var freqData=null,volume=0,smoothing=0;
var animFrame=null,currentMode='both',ringVar=0,barVar=0;
var canvasRings,canvasBars,ctxRings,ctxBars;
var W=window.innerWidth,H=window.innerHeight;
var t=0;
var sensitivity=1.0;
function updateSensitivity(val){
  sensitivity=parseFloat(val);
  document.getElementById('sensLabel').textContent=sensitivity.toFixed(1)+'x';
}
// Word-triggered visual events
var wordFlashes=[];
var speakerIslands=[{x:0.25,y:0.35,color:'#5b7fc1',active:0,label:'SPK A'},{x:0.5,y:0.45,color:'#c1665b',active:0,label:'SPK B'},{x:0.75,y:0.35,color:'#5b9c6e',active:0,label:'SPK C'},{x:0.3,y:0.6,color:'#c084fc',active:0,label:'SPK D'},{x:0.7,y:0.6,color:'#fbbf24',active:0,label:'SPK E'}];
var posColorMap={VERB:'#34d399',NOUN:'#60a5fa',ADJ:'#f472b6',ADV:'#c084fc',PREP:'#fbbf24',CONJ:'#fb923c',DET:'#22d3ee',PRON:'#a78bfa'};
var currentSpeaker=0,lastWordTime=0;
// Simulated word feed (in production: from WebSocket/speech API)
var wordQueue=[];
function triggerWordFlash(word,pos,spkIdx){
  var color=posColorMap[pos]||'#a78bfa';
  wordFlashes.push({x:0,y:0,word:word,color:color,life:1,size:0});
  if(wordFlashes.length>25) wordFlashes.shift();
  // Activate speaker island
  if(spkIdx!==undefined&&spkIdx<speakerIslands.length){
    speakerIslands[spkIdx].active=1;
    speakerIslands[spkIdx].lastWord=word;
  }
  lastWordTime=t;
}
// Real mic word detection — trigger on volume spikes
var wordThrottle=0,lastVolumePeak=0,wordCounter=0;
var realWords=['speaking','now','live','voice','sound','wave','audio','signal','frequency','amplitude','modulation','resonance','vibration','acoustic','decibel','harmonic'];
var realPoses=['VERB','ADV','ADJ','NOUN','NOUN','NOUN','NOUN','NOUN','NOUN','NOUN','NOUN','NOUN','NOUN','ADJ','NOUN','ADJ'];
function detectWordsFromMic(v){
  // Detect word boundaries from volume changes
  if(v>0.12&&v>lastVolumePeak*1.6&&Date.now()-wordThrottle>350){
    wordThrottle=Date.now();
    var idx=wordCounter%realWords.length;
    triggerWordFlash(realWords[idx],realPoses[idx],wordCounter%5);
    wordCounter++;
  }
  lastVolumePeak=v>lastVolumePeak?v:lastVolumePeak*0.9;
}

function initAudio(){
  if(audioCtx) return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=512;
  analyser.smoothingTimeConstant=0.65;
  freqData=new Uint8Array(analyser.frequencyBinCount);
}
function initCanvases(){
  canvasRings=document.getElementById('canvasRings');
  canvasBars=document.getElementById('canvasBars');
  ctxRings=canvasRings.getContext('2d');
  ctxBars=canvasBars.getContext('2d');
  resize();
}
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvasRings.width=W;canvasRings.height=H;
  canvasBars.width=W;canvasBars.height=H;
}
function toggleMic(){
  if(micOn){stopMic();return}
  initAudio();
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(s){
    micStream=s;var src=audioCtx.createMediaStreamSource(s);src.connect(analyser);
    micOn=true;document.getElementById('btnMic').textContent='\u23f9 Stop Mic';
    document.getElementById('btnMic').classList.add('mic-on');
    document.getElementById('bgLayer').classList.add('on');
    if(!animFrame) animate();
  }).catch(function(){startDemoMode()});
}
function stopMic(){
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}
  micOn=false;document.getElementById('btnMic').textContent='\uD83C\uDFA4 Start Mic';
  document.getElementById('btnMic').classList.remove('mic-on');
}
function startDemoMode(){
  micOn=true;document.getElementById('btnMic').textContent='\uD83C\uDFA4 Demo Mic';
  document.getElementById('btnMic').classList.add('mic-on');
  document.getElementById('bgLayer').classList.add('on');
  if(!animFrame) animate();
}
function readAudio(){
  if(!analyser) return;
  analyser.getByteFrequencyData(freqData);
  var sum=0;for(var i=0;i<freqData.length;i++) sum+=freqData[i];
  volume=Math.min(1,sum/freqData.length/200*sensitivity);
  // Heavy smoothing for visually pleasing response — slow attack, slow decay
  smoothing=smoothing*Math.max(0.1,0.7-sensitivity*0.12)+volume*Math.min(0.85,sensitivity*0.4);
}

// ── Theme-aware color helpers ──
function c(h,s,l,a){
  return 'hsla('+h+','+s+'%,'+l+'%,'+a+')';
}
function themeHue(isDark){
  var palettes={default:250, ocean:200, sunset:15, forest:140, berry:320};
  var base=palettes[toggles.palette]||250;
  return isDark?base:base-35;
}
function themeSat(isDark){return isDark?65:55;}
function themeLum(isDark,bright){return isDark?(bright?78:65):(bright?42:35);}
function themeAlpha(isDark,base){return isDark?base:base*0.7;}

// ══════════════════════════════════════
// 10 RING VARIATIONS
// ══════════════════════════════════════
var ringFuncs=[
  // Concentric pulse (thin lines)
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark),sat=themeSat(isDark);
    for(var i=0;i<12;i++){
      var r=50+i*38+v*100*Math.sin(t/2000+i*0.4);
      var a=themeAlpha(isDark,0.5-v*0.2)*(1-i*0.06);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle=c((hue+i*22)%360,sat,themeLum(isDark,true),a);
      ctx.lineWidth=1+v*4;ctx.stroke();
    }
  },
  // Spiral (thin line)
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark)+t/50;
    ctx.beginPath();
    for(var i=0;i<360;i++){
      var a=i/180*Math.PI,r=30+i*1.8+v*200;
      var x=cx+Math.cos(a+t/2000)*r,y=cy+Math.sin(a+t/2000)*r;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=c(hue%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.4+v*0.3));
    ctx.lineWidth=1+v*3;ctx.stroke();
  },
  // Breathing rings (beautiful)
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark);
    for(var i=0;i<10;i++){
      var phase=(t/2000+i*0.3)%(Math.PI*2);
      var r=30+i*40+v*60*(0.6+0.4*Math.sin(phase));
      var a=themeAlpha(isDark,(0.15+0.35*Math.sin(phase))*0.8);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle=c((hue+i*28)%360,themeSat(isDark),themeLum(isDark,true),a);
      ctx.fill();
    }
  }
];

var barFuncs=[
  // Mirror — rest+speech blend
  function(ctx,v,isDark){
    var n=64,gap=2,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    var sv=Math.pow(v,0.5);
    var restFactor=Math.max(0.12,Math.min(1,sv*3));
    for(var i=0;i<n;i++){
      var fi=0.2;
      if(freqData&&micOn){fi=freqData[Math.floor(i*freqData.length/n)]/255}
      else{fi=0.12+Math.sin(i*0.35+t/1300)*0.25+0.15}
      var restHgt=Math.max(2,fi*H*0.08);
      var speechHgt=Math.max(2,fi*H*0.38);
      var hgt=restHgt+(speechHgt-restHgt)*restFactor;
      var x=gap+i*(w+gap);
      var gTop=ctx.createLinearGradient(x,H/2-hgt,x,H/2);
      gTop.addColorStop(0,c((hue+i*4)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.15+restFactor*0.45)));
      gTop.addColorStop(1,c((hue+i*4)%360,themeSat(isDark),themeLum(isDark,false),themeAlpha(isDark,0.02+restFactor*0.03)));
      ctx.fillStyle=gTop;ctx.fillRect(x,H/2-hgt,w,hgt);
      var gBot=ctx.createLinearGradient(x,H/2,x,H/2+hgt);
      gBot.addColorStop(0,c((hue+180+i*4)%360,themeSat(isDark),themeLum(isDark,false),themeAlpha(isDark,0.02+restFactor*0.03)));
      gBot.addColorStop(1,c((hue+180+i*4)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.15+restFactor*0.45)));
      ctx.fillStyle=gBot;ctx.fillRect(x,H/2,w,hgt);
      if(fi>0.2&&restFactor>0.3){ctx.fillStyle=c((hue+i*4)%360,80,themeLum(isDark,true),themeAlpha(isDark,0.4*restFactor));ctx.fillRect(x,H/2-hgt,w,Math.min(3,hgt*0.1))}
    }
    ctx.fillStyle=isDark?'rgba(255,255,255,'+(0.03+restFactor*0.06)+')':'rgba(0,0,0,'+(0.03+restFactor*0.05)+')';
    ctx.fillRect(0,H/2-0.5,W,1);
  },
  // Radial mandala
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark);
    var maxR=Math.min(W,H)*0.49;
    var sv=Math.pow(v,0.45),n=180;
    var spaceGrad=ctx.createRadialGradient(cx,cy,maxR*0.1,cx,cy,maxR*1.3);
    spaceGrad.addColorStop(0,isDark?'rgba(6,6,20,0)':'rgba(250,250,248,0)');
    spaceGrad.addColorStop(0.5,isDark?'rgba(6,6,20,0.15)':'rgba(250,250,248,0.1)');
    spaceGrad.addColorStop(1,isDark?'rgba(6,6,20,0.45)':'rgba(250,250,248,0.25)');
    ctx.fillStyle=spaceGrad;ctx.fillRect(0,0,W,H);
    ctx.beginPath();ctx.arc(cx,cy,maxR*0.92,0,Math.PI*2);
    ctx.strokeStyle=c(hue,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.12));ctx.lineWidth=0.5;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,maxR*0.95,0,Math.PI*2);
    ctx.strokeStyle=c(hue+60,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.08));ctx.lineWidth=1;ctx.stroke();
    for(var ring=0;ring<3;ring++){
      var ringR=maxR*(0.35+ring*0.2),sc=n-(ring*30);
      for(var i=0;i<sc;i++){
        var fi=0.15;if(freqData&&micOn){var fidx=Math.floor(i*freqData.length/sc);fi=freqData[fidx%freqData.length]/255}else{fi=0.1+Math.sin(i*0.5+t/1200+ring)*0.3}
        if(fi<0.04) continue;
        var angle=(i/sc)*Math.PI*2+t/15000*(ring+1)*0.5;
        var sl=fi*maxR*0.55*(0.6+ring*0.2);
        ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
        var sg=ctx.createLinearGradient(0,ringR,0,ringR+sl);
        var sh=(hue+i*2.5+ring*40)%360;
        sg.addColorStop(0,c(sh,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.03)));
        sg.addColorStop(0.4,c(sh,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.35+sv*0.3)));
        sg.addColorStop(1,c(sh,themeSat(isDark),themeLum(isDark,true),0));
        ctx.fillStyle=sg;var sw=1.2+fi*2.5+ring*0.3;ctx.fillRect(-sw/2,ringR,sw,sl);
        if(fi>0.25){ctx.beginPath();ctx.arc(0,ringR+sl,1.5+fi*2,0,Math.PI*2);ctx.fillStyle=c(sh,80,themeLum(isDark,true),themeAlpha(isDark,0.7+sv*0.3));ctx.fill()}
        ctx.restore();
      }
    }
    var orbR=maxR*0.08+sv*maxR*0.04;
    var og=ctx.createRadialGradient(cx,cy,0,cx,cy,orbR);
    og.addColorStop(0,c(hue,60,themeLum(isDark,true),themeAlpha(isDark,0.9+sv*0.1)));
    og.addColorStop(0.5,c(hue,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.3)));
    og.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=og;ctx.fillRect(cx-orbR,cy-orbR,orbR*2,orbR*2);
    var pr=orbR*1.5+sv*maxR*0.25*Math.sin(t/2500);ctx.beginPath();ctx.arc(cx,cy,pr,0,Math.PI*2);
    ctx.strokeStyle=c(hue,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.15+sv*0.1));ctx.lineWidth=0.8+sv;ctx.stroke();
  },
  // Breathing Bars — complementary counterpart to Ring 3 (Breathing rings)
  function(ctx,v,isDark){
    var hue=themeHue(isDark),sat=themeSat(isDark);
    var sv=Math.pow(v,0.45);
    var n=14; // number of horizontal bands
    var bandH=H/(n+1);
    
    for(var i=0;i<n;i++){
      // Each band breathes at its own phase — same logic as Ring 3
      var phase=(t/2000+i*0.3)%(Math.PI*2);
      var breath=0.5+0.5*Math.sin(phase);
      
      // Band width breathes: narrow at rest, wide when active
      var restW=W*0.08;
      var speechW=W*0.7*breath+W*0.15;
      var bandW=restW+(speechW-restW)*Math.pow(sv,0.6);
      
      // Vertical position
      var y=(i+1)*bandH-bandH/2;
      
      // Color from ring's hue palette
      var bandHue=(hue+i*28)%360;
      var alpha=themeAlpha(isDark,(0.1+0.35*Math.sin(phase))*0.7*sv);
      
      // Center the bar horizontally
      var x=(W-bandW)/2;
      
      // Gradient from center out
      var g=ctx.createLinearGradient(x,y,x+bandW,y);
      g.addColorStop(0,'rgba(0,0,0,0)');
      g.addColorStop(0.1,c(bandHue,sat,themeLum(isDark,true),alpha*0.3));
      g.addColorStop(0.5,c(bandHue,sat,themeLum(isDark,true),alpha));
      g.addColorStop(0.9,c(bandHue,sat,themeLum(isDark,true),alpha*0.3));
      g.addColorStop(1,'rgba(0,0,0,0)');
      
      ctx.fillStyle=g;
      var barH=bandH*0.5;
      ctx.fillRect(x,y-barH/2,bandW,barH);
      
      // Subtle center dot when breathing
      if(breath>0.6&&sv>0.15){
        ctx.beginPath();ctx.arc(W/2,y,2+breath*3*sv,0,Math.PI*2);
        ctx.fillStyle=c(bandHue,sat,themeLum(isDark,true),alpha*1.2);
        ctx.fill();
      }
    }
    
    // Center vertical reference line
    ctx.strokeStyle=isDark?'rgba(255,255,255,'+(0.02+sv*0.04)+')':'rgba(0,0,0,'+(0.02+sv*0.04)+')';
    ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  }
];

// ── Animation loop ──
function animate(ts){
  animFrame=requestAnimationFrame(animate);
  t=ts||Date.now();
  if(micOn){readAudio();}else if(!demoDeluxeOn){
    smoothing=smoothing*0.92+0.04;
    volume=0.08+Math.sin(t/1800)*0.06+Math.sin(t/3100)*0.05+Math.sin(t/5200)*0.03+Math.sin(t/7300)*0.02;
  }
  var v=smoothing||volume;
  
  // Apply toggles: speed, bg opacity
  var speedMul=toggles.speed||1;
  var bgOp=toggles.bgOpacity||1;
  t=(ts||Date.now())*speedMul;
  
  // Spike button — max everything like a car horn
  if(spikeActive){v=1;smoothing=1;volume=1}
  
  var isDark=document.body.classList.contains('dark');
  
  // Real mic word detection
  if(micOn) detectWordsFromMic(v);
  
  // Decay speaker islands
  speakerIslands.forEach(function(si){si.active*=0.96});
  
  // Decay word flashes
  wordFlashes.forEach(function(wf){wf.life-=0.008});

  ctxRings.clearRect(0,0,W,H);
  ctxBars.clearRect(0,0,W,H);
  
  // Apply bg opacity toggle
  ctxRings.globalAlpha=bgOp;
  ctxBars.globalAlpha=bgOp;
  // Draw word flashes — stacked bottom-right, newest on top
  var liveWords=wordFlashes.filter(function(wf){return wf.life>0.05});
  liveWords.sort(function(a,b){return b.life-a.life}); // newest first
  var baseX=W-20,baseY=H-30,lineH=22;
  liveWords.forEach(function(wf,i){
    if(i>12) return; // max 12 visible
    var alpha=Math.min(1,wf.life*1.2);
    var x=baseX,y=baseY-i*lineH;
    ctxRings.save();ctxRings.globalAlpha=alpha;
    // Background pill
    var w=ctxRings.measureText(wf.word).width+16;
    ctxRings.fillStyle=isDark?'rgba(6,6,16,0.6)':'rgba(250,250,248,0.6)';
    ctxRings.beginPath();ctxRings.roundRect(x-w,y-9,w,18,9);ctxRings.fill();
    // Border
    ctxRings.strokeStyle=wf.color;ctxRings.lineWidth=1;
    ctxRings.globalAlpha=alpha*0.5;ctxRings.stroke();
    // Word text
    ctxRings.globalAlpha=alpha;
    ctxRings.font='bold 10px Inter,sans-serif';
    ctxRings.fillStyle=wf.color;
    ctxRings.textAlign='right';ctxRings.textBaseline='middle';
    ctxRings.fillText(wf.word,x-6,y);
    ctxRings.restore();
  });
  
  // Draw speaker islands as subtle glows
  speakerIslands.forEach(function(si){
    if(si.active<0.02) return;
    var cx=si.x*W,cy=si.y*H;
    var r=50+si.active*80;
    var grad=ctxRings.createRadialGradient(cx,cy,0,cx,cy,r);
    grad.addColorStop(0,si.color+Math.floor(si.active*40).toString(16).padStart(2,'0'));
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctxRings.fillStyle=grad;ctxRings.fillRect(cx-r,cy-r,r*2,r*2);
    // Speaker label
    if(si.active>0.1){
      ctxRings.fillStyle=isDark?'rgba(255,255,255,'+(si.active*0.4)+')':'rgba(0,0,0,'+(si.active*0.3)+')';
      ctxRings.font=(9+si.active*4)+'px "JetBrains Mono",monospace';
      ctxRings.textAlign='center';ctxRings.fillText(si.label,cx,cy-60-si.active*30);
    }
  });

  // ── Apply toggle modifiers to volume ──
  var densityMul=toggles.density||1;
  var sizeMul=toggles.size||1;
  var animStyle=toggles.anim||'smooth';
  
  // Left panel: particle/line toggles modulate volume and rendering
  var pCount=toggles.particleCount||80;
  var pSpeed=toggles.particleSpeed||0.6;
  var lWidth=toggles.lineWidth||1.5;
  var lCount=toggles.lineCount||60;
  var trailVal=toggles.trail||0;
  var connectD=toggles.connectDist||0;
  var gravVal=toggles.gravity||0;
  var repelVal=toggles.repulsion||0;
  var randVal=toggles.randomness||0.8;
  var colorM=toggles.colorMode||'mono';
  
  // Apply left panel effects: modulate volume with particle/line behavior
  var leftMod=1;
  if(pCount>0)leftMod*=0.6+(pCount/300); // More particles = more visual activity
  if(pSpeed>1)leftMod*=1+(pSpeed-1)*0.5; // Faster = more reactive
  if(lCount>0)leftMod*=0.7+(lCount/200); // More lines = denser
  if(lWidth>1)leftMod*=1+(lWidth-1)*0.3; // Thicker lines = more presence
  if(gravVal>0)leftMod*=1+gravVal*2; // Gravity adds weight
  if(repelVal>0)leftMod*=1+repelVal*0.5; // Repulsion adds energy
  if(randVal>0.8)leftMod*=1+(randVal-0.8)*1.5; // Randomness adds chaos
  
  // Trail: decay smoothing for echo effect
  if(trailVal>0){smoothing=smoothing*(1-trailVal*0.5)+volume*trailVal*0.5}
  
  // Anim: adjust based on style
  if(animStyle==='sharp'){v=v<0.1?0:v}
  else if(animStyle==='bouncy'){v=v+Math.sin(t*0.01)*0.15*leftMod}
  
  // Density & Size: scale effective volume
  var effectiveV=Math.min(1,v*densityMul*leftMod);
  
  // Save sizes for render functions
  window._togSize=sizeMul*lWidth/1.5;
  window._togDensity=densityMul*(pCount/80);
  window._togWave=toggles.wave||'sine';
  window._togBarStyle=toggles.barStyle||'solid';
  window._togRings=toggles.rings||3;
  window._togAnim=animStyle;
  window._togColorMode=colorM;

  if(currentMode==='both'||currentMode==='rings') ringFuncs[ringVar](ctxRings,effectiveV,isDark);
  if(currentMode==='both'||currentMode==='bars') barFuncs[barVar](ctxBars,effectiveV,isDark);

  // ── Apply toggle post-effects ──
  var glowVal=toggles.glow||1;
  var shiftVal=toggles.colorShift||0;
  var mirrorVal=toggles.mirror||0;
  
  // Glow: overlay a soft radial gradient
  if(glowVal>1){
    [ctxRings,ctxBars].forEach(function(ctx){
      if(glowVal>=3){
        var g=ctx.createRadialGradient(W/2,H/2,W*.1,W/2,H/2,W*.6);
        g.addColorStop(0,'rgba(255,255,255,'+(0.04*glowVal)+')');
        g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      }
    });
  }
  
  // Color shift: overlay a hue-rotated tint
  if(shiftVal>0){
    [ctxRings,ctxBars].forEach(function(ctx){
      var hue=(Date.now()*shiftVal*0.01)%360;
      ctx.fillStyle='hsla('+hue+',50%,50%,'+(0.03*shiftVal)+')';
      ctx.fillRect(0,0,W,H);
    });
  }
  
  // Mirror: flip half the canvas
  if(mirrorVal===1){
    [ctxRings,ctxBars].forEach(function(ctx){
      ctx.save();ctx.scale(-1,1);ctx.drawImage(ctx.canvas,-W,0);ctx.restore();
    });
  }else if(mirrorVal===2){
    [ctxRings,ctxBars].forEach(function(ctx){
      ctx.save();ctx.scale(1,-1);ctx.drawImage(ctx.canvas,0,-H);ctx.restore();
    });
  }

  var displayV=Math.min(1,v*2.5*sensitivity); // amplify for meter display
  document.getElementById('meterFill').style.width=(displayV*100)+'%';
  document.getElementById('meterLabel').textContent=Math.round(displayV*100-50)+' dB';
}

var toggles={palette:'default',speed:1,density:1,size:1,glow:1,wave:'sine',barStyle:'solid',rings:3,bgOpacity:1,anim:'smooth',mirror:0,colorShift:0,
  particleCount:80,particleSpeed:0.6,lineWidth:1.5,lineCount:60,trail:0,connectDist:0,gravity:0,repulsion:0,randomness:0.8,colorMode:'mono'};

// ── Demo Deluxe: rollercoaster audio simulation ──
var demoDeluxeOn=false,demoPhase=0,demoTime=0,demoInterval=null;
function toggleDemoDeluxe(){
  demoDeluxeOn=!demoDeluxeOn;
  var btn=document.getElementById('btnDemoDeluxe');
  if(demoDeluxeOn){
    btn.textContent='⏹ STOP DEMO';
    btn.style.background='rgba(251,191,36,.15)';
    micOn=true;demoPhase=0;demoTime=0;
    if(!animFrame)animate();
    // Kill demo interval if exists
    if(demoInterval)clearInterval(demoInterval);
    demoInterval=setInterval(advanceDemo,50);
  }else{
    btn.textContent='✨ DEMO DELUXE';
    btn.style.background='';
    micOn=false;
    if(demoInterval)clearInterval(demoInterval);
    demoInterval=null;
  }
}
function advanceDemo(){
  demoTime+=50;
  var t=demoTime/1000; // seconds
  // Rollercoaster pattern: silence → build → burst → sustain → decay → quiet → stutter → blast → fade
  
  if(t<2){volume=0.02; smoothing=smoothing*0.9+volume*0.1}           // silence
  else if(t<4){volume=0.05+(t-2)*0.1; smoothing=smoothing*0.85+volume*0.15} // slow build
  else if(t<5){volume=0.3+Math.sin(t*20)*0.15; smoothing=volume}      // wobble
  else if(t<6.5){volume=0.6+Math.sin(t*30)*0.25; smoothing=volume}    // burst incoming
  else if(t<7){volume=1.0; smoothing=1.0}                              // FULL BLAST
  else if(t<8){volume=0.9; smoothing=volume}                           // sustain
  else if(t<9){volume=0.4+(8.5-t)*0.5; smoothing=smoothing*0.8+volume*0.2} // decay
  else if(t<11){volume=0.08+Math.sin(t*3)*0.05; smoothing=smoothing*0.95+volume*0.05} // quiet
  else if(t<13){                                                        // stutter
    var stut=Math.floor(t*8)%3;
    volume=stut===0?0.7:stut===1?0.1:0.4;
    smoothing=volume;
  }
  else if(t<14.5){volume=0.5+Math.sin(t*15)*0.3+Math.sin(t*23)*0.2; smoothing=volume} // rapid
  else if(t<15){volume=1.0; smoothing=1.0}                              // BLAST
  else if(t<17){volume=Math.max(0.02,1.0-(t-15)*0.5); smoothing=smoothing*0.7+volume*0.3} // fade out
  else{demoTime=0} // loop back
  
  // Stutter drive speaker islands
  if(volume>0.5&&Math.random()<0.3){
    var si=speakerIslands[Math.floor(Math.random()*speakerIslands.length)];
    si.active=Math.min(1,si.active+0.4);
  }
}
// ── Init ──
initCanvases();
window.addEventListener('resize',resize);
updateVarLabel();
animate();
setTimeout(function(){if(!micOn) startDemoMode();},600);
</script>
