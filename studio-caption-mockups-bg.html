<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Live Mic BG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh;position:relative;transition:background .5s}
body.light{background:#fafaf8;color:#1a1a1a}
body.dark{background:#060610;color:#e8eaed}
#bgLayer{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .6s}
#bgLayer.on{opacity:1}
body.light #bgLayer.on{opacity:.88}
.bg-canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:10px;padding:40px}
#ui h1{font-size:clamp(28px,5vw,56px);font-weight:900;letter-spacing:-1.5px;transition:color .5s}
#ui p{font-size:12px;opacity:.5;max-width:400px;text-align:center;line-height:1.6}
.var-label{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.35;margin-top:2px}
.meter-row{display:flex;align-items:center;gap:8px}
.meter-bar{width:100px;height:2px;border-radius:1px;overflow:hidden}
body.light .meter-bar{background:rgba(0,0,0,.06)}
body.dark .meter-bar{background:rgba(255,255,255,.06)}
.meter-fill{height:100%;border-radius:1px;transition:width .1s;width:0%}
body.light .meter-fill{background:#5b7fc1}
body.dark .meter-fill{background:linear-gradient(90deg,#34d399,#a78bfa)}
.meter-label{font-family:'JetBrains Mono',monospace;font-size:8px;opacity:.3;min-width:40px}
.sens-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.sens-row label{font-size:8px;opacity:.3;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.sens-slider{-webkit-appearance:none;appearance:none;width:80px;height:3px;border-radius:2px;outline:none;cursor:pointer}
body.light .sens-slider{background:rgba(0,0,0,.08)}
body.dark .sens-slider{background:rgba(255,255,255,.08)}
.sens-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;cursor:pointer;border:1.5px solid}
body.light .sens-slider::-webkit-slider-thumb{background:#fff;border-color:#c5c0b8}
body.dark .sens-slider::-webkit-slider-thumb{background:#1a1a2e;border-color:rgba(255,255,255,.2)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{padding:9px 16px;border-radius:100px;border:1.5px solid;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:all .2s}
body.light .btn{background:#fff;color:#666;border-color:#d9d5cc}
body.light .btn:hover{background:#f5f3ef;color:#1a1a1a;border-color:#c5c0b8}
body.dark .btn{background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.08)}
body.dark .btn:hover{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.15)}
.btn.on{background:rgba(52,211,153,.1)!important;border-color:rgba(52,211,153,.25)!important;color:#34d399!important}
.btn.mic-on{background:rgba(239,68,68,.15)!important;border-color:rgba(239,68,68,.3)!important;color:#ef4444!important;animation:micPulse 1.5s ease infinite}
.btn.var-nav{width:28px;height:28px;border-radius:50%;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
</style>
</head>
<body class="dark">
<div id="bgLayer" class="on">
  <canvas class="bg-canvas" id="canvasRings"></canvas>
  <canvas class="bg-canvas" id="canvasBars"></canvas>
</div>
<div id="ui">
  <h1 id="titleText">Sottotitoli</h1>
  <p>Live mic — word-reactive, multispeaker spatial</p>
  <div class="meter-row">
    <span class="meter-label" id="meterLabel">— dB</span>
    <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
  </div>
  <div class="sens-row">
    <label for="sensSlider">sens</label>
    <input type="range" class="sens-slider" id="sensSlider" min="0.3" max="3" step="0.1" value="1" oninput="updateSensitivity(this.value)">
    <span class="meter-label" id="sensLabel">1.0x</span>
  </div>
  <div class="btn-row">
    <button class="btn" id="btnMic" onclick="toggleMic()">&#127908; Start Mic</button>
    <button class="btn" id="btnDark" onclick="setTheme('dark')">&#127769; Dark</button>
    <button class="btn on" id="btnLight" onclick="setTheme('light')">&#9728;&#65039; Light</button>
    <button class="btn on" id="btnBoth" onclick="setMode('both')">Both</button>
    <button class="btn" id="btnRings" onclick="setMode('rings')">Rings</button>
    <button class="btn" id="btnBars" onclick="setMode('bars')">Bars</button>
  </div>
  <div class="btn-row">
    <button class="btn var-nav" onclick="prevVar()" title="Previous variation">&#8592;</button>
    <span class="var-label" id="varName">Rings 1/10 · Bars 1/10</span>
    <button class="btn var-nav" onclick="nextVar()" title="Next variation">&#8594;</button>
  </div>
</div>
<script>
var audioCtx=null,analyser=null,micStream=null,micOn=false;
var freqData=null,volume=0,smoothing=0;
var animFrame=null,currentMode='both',ringVar=0,barVar=0;
var canvasRings,canvasBars,ctxRings,ctxBars;
var W=window.innerWidth,H=window.innerHeight;
var t=0;
var sensitivity=1.0;
function updateSensitivity(val){
  sensitivity=parseFloat(val);
  document.getElementById('sensLabel').textContent=sensitivity.toFixed(1)+'x';
}
// Word-triggered visual events
var wordFlashes=[];
var speakerIslands=[{x:0.25,y:0.35,color:'#5b7fc1',active:0,label:'SPK A'},{x:0.5,y:0.45,color:'#c1665b',active:0,label:'SPK B'},{x:0.75,y:0.35,color:'#5b9c6e',active:0,label:'SPK C'},{x:0.3,y:0.6,color:'#c084fc',active:0,label:'SPK D'},{x:0.7,y:0.6,color:'#fbbf24',active:0,label:'SPK E'}];
var posColorMap={VERB:'#34d399',NOUN:'#60a5fa',ADJ:'#f472b6',ADV:'#c084fc',PREP:'#fbbf24',CONJ:'#fb923c',DET:'#22d3ee',PRON:'#a78bfa'};
var currentSpeaker=0,lastWordTime=0;
// Simulated word feed (in production: from WebSocket/speech API)
var wordQueue=[];
function triggerWordFlash(word,pos,spkIdx){
  var color=posColorMap[pos]||'#a78bfa';
  wordFlashes.push({x:Math.random()*W,y:Math.random()*H,word:word,color:color,life:1,size:20+word.length*3});
  if(wordFlashes.length>15) wordFlashes.shift();
  // Activate speaker island
  if(spkIdx!==undefined&&spkIdx<speakerIslands.length){
    speakerIslands[spkIdx].active=1;
    speakerIslands[spkIdx].lastWord=word;
  }
  lastWordTime=t;
}
// Demo word feed
function demoWordFeed(){
  var words=['discussing','future','translation','systems','bridge','barriers','deployment','scale','challenge','neural','models','accurate','remarkably','language','cultures','different','experience','international','meetings','quickly'];
  var poses=['VERB','NOUN','NOUN','NOUN','VERB','NOUN','NOUN','NOUN','NOUN','ADJ','NOUN','ADJ','ADV','NOUN','NOUN','ADJ','NOUN','ADJ','NOUN','ADV'];
  var now=Date.now();
  if(wordQueue.length===0||(now-wordQueue[0].t)>400+Math.random()*600){
    var idx=Math.floor(Math.random()*words.length);
    wordQueue.push({word:words[idx],pos:poses[idx],t:now,spk:Math.floor(Math.random()*3)});
  }
  while(wordQueue.length>0&&(now-wordQueue[0].t)>300){
    var w=wordQueue.shift();
    triggerWordFlash(w.word,w.pos,w.spk);
  }
}

function initAudio(){
  if(audioCtx) return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=512;
  analyser.smoothingTimeConstant=0.65;
  freqData=new Uint8Array(analyser.frequencyBinCount);
}
function initCanvases(){
  canvasRings=document.getElementById('canvasRings');
  canvasBars=document.getElementById('canvasBars');
  ctxRings=canvasRings.getContext('2d');
  ctxBars=canvasBars.getContext('2d');
  resize();
}
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvasRings.width=W;canvasRings.height=H;
  canvasBars.width=W;canvasBars.height=H;
}
function toggleMic(){
  if(micOn){stopMic();return}
  initAudio();
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(s){
    micStream=s;var src=audioCtx.createMediaStreamSource(s);src.connect(analyser);
    micOn=true;document.getElementById('btnMic').textContent='\u23f9 Stop Mic';
    document.getElementById('btnMic').classList.add('mic-on');
    document.getElementById('bgLayer').classList.add('on');
    if(!animFrame) animate();
  }).catch(function(){startDemoMode()});
}
function stopMic(){
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}
  micOn=false;document.getElementById('btnMic').textContent='\uD83C\uDFA4 Start Mic';
  document.getElementById('btnMic').classList.remove('mic-on');
}
function startDemoMode(){
  micOn=true;document.getElementById('btnMic').textContent='\uD83C\uDFA4 Demo Mic';
  document.getElementById('btnMic').classList.add('mic-on');
  document.getElementById('bgLayer').classList.add('on');
  if(!animFrame) animate();
}
function readAudio(){
  if(!analyser) return;
  analyser.getByteFrequencyData(freqData);
  var sum=0;for(var i=0;i<freqData.length;i++) sum+=freqData[i];
  volume=Math.min(1,sum/freqData.length/255*sensitivity);
  // Heavy smoothing for visually pleasing response — slow attack, slow decay
  smoothing=smoothing*Math.max(0.3,0.65-sensitivity*0.1)+volume*Math.min(0.7,sensitivity*0.45);
}

// ── Theme-aware color helpers ──
function c(h,s,l,a){
  return 'hsla('+h+','+s+'%,'+l+'%,'+a+')';
}
function themeHue(isDark){return isDark?250:215;}
function themeSat(isDark){return isDark?65:55;}
function themeLum(isDark,bright){return isDark?(bright?78:65):(bright?42:35);}
function themeAlpha(isDark,base){return isDark?base:base*0.7;}

// ══════════════════════════════════════
// 10 RING VARIATIONS
// ══════════════════════════════════════
var ringFuncs=[
  // 0: Concentric pulse (thin lines)
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark),sat=themeSat(isDark);
    for(var i=0;i<12;i++){
      var r=50+i*38+v*100*Math.sin(t/2000+i*0.4);
      var a=themeAlpha(isDark,0.5-v*0.2)*(1-i*0.06);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle=c((hue+i*22)%360,sat,themeLum(isDark,true),a);
      ctx.lineWidth=1+v*4;ctx.stroke();
    }
  },
  // 1: Spiral (thin line)
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark)+t/50;
    ctx.beginPath();
    for(var i=0;i<360;i++){
      var a=i/180*Math.PI,r=30+i*1.8+v*200;
      var x=cx+Math.cos(a+t/2000)*r,y=cy+Math.sin(a+t/2000)*r;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=c(hue%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.4+v*0.3));
    ctx.lineWidth=1+v*3;ctx.stroke();
  },
  // 2: Ripple (multispeaker — multiple centers)
  function(ctx,v,isDark){
    var hue=themeHue(isDark),sat=themeSat(isDark);
    var centers=[[0.25,0.3],[0.5,0.5],[0.75,0.3],[0.35,0.65],[0.65,0.65]];
    centers.forEach(function(ctr,ci){
      var cx=W*ctr[0],cy=H*ctr[1];
      for(var i=0;i<5;i++){
        var r=15+i*35+v*70*Math.sin(t/1800+i+ci);
        var a=themeAlpha(isDark,0.35-v*0.12)*(1-i*0.1);
        ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.strokeStyle=c((hue+ci*50+i*25)%360,sat,themeLum(isDark,i%2===0),a);
        ctx.lineWidth=0.7+v*2;ctx.stroke();
      }
    });
  },
  // 3: Rotating clusters (thin lines)
  function(ctx,v,isDark){
    var hue=themeHue(isDark);
    for(var c=0;c<5;c++){
      var cx=W/2+Math.cos(t/3000+c*1.2)*W*0.25;
      var cy=H/2+Math.sin(t/3000+c*1.2)*H*0.25;
      for(var i=0;i<5;i++){
        var r=15+i*22+v*50;
        ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.strokeStyle=c((hue+c*50+i*15)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.4-i*0.05));
        ctx.lineWidth=1+v*2;ctx.stroke();
      }
    }
  },
  // 4: Breathing rings (beautiful original)
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark);
    var breath=Math.sin(t/3000)*0.5+0.5;
    for(var i=0;i<10;i++){
      var phase=(t/2000+i*0.3)%(Math.PI*2);
      var r=30+i*40+v*60*(0.6+0.4*Math.sin(phase));
      var a=themeAlpha(isDark,(0.15+0.35*Math.sin(phase))*0.8);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle=c((hue+i*28)%360,themeSat(isDark),themeLum(isDark,true),a);
      ctx.fill();
    }
  },
  // 5: Breathing v2 — titled with subtle phase shift
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark)+30;
    for(var i=0;i<10;i++){
      var phase=(t/2500+i*0.35)%(Math.PI*2);
      var r=25+i*42+v*55*(0.5+0.5*Math.cos(phase));
      var a=themeAlpha(isDark,(0.12+0.38*Math.sin(phase))*0.75);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle=c((hue+i*30)%360,themeSat(isDark),themeLum(isDark,i%2===0),a);
      ctx.fill();
      if(i===4){ctx.strokeStyle=c(hue,themeSat(isDark),themeLum(isDark,true),a*1.3);ctx.lineWidth=0.5;ctx.stroke();}
    }
    // Subtle title box
    var alpha=themeAlpha(isDark,0.15);
    ctx.fillStyle=isDark?'rgba(6,6,16,'+alpha+')':'rgba(250,250,248,'+alpha+')';
    ctx.fillRect(W/2-50,H/2-10,100,20);
    ctx.fillStyle=isDark?'rgba(255,255,255,0.12)':'rgba(0,0,0,0.08)';
    ctx.font='9px "JetBrains Mono",monospace';ctx.textAlign='center';
    ctx.fillText('breathing \u00b7 v2',W/2,H/2+4);
  },
  // 6: Breathing v3 — gentle drift + frame
  function(ctx,v,isDark){
    var cx=W/2+Math.sin(t/4000)*15,cy=H/2+Math.cos(t/5000)*10;
    var hue=themeHue(isDark)+60;
    for(var i=0;i<12;i++){
      var phase=(t/2800+i*0.25)%(Math.PI*2);
      var r=20+i*38+v*50*(0.4+0.6*Math.sin(phase));
      var a=themeAlpha(isDark,(0.1+0.4*Math.sin(phase+i))*0.7);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle=c((hue+i*22)%360,themeSat(isDark),themeLum(isDark,true),a);
      ctx.fill();
    }
    // Frame box for legibility
    ctx.strokeStyle=isDark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)';
    ctx.lineWidth=1;ctx.strokeRect(20,20,W-40,H-40);
    ctx.fillStyle=isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.04)';
    ctx.font='8px "JetBrains Mono",monospace';ctx.textAlign='right';
    ctx.fillText('breathing \u00b7 v3 \u00b7 drift',W-32,H-28);
  }
];var barFuncs=[
  // 0: Spectrum (slowed)
  function(ctx,v,isDark){
    var n=80,gap=2,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    var sv=Math.pow(v,0.6);
    for(var i=0;i<n;i++){
      var hgt=15;
      if(freqData&&micOn){var fi=freqData[Math.floor(i*freqData.length/n)]/255;hgt=Math.max(2,fi*H*0.75)}
      else{hgt=Math.max(2,(Math.sin(i*0.3+t/1200)*0.5+0.5)*H*0.45*sv*5)}
      var x=gap+i*(w+gap);
      var g=ctx.createLinearGradient(x,H,x,H-hgt);
      g.addColorStop(0,c((hue+i*3)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.7)));
      g.addColorStop(1,c((hue+i*3)%360,themeSat(isDark),themeLum(isDark,false),themeAlpha(isDark,0.15)));
      ctx.fillStyle=g;ctx.fillRect(x,H-hgt,w,hgt);
      if(hgt>30)ctx.fillStyle=c((hue+i*3)%360,80,themeLum(isDark,true),themeAlpha(isDark,0.5));
      ctx.fillRect(x,H-hgt,w,Math.min(4,hgt*0.1));
    }
  },
  // 1: Mirror (slowed)
  function(ctx,v,isDark){
    var n=64,gap=2,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    var sv=Math.pow(v,0.55);
    for(var i=0;i<n;i++){
      var hgt=15;
      if(freqData&&micOn){hgt=Math.max(2,freqData[Math.floor(i*freqData.length/n)]/255*H*0.35)}
      else{hgt=Math.max(2,(Math.sin(i*0.35+t/1300)*0.5+0.5)*H*0.25*sv*4)}
      var x=gap+i*(w+gap);
      var g=ctx.createLinearGradient(x,0,x,H);
      g.addColorStop(0,c((hue+i*4)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.6)));
      g.addColorStop(0.5,c((hue+i*4)%360,themeSat(isDark),themeLum(isDark,false),themeAlpha(isDark,0.05)));
      g.addColorStop(1,c((hue+180+i*4)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.6)));
      ctx.fillStyle=g;ctx.fillRect(x,H/2-hgt,w,hgt*2);
    }
  },
  // 2: Center-out (slowed)
  function(ctx,v,isDark){
    var n=80,gap=1,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    var sv=Math.pow(v,0.55);
    for(var i=0;i<n;i++){
      var hgt=15;
      if(freqData&&micOn){hgt=Math.max(2,freqData[Math.floor(i*freqData.length/n)]/255*H*0.4)}
      else{hgt=Math.max(2,(Math.sin(i*0.28+t/1400)*0.5+0.5)*H*0.3*sv*4)}
      var x=gap+i*(w+gap);
      var bright=i%3===0;
      ctx.fillStyle=c((hue+i*3.5)%360,themeSat(isDark),themeLum(isDark,bright),themeAlpha(isDark,0.6));
      ctx.fillRect(x,H/2-hgt,w,hgt*2);
      if(hgt>20)ctx.fillStyle=c((hue+i*3.5)%360,80,themeLum(isDark,true),themeAlpha(isDark,0.4));
      ctx.fillRect(x,H/2-1,w,2);
    }
  },
  // 3: Radial — CINEMATIC, screen-filling
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,n=120,hue=themeHue(isDark);
    var maxR=Math.min(W,H)*0.48;
    var sv=Math.pow(v,0.5);
    // Dark radial gradient background for depth
    var bgGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,maxR);
    bgGrad.addColorStop(0,isDark?'rgba(6,6,16,0)':'rgba(250,250,248,0)');
    bgGrad.addColorStop(1,isDark?'rgba(6,6,16,0.3)':'rgba(250,250,248,0.2)');
    ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);
    for(var i=0;i<n;i++){
      var hgt=10;
      if(freqData&&micOn){var fi=freqData[Math.floor(i*freqData.length/n)]/255;hgt=Math.max(1,fi*maxR*0.85)}
      else{hgt=Math.max(1,(Math.sin(i*0.4+t/1500)*0.5+0.5)*maxR*0.55*sv*3)}
      var angle=(i/n)*Math.PI*2-t/8000;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
      var alpha=themeAlpha(isDark,0.5+sv*0.4);
      var g=ctx.createLinearGradient(0,0,0,-hgt);
      g.addColorStop(0,c((hue+i*3)%360,themeSat(isDark),themeLum(isDark,true),alpha));
      g.addColorStop(0.6,c((hue+i*3)%360,themeSat(isDark),themeLum(isDark,false),alpha*0.5));
      g.addColorStop(1,c((hue+i*3)%360,themeSat(isDark),themeLum(isDark,false),0));
      ctx.fillStyle=g;
      var barW=1.5+sv*2;
      ctx.fillRect(-barW/2,0,barW,-hgt);
      ctx.restore();
    }
    // Center glow
    var glowGrad=ctx.createRadialGradient(cx,cy,0,cx,cy,maxR*0.3);
    glowGrad.addColorStop(0,c(hue,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.08+sv*0.06)));
    glowGrad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glowGrad;ctx.fillRect(0,0,W,H);
  },
  // 4: Waterfall (slowed)
  function(ctx,v,isDark){
    var n=50,gap=4,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    var sv=Math.pow(v,0.5);
    for(var i=0;i<n;i++){
      var hgt=10;
      if(freqData&&micOn){hgt=Math.max(2,freqData[Math.floor(i*freqData.length/n)]/255*H*0.6)}
      else{hgt=Math.max(2,(Math.cos(i*0.35+t/1000)*0.5+0.5)*H*0.4*sv*3)}
      var x=gap+i*(w+gap);
      for(var j=0;j<5;j++){
        var yOff=j*(hgt/5);
        var a=themeAlpha(isDark,0.5-j*0.08);
        ctx.fillStyle=c((hue+i*4+j*10)%360,themeSat(isDark),themeLum(isDark,j<2),a);
        ctx.fillRect(x,H-yOff-hgt/5,w,hgt/5+1);
      }
    }
  },
  // 5: Glow (slowed)
  function(ctx,v,isDark){
    var n=60,gap=3,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    var sv=Math.pow(v,0.5);
    for(var i=0;i<n;i++){
      var hgt=10;
      if(freqData&&micOn){hgt=Math.max(2,freqData[Math.floor(i*freqData.length/n)]/255*H*0.65)}
      else{hgt=Math.max(2,(Math.sin(i*0.3+t/1100)*0.5+0.5)*H*0.4*sv*4)}
      var x=gap+i*(w+gap);
      var glow=c((hue+i*4)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.2));
      ctx.shadowColor=glow;ctx.shadowBlur=12+sv*20;
      ctx.fillStyle=c((hue+i*4)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.7));
      ctx.fillRect(x,H-hgt,w,hgt);
      ctx.shadowBlur=0;
    }
  },
  // 6: Stepped (slowed)
  function(ctx,v,isDark){
    var n=48,stepH=Math.max(4,H/80),gap=3,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    var sv=Math.pow(v,0.5);
    for(var i=0;i<n;i++){
      var hgt=10;
      if(freqData&&micOn){hgt=Math.max(stepH,freqData[Math.floor(i*freqData.length/n)]/255*H*0.6)}
      else{hgt=Math.max(stepH,(Math.sin(i*0.32+t/1250)*0.5+0.5)*H*0.4*sv*4)}
      var steps=Math.floor(hgt/stepH);
      var x=gap+i*(w+gap);
      for(var s=0;s<steps;s++){
        var a=themeAlpha(isDark,0.3+s*0.06);
        ctx.fillStyle=c((hue+i*5+s*8)%360,themeSat(isDark),themeLum(isDark,s<3),a);
        ctx.fillRect(x,H-(s+1)*stepH,w,stepH-1);
      }
    }
  },
  // 7: Waveform (slowed)
  function(ctx,v,isDark){
    var hue=themeHue(isDark);
    var sv=Math.pow(v,0.5);
    ctx.beginPath();
    ctx.moveTo(0,H/2);
    for(var i=0;i<=W;i+=3){
      var idx=Math.floor(i/W*(freqData?freqData.length:128));
      var fi=freqData&&micOn?freqData[idx%freqData.length]/255:0.15+Math.sin(i*0.02+t/1000)*0.3;
      var y=H/2-fi*H*0.4*sv*3;
      ctx.lineTo(i,y);
    }
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,c(hue,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.25)));
    g.addColorStop(1,c(hue+60,themeSat(isDark),themeLum(isDark,false),themeAlpha(isDark,0.05)));
    ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.moveTo(0,H/2);
    for(var i=0;i<=W;i+=3){
      var idx=Math.floor(i/W*(freqData?freqData.length:128));
      var fi=freqData&&micOn?freqData[idx%freqData.length]/255:0.15+Math.sin(i*0.02+t/1000)*0.3;
      ctx.lineTo(i,H/2-fi*H*0.4*sv*3);
    }
    ctx.strokeStyle=c(hue,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.6+sv*0.3));
    ctx.lineWidth=1.5+sv*2;ctx.stroke();
  }
];

// ── Animation loop ──
function animate(ts){
  animFrame=requestAnimationFrame(animate);
  t=ts||Date.now();
  if(micOn){readAudio();}else{
    smoothing=smoothing*0.92+0.04;
    volume=0.08+Math.sin(t/1800)*0.06+Math.sin(t/3100)*0.05+Math.sin(t/5200)*0.03+Math.sin(t/7300)*0.02;
  }
  var v=smoothing||volume;
  var isDark=document.body.classList.contains('dark');
  
  // Demo word feed
  if(micOn) demoWordFeed();
  
  // Decay speaker islands
  speakerIslands.forEach(function(si){si.active*=0.96});
  
  // Decay word flashes
  wordFlashes.forEach(function(wf){wf.life-=0.015});
  wordFlashes=wordFlashes.filter(function(wf){return wf.life>0});

  ctxRings.clearRect(0,0,W,H);
  ctxBars.clearRect(0,0,W,H);
  
  // Draw word flashes
  wordFlashes.forEach(function(wf){
    var alpha=wf.life*0.6;
    ctxRings.save();ctxRings.globalAlpha=alpha;
    ctxRings.font='bold '+(wf.size*wf.life)+'px Inter,sans-serif';
    ctxRings.fillStyle=wf.color;
    ctxRings.textAlign='center';ctxRings.textBaseline='middle';
    ctxRings.fillText(wf.word,wf.x,wf.y);
    ctxRings.restore();
  });
  
  // Draw speaker islands as subtle glows
  speakerIslands.forEach(function(si){
    if(si.active<0.02) return;
    var cx=si.x*W,cy=si.y*H;
    var r=50+si.active*80;
    var grad=ctxRings.createRadialGradient(cx,cy,0,cx,cy,r);
    grad.addColorStop(0,si.color+Math.floor(si.active*40).toString(16).padStart(2,'0'));
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctxRings.fillStyle=grad;ctxRings.fillRect(cx-r,cy-r,r*2,r*2);
    // Speaker label
    if(si.active>0.1){
      ctxRings.fillStyle=isDark?'rgba(255,255,255,'+(si.active*0.4)+')':'rgba(0,0,0,'+(si.active*0.3)+')';
      ctxRings.font=(9+si.active*4)+'px "JetBrains Mono",monospace';
      ctxRings.textAlign='center';ctxRings.fillText(si.label,cx,cy-60-si.active*30);
    }
  });

  if(currentMode==='both'||currentMode==='rings') ringFuncs[ringVar](ctxRings,v,isDark);
  if(currentMode==='both'||currentMode==='bars') barFuncs[barVar](ctxBars,v,isDark);

  var displayV=Math.min(1,v*2.5*sensitivity); // amplify for meter display
  document.getElementById('meterFill').style.width=(displayV*100)+'%';
  document.getElementById('meterLabel').textContent=Math.round(displayV*100-50)+' dB';
}

// ── Controls ──
function setTheme(t){
  document.body.className=t;
  document.getElementById('btnDark').className='btn'+(t==='dark'?' on':'');
  document.getElementById('btnLight').className='btn'+(t==='light'?' on':'');
  document.getElementById('titleText').style.color=t==='dark'?'#e8eaed':'#1a1a1a';
}
function setMode(m){
  currentMode=m;
  document.getElementById('btnBoth').classList.toggle('on',m==='both');
  document.getElementById('btnRings').classList.toggle('on',m==='rings');
  document.getElementById('btnBars').classList.toggle('on',m==='bars');
  updateVarLabel();
}
function nextVar(){
  if(currentMode==='both'||currentMode==='rings') ringVar=(ringVar+1)%7;
  if(currentMode==='both'||currentMode==='bars') barVar=(barVar+1)%8;
  updateVarLabel();
}
function prevVar(){
  if(currentMode==='both'||currentMode==='rings') ringVar=(ringVar+6)%7;
  if(currentMode==='both'||currentMode==='bars') barVar=(barVar+7)%8;
  updateVarLabel();
}
function updateVarLabel(){
  var names=['Concentric','Spiral','Ripple','Cluster','Breathing','Breathing v2','Breathing v3'];
  var bnames=['Spectrum','Mirror','Center-out','Radial','Waterfall','Glow','Stepped','Waveform'];
  var rn=currentMode==='bars'?'—':names[ringVar]+' '+(ringVar+1)+'/7';
  var bn=currentMode==='rings'?'—':bnames[barVar]+' '+(barVar+1)+'/8';
  document.getElementById('varName').textContent='Rings: '+rn+'  |  Bars: '+bn;
}

// ── Init ──
initCanvases();
window.addEventListener('resize',resize);
updateVarLabel();
animate();
setTimeout(function(){if(!micOn) startDemoMode();},600);
</script>
