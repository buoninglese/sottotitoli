<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Live Mic BG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh;position:relative;transition:background .5s}
body.light{background:#fafaf8;color:#1a1a1a}
body.dark{background:#060610;color:#e8eaed}
#bgLayer{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .6s}
#bgLayer.on{opacity:1}
body.light #bgLayer.on{opacity:.88}
.bg-canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:10px;padding:40px}
#ui h1{font-size:clamp(28px,5vw,56px);font-weight:900;letter-spacing:-1.5px;transition:color .5s}
#ui p{font-size:12px;opacity:.5;max-width:400px;text-align:center;line-height:1.6}
.var-label{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.35;margin-top:2px}
.meter-row{display:flex;align-items:center;gap:8px}
.meter-bar{width:100px;height:2px;border-radius:1px;overflow:hidden}
body.light .meter-bar{background:rgba(0,0,0,.06)}
body.dark .meter-bar{background:rgba(255,255,255,.06)}
.meter-fill{height:100%;border-radius:1px;transition:width .1s;width:0%}
body.light .meter-fill{background:#5b7fc1}
body.dark .meter-fill{background:linear-gradient(90deg,#34d399,#a78bfa)}
.meter-label{font-family:'JetBrains Mono',monospace;font-size:8px;opacity:.3;min-width:40px}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{padding:9px 16px;border-radius:100px;border:1.5px solid;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:all .2s}
body.light .btn{background:#fff;color:#666;border-color:#d9d5cc}
body.light .btn:hover{background:#f5f3ef;color:#1a1a1a;border-color:#c5c0b8}
body.dark .btn{background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.08)}
body.dark .btn:hover{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.15)}
.btn.on{background:rgba(52,211,153,.1)!important;border-color:rgba(52,211,153,.25)!important;color:#34d399!important}
.btn.mic-on{background:rgba(239,68,68,.15)!important;border-color:rgba(239,68,68,.3)!important;color:#ef4444!important;animation:micPulse 1.5s ease infinite}
.btn.var-nav{width:28px;height:28px;border-radius:50%;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
</style>
</head>
<body class="dark">
<div id="bgLayer" class="on">
  <canvas class="bg-canvas" id="canvasRings"></canvas>
  <canvas class="bg-canvas" id="canvasBars"></canvas>
</div>
<div id="ui">
  <h1 id="titleText">Sottotitoli</h1>
  <p>Live microphone — 20 visualizations</p>
  <div class="meter-row">
    <span class="meter-label" id="meterLabel">— dB</span>
    <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
  </div>
  <div class="btn-row">
    <button class="btn" id="btnMic" onclick="toggleMic()">&#127908; Start Mic</button>
    <button class="btn" id="btnDark" onclick="setTheme('dark')">&#127769; Dark</button>
    <button class="btn on" id="btnLight" onclick="setTheme('light')">&#9728;&#65039; Light</button>
    <button class="btn on" id="btnBoth" onclick="setMode('both')">Both</button>
    <button class="btn" id="btnRings" onclick="setMode('rings')">Rings</button>
    <button class="btn" id="btnBars" onclick="setMode('bars')">Bars</button>
  </div>
  <div class="btn-row">
    <button class="btn var-nav" onclick="prevVar()" title="Previous variation">&#8592;</button>
    <span class="var-label" id="varName">Rings 1/10 · Bars 1/10</span>
    <button class="btn var-nav" onclick="nextVar()" title="Next variation">&#8594;</button>
  </div>
</div>
<script>
var audioCtx=null,analyser=null,micStream=null,micOn=false;
var freqData=null,volume=0,smoothing=0;
var animFrame=null,currentMode='both',ringVar=0,barVar=0;
var canvasRings,canvasBars,ctxRings,ctxBars;
var W=window.innerWidth,H=window.innerHeight;
var t=0;

function initAudio(){
  if(audioCtx) return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=512;
  analyser.smoothingTimeConstant=0.65;
  freqData=new Uint8Array(analyser.frequencyBinCount);
}
function initCanvases(){
  canvasRings=document.getElementById('canvasRings');
  canvasBars=document.getElementById('canvasBars');
  ctxRings=canvasRings.getContext('2d');
  ctxBars=canvasBars.getContext('2d');
  resize();
}
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvasRings.width=W;canvasRings.height=H;
  canvasBars.width=W;canvasBars.height=H;
}
function toggleMic(){
  if(micOn){stopMic();return}
  initAudio();
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(s){
    micStream=s;var src=audioCtx.createMediaStreamSource(s);src.connect(analyser);
    micOn=true;document.getElementById('btnMic').textContent='\u23f9 Stop Mic';
    document.getElementById('btnMic').classList.add('mic-on');
    document.getElementById('bgLayer').classList.add('on');
    if(!animFrame) animate();
  }).catch(function(){startDemoMode()});
}
function stopMic(){
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}
  micOn=false;document.getElementById('btnMic').textContent='\uD83C\uDFA4 Start Mic';
  document.getElementById('btnMic').classList.remove('mic-on');
}
function startDemoMode(){
  micOn=true;document.getElementById('btnMic').textContent='\uD83C\uDFA4 Demo Mic';
  document.getElementById('btnMic').classList.add('mic-on');
  document.getElementById('bgLayer').classList.add('on');
  if(!animFrame) animate();
}
function readAudio(){
  if(!analyser) return;
  analyser.getByteFrequencyData(freqData);
  var sum=0;for(var i=0;i<freqData.length;i++) sum+=freqData[i];
  volume=sum/freqData.length/255;
  smoothing=smoothing*0.7+volume*0.3;
}

// ── Theme-aware color helpers ──
function c(h,s,l,a){
  return 'hsla('+h+','+s+'%,'+l+'%,'+a+')';
}
function themeHue(isDark){return isDark?250:215;}
function themeSat(isDark){return isDark?65:55;}
function themeLum(isDark,bright){return isDark?(bright?78:65):(bright?42:35);}
function themeAlpha(isDark,base){return isDark?base:base*0.7;}

// ══════════════════════════════════════
// 10 RING VARIATIONS
// ══════════════════════════════════════
var ringFuncs=[
  // 0: Concentric pulse
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark),sat=themeSat(isDark);
    for(var i=0;i<12;i++){
      var r=50+i*38+v*100*Math.sin(t/2000+i*0.4);
      var a=themeAlpha(isDark,0.5-v*0.2)*(1-i*0.06);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle=c((hue+i*22)%360,sat,themeLum(isDark,true),a);
      ctx.lineWidth=1+v*4;ctx.stroke();
    }
  },
  // 1: Orbiting frequency dots
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark),sat=themeSat(isDark);
    for(var i=0;i<48;i++){
      var fi=freqData&&micOn?freqData[i*2%freqData.length]/255:0.1+Math.sin(t/1500+i)*0.15;
      if(fi<0.03) continue;
      var angle=(i/48)*Math.PI*2+t/3000;
      var r=80+i*6+v*60;
      var x=cx+Math.cos(angle)*r,y=cy+Math.sin(angle)*r;
      ctx.beginPath();ctx.arc(x,y,1.5+fi*10,0,Math.PI*2);
      ctx.fillStyle=c((hue+i*8)%360,sat,themeLum(isDark,true),0.2+fi*0.6);
      ctx.fill();
    }
  },
  // 2: Spiral
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark)+t/50;
    ctx.beginPath();
    for(var i=0;i<360;i++){
      var a=i/180*Math.PI,r=30+i*1.8+v*200;
      var x=cx+Math.cos(a+t/2000)*r,y=cy+Math.sin(a+t/2000)*r;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=c(hue%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.4+v*0.3));
    ctx.lineWidth=1+v*3;ctx.stroke();
  },
  // 3: Ripple waves
  function(ctx,v,isDark){
    var hue=themeHue(isDark),sat=themeSat(isDark);
    for(var j=0;j<3;j++){
      var cx=W*(0.25+j*0.25),cy=H*(0.3+j*0.2);
      for(var i=0;i<6;i++){
        var r=20+i*45+v*80*Math.sin(t/1800+i+j);
        var a=themeAlpha(isDark,0.35-v*0.15)*(1-i*0.12);
        ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.strokeStyle=c((hue+j*70+i*20)%360,sat,themeLum(isDark,i%2===0),a);
        ctx.lineWidth=0.8+v*2.5;ctx.stroke();
      }
    }
  },
  // 4: Dashed rotating rings
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark);
    for(var i=0;i<8;i++){
      var r=55+i*48+v*70;
      var dashLen=15+v*20;var gapLen=8+v*10;
      ctx.setLineDash([dashLen,gapLen]);ctx.lineDashOffset=t/10+i*20;
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle=c((hue+i*30)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.5-i*0.04));
      ctx.lineWidth=2+v*2;ctx.stroke();
      ctx.setLineDash([]);
    }
  },
  // 5: Double-offset rings
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark);
    for(var i=0;i<8;i++){
      var r=50+i*48+v*80;
      var ox=Math.cos(t/2500+i)*v*30,oy=Math.sin(t/2500+i)*v*30;
      ctx.beginPath();ctx.arc(cx+ox,cy+oy,r,0,Math.PI*2);
      ctx.strokeStyle=c((hue+i*25)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.45));
      ctx.lineWidth=1.5+v*2.5;ctx.stroke();
      ctx.beginPath();ctx.arc(cx-ox,cy-oy,r*0.7,0,Math.PI*2);
      ctx.strokeStyle=c((hue+180+i*25)%360,themeSat(isDark),themeLum(isDark,false),themeAlpha(isDark,0.3));
      ctx.lineWidth=0.8+v*1.5;ctx.stroke();
    }
  },
  // 6: Rotating clusters
  function(ctx,v,isDark){
    var hue=themeHue(isDark);
    for(var c=0;c<5;c++){
      var cx=W/2+Math.cos(t/3000+c*1.2)*W*0.25;
      var cy=H/2+Math.sin(t/3000+c*1.2)*H*0.25;
      for(var i=0;i<5;i++){
        var r=15+i*22+v*50;
        ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.strokeStyle=c((hue+c*50+i*15)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.4-i*0.05));
        ctx.lineWidth=1+v*2;ctx.stroke();
      }
    }
  },
  // 7: Breathing rings
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark);
    var breath=Math.sin(t/3000)*0.5+0.5;
    for(var i=0;i<10;i++){
      var phase=(t/2000+i*0.3)%(Math.PI*2);
      var r=30+i*40+v*60*(0.6+0.4*Math.sin(phase));
      var a=themeAlpha(isDark,(0.15+0.35*Math.sin(phase))*0.8);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle=c((hue+i*28)%360,themeSat(isDark),themeLum(isDark,true),a);
      ctx.fill();
    }
  },
  // 8: Wavy/distorted
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,hue=themeHue(isDark);
    for(var i=0;i<8;i++){
      var baseR=50+i*48+v*60;
      ctx.beginPath();
      for(var a=0;a<Math.PI*2;a+=0.05){
        var wave=1+Math.sin(a*5+t/1000+i)*v*0.4;
        var r=baseR*wave;
        var x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
        if(a===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.closePath();
      ctx.strokeStyle=c((hue+i*20)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.5-i*0.05));
      ctx.lineWidth=1+v*2;ctx.stroke();
    }
  },
  // 9: Multi-center burst
  function(ctx,v,isDark){
    var hue=themeHue(isDark);
    var centers=[[0.3,0.3],[0.7,0.3],[0.5,0.5],[0.3,0.7],[0.7,0.7]];
    centers.forEach(function(ctr,ci){
      var cx=W*ctr[0],cy=H*ctr[1];
      for(var i=0;i<6;i++){
        var r=10+i*30+v*70;
        var a=themeAlpha(isDark,0.35-i*0.04)*(0.5+v*0.5);
        ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.strokeStyle=c((hue+ci*40+i*20)%360,themeSat(isDark),themeLum(isDark,i%2===0),a);
        ctx.lineWidth=0.8+v*2;ctx.stroke();
      }
    });
  }
];

// ══════════════════════════════════════
// 10 BAR VARIATIONS
// ══════════════════════════════════════
var barFuncs=[
  // 0: Standard spectrum (bottom-up)
  function(ctx,v,isDark){
    var n=80,gap=2,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    for(var i=0;i<n;i++){
      var hgt=15;
      if(freqData&&micOn){var fi=freqData[Math.floor(i*freqData.length/n)]/255;hgt=Math.max(2,fi*H*0.75)}
      else{hgt=Math.max(2,(Math.sin(i*0.3+t/1200)*0.5+0.5)*H*0.45*v*5)}
      var x=gap+i*(w+gap);
      var g=ctx.createLinearGradient(x,H,x,H-hgt);
      g.addColorStop(0,c((hue+i*3)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.7)));
      g.addColorStop(1,c((hue+i*3)%360,themeSat(isDark),themeLum(isDark,false),themeAlpha(isDark,0.15)));
      ctx.fillStyle=g;ctx.fillRect(x,H-hgt,w,hgt);
      if(hgt>30)ctx.fillStyle=c((hue+i*3)%360,80,themeLum(isDark,true),themeAlpha(isDark,0.5));
      ctx.fillRect(x,H-hgt,w,Math.min(4,hgt*0.1));
    }
  },
  // 1: Mirror bars (top+bottom)
  function(ctx,v,isDark){
    var n=64,gap=2,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    for(var i=0;i<n;i++){
      var hgt=15;
      if(freqData&&micOn){hgt=Math.max(2,freqData[Math.floor(i*freqData.length/n)]/255*H*0.35)}
      else{hgt=Math.max(2,(Math.sin(i*0.35+t/1300)*0.5+0.5)*H*0.25*v*4)}
      var x=gap+i*(w+gap);
      var g=ctx.createLinearGradient(x,0,x,H);
      g.addColorStop(0,c((hue+i*4)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.6)));
      g.addColorStop(0.5,c((hue+i*4)%360,themeSat(isDark),themeLum(isDark,false),themeAlpha(isDark,0.05)));
      g.addColorStop(1,c((hue+180+i*4)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.6)));
      ctx.fillStyle=g;ctx.fillRect(x,H/2-hgt,w,hgt*2);
    }
  },
  // 2: Center-out bars
  function(ctx,v,isDark){
    var n=80,gap=1,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    for(var i=0;i<n;i++){
      var hgt=15;
      if(freqData&&micOn){hgt=Math.max(2,freqData[Math.floor(i*freqData.length/n)]/255*H*0.4)}
      else{hgt=Math.max(2,(Math.sin(i*0.28+t/1400)*0.5+0.5)*H*0.3*v*4)}
      var x=gap+i*(w+gap);
      var bright=i%3===0;
      ctx.fillStyle=c((hue+i*3.5)%360,themeSat(isDark),themeLum(isDark,bright),themeAlpha(isDark,0.6));
      ctx.fillRect(x,H/2-hgt,w,hgt*2);
      if(hgt>20)ctx.fillStyle=c((hue+i*3.5)%360,80,themeLum(isDark,true),themeAlpha(isDark,0.4));
      ctx.fillRect(x,H/2-1,w,2);
    }
  },
  // 3: Radial bars (circular histogram)
  function(ctx,v,isDark){
    var cx=W/2,cy=H/2,n=72,hue=themeHue(isDark);
    var maxR=Math.min(W,H)*0.42;
    for(var i=0;i<n;i++){
      var hgt=10;
      if(freqData&&micOn){hgt=Math.max(2,freqData[Math.floor(i*freqData.length/n)]/255*maxR*0.8)}
      else{hgt=Math.max(2,(Math.sin(i*0.4+t/1500)*0.5+0.5)*maxR*0.5*v*3)}
      var angle=(i/n)*Math.PI*2-t/5000;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
      var g=ctx.createLinearGradient(0,0,0,-hgt);
      g.addColorStop(0,c((hue+i*5)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.7)));
      g.addColorStop(1,c((hue+i*5)%360,themeSat(isDark),themeLum(isDark,false),themeAlpha(isDark,0.1)));
      ctx.fillStyle=g;ctx.fillRect(-1.5,0,3,-hgt);
      ctx.restore();
    }
  },
  // 4: Waterfall columns
  function(ctx,v,isDark){
    var n=50,gap=4,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    for(var i=0;i<n;i++){
      var hgt=10;
      if(freqData&&micOn){hgt=Math.max(2,freqData[Math.floor(i*freqData.length/n)]/255*H*0.6)}
      else{hgt=Math.max(2,(Math.cos(i*0.35+t/1000)*0.5+0.5)*H*0.4*v*3)}
      var x=gap+i*(w+gap);
      for(var j=0;j<5;j++){
        var yOff=j*(hgt/5);
        var a=themeAlpha(isDark,0.5-j*0.08);
        ctx.fillStyle=c((hue+i*4+j*10)%360,themeSat(isDark),themeLum(isDark,j<2),a);
        ctx.fillRect(x,H-yOff-hgt/5,w,hgt/5+1);
      }
    }
  },
  // 5: Glow bars
  function(ctx,v,isDark){
    var n=60,gap=3,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    for(var i=0;i<n;i++){
      var hgt=10;
      if(freqData&&micOn){hgt=Math.max(2,freqData[Math.floor(i*freqData.length/n)]/255*H*0.65)}
      else{hgt=Math.max(2,(Math.sin(i*0.3+t/1100)*0.5+0.5)*H*0.4*v*4)}
      var x=gap+i*(w+gap);
      // Glow
      var glow=c((hue+i*4)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.2));
      ctx.shadowColor=glow;ctx.shadowBlur=12+v*20;
      ctx.fillStyle=c((hue+i*4)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.7));
      ctx.fillRect(x,H-hgt,w,hgt);
      ctx.shadowBlur=0;
    }
  },
  // 6: Stepped pixel bars
  function(ctx,v,isDark){
    var n=48,stepH=Math.max(4,H/80),gap=3,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    for(var i=0;i<n;i++){
      var hgt=10;
      if(freqData&&micOn){hgt=Math.max(stepH,freqData[Math.floor(i*freqData.length/n)]/255*H*0.6)}
      else{hgt=Math.max(stepH,(Math.sin(i*0.32+t/1250)*0.5+0.5)*H*0.4*v*4)}
      var steps=Math.floor(hgt/stepH);
      var x=gap+i*(w+gap);
      for(var s=0;s<steps;s++){
        var a=themeAlpha(isDark,0.3+s*0.06);
        ctx.fillStyle=c((hue+i*5+s*8)%360,themeSat(isDark),themeLum(isDark,s<3),a);
        ctx.fillRect(x,H-(s+1)*stepH,w,stepH-1);
      }
    }
  },
  // 7: Curved/arc bars
  function(ctx,v,isDark){
    var n=64,hue=themeHue(isDark);
    for(var i=0;i<n;i++){
      var hgt=10;
      if(freqData&&micOn){hgt=Math.max(2,freqData[Math.floor(i*freqData.length/n)]/255*H*0.35)}
      else{hgt=Math.max(2,(Math.sin(i*0.3+t/1350)*0.5+0.5)*H*0.25*v*4)}
      var x=i*(W/n);
      ctx.beginPath();
      ctx.moveTo(x,H);
      ctx.quadraticCurveTo(x+W/n/2,H-hgt*1.5,x+W/n,H);
      ctx.fillStyle=c((hue+i*4.5)%360,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.5));
      ctx.fill();
    }
  },
  // 8: Particle bars
  function(ctx,v,isDark){
    var n=50,gap=6,w=(W-gap*(n+1))/n,hue=themeHue(isDark);
    for(var i=0;i<n;i++){
      var hgt=10;
      if(freqData&&micOn){hgt=Math.max(4,freqData[Math.floor(i*freqData.length/n)]/255*H*0.55)}
      else{hgt=Math.max(4,(Math.sin(i*0.33+t/1150)*0.5+0.5)*H*0.35*v*4)}
      var x=gap+i*(w+gap);
      var particles=Math.floor(hgt/5);
      for(var p=0;p<particles;p++){
        var py=H-p*5-(t*0.2+i*7)%8;
        var pr=1.5+Math.random()*2;
        ctx.beginPath();ctx.arc(x+w/2,py,pr,0,Math.PI*2);
        ctx.fillStyle=c((hue+i*5+p*10)%360,themeSat(isDark),themeLum(isDark,p<3),themeAlpha(isDark,0.4+v*0.3));
        ctx.fill();
      }
    }
  },
  // 9: Waveform smooth curve
  function(ctx,v,isDark){
    var hue=themeHue(isDark);
    ctx.beginPath();
    ctx.moveTo(0,H/2);
    for(var i=0;i<=W;i+=3){
      var idx=Math.floor(i/W*(freqData?freqData.length:128));
      var fi=freqData&&micOn?freqData[idx%freqData.length]/255:0.15+Math.sin(i*0.02+t/1000)*0.3;
      var y=H/2-fi*H*0.4*v*3;
      ctx.lineTo(i,y);
    }
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,c(hue,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.25)));
    g.addColorStop(1,c(hue+60,themeSat(isDark),themeLum(isDark,false),themeAlpha(isDark,0.05)));
    ctx.fillStyle=g;ctx.fill();
    // Top line
    ctx.beginPath();ctx.moveTo(0,H/2);
    for(var i=0;i<=W;i+=3){
      var idx=Math.floor(i/W*(freqData?freqData.length:128));
      var fi=freqData&&micOn?freqData[idx%freqData.length]/255:0.15+Math.sin(i*0.02+t/1000)*0.3;
      ctx.lineTo(i,H/2-fi*H*0.4*v*3);
    }
    ctx.strokeStyle=c(hue,themeSat(isDark),themeLum(isDark,true),themeAlpha(isDark,0.6+v*0.3));
    ctx.lineWidth=1.5+v*2;ctx.stroke();
  }
];

// ── Animation loop ──
function animate(ts){
  animFrame=requestAnimationFrame(animate);
  t=ts||Date.now();
  if(micOn){readAudio();}else{
    smoothing=smoothing*0.95+0.02;
    volume=0.06+Math.sin(t/1800)*0.04+Math.sin(t/3200)*0.03+Math.sin(t/5100)*0.02;
  }
  var v=smoothing||volume;
  var isDark=document.body.classList.contains('dark');

  ctxRings.clearRect(0,0,W,H);
  ctxBars.clearRect(0,0,W,H);

  if(currentMode==='both'||currentMode==='rings') ringFuncs[ringVar](ctxRings,v,isDark);
  if(currentMode==='both'||currentMode==='bars') barFuncs[barVar](ctxBars,v,isDark);

  document.getElementById('meterFill').style.width=(v*100)+'%';
  document.getElementById('meterLabel').textContent=Math.round(v*100-50)+' dB';
}

// ── Controls ──
function setTheme(t){
  document.body.className=t;
  document.getElementById('btnDark').className='btn'+(t==='dark'?' on':'');
  document.getElementById('btnLight').className='btn'+(t==='light'?' on':'');
  document.getElementById('titleText').style.color=t==='dark'?'#e8eaed':'#1a1a1a';
}
function setMode(m){
  currentMode=m;
  document.getElementById('btnBoth').classList.toggle('on',m==='both');
  document.getElementById('btnRings').classList.toggle('on',m==='rings');
  document.getElementById('btnBars').classList.toggle('on',m==='bars');
  updateVarLabel();
}
function nextVar(){
  if(currentMode==='both'||currentMode==='rings') ringVar=(ringVar+1)%10;
  if(currentMode==='both'||currentMode==='bars') barVar=(barVar+1)%10;
  updateVarLabel();
}
function prevVar(){
  if(currentMode==='both'||currentMode==='rings') ringVar=(ringVar+9)%10;
  if(currentMode==='both'||currentMode==='bars') barVar=(barVar+9)%10;
  updateVarLabel();
}
function updateVarLabel(){
  var names=['Concentric','Orbiting','Spiral','Ripple','Dashed','Double','Cluster','Breathing','Wavy','Burst'];
  var bnames=['Spectrum','Mirror','Center-out','Radial','Waterfall','Glow','Stepped','Arcs','Particles','Waveform'];
  var rn=currentMode==='bars'?'—':names[ringVar]+' '+(ringVar+1)+'/10';
  var bn=currentMode==='rings'?'—':bnames[barVar]+' '+(barVar+1)+'/10';
  document.getElementById('varName').textContent='Rings: '+rn+'  |  Bars: '+bn;
}

// ── Init ──
initCanvases();
window.addEventListener('resize',resize);
updateVarLabel();
animate();
setTimeout(function(){if(!micOn) startDemoMode();},600);
</script>
