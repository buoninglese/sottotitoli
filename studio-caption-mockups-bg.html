<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Live Mic BG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh;position:relative;transition:background .5s}
body.light{background:#fafaf8;color:#111}
body.dark{background:#060610;color:#e8eaed}

#bgLayer{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .6s}
#bgLayer.on{opacity:1}
body.light #bgLayer.on{opacity:.85}

/* Canvas layers */
.bg-canvas{position:absolute;inset:0;width:100%;height:100%}

#ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:12px;padding:40px}
#ui h1{font-size:clamp(28px,5vw,56px);font-weight:900;letter-spacing:-1.5px;transition:color .5s}
#ui p{font-size:13px;opacity:.5;max-width:400px;text-align:center;line-height:1.6;transition:color .5s}
.meter-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.meter-bar{width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.meter-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa);transition:width .1s;width:0%}
.meter-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.25);min-width:48px}
body.light .meter-bar{background:rgba(0,0,0,.06)}
body.light .meter-label{color:rgba(0,0,0,.25)}

.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 20px;border-radius:100px;border:1.5px solid;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s}
body.light .btn{background:#fff;color:#555;border-color:#d9d5cc}
body.light .btn:hover{background:#f5f3ef;color:#1a1a1a}
body.dark .btn{background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.08)}
body.dark .btn:hover{background:rgba(255,255,255,.06);color:#fff}
.btn.on{background:rgba(52,211,153,.1)!important;border-color:rgba(52,211,153,.25)!important;color:#34d399!important}
.btn.mic-on{background:rgba(239,68,68,.15)!important;border-color:rgba(239,68,68,.3)!important;color:#ef4444!important;animation:micPulse 1.5s ease infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
</style>
</head>
<body class="dark">
<div id="bgLayer" class="on">
  <canvas class="bg-canvas" id="canvasRings"></canvas>
  <canvas class="bg-canvas" id="canvasDots"></canvas>
  <canvas class="bg-canvas" id="canvasBars"></canvas>
</div>
<div id="ui">
  <h1 id="titleText">Sottotitoli</h1>
  <p>Live microphone background — speak and watch</p>
  <div class="meter-row">
    <span class="meter-label" id="meterLabel">— dB</span>
    <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
  </div>
  <div class="btn-row">
    <button class="btn" id="btnMic" onclick="toggleMic()">🎤 Start Mic</button>
    <button class="btn" id="btnDark" onclick="setTheme('dark')">🌙 Dark</button>
    <button class="btn on" id="btnLight" onclick="setTheme('light')">☀️ Light</button>
    <button class="btn" onclick="setMode('rings')">Rings</button>
    <button class="btn" onclick="setMode('dots')">Dots</button>
    <button class="btn" onclick="setMode('bars')">Bars</button>
    <button class="btn on" id="btnAll" onclick="setMode('all')">All</button>
  </div>
</div>
<script>
// ── Audio setup ──
var audioCtx=null,analyser=null,micStream=null,micOn=false;
var freqData=null,volume=0,smoothing=0;
var animFrame=null;
var currentMode='all';

var canvasRings,canvasDots,canvasBars,ctxRings,ctxDots,ctxBars;
var W=window.innerWidth,H=window.innerHeight;
var dots=[],particles=[];

function initAudio(){
  if(audioCtx) return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=256;
  analyser.smoothingTimeConstant=0.7;
  freqData=new Uint8Array(analyser.frequencyBinCount);
}

function initCanvases(){
  canvasRings=document.getElementById('canvasRings');
  canvasDots=document.getElementById('canvasDots');
  canvasBars=document.getElementById('canvasBars');
  ctxRings=canvasRings.getContext('2d');
  ctxDots=canvasDots.getContext('2d');
  ctxBars=canvasBars.getContext('2d');
  resize();
  
  // Pre-create dots
  for(var i=0;i<160;i++){
    dots.push({x:Math.random()*W,y:Math.random()*H,r:2+Math.random()*8,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,phase:Math.random()*Math.PI*2,color:'hsl('+(180+Math.random()*120)+',60%,'+(40+Math.random()*30)+'%)'});
  }
}

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  [canvasRings,canvasDots,canvasBars].forEach(function(c){
    c.width=W;c.height=H;
  });
}

// ── Mic ──
function toggleMic(){
  if(micOn){stopMic();return}
  initAudio();
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(stream){
    micStream=stream;
    var src=audioCtx.createMediaStreamSource(stream);
    src.connect(analyser);
    micOn=true;
    document.getElementById('btnMic').textContent='⏹ Stop Mic';
    document.getElementById('btnMic').classList.add('mic-on');
    document.getElementById('bgLayer').classList.add('on');
    if(!animFrame) animate();
  }).catch(function(err){
    console.log('Mic denied, using demo mode');
    startDemoMode();
  });
}

function stopMic(){
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}
  micOn=false;
  document.getElementById('btnMic').textContent='🎤 Start Mic';
  document.getElementById('btnMic').classList.remove('mic-on');
}

function startDemoMode(){
  // Simulate audio with oscillating volume
  micOn=true;
  document.getElementById('btnMic').textContent='🎤 Demo Mic';
  document.getElementById('btnMic').classList.add('mic-on');
  document.getElementById('bgLayer').classList.add('on');
  if(!animFrame) animate();
}

function readAudio(){
  if(!analyser) return;
  analyser.getByteFrequencyData(freqData);
  // Calculate volume from frequency data
  var sum=0;
  for(var i=0;i<freqData.length;i++) sum+=freqData[i];
  volume=sum/freqData.length/255;
  // Smooth it
  smoothing=smoothing*0.7+volume*0.3;
}

// ── Animation ──
function animate(ts){
  animFrame=requestAnimationFrame(animate);
  
  if(micOn){
    readAudio();
  } else {
    // Demo pulse when mic off
    var t=ts||Date.now();
    smoothing=smoothing*0.95+0.02;
    volume=0.08+Math.sin(t/2000)*0.04+Math.sin(t/3700)*0.03;
  }
  
  var v=smoothing||volume;
  var isDark=document.body.classList.contains('dark');
  
  // Clear all
  ctxRings.clearRect(0,0,W,H);
  ctxDots.clearRect(0,0,W,H);
  ctxBars.clearRect(0,0,W,H);
  
  if(currentMode==='all'||currentMode==='rings') drawRings(v,isDark);
  if(currentMode==='all'||currentMode==='dots') drawDots(v,isDark);
  if(currentMode==='all'||currentMode==='bars') drawBars(v,isDark);
  
  // Update meter
  document.getElementById('meterFill').style.width=(v*100)+'%';
  document.getElementById('meterLabel').textContent=Math.round(v*100-50)+' dB';
}

// ── Rings — concentric circles that pulse with volume ──
function drawRings(v,isDark){
  var cx=W/2,cy=H/2;
  var alpha=isDark?0.5:0.35;
  var baseHue=isDark?260:220;
  
  for(var i=0;i<8;i++){
    var r=60+i*50+v*120;
    var hue=(baseHue+i*25)%360;
    var a=alpha*(0.6+v*0.4)*(1-i*0.08);
    ctxRings.beginPath();
    ctxRings.arc(cx,cy,r,0,Math.PI*2);
    ctxRings.strokeStyle='hsla('+hue+',70%,'+(isDark?70:45)+'%,'+a+')';
    ctxRings.lineWidth=1.5+v*3;
    ctxRings.stroke();
    
    // Second ring offset
    ctxRings.beginPath();
    ctxRings.arc(cx,cy,r+v*30,0,Math.PI*2);
    ctxRings.strokeStyle='hsla('+(hue+180)%360+',60%,'+(isDark?75:50)+'%,'+(a*0.5)+')';
    ctxRings.lineWidth=1+v*2;
    ctxRings.stroke();
  }
  
  // Frequency dots on rings
  if(freqData && micOn){
    for(var i=0;i<32;i++){
      var fi=freqData[i*2]/255;
      if(fi<0.05) continue;
      var angle=(i/32)*Math.PI*2;
      var ringR=100+i*15+v*80;
      var x=cx+Math.cos(angle)*ringR;
      var y=cy+Math.sin(angle)*ringR;
      ctxRings.beginPath();
      ctxRings.arc(x,y,2+fi*8,0,Math.PI*2);
      ctxRings.fillStyle='hsla('+(baseHue+i*10)%360+',80%,'+(isDark?75:50)+'%,'+(0.3+fi*0.5)+')';
      ctxRings.fill();
    }
  }
}

// ── Dots — floating particles that move and pulse ──
function drawDots(v,isDark){
  var alpha=isDark?0.7:0.45;
  
  dots.forEach(function(d){
    // Move slowly
    d.x+=d.vx;d.y+=d.vy;
    if(d.x<0)d.x=W;if(d.x>W)d.x=0;
    if(d.y<0)d.y=H;if(d.y>H)d.y=0;
    
    // Pulse with volume
    var pulse=1+v*3*Math.sin(Date.now()/800+d.phase);
    var r=Math.max(1,d.r*pulse);
    var a=alpha*(0.3+v*0.7);
    
    ctxDots.beginPath();
    ctxDots.arc(d.x,d.y,r,0,Math.PI*2);
    ctxDots.fillStyle=d.color.replace('%)',','+a+')').replace('hsl','hsla');
    ctxDots.fill();
    
    // Glow
    if(v>0.15){
      ctxDots.beginPath();
      ctxDots.arc(d.x,d.y,r*1.8,0,Math.PI*2);
      ctxDots.fillStyle=d.color.replace('%)',','+(a*0.15)+')').replace('hsl','hsla');
      ctxDots.fill();
    }
  });
}

// ── Bars — frequency spectrum bars across screen ──
function drawBars(v,isDark){
  var barCount=64;
  var barW=(W/barCount)*0.8;
  var gap=(W/barCount)*0.2;
  var alpha=isDark?0.8:0.5;
  
  for(var i=0;i<barCount;i++){
    var h=20;
    if(freqData&&micOn){
      var fi=freqData[Math.floor(i*freqData.length/barCount)]/255;
      h=Math.max(3,fi*H*0.7);
    } else {
      // Demo: sine wave
      h=Math.max(3,(Math.sin(i*0.25+Date.now()/1500)*0.5+0.5)*H*0.4*v*5);
    }
    
    var hue=(260+i*3)%360;
    var x=i*(barW+gap);
    var grad=ctxBars.createLinearGradient(x,0,x,H);
    grad.addColorStop(0,'hsla('+hue+',70%,'+(isDark?75:50)+'%,'+alpha+')');
    grad.addColorStop(1,'hsla('+hue+',70%,'+(isDark?65:40)+'%,'+(alpha*0.2)+')');
    
    ctxBars.fillStyle=grad;
    ctxBars.fillRect(x,H-h,barW,h);
    
    // Top glow
    if(h>20){
      ctxBars.fillStyle='hsla('+hue+',80%,'+(isDark?85:60)+'%,'+(alpha*0.6)+')';
      ctxBars.fillRect(x,H-h,barW,Math.min(6,h*0.15));
    }
  }
}

// ── Theme ──
function setTheme(t){
  document.body.className=t;
  document.getElementById('btnDark').className='btn'+(t==='dark'?' on':'');
  document.getElementById('btnLight').className='btn'+(t==='light'?' on':'');
  document.getElementById('titleText').style.color=t==='dark'?'#e8eaed':'#1a1a1a';
}

// ── Mode ──
function setMode(m){
  currentMode=m;
  document.querySelectorAll('#ui .btn').forEach(function(b){b.classList.remove('on')});
  var mb=document.querySelector('#ui .btn[onclick*="'+m+'"]');
  if(mb)mb.classList.add('on');
  if(m==='all')document.getElementById('btnAll').classList.add('on');
}

// ── Init ──
initCanvases();
window.addEventListener('resize',resize);
setMode('all');
animate();

// Start demo immediately so something is visible
setTimeout(function(){
  if(!micOn) startDemoMode();
},500);
</script>
</body>
</html>
