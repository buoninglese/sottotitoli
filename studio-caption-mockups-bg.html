<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · Live Speech BG</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh;position:relative;transition:background .5s}body.light{background:#fefefe;color:#111}body.dark{background:#060610;color:#e8eaed}#bgLayer{position:fixed;inset:0;z-index:0;filter:blur(16px);opacity:0;transition:opacity .8s}#bgLayer.on{opacity:.65}body.light #bgLayer.on{opacity:.55}body.dark #bgLayer.on{opacity:.7}#ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;padding:40px}#ui h1{font-size:clamp(28px,5vw,56px);font-weight:900;letter-spacing:-1.5px;transition:color .5s}#ui p{font-size:14px;opacity:.5;max-width:400px;text-align:center;line-height:1.6;transition:color .5s}.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.btn{padding:10px 20px;border-radius:100px;border:1.5px solid;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s}body.light .btn{background:#fff;color:#555;border-color:#d9d5cc}body.light .btn:hover{background:#f5f3ef;color:#1a1a1a}body.dark .btn{background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.08)}body.dark .btn:hover{background:rgba(255,255,255,.06);color:#fff}.btn.on{background:rgba(52,211,153,.1)!important;border-color:rgba(52,211,153,.25)!important;color:#34d399!important}@keyframes barDanceSlow{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(.8)}}@keyframes dotPulseSlow{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.35;transform:translateY(-10px)}}@keyframes waterfallSlow{0%{transform:translateY(-100%);opacity:0}30%{opacity:.5}100%{transform:translateY(100%);opacity:0}}</style></head><body class="light"><div id="bgLayer"></div><div id="ui"><h1 id="titleText">Sottotitoli</h1><p>Live speech ambient background — waves react to voice in slow motion</p><div class="btn-row"><button class="btn on" id="btnDemo" onclick="toggleDemo()">▶ Demo Speech</button><button class="btn" id="btnDark" onclick="setTheme('dark')">🌙 Dark</button><button class="btn on" id="btnLight" onclick="setTheme('light')">☀️ Light</button><button class="btn" onclick="setMode('waterfall')">Waterfall</button><button class="btn" onclick="setMode('dots')">Dots</button><button class="btn" onclick="setMode('bars')">Bars</button><button class="btn on" id="btnAll" onclick="setMode('all')">All</button></div></div><script>
function hsl(h,s,l,a){return a!==undefined?`hsla(${h},${s}%,${l}%,${a})`:`hsl(${h},${s}%,${l}%)`}function audioBars(n){return Array.from({length:n},(_,i)=>{var b=Math.sin(i*.7)*.4+.5;var n=(Math.sin(i*2.3+1.7)*.25)+(Math.cos(i*1.1)*.2);return Math.max(.06,Math.min(1,b+n))})}
var demoRunning=false,demoTimer=null,currentMode='all',bgLayer=document.getElementById('bgLayer');

function buildBG(mode){
  var h='';var isDark=document.body.classList.contains('dark');var lum=isDark?60:30;var sat=isDark?45:65;
  if(mode==='all'||mode==='waterfall'){h+='<div style="position:absolute;left:3%;top:0;width:30%;height:100%;overflow:hidden">';for(var i=0;i<50;i++){h+=`<div style="position:absolute;left:${i*2}%;top:0;width:2px;height:${30+Math.random()*70}px;background:${hsl(200+Math.random()*30,sat,lum)};animation:waterfallSlow ${3+Math.random()*5}s linear infinite;animation-delay:${Math.random()*3}s"></div>`}h+='</div>'}
  if(mode==='all'||mode==='dots'){h+='<div style="position:absolute;left:20%;top:0;width:60%;height:100%">';for(var i=0;i<80;i++){var x=Math.random()*100;var y=Math.random()*100;var s=4+Math.random()*10;h+=`<div style="position:absolute;left:${x}%;top:${y}%;width:${s}px;height:${s}px;border-radius:50%;background:${hsl(180+Math.random()*120,sat,lum)};animation:dotPulseSlow ${2+Math.random()*3}s ease infinite;animation-delay:${Math.random()*2}s;box-shadow:0 0 ${s*3}px ${hsl(180+Math.random()*120,sat,lum,.3)}"></div>`}h+='</div>'}
  if(mode==='all'||mode==='bars'){h+='<div style="position:absolute;right:5%;top:5%;width:20%;height:90%;display:flex;align-items:center;justify-content:center;gap:2px">';var bars=audioBars(16);bars.forEach((v,i)=>{h+=`<div style="display:flex;flex-direction:column;align-items:center;gap:1px;height:100%;justify-content:center"><div style="width:5px;height:${v*60}px;background:${hsl(280+i*6,sat,lum)};border-radius:3px;animation:barDanceSlow ${1.3+i*.08}s ease infinite;animation-delay:${i*.04}s"></div><div style="width:5px;height:${v*60}px;background:${hsl(280+i*5,sat,lum,.6)};border-radius:3px;animation:barDanceSlow ${1.3+i*.08}s ease infinite;animation-delay:${i*.04}s"></div></div>`});h+='</div>'}
  bgLayer.innerHTML=h;
}

function toggleDemo(){demoRunning=!demoRunning;var btn=document.getElementById('btnDemo');btn.className='btn'+(demoRunning?' on':'');btn.textContent=demoRunning?'⏹ Stop':'▶ Demo Speech';bgLayer.classList.toggle('on',demoRunning);if(demoRunning){if(!bgLayer.innerHTML)buildBG(currentMode);demoTimer=setInterval(function(){if(!demoRunning)return;bgLayer.style.opacity=(.25+Math.random()*.25);setTimeout(function(){if(demoRunning)bgLayer.style.opacity=''},300+Math.random()*500)},1200)}else{if(demoTimer){clearInterval(demoTimer);demoTimer=null}bgLayer.style.opacity=''}}

function setTheme(t){document.body.className=t;var btnD=document.getElementById('btnDark');var btnL=document.getElementById('btnLight');btnD.className='btn'+(t==='dark'?' on':'');btnL.className='btn'+(t==='light'?' on':'');document.getElementById('titleText').style.color=t==='dark'?'#e8eaed':'#1a1a1a';if(demoRunning)buildBG(currentMode)}

function setMode(m){currentMode=m;document.querySelectorAll('#ui .btn').forEach(function(b){if(['waterfall','dots','bars','all'].indexOf(b.textContent.toLowerCase())>=0||b.id==='btnAll')b.classList.remove('on')});if(m==='all')document.getElementById('btnAll').classList.add('on');if(demoRunning)buildBG(m)}

buildBG('all');bgLayer.classList.add('on');
</script></body></html>
