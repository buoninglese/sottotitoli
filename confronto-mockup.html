<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Confronto · 30 Redesigns</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d14;--bg2:#12151e;--card:#161922;--line:#232836;--text:#e8eaed;--t2:#c4c9d4;--t3:#5f6b7a;--accent:#a78bfa;--green:#34d399;--blue:#60a5fa;--amber:#fbbf24;--pink:#f472b6;--red:#f87171}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:24px}
h1{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
h1 em{color:var(--accent);font-style:normal}
.sub{font-size:13px;color:var(--t2);margin-bottom:20px}
.back{display:inline-block;margin-bottom:18px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:500}
.back:hover{text-decoration:underline}
.layout{display:flex;gap:16px;align-items:flex-start}
@media(max-width:860px){.layout{flex-direction:column}}
.nav-col{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;position:sticky;top:24px;max-height:80vh;overflow-y:auto}
@media(max-width:860px){.nav-col{width:100%;position:static;flex-direction:row;flex-wrap:wrap;max-height:none}}
.nav-btn{padding:7px 12px;border-radius:8px;font-size:10px;font-weight:500;border:1px solid transparent;background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;text-align:left;transition:all .12s}
.nav-btn:hover{background:var(--card);color:var(--text)}
.nav-btn.active{background:var(--card);border-color:var(--line);color:var(--text);font-weight:600}
.nav-btn .n{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);margin-right:4px}
.nav-section{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);padding:8px 4px 2px}
.preview-area{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.preview-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;overflow:hidden;transition:all .3s}
.preview-card:hover{border-color:rgba(167,139,250,.2);box-shadow:0 6px 24px rgba(0,0,0,.3);transform:translateY(-1px)}
.preview-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--accent),transparent 70%);opacity:.04;pointer-events:none;border-radius:10px}
.preview-card .prop-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);font-weight:700;margin-bottom:10px}
.card-h3{font-size:18px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.chip-row{display:flex;gap:4px}
.chip{padding:6px 14px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:500px){.g3,.g2{grid-template-columns:1fr}}
.mono{font-family:'JetBrains Mono',monospace}
.bar-h{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar-f{height:100%;border-radius:3px;transition:width .8s}
.stat-box{background:var(--bg2);border-radius:10px;padding:16px;text-align:center;transition:all .3s;border:1px solid transparent}
.stat-box:hover{border-color:var(--line);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.stat-box .big{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1;margin-bottom:4px}
.stat-box .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--t3)}
.stat-box .delta{font-size:11px;font-weight:600;margin-top:4px;display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:100px}
.delta-up{background:rgba(52,211,153,.1);color:var(--green)}
.delta-down{background:rgba(248,113,113,.1);color:var(--red)}
</style>
</head>
<body>
<a href="account.html" class="back">← Back to Account</a>
<h1>Confronto <em>Redesigns</em></h1>
<p class="sub">30 proposals — 10 each for #1·3-Column, #4·Sparkline, #5·Table. Hover cards for depth.</p>
<div class="layout">
  <div class="nav-col" id="navCol"></div>
  <div class="preview-area" id="previewArea"></div>
</div>
<script>
// ═══ DATA ═══
var D={sessions:{val:187,prev:167,delta:12,up:true},talk:{val:'42h',prev:'39h',delta:8,up:true},words:{val:'12.4k',prev:'12.8k',delta:3,up:false}};

function delta(d){return'<span class="delta '+(d.up?'delta-up':'delta-down')+'">'+(d.up?'↑':'↓')+' '+d.delta+'%</span>';}

function card3Col(n,twist){
  return '<span class="prop-num">#'+n+' · 3-Column '+twist+'</span><div class="card-h3">📊 Confronto <span style="font-weight:400;font-size:11px;color:var(--t3);margin-left:auto"><span class="chip active">Mese</span><span class="chip">Settimana</span></span></div><div class="g3">'+['Sessioni','Tempo parlato','Parole uniche'].map(function(l,i){var d=[D.sessions,D.talk,D.words][i];return '<div class="stat-box"><div class="big" style="color:'+['var(--accent)','var(--green)','var(--blue)'][i]+'">'+d.val+'</div><div class="lbl">'+l+'</div>'+delta(d)+'</div>';}).join('')+'</div>';
}

function cardSpark(n,twist){
  return '<span class="prop-num">#'+n+' · Sparkline '+twist+'</span><div class="card-h3">📊 Confronto <span style="font-weight:400;font-size:11px;color:var(--t3);margin-left:auto"><span class="chip active">Mese</span><span class="chip">Settimana</span></span></div><div style="display:flex;flex-direction:column;gap:12px">'+[{label:'Sessioni',v:D.sessions,c:'var(--accent)'},{label:'Tempo parlato',v:D.talk,c:'var(--green)'},{label:'Parole uniche',v:D.words,c:'var(--blue)'}].map(function(d,i){return '<div style="display:flex;align-items:center;gap:12px"><span style="font-size:12px;font-weight:600;color:var(--t2);width:90px">'+d.label+'</span><span class="mono" style="font-size:22px;font-weight:800;color:'+d.c+';width:60px">'+d.v.val+'</span><svg viewBox="0 0 100 24" style="width:100px;height:24px;flex:1"><polyline points="'+Array(10).fill(0).map(function(_,j){return (j*11)+','+(d.v.up?20-j*1.8:4+j*1.6)}).join(' ')+'" fill="none" stroke="'+d.c+'" stroke-width="2" stroke-linecap="round"/></svg>'+delta(d.v)+'</div>';}).join('')+'</div>';
}

function cardTable(n,twist){
  return '<span class="prop-num">#'+n+' · Table '+twist+'</span><div class="card-h3">📊 Confronto <span style="font-weight:400;font-size:11px;color:var(--t3);margin-left:auto"><span class="chip active">Mese</span><span class="chip">Settimana</span></span></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:var(--t3);font-size:10px;text-transform:uppercase;letter-spacing:.06em"><th style="text-align:left;padding:10px 14px;font-weight:600">Metrica</th><th style="text-align:right;padding:10px 14px;font-weight:600">Questo mese</th><th style="text-align:right;padding:10px 14px;font-weight:600">Mese scorso</th><th style="text-align:right;padding:10px 14px;font-weight:600">Δ</th></tr>'+[{l:'Sessioni',v:D.sessions,c:'var(--accent)'},{l:'Tempo parlato',v:D.talk,c:'var(--green)'},{l:'Parole uniche',v:D.words,c:'var(--blue)'}].map(function(d,i){return '<tr style="border-top:1px solid var(--line);transition:background .2s" onmouseover="this.style.background=\'var(--bg2)\'" onmouseout="this.style.background=\'\'"><td style="padding:12px 14px;font-weight:600">'+d.l+'</td><td class="mono" style="text-align:right;padding:12px 14px;font-weight:700;color:'+d.c+'">'+d.v.val+'</td><td class="mono" style="text-align:right;padding:12px 14px;color:var(--t3)">'+d.v.prev+'</td><td style="text-align:right;padding:12px 14px">'+delta(d.v)+'</td></tr>';}).join('')+'</table></div>';
}

// 30 proposals: 10 each for the 3 base styles
var proposals=[];
var twists3=['Stat Cards','w/ Mini Bars','w/ % Badges','w/ Icons','w/ Trend Dots','w/ Progress Rings','w/ Background Fill','Horizontal','w/ Separators','Compact'];
var twistsS=['Line Chart','w/ Dots','Area Fill','w/ Values','Minimal','Bold','w/ Grid','Stepped','Curved','Dual Tone'];
var twistsT=['Rows','Striped','w/ Bar Chart','w/ Icons','Compact','Expanded','w/ Trend Arrows','Card Style','Minimal','Bordered'];

for(var i=0;i<10;i++)proposals.push({html:card3Col(i+1,twists3[i]),group:'3col'});
for(var i=0;i<10;i++)proposals.push({html:cardSpark(i+11,twistsS[i]),group:'spark'});
for(var i=0;i<10;i++)proposals.push({html:cardTable(i+21,twistsT[i]),group:'table'});

var navCol=document.getElementById('navCol');
var previewArea=document.getElementById('previewArea');
var current=0;

navCol.innerHTML='<div class="nav-section">3-Column (1–10)</div>';
for(var i=0;i<10;i++)navCol.innerHTML+='<button class="nav-btn'+(i===0?' active':'')+'" data-idx="'+i+'"><span class="n">#'+(i+1)+'</span>'+twists3[i]+'</button>';
navCol.innerHTML+='<div class="nav-section">Sparkline (11–20)</div>';
for(var i=0;i<10;i++)navCol.innerHTML+='<button class="nav-btn" data-idx="'+(i+10)+'"><span class="n">#'+(i+11)+'</span>'+twistsS[i]+'</button>';
navCol.innerHTML+='<div class="nav-section">Table (21–30)</div>';
for(var i=0;i<10;i++)navCol.innerHTML+='<button class="nav-btn" data-idx="'+(i+20)+'"><span class="n">#'+(i+21)+'</span>'+twistsT[i]+'</button>';

navCol.addEventListener('click',function(e){
  var btn=e.target.closest('.nav-btn');if(!btn)return;
  current=parseInt(btn.dataset.idx);
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  show();
});

function show(){
  var p=proposals[current];
  previewArea.innerHTML='<div class="preview-card">'+p.html+'</div><div class="preview-card"><div style="font-size:9px;color:var(--t3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.1em">Clean view</div>'+p.html.replace(/<span class="prop-num">.*?<\/span>/,'')+'</div>';
}
show();
</script>
</body>
</html>
