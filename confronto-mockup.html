<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d14;--bg2:#12151e;--card:#161922;--line:#232836;--text:#e8eaed;--t2:#c4c9d4;--t3:#5f6b7a;--accent:#a78bfa;--green:#34d399;--blue:#60a5fa;--amber:#fbbf24;--pink:#f472b6;--red:#f87171}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:24px}
h1{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
h1 em{color:var(--accent);font-style:normal}
.sub{font-size:13px;color:var(--t2);margin-bottom:24px}
.back{display:inline-block;margin-bottom:18px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:500}

.layout{display:flex;gap:18px;align-items:flex-start}
@media(max-width:860px){.layout{flex-direction:column}}
.nav-col{width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;position:sticky;top:24px;max-height:80vh;overflow-y:auto}
@media(max-width:860px){.nav-col{width:100%;position:static;flex-direction:row;flex-wrap:wrap;max-height:none}}
.nav-btn{padding:8px 14px;border-radius:10px;font-size:11px;font-weight:500;border:1px solid transparent;background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;text-align:left;transition:all .12s}
.nav-btn:hover{background:var(--card);color:var(--text)}
.nav-btn.active{background:var(--card);border-color:var(--line);color:var(--text);font-weight:600}
.nav-btn .n{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);margin-right:4px}

.preview-area{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.preview-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;overflow:hidden}
.preview-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--accent),transparent 70%);opacity:.06;pointer-events:none;border-radius:10px}
.preview-card .proposal-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);font-weight:700;margin-bottom:8px;display:block}

.card-h3{font-size:18px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.compact{font-size:12px}

/* shared mini components */
.bar-h{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar-f{height:100%;border-radius:3px}
.chip-row{display:flex;gap:4px;margin-bottom:8px}
.chip{padding:5px 12px;border-radius:100px;font-size:10px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.g3,.g2{grid-template-columns:1fr}}
.mono{font-family:'JetBrains Mono',monospace}
.num{font-family:'JetBrains Mono',monospace;font-weight:700}
</style>
</head>

// ═══ BUILD ═══
var navCol=document.getElementById('navCol');
var previewArea=document.getElementById('previewArea');
var currentProposal=0;

proposals.forEach(function(p,i){
  var btn=document.createElement('button');
  btn.className='nav-btn'+(i===currentProposal?' active':'');
  btn.innerHTML='<span class="n">#'+p.n+'</span>'+p.name;
  btn.addEventListener('click',function(){
    currentProposal=i;
    document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active')});
    btn.classList.add('active');
    showProposal();
  });
  navCol.appendChild(btn);
});

function showProposal(){
  var p=proposals[currentProposal];
  previewArea.innerHTML='<div class="preview-card">'+p.html+'</div><div class="preview-card" style="margin-top:0"><div style="font-size:9px;color:var(--t3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.1em">Clean view (as it would appear on the page)</div>'+p.html.replace(/<span class="proposal-num">.*?<\/span>/,'')+'</div>';
}

showProposal();
</script>
