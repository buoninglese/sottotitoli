<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio · Desktop Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent-green:#34d399;--accent-blue:#60a5fa}
html,body{height:100%;overflow:hidden;background:#0a0c11}
body{font-family:Inter,system-ui,sans-serif}

/* ── Main Layout ── */
.app{width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Top Bar ── */
.topbar{display:flex;align-items:center;padding:14px 20px;gap:16px;background:rgba(0,0,0,.3);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);z-index:10;flex-shrink:0}
.topbar-logo{font-size:20px;font-weight:900;color:#f1f5f9;letter-spacing:-.5px}
.topbar-logo span{background:linear-gradient(135deg,var(--accent-green),var(--accent-blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-spacer{flex:1}
.topbar-actions{display:flex;align-items:center;gap:12px}

.hamburger{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:18px;cursor:pointer;transition:all .2s;flex-shrink:0;position:relative;z-index:50}
.hamburger:hover{background:rgba(255,255,255,.12);color:#fff}
.menu-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:rgba(0,0,0,.95);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:6px;min-width:200px;opacity:0;pointer-events:none;transform:translateY(-6px);transition:all .2s;z-index:60}
.menu-dropdown.open{opacity:1;pointer-events:auto;transform:translateY(0)}
.menu-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;color:rgba(255,255,255,.7);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;text-decoration:none;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.menu-item:hover{background:rgba(255,255,255,.06);color:#fff}
.menu-item .mi-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.menu-divider{height:1px;background:rgba(255,255,255,.06);margin:4px 8px}

/* ── Split Panels ── */
.split{flex:1;display:flex;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;padding:24px 28px 20px}
.panel::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.01) 1px,transparent 1px);background-size:20px 20px;pointer-events:none;mask-image:radial-gradient(ellipse at 50% 50%,#000 30%,transparent 70%);z-index:0}
.panel::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0}
.panel>*{position:relative;z-index:1}

.panel-cap{background:#06120e}
.panel-cap::after{background:radial-gradient(ellipse at 50% 40%,rgba(52,211,153,.07) 0%,transparent 60%)}
.panel-tr{background:#060d18}
.panel-tr::after{background:radial-gradient(ellipse at 50% 40%,rgba(96,165,250,.07) 0%,transparent 60%)}

/* Divider */
.divider{width:1px;flex-shrink:0;background:linear-gradient(180deg,transparent,rgba(255,255,255,.08) 30%,rgba(255,255,255,.08) 70%,transparent)}

.glass{background:rgba(255,255,255,.025);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.05);border-radius:20px}

/* ── Panel Title ── */
.panel-title-block{display:flex;align-items:center;gap:14px;padding:22px 20px;margin-bottom:20px}
.panel-icon{font-size:48px;line-height:1;flex-shrink:0;animation:floatUp 3s ease-in-out infinite}
.panel-title-text{flex:1;min-width:0}
.panel-title-row{display:flex;align-items:center;gap:8px}
.panel-title-main{font-size:32px;font-weight:900;color:#f1f5f9;letter-spacing:-1px;line-height:1.05;white-space:nowrap}

/* Info icon */
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.4);font-size:11px;cursor:pointer;transition:all .2s;flex-shrink:0;font-weight:700;line-height:1;position:relative;margin-left:6px}
.info-icon:hover{background:rgba(255,255,255,.15);color:#fff}
.info-tip{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.95);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 16px;font-size:11px;color:#e8eaed;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;font-weight:400;z-index:40;line-height:1.5;text-align:center}
.info-tip::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:rgba(255,255,255,.12)}
.info-icon.show-tip .info-tip{opacity:1}

/* ── Panel Content ── */
.panel-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.option-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;padding:28px 22px 22px;min-height:220px;justify-content:center}

/* Flag chips */
.flag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.flag-chip{display:inline-flex;align-items:center;justify-content:center;border-radius:16px;font-weight:500;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);cursor:pointer;transition:all .25s;font-family:inherit;padding:18px 8px;font-size:38px}
.flag-chip:hover{transform:translateY(-2px)}
.flag-chip.active{box-shadow:0 0 0 3px rgba(52,211,153,.12)}
.panel-cap .flag-chip:hover{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.25)}
.panel-cap .flag-chip.active{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4)}
.panel-tr .flag-chip:hover{background:rgba(96,165,250,.07);border-color:rgba(96,165,250,.25)}
.panel-tr .flag-chip.active{background:rgba(96,165,250,.14);border-color:rgba(96,165,250,.4);box-shadow:0 0 0 3px rgba(96,165,250,.12)}

/* Pair selector */
.pair-selector{display:flex;align-items:center;gap:20px;justify-content:center}
.pair-block{text-align:center;cursor:pointer;transition:all .25s;border-radius:18px;border:1px solid transparent;background:rgba(255,255,255,.02);padding:18px 20px}
.pair-block:hover{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.05);transform:translateY(-2px)}
.pair-block .big-flag{line-height:1;transition:transform .25s;display:block;font-size:56px}
.pair-block:hover .big-flag{transform:scale(1.1)}
.pair-block .pair-name{font-weight:700;color:#f1f5f9;margin-top:4px;font-size:16px}
.pair-block .pair-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.2);margin-top:2px}
.pair-arrow{font-size:28px;color:var(--accent-blue);font-weight:700;animation:pairPulse 1.5s ease-in-out infinite}

/* Avvia button */
.btn-avvia{display:inline-flex;align-items:center;gap:8px;padding:15px 0;border-radius:100px;font-size:14px;font-weight:700;cursor:pointer;transition:all .3s;font-family:inherit;border:none;width:100%;max-width:420px;justify-content:center}
.btn-cap{background:linear-gradient(135deg,var(--accent-green),#34d399);color:#000;box-shadow:0 4px 24px rgba(52,211,153,.3)}
.btn-cap:hover{transform:translateY(-2px);box-shadow:0 8px 36px rgba(52,211,153,.45)}
.btn-tr{background:linear-gradient(135deg,var(--accent-blue),#60a5fa);color:#fff;box-shadow:0 4px 24px rgba(96,165,250,.3)}
.btn-tr:hover{transform:translateY(-2px);box-shadow:0 8px 36px rgba(96,165,250,.45)}

/* Spinner overlay */
.spinner-overlay{position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.94);backdrop-filter:blur(16px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.spinner-overlay.show{display:flex}
.spinner-title{font-size:17px;font-weight:700;color:#f1f5f9;margin-bottom:20px}
.spinner-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:300px;margin-bottom:20px}
.spinner-chip{padding:16px;border-radius:14px;font-size:15px;font-weight:600;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:#cbd5e1;cursor:pointer;transition:all .2s;font-family:inherit;text-align:center}
.spinner-chip:hover{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.3);color:#fff;transform:translateY(-1px)}
.spinner-chip.selected{background:rgba(96,165,250,.22);border-color:var(--accent-blue);color:var(--accent-blue);box-shadow:0 0 0 3px rgba(96,165,250,.18)}
.spinner-confirm{padding:16px 56px;border-radius:100px;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--accent-blue),#60a5fa);color:#fff;cursor:pointer;font-family:inherit;border:none;box-shadow:0 4px 28px rgba(96,165,250,.45);transition:all .3s}
.spinner-confirm:hover{transform:translateY(-2px);box-shadow:0 8px 38px rgba(96,165,250,.6)}

@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pairPulse{0%,100%{opacity:.5;transform:translateX(0)}50%{opacity:1;transform:translateX(5px)}}
</style>
</head>
<body>

<div class="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-logo">Sotto<span>titoli</span> Studio</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <div class="hamburger" id="hamburger">☰
        <div class="menu-dropdown" id="menuDropdown">
          <a class="menu-item" href="account.html"><span class="mi-icon">👤</span> Il tuo viaggio</a>
          <a class="menu-item" href="analysis.html"><span class="mi-icon">📊</span> Analisi sessioni</a>
          <a class="menu-item" href="wallet.html"><span class="mi-icon">💳</span> Portafoglio crediti</a>
          <div class="menu-divider"></div>
          <a class="menu-item" href="goals.html"><span class="mi-icon">🎯</span> Impostazioni</a>
          <button class="menu-item" onclick="alert('Logout')"><span class="mi-icon">🚪</span> Esci</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Split Panels -->
  <div class="split">
    <!-- Caption Panel -->
    <div class="panel panel-cap" id="panelCap">
      <div class="glass panel-title-block">
        <div class="panel-icon">🎙️</div>
        <div class="panel-title-text">
          <div class="panel-title-row">
            <div class="panel-title-main">Sottotitoli</div>
            <div class="info-icon" id="infoCap">ℹ
              <div class="info-tip">Scegli una lingua,<br>poi premi <b>Avvia Caption</b></div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel-content">
        <div class="glass option-card">
          <div class="flag-grid" id="flagGridCap"></div>
        </div>
        <button class="btn-avvia btn-cap" id="ctaCap">Avvia Caption →</button>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider"></div>

    <!-- Translate Panel -->
    <div class="panel panel-tr" id="panelTr">
      <div class="glass panel-title-block">
        <div class="panel-icon">🌐</div>
        <div class="panel-title-text">
          <div class="panel-title-row">
            <div class="panel-title-main">Traduzione</div>
            <div class="info-icon" id="infoTr">ℹ
              <div class="info-tip">Scegli la lingua che parli<br>e quella per i sottotitoli</div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel-content">
        <div class="glass option-card">
          <div class="pair-selector">
            <div class="pair-block" id="srcBlock"><div class="big-flag" id="srcFlag">🇬🇧</div><div class="pair-name" id="srcName">Inglese</div><div class="pair-label">Io parlo</div></div>
            <div class="pair-arrow">→</div>
            <div class="pair-block" id="tgtBlock"><div class="big-flag" id="tgtFlag">🇮🇹</div><div class="pair-name" id="tgtName">Italiano</div><div class="pair-label">Sottotitoli</div></div>
          </div>
        </div>
        <button class="btn-avvia btn-tr" id="ctaTr">Avvia Traduzione →</button>
      </div>
      <!-- Spinner -->
      <div class="spinner-overlay" id="spinner">
        <div class="spinner-title" id="spinnerTitle">Io parlo in…</div>
        <div class="spinner-grid" id="spinnerGrid"></div>
        <button class="spinner-confirm" id="spinnerClose">Conferma selezione ✓</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var languages = [
    {code:'en',flag:'🇬🇧',name:'Inglese'},{code:'it',flag:'🇮🇹',name:'Italiano'},
    {code:'fr',flag:'🇫🇷',name:'Francese'},{code:'de',flag:'🇩🇪',name:'Tedesco'},
    {code:'es',flag:'🇪🇸',name:'Spagnolo'},{code:'nl',flag:'🇳🇱',name:'Olandese'},
    {code:'pt',flag:'🇵🇹',name:'Portoghese'},{code:'pl',flag:'🇵🇱',name:'Polacco'}
  ];
  function findLang(c){return languages.find(function(l){return l.code===c})}

  // Caption panel
  var flagGridCap=document.getElementById('flagGridCap');
  var selCap='en';
  function buildCapFlags(){
    flagGridCap.innerHTML='';
    languages.forEach(function(l){
      var chip=document.createElement('span');
      chip.className='flag-chip'+(l.code===selCap?' active':'');
      chip.setAttribute('data-lang',l.code); chip.textContent=l.flag;
      chip.addEventListener('click',function(){
        flagGridCap.querySelectorAll('.flag-chip').forEach(function(c){c.classList.remove('active')});
        chip.classList.add('active'); selCap=chip.getAttribute('data-lang');
      });
      flagGridCap.appendChild(chip);
    });
  }
  buildCapFlags();

  // Translate panel
  var selSrc='en', selTgt='it';
  var srcF=document.getElementById('srcFlag'), srcN=document.getElementById('srcName');
  var tgtF=document.getElementById('tgtFlag'), tgtN=document.getElementById('tgtName');
  function updPair(){
    var s=findLang(selSrc), t=findLang(selTgt);
    srcF.textContent=s.flag; srcN.textContent=s.name;
    tgtF.textContent=t.flag; tgtN.textContent=t.name;
  }

  var srcBlock=document.getElementById('srcBlock'), tgtBlock=document.getElementById('tgtBlock');
  var spinner=document.getElementById('spinner'), spinnerT=document.getElementById('spinnerTitle');
  var spinnerG=document.getElementById('spinnerGrid'), spinnerC=document.getElementById('spinnerClose');

  function openSpin(side){
    spinnerT.textContent=side==='source'?'Io parlo in…':'Sottotitoli in…';
    spinnerG.innerHTML='';
    var cur=side==='source'?selSrc:selTgt;
    languages.forEach(function(l){
      var c=document.createElement('button');
      c.className='spinner-chip'+(l.code===cur?' selected':'');
      c.textContent=l.flag+' '+l.name;
      c.addEventListener('click',function(){
        if(side==='source') selSrc=l.code; else selTgt=l.code;
        updPair();
        spinnerG.querySelectorAll('.spinner-chip').forEach(function(x){x.classList.remove('selected')});
        c.classList.add('selected');
      });
      spinnerG.appendChild(c);
    });
    spinner.classList.add('show');
  }
  spinnerC.addEventListener('click',function(){spinner.classList.remove('show')});
  srcBlock.addEventListener('click',function(){openSpin('source')});
  tgtBlock.addEventListener('click',function(){openSpin('target')});

  // Info icons
  function setupInfo(iconId){
    var ico=document.getElementById(iconId);
    if(!ico) return;
    ico.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();ico.classList.toggle('show-tip')});
    document.addEventListener('click',function(e){if(!ico.contains(e.target))ico.classList.remove('show-tip')});
  }
  setupInfo('infoCap'); setupInfo('infoTr');

  // Hamburger
  var hamburger=document.getElementById('hamburger');
  var menuDropdown=document.getElementById('menuDropdown');
  hamburger.addEventListener('click',function(e){e.stopPropagation();menuDropdown.classList.toggle('open')});
  document.addEventListener('click',function(e){if(!hamburger.contains(e.target))menuDropdown.classList.remove('open')});
})();
</script>
</body>
</html>
