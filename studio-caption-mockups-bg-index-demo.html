<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Index BG Demo · Transitions + Radial Bars</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0a0a0f;color:#e8eaed;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.slide{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.slide canvas{position:absolute;inset:0;width:100%;height:100%}
.slide .content{position:relative;z-index:1;text-align:center;max-width:700px;padding:0 24px}
.slide .tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:#a78bfa;margin-bottom:16px;padding:4px 12px;border:1px solid rgba(167,139,250,.25);border-radius:100px}
.slide h2{font-size:clamp(34px,8vw,64px);font-weight:900;line-height:1.05;letter-spacing:-1.5px;color:#f1f5f9;margin-bottom:12px;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.slide h2 .hl{background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.slide p{font-size:clamp(13px,1.8vw,16px);color:rgba(241,245,249,.55);max-width:440px;margin:0 auto 20px;line-height:1.6}
.slide .btn{display:inline-flex;align-items:center;gap:8px;padding:16px 40px;border-radius:100px;font-weight:700;font-size:16px;cursor:pointer;border:none;font-family:inherit;background:#7c3aed;color:#fff;box-shadow:0 4px 24px rgba(124,58,237,.35)}
.controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.controls button{padding:10px 20px;border-radius:100px;font-size:12px;font-weight:600;border:1.5px solid rgba(255,255,255,.15);background:rgba(15,17,23,.7);color:rgba(255,255,255,.8);cursor:pointer;font-family:inherit;backdrop-filter:blur(8px);transition:all .2s}
.controls button:hover{border-color:#a78bfa;color:#a78bfa;background:rgba(30,20,60,.85)}
.controls button.active{background:#a78bfa;color:#fff;border-color:#a78bfa}
.nav-arrows{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:8px}
.nav-arrows button{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);background:rgba(15,17,23,.7);color:rgba(255,255,255,.85);cursor:pointer;font-size:18px;font-family:inherit;backdrop-filter:blur(12px);transition:all .2s}
.nav-arrows button:hover{border-color:#a78bfa;color:#a78bfa}
.slide-indicator{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px}
.slide-indicator .dot{width:48px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);cursor:pointer;transition:all .5s}
.slide-indicator .dot.active{background:#a78bfa;box-shadow:0 0 14px rgba(167,139,250,.5)}
</style>
</head>
<body>

<div class="nav-arrows">
  <button onclick="prevSlide()">▲</button>
  <button onclick="nextSlide()">▼</button>
</div>

<div id="slidesContainer"></div>

<div class="slide-indicator" id="indicator"></div>

<div class="controls">
  <button class="active" data-trans="tornado" onclick="setTrans('tornado',this)">#2 · Tornado Column</button>
  <button data-trans="static" onclick="setTrans('static',this)">#6 · Static Surge</button>
  <button data-trans="nebula" onclick="setTrans('nebula',this)">#7 · Nebula Drift</button>
  <span style="color:rgba(255,255,255,.2);margin:0 4px">|</span>
  <button onclick="toggleRadial()">Toggle Radial Bars</button>
  <button onclick="demoAuto()">▶ Auto Demo</button>
</div>

<script>
// ═══ SLIDE DATA ═══
var slidesData=[
  {tag:'Sottotitoli',title:'Tutto chiaro.<br>Sempre. <span class="hl">Subito.</span>',sub:'Trascrizione e traduzione interattiva in tempo reale.'},
  {tag:'Visualizza',title:'La tua voce<br><span class="hl">in tutte le sue parti.</span>',sub:'Scomponiamo il tuo parlato in decine di indicatori.'},
  {tag:'Analisi',title:'Le parole sfuggono.<br><span class="hl">Da ora, non pi\u00f9.</span>',sub:'Traduciamo tutte le tue parole in metriche, grafici, tendenze.'},
  {tag:'Prezzi',title:"L'unica assicurazione<br><span class='hl'>contro l'incomprensione.</span>",sub:'Minuti per caption e traduzione, crediti separati per i report AI.'}
];

var currentSlide=0,currentTrans='tornado',showRadial=true,demoRunning=false,demoTimer=null;
var canvases=[],ctxes=[],states=[];

// ═══ BUILD SLIDES ═══
var container=document.getElementById('slidesContainer');
var indicator=document.getElementById('indicator');

slidesData.forEach(function(sd,i){
  var slide=document.createElement('div');slide.className='slide';slide.id='slide'+i;
  slide.style.display=i===0?'flex':'none';
  var canvas=document.createElement('canvas');slide.appendChild(canvas);
  slide.innerHTML+='<div class="content"><div class="tag">'+sd.tag+'</div><h2>'+sd.title+'</h2><p>'+sd.sub+'</p><div class="btn" onclick="demoAuto()">Inizia gratis</div></div>';
  container.appendChild(slide);
  canvases.push(canvas);ctxes.push(canvas.getContext('2d'));
  states.push({amplitude:0,targetAmp:3,burst:0,swirl:0,noise:0,flash:0,sY:0,phase:0,transId:-1,transStart:0});
  // Indicator dot
  var dot=document.createElement('div');dot.className='dot'+(i===0?' active':'');dot.onclick=function(){goToSlide(i);};
  indicator.appendChild(dot);
});

// ═══ RESIZE ═══
function resizeAll(){
  canvases.forEach(function(c,i){
    var rect=c.parentElement.getBoundingClientRect();
    c.width=rect.width*(window.devicePixelRatio||1);c.height=rect.height*(window.devicePixelRatio||1);
    c.style.width=rect.width+'px';c.style.height=rect.height+'px';
    ctxes[i].setTransform(1,0,0,1,0,0);ctxes[i].scale(window.devicePixelRatio||1,window.devicePixelRatio||1);
  });
}
resizeAll();window.addEventListener('resize',resizeAll);

// ═══ TRANSITION TRIGGER ═══
function triggerTransition(slideIdx){
  var s=states[slideIdx];s.transStart=performance.now();s.transId=1;
  s.burst=0;s.swirl=0;s.noise=0;s.flash=0;s.sY=0;
  if(currentTrans==='tornado'){s.swirl=1;s.burst=0.4;}
  if(currentTrans==='static'){s.noise=2;s.flash=0.6;s.burst=0.4;}
  if(currentTrans==='nebula'){s.burst=0.6;s.swirl=0.2;s.flash=0.3;}
}

// ═══ DRAW ═══
function drawSlide(ctx,W,H,s,now){
  var t=(now-s.transStart),p=s.transId>=0?Math.min(1,t/1400):0,eo=1-Math.pow(1-p,3);
  s.amplitude+=(s.targetAmp-s.amplitude)*0.04;
  if(s.transId>=0&&p>=0.98){s.transId=-1;s.targetAmp=3;s.burst=0;s.swirl=0;s.noise=0;s.flash=0;}

  if(currentTrans==='tornado'){s.swirl=s.transId>=0?1-eo:0;}
  if(currentTrans==='static'){s.noise=s.transId>=0?2*(1-eo):0;s.flash=s.transId>=0?.6*(1-eo):0;}
  if(currentTrans==='nebula'){s.burst=s.transId>=0?.6*(1-eo):0;s.swirl=s.transId>=0?.2*eo:0;}

  ctx.clearRect(0,0,W,H);

  // ═══ RADIAL BARS (from studio-caption-mockups-bg.html Radial 2/3) ═══
  if(showRadial){
    var cx=W/2,cy=H/2,baseR=Math.min(W,H)*0.15;
    var barCount=36,ringGap=22;
    for(var ring=0;ring<3;ring++){
      var r=baseR+ring*ringGap;
      for(var b=0;b<barCount;b++){
        var angle=(b/barCount)*Math.PI*2;
        var barLen=12+Math.sin(angle*3+now*0.001+ring)*6+Math.cos(angle*5+now*0.0007)*4;
        if(s.amplitude>3)barLen+=s.amplitude*1.5;
        if(s.burst>0)barLen+=s.burst*8*Math.sin(angle*2);
        if(s.noise>0)barLen+=(Math.random()-.5)*s.noise*10;
        var innerR=r,outerR=r+barLen;
        var x1=cx+Math.cos(angle)*innerR,y1=cy+Math.sin(angle)*innerR;
        var x2=cx+Math.cos(angle)*outerR,y2=cy+Math.sin(angle)*outerR;
        var alpha=.08+Math.sin(angle*3+now*.001)*.03;
        ctx.strokeStyle='rgba(167,139,250,'+(alpha+s.flash*.15)+')';
        ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      }
    }
  }

  // ═══ PARTICLES ═══
  if(!s.particles){s.particles=[];for(var i=0;i<50;i++)s.particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:-.1-Math.random()*.4,size:1+Math.random()*3,hue:260+Math.random()*60});}
  s.particles.forEach(function(pt){
    pt.x+=pt.vx;pt.y+=pt.vy;
    if(s.swirl>0){var sx=pt.x-W/2,sy=pt.y-H/2,sd=Math.sqrt(sx*sx+sy*sy),sa=Math.atan2(sy,sx)+sd*.002*s.swirl;pt.x+=Math.cos(sa)*sd*.02*s.swirl;pt.y+=Math.sin(sa)*sd*.02*s.swirl;}
    if(s.burst>0){var bx=pt.x-W/2,by=pt.y-H/2,bd=Math.sqrt(bx*bx+by*by)||1;pt.x+=bx/bd*s.burst*5;pt.y+=by/bd*s.burst*5;}
    if(s.noise>0){pt.x+=(Math.random()-.5)*s.noise*10;pt.y+=(Math.random()-.5)*s.noise*10;}
    if(pt.y<-20){pt.y=H+20;pt.x=Math.random()*W;}if(pt.y>H+20){pt.y=-20;pt.x=Math.random()*W;}
    var alpha=.15+s.flash*.3;
    ctx.fillStyle='hsla('+(pt.hue+s.flash*60)+',70%,65%,'+alpha+')';
    ctx.beginPath();ctx.arc(pt.x,pt.y,pt.size+(s.burst>0?s.burst*5:0),0,Math.PI*2);ctx.fill();
  });
}

// ═══ LOOP ═══
function loop(ts){
  canvases.forEach(function(c,i){
    var dpr=window.devicePixelRatio||1,W=c.width/dpr,H=c.height/dpr;
    var s=states[i];
    ctxes[i].save();ctxes[i].setTransform(1,0,0,1,0,0);ctxes[i].scale(dpr,dpr);
    drawSlide(ctxes[i],W,H,s,ts);
    ctxes[i].restore();
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ═══ SLIDE NAVIGATION ═══
function goToSlide(idx){
  if(idx===currentSlide)return;
  document.getElementById('slide'+currentSlide).style.display='none';
  currentSlide=idx;
  document.getElementById('slide'+currentSlide).style.display='flex';
  document.querySelectorAll('.slide-indicator .dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
  triggerTransition(currentSlide);
}

function nextSlide(){goToSlide((currentSlide+1)%slidesData.length);}
function prevSlide(){goToSlide((currentSlide-1+slidesData.length)%slidesData.length);}
document.addEventListener('keydown',function(e){if(e.key==='ArrowDown')nextSlide();if(e.key==='ArrowUp')prevSlide();});

// Wheel
var wheelAccum=0;
document.addEventListener('wheel',function(e){
  wheelAccum+=e.deltaY;if(Math.abs(wheelAccum)<40)return;
  if(wheelAccum>0)nextSlide();else prevSlide();wheelAccum=0;
},{passive:true});

// ═══ CONTROLS ═══
function setTrans(t,btn){
  currentTrans=t;document.querySelectorAll('.controls button[data-trans]').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');
}

function toggleRadial(){showRadial=!showRadial;}

function demoAuto(){
  if(demoRunning){clearInterval(demoTimer);demoRunning=false;return;}
  demoRunning=true;
  demoTimer=setInterval(function(){nextSlide();},2200);
}

// Init
triggerTransition(0);
</script>
</body>
</html>
