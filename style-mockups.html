<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Mockups · Sottotitoli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0f1117;color:#e8eaed;padding:40px 24px;-webkit-font-smoothing:antialiased}
h1{font-size:clamp(28px,5vw,48px);font-weight:800;letter-spacing:-1.5px;margin-bottom:8px}
.sub{font-size:14px;color:#9ca3af;max-width:700px;margin-bottom:8px;line-height:1.6}
.legend{display:flex;gap:16px;margin-bottom:32px;font-size:11px;color:#6b7280}
.legend span{display:flex;align-items:center;gap:4px}
.legend .dot{width:8px;height:8px;border-radius:50%}
.legend .dot.ok{background:#34d399}.legend .dot.warn{background:#f59e0b}.legend .dot.bad{background:#ef4444}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}
.card{border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.card-header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.card-header .name{font-size:13px}
.card-header .tags{display:flex;gap:6px}
.card-header .tag{font-size:9px;padding:2px 8px;border-radius:100px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.tag-bw{background:rgba(255,255,255,.08);color:#9ca3af}
.tag-pastel{background:rgba(167,139,250,.15);color:#a78bfa}
.tag-creative{background:rgba(52,211,153,.15);color:#34d399}
.pair{display:grid;grid-template-columns:1fr 1fr}
.half{padding:20px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:140px}
.half .label{font-size:9px;text-transform:uppercase;letter-spacing:1px;opacity:.5;margin-bottom:2px}
.half .sample{font-size:clamp(16px,3vw,22px);font-weight:800;letter-spacing:-.5px;line-height:1.2}
.half .sample em{font-style:normal}
.half .subtitle{font-size:12px;opacity:.7;max-width:240px;line-height:1.4}
.half .btn-mini{padding:6px 16px;border-radius:100px;font-size:11px;font-weight:600;text-decoration:none}
</style>
</head>
<body>

<h1>Style Mockups</h1>
<p class="sub">20 combinazioni colore con varianti Day e Night.<br>Ogni scheda mostra titolo, sottotitolo e bottone campione su sfondo reale.</p>
<div class="legend">
  <span><span class="dot ok"></span> Buona leggibilità</span>
  <span><span class="dot warn"></span> Accettabile</span>
  <span><span class="dot bad"></span> Scarsa</span>
</div>

<div class="grid" id="grid"></div>

<script>
const schemes = [
  // ═══ BLACK & WHITE ═══
  { name:'1. Nero puro', tags:['bw'],
    night:{ bg:'#000', text:'#fff', accent:'#a78bfa', sub:'rgba(255,255,255,.6)', btnBg:'#7c3aed', btnText:'#fff' },
    day:  { bg:'#fff', text:'#111', accent:'#7c3aed', sub:'rgba(0,0,0,.5)', btnBg:'#7c3aed', btnText:'#fff' }},
  { name:'2. Nero carbone', tags:['bw'],
    night:{ bg:'#0a0a0a', text:'#e8e8e8', accent:'#a78bfa', sub:'rgba(255,255,255,.55)', btnBg:'#7c3aed', btnText:'#fff' },
    day:  { bg:'#fafafa', text:'#171717', accent:'#7c3aed', sub:'rgba(0,0,0,.45)', btnBg:'#7c3aed', btnText:'#fff' }},
  { name:'3. Navy scuro', tags:['bw'],
    night:{ bg:'#0a0e1a', text:'#e2e8f0', accent:'#a78bfa', sub:'rgba(255,255,255,.5)', btnBg:'#7c3aed', btnText:'#fff' },
    day:  { bg:'#f8fafc', text:'#0f172a', accent:'#7c3aed', sub:'rgba(0,0,0,.45)', btnBg:'#7c3aed', btnText:'#fff' }},
  { name:'4. Grafite', tags:['bw'],
    night:{ bg:'#111318', text:'#d4d4d8', accent:'#c4b5fd', sub:'rgba(255,255,255,.5)', btnBg:'#7c3aed', btnText:'#fff' },
    day:  { bg:'#f4f4f5', text:'#18181b', accent:'#7c3aed', sub:'rgba(0,0,0,.45)', btnBg:'#7c3aed', btnText:'#fff' }},
  { name:'5. Carta + Inchiostro', tags:['bw'],
    night:{ bg:'#111827', text:'#f1f5f9', accent:'#a78bfa', sub:'rgba(255,255,255,.55)', btnBg:'#7c3aed', btnText:'#fff' },
    day:  { bg:'#fefefe', text:'#111827', accent:'#7c3aed', sub:'rgba(0,0,0,.5)', btnBg:'#7c3aed', btnText:'#fff' }},
  { name:'6. Slate + Gesso', tags:['bw'],
    night:{ bg:'#1e1e24', text:'#e5e5ea', accent:'#c4b5fd', sub:'rgba(255,255,255,.5)', btnBg:'#7c3aed', btnText:'#fff' },
    day:  { bg:'#f5f5f0', text:'#1a1a1a', accent:'#7c3aed', sub:'rgba(0,0,0,.5)', btnBg:'#7c3aed', btnText:'#fff' }},

  // ═══ PASTEL ═══
  { name:'7. Lavanda', tags:['pastel'],
    night:{ bg:'#1a1028', text:'#e8ddf8', accent:'#c4b5fd', sub:'rgba(200,180,240,.55)', btnBg:'#7c3aed', btnText:'#fff' },
    day:  { bg:'#f5f0ff', text:'#2d1b4e', accent:'#7c3aed', sub:'rgba(45,27,78,.45)', btnBg:'#7c3aed', btnText:'#fff' }},
  { name:'8. Cielo sereno', tags:['pastel'],
    night:{ bg:'#0c1929', text:'#e0f2fe', accent:'#60a5fa', sub:'rgba(180,210,240,.55)', btnBg:'#2563eb', btnText:'#fff' },
    day:  { bg:'#f0f8ff', text:'#1e3a5f', accent:'#2563eb', sub:'rgba(30,58,95,.45)', btnBg:'#2563eb', btnText:'#fff' }},
  { name:'9. Menta fresca', tags:['pastel'],
    night:{ bg:'#041a14', text:'#d1fae5', accent:'#34d399', sub:'rgba(150,220,190,.55)', btnBg:'#059669', btnText:'#fff' },
    day:  { bg:'#f0fdf6', text:'#064e3b', accent:'#059669', sub:'rgba(6,78,59,.45)', btnBg:'#059669', btnText:'#fff' }},
  { name:'10. Pesca tenue', tags:['pastel'],
    night:{ bg:'#1c0f08', text:'#fde2d4', accent:'#fb923c', sub:'rgba(240,180,140,.55)', btnBg:'#d97706', btnText:'#fff' },
    day:  { bg:'#fef7f0', text:'#5c2a0a', accent:'#d97706', sub:'rgba(92,42,10,.45)', btnBg:'#d97706', btnText:'#fff' }},
  { name:'11. Rosa cipria', tags:['pastel'],
    night:{ bg:'#1f0a14', text:'#fce7f3', accent:'#f472b6', sub:'rgba(240,150,190,.55)', btnBg:'#db2777', btnText:'#fff' },
    day:  { bg:'#fdf2f8', text:'#4a1030', accent:'#db2777', sub:'rgba(74,16,48,.45)', btnBg:'#db2777', btnText:'#fff' }},
  { name:'12. Burro + Salvia', tags:['pastel'],
    night:{ bg:'#151310', text:'#fef3c7', accent:'#fbbf24', sub:'rgba(240,220,150,.55)', btnBg:'#b45309', btnText:'#fff' },
    day:  { bg:'#fefce8', text:'#3b2f0a', accent:'#b45309', sub:'rgba(59,47,10,.45)', btnBg:'#b45309', btnText:'#fff' }},

  // ═══ CREATIVE ═══
  { name:'13. Aurora boreale', tags:['creative'],
    night:{ bg:'#0a0a1a', text:'#c4f0ff', accent:'#22d3ee', sub:'rgba(150,220,240,.55)', btnBg:'#0891b2', btnText:'#fff' },
    day:  { bg:'#f0faff', text:'#0c4a6e', accent:'#0891b2', sub:'rgba(12,74,110,.5)', btnBg:'#0891b2', btnText:'#fff' }},
  { name:'14. Velluto cremisi', tags:['creative'],
    night:{ bg:'#1a0610', text:'#fecdd3', accent:'#fb7185', sub:'rgba(240,130,150,.55)', btnBg:'#e11d48', btnText:'#fff' },
    day:  { bg:'#fef2f2', text:'#450a1a', accent:'#e11d48', sub:'rgba(69,10,26,.45)', btnBg:'#e11d48', btnText:'#fff' }},
  { name:'15. Giada imperiale', tags:['creative'],
    night:{ bg:'#021a14', text:'#a7f3d0', accent:'#10b981', sub:'rgba(130,220,180,.55)', btnBg:'#047857', btnText:'#fff' },
    day:  { bg:'#ecfdf5', text:'#022c1e', accent:'#047857', sub:'rgba(2,44,30,.45)', btnBg:'#047857', btnText:'#fff' }},
  { name:'16. Ametista', tags:['creative'],
    night:{ bg:'#140a2e', text:'#e9d5ff', accent:'#c084fc', sub:'rgba(190,140,240,.55)', btnBg:'#9333ea', btnText:'#fff' },
    day:  { bg:'#f5f0ff', text:'#2e1065', accent:'#9333ea', sub:'rgba(46,16,101,.45)', btnBg:'#9333ea', btnText:'#fff' }},
  { name:'17. Oceano profondo', tags:['creative'],
    night:{ bg:'#030d1a', text:'#bae6fd', accent:'#38bdf8', sub:'rgba(140,200,240,.55)', btnBg:'#0369a1', btnText:'#fff' },
    day:  { bg:'#f0f9ff', text:'#082f49', accent:'#0369a1', sub:'rgba(8,47,73,.45)', btnBg:'#0369a1', btnText:'#fff' }},
  { name:'18. Terracotta', tags:['creative'],
    night:{ bg:'#1a0e08', text:'#fed7aa', accent:'#fb923c', sub:'rgba(240,160,100,.55)', btnBg:'#c2410c', btnText:'#fff' },
    day:  { bg:'#fef7ee', text:'#431407', accent:'#c2410c', sub:'rgba(67,20,7,.45)', btnBg:'#c2410c', btnText:'#fff' }},
  { name:'19. Pino alpino', tags:['creative'],
    night:{ bg:'#041208', text:'#bbf7d0', accent:'#4ade80', sub:'rgba(130,220,150,.55)', btnBg:'#166534', btnText:'#fff' },
    day:  { bg:'#f0fdf4', text:'#052e16', accent:'#166534', sub:'rgba(5,46,22,.45)', btnBg:'#166534', btnText:'#fff' }},
  { name:'20. Crepuscolo', tags:['creative'],
    night:{ bg:'#1a0a20', text:'#f0d0ff', accent:'#d8b4fe', sub:'rgba(200,160,230,.55)', btnBg:'#7e22ce', btnText:'#fff' },
    day:  { bg:'#faf5ff', text:'#3b0764', accent:'#7e22ce', sub:'rgba(59,7,100,.45)', btnBg:'#7e22ce', btnText:'#fff' }},
];

function renderGrid() {
  document.getElementById('grid').innerHTML = schemes.map(function(s, i){
    function halfHTML(mode, data) {
      return '<div class="half" style="background:'+data.bg+';color:'+data.text+'">'+
        '<div class="label">'+mode+'</div>'+
        '<div class="sample">Sottotitoli in<br><em style="color:'+data.accent+'">tempo reale</em></div>'+
        '<div class="subtitle" style="color:'+data.sub+'">Microfono, voce, sottotitoli. In 8 lingue.</div>'+
        '<a href="#" class="btn-mini" style="background:'+data.btnBg+';color:'+data.btnText+'">Prova →</a>'+
      '</div>';
    }
    var tagsHTML = s.tags.map(function(t){
      return '<span class="tag tag-'+t+'">'+t+'</span>';
    }).join('');
    return '<div class="card" style="background:#1a1d26">'+
      '<div class="card-header"><span class="name">'+s.name+'</span><span class="tags">'+tagsHTML+'</span></div>'+
      '<div class="pair">'+halfHTML('NIGHT', s.night)+halfHTML('DAY', s.day)+'</div>'+
    '</div>';
  });
}
renderGrid();
</script>
</body>
</html>
