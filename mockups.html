<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Banksy Stencil · Sottotitoli</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f15;--card:#131820;--line:#1e2632;--text:#e2e4e9;--t3:#5e6676;--accent:#7c3aed;--green:#22c55e;--r:14px;--f:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh}
.page{padding:32px;max-width:900px;margin:0 auto}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.sub{font-size:13px;color:var(--t3);margin-bottom:28px}
.m{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mn{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em}
.mt{font-size:14px;font-weight:600;color:var(--text)}
.mc{min-height:350px;padding:20px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:12px;align-content:start;justify-content:center}
.play-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--t3);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.play-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(124,58,237,.1)}
.play-btn.playing{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.1)}
.v12b{display:flex;flex-wrap:wrap;gap:10px;align-content:start;justify-content:center}
.v12bn{font-family:'Impact','Arial Black',sans-serif;font-size:32px;color:#fff;text-transform:uppercase;letter-spacing:2px;padding:10px 18px;background:#000;border:2px solid #fff;opacity:0;animation:v12in .6s ease-out forwards;line-height:1.2;cursor:pointer;transition:all .2s}
.v12bn.collected{background:var(--green);border-color:var(--green);color:#000;box-shadow:0 0 20px rgba(34,197,94,.5)}
@keyframes v12in{to{opacity:1}}
.v3toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;font-size:14px;font-weight:700;padding:12px 24px;border-radius:99px;z-index:999;opacity:0;animation:v3toast 1.5s ease-out forwards;pointer-events:none}
@keyframes v3toast{0%{opacity:0;transform:translateX(-50%) translateY(10px)}20%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
</style>
</head>
<body>
<div class="page">
  <h1>🏴 Banksy Stencil</h1>
  <p class="sub">Click words to collect · Click ▶ to see the demo</p>
  <div class="m">
    <div class="mh"><span class="mn">V12b</span><span class="mt">Banksy Stencil</span><button class="play-btn" id="playBtn" onclick="toggleDemo()" title="Play demo">▶</button></div>
    <div class="mc"><div class="v12b" id="v12b"></div></div>
  </div>
</div>
<script>
var S=[
  'The weather today is quite lovely.',
  'Ik wil graag een kopje koffie alstublieft.',
  'The project deadline has been extended to Friday.',
  'We moeten nog even geduld hebben met de resultaten.',
  'She said she would call back within the hour.',
  'Het is vandaag echt prachtig weer buiten.',
  'Can you send me the document by email?',
  'Ik denk dat we morgen een beslissing kunnen nemen.',
  'The meeting room is on the third floor.',
  'Dat klinkt als een uitstekend plan voor vanavond.',
  'I really appreciate your help with this.',
  'Zij heeft gisteren nog gebeld over de afspraak.'
];
var body=document.getElementById('v12b'),playing=false,idx=0,timer=null,demoIdx=[0,5,8,11];
function toggleDemo(){if(playing){stopDemo();return}playing=true;idx=0;body.innerHTML='';document.getElementById('playBtn').textContent='⏹';document.getElementById('playBtn').classList.add('playing');advance()}
function stopDemo(){if(timer)clearTimeout(timer);playing=false;body.innerHTML='';document.getElementById('playBtn').textContent='▶';document.getElementById('playBtn').classList.remove('playing')}
function advance(){if(!playing)return;if(idx<demoIdx.length){var w=S[demoIdx[idx]].split(' ').slice(0,5);w.forEach(function(word,j){var span=document.createElement('span');span.className='v12bn';span.style.animationDelay=(j*0.35)+'s';span.textContent=word.toUpperCase();span.onclick=function(e){e.stopPropagation();this.classList.toggle('collected');showToast(this.classList.contains('collected')?'✓ Added: '+word:'Removed: '+word)};body.appendChild(span)});idx++;timer=setTimeout(advance,2400+Math.random()*1200)}else{timer=setTimeout(stopDemo,5000)}}
function showToast(msg){var t=document.createElement('div');t.className='v3toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},1600)}
</script>
</body>
</html>
