<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · 21 · Contextual Synonyms</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px}h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:2px}@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}.subtitle{text-align:center;color:#8b93a5;margin-bottom:20px;font-size:13px}.filters{display:flex;gap:8px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}.filter-btn{padding:8px 20px;border-radius:100px;border:1px solid #1a1e2e;background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);font-size:11px;font-weight:500;cursor:pointer;transition:all .25s;font-family:inherit}.filter-btn:hover{background:rgba(255,255,255,.06);border-color:#2a2e3e}.filter-btn.active{background:rgba(167,139,250,.12);border-color:#a78bfa;color:#c4b5fd;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:1100px;margin:0 auto}@media(max-width:700px){.grid{grid-template-columns:1fr}}.word-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:20px;transition:all .35s;animation:fadeInUp .5s ease both}.word-card:hover{transform:translateY(-4px);box-shadow:0 14px 44px rgba(0,0,0,.5);border-color:#2a2e3e}.word-card.hidden{display:none}.word-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}.word-main{font-size:20px;font-weight:800;color:#e8eaed;letter-spacing:-0.5px}.word-pos{font-size:10px;font-weight:600;padding:3px 10px;border-radius:100px}.pos-verb{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)}.pos-noun{background:rgba(96,165,250,.1);color:#60a5fa;border:1px solid rgba(96,165,250,.2)}.pos-adj{background:rgba(244,114,182,.1);color:#f472b6;border:1px solid rgba(244,114,182,.2)}.syn-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.syn-chip{padding:6px 14px;border-radius:100px;font-size:11px;font-weight:500;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.06)}.syn-chip:hover{background:rgba(167,139,250,.12);border-color:#a78bfa;color:#c4b5fd}.syn-chip.active{background:rgba(167,139,250,.18);border-color:#a78bfa;color:#c4b5fd;font-weight:700}.match-badge{font-size:9px;color:rgba(255,255,255,.3);margin-left:2px}.example-box{margin-top:8px;padding:12px 16px;background:rgba(0,0,0,.25);border-radius:10px;border:1px solid rgba(255,255,255,.04);font-size:12px;color:rgba(255,255,255,.55);line-height:1.6;min-height:44px;transition:all .3s}.example-box .hl{color:#a78bfa;font-weight:700}.example-empty{color:rgba(255,255,255,.2);font-style:italic}@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}</style></head><body><h1>📖 21 · Contextual Synonyms</h1><p class="subtitle">Smart Synonym Suggestions with Match % and Sample Sentences — June 2026</p><div class="filters"><button class="filter-btn active" data-pos="all">All</button><button class="filter-btn" data-pos="verb">Verbs</button><button class="filter-btn" data-pos="noun">Nouns</button><button class="filter-btn" data-pos="adj">Adjectives</button></div><div class="grid" id="wordGrid"></div><script>const words=[{word:'discussing',pos:'verb',posClass:'pos-verb',synonyms:[{word:'debating',match:96,ex:'We were <span class="hl">debating</span> the merits of the proposal for over an hour.'},{word:'examining',match:91,ex:'The committee is <span class="hl">examining</span> all possible options before deciding.'},{word:'exploring',match:87,ex:'They spent the afternoon <span class="hl">exploring</span> new approaches.'}]},{word:'important',pos:'adj',posClass:'pos-adj',synonyms:[{word:'crucial',match:95,ex:'This is a <span class="hl">crucial</span> step in the development process.'},{word:'significant',match:92,ex:'The discovery had a <span class="hl">significant</span> impact on the field.'},{word:'essential',match:89,ex:'Water is <span class="hl">essential</span> for all known forms of life.'},{word:'vital',match:85,ex:'Regular exercise is <span class="hl">vital</span> for maintaining good health.'}]},{word:'future',pos:'noun',posClass:'pos-noun',synonyms:[{word:'prospect',match:93,ex:'The <span class="hl">prospect</span> of working abroad excites her greatly.'},{word:'outlook',match:88,ex:'The economic <span class="hl">outlook</span> for next year appears promising.'},{word:'horizon',match:84,ex:'New opportunities are appearing on the <span class="hl">horizon</span>.'}]},{word:'create',pos:'verb',posClass:'pos-verb',synonyms:[{word:'generate',match:94,ex:'The campaign <span class="hl">generated</span> a lot of interest from investors.'},{word:'produce',match:90,ex:'The factory can <span class="hl">produce</span> over 500 units per day.'},{word:'devise',match:86,ex:'She <span class="hl">devised</span> a clever solution to the scheduling conflict.'}]},{word:'beautiful',pos:'adj',posClass:'pos-adj',synonyms:[{word:'stunning',match:97,ex:'The sunset was absolutely <span class="hl">stunning</span>.'},{word:'gorgeous',match:94,ex:'She wore a <span class="hl">gorgeous</span> dress.'},{word:'elegant',match:89,ex:'The <span class="hl">elegant</span> design attracted many visitors.'}]},{word:'understand',pos:'verb',posClass:'pos-verb',synonyms:[{word:'comprehend',match:96,ex:'It took him a while to fully <span class="hl">comprehend</span> the complexity.'},{word:'grasp',match:91,ex:'She quickly <span class="hl">grasped</span> the key concepts.'},{word:'perceive',match:86,ex:'How do you <span class="hl">perceive</span> the current situation?'}]},{word:'problem',pos:'noun',posClass:'pos-noun',synonyms:[{word:'issue',match:95,ex:'We need to address this <span class="hl">issue</span> before it escalates.'},{word:'challenge',match:92,ex:'The main <span class="hl">challenge</span> is finding qualified staff.'},{word:'obstacle',match:87,ex:'Lack of funding remains the biggest <span class="hl">obstacle</span>.'}]},{word:'quick',pos:'adj',posClass:'pos-adj',synonyms:[{word:'rapid',match:96,ex:'The company experienced <span class="hl">rapid</span> growth.'},{word:'swift',match:92,ex:'The government took <span class="hl">swift</span> action.'},{word:'brisk',match:87,ex:'We went for a <span class="hl">brisk</span> walk along the beach.'}]},{word:'help',pos:'verb',posClass:'pos-verb',synonyms:[{word:'assist',match:97,ex:'The tutor will <span class="hl">assist</span> you with any difficult problems.'},{word:'support',match:93,ex:'We need to <span class="hl">support</span> each other through hard times.'},{word:'facilitate',match:88,ex:'The new software will <span class="hl">facilitate</span> smoother communication.'}]},{word:'idea',pos:'noun',posClass:'pos-noun',synonyms:[{word:'concept',match:95,ex:'The <span class="hl">concept</span> of time travel has fascinated people for centuries.'},{word:'notion',match:90,ex:'She rejected the <span class="hl">notion</span> that success requires luck.'},{word:'thought',match:87,ex:'A sudden <span class="hl">thought</span> occurred to him during the meeting.'}]}];const grid=document.getElementById('wordGrid');const filterBtns=document.querySelectorAll('.filter-btn');let activeFilter='all';function renderCards(filter){grid.innerHTML='';words.forEach((w,i)=>{if(filter!=='all'&&w.pos!==filter)return;const card=document.createElement('div');card.className='word-card';card.style.animationDelay=(i*0.05)+'s';card.dataset.pos=w.pos;const synHTML=w.synonyms.map((s,si)=>`<span class="syn-chip" data-idx="${si}">${s.word}<span class="match-badge"> ${s.match}%</span></span>`).join('');card.innerHTML=`<div class="word-head"><span class="word-main">${w.word}</span><span class="word-pos ${w.posClass}">${w.pos.toUpperCase()}</span></div><div class="syn-chips">${synHTML}</div><div class="example-box"><span class="example-empty">Click a synonym to see it in context</span></div>`;card.querySelectorAll('.syn-chip').forEach(chip=>{chip.addEventListener('click',function(e){e.stopPropagation();const idx=parseInt(this.dataset.idx);const syn=w.synonyms[idx];const box=card.querySelector('.example-box');box.innerHTML=syn.ex;card.querySelectorAll('.syn-chip').forEach(c=>c.classList.remove('active'));this.classList.add('active')})});grid.appendChild(card)})}filterBtns.forEach(btn=>{btn.addEventListener('click',()=>{filterBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');activeFilter=btn.dataset.pos;renderCards(activeFilter)})});renderCards('all');</script></body></html>
