<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sottotitoli App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07111f;
      --bg2: #0c1b31;
      --card: #10233f;
      --text: #e6eefc;
      --muted: #9eb3d1;
      --line: #1f3a63;
      --accent: #3b82f6;
      --accent2: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .card {
      background: rgba(16,35,63,.85);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h1, h2 { margin-top: 0; }
    .btn {
      background: var(--accent);
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 10px;
    }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--line);
    }
    .panel {
      min-height: 120px;
      white-space: pre-wrap;
    }
    .line {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
    }
    a { color: var(--accent2); }
    pre {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: #d6e4ff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="meta" id="modeMeta">Live mode</div>
      <h1 id="modeTitle">Sottotitoli</h1>
      <p class="meta">Socket status: <span id="socketStatus">idle</span></p>
      <p class="meta">Overlay: <a id="overlayLink" target="_blank" rel="noopener noreferrer"></a></p>
      <button class="btn" id="startBtn">Start Microphone</button>
      <button class="btn secondary" id="stopBtn">Stop</button>
      <p class="meta" id="statusText">Ready</p>
    </div>

    <div class="card">
      <h2>Interim</h2>
      <div class="panel" id="interimOutput"></div>
    </div>

    <div class="card">
      <h2>Source Output</h2>
      <div class="panel" id="sourceOutput"></div>
    </div>

    <div class="card">
      <h2>Translated Output</h2>
      <div class="panel" id="translatedOutput"></div>
    </div>

    <div class="card" id="lessonActions" style="display:none;">
      <h2>Lesson Report</h2>
      <button class="btn" id="reportBtn">Generate Report</button>
      <pre id="lessonReport"></pre>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="ws-publisher.js"></script>
  <script src="translation-providers.js"></script>
  <script src="lesson-report.js"></script>
  <script src="app.js"></script>
</body>
</html>
