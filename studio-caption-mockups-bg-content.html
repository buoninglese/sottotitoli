<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · 10 Content-Aware BG Visuals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh;position:relative;transition:background .5s}
body.light{background:#fafaf8;color:#1a1a1a}
body.dark{background:#060610;color:#e8eaed}
#bgCanvas{position:fixed;inset:0;z-index:0}
#centerBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;background:rgba(15,18,30,.88);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:32px 36px;max-width:420px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
body.light #centerBox{background:rgba(255,255,255,.88);border-color:rgba(0,0,0,.06);box-shadow:0 8px 40px rgba(0,0,0,.1)}
#centerBox h2{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
#centerBox p{font-size:13px;line-height:1.7;opacity:.65;margin-bottom:14px}
#centerBox .tag{display:inline-block;padding:4px 12px;border-radius:100px;font-size:10px;font-weight:600;margin:2px}
body.dark #centerBox .tag{background:rgba(255,255,255,.05);color:rgba(255,255,255,.45)}
body.light #centerBox .tag{background:rgba(0,0,0,.04);color:rgba(0,0,0,.45)}
#controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{padding:9px 16px;border-radius:100px;border:1.5px solid;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:all .2s}
body.light .btn{background:#fff;color:#666;border-color:#d9d5cc}
body.light .btn:hover{background:#f5f3ef;color:#1a1a1a;border-color:#c5c0b8}
body.dark .btn{background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.1)}
body.dark .btn:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
.btn.on{background:rgba(167,139,250,.12)!important;border-color:rgba(167,139,250,.3)!important;color:#a78bfa!important}
.btn.var-nav{width:28px;height:28px;border-radius:50%;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center}
.var-label{font-family:'JetBrains Mono',monospace;font-size:9px;min-width:80px;text-align:center}
body.dark .var-label{color:rgba(255,255,255,.3)}
body.light .var-label{color:rgba(0,0,0,.3)}

/* Audio controls */
.meter-row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.meter-bar{width:100px;height:2px;border-radius:1px;overflow:hidden}
body.light .meter-bar{background:rgba(0,0,0,.06)}
body.dark .meter-bar{background:rgba(255,255,255,.06)}
.meter-fill{height:100%;border-radius:1px;transition:width .1s;width:0%}
body.light .meter-fill{background:#5b7fc1}
body.dark .meter-fill{background:linear-gradient(90deg,#34d399,#a78bfa)}
.meter-label{font-family:'JetBrains Mono',monospace;font-size:8px;opacity:.3;min-width:40px}
.sens-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.sens-row label{font-size:8px;opacity:.3;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.sens-slider{-webkit-appearance:none;appearance:none;width:80px;height:3px;border-radius:2px;outline:none;cursor:pointer}
body.light .sens-slider{background:rgba(0,0,0,.08)}
body.dark .sens-slider{background:rgba(255,255,255,.08)}
.sens-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;cursor:pointer;border:1.5px solid}
body.light .sens-slider::-webkit-slider-thumb{background:#fff;border-color:#c5c0b8}
body.dark .sens-slider::-webkit-slider-thumb{background:#1a1a2e;border-color:rgba(255,255,255,.2)}
.btn.mic-on{background:rgba(239,68,68,.15)!important;border-color:rgba(239,68,68,.3)!important;color:#ef4444!important;animation:micPulse 1.5s ease infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.fx-val{font-size:8px;opacity:.25;font-family:'JetBrains Mono',monospace;min-width:36px;text-align:center}
</style>
</head>
<body class="dark" id="bodyEl">
<canvas id="bgCanvas"></canvas>
<div id="centerBox">
  <h2>Sottotitoli</h2>
  <p>Trascrizione e traduzione in tempo reale. Le parole che contano, senza distrazioni.</p>
  <div>
    <span class="tag">🇮🇹 Italiano</span>
    <span class="tag">⚡ 87 WPM</span>
    <span class="tag">🎯 CEFR B2</span>
    <span class="tag">📊 2.4h / settimana</span>
  </div>
</div>
<!-- Audio meter + sensitivity -->
<div style="position:fixed;top:50%;left:20px;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:6px">
  <span class="meter-label" id="meterLabel" style="min-width:auto">— dB</span>
  <div class="meter-bar" style="width:3px;height:120px;border-radius:2px;position:relative">
    <div class="meter-fill" id="meterFill" style="position:absolute;bottom:0;left:0;width:100%;height:0%;transition:height .1s"></div>
  </div>
</div>

<div id="controls">
  <!-- Audio row -->
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="btnMic" onclick="toggleMic()">🎤 Start Mic</button>
    <button class="btn" id="btnSys" onclick="toggleSysAudio()">💻 System Audio</button>
    <div class="sens-row" style="margin-top:0">
      <label for="sensSlider">sens</label>
      <input type="range" class="sens-slider" id="sensSlider" min="0.1" max="20" step="0.1" value="1" oninput="updateSensitivity(this.value)">
      <span class="meter-label" id="sensLabel">1.0x</span>
    </div>
  </div>
  <!-- FX toggles -->
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="btnSlow" onclick="toggleFX('slow')">🐢 Slow</button>
    <button class="btn" id="btnBoost" onclick="toggleFX('boost')">📢 Boost</button>
    <button class="btn" id="btnBreath" onclick="toggleFX('breath')">🫁 Breath</button>
    <button class="btn" id="btnDemoMax" onclick="toggleDemoMax()" style="border-color:rgba(251,191,36,.3);color:var(--amber)">✨ Demo Max</button>
    <span class="fx-val" id="fxSlowVal">1×</span>
    <span class="fx-val" id="fxBoostVal">off</span>
    <span class="fx-val" id="fxBreathVal">off</span>
  </div>
  <!-- Nav + theme -->
  <button class="btn var-nav" onclick="prevVar()">←</button>
  <span class="var-label" id="varLabel">1/10</span>
  <button class="btn var-nav" onclick="nextVar()">→</button>
  <button class="btn on" id="btnDark" onclick="setTheme('dark')">Dark</button>
  <button class="btn" id="btnLight" onclick="setTheme('light')">Light</button>
  <span id="varName" style="font-size:10px;opacity:.4;margin-left:4px"></span>
</div>
<script>
// ─── Audio Engine ───
var audioCtx=null,analyser=null,micStream=null,sysStream=null,micOn=false,sysOn=false;
var freqData=null,volume=0,smoothedVol=0,sensitivity=1.0;

// FX state
var fx={slow:{on:false,val:1},boost:{on:false,val:1},breath:{on:false,val:0}};

var demoMaxOn=false;
function toggleDemoMax(){
  demoMaxOn=!demoMaxOn;
  var btn=document.getElementById('btnDemoMax');
  if(demoMaxOn){
    btn.textContent='✨ Demo Max ON';
    btn.style.background='rgba(251,191,36,.15)';
    btn.style.borderColor='rgba(251,191,36,.5)';
    sensitivity=10;
    document.getElementById('sensSlider').value=10;
    document.getElementById('sensLabel').textContent='10.0x';
  }else{
    btn.textContent='✨ Demo Max';
    btn.style.background='';
    btn.style.borderColor='rgba(251,191,36,.3)';
    sensitivity=1;
    document.getElementById('sensSlider').value=1;
    document.getElementById('sensLabel').textContent='1.0x';
  }
}

function toggleFX(name){
  var btn=document.getElementById(name==='slow'?'btnSlow':name==='boost'?'btnBoost':'btnBreath');
  var valEl=document.getElementById(name==='slow'?'fxSlowVal':name==='boost'?'fxBoostVal':'fxBreathVal');
  if(name==='slow'){fx.slow.on=!fx.slow.on;btn.className=fx.slow.on?'btn on':'btn';valEl.textContent=fx.slow.on?'0.3×':'1×'}
  else if(name==='boost'){fx.boost.on=!fx.boost.on;btn.className=fx.boost.on?'btn on':'btn';valEl.textContent=fx.boost.on?'3×':'off'}
  else{fx.breath.on=!fx.breath.on;btn.className=fx.breath.on?'btn on':'btn';valEl.textContent=fx.breath.on?'on':'off'}
}

function initAudio(){
  if(audioCtx)return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=0.65;
  freqData=new Uint8Array(analyser.frequencyBinCount);
}

function readAudio(){
  if(!analyser||!micOn)return;
  analyser.getByteFrequencyData(freqData);
  var sum=0;for(var i=0;i<freqData.length;i++)sum+=freqData[i];
  volume=sum/freqData.length/255;
  // Apply FX
  if(fx.slow.on)volume=smoothedVol+(volume-smoothedVol)*0.3;
  if(fx.boost.on)volume=Math.min(1,volume*3);
  if(fx.breath.on)volume=Math.max(0,volume-0.02)*(volume>0.02?1:0.1);
  smoothedVol=smoothedVol+(volume-smoothedVol)*0.3;
  document.getElementById('meterFill').style.height=(smoothedVol*100)+'%';
  document.getElementById('meterLabel').textContent=Math.round(smoothedVol*100-50)+' dB';
}

function toggleMic(){
  if(micOn){stopMic();return}
  initAudio();
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(s){
    micStream=s;var src=audioCtx.createMediaStreamSource(s);src.connect(analyser);
    micOn=true;document.getElementById('btnMic').textContent='⏹ Stop Mic';
    document.getElementById('btnMic').classList.add('mic-on');
  }).catch(function(){startDemoMode()});
}

function stopMic(){
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}
  if(sysStream){sysStream.getTracks().forEach(function(t){t.stop()});sysStream=null;sysOn=false}
  micOn=false;document.getElementById('btnMic').textContent='🎤 Start Mic';
  document.getElementById('btnMic').classList.remove('mic-on');
  document.getElementById('btnSys').textContent='💻 System Audio';
  document.getElementById('btnSys').classList.remove('mic-on');
}

function toggleSysAudio(){
  if(sysOn){stopMic();return}
  initAudio();
  navigator.mediaDevices.getDisplayMedia({audio:true}).then(function(s){
    s.getVideoTracks().forEach(function(t){t.stop()});
    var at=s.getAudioTracks();if(at.length===0){alert('Seleziona una scheda con audio');s.getTracks().forEach(function(t){t.stop()});return}
    sysStream=s;var src=audioCtx.createMediaStreamSource(s);src.connect(analyser);
    sysOn=true;micOn=true;
    document.getElementById('btnSys').textContent='⏹ Stop System';
    document.getElementById('btnSys').classList.add('mic-on');
  }).catch(function(e){
    navigator.mediaDevices.getDisplayMedia({audio:true,video:true}).then(function(s){
      s.getVideoTracks().forEach(function(t){t.stop()});
      var at=s.getAudioTracks();if(at.length===0){alert('Seleziona una scheda con audio');s.getTracks().forEach(function(t){t.stop()});return}
      sysStream=s;var src=audioCtx.createMediaStreamSource(s);src.connect(analyser);
      sysOn=true;micOn=true;
      document.getElementById('btnSys').textContent='⏹ Stop System';
      document.getElementById('btnSys').classList.add('mic-on');
    }).catch(function(e2){console.log('denied:',e2)});
  });
}

function startDemoMode(){
  micOn=true;document.getElementById('btnMic').textContent='🎤 Demo Mic';
  document.getElementById('btnMic').classList.add('mic-on');
  // Generate fake volume
  if(window._demoInt)clearInterval(window._demoInt);
  window._demoInt=setInterval(function(){if(!micOn){clearInterval(window._demoInt);return}volume=0.1+Math.random()*0.3;smoothedVol=smoothedVol+(volume-smoothedVol)*0.3},100);
}

// ─── Canvas ───
var canvas,ctx,W,H,t=0,animFrame,currentVar=0;
var variations=[
  { name:'Particle Drift', emoji:'🌫️', desc:'Gentle floating dots · dust motes in light',
    init:function(c){this.pts=[];for(var i=0;i<60;i++)this.pts.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.5,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,o:.08+Math.random()*.12})},
    draw:function(ctx,ts,dark,vol){ctx.clearRect(0,0,W,H);var c=dark?'255,255,255':'100,100,120';var m=vol?Math.max(0.5,vol*3):1;for(var i=0;i<this.pts.length;i++){var p=this.pts[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba('+c+','+(p.o*m)+')';ctx.fill()}}
  },
  { name:'Radial Glow', emoji:'🫁', desc:'Soft pulsing glow from center',
    init:function(c){},
    draw:function(ctx,ts,dark){ctx.clearRect(0,0,W,H);var cx=W/2,cy=H/2;var r1=Math.min(W,H)*.35+Math.sin(ts*.0008)*40;var r2=r1+80+Math.sin(ts*.001)*30;var g=ctx.createRadialGradient(cx,cy,r1*.3,cx,cy,r2);if(dark){g.addColorStop(0,'rgba(167,139,250,'+(.06+Math.sin(ts*.0008)*.03)+')');g.addColorStop(.5,'rgba(99,102,241,.03)');g.addColorStop(1,'rgba(6,6,16,0)')}else{g.addColorStop(0,'rgba(124,58,237,'+(.04+Math.sin(ts*.0008)*.02)+')');g.addColorStop(.5,'rgba(99,102,241,.02)');g.addColorStop(1,'rgba(250,250,248,0)')};ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  },
  { name:'Corner Nebulae', emoji:'✨', desc:'Soft color clouds in corners only',
    init:function(c){},
    draw:function(ctx,ts,dark){ctx.clearRect(0,0,W,H);var corners=[[80,80],[W-80,80],[80,H-80],[W-80,H-80]];var hues=[260,200,160,300];for(var i=0;i<4;i++){var cx=corners[i][0],cy=corners[i][1];var r=100+Math.sin(ts*.001+i)*20;var g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'hsla('+hues[i]+',50%,'+(dark?65:45)+'%,.08)');g.addColorStop(1,'hsla('+hues[i]+',50%,'+(dark?65:45)+'%,0)');ctx.fillStyle=g;ctx.fillRect(cx-r*1.5,cy-r*1.5,r*3,r*3)}}
  },
  { name:'Edge Bars', emoji:'🎨', desc:'Subtle color at screen edges',
    init:function(c){},
    draw:function(ctx,ts,dark){ctx.clearRect(0,0,W,H);var barH=H*.06;['top','bottom'].forEach(function(edge,i){var g=ctx.createLinearGradient(0,edge==='top'?0:H-barH,0,edge==='top'?barH:H);g.addColorStop(0,'hsla('+(250+i*30)+',50%,'+(dark?60:40)+'%,.12)');g.addColorStop(1,'hsla('+(250+i*30)+',50%,'+(dark?60:40)+'%,0)');ctx.fillStyle=g;ctx.fillRect(0,edge==='top'?0:H-barH,W,barH)})}
  },
  { name:'Floating Orbs', emoji:'🫧', desc:'Large slow blurred circles',
    init:function(c){this.orbs=[];for(var i=0;i<4;i++)this.orbs.push({x:Math.random()*W,y:Math.random()*H,r:100+Math.random()*140,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,o:.04+Math.random()*.05,h:[260,200,160,320][i]})},
    draw:function(ctx,ts,dark){ctx.clearRect(0,0,W,H);for(var i=0;i<this.orbs.length;i++){var o=this.orbs[i];o.x+=o.vx;o.y+=o.vy;if(o.x<-o.r)o.x=W+o.r;if(o.x>W+o.r)o.x=-o.r;if(o.y<-o.r)o.y=H+o.r;if(o.y>H+o.r)o.y=-o.r;var g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);g.addColorStop(0,'hsla('+o.h+',50%,'+(dark?65:45)+'%,'+o.o+')');g.addColorStop(1,'hsla('+o.h+',50%,'+(dark?65:45)+'%,0)');ctx.fillStyle=g;ctx.fillRect(o.x-o.r*2,o.y-o.r*2,o.r*4,o.r*4)}}
  },
  { name:'Gradient Shift', emoji:'🌅', desc:'Slow color temperature drift',
    init:function(c){},
    draw:function(ctx,ts,dark){ctx.clearRect(0,0,W,H);var h=240+Math.sin(ts*.0006)*20;var g=ctx.createLinearGradient(0,0,0,H);if(dark){g.addColorStop(0,'hsla('+h+',20%,5%,1)');g.addColorStop(.5,'hsla('+(h+15)+',15%,4%,1)');g.addColorStop(1,'hsla('+(h-10)+',18%,3%,1)')}else{g.addColorStop(0,'hsla('+(30+h/10)+',12%,95%,1)');g.addColorStop(.5,'hsla('+(35+h/10)+',8%,93%,1)');g.addColorStop(1,'hsla('+(25+h/10)+',10%,96%,1)')};ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  },
  { name:'Wave Grid', emoji:'〰️', desc:'Faint undulating horizontal lines',
    init:function(c){},
    draw:function(ctx,ts,dark){ctx.clearRect(0,0,W,H);var c=dark?'255,255,255':'0,0,0';ctx.strokeStyle='rgba('+c+',.04)';ctx.lineWidth=1;for(var y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);for(var x=0;x<=W;x+=20){ctx.lineTo(x,y+Math.sin((x+ts*.04)*.008)*6+Math.cos((x-ts*.03)*.006)*4)}ctx.stroke()}}
  },
  { name:'Dot Field', emoji:'🔘', desc:'Staggered dot pattern texture',
    init:function(c){},
    draw:function(ctx,ts,dark){ctx.clearRect(0,0,W,H);var spacing=32;var off=Math.sin(ts*.001)*4;var c=dark?'255,255,255':'0,0,0';for(var y=0;y<H+spacing;y+=spacing){var rowOff=(Math.floor(y/spacing)%2)*(spacing/2);for(var x=rowOff;x<W+spacing;x+=spacing){ctx.beginPath();ctx.arc(x+off*Math.cos(y*.01)*.5,y+off*Math.sin(x*.01)*.5,1.2,0,Math.PI*2);ctx.fillStyle='rgba('+c+',.05)';ctx.fill()}}}
  },
  { name:'Aurora Light', emoji:'🌌', desc:'Very faint aurora bands',
    init:function(c){},
    draw:function(ctx,ts,dark){ctx.clearRect(0,0,W,H);for(var i=0;i<3;i++){var baseY=H*(.3+i*.15);var amp=80+i*20;ctx.beginPath();ctx.moveTo(0,H);for(var x=0;x<=W;x+=10){var y=baseY+Math.sin((x+ts*.03+i*100)*.003)*amp+Math.cos((x-ts*.02+i*60)*.005)*amp*.4;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();var g=ctx.createLinearGradient(0,baseY-amp,0,baseY+amp);g.addColorStop(0,'hsla('+(250+i*20)+',50%,'+(dark?60:40)+'%,.04)');g.addColorStop(.5,'hsla('+(250+i*20)+',50%,'+(dark?60:40)+'%,.02)');g.addColorStop(1,'hsla('+(250+i*20)+',50%,'+(dark?60:40)+'%,0)');ctx.fillStyle=g;ctx.fill()}}
  },
  { name:'Ring Pulse', emoji:'◎', desc:'Concentric rings from center',
    init:function(c){this.rings=[]},
    draw:function(ctx,ts,dark){ctx.clearRect(0,0,W,H);if(ts%180<16)this.rings.push({r:0,o:.07});var cx=W/2,cy=H/2,maxR=Math.max(W,H)*.8;for(var i=this.rings.length-1;i>=0;i--){var r=this.rings[i];r.r+=.4;r.o-=.0002;if(r.o<=0||r.r>maxR){this.rings.splice(i,1);continue}var g=ctx.createRadialGradient(cx,cy,Math.max(0,r.r-25),cx,cy,r.r);g.addColorStop(0,'rgba(167,139,250,0)');g.addColorStop(.5,'rgba(167,139,250,'+r.o+')');g.addColorStop(1,'rgba(167,139,250,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}}
  }
];
function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;variations.forEach(function(v){if(v.init)v.init()})}
function setTheme(th){document.getElementById('bodyEl').className=th;document.getElementById('btnDark').className=th==='dark'?'btn on':'btn';document.getElementById('btnLight').className=th==='light'?'btn on':'btn'}
function prevVar(){currentVar=(currentVar+variations.length-1)%variations.length;updateLabel()}
function nextVar(){currentVar=(currentVar+1)%variations.length;updateLabel()}
function updateLabel(){var v=variations[currentVar];document.getElementById('varLabel').textContent=(currentVar+1)+'/'+variations.length;document.getElementById('varName').textContent=v.emoji+' '+v.name+' — '+v.desc;if(v.init)v.init()}
function draw(ts){
  t=ts;
  if(micOn){readAudio()}else{
    // Rest-state: gentle breathing volume
    smoothedVol=0.06+Math.sin(ts/1800)*0.04+Math.sin(ts/3100)*0.03+Math.sin(ts/5200)*0.02;
  }
  var v=variations[currentVar];
  var dark=document.getElementById('bodyEl').className==='dark';
  var vol=Math.max(0.04, smoothedVol*sensitivity);
  v.draw(ctx,ts,dark,vol);
  // Update meter
  document.getElementById('meterFill').style.height=(smoothedVol*150)+'%';
