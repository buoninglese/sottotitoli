<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · Radial Wave Variations</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px}h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:2px}@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}.subtitle{text-align:center;color:#8b93a5;margin-bottom:28px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;max-width:1300px;margin:0 auto}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.grid{grid-template-columns:repeat(2,1fr)}}.radial-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:20px 14px;text-align:center;transition:all .3s;display:flex;flex-direction:column;align-items:center;gap:8px}.radial-card:hover{transform:translateY(-4px);box-shadow:0 14px 40px rgba(0,0,0,.5);border-color:#2a2e3e}.radial-viz{position:relative;display:flex;align-items:center;justify-content:center}.radial-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.45)}.radial-size{font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(255,255,255,.15)}@keyframes barDance{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}</style></head><body><h1>🔘 Radial Wave · 10 Variations</h1><p class="subtitle">Different sizes, densities, colors, and animations — June 2026</p><div class="grid" id="radialGrid"></div><script>
function hsl(h,s,l,a){return a!==undefined?`hsla(${h},${s}%,${l}%,${a})`:`hsl(${h},${s}%,${l}%)`}

var radials=[
  {n:1,name:'Compact · 24 spokes',size:60,spokes:24,anim:true,hue:260,label:'Small dense'},
  {n:2,name:'Medium · 36 spokes',size:80,spokes:36,anim:true,hue:200,label:'Standard'},
  {n:3,name:'Large · 48 spokes',size:110,spokes:48,anim:true,hue:160,label:'Full spectrum'},
  {n:4,name:'Sparse · 16 spokes',size:90,spokes:16,anim:false,hue:320,label:'Minimal'},
  {n:5,name:'Extra Dense · 72 spokes',size:100,spokes:72,anim:true,hue:40,label:'High density'},
  {n:6,name:'Tiny · 12 spokes',size:44,spokes:12,anim:true,hue:180,label:'Micro'},
  {n:7,name:'Wide · 24 spokes gap',size:120,spokes:24,anim:true,hue:280,label:'Spaced out'},
  {n:8,name:'Double Layer',size:90,spokes:36,anim:true,hue:200,label:'Inner+outer'},
  {n:9,name:'Spinning · 36 spokes',size:80,spokes:36,anim:false,hue:100,label:'Rotating'},
  {n:10,name:'Gradient · 48 spokes',size:100,spokes:48,anim:true,hue:0,label:'Rainbow'}
];

var grid=document.getElementById('radialGrid');
radials.forEach(function(r){
  var card=document.createElement('div');card.className='radial-card';
  var svgSize=r.size+20;
  var h='<div class="radial-viz"><svg viewBox="0 0 '+svgSize+' '+svgSize+'" style="width:'+svgSize+'px;height:'+svgSize+'px">';
  var cx=svgSize/2,cy=svgSize/2;

  // Double layer for #8
  if(r.n===8){
    // Outer ring
    for(var i=0;i<r.spokes;i++){var angle=(i/r.spokes)*360;var len=14+Math.sin(i*0.5)*10;var hue=r.hue+i*8;h+='<line x1="'+cx+'" y1="'+(cy-20)+'" x2="'+cx+'" y2="'+(cy-20-len)+'" stroke="'+hsl(hue%360,60,60)+'" stroke-width="1.5" transform="rotate('+angle+' '+cx+' '+cy+')" opacity="0.7"/>'}
    // Inner ring
    for(var i=0;i<18;i++){var angle=(i/18)*360;var len=6+Math.sin(i*0.8)*6;h+='<line x1="'+cx+'" y1="'+(cy-10)+'" x2="'+cx+'" y2="'+(cy-10-len)+'" stroke="'+hsl(r.hue+180,60,60)+'" stroke-width="2" transform="rotate('+angle+' '+cx+' '+cy+')" opacity="0.9"/>'}
  }else{
    for(var i=0;i<r.spokes;i++){
      var angle=(i/r.spokes)*360;var len=8+Math.sin(i*(r.spokes/40))*18;
      var hue=r.n===10?i*7.5:r.hue+i*(r.n===7?12:6);
      var anim=r.anim?' animation:barDance '+(0.5+(i%8)*0.08)+'s ease infinite;animation-delay:'+(i*0.02)+'s':'';
      h+='<line x1="'+cx+'" y1="'+(cy-6)+'" x2="'+cx+'" y2="'+(cy-6-len)+'" stroke="'+hsl(hue%360,65,58)+'" stroke-width="'+(r.spokes>48?1:1.8)+'" transform="rotate('+angle+' '+cx+' '+cy+')" opacity="0.75" style="'+anim+'"/>';
    }
  }

  // Center dot
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r.spokes>48?3:4)+'" fill="'+hsl(r.hue,70,70)+'" opacity="0.9"/>';
  if(r.n===9)h+='<animateTransform attributeName="transform" type="rotate" from="0 '+cx+' '+cy+'" to="360 '+cx+' '+cy+'" dur="8s" repeatCount="indefinite"/>';

  h+='</svg></div>';
  h+='<div class="radial-label">'+r.name+'</div><div class="radial-size">'+r.label+' · '+r.size+'px</div>';
  card.innerHTML=h;grid.appendChild(card);
});
</script></body></html>
