<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · Radial Wave · Speakers</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px}h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:2px}@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}.subtitle{text-align:center;color:#8b93a5;margin-bottom:20px;font-size:13px}.speaker-btns{display:flex;gap:6px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}.spk-btn{padding:8px 16px;border-radius:100px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);color:rgba(255,255,255,.4);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}.spk-btn:hover{border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.7)}.spk-btn.active{background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.3);color:#c4b5fd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1000px;margin:0 auto}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}.radial-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:20px;text-align:center;transition:all .3s;display:flex;flex-direction:column;align-items:center;gap:8px}.radial-card:hover{transform:translateY(-4px);box-shadow:0 14px 40px rgba(0,0,0,.5);border-color:#2a2e3e}.radial-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.45)}.radial-info{font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(255,255,255,.15)}@keyframes barDance{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}</style></head><body><h1>🔘 Radial Wave · Multi-Speaker</h1><p class="subtitle">Wider & chubbier — how the radial visualization changes with 1 to 6 speakers</p><div class="speaker-btns" id="spkBtns"><button class="spk-btn active" data-n="1">1 SPK</button><button class="spk-btn" data-n="2">2 SPK</button><button class="spk-btn" data-n="3">3 SPK</button><button class="spk-btn" data-n="4">4 SPK</button><button class="spk-btn" data-n="5">5 SPK</button><button class="spk-btn" data-n="6">6 SPK</button></div><div class="grid" id="radialGrid"></div><script>
var SPK_COLORS=['#6b9dff','#f87171','#34d399','#fbbf24','#f472b6','#a78bfa'];
var currentSpeakers=1;

function hsl(h,s,l,a){return a!==undefined?`hsla(${h},${s}%,${l}%,${a})`:`hsl(${h},${s}%,${l}%)`}

var radials=[
  {n:1,name:'Compact Dense',spokes:28,size:130,inner:16,thick:true},
  {n:2,name:'Wide Burst',spokes:22,size:150,inner:12,thick:true},
  {n:3,name:'Chubby Spokes',spokes:16,size:140,inner:20,thick:true},
  {n:4,name:'Tight Cluster',spokes:36,size:120,inner:10,thick:false},
  {n:5,name:'Full Bloom',spokes:24,size:160,inner:18,thick:true},
  {n:6,name:'Double Ring',spokes:20,size:135,inner:14,thick:true},
];

function buildRadial(r,spkCount){
  var svgSize=r.size+40;var cx=svgSize/2,cy=svgSize/2;var h='';
  for(var s=0;s<spkCount;s++){
    var color=SPK_COLORS[s];var baseAngle=(s/spkCount)*360;
    for(var i=0;i<r.spokes;i++){
      var angle=baseAngle+(i/r.spokes)*(360/spkCount);
      var len=r.inner+Math.sin(i*(r.spokes/30))*(r.size/2-r.inner-4);
      var anim='animation:barDance '+(0.4+(i%6)*.06)+'s ease infinite;animation-delay:'+(i*.015+s*.12)+'s';
      h+='<line x1="'+cx+'" y1="'+(cy-4)+'" x2="'+cx+'" y2="'+(cy-4-len)+'" stroke="'+color+'" stroke-width="'+(r.thick?4:2.5)+'" stroke-linecap="round" transform="rotate('+angle+' '+cx+' '+cy+')" opacity="0.8" style="'+anim+'"/>';
    }
  }
  // Center
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(spkCount>3?6:5)+'" fill="#fff" opacity="0.9"/>';
  return'<svg viewBox="0 0 '+svgSize+' '+svgSize+'" style="width:'+svgSize+'px;height:'+svgSize+'px">'+h+'</svg>';
}

function renderAll(spkCount){
  var grid=document.getElementById('radialGrid');grid.innerHTML='';
  radials.forEach(function(r){
    var card=document.createElement('div');card.className='radial-card';
    card.innerHTML='<div>'+buildRadial(r,spkCount)+'</div><div class="radial-label">'+r.name+'</div><div class="radial-info">'+r.spokes+' spokes · '+spkCount+' speaker'+(spkCount>1?'s':'')+'</div>';
    grid.appendChild(card);
  });
}

document.getElementById('spkBtns').addEventListener('click',function(e){
  if(e.target.classList.contains('spk-btn')){
    document.querySelectorAll('.spk-btn').forEach(function(b){b.classList.remove('active')});
    e.target.classList.add('active');
    currentSpeakers=parseInt(e.target.dataset.n);
    renderAll(currentSpeakers);
  }
});

renderAll(1);
</script></body></html>
