<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sebastian's VA · Voice Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0f1e; --text: #f1f5f9; --text-dim: #94a3b8; --card: #111827; --line: rgba(255,255,255,.08); --green: #10b981; --green-bg: rgba(16,185,129,.1); }
    [data-theme="light"] { --bg: #f0f2f5; --text: #111827; --text-dim: #6b7280; --card: #fff; --line: #e2e8f0; --green-bg: rgba(16,185,129,.08); }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 16px 20px;
      transition: background 0.3s;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 0 10px; padding: 0 4px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-dim); text-decoration: none; }
    .brand:hover { color: var(--text); }
    .brand-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px rgba(16,185,129,.5); animation: pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--green-bg); color: var(--green); margin-left: 6px; }
    .theme-toggle { padding: 6px 12px; border: 1px solid rgba(255,255,255,.1); border-radius: 999px; background: transparent; color: var(--text-dim); font-size: 13px; cursor: pointer; transition: all .2s; }
    .theme-toggle:hover { color: var(--text); border-color: rgba(255,255,255,.2); }

    .main-layout { display: flex; gap: 20px; margin: 0; align-items: flex-start; }
    .voice-card { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,.4); }
    [data-theme="light"] .voice-card { box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .voice-frame { display: block; width: 100%; height: calc(100vh - 90px); min-height: 550px; border: none; }
    .status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 20px; font-size: 12px; color: var(--text-dim); background: rgba(255,255,255,.02); border-top: 1px solid var(--line); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .status-dot.ok { background: var(--green); box-shadow: 0 0 6px rgba(16,185,129,.5); }
    .status-dot.warn { background: #f59e0b; box-shadow: 0 0 6px rgba(245,158,11,.5); animation: pulse-dot 1.5s infinite; }
    .status-dot.error { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,.5); }
    .selected-voice { font-weight: 600; color: var(--green); }

    /* Voice grid sidebar */
    .voice-sidebar { width: 320px; flex-shrink: 0; max-height: calc(100vh - 90px); overflow-y: auto; }
    .voice-section { margin-bottom: 16px; }
    .voice-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: 8px; padding-left: 4px; }
    .voice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .voice-chip {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-radius: 12px;
      border: 1.5px solid var(--line); background: var(--card);
      cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500;
      color: var(--text); transition: all .15s; text-align: left;
      user-select: none;
    }
    .voice-chip:hover { border-color: var(--green); background: var(--green-bg); }
    .voice-chip.active { border-color: var(--green); background: var(--green-bg); box-shadow: 0 0 0 2px rgba(16,185,129,.15); }
    .voice-chip.featured { border-color: rgba(245,158,11,.4); background: linear-gradient(135deg, rgba(245,158,11,.08), rgba(245,158,11,.02)); }
    .voice-chip.featured:hover { border-color: #f59e0b; background: linear-gradient(135deg, rgba(245,158,11,.15), rgba(245,158,11,.04)); }
    .voice-chip.featured.active { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,.2); }
    .voice-chip-gender { font-size: 14px; flex-shrink: 0; }
    .voice-chip-name { font-weight: 600; }
    .voice-chip-lang { font-size: 10px; color: var(--text-dim); }
    .voice-chip-play {
      margin-left: auto; flex-shrink: 0;
      width: 28px; height: 28px; border-radius: 50%;
      border: 1.5px solid var(--line); background: transparent;
      color: var(--text-dim); font-size: 11px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s; padding: 0;
    }
    .voice-chip-play:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }
    .voice-chip-play.playing { border-color: var(--green); color: var(--green); background: var(--green-bg); animation: spin-play 0.8s linear infinite; }
    @keyframes spin-play { to { transform: rotate(360deg); } }
    .voice-preview-status { text-align: center; font-size: 11px; color: var(--text-dim); padding: 4px; min-height: 20px; }

    .footer { text-align: center; margin-top: 10px; font-size: 12px; color: var(--text-dim); opacity: 0.6; }
    .footer a { color: inherit; }

    @media (max-width: 900px) {
      .main-layout { flex-direction: column-reverse; }
      .voice-sidebar { width: 100%; max-height: none; }
      .voice-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
    @media (max-width: 600px) {
      body { padding: 8px; }
      .voice-card { border-radius: 16px; }
      .voice-frame { height: 70vh; max-height: none; min-height: 400px; }
    }

    /* Mood presets */
    .mood-grid { display: flex; flex-direction: column; gap: 5px; }
    .mood-chip {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-radius: 10px;
      border: 1.5px solid var(--line); background: var(--card);
      cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 500;
      color: var(--text); transition: all .15s; text-align: left;
    }
    .mood-chip:hover { border-color: var(--cyan); background: rgba(6,182,212,.05); }
    .mood-chip.active { border-color: var(--cyan); background: rgba(6,182,212,.1); box-shadow: 0 0 0 2px rgba(6,182,212,.12); }
    .mood-chip-emoji { font-size: 16px; flex-shrink: 0; width: 22px; text-align: center; }
    .mood-chip-name { font-weight: 600; }
    .mood-chip-desc { font-size: 10px; color: var(--text-dim); }

    /* Voice parameters */
    .param-group { padding: 4px 0; }
    .param-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .param-label { font-size: 11px; color: var(--text-dim); font-weight: 500; }
    .param-val { font-size: 11px; color: var(--cyan); font-weight: 700; font-variant-numeric: tabular-nums; }
    .param-slider {
      -webkit-appearance: none; width: 100%; height: 5px;
      border-radius: 99px; background: var(--line); outline: none;
    }
    .param-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: var(--cyan); cursor: pointer;
      border: 2px solid var(--card); box-shadow: 0 0 6px rgba(6,182,212,.3);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="#"><span class="brand-dot"></span>Sebastian's VA<span class="badge">KOKORO · 12 voci</span></a>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="userChip" style="font-size:12px;color:var(--text-dim);cursor:pointer" onclick="handleAuth()" title="Accedi">🔐 Accedi</span>
      <span style="font-size:12px;color:var(--text-dim)">Voce: <span class="selected-voice" id="currentVoiceLabel">am_santa</span></span>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️</button>
    </div>
  </div>

  <div class="main-layout">
    <!-- Voice grid sidebar -->
    <aside class="voice-sidebar" id="voiceSidebar">
      <div class="voice-section" id="voiceGridContainer"></div>
      <!-- Mood presets -->
      <div class="voice-section">
        <div class="voice-section-title">🎭 Mood · Stile</div>
        <div class="mood-grid" id="moodGrid"></div>
      </div>
      <!-- Voice parameters -->
      <div class="voice-section">
        <div class="voice-section-title">🎚️ Parametri Voce</div>
        <div class="param-group">
          <div class="param-row">
            <span class="param-label">Velocità</span>
            <span class="param-val" id="speedVal">1.0x</span>
          </div>
          <input type="range" class="param-slider" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateSpeed(this.value)">
        </div>
      </div>
    </aside>
    <audio id="previewAudio" style="display:none" preload="none"></audio>

    <!-- Main card with iframe -->
    <div class="voice-card">
      <iframe class="voice-frame" src="hugging-voice-kokoro/index.html" title="AI Voice Kokoro" allow="microphone; camera" loading="eager" id="kokoroFrame"></iframe>
      <div class="status-bar" id="statusBar">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">In attesa…</span>
        <span style="margin-left:auto;font-size:10px;opacity:0.6" id="statusDetail"></span>
      </div>
      <div class="status-bar" style="border-top:none;padding-top:0;font-size:10px;gap:16px" id="pipelineBar">
        <span>🔧 Pipeline: <strong id="plInUse">—</strong>/<span id="plSize">—</span></span>
        <span id="plState" style="color:var(--text-dim)">—</span>
      </div>
    </div>
  </div>

  <footer class="footer" id="pageFooter">
    <span id="footerDate"></span> · <span id="footerClock"></span> · <span id="footerWeather">Bari: —</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── All Kokoro voices ────────────────────────────────
    var VOICES = [
      // ⭐ Featured — gold box
      {id:"af_jessica", name:"Jessica", lang:"⭐ Featured", gender:"♀", featured:true},
      {id:"af_nicole", name:"Nicole", lang:"⭐ Featured", gender:"♀", featured:true},
      // Italian 🇮🇹
      {id:"if_sara", name:"Sara", lang:"🇮🇹 IT", gender:"♀"},
      {id:"im_nicola", name:"Nicola", lang:"🇮🇹 IT", gender:"♂"},
      // American English 🇺🇸
      {id:"af_kore", name:"Kore", lang:"🇺🇸 EN", gender:"♀"},
      {id:"am_liam", name:"Liam", lang:"🇺🇸 EN", gender:"♂"},
      {id:"am_adam", name:"Adam", lang:"🇺🇸 EN", gender:"♂"},
      {id:"am_onyx", name:"Onyx", lang:"🇺🇸 EN", gender:"♂"},
      // British English 🇬🇧
      {id:"bf_emma", name:"Emma", lang:"🇬🇧 EN", gender:"♀"},
      {id:"bm_daniel", name:"Daniel", lang:"🇬🇧 EN", gender:"♂"},
      // French 🇫🇷
      {id:"ff_siwis", name:"Siwis", lang:"🇫🇷 FR", gender:"♀"},
      // General
      {id:"am_santa", name:"Santa", lang:"🌍 General", gender:"♂"}
    ];

    var currentVoice = "am_santa";
    var frame = document.getElementById("kokoroFrame");

    function setVoice(voiceId) {
      currentVoice = voiceId;
      document.getElementById("currentVoiceLabel").textContent = voiceId;
      // Update active chip
      document.querySelectorAll(".voice-chip").forEach(function(c) {
        c.classList.toggle("active", c.dataset.voice === voiceId);
      });
      // Send to iframe
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type: "set-voice", voice: voiceId }, "*");
      }
    }

    function buildVoiceGrid() {
      var sidebar = document.getElementById("voiceSidebar");
      // Group by language
      var groups = {};
      VOICES.forEach(function(v) {
        var lang = v.featured ? v.lang : v.lang.split(" ")[0]; // featured uses full string
        if (!groups[lang]) groups[lang] = [];
        groups[lang].push(v);
      });

      var order = ["⭐ Featured","🇮🇹","🇺🇸","🇬🇧","🇫🇷","🌍"];
      var langNames = {"⭐ Featured":"Featured","🇮🇹":"Italian","🇺🇸":"American English","🇬🇧":"British English","🇫🇷":"French","🌍":"General"};

      var html = "";
      order.forEach(function(lang) {
        if (!groups[lang]) return;
        html += '<div class="voice-section"><div class="voice-section-title">' + lang + ' ' + langNames[lang] + '</div><div class="voice-grid">';
        groups[lang].forEach(function(v) {
          var isFeatured = v.featured;
          html += '<div class="voice-chip' + (v.id === currentVoice ? ' active' : '') + (isFeatured ? ' featured' : '') + '" data-voice="' + v.id + '" onclick="setVoice(\'' + v.id + '\')">';
          html += '<span class="voice-chip-gender">' + v.gender + '</span>';
          html += '<span class="voice-chip-name">' + v.name + '</span>';
          html += '<button class="voice-chip-play" data-voice="' + v.id + '" onclick="event.stopPropagation();playPreview(\'' + v.id + '\',this)" title="Anteprima voce">▶</button>';
          html += '</div>';
        });
        html += '</div></div>';
      });
      document.getElementById('voiceGridContainer').innerHTML = html;
    }

    // ── Mood presets ─────────────────────────────────────
    var MOODS = [
      {id:"default", emoji:"🤖", name:"Neutro", desc:"Assistente bilanciato", instructions:"You are a friendly voice assistant. Keep replies short, warm, and spoken."},
      {id:"cheerful", emoji:"☀️", name:"Solare", desc:"Energico e positivo", instructions:"You are an extremely cheerful and energetic assistant. Use exclamation marks, smile through your voice, be uplifting and bright. Keep it brief."},
      {id:"calm", emoji:"🧘", name:"Calmo", desc:"Rilassato e pacato", instructions:"You are a calm, meditative assistant. Speak slowly and softly, like a guided meditation. Use gentle, soothing language. Keep it brief."},
      {id:"professor", emoji:"🎓", name:"Professore", desc:"Dettagliato e preciso", instructions:"You are a knowledgeable professor. Be precise, thorough, and slightly formal. Explain concepts clearly but concisely. Keep it brief."},
      {id:"poetic", emoji:"🎭", name:"Poetico", desc:"Creativo ed espressivo", instructions:"You are a poetic, artistic assistant. Use vivid imagery and beautiful language. Be creative in your expressions. Keep it brief."},
      {id:"witty", emoji:"😏", name:"Brillante", desc:"Spiritoso e arguto", instructions:"You are a witty, sharp assistant with a dry sense of humor. Be clever and quick. Use wordplay and irony. Keep it brief."}
    ];
    var currentMood = "default";

    function buildMoodGrid() {
      var html = '';
      MOODS.forEach(function(m) {
        html += '<div class="mood-chip' + (m.id === currentMood ? ' active' : '') + '" data-mood="' + m.id + '" onclick="setMood(\'' + m.id + '\')">';
        html += '<span class="mood-chip-emoji">' + m.emoji + '</span>';
        html += '<span class="mood-chip-name">' + m.name + '</span>';
        html += '<span class="mood-chip-desc">' + m.desc + '</span>';
        html += '</div>';
      });
      document.getElementById('moodGrid').innerHTML = html;
    }

    function setMood(moodId) {
      currentMood = moodId;
      document.querySelectorAll('.mood-chip').forEach(function(c) {
        c.classList.toggle('active', c.dataset.mood === moodId);
      });
      var mood = MOODS.find(function(m){ return m.id === moodId; });
      if (mood && frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type: "set-instructions", instructions: mood.instructions }, "*");
      }
    }

    // ── Speed control ────────────────────────────────────
    function updateSpeed(val) {
      document.getElementById('speedVal').textContent = parseFloat(val).toFixed(1) + 'x';
      if (frame && frame.contentWindow) {
        frame.contentWindow.postMessage({ type: "set-speed", speed: parseFloat(val) }, "*");
      }
    }

    buildMoodGrid();

    var previewQueue = [];
    var previewPlaying = false;

    function playPreview(voiceId, btn) {
      // If already playing this voice, stop
      if (previewPlaying && previewQueue.length && previewQueue[0].voiceId === voiceId) {
        stopPreview();
        return;
      }
      // Stop any current preview
      stopPreview();
      // Build queue: two phrases
      previewQueue = [
        {voiceId: voiceId, url: 'tmp/voice-previews/' + voiceId + '_0.wav'},
        {voiceId: voiceId, url: 'tmp/voice-previews/' + voiceId + '_1.wav'}
      ];
      // Highlight all play buttons for this voice
      document.querySelectorAll('.voice-chip-play').forEach(function(b){ b.classList.remove('playing'); });
      document.querySelectorAll('.voice-chip-play[data-voice="' + voiceId + '"]').forEach(function(b){ b.classList.add('playing'); });
      playNextInQueue();
    }

    function playNextInQueue() {
      if (!previewQueue.length) {
        previewPlaying = false;
        document.querySelectorAll('.voice-chip-play').forEach(function(b){ b.classList.remove('playing'); });
        return;
      }
      previewPlaying = true;
      var item = previewQueue.shift();
      var audio = document.getElementById('previewAudio');
      audio.src = item.url;
      audio.onended = playNextInQueue;
      audio.onerror = function() {
        // File doesn't exist yet — show message and skip
        playNextInQueue();
      };
      audio.play().catch(function(){ playNextInQueue(); });
    }

    function stopPreview() {
      var audio = document.getElementById('previewAudio');
      audio.pause(); audio.onended = null; audio.onerror = null;
      previewQueue = [];
      previewPlaying = false;
      document.querySelectorAll('.voice-chip-play').forEach(function(b){ b.classList.remove('playing'); });
    }

    buildVoiceGrid();

    // Theme
    (function(){var t=localStorage.getItem('sottotitoli-theme')||'dark';document.documentElement.setAttribute('data-theme',t);var btn=document.getElementById('themeToggle');if(btn)btn.textContent=t==='dark'?'☀️':'🌙';})();
    function toggleTheme(){var cur=document.documentElement.getAttribute('data-theme');var next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('sottotitoli-theme',next);var btn=document.getElementById('themeToggle');if(btn)btn.textContent=next==='dark'?'☀️':'🌙';}

    // ── Footer: date, clock, weather ────────────────────────
    (function(){
      var dateEl = document.getElementById('footerDate');
      var clockEl = document.getElementById('footerClock');
      var weatherEl = document.getElementById('footerWeather');

      // Date
      function updateDate(){
        var now = new Date();
        var opts = {weekday:'long', day:'numeric', month:'long', year:'numeric'};
        if(dateEl) dateEl.textContent = now.toLocaleDateString('it-IT', opts);
      }

      // Clock (HH:MM, no seconds)
      function updateClock(){
        var now = new Date();
        var h = String(now.getHours()).padStart(2,'0');
        var m = String(now.getMinutes()).padStart(2,'0');
        if(clockEl) clockEl.textContent = h + ':' + m;
      }

      // Weather — Open-Meteo free API, Bari coordinates
      async function fetchWeather(){
        try {
          var resp = await fetch('https://api.open-meteo.com/v1/forecast?latitude=41.1115&longitude=16.8554&current=temperature_2m,weather_code,wind_speed_10m&timezone=Europe/Rome');
          if(!resp.ok) return;
          var data = await resp.json();
          var t = Math.round(data.current.temperature_2m);
          var code = data.current.weather_code;
          var icon = weatherIcon(code);
          var wind = Math.round(data.current.wind_speed_10m);
          if(weatherEl) weatherEl.textContent = 'Bari: ' + icon + ' ' + t + '°C · ' + wind + 'km/h';
        } catch(e){}
      }

      function weatherIcon(code){
        if(code <= 3) return '☀️';
        if(code <= 48) return '🌤️';
        if(code <= 57) return '🌧️';
        if(code <= 67) return '🌨️';
        if(code <= 77) return '❄️';
        if(code <= 82) return '⛈️';
        return '🌫️';
      }

      updateDate(); updateClock(); fetchWeather();
      setInterval(updateClock, 30000); // every 30s
      setInterval(fetchWeather, 900000); // every 15 min
      setInterval(updateDate, 3600000); // every hour
    })();

    // ── Supabase client ──────────────────────────────────────
    var SEBVA_SUPABASE_URL = 'https://tngmcavybhvqaizuizyt.supabase.co';
    var SEBVA_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZ21jYXZ5Ymh2cWFpenVpenl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MDczODksImV4cCI6MjEwMDM4MzM4OX0.g0ECf4iLqLBe8QlFzArCOBLcF7lYPVfrgwXs-rHyagg';
    var sebVaSb = null;
    var sebVaUser = null;

    function initSupabase(){
      if(window.supabase && window.supabase.createClient){
        sebVaSb = window.supabase.createClient(SEBVA_SUPABASE_URL, SEBVA_SUPABASE_KEY);
        // Check for existing session
        sebVaSb.auth.getSession().then(function(r){
          if(r.data && r.data.session){
            sebVaUser = r.data.session.user;
            updateUserUI();
            sendDailyOverview();
          }
        });
        // Listen for auth changes
        sebVaSb.auth.onAuthStateChange(function(event, session){
          sebVaUser = session ? session.user : null;
          updateUserUI();
          if(sebVaUser) sendDailyOverview();
        });
      }
    }

    function updateUserUI(){
      var chip = document.getElementById('userChip');
      if(sebVaUser){
        var name = sebVaUser.user_metadata && sebVaUser.user_metadata.full_name
          || sebVaUser.email.split('@')[0];
        chip.textContent = '👤 ' + name;
        chip.title = 'Profilo';
      } else {
        chip.textContent = '🔐 Accedi';
        chip.title = 'Accedi';
      }
    }

    async function handleAuth(){
      if(!sebVaSb){ alert('Supabase non ancora caricato. Ricarica la pagina.'); return; }
      if(sebVaUser){
        // Show sign out
        if(confirm('Vuoi uscire?')){ await sebVaSb.auth.signOut(); sebVaUser = null; updateUserUI(); }
        return;
      }
      // Sign in with Google
      var redirectTo = window.location.origin + window.location.pathname;
      await sebVaSb.auth.signInWithOAuth({provider:'google',options:{redirectTo:redirectTo}});
    }

    // ── Daily overview from Supabase ───────────────────────
    async function sendDailyOverview(){
      var frame = document.getElementById('kokoroFrame');
      if(!frame || !sebVaSb || !sebVaUser) return;
      try {
        var {data,error} = await sebVaSb.rpc('get_daily_overview',{uid:sebVaUser.id});
        var msg = (data && !error) ? data : 'Pronto per una sessione di pratica. Di cosa vuoi parlare oggi?';
        try {
          frame.contentWindow.postMessage({type:'daily-overview', text:msg}, '*');
        } catch(e){}
      } catch(e){}
    }

    // ── Save conversation to Supabase ──────────────────────
    window.saveConversation = async function(summary, durationSeconds, voiceId){
      if(!sebVaSb || !sebVaUser) return;
      try {
        var {data,error} = await sebVaSb.from('conversations').insert({
          user_id: sebVaUser.id,
          duration_seconds: durationSeconds||0,
          voice_id: voiceId||currentVoice,
          summary: summary||'',
          language: 'it'
        }).select('id').single();
        return data ? data.id : null;
      } catch(e){ return null; }
    };

    // ── Add daily goal from conversation ───────────────────
    window.addDailyGoal = async function(title, minutes){
      if(!sebVaSb || !sebVaUser) return;
      try {
        await sebVaSb.from('daily_goals').insert({
          user_id: sebVaUser.id,
          title: title,
          estimated_minutes: minutes||30,
          ai_suggested: true
        });
      } catch(e){}
    };

    // Listen for messages from iframe (conversation events + status)
    window.addEventListener('message', function(e){
      if(!e.data || !e.data.type) return;

      // Status updates from the voice assistant
      if(e.data.type === 'status'){
        var dot = document.getElementById('statusDot');
        var txt = document.getElementById('statusText');
        var detail = document.getElementById('statusDetail');
        if(txt) txt.textContent = e.data.text || '';
        if(detail) detail.textContent = e.data.detail || '';
        if(dot){
          dot.className = 'status-dot';
          if(e.data.level === 'ok') dot.classList.add('ok');
          if(e.data.level === 'warn') dot.classList.add('warn');
          if(e.data.level === 'error') dot.classList.add('error');
        }
      }

      // Conversation ended
      if(e.data.type === 'conversation-ended' && e.data.summary){
        window.saveConversation(e.data.summary, e.data.duration, e.data.voice);
      }
      if(e.data.type === 'suggest-goal' && e.data.title){
        window.addDailyGoal(e.data.title, e.data.minutes);
      }
    });

    // Try to send overview whenever iframe loads
    var kokoroFrame = document.getElementById('kokoroFrame');
    if(kokoroFrame){
      kokoroFrame.addEventListener('load', function(){
        setTimeout(function(){
          if(sebVaUser){ sendDailyOverview(); }
          else {
            // Fallback to localStorage-based overview
            var msg = window._localOverview ? window._localOverview() : 'Pronto per una sessione di pratica. Di cosa vuoi parlare oggi?';
            try { kokoroFrame.contentWindow.postMessage({type:'daily-overview', text:msg}, '*'); } catch(e){}
          }
        }, 2000);
      });
    }

    // localStorage fallback (used when not signed in)
    (function(){
      var GOALS_KEY = 'sebva-daily-goals';
      function getToday(){ return new Date().toISOString().substring(0,10); }
      window.setDailyGoal = function(text, minutes){
        var data = {};
        try { data = JSON.parse(localStorage.getItem(GOALS_KEY)||'{}'); } catch(e){}
        data[getToday()] = {text:text, minutes:minutes||30, set:new Date().toISOString()};
        localStorage.setItem(GOALS_KEY, JSON.stringify(data));
      };
      window._localOverview = function(){
        var data = {};
        try { data = JSON.parse(localStorage.getItem(GOALS_KEY)||'{}'); } catch(e){}
        var today = data[getToday()];
        return today ? 'Oggi: ' + today.text + ' (~' + today.minutes + ' min)' : 'Pronto per una sessione di pratica. Di cosa vuoi parlare oggi?';
      };
    })();

    // ── Initialize Supabase when SDK loads ──────────────────
    if(window.supabase && window.supabase.createClient){
      initSupabase();
    } else {
      window.addEventListener('load', function(){ setTimeout(initSupabase, 500); });
    }

    // ── Pipeline monitor — polls the Space every 5s ──────────
    (function(){
      var POOL_URL = 'https://s8t-sottotitoli-voice.hf.space/v1/pool';
      function updatePipeline(){
        fetch(POOL_URL).then(function(r){ return r.json(); }).then(function(d){
          document.getElementById('plInUse').textContent = d.in_use;
          document.getElementById('plSize').textContent = d.size;
          var states = (d.units||[]).map(function(u){ return u.state; }).join(', ');
          var el = document.getElementById('plState');
          if(el){ el.textContent = states; el.style.color = d.in_use===0 ? 'var(--green)' : 'var(--cyan)'; }
          // If all pipelines busy, warn
          var dot = document.getElementById('statusDot');
          if(d.in_use >= d.size && dot){ dot.className = 'status-dot error'; }
        }).catch(function(e){
          var el = document.getElementById('plState');
          if(el){ el.textContent = 'Space offline'; el.style.color = '#ef4444'; }
        });
      }
      updatePipeline();
      setInterval(updatePipeline, 5000);
    })();
  </script>
</body>
</html>
