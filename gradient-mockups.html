<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Mockups · Sottotitoli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0f1117;color:#e8eaed;-webkit-font-smoothing:antialiased;padding:40px 24px}
h1{font-size:clamp(28px,5vw,48px);font-weight:800;letter-spacing:-1.5px;margin-bottom:8px}
h1 em{font-style:normal;color:#a78bfa}
.sub{font-size:14px;color:#9ca3af;max-width:600px;margin-bottom:32px;line-height:1.6}
.controls{display:flex;gap:12px;margin-bottom:32px;flex-wrap:wrap;align-items:center}
.controls button{padding:10px 24px;border-radius:100px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#e8eaed;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.controls button:hover{background:rgba(124,58,237,.2);border-color:#7c3aed}
.controls button.active{background:#7c3aed;border-color:#7c3aed;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.card{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.card-header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.card-header h3{font-size:14px;font-weight:700}
.card-header span{font-size:11px;color:rgba(255,255,255,.4)}
.gradient-preview{height:200px;display:flex;align-items:center;justify-content:center;position:relative}
.gradient-preview .sample-text{text-align:center;padding:24px}
.gradient-preview .sample-title{font-size:clamp(18px,3vw,28px);font-weight:800;letter-spacing:-1px;margin-bottom:4px}
.gradient-preview .sample-sub{font-size:13px;opacity:.8}
.color-stops{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:0 20px 16px}
.color-stops span{flex:1}
</style>
</head>
<body>

<h1>Gradient <em>Mockups</em></h1>
<p class="sub">10 schemi colore per index.html — clicca Day/Night per vedere entrambe le varianti. Ogni scheda mostra il gradiente con testo campione sovrapposto.</p>

<div class="controls">
  <button id="btnDark" class="active" onclick="setTheme('dark')">🌙 Night</button>
  <button id="btnLight" onclick="setTheme('light')">☀️ Day</button>
</div>

<div class="grid" id="grid"></div>

<script>
const schemes = [
  {
    name: '1. Viola → Blu ardesia (attuale)',
    dark: 'linear-gradient(0deg, #919fbc 0%, #899abf 3%, #8095c2 6%, #7890c5 9%, #708ac8 12%, #6985cb 15%, #6280ce 18%, #5b7bd0 21%, #5575d2 24%, #4f70d4 27%, #4a6bd6 30%, #4666d8 33%, #4261d9 36%, #3f5cda 39%, #3d57db 42%, #3b52dc 45%, #3a4ddd 48%, #3949dd 51%, #3a44dd 54%, #3b40dd 57%, #3d3cdd 60%, #3f38dc 63%, #4335dc 66%, #4731db 69%, #4b2eda 72%, #502bd9 75%, #5629d7 78%, #5c26d5 81%, #6324d4 84%, #6a22d1 87%, #7220cf 90%, #791fcd 93%, #821eca 96%, #8a1dc7 100%)',
    light: 'linear-gradient(0deg, #d5dbe6 0%, #c8d1e0 10%, #bac5d8 20%, #abb9d0 30%, #9bacc7 40%, #8a9fbe 50%, #7992b4 60%, #6784a9 70%, #55779e 80%, #446994 90%, #355c8a 100%)',
    stops: ['#8a1dc7','#6324d4','#3f5cda','#3a4ddd','#3f38dc','#4b2eda','#6324d4','#8095c2','#919fbc']
  },
  {
    name: '2. Indaco profondo → Lavanda',
    dark: 'linear-gradient(0deg, #1e1b4b 0%, #2e1065 10%, #4c1d95 15%, #6d28d9 25%, #7c3aed 35%, #8b5cf6 45%, #a78bfa 55%, #c4b5fd 65%, #ddd6fe 75%, #ede9fe 85%, #f5f3ff 100%)',
    light: 'linear-gradient(0deg, #f5f3ff 0%, #ede9fe 10%, #ddd6fe 20%, #c4b5fd 30%, #a78bfa 45%, #8b5cf6 55%, #7c3aed 65%, #6d28d9 75%, #5b21b6 85%, #4c1d95 100%)',
    stops: ['#1e1b4b','#4c1d95','#7c3aed','#a78bfa','#ddd6fe','#f5f3ff']
  },
  {
    name: '3. Marino → Cielo',
    dark: 'linear-gradient(0deg, #0c1929 0%, #0d3b5e 10%, #0e5e8a 20%, #0d7268 30%, #0891b2 40%, #06b6d4 50%, #22d3ee 60%, #67e8f9 70%, #a5f3fc 80%, #cffafe 90%, #ecfeff 100%)',
    light: 'linear-gradient(0deg, #ecfeff 0%, #cffafe 10%, #a5f3fc 20%, #67e8f9 30%, #22d3ee 40%, #06b6d4 50%, #0891b2 60%, #0e5e8a 70%, #0d3b5e 80%, #0c1929 90%, #082032 100%)',
    stops: ['#0c1929','#0e5e8a','#0891b2','#22d3ee','#a5f3fc','#ecfeff']
  },
  {
    name: '4. Smeraldo → Menta',
    dark: 'linear-gradient(0deg, #022c1e 0%, #064e3b 10%, #065f46 20%, #047857 30%, #059669 40%, #10b981 50%, #34d399 60%, #6ee7b7 70%, #a7f3d0 80%, #d1fae5 90%, #ecfdf5 100%)',
    light: 'linear-gradient(0deg, #ecfdf5 0%, #d1fae5 10%, #a7f3d0 20%, #6ee7b7 30%, #34d399 40%, #10b981 50%, #059669 60%, #047857 70%, #065f46 80%, #064e3b 90%, #022c1e 100%)',
    stops: ['#022c1e','#065f46','#059669','#34d399','#a7f3d0','#ecfdf5']
  },
  {
    name: '5. Ambra → Oro caldo',
    dark: 'linear-gradient(0deg, #1c0f00 0%, #3b1c00 10%, #5c2a00 20%, #78350f 30%, #92400e 40%, #b45309 50%, #d97706 60%, #f59e0b 70%, #fbbf24 80%, #fde68a 90%, #fef3c7 100%)',
    light: 'linear-gradient(0deg, #fef3c7 0%, #fde68a 10%, #fbbf24 20%, #f59e0b 30%, #d97706 40%, #b45309 50%, #92400e 60%, #78350f 70%, #5c2a00 80%, #3b1c00 90%, #1c0f00 100%)',
    stops: ['#1c0f00','#78350f','#d97706','#fbbf24','#fde68a','#fef3c7']
  },
  {
    name: '6. Borgogna → Rosa tenue',
    dark: 'linear-gradient(0deg, #1f0410 0%, #3d0a1f 10%, #5c1030 20%, #7f1d1d 30%, #991b1b 40%, #b91c1c 50%, #e11d48 60%, #f43f5e 70%, #fb7185 80%, #fda4af 90%, #ffe4e6 100%)',
    light: 'linear-gradient(0deg, #ffe4e6 0%, #fda4af 10%, #fb7185 20%, #f43f5e 30%, #e11d48 40%, #b91c1c 50%, #991b1b 60%, #7f1d1d 70%, #5c1030 80%, #3d0a1f 90%, #1f0410 100%)',
    stops: ['#1f0410','#7f1d1d','#e11d48','#f43f5e','#fda4af','#ffe4e6']
  },
  {
    name: '7. Ardesia → Grafite (sobrio)',
    dark: 'linear-gradient(0deg, #0a0e1a 0%, #111827 15%, #1f2937 30%, #374151 45%, #4b5563 60%, #6b7280 75%, #9ca3af 85%, #d1d5db 95%, #f3f4f6 100%)',
    light: 'linear-gradient(0deg, #f3f4f6 0%, #e5e7eb 10%, #d1d5db 20%, #9ca3af 35%, #6b7280 50%, #4b5563 65%, #374151 75%, #1f2937 85%, #111827 95%, #0a0e1a 100%)',
    stops: ['#0a0e1a','#1f2937','#4b5563','#9ca3af','#d1d5db','#f3f4f6']
  },
  {
    name: '8. Prugna → Cielo notturno',
    dark: 'linear-gradient(0deg, #0f0720 0%, #1a0a33 10%, #2d1050 20%, #4a1a7a 30%, #6b21a8 40%, #7e22ce 50%, #9333ea 60%, #a855f7 70%, #c084fc 80%, #d8b4fe 90%, #f3e8ff 100%)',
    light: 'linear-gradient(0deg, #f3e8ff 0%, #d8b4fe 10%, #c084fc 20%, #a855f7 30%, #9333ea 40%, #7e22ce 50%, #6b21a8 60%, #4a1a7a 70%, #2d1050 80%, #1a0a33 90%, #0f0720 100%)',
    stops: ['#0f0720','#2d1050','#7e22ce','#a855f7','#d8b4fe','#f3e8ff']
  },
  {
    name: '9. Teal → Acquamarina',
    dark: 'linear-gradient(0deg, #042f2e 0%, #134e4a 15%, #115e59 30%, #0f766e 45%, #0d9488 55%, #14b8a6 65%, #2dd4bf 75%, #5eead4 85%, #99f6e4 92%, #ccfbf1 100%)',
    light: 'linear-gradient(0deg, #ccfbf1 0%, #99f6e4 10%, #5eead4 20%, #2dd4bf 30%, #14b8a6 40%, #0d9488 50%, #0f766e 60%, #115e59 70%, #134e4a 80%, #042f2e 90%, #022c22 100%)',
    stops: ['#042f2e','#0f766e','#0d9488','#2dd4bf','#99f6e4','#ccfbf1']
  },
  {
    name: '10. Carbone → Fumé (minimal)',
    dark: 'linear-gradient(0deg, #09090b 0%, #18181b 20%, #27272a 40%, #3f3f46 55%, #52525b 70%, #71717a 80%, #a1a1aa 90%, #d4d4d8 96%, #fafafa 100%)',
    light: 'linear-gradient(0deg, #fafafa 0%, #f4f4f5 10%, #e4e4e7 20%, #d4d4d8 30%, #a1a1aa 45%, #71717a 55%, #52525b 65%, #3f3f46 75%, #27272a 85%, #18181b 92%, #09090b 100%)',
    stops: ['#09090b','#27272a','#52525b','#a1a1aa','#d4d4d8','#fafafa']
  }
];

let currentTheme = 'dark';

function setTheme(t) {
  currentTheme = t;
  document.getElementById('btnDark').classList.toggle('active', t === 'dark');
  document.getElementById('btnLight').classList.toggle('active', t === 'light');
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = schemes.map((s, i) => {
    const grad = currentTheme === 'dark' ? s.dark : s.light;
    const textColor = currentTheme === 'dark' ? '#e8eaed' : '#111827';
    const subColor = currentTheme === 'dark' ? 'rgba(255,255,255,.6)' : 'rgba(0,0,0,.5)';
    const bg = currentTheme === 'dark' ? '#1a1d26' : '#fff';
    const border = currentTheme === 'dark' ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.08)';
    return `
      <div class="card" style="background:${bg};border-color:${border}">
        <div class="card-header">
          <h3>${s.name}</h3>
          <span>${currentTheme === 'dark' ? 'Night' : 'Day'}</span>
        </div>
        <div class="gradient-preview" style="background:${grad};color:${textColor}">
          <div class="sample-text">
            <div class="sample-title">I tuoi sottotitoli<br>in <em style="color:#a78bfa">tempo reale</em></div>
            <div class="sample-sub" style="color:${subColor}">Microfono, voce, sottotitoli. In 8 lingue.</div>
          </div>
        </div>
        <div class="color-stops">${s.stops.map(c => `<span style="background:${c}"></span>`).join('')}</div>
      </div>`;
  }).join('');
}

renderGrid();
</script>
</body>
</html>
