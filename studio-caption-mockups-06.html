<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · 06 · Live Grammar Parse</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh}h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:2px}@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}.subtitle{text-align:center;color:#8b93a5;margin-bottom:24px;font-size:13px}.main-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:24px;max-width:900px;margin:0 auto}.sent-btn{padding:10px 18px;border-radius:100px;border:1px solid #1a1e2e;background:rgba(255,255,255,.03);color:rgba(255,255,255,.6);font-size:12px;font-weight:500;cursor:pointer;transition:all .25s;font-family:inherit;margin-right:8px;margin-bottom:8px}.sent-btn:hover{background:rgba(255,255,255,.06);border-color:#2a2e3e}.sent-btn.active{background:rgba(167,139,250,.12);border-color:#a78bfa;color:#c4b5fd;font-weight:600}.tree-container{font-family:'JetBrains Mono','Geist Mono',monospace;font-size:12px;line-height:1.8;padding:20px;background:rgba(0,0,0,.25);border-radius:12px;border:1px solid rgba(255,255,255,.04);overflow-x:auto;white-space:pre;color:rgba(255,255,255,.55);animation:fadeInUp .4s ease}.pos-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:700;margin-left:4px;vertical-align:middle;font-family:'Inter',system-ui,sans-serif}.color-S{color:#e8eaed}.color-NP{color:#60a5fa}.color-VP{color:#34d399}.color-PP{color:#fbbf24}.color-ADJP{color:#f472b6}.color-ADVP{color:#c084fc}.color-CC{color:#fb923c}.info-chip{padding:6px 14px;border-radius:100px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);font-size:10px;color:rgba(255,255,255,.5);display:inline-flex;align-items:center;gap:6px;margin-top:16px;margin-right:8px}.legend-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.legend-chip{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,.4)}.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}</style></head><body><h1>🌳 06 · Live Grammar Parse</h1><p class="subtitle">Interactive Sentence Tree Explorer — June 2026</p><div class="main-card"><div id="sentSelector"></div><div class="tree-container" id="treeOut"></div><div id="infoRow"></div><div class="legend-row"><span class="legend-chip"><span class="legend-dot" style="background:#e8eaed"></span>S (Sentence)</span><span class="legend-chip"><span class="legend-dot" style="background:#60a5fa"></span>NP (Noun)</span><span class="legend-chip"><span class="legend-dot" style="background:#34d399"></span>VP (Verb)</span><span class="legend-chip"><span class="legend-dot" style="background:#fbbf24"></span>PP (Prep)</span><span class="legend-chip"><span class="legend-dot" style="background:#f472b6"></span>ADJP (Adj)</span><span class="legend-chip"><span class="legend-dot" style="background:#c084fc"></span>ADVP (Adv)</span></div></div><script>const POS_COLORS={PRON:'#60a5fa',NOUN:'#60a5fa',VERB:'#34d399',AUX:'#34d399',DET:'#22d3ee',ADJ:'#f472b6',ADV:'#c084fc',PREP:'#fbbf24',CONJ:'#fb923c',PART:'rgba(255,255,255,.4)'};function posBadge(tag){const c=POS_COLORS[tag]||'rgba(255,255,255,.4)';return`<span class="pos-badge" style="background:${c}18;color:${c}">${tag}</span>`}function tree1(){return['<span class="color-S">S</span>','├─ <span class="color-NP">NP</span> ── <span style="color:#e8eaed;font-weight:600">we</span>'+posBadge('PRON'),'├─ <span class="color-VP">VP</span>','│  ├─ <span style="color:#34d399;font-weight:600">are</span>'+posBadge('AUX'),'│  └─ <span style="color:#34d399;font-weight:600">discussing</span>'+posBadge('VERB'),'│     ├─ <span class="color-NP">NP</span>','│     │  ├─ <span class="color-DET">DET</span> ── <span style="color:#e8eaed">the</span>'+posBadge('DET'),'│     │  └─ <span style="color:#60a5fa;font-weight:600">future</span>'+posBadge('NOUN'),'│     └─ <span class="color-PP">PP</span>','│        ├─ <span style="color:#fbbf24">of</span>'+posBadge('PREP'),'│        └─ <span class="color-NP">NP</span>','│           ├─ <span style="color:#f472b6">real</span>'+posBadge('ADJ'),'│           ├─ <span style="color:#22d3ee">-</span>'+posBadge('DET'),'│           └─ <span style="color:#60a5fa;font-weight:600">time translation</span>'+posBadge('NOUN'),'└─ <span class="color-CC">CC</span> ── <span style="color:#fb923c;font-weight:600">and</span>'+posBadge('CONJ'),'   └─ <span class="color-S">S</span>','      ├─ <span class="color-ADVP">ADVP</span> ── <span style="color:#c084fc">how</span>'+posBadge('ADV'),'      ├─ <span class="color-NP">NP</span> ── <span style="color:#e8eaed">it</span>'+posBadge('PRON'),'      ├─ <span class="color-VP">VP</span>','      │  ├─ <span style="color:#34d399">can</span>'+posBadge('AUX'),'      │  └─ <span style="color:#34d399">be used</span>'+posBadge('VERB'),'      └─ <span class="color-PP">PP</span>','         ├─ <span style="color:#fbbf24">in</span>'+posBadge('PREP'),'         └─ <span class="color-NP">NP</span>','            ├─ <span style="color:#f472b6">international</span>'+posBadge('ADJ'),'            └─ <span style="color:#60a5fa;font-weight:600">meetings</span>'+posBadge('NOUN')].join('\n')}function tree2(){return['<span class="color-S">S</span>','├─ <span class="color-NP">NP</span>','│  ├─ <span class="color-DET">DET</span> ── <span style="color:#e8eaed">the</span>'+posBadge('DET'),'│  ├─ <span style="color:#f472b6">quick</span>'+posBadge('ADJ'),'│  └─ <span style="color:#60a5fa;font-weight:600">fox</span>'+posBadge('NOUN'),'├─ <span class="color-VP">VP</span>','│  ├─ <span style="color:#34d399;font-weight:600">jumps</span>'+posBadge('VERB'),'│  └─ <span class="color-ADVP">ADVP</span> ── <span style="color:#c084fc">quickly</span>'+posBadge('ADV'),'└─ <span class="color-PP">PP</span>','   ├─ <span style="color:#fbbf24">over</span>'+posBadge('PREP'),'   └─ <span class="color-NP">NP</span>','      ├─ <span class="color-DET">DET</span> ── <span style="color:#e8eaed">the</span>'+posBadge('DET'),'      ├─ <span style="color:#f472b6">lazy</span>'+posBadge('ADJ'),'      └─ <span style="color:#60a5fa;font-weight:600">dog</span>'+posBadge('NOUN')].join('\n')}function tree3(){return['<span class="color-S">S</span>','├─ <span class="color-NP">NP</span>','│  ├─ <span style="color:#e8eaed;font-weight:600">she</span>'+posBadge('PRON'),'│  └─ <span class="color-CC">CC</span> ── <span style="color:#fb923c">and</span>'+posBadge('CONJ'),'│     └─ <span class="color-NP">NP</span> ── <span style="color:#e8eaed;font-weight:600">I</span>'+posBadge('PRON'),'├─ <span class="color-VP">VP</span>','│  ├─ <span style="color:#34d399">have been</span>'+posBadge('AUX'),'│  └─ <span style="color:#34d399;font-weight:600">studying</span>'+posBadge('VERB'),'│     ├─ <span class="color-NP">NP</span>','│     │  ├─ <span class="color-DET">DET</span> ── <span style="color:#e8eaed">the</span>'+posBadge('DET'),'│     │  └─ <span style="color:#60a5fa;font-weight:600">language</span>'+posBadge('NOUN'),'│     └─ <span class="color-PP">PP</span>','│        ├─ <span style="color:#fbbf24">for</span>'+posBadge('PREP'),'│        └─ <span class="color-NP">NP</span>','│           ├─ <span style="color:#f472b6">three</span>'+posBadge('ADJ'),'│           └─ <span style="color:#60a5fa;font-weight:600">years</span>'+posBadge('NOUN'),'└─ <span class="color-ADVP">ADVP</span> ── <span style="color:#c084fc">now</span>'+posBadge('ADV')].join('\n')}const sents=[{btn:'we are discussing the future of real-time translation…',tree:tree1,stats:'12 words · 3 clauses · Depth 4 · B1-B2'},{btn:'the quick fox jumps quickly over the lazy dog',tree:tree2,stats:'9 words · 1 clause · Depth 3 · A2'},{btn:'she and I have been studying the language for three years',tree:tree3,stats:'14 words · 2 clauses · Depth 4 · B1'}];const selDiv=document.getElementById('sentSelector');const treeOut=document.getElementById('treeOut');const infoRow=document.getElementById('infoRow');sents.forEach((s,i)=>{const btn=document.createElement('button');btn.className='sent-btn'+(i===0?' active':'');btn.textContent=(i+1)+'. '+s.btn;btn.addEventListener('click',()=>{document.querySelectorAll('.sent-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');treeOut.innerHTML=s.tree();infoRow.innerHTML=`<span class="info-chip">📝 <strong>${s.stats}</strong></span>`});selDiv.appendChild(btn)});treeOut.innerHTML=sents[0].tree();infoRow.innerHTML=`<span class="info-chip">📝 <strong>${sents[0].stats}</strong></span>`;</script></body></html>
