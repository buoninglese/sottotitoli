<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · 06 · Live Grammar Parse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh}
h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:2px}
@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.subtitle{text-align:center;color:#8b93a5;margin-bottom:24px;font-size:13px}
.main-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:24px;max-width:900px;margin:0 auto}
.sent-btn{display:block;width:100%;text-align:left;padding:12px 18px;border-radius:10px;border:1px solid #1a1e2e;background:rgba(255,255,255,.02);color:rgba(255,255,255,.55);font-size:12px;font-weight:400;cursor:pointer;transition:all .25s;font-family:inherit;margin-bottom:6px;line-height:1.5}
.sent-btn:hover{background:rgba(255,255,255,.05);border-color:#2a2e3e;color:rgba(255,255,255,.75)}
.sent-btn.active{background:rgba(167,139,250,.1);border-color:#a78bfa;color:#c4b5fd;font-weight:500}
.sent-btn .sent-idx{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.2);margin-right:8px}
.tree-container{font-family:'JetBrains Mono','Geist Mono',monospace;font-size:11px;line-height:1.9;padding:18px;background:rgba(0,0,0,.25);border-radius:12px;border:1px solid rgba(255,255,255,.04);overflow-x:auto;white-space:pre;color:rgba(255,255,255,.55);animation:fadeInUp .35s ease;min-height:80px}
.pos-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:8px;font-weight:700;margin-left:3px;vertical-align:middle;font-family:'Inter',system-ui,sans-serif}
.color-S{color:#e8eaed}.color-NP{color:#60a5fa}.color-VP{color:#34d399}.color-PP{color:#fbbf24}.color-ADJP{color:#f472b6}.color-ADVP{color:#c084fc}.color-CC{color:#fb923c}.color-DET{color:#22d3ee}
.info-chip{padding:5px 12px;border-radius:100px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);font-size:9px;color:rgba(255,255,255,.5);display:inline-flex;align-items:center;gap:5px;margin-top:12px;margin-right:6px}
.legend-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.legend-chip{display:flex;align-items:center;gap:4px;font-size:9px;color:rgba(255,255,255,.35)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.empty-state{text-align:center;padding:40px 20px;color:rgba(255,255,255,.15);font-size:13px;line-height:1.6}
.empty-state span{display:block;font-size:28px;margin-bottom:8px}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<h1>&#127794; 06 &middot; Live Grammar Parse</h1>
<p class="subtitle">Click any recent sentence to see its structure &mdash; live from transcript</p>
<div class="main-card">
  <div id="sentSelector">
    <div class="empty-state"><span>&#128172;</span>Start speaking or run the demo<br>Sentences will appear here</div>
  </div>
  <div class="tree-container" id="treeOut">
    <div style="color:rgba(255,255,255,.15);font-style:italic">Select a sentence above to parse</div>
  </div>
  <div id="infoRow"></div>
  <div class="legend-row">
    <span class="legend-chip"><span class="legend-dot" style="background:#e8eaed"></span>S</span>
    <span class="legend-chip"><span class="legend-dot" style="background:#60a5fa"></span>NP</span>
    <span class="legend-chip"><span class="legend-dot" style="background:#34d399"></span>VP</span>
    <span class="legend-chip"><span class="legend-dot" style="background:#fbbf24"></span>PP</span>
    <span class="legend-chip"><span class="legend-dot" style="background:#f472b6"></span>ADJP</span>
    <span class="legend-chip"><span class="legend-dot" style="background:#c084fc"></span>ADVP</span>
    <span class="legend-chip"><span class="legend-dot" style="background:#22d3ee"></span>DET</span>
    <span class="legend-chip"><span class="legend-dot" style="background:#fb923c"></span>CC</span>
  </div>
</div>

<script>
// ── POS Dictionary ──
var POS_DICT={the:'DET',a:'DET',an:'DET',is:'VERB',are:'VERB',was:'VERB',were:'VERB',be:'VERB',been:'VERB',being:'VERB',have:'VERB',has:'VERB',had:'VERB',do:'VERB',does:'VERB',did:'VERB',will:'AUX',would:'AUX',can:'AUX',could:'AUX',shall:'AUX',should:'AUX',may:'AUX',might:'AUX',must:'AUX',not:'PART',to:'PART',of:'PREP',in:'PREP',for:'PREP',on:'PREP',with:'PREP',at:'PREP',by:'PREP',from:'PREP',into:'PREP',about:'PREP',over:'PREP',under:'PREP',between:'PREP',through:'PREP',during:'PREP',before:'PREP',after:'PREP',above:'PREP',below:'PREP',and:'CONJ',or:'CONJ',but:'CONJ',so:'CONJ',if:'CONJ',because:'CONJ',when:'CONJ',where:'CONJ',how:'CONJ',that:'CONJ',while:'CONJ',although:'CONJ',we:'PRON',us:'PRON',our:'PRON',you:'PRON',your:'PRON',he:'PRON',him:'PRON',his:'PRON',she:'PRON',her:'PRON',it:'PRON',its:'PRON',they:'PRON',them:'PRON',their:'PRON',this:'DET',these:'DET',those:'DET',i:'PRON',me:'PRON',my:'PRON',future:'NOUN',translation:'NOUN',meetings:'NOUN',system:'NOUN',systems:'NOUN',language:'NOUN',languages:'NOUN',barrier:'NOUN',barriers:'NOUN',deployment:'NOUN',scale:'NOUN',challenge:'NOUN',year:'NOUN',years:'NOUN',real:'ADJ',international:'ADJ',biggest:'ADJ',new:'ADJ',good:'ADJ',great:'ADJ',important:'ADJ',quick:'ADJ',lazy:'ADJ',different:'ADJ',neural:'ADJ',accurate:'ADJ',remarkably:'ADV',quickly:'ADV',discuss:'VERB',discussing:'VERB',bridge:'VERB',remain:'VERB',remains:'VERB',use:'VERB',used:'VERB',using:'VERB',jumps:'VERB',studying:'VERB',think:'VERB',getting:'VERB',handling:'VERB',edge:'NOUN',cases:'NOUN',fox:'NOUN',dog:'NOUN',three:'ADJ',now:'ADV',factor:'NOUN',adoption:'NOUN',user:'NOUN',latency:'NOUN',improvements:'NOUN',key:'ADJ',exactly:'ADV',across:'PREP',cultures:'NOUN',time:'NOUN'};

var POS_COLORS={PRON:'#60a5fa',NOUN:'#60a5fa',VERB:'#34d399',AUX:'#34d399',DET:'#22d3ee',ADJ:'#f472b6',ADV:'#c084fc',PREP:'#fbbf24',CONJ:'#fb923c',PART:'rgba(255,255,255,.3)'};

function tagWord(w){
  w=w.toLowerCase().replace(/[^a-z0-9-]/g,'');
  if(!w||w.length<2) return 'OTHER';
  if(POS_DICT[w]) return POS_DICT[w];
  if(w.endsWith('ing')) return 'VERB';
  if(w.endsWith('ed')&&w.length>4) return 'VERB';
  if(w.endsWith('tion')||w.endsWith('sion')||w.endsWith('ment')||w.endsWith('ness')||w.endsWith('ity')) return 'NOUN';
  if(w.endsWith('ly')) return 'ADV';
  if(w.endsWith('ous')||w.endsWith('ful')||w.endsWith('less')||w.endsWith('able')||w.endsWith('ible')) return 'ADJ';
  if(w.endsWith('er')||w.endsWith('est')) return 'ADJ';
  if(w.endsWith('s')&&w.length>4) return 'NOUN';
  return 'NOUN';
}

function posBadge(tag){var c=POS_COLORS[tag]||'rgba(255,255,255,.3)';return'<span class="pos-badge" style="background:'+c+'18;color:'+c+'">'+tag+'</span>'}
function getWordColor(tag){var m={VERB:'#34d399',AUX:'#34d399',NOUN:'#60a5fa',PRON:'#60a5fa',ADJ:'#f472b6',ADV:'#c084fc',PREP:'#fbbf24',CONJ:'#fb923c',DET:'#22d3ee',PART:'rgba(255,255,255,.4)'};return m[tag]||'rgba(255,255,255,.5)'}

// ── Verb-centric Constituency Parser ──
function parseSentence(text){
  var clean=text.trim().replace(/[,.!?;:]/g,'');
  var words=clean.split(/\s+/);
  if(words.length===0) return {tree:[],stats:{words:0,clauses:1,depth:2,cefr:'—'}};
  
  var tagged=[];
  for(var i=0;i<words.length;i++){
    var w=words[i],t=tagWord(w);
    tagged.push({word:w,tag:t});
  }
  
  var tree=['<span class="color-S">S</span>'];
  var n=tagged.length;
  
  // Find conjunction for clause splitting
  var conjIdx=-1;
  for(var i=1;i<n-1;i++){if(tagged[i].tag==='CONJ'){conjIdx=i;break}}
  
  if(conjIdx>0){
    buildClause(tree,tagged.slice(0,conjIdx),'');
    tree.push('└─ <span class="color-CC">CC</span> ── <span style="color:#fb923c;font-weight:600">'+tagged[conjIdx].word+'</span>'+posBadge('CONJ'));
    tree.push('   └─ <span class="color-S">S</span>');
    buildClause(tree,tagged.slice(conjIdx+1),'      ');
  } else {
    buildClause(tree,tagged,'');
  }
  
  var wc=words.length,cc=conjIdx>0?2:1;
  var cefr=wc>18?'B2-C1':wc>12?'B1-B2':wc>7?'A2-B1':'A1-A2';
  return {tree:tree,stats:{words:wc,clauses:cc,depth:2+cc,cefr:cefr}};
}

function buildClause(tree,tagged,prefix){
  var n=tagged.length;if(n===0)return;
  
  // Find verb
  var vi=-1;
  for(var i=0;i<n;i++){if(tagged[i].tag==='VERB'||tagged[i].tag==='AUX'){vi=i;break}}
  if(vi<0) vi=Math.floor(n/2);
  
  // Subject: words before verb (skip leading ADV)
  var ss=0;while(ss<vi&&tagged[ss].tag==='ADV')ss++;
  if(ss<vi){
    var sw=tagged.slice(ss,vi).map(function(x){return x.word}).join(' ');
    tree.push(prefix+'├─ <span class="color-NP">NP</span> ── <span style="color:#e8eaed;font-weight:600">'+sw+'</span>');
    for(var k=ss;k<vi;k++) tree.push(prefix+'│  ├─ <span style="color:'+getWordColor(tagged[k].tag)+'">'+tagged[k].word+'</span>'+posBadge(tagged[k].tag));
  }
  
  // Verb + aux
  var vs=vi;while(vs>0&&tagged[vs-1].tag==='AUX')vs--;
  tree.push(prefix+'├─ <span class="color-VP">VP</span>');
  for(var k=vs;k<=vi;k++){
    tree.push(prefix+'│  '+(k===vi?'└─':'├─')+' <span style="color:#34d399;font-weight:600">'+tagged[k].word+'</span>'+posBadge(tagged[k].tag));
  }
  
  // Object: words after verb until PREP or end
  var os=vi+1;while(os<n&&tagged[os].tag==='ADV')os++;
  var oe=n;
  for(var k=os;k<n;k++){if(tagged[k].tag==='PREP'){oe=k;break}}
  if(oe>os){
    var ow=tagged.slice(os,oe).map(function(x){return x.word}).join(' ');
    var isLastBlock=(oe>=n);
    tree.push(prefix+(isLastBlock?'└─':'├─')+' <span class="color-NP">NP</span> ── <span style="color:#60a5fa;font-weight:500">'+ow+'</span>');
    for(var k=os;k<oe;k++){
      tree.push(prefix+(isLastBlock?'   └─':'│  '+(k===oe-1&&oe===n?'└─':'├─'))+' <span style="color:'+getWordColor(tagged[k].tag)+'">'+tagged[k].word+'</span>'+posBadge(tagged[k].tag));
    }
  }
  
  // PP
  var ps=n;
  for(var k=vi+1;k<n;k++){if(tagged[k].tag==='PREP'){ps=k;break}}
  if(ps<n){
    tree.push(prefix+'   └─ <span class="color-PP">PP</span>');
    for(var k=ps;k<n;k++){
      tree.push(prefix+'      '+(k===n-1?'└─':'├─')+' <span style="color:'+getWordColor(tagged[k].tag)+'">'+tagged[k].word+'</span>'+posBadge(tagged[k].tag));
    }
  }
}

// ── Demo & UI ──
var DEMO=['we are discussing the future of real-time translation','and how these systems can bridge language barriers across different cultures','exactly deployment at scale remains our biggest challenge this year','I think the neural models are getting remarkably good at handling edge cases','the quick fox jumps quickly over the lazy dog','she and I have been studying the language for three years now'];
var transcriptLines=[],demoIdx=0,demoInterval=null,activeSentence=-1;

function getLines(){
  if(transcriptLines.length===0) transcriptLines=DEMO.slice(0,3);
  return transcriptLines;
}

function renderButtons(){
  var lines=getLines(),last=lines.slice(-3),sel=document.getElementById('sentSelector');
  if(last.length===0){sel.innerHTML='<div class="empty-state"><span>&#128172;</span>Sentences will appear as you speak</div>';return}
  var h='';
  last.forEach(function(line,i){
    var gi=lines.length-3+i,s=line.length>75?line.substring(0,72)+'…':line;
    h+='<button class="sent-btn'+(activeSentence===gi?' active':'')+'" data-idx="'+gi+'"><span class="sent-idx">#'+(gi+1)+'</span>'+s+'</button>';
  });
  sel.innerHTML=h;
  sel.querySelectorAll('.sent-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      activeSentence=parseInt(this.dataset.idx);renderButtons();parseAndShow(lines[activeSentence]);
    });
  });
  if(activeSentence<0&&last.length>0){activeSentence=lines.length-1;renderButtons();parseAndShow(lines[activeSentence]);}
}

function parseAndShow(text){
  var r=parseSentence(text),to=document.getElementById('treeOut'),ir=document.getElementById('infoRow');
  to.innerHTML=r.tree.join('\n');
  ir.innerHTML='<span class="info-chip">&#128221; <strong>'+r.stats.words+' words · '+r.stats.clauses+' clause'+(r.stats.clauses>1?'s':'')+' · Depth '+r.stats.depth+' · '+r.stats.cefr+'</strong></span>';
}

function addDemoLine(){if(demoIdx<DEMO.length){transcriptLines.push(DEMO[demoIdx]);demoIdx++;renderButtons()}}
function startDemo(){if(demoInterval){clearInterval(demoInterval);demoInterval=null;return}transcriptLines=[];demoIdx=0;activeSentence=-1;demoInterval=setInterval(function(){if(demoIdx>=DEMO.length){clearInterval(demoInterval);demoInterval=null;return}addDemoLine()},2200)}

renderButtons();
window._mockup06_addLine=function(text){transcriptLines.push(text);if(transcriptLines.length>20)transcriptLines.shift();renderButtons()};
window._mockup06_startDemo=startDemo;
</script>
</body>
</html>
