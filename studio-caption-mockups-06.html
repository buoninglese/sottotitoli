<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · 06 · Live Grammar Parse</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh}h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:2px}@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}.subtitle{text-align:center;color:#8b93a5;margin-bottom:24px;font-size:13px}.main-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:24px;max-width:900px;margin:0 auto}.sent-btn{padding:10px 18px;border-radius:100px;border:1px solid #1a1e2e;background:rgba(255,255,255,.03);color:rgba(255,255,255,.6);font-size:12px;font-weight:500;cursor:pointer;transition:all .25s;font-family:inherit;margin-right:8px;margin-bottom:8px}.sent-btn:hover{background:rgba(255,255,255,.06);border-color:#2a2e3e}.sent-btn.active{background:rgba(167,139,250,.12);border-color:#a78bfa;color:#c4b5fd;font-weight:600}.tree-container{font-family:'JetBrains Mono','Geist Mono',monospace;font-size:12px;line-height:1.8;padding:20px;background:rgba(0,0,0,.25);border-radius:12px;border:1px solid rgba(255,255,255,.04);overflow-x:auto;white-space:pre;color:rgba(255,255,255,.55);animation:fadeInUp .4s ease}.pos-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:9px;font-weight:700;margin-left:4px;vertical-align:middle;font-family:'Inter',system-ui,sans-serif}.color-S{color:#e8eaed}.color-NP{color:#60a5fa}.color-VP{color:#34d399}.color-PP{color:#fbbf24}.color-ADJP{color:#f472b6}.color-ADVP{color:#c084fc}.color-CC{color:#fb923c}.info-chip{padding:6px 14px;border-radius:100px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);font-size:10px;color:rgba(255,255,255,.5);display:inline-flex;align-items:center;gap:6px;margin-top:16px;margin-right:8px}.legend-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.legend-chip{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,.4)}.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* JP Minimal Caption Demo */
.caption-demo-wrap{background:#fafaf8;border:1px solid #e8e5df;border-radius:2px;padding:20px 24px;max-width:720px;margin:0 auto 24px;transition:all .5s}
.caption-demo-wrap .jp-label{font-family:'Noto Serif JP',serif;font-size:10px;color:#bbb;letter-spacing:.08em;margin-bottom:8px;text-transform:uppercase}
.caption-demo-wrap .caption-text{font-family:'Noto Serif JP','Inter',sans-serif;font-size:16px;font-weight:300;line-height:1.8;color:#2c2c2c;min-height:48px;transition:all .4s}
.caption-demo-wrap .caption-meta{display:flex;align-items:center;gap:12px;margin-top:10px}
.caption-demo-wrap .caption-ts{font-family:'JetBrains Mono',monospace;font-size:9px;color:#ccc;font-weight:300}
.caption-demo-wrap .caption-spk{font-family:'JetBrains Mono',monospace;font-size:9px;color:#999;font-weight:500;padding:2px 8px;border:1px solid #e8e5df;border-radius:2px}
.caption-demo-wrap .caption-dot{width:5px;height:5px;border-radius:50%;background:#1a1a1a;animation:pulse 2s ease infinite}
.caption-demo-bar{height:1px;background:#f0ede6;margin-top:12px;position:relative}
.caption-demo-bar-fill{height:1px;background:#1a1a1a;transition:width .6s ease;width:0%}
.caption-controls{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.caption-controls button{padding:8px 18px;border-radius:2px;border:1px solid #e8e5df;background:#fff;color:#888;font-family:'Inter',sans-serif;font-size:10px;cursor:pointer;transition:all .2s}
.caption-controls button:hover{background:#fafaf8;color:#1a1a1a;border-color:#ccc}
.caption-controls button.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
</style></head><body>
<div class="caption-demo-wrap" id="captionDemo">
  <div class="jp-label">ライブ · 字幕</div>
  <div class="caption-text" id="captionText"></div>
  <div class="caption-meta">
    <span class="caption-spk" id="captionSpk"></span>
    <span class="caption-ts" id="captionTs"></span>
    <span class="caption-dot"></span>
  </div>
  <div class="caption-demo-bar"><div class="caption-demo-bar-fill" id="captionBar"></div></div>
</div>

  <button onclick="captionAuto()" id="captionAutoBtn">▶ Auto</button>
</div>
<h1>🌳 06 · Live Grammar Parse</h1><p class="subtitle">Interactive Sentence Tree Explorer — June 2026</p><div class="main-card"><div id="sentSelector"></div><div class="tree-container" id="treeOut"></div><div id="infoRow"></div><div class="legend-row"><span class="legend-chip"><span class="legend-dot" style="background:#e8eaed"></span>S (Sentence)</span><span class="legend-chip"><span class="legend-dot" style="background:#60a5fa"></span>NP (Noun)</span><span class="legend-chip"><span class="legend-dot" style="background:#34d399"></span>VP (Verb)</span><span class="legend-chip"><span class="legend-dot" style="background:#fbbf24"></span>PP (Prep)</span><span class="legend-chip"><span class="legend-dot" style="background:#f472b6"></span>ADJP (Adj)</span><span class="legend-chip"><span class="legend-dot" style="background:#c084fc"></span>ADVP (Adv)</span></div></div><script>const POS_COLORS={PRON:'#60a5fa',NOUN:'#60a5fa',VERB:'#34d399',AUX:'#34d399',DET:'#22d3ee',ADJ:'#f472b6',ADV:'#c084fc',PREP:'#fbbf24',CONJ:'#fb923c',PART:'rgba(255,255,255,.4)'};function posBadge(tag){const c=POS_COLORS[tag]||'rgba(255,255,255,.4)';return`<span class="pos-badge" style="background:${c}18;color:${c}">${tag}</span>`}function tree1(){return['<span class="color-S">S</span>','├─ <span class="color-NP">NP</span> ── <span style="color:#e8eaed;font-weight:600">we</span>'+posBadge('PRON'),'├─ <span class="color-VP">VP</span>','│  ├─ <span style="color:#34d399;font-weight:600">are</span>'+posBadge('AUX'),'│  └─ <span style="color:#34d399;font-weight:600">discussing</span>'+posBadge('VERB'),'│     ├─ <span class="color-NP">NP</span>','│     │  ├─ <span class="color-DET">DET</span> ── <span style="color:#e8eaed">the</span>'+posBadge('DET'),'│     │  └─ <span style="color:#60a5fa;font-weight:600">future</span>'+posBadge('NOUN'),'│     └─ <span class="color-PP">PP</span>','│        ├─ <span style="color:#fbbf24">of</span>'+posBadge('PREP'),'│        └─ <span class="color-NP">NP</span>','│           ├─ <span style="color:#f472b6">real</span>'+posBadge('ADJ'),'│           ├─ <span style="color:#22d3ee">-</span>'+posBadge('DET'),'│           └─ <span style="color:#60a5fa;font-weight:600">time translation</span>'+posBadge('NOUN'),'└─ <span class="color-CC">CC</span> ── <span style="color:#fb923c;font-weight:600">and</span>'+posBadge('CONJ'),'   └─ <span class="color-S">S</span>','      ├─ <span class="color-ADVP">ADVP</span> ── <span style="color:#c084fc">how</span>'+posBadge('ADV'),'      ├─ <span class="color-NP">NP</span> ── <span style="color:#e8eaed">it</span>'+posBadge('PRON'),'      ├─ <span class="color-VP">VP</span>','      │  ├─ <span style="color:#34d399">can</span>'+posBadge('AUX'),'      │  └─ <span style="color:#34d399">be used</span>'+posBadge('VERB'),'      └─ <span class="color-PP">PP</span>','         ├─ <span style="color:#fbbf24">in</span>'+posBadge('PREP'),'         └─ <span class="color-NP">NP</span>','            ├─ <span style="color:#f472b6">international</span>'+posBadge('ADJ'),'            └─ <span style="color:#60a5fa;font-weight:600">meetings</span>'+posBadge('NOUN')].join('\n')}function tree2(){return['<span class="color-S">S</span>','├─ <span class="color-NP">NP</span>','│  ├─ <span class="color-DET">DET</span> ── <span style="color:#e8eaed">the</span>'+posBadge('DET'),'│  ├─ <span style="color:#f472b6">quick</span>'+posBadge('ADJ'),'│  └─ <span style="color:#60a5fa;font-weight:600">fox</span>'+posBadge('NOUN'),'├─ <span class="color-VP">VP</span>','│  ├─ <span style="color:#34d399;font-weight:600">jumps</span>'+posBadge('VERB'),'│  └─ <span class="color-ADVP">ADVP</span> ── <span style="color:#c084fc">quickly</span>'+posBadge('ADV'),'└─ <span class="color-PP">PP</span>','   ├─ <span style="color:#fbbf24">over</span>'+posBadge('PREP'),'   └─ <span class="color-NP">NP</span>','      ├─ <span class="color-DET">DET</span> ── <span style="color:#e8eaed">the</span>'+posBadge('DET'),'      ├─ <span style="color:#f472b6">lazy</span>'+posBadge('ADJ'),'      └─ <span style="color:#60a5fa;font-weight:600">dog</span>'+posBadge('NOUN')].join('\n')}function tree3(){return['<span class="color-S">S</span>','├─ <span class="color-NP">NP</span>','│  ├─ <span style="color:#e8eaed;font-weight:600">she</span>'+posBadge('PRON'),'│  └─ <span class="color-CC">CC</span> ── <span style="color:#fb923c">and</span>'+posBadge('CONJ'),'│     └─ <span class="color-NP">NP</span> ── <span style="color:#e8eaed;font-weight:600">I</span>'+posBadge('PRON'),'├─ <span class="color-VP">VP</span>','│  ├─ <span style="color:#34d399">have been</span>'+posBadge('AUX'),'│  └─ <span style="color:#34d399;font-weight:600">studying</span>'+posBadge('VERB'),'│     ├─ <span class="color-NP">NP</span>','│     │  ├─ <span class="color-DET">DET</span> ── <span style="color:#e8eaed">the</span>'+posBadge('DET'),'│     │  └─ <span style="color:#60a5fa;font-weight:600">language</span>'+posBadge('NOUN'),'│     └─ <span class="color-PP">PP</span>','│        ├─ <span style="color:#fbbf24">for</span>'+posBadge('PREP'),'│        └─ <span class="color-NP">NP</span>','│           ├─ <span style="color:#f472b6">three</span>'+posBadge('ADJ'),'│           └─ <span style="color:#60a5fa;font-weight:600">years</span>'+posBadge('NOUN'),'└─ <span class="color-ADVP">ADVP</span> ── <span style="color:#c084fc">now</span>'+posBadge('ADV')].join('\n')}const sents=[{btn:'we are discussing the future of real-time translation…',tree:tree1,stats:'12 words · 3 clauses · Depth 4 · B1-B2'},{btn:'the quick fox jumps quickly over the lazy dog',tree:tree2,stats:'9 words · 1 clause · Depth 3 · A2'},{btn:'she and I have been studying the language for three years',tree:tree3,stats:'14 words · 2 clauses · Depth 4 · B1'}];const selDiv=document.getElementById('sentSelector');const treeOut=document.getElementById('treeOut');const infoRow=document.getElementById('infoRow');sents.forEach((s,i)=>{const btn=document.createElement('button');btn.className='sent-btn'+(i===0?' active':'');btn.textContent=(i+1)+'. '+s.btn;btn.addEventListener('click',()=>{document.querySelectorAll('.sent-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');treeOut.innerHTML=s.tree();infoRow.innerHTML=`<span class="info-chip">📝 <strong>${s.stats}</strong></span>`});selDiv.appendChild(btn)});treeOut.innerHTML=sents[0].tree();infoRow.innerHTML=`<span class="info-chip">📝 <strong>${sents[0].stats}</strong></span>`;
var CAPTIONS=[{spk:'SPK A',ts:'00:04',text:'we are discussing the future of real-time translation systems across different language pairs'},{spk:'SPK B',ts:'00:12',text:'the neural models have become remarkably accurate for romance languages in particular'},{spk:'SPK A',ts:'00:19',text:'exactly — deployment at scale remains our biggest challenge this year'},{spk:'SPK C',ts:'00:26',text:'I think the latency improvements are the key factor for user adoption'}];
var capIdx=0,capTimer=null;
function showCaption(i){
  var c=CAPTIONS[i%CAPTIONS.length];
  document.getElementById('captionText').textContent=c.text;
  document.getElementById('captionSpk').textContent=c.spk;
  document.getElementById('captionTs').textContent=c.ts;
  document.getElementById('captionBar').style.width=((i+1)/CAPTIONS.length*100)+'%';
}
function captionCycle(){capIdx=(capIdx+1)%CAPTIONS.length;showCaption(capIdx)}
function captionAuto(){
  var btn=document.getElementById('captionAutoBtn');
  if(capTimer){clearInterval(capTimer);capTimer=null;btn.textContent='▶ Auto';btn.classList.remove('active');return}
  btn.textContent='⏹ Stop';btn.classList.add('active');
  capIdx=0;showCaption(0);
  capTimer=setInterval(function(){capIdx++;if(capIdx>=CAPTIONS.length){clearInterval(capTimer);capTimer=null;btn.textContent='▶ Auto';btn.classList.remove('active');return}showCaption(capIdx)},2800)
}
showCaption(0);

</script></body></html>
