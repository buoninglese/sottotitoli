<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · 06 · Live Grammar Parse</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh}h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:2px}@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}.subtitle{text-align:center;color:#8b93a5;margin-bottom:20px;font-size:13px}.main-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:24px;max-width:900px;margin:0 auto}.top-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}.sent-btn{padding:9px 16px;border-radius:100px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:rgba(255,255,255,.5);font-size:11px;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}.sent-btn:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.75)}.sent-btn.active{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.25);color:#60a5fa;font-weight:600}.toggle-btn{padding:6px 12px;border-radius:100px;border:1px solid rgba(255,255,255,.06);background:transparent;color:rgba(255,255,255,.35);font-size:10px;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit}.toggle-btn:hover{color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.15)}.toggle-btn.on{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.2);color:#34d399}.tree-container{font-family:'JetBrains Mono','Geist Mono',monospace;font-size:12px;line-height:1.9;padding:22px 24px;background:rgba(0,0,0,.3);border-radius:14px;border:1px solid rgba(255,255,255,.04);overflow-x:auto;color:rgba(255,255,255,.5);position:relative;transition:all .3s}.tree-line{display:block;padding:1px 0;transition:all .2s;border-radius:3px;cursor:default}.tree-line:hover{background:rgba(255,255,255,.015)}.pos-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:8px;font-weight:700;margin-left:3px;vertical-align:middle;font-family:'Inter',system-ui,sans-serif}.info-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.info-chip{padding:5px 12px;border-radius:100px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);font-size:10px;color:rgba(255,255,255,.45);display:inline-flex;align-items:center;gap:5px}.legend-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.legend-chip{display:flex;align-items:center;gap:4px;font-size:9px;color:rgba(255,255,255,.3)}.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style></head><body><h1>🌳 06 · Live Grammar Parse</h1><p class="subtitle">Interactive Sentence Tree Explorer — June 2026</p><div class="main-card"><div class="top-bar"><span style="font-size:10px;font-weight:600;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.1em;margin-right:4px">Sentences</span><span id="sentSelector"></span><span style="margin-left:auto;display:flex;gap:6px"><button class="toggle-btn on" id="toggleFull" onclick="toggleView('full')">Full Tree</button><button class="toggle-btn" id="toggleSimple" onclick="toggleView('simple')">Simple</button></span></div><div class="tree-container" id="treeOut"></div><div class="info-row" id="infoRow"></div><div class="legend-row"><span class="legend-chip"><span class="legend-dot" style="background:#e8eaed"></span>S</span><span class="legend-chip"><span class="legend-dot" style="background:#60a5fa"></span>NP</span><span class="legend-chip"><span class="legend-dot" style="background:#34d399"></span>VP</span><span class="legend-chip"><span class="legend-dot" style="background:#fbbf24"></span>PP</span><span class="legend-chip"><span class="legend-dot" style="background:#f472b6"></span>ADJP</span><span class="legend-chip"><span class="legend-dot" style="background:#c084fc"></span>ADVP</span><span class="legend-chip"><span class="legend-dot" style="background:#fb923c"></span>CC</span></div></div><script>var POS_COLORS={PRON:'#60a5fa',NOUN:'#60a5fa',VERB:'#34d399',AUX:'#34d399',DET:'#22d3ee',ADJ:'#f472b6',ADV:'#c084fc',PREP:'#fbbf24',CONJ:'#fb923c',PART:'rgba(255,255,255,.4)'};function posBadge(tag){var c=POS_COLORS[tag]||'rgba(255,255,255,.4)';return'<span class="pos-badge" style="background:'+c+'18;color:'+c+'">'+tag+'</span>'}function tree1(){return['S','├─ <span style="color:#60a5fa;font-weight:600">NP</span> ── we'+posBadge('PRON'),'├─ <span style="color:#34d399;font-weight:600">VP</span>','│  ├─ are'+posBadge('AUX'),'│  └─ <span style="font-weight:600">discussing</span>'+posBadge('VERB'),'│     ├─ <span style="color:#60a5fa;font-weight:600">NP</span> ── the <span style="font-weight:600">future</span>'+posBadge('NOUN'),'│     └─ <span style="color:#fbbf24;font-weight:600">PP</span> ── of <span style="font-weight:600">real‑time translation</span>'+posBadge('NOUN'),'└─ <span style="color:#fb923c;font-weight:600">CC</span> ── and'+posBadge('CONJ'),'   └─ S','      ├─ <span style="color:#c084fc;font-weight:600">ADVP</span> ── how'+posBadge('ADV'),'      ├─ <span style="color:#60a5fa;font-weight:600">NP</span> ── it'+posBadge('PRON'),'      ├─ <span style="color:#34d399;font-weight:600">VP</span> ── can be used'+posBadge('VERB'),'      └─ <span style="color:#fbbf24;font-weight:600">PP</span> ── in international <span style="font-weight:600">meetings</span>'+posBadge('NOUN')].join('\n')}function tree1simple(){return['S','├─ <span style="color:#60a5fa;font-weight:600">NP</span> ── we','├─ <span style="color:#34d399;font-weight:600">VP</span> ── are discussing','│  ├─ <span style="color:#60a5fa;font-weight:600">NP</span> ── the future','│  └─ <span style="color:#fbbf24;font-weight:600">PP</span> ── of real‑time translation','└─ <span style="color:#fb923c;font-weight:600">CC</span> ── and','   └─ S ── how it can be used in international meetings'].join('\n')}function tree2(){return['S','├─ <span style="color:#60a5fa;font-weight:600">NP</span> ── the quick <span style="font-weight:600">fox</span>'+posBadge('NOUN'),'├─ <span style="color:#34d399;font-weight:600">VP</span> ── <span style="font-weight:600">jumps</span>'+posBadge('VERB')+' quickly'+posBadge('ADV'),'└─ <span style="color:#fbbf24;font-weight:600">PP</span> ── over','   └─ <span style="color:#60a5fa;font-weight:600">NP</span> ── the lazy <span style="font-weight:600">dog</span>'+posBadge('NOUN')].join('\n')}function tree2simple(){return['S','├─ <span style="color:#60a5fa;font-weight:600">NP</span> ── the quick fox','├─ <span style="color:#34d399;font-weight:600">VP</span> ── jumps quickly','└─ <span style="color:#fbbf24;font-weight:600">PP</span> ── over the lazy dog'].join('\n')}function tree3(){return['S','├─ <span style="color:#60a5fa;font-weight:600">NP</span> ── she'+posBadge('PRON')+' and I'+posBadge('PRON'),'├─ <span style="color:#34d399;font-weight:600">VP</span> ── have been <span style="font-weight:600">studying</span>'+posBadge('VERB'),'│  ├─ <span style="color:#60a5fa;font-weight:600">NP</span> ── the <span style="font-weight:600">language</span>'+posBadge('NOUN'),'│  └─ <span style="color:#fbbf24;font-weight:600">PP</span> ── for three <span style="font-weight:600">years</span>'+posBadge('NOUN'),'└─ <span style="color:#c084fc;font-weight:600">ADVP</span> ── now'+posBadge('ADV')].join('\n')}function tree3simple(){return['S','├─ <span style="color:#60a5fa;font-weight:600">NP</span> ── she and I','├─ <span style="color:#34d399;font-weight:600">VP</span> ── have been studying','│  ├─ <span style="color:#60a5fa;font-weight:600">NP</span> ── the language','│  └─ <span style="color:#fbbf24;font-weight:600">PP</span> ── for three years','└─ <span style="color:#c084fc;font-weight:600">ADVP</span> ── now'].join('\n')}var sents=[{btn:'1. discussing the future of real-time translation…',tree:tree1,simple:tree1simple,stats:'12 words · 3 clauses · Depth 4 · B1-B2'},{btn:'2. the quick fox jumps over the lazy dog',tree:tree2,simple:tree2simple,stats:'9 words · 1 clause · Depth 3 · A2'},{btn:'3. she and I have been studying for three years',tree:tree3,simple:tree3simple,stats:'14 words · 2 clauses · Depth 4 · B1'}];var selDiv=document.getElementById('sentSelector');var treeOut=document.getElementById('treeOut');var infoRow=document.getElementById('infoRow');var currentSent=0;var currentView='full';function render(){var s=sents[currentSent];infoRow.innerHTML='<span class="info-chip">📝 <strong>'+s.stats+'</strong></span><span class="info-chip">🌳 <strong>'+(currentView==='full'?'Full':'Simple')+'</strong> view</span>';treeOut.innerHTML=(currentView==='full'?s.tree:s.simple)();treeOut.style.animation='none';treeOut.offsetHeight;treeOut.style.animation='fadeInUp .35s ease'}function toggleView(v){currentView=v;document.getElementById('toggleFull').className='toggle-btn'+(v==='full'?' on':'');document.getElementById('toggleSimple').className='toggle-btn'+(v==='simple'?' on':'');render()}sents.forEach(function(s,i){var btn=document.createElement('button');btn.className='sent-btn'+(i===0?' active':'');btn.textContent=s.btn;btn.addEventListener('click',function(){document.querySelectorAll('.sent-btn').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');currentSent=i;render()});selDiv.appendChild(btn)});render();</script></body></html>
