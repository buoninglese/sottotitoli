<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Waveform Variations</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:32px 24px}
h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:titleShift 6s linear infinite;margin-bottom:4px}
@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.subtitle{text-align:center;color:#8b93a5;margin-bottom:32px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;max-width:1400px;margin:0 auto}
.card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:20px;transition:all .25s}
.card:hover{border-color:#2a2e3e;transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.card-num{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.2);margin-bottom:4px}
.card-title{font-size:11px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:10px}
.viz-area{position:relative;width:100%;height:140px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.2)}
.viz-area canvas{width:100%;height:100%}
</style>
</head>
<body>
<h1>Waveform Explorer</h1>
<p class="subtitle">10 wild waveform visualization variations — June 2026</p>
<div class="grid" id="grid"></div>

<script>
var cards=[];
var animId=null;
var t=0;

// ═══════════════════════════════
// 10 WAVEFORM VARIATIONS
// ═══════════════════════════════
var waveforms=[
  // 0: Classic smooth
  {name:'Classic Smooth',draw:function(ctx,W,H,v){
    ctx.beginPath();ctx.moveTo(0,H/2);
    for(var i=0;i<=W;i+=3){
      var fi=0.15+Math.sin(i*0.015+t/1000)*0.3;
      ctx.lineTo(i,H/2-fi*H*0.4*v*3);
    }
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'rgba(167,139,250,0.3)');g.addColorStop(1,'rgba(167,139,250,0.02)');
    ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();ctx.moveTo(0,H/2);
    for(var i=0;i<=W;i+=3){
      var fi=0.15+Math.sin(i*0.015+t/1000)*0.3;
      ctx.lineTo(i,H/2-fi*H*0.4*v*3);
    }
    ctx.strokeStyle='rgba(167,139,250,0.8)';ctx.lineWidth=1.5+v*2;ctx.stroke();
  }},
  // 1: Chubby blocks
  {name:'Chubby Blocks',draw:function(ctx,W,H,v){
    var bw=Math.max(5,W/70),n=Math.floor(W/bw);
    for(var i=0;i<n;i++){
      var fi=0.15+Math.sin(i*0.06+t/900)*0.4;
      var hgt=Math.max(5,fi*H*0.45*v*3);
      var x=i*bw,y=H/2-hgt/2;
      var g=ctx.createLinearGradient(x,y,x,y+hgt);
      g.addColorStop(0,'rgba(52,211,153,0.7)');g.addColorStop(1,'rgba(52,211,153,0.2)');
      ctx.fillStyle=g;ctx.fillRect(x+1,y,bw-2,hgt);
  }}},
  // 2: Glowing ribbon
  {name:'Glowing Ribbon',draw:function(ctx,W,H,v){
    ctx.shadowColor='rgba(244,114,182,0.6)';ctx.shadowBlur=8+v*15;
    ctx.beginPath();ctx.moveTo(0,H/2);
    for(var i=0;i<=W;i+=2){
      var fi=0.15+Math.sin(i*0.02+t/800)*0.4+Math.sin(i*0.05+t/600)*0.2;
      ctx.lineTo(i,H/2-fi*H*0.35*v*3);
    }
    ctx.strokeStyle='rgba(244,114,182,0.9)';ctx.lineWidth=2.5+v*4;ctx.stroke();
    ctx.shadowBlur=0;
  }},
  // 3: Particle trail
  {name:'Particle Trail',draw:function(ctx,W,H,v){
    for(var i=0;i<=W;i+=4){
      var fi=0.15+Math.sin(i*0.025+t/700)*0.4;
      var y=H/2-fi*H*0.35*v*3;
      var r=1.5+fi*5;
      ctx.beginPath();ctx.arc(i,y,r,0,Math.PI*2);
      ctx.fillStyle='hsla('+(260+i*2)%360+',70%,70%,'+(0.4+fi*0.5)+')';ctx.fill();
  }}},
  // 4: Stepped terrace
  {name:'Stepped Terrace',draw:function(ctx,W,H,v){
    var stepH=Math.max(3,H/50),steps=Math.floor(H/stepH);
    for(var i=0;i<=W;i+=6){
      var fi=0.15+Math.sin(i*0.02+t/1000)*0.4;
      var midH=Math.floor((H/2-fi*H*0.35*v*3)/stepH)*stepH;
      var hue=(260+i*3)%360;
      for(var s=0;s<steps;s++){
        var sy=s*stepH;
        if(sy>=midH) break;
        ctx.fillStyle='hsla('+hue+',60%,'+(40+s*1.5)+'%,'+(0.15+s*0.02)+')';
        ctx.fillRect(i,sy,6,stepH-1);
      }
  }}},
  // 5: Mirror mountain
  {name:'Mirror Mountain',draw:function(ctx,W,H,v){
    ctx.beginPath();ctx.moveTo(0,H/2);
    for(var i=0;i<=W;i+=2){
      var fi=0.15+Math.sin(i*0.018+t/850)*0.4;
      ctx.lineTo(i,H/2-fi*H*0.4*v*3);
    }
    for(var i=W;i>=0;i-=2){
      var fi=0.15+Math.sin(i*0.018+t/850+Math.PI)*0.4;
      ctx.lineTo(i,H/2+fi*H*0.4*v*3);
    }
    ctx.closePath();
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'rgba(96,165,250,0.5)');g.addColorStop(0.5,'rgba(167,139,250,0.3)');g.addColorStop(1,'rgba(96,165,250,0.5)');
    ctx.fillStyle=g;ctx.fill();
  }},
  // 6: Dot constellation
  {name:'Dot Constellation',draw:function(ctx,W,H,v){
    for(var i=0;i<=W;i+=3){
      var fi=0.15+Math.sin(i*0.022+t/750)*0.4+Math.sin(i*0.07+t/550)*0.15;
      var y=H/2-fi*H*0.38*v*3;
      var hue=(260+i*4)%360;
      ctx.beginPath();ctx.arc(i,y,2+fi*3,0,Math.PI*2);
      ctx.fillStyle='hsla('+hue+',70%,70%,'+0.8+')';ctx.fill();
      // Trail
      ctx.beginPath();ctx.arc(i,Math.min(H-2,y+8+fi*20),1,0,Math.PI*2);
      ctx.fillStyle='hsla('+hue+',60%,60%,0.3)';ctx.fill();
  }}},
  // 7: Brush stroke
  {name:'Brush Stroke',draw:function(ctx,W,H,v){
    ctx.beginPath();ctx.moveTo(0,H/2);
    for(var i=0;i<=W;i+=1){
      var fi=0.15+Math.sin(i*0.01+t/950)*0.35+Math.sin(i*0.04+t/600)*0.2;
      var y=H/2-fi*H*0.4*v*3;
      if(i===0)ctx.moveTo(i,y);else ctx.lineTo(i,y);
    }
    ctx.strokeStyle='rgba(251,191,36,0.8)';ctx.lineWidth=4+v*6;
    ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
    ctx.strokeStyle='rgba(251,191,36,0.3)';ctx.lineWidth=8+v*10;ctx.stroke();
  }},
  // 8: Neon tubes
  {name:'Neon Tubes',draw:function(ctx,W,H,v){
    var colors=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c084fc'];
    for(var t=0;t<3;t++){
      ctx.beginPath();ctx.moveTo(0,H/2);
      for(var i=0;i<=W;i+=2){
        var fi=0.15+Math.sin(i*0.02+t/800+t*0.8)*0.35;
        ctx.lineTo(i,H/2-fi*H*0.3*v*2.5);
      }
      ctx.strokeStyle=colors[t];ctx.lineWidth=2+v*3;ctx.stroke();
      ctx.shadowColor=colors[t];ctx.shadowBlur=6+v*10;
      ctx.stroke();ctx.shadowBlur=0;
    }
  }},
  // 9: Liquid fill
  {name:'Liquid Fill',draw:function(ctx,W,H,v){
    var baseY=H*0.7;
    ctx.beginPath();ctx.moveTo(0,H);
    for(var i=0;i<=W;i+=3){
      var wave=Math.sin(i*0.015+t/700)*H*0.12+Math.sin(i*0.04+t/500)*H*0.06;
      var fi=0.15+Math.sin(i*0.02+t/1000)*0.3;
      ctx.lineTo(i,baseY-wave-fi*H*0.25*v*3);
    }
    ctx.lineTo(W,H);ctx.closePath();
    var g=ctx.createLinearGradient(0,baseY-H*0.3,0,H);
    g.addColorStop(0,'rgba(52,211,153,0.7)');g.addColorStop(0.5,'rgba(96,165,250,0.5)');g.addColorStop(1,'rgba(167,139,250,0.2)');
    ctx.fillStyle=g;ctx.fill();
    // Top surface line
    ctx.beginPath();ctx.moveTo(0,baseY);
    for(var i=0;i<=W;i+=3){
      var wave=Math.sin(i*0.015+t/700)*H*0.12+Math.sin(i*0.04+t/500)*H*0.06;
      var fi=0.15+Math.sin(i*0.02+t/1000)*0.3;
      ctx.lineTo(i,baseY-wave-fi*H*0.25*v*3);
    }
    ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1.5;ctx.stroke();
  }}
];

function buildCards(){
  var grid=document.getElementById('grid');
  waveforms.forEach(function(wf,i){
    var card=document.createElement('div');card.className='card';
    card.innerHTML='<div class="card-num">#'+(i+1)+'</div><div class="card-title">'+wf.name+'</div><div class="viz-area"><canvas id="cwf'+i+'"></canvas></div>';
    grid.appendChild(card);
  });
  // Cache canvases
  cards=[];
  for(var i=0;i<waveforms.length;i++){
    var c=document.getElementById('cwf'+i);
    if(c){c.width=c.parentElement.offsetWidth;c.height=140;cards.push({ctx:c.getContext('2d'),fn:waveforms[i].draw,w:c.width,h:140})}
  }
}

function animate(ts){
  animId=requestAnimationFrame(animate);
  t=ts||Date.now();
  var v=0.08+Math.sin(t/1800)*0.06+Math.sin(t/3100)*0.04+Math.sin(t/5200)*0.02;
  cards.forEach(function(crd){
    crd.ctx.clearRect(0,0,crd.w,crd.h);
    crd.fn(crd.ctx,crd.w,crd.h,v);
  });
}

buildCards();
animate();
window.addEventListener('resize',function(){
  cards=[];
  for(var i=0;i<waveforms.length;i++){
    var c=document.getElementById('cwf'+i);
    if(c){c.width=c.parentElement.offsetWidth;c.height=140;cards.push({ctx:c.getContext('2d'),fn:waveforms[i].draw,w:c.width,h:140})}
  }
});
</script>
</body>
</html>
