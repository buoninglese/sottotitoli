<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sottotitoli · AI Reports</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --bg: #0a0f14; --card: rgba(255,255,255,.02); --line: rgba(255,255,255,.06);
  --text: rgba(255,255,255,.85); --muted: rgba(255,255,255,.45); --muted2: rgba(255,255,255,.18);
  --accent: #34d399; --accent2: #6ee7b7; --warn: #fbbf24; --danger: #f87171;
  --blue: #60a5fa; --amber: #fbbf24; --pink: #f472b6;
}
body {
  font-family: 'Work Sans', system-ui, sans-serif;
  background: #0a0f14; color: var(--text);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  -webkit-font-smoothing: antialiased; padding: 0 0 40px;
}

/* ═══ TOP BAR ═══ */
.topbar {
  position: relative; z-index: 100; width: 100%; max-width: 1200px;
  display: flex; align-items: center; gap: 10px; padding: 12px 20px;
  background: #0c1118; border-bottom: 1px solid rgba(255,255,255,.04);
}
.topbar .logo {
  font-family: 'Bebas Neue', sans-serif; font-size: 20px;
  letter-spacing: 1px; color: var(--accent); text-decoration: none;
}
.topbar .logo span { color: rgba(255,255,255,.25); }
.topbar .spacer { flex: 1; }
.topbar a.nav-link {
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
  padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.03); color: rgba(255,255,255,.5);
  cursor: pointer; transition: all .2s; text-decoration: none;
}
.topbar a.nav-link:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.75); }
.topbar a.nav-link.active { background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.25); color: var(--accent); }

/* ═══ CONTAINER ═══ */
.container { max-width: 1060px; width: 100%; margin: 0 auto; padding: 0 24px 80px; }

/* ═══ HERO ═══ */
.hero { padding: 48px 0 28px; text-align: center; position: relative; }
.hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: 38px; font-weight: 400; letter-spacing: 1px; color: var(--accent); }
.hero p { font-size: 14px; color: var(--muted); margin-top: 8px; max-width: 500px; margin-left: auto; margin-right: auto; }
.token-bar {
  display: inline-flex; align-items: center; gap: 10px; margin-top: 14px;
  padding: 10px 20px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06);
  border-radius: 100px; font-size: 13px; color: var(--muted);
}
.token-bar strong { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

/* ═══ SECTION TITLES ═══ */
.section-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }

/* ═══ MARKETPLACE GRID ═══ */
.mp-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,1fr)); gap: 12px; margin-bottom: 32px; }
.mp-card {
  background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06);
  border-radius: 12px; padding: 20px; cursor: pointer; transition: all .25s;
  position: relative; overflow: hidden;
}
.mp-card:hover { transform: translateY(-2px); border-color: rgba(52,211,153,.25); background: rgba(52,211,153,.04); }
.mp-card:hover .mp-glow { opacity: 1; }
.mp-glow { position: absolute; top: -30px; right: -30px; width: 100px; height: 100px; border-radius: 50%; opacity: 0; transition: opacity .4s; pointer-events: none; }
.mp-icon { font-size: 32px; margin-bottom: 10px; display: block; }
.mp-card h3 { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
.mp-card .mp-desc { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
.mp-card .mp-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted2); }
.mp-card .mp-price { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--accent); font-size: 13px; }
.mp-badge { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 100px; }
.badge-popular { background: rgba(52,211,153,.1); color: var(--accent); }
.badge-new { background: rgba(52,211,153,.1); color: var(--accent2); }
.badge-premium { background: rgba(251,191,36,.1); color: var(--amber); }

/* ═══ MODAL ═══ */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.active { display: flex; }
.modal { background: #121620; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 28px; max-width: 520px; width: 100%; max-height: 80vh; overflow-y: auto; position: relative; box-shadow: 0 24px 80px rgba(0,0,0,.5); }
.modal h3 { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; margin-bottom: 4px; color: #e8eaed; }
.modal .mod-desc { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
.modal .close-btn {
  position: absolute; top: 12px; right: 12px; width: 32px; height: 32px;
  border-radius: 50%; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
  cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
  color: var(--muted);
}
.modal .close-btn:hover { color: var(--text); border-color: var(--accent); background: rgba(52,211,153,.08); }

/* ═══ SESSION PICKER ═══ */
.sess-pick { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; margin-bottom: 14px; }
.sess-pick-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: rgba(255,255,255,.02); border-radius: 10px; cursor: pointer;
  border: 1px solid rgba(255,255,255,.04); font-size: 12px; transition: all .15s;
}
.sess-pick-item:hover { border-color: rgba(255,255,255,.1); background: rgba(255,255,255,.04); }
.sess-pick-item.selected { border-color: rgba(52,211,153,.25); background: rgba(52,211,153,.06); }
.sess-pick-item .sp-radio {
  width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.15);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}
.sess-pick-item.selected .sp-radio { border-color: var(--accent); background: var(--accent); }
.sess-pick-item.selected .sp-radio::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #000; }

/* ═══ BUTTONS ═══ */
.btn { font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer; border: none; transition: all .25s; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; border-radius: 8px; }
.btn-primary { background: var(--accent); color: #000; padding: 12px 28px; font-size: 14px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(52,211,153,.25); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,.1); color: var(--muted); padding: 10px 20px; font-size: 12px; }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

/* ═══ MY REPORTS ═══ */
.report-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }
.report-item {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px;
  background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.04);
  border-radius: 10px; font-size: 13px; transition: all .2s;
}
.report-item:hover { border-color: rgba(52,211,153,.2); background: rgba(52,211,153,.04); }
.ri-status { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 100px; white-space: nowrap; }
.ri-done { background: rgba(52,211,153,.1); color: var(--accent); }
.ri-processing { background: rgba(251,191,36,.1); color: var(--amber); animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.ri-failed { background: rgba(248,113,113,.1); color: var(--danger); }
.ri-score { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; margin-left: auto; color: var(--text); }

/* ═══ QUESTIONNAIRE ═══ */
.q-card { background: rgba(52,211,153,.03); border: 1px solid rgba(52,211,153,.1); border-radius: 12px; padding: 20px; margin-bottom: 32px; }
.q-card h3 { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.q-card p { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.q-chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 100px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid rgba(255,255,255,.1); background: transparent; color: var(--muted); margin: 3px; transition: all .15s; font-family: 'Inter', sans-serif; }
.q-chip:hover { border-color: var(--accent); color: var(--accent); }
.q-chip.active { background: rgba(52,211,153,.12); color: var(--accent); border-color: rgba(52,211,153,.25); }

/* ═══ EMPTY STATE ═══ */
.empty { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }

/* ═══ RESPONSIVE ═══ */
@media(max-width:768px) {
  .topbar { padding: 8px 10px; gap: 5px; flex-wrap: wrap; }
  .topbar .logo { font-size: 16px; }
  .topbar a.nav-link { font-size: 10px; padding: 3px 7px; }
  .container { padding: 0 12px 60px; }
  .hero { padding: 32px 0 20px; }
  .hero h1 { font-size: 28px; }
  .mp-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="topbar" id="topbar">
  <a href="index.html" class="logo">SOTTO<span>TITOLI</span></a>
  <span class="spacer"></span>
  <a href="index.html" class="nav-link">Home</a>
  <a href="start.html" class="nav-link">Start</a>
  <a href="account.html" class="nav-link">Profilo</a>
</header>

<div class="container">

  <div class="hero">
    <h1>📊 Report Marketplace</h1>
    <p>Scegli un report AI, seleziona una trascrizione, e ricevi un'analisi dettagliata del tuo inglese.</p>
    <div class="token-bar">🪙 <strong id="tokenBalance">—</strong> token disponibili · <a href="wallet.html" style="color:var(--accent);font-weight:600;font-size:12px">Acquista token →</a></div>
  </div>

  <!-- Marketplace -->
  <div class="section-title">🛒 Report disponibili</div>
  <div class="mp-grid" id="marketplaceGrid"></div>

  <!-- My Reports -->
  <div class="section-title">📄 I miei report</div>
  <div class="report-list" id="myReports"></div>

</div>

<!-- Purchase Modal -->
<div class="modal-overlay" id="purchaseModal">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h3 id="modTitle">—</h3>
    <div class="mod-desc" id="modDesc"></div>
    <div style="font-size:12px;font-weight:600;margin-bottom:8px">Seleziona una trascrizione:</div>
    <div class="sess-pick" id="modSessions"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
      <span style="font-size:12px;color:var(--muted2)">Costo: <strong style="color:var(--accent);font-family:JetBrains Mono,monospace" id="modPrice">—</strong></span>
      <button class="btn btn-primary" id="modBuyBtn" disabled>Acquista report</button>
    </div>
    <div id="modStatus" style="margin-top:10px;font-size:12px;display:none"></div>
  </div>
</div>

<!-- Report Detail Modal -->
<div class="modal-overlay" id="reportDetailModal">
  <div class="modal" style="max-width:680px">
    <button class="close-btn" onclick="document.getElementById('reportDetailModal').classList.remove('active')">✕</button>
    <div id="reportDetailContent" style="font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:65vh;overflow-y:auto"></div>
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" style="font-size:12px;padding:8px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:100px;cursor:pointer;color:var(--text)" onclick="downloadReportPDF()">🖨️ Scarica PDF</button>
      <button class="btn" style="font-size:12px;padding:8px 16px;background:var(--accent);border:none;border-radius:100px;cursor:pointer;color:#fff" onclick="document.getElementById('reportDetailModal').classList.remove('active')">Chiudi</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=14"></script>
<script src="js/auth.js?v=8"></script>

<script>
var REPORT_TYPES=[
  {id:'grammar',icon:'📝',name:'Grammar & Accuracy',desc:'Analisi grammaticale completa: tempi verbali, preposizioni, articoli, concordanze.',price:2,color:'var(--accent)',badge:'popular',badgeText:'Più richiesto',moduleKey:'1',family:'cambridge',sessionModes:['caption']},
  {id:'vocabulary',icon:'📚',name:'Vocabulary Range',desc:'Diversità e sofisticazione del vocabolario. Mappatura CEFR, copertura NGSL.',price:2,color:'var(--accent2)',badge:'new',badgeText:'Nuovo',moduleKey:'2',family:'cambridge',sessionModes:['caption']},
  {id:'fluency',icon:'💨',name:'Fluency & Coherence',desc:'Ritmo di parlato, pause, filler words. Analisi della fluidità.',price:2,color:'var(--blue)',badge:'',badgeText:'',moduleKey:'3',family:'cambridge',sessionModes:['caption']},
  {id:'cefr',icon:'🎯',name:'CEFR Level Assessment',desc:'Stima del livello CEFR (A1-C2) basata su metriche reali.',price:2,color:'var(--amber)',badge:'',badgeText:'',moduleKey:'4',family:'cambridge',sessionModes:['caption']},
  {id:'progress',icon:'📈',name:'Progress Report',desc:'Trend, confronto sessioni, plateau detection, proiezioni future.',price:3,color:'var(--pink)',badge:'premium',badgeText:'Premium',moduleKey:'5',family:'business',sessionModes:['caption','translate']},
  {id:'style',icon:'🎨',name:'Speaking Style',desc:'Formalità, complessità frasi, voce passiva, varietà connettivi.',price:2,color:'#06b6d4',badge:'',badgeText:'',moduleKey:'8',family:'academic',sessionModes:['caption']},
  {id:'transfer',icon:'🔄',name:'Language Transfer',desc:'Interferenze e pattern di traduzione tra la tua lingua madre e quella obiettivo.',price:3,color:'var(--danger)',badge:'premium',badgeText:'Premium',moduleKey:'9',family:'academic',sessionModes:['caption','translate']},
  {id:'business',icon:'💼',name:'Business English',desc:'Vocabolario business, frasi da riunione, email formali.',price:3,color:'var(--blue)',badge:'premium',badgeText:'Premium',moduleKey:'6',family:'business',sessionModes:['caption','translate']},
  {id:'exam',icon:'🏅',name:'Exam Readiness',desc:'Stima punteggio IELTS/TOEFL, aree da migliorare per l\'esame.',price:4,color:'var(--amber)',badge:'premium',badgeText:'Premium',moduleKey:'11',family:'linguistic',sessionModes:['caption']},
  {id:'comprehensive',icon:'🌟',name:'Comprehensive Analysis',desc:'Report completo: grammatica, vocabolario, fluidità, CEFR, stile.',price:5,color:'var(--accent)',badge:'new',badgeText:'Consigliato',moduleKey:'14',family:'linguistic',sessionModes:['caption']}
];

var allSessions=[],selectedSession=null,selectedReport=null,myReports=[];

// Module ID → display name mapping (kept in sync with account.html)
var REPORT_MODULES={1:{icon:'📝',name:'Grammar & Accuracy'},2:{icon:'📚',name:'Vocabulary Range'},3:{icon:'💨',name:'Fluency & Coherence'},4:{icon:'🎯',name:'CEFR Assessment'},5:{icon:'📈',name:'Progress Report'},6:{icon:'💼',name:'Business English'},7:{icon:'🗂️',name:'Business Vocabulary'},8:{icon:'🎨',name:'Speaking Style'},9:{icon:'🔄',name:'English Transfer'},10:{icon:'📖',name:'Academic Vocabulary'},11:{icon:'🔬',name:'Discourse Analysis'},12:{icon:'🧮',name:'Syntax & Complexity'},13:{icon:'📊',name:'Lexical Analysis'},14:{icon:'🌟',name:'Comprehensive'}};

(async function init(){
  var supabase=window.sottotitoliSupabase;
  if(!supabase){setTimeout(init,500);return}
  supabase.auth.onAuthStateChange(function(event,session){if(session)loadData(supabase,session.user.id)});
  var r=await supabase.auth.getSession();
  if(!r.data?.session)return;
  loadData(supabase,r.data.session.user.id);
})();

async function loadData(supabase,userId){
  var tokResp=await supabase.from('user_tokens').select('balance').eq('user_id',userId).maybeSingle();
  document.getElementById('tokenBalance').textContent=tokResp.data?.balance??3;

  var sessResp=await supabase.from('sessions').select('id,mode,started_at,duration_seconds,words_count,transcript_text').eq('user_id',userId).order('started_at',{ascending:false}).limit(50);
  allSessions=(sessResp.data||[]).filter(function(s){return s.started_at&&s.transcript_text});

  var repResp=await supabase.from('session_ai_reports').select('id,module_id,overall_score,summary_text,status,created_at').eq('user_id',userId).order('created_at',{ascending:false}).limit(30);
  myReports=repResp.data||[];

  var q=JSON.parse(localStorage.getItem('sottotitoli_questionnaire')||'{}');
  document.querySelectorAll('.q-chip').forEach(function(c){c.classList.toggle('active',q[c.parentElement.id]===c.dataset.val)});

  renderMarketplace();renderMyReports();
}

// Always render marketplace (even when logged out)
renderMarketplace();

document.querySelectorAll('.q-chip').forEach(function(c){
  c.addEventListener('click',function(){
    var g=this.parentElement;g.querySelectorAll('.q-chip').forEach(function(x){x.classList.remove('active')});this.classList.add('active');
    var q=JSON.parse(localStorage.getItem('sottotitoli_questionnaire')||'{}');q[g.id]=this.dataset.val;localStorage.setItem('sottotitoli_questionnaire',JSON.stringify(q));
  });
});

function renderMarketplace(){
  var grid=document.getElementById('marketplaceGrid'),h='';
  REPORT_TYPES.forEach(function(rt){
    var modeTag='';if(rt.sessionModes&&rt.sessionModes.length===1){modeTag='<span style="font-size:9px;color:var(--muted2);background:rgba(255,255,255,.03);padding:2px 6px;border-radius:100px;margin-left:4px">'+(rt.sessionModes[0]==='caption'?'🎤 Solo caption':'🔄 Solo translate')+'</span>'}
    h+='<div class="mp-card" onclick="openModal(\''+rt.id+'\')"><div class="mp-glow" style="background:radial-gradient(circle,'+rt.color+'22,transparent)"></div><span class="mp-icon">'+rt.icon+'</span><h3>'+rt.name+modeTag+'</h3><div class="mp-desc">'+rt.desc+'</div><div class="mp-meta"><span class="mp-price">🪙 '+rt.price+' token</span>'+(rt.badge?'<span class="mp-badge badge-'+rt.badge+'">'+rt.badgeText+'</span>':'')+'</div></div>';
  });grid.innerHTML=h;
}

function openModal(reportId){
  selectedReport=REPORT_TYPES.find(function(r){return r.id===reportId});if(!selectedReport)return;selectedSession=null;
  document.getElementById('modTitle').textContent=selectedReport.icon+' '+selectedReport.name;
  document.getElementById('modDesc').textContent=selectedReport.desc;
  document.getElementById('modPrice').textContent=selectedReport.price+' token';
  document.getElementById('modBuyBtn').disabled=true;
  document.getElementById('modStatus').style.display='none';
  var sessEl=document.getElementById('modSessions'),sh='';
  // Filter sessions by report compatibility
  var okModes=selectedReport.sessionModes||['caption','translate'];
  var compatSessions=allSessions.filter(function(s){var m=(s.mode||'').toLowerCase();if(m.indexOf('caption')!==-1||m.indexOf('speech')!==-1||m.indexOf('lesson')!==-1)return okModes.indexOf('caption')!==-1;if(m.indexOf('translat')!==-1||m.indexOf('translate')!==-1)return okModes.indexOf('translate')!==-1;return true});
  if(compatSessions.length===0){sh='<div class="empty">⚠️ Nessuna sessione compatibile. Questo report richiede sessioni di tipo: <strong>'+okModes.join(' o ')+'</strong>. <a href="start.html">Registra una sessione →</a></div>'}
  else{compatSessions.slice(0,20).forEach(function(s){var when=s.started_at?new Date(s.started_at).toLocaleDateString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';var dur=s.duration_seconds?Math.round(s.duration_seconds/60)+'m':'—';var modeLabel=(s.mode||'session');if(modeLabel.toLowerCase().indexOf('caption')!==-1||modeLabel.toLowerCase().indexOf('speech')!==-1)modeLabel='🎤 Caption';else if(modeLabel.toLowerCase().indexOf('translat')!==-1)modeLabel='🔄 Translate';sh+='<div class="sess-pick-item" onclick="pickSession(\''+s.id+'\',this)"><div class="sp-radio"></div><div><strong>'+modeLabel+'</strong><br><span style="font-size:10px;color:var(--muted2)">'+when+' · '+dur+' · '+(s.words_count||0)+' parole</span></div></div>'})}
  sessEl.innerHTML=sh;document.getElementById('purchaseModal').classList.add('active');
}

function pickSession(sid,el){
  selectedSession=allSessions.find(function(s){return s.id===sid});
  document.querySelectorAll('#modSessions .sess-pick-item').forEach(function(x){x.classList.remove('selected')});el.classList.add('selected');
  document.getElementById('modBuyBtn').disabled=false;
}

function closeModal(){document.getElementById('purchaseModal').classList.remove('active')}

document.getElementById('modBuyBtn').addEventListener('click',async function(){
  if(!selectedSession||!selectedReport)return;
  var btn=this;btn.disabled=true;btn.textContent='Acquisto…';

function renderMyReports(){
  var el=document.getElementById('myReports');
  if(myReports.length===0){el.innerHTML='<div class="empty">📭 Nessun report ancora. Scegline uno dal marketplace!</div>';return}
  var h='';myReports.forEach(function(r){
    var sc=r.status==='completed'?'ri-done':r.status==='processing'?'ri-processing':'ri-failed';
    var st=r.status==='completed'?'✅ Completato':r.status==='processing'?'⏳ In elaborazione':'❌ Fallito';
    var when=r.created_at?new Date(r.created_at).toLocaleDateString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    var mod=REPORT_MODULES[r.module_id]||{icon:'📊',name:'Report'};
    h+='<div class="report-item"><span style="font-size:22px">'+mod.icon+'</span><div style="flex:1"><strong>'+mod.name+'</strong><br><span style="font-size:10px;color:var(--muted2)">'+when+'</span></div><span class="ri-status '+sc+'">'+st+'</span>'+(r.overall_score!=null?'<span class="ri-score" style="color:var(--accent2)">'+Math.round(r.overall_score)+'%</span>':'')+'</div>';
  });el.innerHTML=h;
}

(function loadReportDetail(){
  var reportId=new URLSearchParams(location.search).get('report');if(!reportId)return;
  var supabase=window.sottotitoliSupabase;if(!supabase){setTimeout(loadReportDetail,500);return}
  supabase.auth.getSession().then(function(r){if(!r.data?.session)return;
    supabase.from('session_ai_reports').select('id,module_id,overall_score,summary_text,created_at').eq('id',reportId).eq('user_id',r.data.session.user.id).single().then(function(resp){

// ═══ PDF Download ═══
function downloadReportPDF(){
  var d=_currentReportData;if(!d||!d.summary_text)return;
  var mod=REPORT_MODULES[d.module_id]||{icon:'📊',name:'Report'};
  var score=d.overall_score?Math.round(d.overall_score)+'%':'—';
  var when=d.created_at?new Date(d.created_at).toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  // Convert markdown-ish text to styled HTML
  var bodyHtml=d.summary_text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^### (.+)$/gm,'<h3 style="font-size:15px;font-weight:700;margin:18px 0 6px;color:#111">$1</h3>')
    .replace(/^## (.+)$/gm,'<h2 style="font-size:17px;font-weight:800;margin:20px 0 8px;color:#111">$1</h2>')
    .replace(/^# (.+)$/gm,'<h1 style="font-size:19px;font-weight:900;margin:22px 0 8px;color:#111">$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^(\d+)\.\s\*\*(.+?)\*\*:?\s?(.*)$/gm,'<div style="margin:8px 0 4px"><strong style="color:#7c3aed">$1. $2:</strong> $3</div>')
    .replace(/^(\d+)\.\s(.+)$/gm,'<div style="margin:4px 0 4px 16px">$1. $2</div>')
    .replace(/\n\n/g,'<br><br>')
    .replace(/\n/g,'<br>');

  var iframe=document.createElement('iframe');iframe.style.display='none';document.body.appendChild(iframe);
  var doc=iframe.contentDocument||iframe.contentWindow.document;
  doc.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Sottotitoli Report</title>');
  doc.write('<style>');
  doc.write('*{box-sizing:border-box;margin:0;padding:0}');
  doc.write('body{font-family:Inter,system-ui,sans-serif;font-size:12px;color:#1a1a2e;line-height:1.7;padding:40px 48px;max-width:700px;margin:0 auto}');
  doc.write('.logo{font-size:22px;font-weight:900;letter-spacing:-0.5px;color:#7c3aed;margin-bottom:4px}');
  doc.write('.logo span{color:#1a1a2e}');
  doc.write('.logo .dot{display:inline-block;width:6px;height:6px;background:#7c3aed;border-radius:50%;margin-left:2px;vertical-align:middle;margin-bottom:2px}');
  doc.write('.meta{color:#888;font-size:10px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #e5e5e5}');
  doc.write('.meta strong{color:#1a1a2e}');
  doc.write('h2{font-size:16px;font-weight:800;margin:20px 0 6px;color:#7c3aed}');
  doc.write('@media print{body{padding:20px 32px}}');
  doc.write('</style></head><body>');
  doc.write('<div class="logo">Sotto<span>titoli</span><span class="dot"></span></div>');
  doc.write('<div class="meta">'+when+' · '+mod.icon+' '+mod.name+' · Punteggio: <strong>'+score+'</strong></div>');
  doc.write('<h2>'+mod.icon+' '+mod.name+'</h2>');
  doc.write(bodyHtml);
  doc.write('</body></html>');
  doc.close();
  setTimeout(function(){iframe.contentWindow.print();setTimeout(function(){document.body.removeChild(iframe)},1000)},400);
}

</script>
