enter;gap:2px;height:60px;width:100%">';bars.forEach((v,i)=>{const hh=v*50;h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;height:100%;justify-content:center"><div style="width:100%;height:${hh}%;background:${hsl(280+i*5,60,60)};border-radius:2px;animation:barDance ${0.7+i*0.05}s ease infinite;animation-delay:${i*0.03}s"></div><div style="width:100%;height:${hh}%;background:${hsl(280+i*5,60,55,.7)};border-radius:2px;animation:barDance ${0.7+i*0.05}s ease infinite;animation-delay:${i*0.03}s"></div></div>`});h+='</div>';return h}});waves.push({n:3,name:'Gradient Bars',build(){const bars=audioBars(20);let h='<div style="display:flex;align-items:flex-end;gap:1.5px;height:60px;width:100%">';bars.forEach((v,i)=>{const pct=i/19;h+=`<div style="flex:1;height:${v*100}%;background:linear-gradient(180deg,${hsl(200+pct*140,80,65)},${hsl(200+pct*140,60,35)});border-radius:1px"></div>`});h+='</div>';return h}});waves.push({n:4,name:'Line Wave',build(){return`<svg viewBox="0 0 160 50" style="width:100%;height:60px"><polyline points="0,25 10,15 20,30 30,10 40,28 50,8 60,22 70,5 80,20 90,4 100,18 110,8 120,22 130,10 140,25 150,12 160,20" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="points" dur="2s" repeatCount="indefinite" values="0,25 10,15 20,30 30,10 40,28 50,8 60,22 70,5 80,20 90,4 100,18 110,8 120,22 130,10 140,25 150,12 160,20;0,20 10,28 20,15 30,32 40,12 50,26 60,6 70,24 80,2 82,20 100,18 110,8 120,22 130,10 140,25 150,12 160,20;0,25 10,15 20,30 30,10 40,28 50,8 60,22 70,5 80,20 90,4 100,18 110,8 120,22 130,10 140,25 150,12 160,20"/></polyline></svg>`}});waves.push({n:5,name:'Dot Wave',build(){const pts=audioBars(14);let h='<div style="display:flex;align-items:center;gap:3px;height:60px;width:100%">';pts.forEach((v,i)=>{const size=3+v*8;h+=`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${hsl(200+i*12,70,60)};animation:dotPulse ${0.8+i*0.05}s px;height:${len}px;background:${hsl(i*8,70,60)};transform-origin:50% 0;transform:translate(-50%,0) rotate(${angle}deg) translateY(4px);animation:barDance ${0.6+(i%5)*0.1}s ease infinite;animation-delay:${i*0.02}s"></div>`}h+='</div>';return h}});waves.push({n:15,name:'Waterfall',build(){let h='<div style="position:relative;width:100%;height:60px;overflow:hidden">';for(let i=0;i<12;i++){h+=`<div style="position:absolute;left:${i*8.5}%;top:0;width:2px;height:15px;background:${hsl(200+i*8,70,60)};animation:waterfall ${1.2+i*0.15}s linear infinite;animation-delay:${i*0.1}s;border-radius:1px"></div>`}h+='</div>';return h}});waves.push({n:16,name:'Ripple Rings',build(){return`<svg viewBox="0 0 80 80" style="width:70px;height:70px">${[0,1,2,3].map(i=>`<circle cx="40" cy="40" r="4" fill="none" stroke="#60a5fa" stroke-width="2" opacity="${1-i*0.25}"><animate attributeName="r" dur="2s" repeatCount="indefinite" begin="${i*0.5}s" values="4;35"/><animate attributeName="opacity" dur="2s" repeatCount="indefinite" begin="${i*0.5}s" values="1;0"/></circle>`).join('')}</svg>`}});waves.push({n:17,name:'Dashed Ring',build(){return`<svg viewBox="0 0 80 80" style="width:70px;height:70px"><circle cx="40" cy="40" r="22" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 6"><animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="6s" repeatCount="indefinite"/></circle></svg>`}});waves.push({n:18,name:'Neon Wave',build(){return`<svg viewBox="0 0 160 50" style="width:100%;height:60px"><polyline points="0,25 20,10 40,35 60,15 80,30 100,8 120,28 140,12 160,25" fill="none" stroke="#f472b6" stroke-width="2.5" filter="url(#glow)"><animate attributeName="points" dur="2.5s" repeatCount="indefinite" values="0,25 20,10 40,35 60,15 80,30 100,8 120,28 140,12 160,25;0,20 20,35 40,10 60,30 80,12 100,32 120,8 140,28 160,18;0,25 20,10 40,35 60,15 80,30 100,8 120,28 140,12 160,25"/></polyline><defs><filter id="glow"><feGaussianBlur stdDeviation="1.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>`}});waves.push({n:19,name:'Bar Code',build(){const widths=[2,4,1,3,5,2,6,1,3,4,2,5,1,3,6,2,4,1,5,3,2,6,1,4];let h='<div style="display:flex;align-items:center;gap:0;height:60px;width:100%">';widths.forEach((w,i)=>{const hue=i%2===0?200:280;h+=`<div style="width:${w}px;height:${40+Math.sin(i*0.6)*20}px;background:${hsl(hue,50,60)};flex-shrink:0;border-radius:0"></div>`});h+='</div>';return h}});waves.push({n:20,name:'Equalizer',build(){const bars=audioBars(10);let h='<div style="display:flex;align-items:flex-end;gap:3px;height:60px;width:100%">';bars.forEach((v,i)=>{h+=`<div style="flex:1;height:${v*100}%;background:linear-gradient(180deg,${hsl(130+i*10,70,60)},${hsl(130+i*10,50,30)});border-radius:3px 3px 0 0;animation:barDance ${0.4+i*0.07}s ease infinite;animation-delay:${i*0.06}s"></div>`});h+='</div>';return h}});waves.push({n:21,name:'Circular Spectrum',build(){let h='<div style="position:relative;width:70px;height:70px">';for(let i=0;i<60;i++){const angle=(i/60)*360;const len=8+Math.abs(Math.sin(i*0.5))*18;const hue=(i/60)*360;h+=`<div style="position:absolute;left:50%;top:50%;width:1.5px;height:${len}px;background:${hsl(hue,80,55)};transform-origin:50% 0;transform:translate(-50%,0) rotate(${angle}deg) translateY(14px)"></div>`}h+='</div>';return h}});waves.push({n:22,name:'Floating Dots',build(){let h='<div style="position:relative;width:100%;height:60px">';for(let i=0;i<30;i++){const x=Math.random()*90+5;const y=Math.random()*40+10;const s=1.5+Math.random()*3;h+=`<div style="position:absolute;left:${x}%;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:${hsl(180+Math.random()*180,70,65)};animation:dotPulse ${1+Math.random()}s ease infinite;animation-delay:${Math.random()}s"></div>`}h+='</div>';return h}});waves.push({n:23,name:'Snake Wave',build(){return`<svg viewBox="0 0 160 40" style="width:100%;height:60px"><path d="M0,20 Q10,5 20,20 T40,20 T60,20 T80,20 T1
