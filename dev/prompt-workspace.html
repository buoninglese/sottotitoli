<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev · Prompt Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0c14;--card:#0f111e;--line:#1a1e2e;--text:#e8eaed;--t2:#8b93a5;--t3:#4e5566;--accent:#a78bfa;--green:#34d399;--red:#f87171}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
.app{display:flex;height:100vh}
.sidebar{width:260px;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:16px 0;flex-shrink:0}
.sidebar h2{padding:0 16px 10px;font-size:14px;font-weight:700}
.sidebar .mod-item{padding:8px 16px;font-size:12px;cursor:pointer;color:var(--t2);border-left:2px solid transparent;transition:all .12s}
.sidebar .mod-item:hover{color:var(--text);background:rgba(167,139,250,.03)}
.sidebar .mod-item.active{color:var(--accent);border-left-color:var(--accent);font-weight:600}
.main{flex:1;overflow-y:auto;padding:24px 32px 60px}
.main h3{font-size:18px;font-weight:700;margin-bottom:4px}
.main .mod-id{font-size:11px;color:var(--t3);margin-bottom:16px;font-family:'JetBrains Mono',monospace}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:4px}
.field textarea{width:100%;min-height:120px;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);resize:vertical;line-height:1.6}
.field textarea:focus{outline:none;border-color:var(--accent)}
.field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text)}
.field input:focus{outline:none;border-color:var(--accent)}
.field select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text)}
.btn{font-family:inherit;font-weight:600;cursor:pointer;border:none;transition:all .2s;border-radius:100px;padding:10px 22px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--t2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 14px;font-size:11px}
.preview-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12px;color:var(--t2);white-space:pre-wrap;max-height:300px;overflow-y:auto;font-family:'JetBrains Mono',monospace;line-height:1.6;margin-top:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:100px;font-size:13px;font-weight:600;z-index:100;animation:fadeIn .3s}
.toast.ok{background:var(--green);color:#000}
.toast.err{background:var(--red);color:#fff}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h2>🧠 Prompt Workspace</h2>
    <div id="modList"></div>
    <div style="padding:12px 16px;margin-top:8px;border-top:1px solid var(--line)">
      <button class="btn btn-ghost btn-sm" onclick="exportAll()" style="width:100%;justify-content:center">📥 Esporta tutto</button>
      <button class="btn btn-ghost btn-sm" onclick="importAll()" style="width:100%;justify-content:center;margin-top:4px">📤 Importa</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
    </div>
  </aside>
  <main class="main" id="mainContent">
    <div style="text-align:center;padding:80px 20px;color:var(--t3)">
      <div style="font-size:48px;margin-bottom:12px">🧠</div>
      <div style="font-size:14px;font-weight:600">Seleziona un modulo dalla sidebar</div>
      <div style="font-size:12px;margin-top:4px">Modifica i prompt, la struttura output, e i parametri del modello</div>
    </div>
  </main>
</div>

<script>
var MODULES=[
  // ── GRAMMAR ──
  {id:'holistic',name:'Holistic Scan',title:'Holistic Scan',price:15,family:'Grammar',model:'gpt-4o',temp:0.6,prompt:'You are an expert English language assessor. Perform a general audit of all grammar used in this transcript.\n\nTranscript:\n{{TRANSCRIPT}}\n\nProvide:\n1. Overall grammar score (0-100)\n2. Top 3 strengths with examples\n3. Top 3 issues with specific examples from the transcript\n4. CEFR-aligned summary (1-2 sentences)\n5. 3 actionable recommendations\n\nOutput as JSON.',outputSchema:'{"overall_score":number,"strengths":["..."],"issues":["..."],"summary":"...","recommendations":["..."]}'},
  {id:'personalized',name:'Personalized Path',title:'Personalized Path',price:12,family:'Grammar',model:'gpt-4o',temp:0.6,prompt:'You are a personalized language coach. Tailor this analysis to the user\'s trajectory and objectives.\n\nUser objectives:\n{{USER_OBJECTIVES}}\n\nTranscript:\n{{TRANSCRIPT}}\n\nConsider: user\'s stated goals, learning history, CEFR trajectory.\n\nProvide:\n1. Alignment score with stated goals (0-100)\n2. Strengths relative to goals (3 points)\n3. Gaps relative to goals (3 points)\n4. Personalized action items (3)\n5. Recommended focus for next session\n\nOutput as JSON.',outputSchema:'{"alignment_score":number,"strengths":[],"gaps":[],"action_items":[],"next_focus":"..."}'},
  {id:'growth',name:'Growth Report',title:'Growth Report',price:10,family:'Grammar',model:'gpt-4o',temp:0.6,prompt:'You are an English learning growth specialist. Provide next steps including specific exercises.\n\nTranscript:\n{{TRANSCRIPT}}\n\nPrevious sessions:\n{{PREVIOUS_SESSIONS}}\n\nProvide:\n1. Growth trajectory assessment\n2. Specific grammar exercises (3-5, with instructions)\n3. Vocabulary expansion exercises (3-5)\n4. Speaking/fluency drills (3-5)\n5. Estimated time to next milestone\n\nOutput as JSON.',outputSchema:'{"trajectory":"...","grammar_exercises":[],"vocab_exercises":[],"fluency_drills":[],"next_milestone_estimate":"..."}'},
  // ── VOCABULARY ──
  {id:'cefr-extravaganza',name:'CEFR Extravaganza',title:'CEFR Extravaganza',price:20,family:'Vocabulary',model:'gpt-4o',temp:0.5,prompt:'You are a CEFR vocabulary expert. Perform an all-encompassing vocabulary audit.\n\nTranscript:\n{{TRANSCRIPT}}\n\nProvide:\n1. CEFR level distribution (A1-C2) of all words\n2. Vocabulary size estimate\n3. NGSL/NAWL coverage analysis\n4. Topic coverage map\n5. Gap analysis — which CEFR bands are underrepresented\n6. 10 suggested words to learn next (with definitions)\n7. Lexical diversity score\n\nOutput as JSON.',outputSchema:'{"cefr_distribution":{},"vocab_size":number,"ngsl_coverage":number,"topic_map":{},"gaps":[],"suggested_words":[],"lexical_diversity":number}'},
  {id:'vocab-explorer',name:'Vocabulary Explorer',title:'Vocabulary Explorer',price:15,family:'Vocabulary',model:'gpt-4o',temp:0.6,prompt:'You are a vocabulary building coach. Create a personalized builder/explorer report.\n\nTranscript:\n{{TRANSCRIPT}}\n\nUser word bank:\n{{WORD_BANK}}\n\nProvide:\n1. Words used correctly from word bank (list)\n2. Words from word bank NOT used (missed opportunities)\n3. New words discovered in transcript (with CEFR level)\n4. Collocation analysis\n5. Synonym expansion suggestions\n6. Personalized vocabulary building plan\n\nOutput as JSON.',outputSchema:'{"bank_words_used":[],"bank_words_missed":[],"new_words":[],"collocations":[],"synonym_suggestions":[],"vocab_plan":"..."}'},
  {id:'homework',name:'Homework Builder',title:'Homework Builder',price:8,family:'Vocabulary',model:'gpt-4o',temp:0.5,prompt:'You are a homework/exercise creator. Build exercises based on selected vocabulary banks.\n\nTranscript:\n{{TRANSCRIPT}}\n\nSelected vocabulary:\n{{SELECTED_VOCABULARY}}\n\nProvide:\n1. Fill-in-the-blank exercises (5) using selected vocabulary\n2. Sentence creation exercises (3)\n3. Context matching exercise (5 pairs)\n4. Translation exercises (3, Italian→English)\n5. Self-assessment rubric\n\nOutput as JSON.',outputSchema:'{"fill_blank":[],"sentence_creation":[],"context_matching":[],"translation_exercises":[],"self_assessment":"..."}'},
  // ── TRAINING & FOCUS ──
  {id:'cambridge-speaking',name:'Cambridge Speaking',title:'Cambridge Speaking',price:25,family:'Training',model:'gpt-4o',temp:0.5,prompt:'You are a Cambridge English speaking examiner. Simulate and assess Cambridge speaking exam performance.\n\nTranscript:\n{{TRANSCRIPT}}\n\nTarget CEFR level: {{TARGET_LEVEL}}\n\nProvide:\n1. Estimated Cambridge speaking band score\n2. Grammar & Vocabulary score (Cambridge criteria)\n3. Discourse Management score\n4. Pronunciation assessment\n5. Interactive Communication score\n6. Full examiner feedback (what an examiner would write)\n7. 5 practice prompts for improvement\n\nOutput as JSON.',outputSchema:'{"band_score":number,"grammar_vocab_score":number,"discourse_score":number,"pronunciation_score":number,"interactive_score":number,"examiner_feedback":"...","practice_prompts":[]}'},
  {id:'speech-profile',name:'Speech Profile',title:'Speech Profile',price:18,family:'Training',model:'gpt-4o',temp:0.5,prompt:'You are a speech and pronunciation analyst. Provide deep metrics on pronunciation and speech flow.\n\nTranscript:\n{{TRANSCRIPT}}\n\nAnalyze:\n1. Speaking pace (WPM) and rhythm patterns\n2. Filler word analysis (count, type, placement)\n3. Pause patterns and hesitation analysis\n4. Sentence complexity profile\n5. Intonation and stress pattern indicators (from punctuation/capitalization)\n6. Overall speech profile score (0-100)\n7. Comparison to native speaker benchmarks\n\nOutput as JSON.',outputSchema:'{"wpm":number,"rhythm_analysis":"...","filler_analysis":{},"pause_patterns":"...","sentence_complexity":"...","intonation_indicators":"...","profile_score":number,"benchmark_comparison":"..."}'},
  {id:'drills',name:'Objective Drills',title:'Objective Drills',price:10,family:'Training',model:'gpt-4o',temp:0.5,prompt:'You are a language drill designer. Create focused drills on specific goals.\n\nTranscript:\n{{TRANSCRIPT}}\n\nTarget area: {{TARGET_AREA}}\n\nProvide:\n1. Diagnostic assessment of target area\n2. 5 targeted drills with clear instructions\n3. Difficulty progression (easy → hard)\n4. Success criteria for each drill\n5. Recommended practice frequency\n6. Progress tracking suggestions\n\nOutput as JSON.',outputSchema:'{"diagnosis":"...","drills":[{"name":"...","instructions":"...","difficulty":"easy|medium|hard","success_criteria":"..."}],"practice_frequency":"...","tracking_tips":[]}'}
];

var activeModule=null;
var promptsData=JSON.parse(localStorage.getItem('dev_prompts')||'{}');

function init(){
  var list=document.getElementById('modList'),h='';
  var families={};
  MODULES.forEach(function(m){
    if(!families[m.family])families[m.family]=[];
    families[m.family].push(m);
  });
  ['Grammar','Vocabulary','Training'].forEach(function(fam){
    if(!families[fam])return;
    h+='<div style="padding:8px 16px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3)">'+fam+'</div>';
    families[fam].forEach(function(m){
      var custom=promptsData[m.id];
      h+='<div class="mod-item" data-id="'+m.id+'" onclick="selectModule(\''+m.id+'\')">'+
        '<span style="display:flex;justify-content:space-between"><span>'+m.name+'</span><span style="font-size:10px;color:var(--accent)">'+m.price+'cr</span></span>'+
        (custom?'<span style="font-size:9px;color:var(--green)">modificato</span>':'')+'</div>';
    });
  });
  list.innerHTML=h;
  var hash=window.location.hash.replace('#','');
  if(hash)selectModule(hash);
}

function selectModule(id){
  activeModule=MODULES.find(function(m){return m.id===id});if(!activeModule)return;
  document.querySelectorAll('.mod-item').forEach(function(x){x.classList.toggle('active',x.dataset.id===id)});
  window.location.hash=id;
  var custom=promptsData[id]||{};
  var m=activeModule;
  var title=custom.title||m.title||m.name;
  var price=custom.price!==undefined?custom.price:(m.price||3);
  document.getElementById('mainContent').innerHTML=
    '<h3>'+m.name+'</h3><div class="mod-id">'+m.id+' · '+m.family+' · Model: '+(custom.model||m.model)+'</div>'+
    '<div class="row"><div class="field" style="flex:1;min-width:200px"><label>Titolo (visualizzato nell\'interfaccia)</label><input id="titleInput" value="'+title.replace(/"/g,'&quot;')+'"></div><div class="field" style="flex:0 0 120px"><label>Prezzo (crediti)</label><input id="priceInput" type="number" min="1" max="20" value="'+price+'"></div></div>'+
    '<div class="field"><label>System Prompt</label><textarea id="promptText">'+(custom.prompt||m.prompt).replace(/</g,'&lt;')+'</textarea></div>'+
    '<div class="field"><label>Output Schema (JSON)</label><textarea id="schemaText" style="min-height:80px">'+(custom.outputSchema||m.outputSchema)+'</textarea></div>'+
    '<div class="row"><div class="field" style="flex:1;min-width:120px"><label>Model</label><select id="modelSelect"><option value="gpt-4o"'+(m.model==='gpt-4o'?' selected':'')+'>GPT-4o</option><option value="gpt-4o-mini"'+(m.model==='gpt-4o-mini'?' selected':'')+'>GPT-4o-mini</option></select></div><div class="field" style="flex:1;min-width:120px"><label>Temperature</label><input id="tempInput" type="number" min="0" max="2" step="0.1" value="'+(custom.temp||m.temp)+'"></div></div>'+
    '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-primary" onclick="saveModule()">💾 Salva</button><button class="btn btn-ghost" onclick="resetModule()">🔄 Reset</button><button class="btn btn-ghost" onclick="testPrompt()">▶️ Test</button></div>'+
    '<div class="preview-box" id="testOutput" style="display:none"></div>';
}

function saveModule(){
  if(!activeModule)return;
  var prompt=document.getElementById('promptText').value;
  var schema=document.getElementById('schemaText').value;
  var model=document.getElementById('modelSelect').value;
  var temp=parseFloat(document.getElementById('tempInput').value);
  var title=document.getElementById('titleInput').value.trim();
  var price=parseInt(document.getElementById('priceInput').value)||3;
  promptsData[activeModule.id]={title:title,prompt:prompt,outputSchema:schema,model:model,temp:temp,price:price};
  localStorage.setItem('dev_prompts',JSON.stringify(promptsData));
  toast('✅ Salvato: '+activeModule.name);
  init();
}

function resetModule(){
  if(!activeModule||!confirm('Resettare il prompt di '+activeModule.name+'?'))return;
  delete promptsData[activeModule.id];localStorage.setItem('dev_prompts',JSON.stringify(promptsData));
  selectModule(activeModule.id);toast('🔄 Resettato');init();
}

function exportAll(){
  var data={prompts:promptsData,modules:MODULES,exported:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sottotitoli-prompts-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('📥 Esportato');
}

function importAll(){document.getElementById('importFile').click()}
function handleImport(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();reader.onload=function(ev){
    try{var data=JSON.parse(ev.target.result);if(data.prompts){promptsData=data.prompts;localStorage.setItem('dev_prompts',JSON.stringify(promptsData));toast('📤 Importato '+Object.keys(data.prompts).length+' prompts');init();if(activeModule)selectModule(activeModule.id)}}catch(ex){toast('❌ File non valido','err')}
  };reader.readAsText(file);
}

function testPrompt(){
  var output=document.getElementById('testOutput');output.style.display='block';
  output.innerHTML='<span style="color:var(--amber)">⏳ Per testare veramente il prompt, esegui la Edge Function con:\n\nsupabase functions deploy process-ai-reports\n\nPoi invia una richiesta con il module_id: '+activeModule.id+'</span>';
}

function toast(msg,type){
  var t=document.createElement('div');t.className='toast '+(type||'ok');t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.remove()},2500);
}

init();
</script>
</body>
</html>
