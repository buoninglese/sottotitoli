<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XP Counter · 10 variazioni · Mockup · Sottotitoli</title>
<style>
  :root{
    --bg:#eef6fc; --panel:#ffffff; --line:#d7e7f2; --line-strong:#b5d2e4;
    --text:#062433; --text-soft:#35586c; --text-faint:#6b8ba0;
    --cyan:#0284c7; --green:#0e9f8a; --amber:#d97706; --violet:#7c3aed; --pink:#db2777;
    --grad:linear-gradient(135deg,#0284c7,#22d3ee);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',ui-sans-serif,system-ui,sans-serif;background:
    radial-gradient(circle at 12% 18%,rgba(8,145,178,.10),transparent 42%),
    radial-gradient(circle at 88% 82%,rgba(124,58,237,.08),transparent 40%),
    linear-gradient(180deg,#eef6fc,#e2eff9);color:var(--text);min-height:100vh;padding:40px 20px}
  .wrap{max-width:980px;margin:0 auto}
  header h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
  header p{font-size:14px;color:var(--text-soft);margin:0 0 24px;line-height:1.5}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
  .meta .pill{font-size:12px;font-weight:800;padding:6px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line-strong);color:var(--text)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
  @media(max-width:720px){.grid{grid-template-columns:1fr}}
  .variation{border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--panel)}
  .variation .v-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .variation .v-num{font-size:11px;font-weight:800;color:#fff;background:var(--violet);border-radius:999px;padding:3px 10px;letter-spacing:.05em}
  .variation .v-size{font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em}
  .variation .v-name{font-size:14px;font-weight:800}
  .v-stage{display:grid;place-items:center;min-height:150px;padding:18px;border-radius:14px;background:linear-gradient(180deg,#f0f7fd,#e4f0fa);border:1px dashed var(--line-strong)}
  .v-stage.dark{background:linear-gradient(160deg,#0b1220,#101826);border-color:rgba(148,163,184,.2)}
  .v-stage.genz{background:linear-gradient(135deg,#ff6ec4,#7873f5 50%,#4facfe);border-color:rgba(255,255,255,.4)}
  .v-stage.genzdark{background:linear-gradient(135deg,#312e81,#4c1d95 50%,#9d174d);border-color:rgba(255,255,255,.2)}
  .note{font-size:11px;color:var(--text-faint);margin-top:10px;line-height:1.4}

  /* ── shared building blocks ── */
  .xp-num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-weight:900;letter-spacing:-.02em;line-height:1}
  .xp-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;opacity:.7}
  .goal-track{height:8px;border-radius:99px;overflow:hidden;background:rgba(127,127,127,.16)}
  .goal-fill{height:100%;border-radius:99px;background:var(--grad)}

  /* V1 mini pill */
  .v1{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:#0b1220;color:#fff;font-size:13px;font-weight:800}
  .v1 .star{color:#fbbf24}

  /* V2 pill + streak */
  .v2{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line-strong);box-shadow:0 6px 16px rgba(2,132,199,.08)}
  .v2 .div{width:1px;height:18px;background:var(--line)}
  .v2 .flame{font-size:15px}

  /* V3 stat tiles */
  .v3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:420px}
  .v3 .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
  .v3 .tile .k{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);margin-bottom:4px}
  .v3 .tile .v{font-size:18px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums}

  /* V4 progress card */
  .v4{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
  .v4 .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .v4 .today{font-size:12px;font-weight:700;color:var(--text-soft)}

  /* V5 radial ring */
  .v5{position:relative;width:132px;height:132px}
  .v5 svg{transform:rotate(-90deg)}
  .v5 .ring-bg{stroke:rgba(127,127,127,.16)}
  .v5 .ring-fg{stroke:url(#v5grad);stroke-linecap:round}
  .v5 .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .v5 .pct{font-size:26px;font-weight:900}
  .v5 .pct small{font-size:11px;font-weight:700;opacity:.6}
  .v5 .lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;opacity:.7;margin-top:-14px}

  /* V6 hero banner */
  .v6{width:100%;max-width:420px;border-radius:24px;padding:24px;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.2),transparent 40%),linear-gradient(135deg,#0369a1,#0284c7 42%,#0ea5e9 72%,#22d3ee);color:#fff;position:relative;overflow:hidden}
  .v6 .row{display:flex;align-items:center;justify-content:space-between}
  .v6 .xp{font-size:52px;font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .v6 .streak{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800}
  .v6 .sub{font-size:12px;opacity:.85;margin-top:6px}

  /* V7 level card */
  .v7{width:100%;max-width:300px;background:linear-gradient(160deg,#0f172a,#1e293b);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:20px;color:#fff}
  .v7 .lv{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#a5f3fc;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);padding:5px 12px;border-radius:999px}
  .v7 .xp{font-size:34px;font-weight:900;margin:14px 0 4px;font-variant-numeric:tabular-nums}
  .v7 .to-next{font-size:11px;opacity:.7;margin-bottom:10px}
  .v7 .goal-track{background:rgba(255,255,255,.12)}
  .v7 .goal-fill{background:linear-gradient(90deg,#22d3ee,#a5f3fc)}

  /* V8 split stats */
  .v8{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;gap:18px;align-items:center}
  .v8 .big{flex:0 0 auto;text-align:center}
  .v8 .big .xp{font-size:40px;font-weight:900;color:var(--cyan)}
  .v8 .cols{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .v8 .col{border-left:2px solid var(--line);padding-left:10px}
  .v8 .col .k{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint)}
  .v8 .col .v{font-size:16px;font-weight:900;color:var(--text);margin-top:3px}

  /* V9 glass chip */
  .v9{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:18px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(14px);color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.18)}

  /* V10 award card */
  .v10{width:100%;max-width:360px;background:linear-gradient(150deg,#fdf4ff,#f5f3ff);border:1px solid rgba(139,92,246,.25);border-radius:22px;padding:22px;position:relative;overflow:hidden}
  .v10 .trophy{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:grid;place-items:center;font-size:24px;box-shadow:0 8px 18px rgba(245,158,11,.3)}
  .v10 .xp{font-size:38px;font-weight:900;color:#5b21b6;margin:12px 0 2px;font-variant-numeric:tabular-nums}
  .v10 .dots{display:flex;gap:5px;margin-top:12px}
  .v10 .dot{width:9px;height:9px;border-radius:50%;background:#ddd6fe}
  .v10 .dot.on{background:#8b5cf6}
  .v10 .streak-rec{font-size:11px;font-weight:800;color:#d97706;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧮 Contatore XP · 10 variazioni</h1>
    <p>Sostituisce il vecchio blocco <b>🇮🇹 Italian / XP / Obiettivo / Streak</b> rimosso dai subtab del Vocabulary Trainer. Ogni variante legge i dati reali da <code>sottotitoli-learner</code> (XP totale · XP di oggi · obiettivo · streak) e i valori da <code>sottotitoli-xp-config</code>.</p>
  </header>
  <div class="meta" id="metaPills"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
(function(){
  function store(){
    var s = null;
    try { s = JSON.parse(localStorage.getItem('sottotitoli-learner') || 'null'); } catch(e){}
    s = s || { xp: 0, todayXp: 0, dailyGoal: 10, streak: 0 };
    return {
      xp: s.xp || 0,
      today: s.todayXp || 0,
      goal: s.dailyGoal || 10,
      streak: s.streak || 0
    };
  }
  var d = store();
  var pct = Math.min(100, Math.round((d.today / (d.goal || 1)) * 100));
  var r = 50, C = 2 * Math.PI * r;

  document.getElementById('metaPills').innerHTML =
    '<span class="pill">⭐ XP totale: ' + d.xp + '</span>' +
    '<span class="pill">🎯 Oggi: ' + d.today + ' / ' + d.goal + '</span>' +
    '<span class="pill">🔥 Streak: ' + d.streak + ' giorni</span>' +
    '<span class="pill">📈 Obiettivo: ' + pct + '%</span>';

  function fmt(n){ return n.toLocaleString('it-IT'); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var variations = [
    { name:'Mini pill', size:'XS · compatta', dark:false,
      html:'<span class="v1"><span class="star">★</span> <span class="xp-num">' + fmt(d.xp) + '</span> XP</span>',
      note:'Contatore minimale da infilare in topbar, chip o pulsante.' },
    { name:'Pill + streak', size:'XS · compatta', dark:false,
      html:'<span class="v2"><span class="xp-num">' + fmt(d.xp) + '</span> XP<span class="div"></span><span class="flame">🔥</span> ' + d.streak + '<span class="div"></span><span class="xp-lbl">oggi ' + d.today + '</span></span>',
      note:'Pill con XP, streak e quota di oggi in un solo giro.' },
    { name:'Stat tiles (4)', size:'S · 4 mini-tile', dark:false,
      html:'<div class="v3"><div class="tile"><div class="k">XP</div><div class="v" style="color:#0284c7">' + fmt(d.xp) + '</div></div><div class="tile"><div class="k">Oggi</div><div class="v">' + d.today + '</div></div><div class="tile"><div class="k">Meta</div><div class="v">' + d.goal + '</div></div><div class="tile"><div class="k">Streak</div><div class="v" style="color:#d97706">🔥' + d.streak + '</div></div></div>',
      note:'Quattro mini-card: XP, XP di oggi, obiettivo, streak.' },
    { name:'Progress card', size:'M · card con barra', dark:false,
      html:'<div class="v4"><div class="top"><div><div class="xp-lbl" style="color:var(--text-faint)">XP totale</div><div class="xp-num" style="font-size:34px;margin-top:4px">' + fmt(d.xp) + '</div></div><div class="today">' + d.today + ' / ' + d.goal + ' oggi</div></div><div class="goal-track"><div class="goal-fill" style="width:' + pct + '%"></div></div><div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text-faint)"><span>Obiettivo giornaliero</span><span>🔥 ' + d.streak + ' giorni</span></div></div>',
      note:'Card classica: numero grande + barra di avanzamento giornaliero.' },
    { name:'Radial ring', size:'M · cerchio', dark:false,
      html:'<div class="v5"><svg width="132" height="132"><defs><linearGradient id="v5grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs><circle class="ring-bg" cx="66" cy="66" r="' + r + '" fill="none" stroke-width="12"/><circle class="ring-fg" cx="66" cy="66" r="' + r + '" fill="none" stroke-width="12" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C * (1 - pct / 100)) + '"/></svg><div class="center"><div><div class="pct">' + pct + '%<small> oggi</small></div><div class="lbl">XP ' + fmt(d.xp) + '</div></div></div></div>',
      note:'Anello radiale: avanzamento dell\u2019obiettivo di oggi al centro.' },
    { name:'Hero banner', size:'L · banner', dark:false,
      html:'<div class="v6"><div class="row"><div><div class="xp-lbl">XP totale</div><div class="xp" style="margin-top:6px">' + fmt(d.xp) + '</div><div class="sub">' + d.today + ' / ' + d.goal + ' oggi</div></div><div class="streak"><span>🔥</span> ' + d.streak + '</div></div><div class="goal-track" style="margin-top:18px;background:rgba(255,255,255,.25)"><div class="goal-fill" style="width:' + pct + '%;background:linear-gradient(90deg,#a5f3fc,#fff)"></div></div></div>',
      note:'Banner grande con gradiente: XP enorme + streak + barra.' },
    { name:'Level card', size:'M · dark', dark:true,
      html:'<div class="v7"><span class="lv">🏅 Livello ' + Math.max(1, Math.floor(d.xp / 200) + 1) + '</span><div class="xp">' + fmt(d.xp) + '</div><div class="to-next">' + (200 - (d.xp % 200)) + ' XP al livello ' + (Math.floor(d.xp / 200) + 2) + '</div><div class="goal-track"><div class="goal-fill" style="width:' + (d.xp % 200) / 2 + '%"></div></div></div>',
      note:'Vista a livelli: badge livello + progresso al prossimo (200 XP).' },
    { name:'Split stats', size:'L · diviso', dark:false,
      html:'<div class="v8"><div class="big"><div class="xp-lbl">XP</div><div class="xp">' + fmt(d.xp) + '</div><div class="xp-lbl" style="color:var(--text-faint);margin-top:4px">🔥 ' + d.streak + '</div></div><div class="cols"><div class="col"><div class="k">Oggi</div><div class="v">' + d.today + '</div></div><div class="col"><div class="k">Meta</div><div class="v">' + d.goal + '</div></div><div class="col"><div class="k">Avanzamento</div><div class="v" style="color:#0284c7">' + pct + '%</div></div></div></div>',
      note:'Grande numero a sinistra, tre colonne di dettaglio a destra.' },
    { name:'Glass chip', size:'M · glass', dark:true,
      html:'<span class="v9">🏆 <span style="font-size:22px;font-weight:900;font-variant-numeric:tabular-nums">' + fmt(d.xp) + '</span><span style="font-size:11px;font-weight:800;opacity:.85">XP</span><span style="width:1px;height:18px;background:rgba(255,255,255,.4)"></span><span style="font-size:13px">🔥 ' + d.streak + '</span></span>',
      note:'Chip vetrosa su fondo scuro: XP + streak in uno stile premium.' },
    { name:'Award card', size:'L · riconoscimento', dark:false,
      html:'<div class="v10"><div class="trophy">🏆</div><div class="xp">' + fmt(d.xp) + '</div><div style="font-size:12px;font-weight:700;color:var(--text-soft)">XP totali · ' + d.today + ' oggi</div><div class="dots">' + Array.from({length:7},function(_,i){ return '<span class="dot' + (i < Math.min(7, Math.ceil(pct/14.3)) ? ' on' : '') + '"></span>'; }).join('') + '</div><div class="streak-rec">⭐ Streak record: ' + d.streak + ' giorni</div></div>',
      note:'Card \u201cpremio\u201d: trofeo, XP e pallini di avanzamento.' }
  ];

  var grid = document.getElementById('grid');
  grid.innerHTML = variations.map(function(v, i){
    return '<div class="variation">' +
      '<div class="v-head"><span class="v-name">' + esc(v.name) + '</span><span style="display:flex;gap:8px;align-items:center"><span class="v-size">' + esc(v.size) + '</span><span class="v-num">' + (i + 1) + '/10</span></span></div>' +
      '<div class="v-stage' + (v.dark ? ' dark' : '') + '">' + v.html + '</div>' +
      '<div class="note">' + v.note + '</div>' +
      '</div>';
  }).join('');
})();
</script>
</body>
</html>
