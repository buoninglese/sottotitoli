<!DOCTYPE html>
<html lang="it" dir="ltr" data-theme="dark" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Sottotitoli · Landing (Fin Replica) · Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   FIN REPLICA — faithful reproduction of the fin-flow landing
   (full-screen two-panel: photo LEFT · title/words RIGHT),
   recolored to Sottotitoli (dark + cyan) with Sottotitoli copy.
   Dev tool: dev/index-fin-replica-mockup.html — NOT part of the site
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#050810;
  --navy:#0a1520;          /* left panel base */
  --navy-2:#07131b;        /* left panel gradient */
  --surface:#081020;       /* right panel base */
  --surface-2:#0e1a28;
  --border:rgba(255,255,255,.09);
  --border-2:rgba(255,255,255,.16);
  --text:#f8fafc;
  --text-2:rgba(226,232,240,.72);
  --text-3:rgba(226,232,240,.62);   /* AA-safe muted */
  --accent:#22d3ee;
  --accent-2:#0891b2;
  --accent-ink:#03141a;
  --accent-soft:rgba(34,211,238,.16);
  --font-display:'Manrope',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.25,.1,.25,1);
  --fin:cubic-bezier(.4,0,.2,1);
  --rise:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
::selection{background:rgba(34,211,238,.25);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
img{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit;cursor:pointer}

/* ═══ Backdrop (dark sottotitoli version of fin's teal+dot-grid) ═══ */
.backdrop{
  position:fixed;inset:0;z-index:-3;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%,#0a1622 0%,#04070e 55%,#02040a 100%);
}
.blob{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;will-change:transform}
.blob-1{width:52vw;height:52vw;left:-14vw;top:-16vw;background:radial-gradient(circle,rgba(34,211,238,.30),transparent 66%);animation:drift1 32s ease-in-out infinite alternate}
.blob-2{width:44vw;height:44vw;right:-12vw;top:30vh;background:radial-gradient(circle,rgba(6,182,212,.22),transparent 66%);animation:drift2 40s ease-in-out infinite alternate}
.blob-3{width:38vw;height:38vw;left:34vw;bottom:-16vw;background:radial-gradient(circle,rgba(124,58,237,.14),transparent 66%);animation:drift3 48s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(4vw,3vh) scale(1.05)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(-3vw,-3vh) scale(1.06)}}
@keyframes drift3{from{transform:translate(0,0) scale(1)}to{transform:translate(-3vw,3vh) scale(1.08)}}
.dot-grid{position:fixed;inset:0;z-index:-2;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.7px);background-size:30px 30px;opacity:.045}
.noise{position:fixed;inset:0;z-index:9996;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");background-repeat:repeat;background-size:150px}

/* ═══ Dev chrome ═══ */
body{padding-top:58px}
.dev-chrome{
  position:fixed;top:0;left:0;right:0;z-index:99999;height:58px;
  display:flex;align-items:center;gap:14px;padding:0 20px;
  background:linear-gradient(180deg,#0d141d,#0a1017);
  border-bottom:1px solid #1c2a38;box-shadow:0 6px 28px rgba(0,0,0,.4);
}
.dev-chrome::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#22d3ee 30%,#7c3aed 70%,transparent);opacity:.45}
.dev-title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:-.01em;color:#eaf4fb}
.dev-title .dot{width:9px;height:9px;border-radius:50%;background:#22d3ee;box-shadow:0 0 12px #22d3ee;animation:devdot 2.6s ease-in-out infinite}
@keyframes devdot{0%,100%{opacity:1}50%{opacity:.5}}
.dev-title small{font-weight:500;color:#6f8398;font-size:10px}
.dev-seg{display:flex;gap:4px;padding:4px;background:#0a1018;border:1px solid #1c2a38;border-radius:999px}
.dev-seg button{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;font:600 11.5px var(--font-body);color:#8fa4ba;padding:6px 13px;border-radius:999px;transition:all .18s}
.dev-seg button svg{width:14px;height:14px}
.dev-seg button:hover{border-color:#2a3c4f;color:#e8f0f7}
.dev-seg button.active{background:linear-gradient(135deg,#22d3ee,#0891b2);color:#03303d;border-color:rgba(255,255,255,.18);box-shadow:0 4px 14px rgba(6,182,212,.3)}
.dev-spacer{flex:1}
.dev-note{font:500 10px var(--font-mono);color:#6f8398;letter-spacing:.04em}
.dev-note b{color:#67e8f9;font-weight:600}

/* ═══ Stage (toolbar + scene) — container for responsive ═══ */
.stage-wrap{
  position:relative;z-index:1;height:calc(100vh - 58px);
  max-width:1800px;margin:0 auto;
  display:flex;flex-direction:column;
  container-type:inline-size;container-name:stage;
}
.stage-wrap[data-view="mobile"]{width:390px;overflow-y:auto;border:1px solid rgba(255,255,255,.16);border-radius:36px;box-shadow:0 48px 150px rgba(0,0,0,.7),0 0 0 9px rgba(0,0,0,.38);margin:16px auto 40px;scrollbar-width:none}
.stage-wrap[data-view="mobile"]::-webkit-scrollbar{display:none}

/* ═══ Topbar (exact nav bar from index.html) ═══ */
.topbar{
  position:absolute;top:20px;left:24px;right:24px;z-index:8;
  display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 22px;
  pointer-events:none;
  animation:topbarIn .6s var(--ease) .1s backwards;
}
@keyframes topbarIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.topbar > *{pointer-events:auto}
.topbar-brand{display:inline-flex;align-items:baseline;font-family:var(--font-display);font-weight:700;font-size:31px;color:#fff;text-decoration:none;letter-spacing:-0.02em;line-height:1;white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.topbar-brand .pro{font-weight:800;color:var(--accent);letter-spacing:-.5px}
.topbar-login{
  position:relative;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:10px;
  background:rgba(0,0,0,.25);color:#fff;font-size:16px;font-weight:600;
  border:1px solid rgba(255,255,255,.25);cursor:pointer;text-decoration:none;
  text-shadow:0 1px 4px rgba(0,0,0,.3);
  transition:border-color .18s var(--ease),background .18s var(--ease),transform .32s var(--ease);
}
.topbar-login::after{content:"";position:absolute;inset:-4px;border-radius:12px}
.topbar-login:hover{border-color:rgba(255,255,255,.5);background:rgba(0,0,0,.4);transform:translateY(-1px)}
.topbar-login:active{transform:translateY(0) scale(.97)}
.topbar-login i{font-size:14px}

/* ═══ Framing border (from index.html) ═══ */
.page-border{
  position:fixed;inset:0;z-index:9000;pointer-events:none;
  border-radius:22px;margin:11px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 100px rgba(0,0,0,.35);
}
@media(max-width:640px){.page-border{display:none}}

/* ═══ SCENE — the two-panel replica ═══ */
.scene{flex:1;min-height:0;display:flex;overflow:hidden}

/* LEFT panel — photo + scrim + live caption chip */
.panel-left{
  position:relative;width:42%;flex-shrink:0;overflow:hidden;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
  animation:panelIn .9s cubic-bezier(.2,.8,.2,1) backwards;
}
@keyframes panelIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.panel-left img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;opacity:.6;will-change:transform;transition:transform .8s var(--fin)}
.panel-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,14,20,.5) 8%,rgba(5,14,20,.12) 55%,rgba(5,14,20,.6) 100%)}

/* RIGHT panel — steps + headline + desc + pill + CTA + promo (fin flex-1) */
.panel-right{
  flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;
  padding:56px 88px;overflow:hidden;
  background:linear-gradient(180deg,var(--surface-2) 0%,var(--surface) 100%);
  border-left:1px solid rgba(255,255,255,.05);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  position:relative;
}
.panel-right::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(110% 120% at 0% 50%,rgba(34,211,238,.09),transparent 55%)}

/* Step indicator (fin dots + counter) */
.steps{display:flex;align-items:center;gap:10px;margin-bottom:36px;min-height:6px}
.steps-dots{display:flex;align-items:center;gap:8px}
.step{
  position:relative;width:8px;height:6px;border-radius:999px;background:var(--accent);opacity:.26;border:none;padding:0;
  transition:width .3s var(--fin),opacity .3s var(--fin);
}
.step::after{content:"";position:absolute;inset:-14px}
.step:hover{width:20px;opacity:.6}
.step.active{width:32px;opacity:1}
.step:focus-visible{border-radius:999px}
.step-count{font:600 12px var(--font-mono);color:var(--text-3);margin-left:12px;letter-spacing:.08em}

/* Slide view — masked two-layer transition (opacity-safe: layers default visible) */
.slide-view{position:relative;overflow:hidden;width:100%;max-width:560px;min-height:360px}
.slide-layer{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  opacity:1;transform:none;
}
.slide-layer.enter{animation:slideInFwd .32s var(--fin) backwards}
.slide-view.dir-back .slide-layer.enter{animation:slideInBack .32s var(--fin) backwards}
.slide-layer.out{animation:slideOutFwd .32s var(--fin) forwards}
.slide-view.dir-back .slide-layer.out{animation:slideOutBack .32s var(--fin) forwards}
@keyframes slideInFwd{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
@keyframes slideInBack{from{opacity:0;transform:translateX(-56px)}to{opacity:1;transform:none}}
@keyframes slideOutFwd{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-56px)}}
@keyframes slideOutBack{from{opacity:1;transform:none}to{opacity:0;transform:translateX(56px)}}

.slide-layer .slide-headline,.slide-layer .slide-desc,.slide-layer .slide-pill{
  opacity:1;transform:none;
}
.slide-layer.enter .slide-headline{animation:riseIn .32s var(--rise) backwards}
.slide-layer.enter .slide-desc{animation:riseIn .32s var(--rise) .045s backwards}
.slide-layer.enter .slide-pill{animation:riseIn .32s var(--rise) .09s backwards}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.slide-headline{font-family:var(--font-display);font-weight:800;line-height:1.08;color:#fff;text-wrap:balance;font-size:clamp(34px,4vw,54px);letter-spacing:-.03em;white-space:normal;margin:0 0 22px}
.slide-desc{font-size:clamp(15px,1.25vw,17px);line-height:1.6;color:rgba(226,232,240,.78);max-width:480px;margin:0 0 32px;text-wrap:balance}
.slide-pill{
  display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;align-self:flex-start;max-width:100%;
  background:var(--surface-2);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.22);
}
.slide-pill svg{width:14px;height:14px;color:var(--accent);flex-shrink:0}
.slide-pill .pill-live{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:livepulse 1.8s ease-in-out infinite;flex-shrink:0}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.4}}
.slide-pill span{font:600 13px var(--font-body);color:#fff;white-space:normal;letter-spacing:.01em}

/* CTA row */
.cta-row{display:flex;align-items:center;gap:22px;margin-top:40px}
.btn-primary{
  display:inline-flex;align-items:center;gap:10px;padding:17px 34px;border-radius:18px;
  font:700 16px var(--font-body);color:var(--accent-ink);text-decoration:none;border:none;
  background:linear-gradient(135deg,#22d3ee,#06b6d4);
  box-shadow:0 16px 40px rgba(34,211,238,.28),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .2s var(--fin),box-shadow .2s var(--fin),filter .2s var(--fin);
}
.btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 20px 48px rgba(34,211,238,.38),inset 0 1px 0 rgba(255,255,255,.45);filter:brightness(1.04)}
.btn-primary:active{transform:scale(.97);transition:transform .12s var(--fin)}
.btn-primary .arr{width:18px;height:18px;display:inline-block;transition:transform .2s var(--fin)}
.btn-primary:hover .arr{transform:translateX(4px)}
.btn-skip{
  display:inline-flex;align-items:center;min-height:44px;padding:8px 10px;
  font:600 13.5px var(--font-body);color:var(--text-3);background:none;border:none;
  transition:color .18s var(--ease),opacity .18s var(--ease);
}
.btn-skip:hover{color:var(--accent);opacity:1}
.risk-line{display:none;align-items:center;gap:8px;margin-top:16px;font:500 12.5px var(--font-body);color:var(--text-3)}
.risk-line.show{display:inline-flex}
.risk-line svg{width:13px;height:13px;color:var(--accent);flex-shrink:0}

/* +15 promo row */
.promo-row{display:flex;align-items:center;gap:13px;margin-top:48px;padding-top:28px;border-top:1px solid rgba(255,255,255,.08);max-width:560px}
.promo-chip{
  flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:9px;
  font:800 12.5px var(--font-display);color:var(--accent-ink);
  background:linear-gradient(135deg,#22d3ee,#06b6d4);
  box-shadow:0 4px 14px rgba(34,211,238,.3),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .2s var(--fin),box-shadow .2s var(--fin);
}
.promo-chip:hover{transform:translateY(-1px) scale(1.02);box-shadow:0 8px 20px rgba(34,211,238,.38),inset 0 1px 0 rgba(255,255,255,.45)}
.promo-chip svg{width:13px;height:13px}
.promo-text{font-size:13px;line-height:1.55;color:rgba(226,232,240,.74)}
.promo-text b{color:#fff;font-weight:700}

.flash{animation:flash .32s var(--rise)}
@keyframes flash{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.no-js .slide-layer,.no-js .panel-left,.no-js .topbar{opacity:1;transform:none}

/* ═══ RESPONSIVE (container = .stage-wrap width; type scales with container via cqw) ═══ */
@container stage (max-width:1080px){
  .panel-right{padding:44px 34px}
  .cta-row{gap:16px}
  .slide-view{min-height:320px}
  .slide-headline{font-size:clamp(24px,6.5cqw,38px)}
  .slide-desc{font-size:clamp(14px,3.8cqw,17px)}
  .btn-primary{font-size:clamp(14px,3.6cqw,16px);padding:clamp(13px,3.4cqw,17px) clamp(20px,6cqw,34px)}
  .btn-skip{font-size:clamp(12.5px,3.2cqw,13.5px)}
}
@container stage (max-width:820px){
  .topbar{
    position:sticky;top:0;height:54px;padding:0 14px;border-radius:0 0 14px 14px;
    background:linear-gradient(to bottom,rgba(5,8,16,.94) 40%,rgba(5,8,16,.6) 75%,transparent);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .topbar-brand{font-size:22px}
  /* stack: photo on top, content flows below it (never over the photo) */
  .scene{flex-direction:column;overflow:visible;flex:1;min-height:0}
  .panel-left{width:100%;height:32vh;min-height:200px;flex:none}
  .panel-right{flex:none;overflow:visible;justify-content:flex-start;padding:24px 24px 40px}
  .slide-view{min-height:340px;max-width:100%}
  .slide-headline{font-size:clamp(26px,9cqw,40px)}
  .slide-desc{font-size:clamp(14px,4.2cqw,16px)}
  .btn-primary{width:100%;justify-content:center;font-size:clamp(14px,4cqw,16px);padding:clamp(13px,4cqw,16px) 20px}
  .cta-row{flex-direction:column;align-items:stretch;gap:4px;margin-top:24px}
  .btn-skip{align-self:center;min-height:40px}
  .promo-row{margin-top:28px;padding-top:20px}
  .steps{margin-bottom:20px}
  .slide-desc{margin-bottom:22px}
  .risk-line{margin-top:10px}
}
@container stage (max-width:420px){
  .panel-left{height:30vh;min-height:180px}
  .slide-headline{font-size:clamp(22px,8.5cqw,30px)}
  .topbar-brand{font-size:19px}
  .promo-row{flex-direction:column;align-items:flex-start;gap:10px}
}

/* ═══ Reduced motion ═══ */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .noise,.dot-grid,.blob{animation:none !important}
  .slide-layer,.slide-layer *,.panel-left,.topbar,.ping,.pill-live{opacity:1 !important;transform:none !important;box-shadow:none !important}
}
</style>
</head>
<body>

<!-- Backdrop -->
<div class="backdrop">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="dot-grid"></div>
<div class="noise"></div>
<div class="page-border"></div>

<!-- Dev chrome -->
<div class="dev-chrome" role="toolbar" aria-label="Controlli mockup">
  <div class="dev-title"><span class="dot"></span>Fin Replica · Mockup<small>fin layout · sottotitoli colors</small></div>
  <div class="dev-spacer"></div>
  <div class="dev-seg" role="group" aria-label="Layout">
    <button id="btnDesktop" class="active" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      Desktop
    </button>
    <button id="btnMobile" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg>
      Mobile
    </button>
  </div>
  <div class="dev-note">Mockup — <b>non</b> fa parte del sito</div>
</div>

<!-- Stage -->
<div class="stage-wrap" id="stage" data-view="desktop">

  <!-- Topbar (exact nav bar from index.html) -->
  <header class="topbar" role="banner">
    <a href="#" class="topbar-brand" onclick="return false">sottotitoli<span class="pro">.pro</span></a>
    <a href="#" class="topbar-login" onclick="return false"><i class="fa-brands fa-google"></i> Accedi</a>
  </header>

  <!-- SCENE: two-panel replica -->
  <div class="scene" id="scene" role="region" aria-label="Presentazione Sottotitoli">

    <!-- LEFT: photo panel -->
    <div class="panel-left">
      <img src="../img/bg-home.png" alt="Sottotitoli in tempo reale" draggable="false">
      <div class="panel-scrim"></div>
    </div>

    <!-- RIGHT: content panel -->
    <div class="panel-right">
      <div class="steps">
        <div class="steps-dots" id="steps" role="tablist" aria-label="Passi"></div>
        <span class="step-count" id="sCount" aria-hidden="true">01 / 04</span>
      </div>
      <div class="slide-view" id="slideView" role="tabpanel" aria-label="Slide 1 di 4" aria-live="polite" aria-atomic="true">
        <!-- .slide-layer injected by JS -->
      </div>
      <div class="cta-row" id="ctaRow">
        <button type="button" class="btn-primary" id="sCta">
          <span id="sCtaLabel">Scopri di più</span>
          <svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
        <button type="button" class="btn-skip" id="sSkip">Salta per ora</button>
      </div>
      <div class="risk-line" id="sRisk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
        Nessuna carta. Disdici quando vuoi.
      </div>
      <div class="promo-row">
        <span class="promo-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
          Prova gratis
        </span>
        <span class="promo-text"><b>15 minuti gratis all'iscrizione</b> — nessuna carta, nessun impegno. +15 minuti per ogni amico che inviti.</span>
      </div>
    </div>

  </div><!-- /scene -->
</div><!-- /stage-wrap -->

<script>
(function(){
  'use strict';
  document.documentElement.classList.remove('no-js');

  var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');
  var stage = document.getElementById('stage');
  var view = document.getElementById('slideView');
  var dotsHost = document.getElementById('steps');
  var countEl = document.getElementById('sCount');
  var cta = document.getElementById('sCta');
  var ctaLabel = document.getElementById('sCtaLabel');
  var skip = document.getElementById('sSkip');
  var ctaRow = document.getElementById('ctaRow');
  var risk = document.getElementById('sRisk');
  var leftImg = document.querySelector('.panel-left img');

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>';

  /* ── Slides (sottotitoli content) ── */
  var slides = [
    {
      head: 'Tutto chiaro.\nDavvero subito.',
      desc: 'Progettato per capire l\'inglese al volo, in tempo reale. Uno strumento che unisce comprensione e apprendimento in un\'unica esperienza.',
      pill: 'Trascrizione · traduzione in tempo reale',
      cta: 'Scopri di più',
      live: true
    },
    {
      head: 'Ogni momento,\nle sue parole.',
      desc: 'Ogni parola, il suo momento. Un clic mostra definizione, livello, pronuncia e sinonimi. Le parole che tocchi entrano nel tuo vocabolario personale, da rivedere quando vuoi.',
      pill: 'Un clic: definizione · livello · pronuncia · sinonimi',
      cta: 'Continua'
    },
    {
      head: 'Tutto in un\nsolo spazio.',
      desc: 'Usalo in autonomia oppure condividi i sottotitoli in tempo reale con colleghi, studenti o amici.',
      pill: 'Sottotitoli live · Vocabolario · Duo · Report AI',
      cta: 'Continua'
    },
    {
      head: 'Un piano per iniziare,\naltri per crescere.',
      desc: 'Da Gratis a Premium: 15 minuti a settimana fino a 900 al mese, con Report AI e analisi avanzate sulla tua crescita.',
      pill: 'Gratis €0 · Premium €29,99/mese',
      cta: 'Inizia gratis',
      risk: true
    }
  ];
  var N = slides.length;

  function pad(n){ return String(n).padStart(2, '0'); }

  function slideHTML(i){
    var s = slides[i];
    var pillInner = (s.live ? '<span class="pill-live"></span>' : '') + CHECK + '<span>' + s.pill + '</span>';
    return '<h1 class="slide-headline">' + s.head.replace(/\n/g,'<br>') + '</h1>' +
           '<p class="slide-desc">' + s.desc + '</p>' +
           '<div class="slide-pill">' + pillInner + '</div>';
  }

  /* Build step dots */
  slides.forEach(function(_, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'step';
    b.setAttribute('role','tab');
    b.setAttribute('aria-controls','slideView');
    b.setAttribute('aria-label','Vai alla slide ' + (i+1));
    b.addEventListener('click', function(){ go(i); });
    dotsHost.appendChild(b);
  });
  var stepBtns = dotsHost.querySelectorAll('.step');

  function flash(el){
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }

  function setMeta(i){
    stepBtns.forEach(function(d, j){
      var on = j === i;
      d.classList.toggle('active', on);
      d.setAttribute('aria-selected', on ? 'true' : 'false');
      d.setAttribute('tabindex', on ? '0' : '-1');
    });
    countEl.textContent = pad(i+1) + ' / ' + pad(N);
    ctaLabel.textContent = slides[i].cta;
    skip.textContent = (i === N-1) ? 'Ho già un account' : 'Salta per ora';
    risk.classList.toggle('show', !!slides[i].risk);
    view.setAttribute('aria-label', 'Slide ' + (i+1) + ' di ' + N);
    flash(ctaRow); flash(countEl);
  }

  function buildLayer(html){
    var el = document.createElement('div');
    el.className = 'slide-layer';
    el.innerHTML = html;
    return el;
  }

  var cur = 0, dir = 1, busy = false;

  function go(i, focusDot){
    if(i === cur || busy) return;
    busy = true;
    dir = i > cur ? 1 : -1;
    cur = i;
    view.classList.toggle('dir-fwd', dir === 1);
    view.classList.toggle('dir-back', dir === -1);

    if(RM && RM.matches){
      var old0 = view.querySelector('.slide-layer');
      if(old0) old0.remove();
      var l0 = buildLayer(slideHTML(i));
      view.appendChild(l0);
      l0.classList.add('enter');
      setMeta(i);
      if(focusDot) stepBtns[cur].focus();
      busy = false;
      return;
    }

    var out = view.querySelector('.slide-layer');
    if(out){ out.classList.add('out'); out.classList.remove('enter'); }

    var inn = buildLayer(slideHTML(i));
    view.appendChild(inn);
    void inn.offsetWidth;
    inn.classList.add('enter');
    setMeta(i);

    /* photo parallax, direction-aware */
    if(leftImg){
      leftImg.style.transform = dir === 1 ? 'translateX(-8px) scale(1.03)' : 'translateX(8px) scale(1.03)';
    }

    if(focusDot) stepBtns[cur].focus();
    setTimeout(function(){
      if(out && out.parentNode) out.parentNode.removeChild(out);
      busy = false;
    }, 440);
  }

  cta.addEventListener('click', function(){ go((cur + 1) % N); });
  skip.addEventListener('click', function(){ go((cur + 1) % N); });

  /* Keyboard */
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight'){ e.preventDefault(); go((cur + 1) % N, true); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); go((cur + N - 1) % N, true); }
    else if(e.key === 'Home'){ e.preventDefault(); go(0, true); }
    else if(e.key === 'End'){ e.preventDefault(); go(N - 1, true); }
  });

  /* Dev view toggle */
  var btnDesktop = document.getElementById('btnDesktop');
  var btnMobile = document.getElementById('btnMobile');
  function setView(v){
    stage.dataset.view = v;
    btnDesktop.classList.toggle('active', v === 'desktop');
    btnMobile.classList.toggle('active', v === 'mobile');
    btnDesktop.setAttribute('aria-pressed', v === 'desktop' ? 'true' : 'false');
    btnMobile.setAttribute('aria-pressed', v === 'mobile' ? 'true' : 'false');
  }
  btnDesktop.addEventListener('click', function(){ setView('desktop'); });
  btnMobile.addEventListener('click', function(){ setView('mobile'); });

  /* Init: first slide + entrance (rAF + setTimeout fallback so content can never stay hidden) */
  view.classList.add('dir-fwd');
  var first = buildLayer(slideHTML(0));
  view.appendChild(first);
  setMeta(0);
  function prime(){
    first.classList.add('enter');
    stage.classList.add('ready');
  }
  requestAnimationFrame(prime);
  setTimeout(prime, 300);
  console.log('Landing Fin Replica ready —', N, 'slides');
})();
</script>
</body>
</html>
