<!DOCTYPE html><html lang="it" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · #27 Speaker Bubbles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;600;700&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh}
h1{font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:-1px;text-align:center;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6,#60a5fa);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:4px}
@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.subtitle{text-align:center;color:#8b93a5;margin-bottom:20px;font-size:13px}

/* ═══ Speaker Bubble Stage ═══ */
.stage{max-width:750px;margin:0 auto;background:linear-gradient(180deg,rgba(15,18,30,.9),rgba(10,12,22,.95));border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:28px 24px;min-height:440px;position:relative;overflow:hidden;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.02)}
.stage::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(96,165,250,.04),transparent 70%);pointer-events:none}
.timeline{display:flex;align-items:center;gap:12px;margin-bottom:22px;position:relative;z-index:1}
.timestamp{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.25);min-width:52px}
.progress-bar-wrap{flex:1;height:4px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.progress-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);transition:width .5s cubic-bezier(.4,0,.2,1);width:0%;box-shadow:0 0 8px rgba(96,165,250,.3)}

/* ═══ Bubble styles ═══ */
.bubble-row{display:flex;flex-direction:column;gap:0;position:relative;z-index:1}
.speaker-transition{display:flex;align-items:center;gap:10px;padding:8px 12px;animation:transitionIn .5s cubic-bezier(.4,0,.2,1);border-radius:8px;transition:background .3s}
.speaker-transition:hover{background:rgba(255,255,255,.015)}
.speaker-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 0 12px currentColor,0 0 24px currentColor}
.speaker-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.speaker-time{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.2);margin-left:auto}
@keyframes transitionIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}

/* ═══ The bubble ═══ */
.speech-bubble{position:relative;margin:8px 0 8px 24px;max-width:82%;transition:all .5s cubic-bezier(.4,0,.2,1)}
.speech-bubble.ghost{border:2px dashed rgba(255,255,255,.06);border-radius:16px;padding:16px 20px;min-height:48px;animation:bubbleAppear .4s ease;background:rgba(255,255,255,.01)}
.speech-bubble.ghost::after{content:'';display:block;width:50px;height:5px;background:rgba(255,255,255,.03);border-radius:3px;margin-top:6px;animation:typingPulse 1.2s ease infinite}
.speech-bubble.ghost::before{content:'';position:absolute;bottom:-6px;left:20px;width:12px;height:12px;background:transparent;border-right:2px dashed rgba(255,255,255,.06);border-bottom:2px dashed rgba(255,255,255,.06);transform:rotate(45deg)}
.speech-bubble.filled{border:1.5px solid;border-radius:16px;padding:16px 20px;animation:bubbleAppear .4s ease, fillText .5s ease .3s both;position:relative}
.speech-bubble.filled::before{content:'';position:absolute;bottom:-7px;left:20px;width:14px;height:14px;background:inherit;border-right:1.5px solid;border-bottom:1.5px solid;transform:rotate(45deg);border-color:inherit}
.speech-bubble.filled .bubble-text{font-family:'Work Sans',sans-serif;font-size:15px;font-weight:400;line-height:1.6;color:rgba(255,255,255,.88)}
.speech-bubble.filled .bubble-meta{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:8px;color:rgba(255,255,255,.2)}
.speech-bubble.filled .live-dot-mini{width:5px;height:5px;border-radius:50%;background:#34d399;animation:pulse 1.5s ease infinite;display:inline-block;margin-right:4px}
.speech-bubble.complete{border:1.5px solid;border-radius:16px;padding:16px 20px;opacity:.55;transition:all .6s ease;filter:grayscale(.3)}
.speech-bubble.complete .bubble-text{font-family:'Work Sans',sans-serif;font-size:15px;font-weight:400;line-height:1.6;color:rgba(255,255,255,.5)}

@keyframes bubbleAppear{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fillText{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:blur(0)}}
@keyframes typingPulse{0%,100%{opacity:.2}50%{opacity:.7}}

/* ═══ Speaker colors ═══ */
.spk-a .speech-bubble.filled,.spk-a .speech-bubble.complete{border-color:rgba(107,157,255,.3);background:linear-gradient(135deg,rgba(107,157,255,.06),rgba(107,157,255,.01))}
.spk-a .speaker-dot{background:#6b9dff;color:#6b9dff}
.spk-a .speaker-label{color:#8ab4ff}
.spk-b .speech-bubble.filled,.spk-b .speech-bubble.complete{border-color:rgba(248,113,113,.3);background:linear-gradient(135deg,rgba(248,113,113,.06),rgba(248,113,113,.01))}
.spk-b .speaker-dot{background:#f87171;color:#f87171}
.spk-b .speaker-label{color:#f99}
.spk-c .speech-bubble.filled,.spk-c .speech-bubble.complete{border-color:rgba(52,211,153,.3);background:linear-gradient(135deg,rgba(52,211,153,.06),rgba(52,211,153,.01))}
.spk-c .speaker-dot{background:#34d399;color:#34d399}
.spk-c .speaker-label{color:#6ee7b7}

/* ═══ Particle burst ═══ */
@keyframes particleBurst{0%{transform:scale(0) translate(0,0);opacity:1}100%{transform:scale(2) translate(var(--px),var(--py));opacity:0}}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;pointer-events:none;animation:particleBurst .8s ease-out forwards}

/* ═══ Controls ═══ */
.controls{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.controls button{padding:12px 26px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:rgba(255,255,255,.55);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .25s;backdrop-filter:blur(10px)}
.controls button:hover{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.15);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.controls button.primary{background:linear-gradient(135deg,rgba(96,165,250,.2),rgba(167,139,250,.15));border-color:rgba(96,165,250,.35);color:#60a5fa}
.controls button.primary:hover{background:linear-gradient(135deg,rgba(96,165,250,.3),rgba(167,139,250,.25));box-shadow:0 6px 24px rgba(96,165,250,.15)}

/* ═══ Legend ═══ */
.legend{display:flex;gap:20px;justify-content:center;margin-top:14px;font-size:9px;color:rgba(255,255,255,.25)}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:8px;height:8px;border-radius:50%}
.legend-dot.ghost-dot{border:1.5px dashed rgba(255,255,255,.15);background:transparent}
.legend-dot.filled-dot{background:rgba(107,157,255,.6);box-shadow:0 0 6px rgba(107,157,255,.3)}
.legend-dot.complete-dot{background:rgba(255,255,255,.1)}
</style>
</head>
<body>
<h1>💬 #27 · Time-coded Speaker Bubbles</h1>
<p class="subtitle">Ghost → Fill → Complete — Natural conversation rhythm with animated transitions</p>

<div class="stage" id="stage">
  <div class="timeline">
    <span class="timestamp">00:00</span>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <span class="timestamp" id="endTime">00:30</span>
  </div>
  <div class="bubble-row" id="bubbleRow">
    <!-- Dynamically filled -->
  </div>
</div>

<div class="controls">
  <button class="primary" onclick="demoAuto()">▶ Auto Demo</button>
  <button onclick="demoStep()">⏭ Step</button>
  <button onclick="resetDemo()">↺ Reset</button>
</div>

<div class="legend">
  <span class="legend-item"><span class="legend-dot ghost-dot"></span> Ghost (appearing)</span>
  <span class="legend-item"><span class="legend-dot filled-dot"></span> Filled (speaking)</span>
  <span class="legend-item"><span class="legend-dot complete-dot"></span> Complete (finished)</span>
</div>

<script>
// ═══ #27 Speaker Bubble Demo ═══
var SCRIPT = [
  {spk:'A',text:'we are discussing the future of real‑time translation',ts:'00:02'},
  {spk:'B',text:'and how these systems can bridge language barriers across different cultures',ts:'00:08'},
  {spk:'A',text:'exactly — deployment at scale remains our biggest challenge this year',ts:'00:16'},
  {spk:'C',text:'I think the neural models are getting remarkably good at handling edge cases',ts:'00:22'}
];

var currentStep = 0;
var bubbleRow = document.getElementById('bubbleRow');
var progressBar = document.getElementById('progressBar');
var endTimeEl = document.getElementById('endTime');
var autoTimer = null;
var lastSpeaker = null;

function createBubble(spk, text, ts, state) {
  var spkClass = 'spk-' + spk.toLowerCase();
  var isNewSpeaker = spk !== lastSpeaker;
  lastSpeaker = spk;

  var html = '';
  // Speaker transition indicator
  if (isNewSpeaker && currentStep > 0) {
    html += '<div class="speaker-transition ' + spkClass + '">' +
      '<span class="speaker-dot"></span>' +
      '<span class="speaker-label">Speaker ' + spk + '</span>' +
      '<span class="speaker-time">' + ts + '</span>' +
      '</div>';
  } else if (currentStep === 0) {
    html += '<div class="speaker-transition ' + spkClass + '">' +
      '<span class="speaker-dot"></span>' +
      '<span class="speaker-label">Speaker ' + spk + '</span>' +
      '<span class="speaker-time">' + ts + '</span>' +
      '</div>';
  }

  // The bubble
  if (state === 'ghost') {
    html += '<div class="speech-bubble ghost ' + spkClass + '"></div>';
  } else if (state === 'filled') {
    html += '<div class="speech-bubble filled ' + spkClass + '">' +
      '<div class="bubble-text">' + text + '</div>' +
      '<div class="bubble-meta"><span>' + ts + '</span><span><span class="live-dot-mini"></span>LIVE</span></div>' +
      '</div>';
  } else if (state === 'complete') {
    html += '<div class="speech-bubble complete ' + spkClass + '">' +
      '<div class="bubble-text">' + text + '</div>' +
      '<div class="bubble-meta"><span>' + ts + '</span><span>✓ Done</span></div>' +
      '</div>';
  }

  return html;
}

// ═══ Particle burst on new bubble ═══
function burstParticles(bubbleEl) {
  if (!bubbleEl) return;
  var colors = ['#60a5fa','#a78bfa','#f472b6','#34d399','#fbbf24'];
  var rect = bubbleEl.getBoundingClientRect();
  var cx = rect.left + rect.width/2;
  var cy = rect.top + rect.height/2;
  for (var i = 0; i < 12; i++) {
    var particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.position = 'fixed';
    particle.style.left = cx + 'px';
    particle.style.top = cy + 'px';
    particle.style.width = (2 + Math.random()*3) + 'px';
    particle.style.height = particle.style.width;
    particle.style.background = colors[Math.floor(Math.random()*colors.length)];
    particle.style.setProperty('--px', (Math.random()-0.5)*80 + 'px');
    particle.style.setProperty('--py', (Math.random()-0.5)*60 + 'px');
    particle.style.zIndex = '999';
    document.body.appendChild(particle);
    setTimeout(function(){ particle.remove(); }, 800);
  }
}

function renderAll() {
  var html = '';
  var prevSpk = null;
  for (var i = 0; i <= currentStep && i < SCRIPT.length; i++) {
    var s = SCRIPT[i];
    var state = i < currentStep ? 'complete' : (i === currentStep ? 'filled' : 'ghost');
    var isNewSpeaker = s.spk !== prevSpk;
    prevSpk = s.spk;

    if (isNewSpeaker && i > 0) {
      html += '<div class="speaker-transition spk-' + s.spk.toLowerCase() + '">' +
        '<span class="speaker-dot"></span>' +
        '<span class="speaker-label">Speaker ' + s.spk + '</span>' +
        '<span class="speaker-time">' + s.ts + '</span>' +
        '</div>';
    } else if (i === 0) {
      html += '<div class="speaker-transition spk-' + s.spk.toLowerCase() + '">' +
        '<span class="speaker-dot"></span>' +
        '<span class="speaker-label">Speaker ' + s.spk + '</span>' +
        '<span class="speaker-time">' + s.ts + '</span>' +
        '</div>';
    }

    if (state === 'complete') {
      html += '<div class="speech-bubble complete spk-' + s.spk.toLowerCase() + '">' +
        '<div class="bubble-text">' + s.text + '</div>' +
        '<div class="bubble-meta"><span>' + s.ts + '</span><span>✓</span></div>' +
        '</div>';
    } else if (state === 'filled') {
      html += '<div class="speech-bubble filled spk-' + s.spk.toLowerCase() + '">' +
        '<div class="bubble-text">' + s.text + '</div>' +
        '<div class="bubble-meta"><span>' + s.ts + '</span><span>● LIVE</span></div>' +
        '</div>';
    }
  }

  // Next ghost bubble (preview of next speaker)
  if (currentStep + 1 < SCRIPT.length) {
    var next = SCRIPT[currentStep + 1];
    if (next.spk !== prevSpk) {
      html += '<div class="speaker-transition spk-' + next.spk.toLowerCase() + '" style="opacity:.5">' +
        '<span class="speaker-dot" style="opacity:.4"></span>' +
        '<span class="speaker-label" style="color:rgba(255,255,255,.2)">Speaker ' + next.spk + '</span>' +
        '<span class="speaker-time">' + next.ts + '</span>' +
        '</div>';
    }
    html += '<div class="speech-bubble ghost spk-' + next.spk.toLowerCase() + '"></div>';
  }

  bubbleRow.innerHTML = html;

  // Update progress bar
  var pct = SCRIPT.length > 0 ? ((currentStep + 1) / SCRIPT.length * 100) : 0;
  progressBar.style.width = pct + '%';
  if (SCRIPT.length > 0) {
    endTimeEl.textContent = SCRIPT[SCRIPT.length - 1].ts;
  }
}

function demoStep() {
  if (currentStep < SCRIPT.length) {
    // First, mark current as filled
    if (currentStep > 0) {
      // Previous step: change from filled to complete
      var prevBubbles = bubbleRow.querySelectorAll('.speech-bubble.filled');
      prevBubbles.forEach(function(b) {
        b.classList.remove('filled');
        b.classList.add('complete');
        var meta = b.querySelector('.bubble-meta');
        if (meta) {
          var liveSpan = meta.querySelector('span:last-child');
          if (liveSpan) liveSpan.textContent = '✓';
        }
      });
    }
    currentStep++;
    renderAll();
    // Particle burst on new filled bubble
    setTimeout(function(){
      var filled = bubbleRow.querySelectorAll('.speech-bubble.filled');
      if (filled.length > 0) burstParticles(filled[filled.length-1]);
    }, 100);
  }
}

function demoAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; return; }
  resetDemo();
  autoTimer = setInterval(function() {
    if (currentStep >= SCRIPT.length) {
      clearInterval(autoTimer);
      autoTimer = null;
      // Mark last as complete
      var filled = bubbleRow.querySelectorAll('.speech-bubble.filled');
      filled.forEach(function(b) {
        b.classList.remove('filled');
        b.classList.add('complete');
        var meta = b.querySelector('.bubble-meta');
        if (meta) {
          var liveSpan = meta.querySelector('span:last-child');
          if (liveSpan) liveSpan.textContent = '✓';
        }
      });
      // Remove ghost
      var ghost = bubbleRow.querySelector('.speech-bubble.ghost');
      if (ghost) ghost.remove();
      progressBar.style.width = '100%';
      return;
    }
    demoStep();
  }, 2000);
}

function resetDemo() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  currentStep = 0;
  lastSpeaker = null;
  renderAll();
  progressBar.style.width = '0%';
}

// Initial render
renderAll();
</script>
</body>
</html>
