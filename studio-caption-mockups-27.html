<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · #27 Speaker Bubbles</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500;600;700&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Work Sans','Inter',system-ui,sans-serif;background:#0a0f14;color:rgba(255,255,255,.85);padding:32px 24px;min-height:100vh;display:flex;flex-direction:column;align-items:center}h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,5vw,42px);letter-spacing:1px;color:#34d399;margin-bottom:2px;text-align:center}.subtitle{font-size:12px;color:rgba(255,255,255,.35);margin-bottom:28px;text-align:center}.stage{width:100%;max-width:720px;background:#0c1118;border:1px solid rgba(255,255,255,.04);border-radius:12px;overflow:hidden}.stage-header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.01)}.stage-header .room-label{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px;color:rgba(255,255,255,.5)}.stage-header .spk-count{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.18);background:rgba(255,255,255,.03);padding:2px 8px;border-radius:4px;margin-left:auto}.timeline-bar{display:flex;align-items:center;gap:10px;padding:10px 20px}.timeline-bar .ts{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.18);min-width:44px}.timeline-bar .track{flex:1;height:3px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden}.timeline-bar .track-fill{height:100%;border-radius:2px;background:#34d399;transition:width .4s ease;width:0%}.bubble-area{padding:16px 20px;min-height:380px;display:flex;flex-direction:column;gap:2px}.speaker-row{display:flex;align-items:flex-start;gap:0;animation:rowIn .4s ease}.speaker-col{width:80px;flex-shrink:0;padding-top:4px}.speaker-badge{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700}.speaker-badge .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.speaker-badge .name{text-transform:uppercase;letter-spacing:.05em}.speaker-col .time{font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(255,255,255,.15);margin-top:2px}.bubble-col{flex:1;min-width:0}.bubble{position:relative;padding:12px 16px;border-radius:10px;margin-bottom:6px;transition:all .4s ease;max-width:90%}.bubble::before{content:'';position:absolute;left:-6px;top:12px;width:10px;height:10px;transform:rotate(45deg);border-radius:1px}.bubble.ghost{border:2px dashed rgba(255,255,255,.04);background:transparent;min-height:38px;animation:rowIn .35s ease}.bubble.ghost::after{content:'';display:block;width:36px;height:4px;background:rgba(255,255,255,.03);border-radius:2px;margin-top:4px;animation:typingPulse 1.4s ease infinite}.bubble.filled{animation:rowIn .35s ease}.bubble.filled .text{font-family:'Work Sans',sans-serif;font-size:14px;font-weight:400;line-height:1.55;color:rgba(255,255,255,.82)}.bubble.filled .meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:8px;color:rgba(255,255,255,.2)}.bubble.filled .live-dot{width:5px;height:5px;border-radius:50%;background:#34d399;display:inline-block;animation:pulse 1.5s ease infinite}.bubble.complete{opacity:.45;transition:opacity .6s ease}.bubble.complete .text{font-family:'Work Sans',sans-serif;font-size:14px;font-weight:400;line-height:1.55;color:rgba(255,255,255,.5)}.bubble.complete .meta{font-size:8px;color:rgba(255,255,255,.12);margin-top:4px}/* Speaker A — blue */.spk-a .speaker-badge .dot{background:#6b9dff;box-shadow:0 0 6px rgba(107,157,255,.3)}.spk-a .speaker-badge .name{color:#8ab4ff}.spk-a .bubble.filled,.spk-a .bubble.complete{background:rgba(107,157,255,.04);border:1px solid rgba(107,157,255,.1)}.spk-a .bubble.filled::before,.spk-a .bubble.complete::before{background:rgba(107,157,255,.04);border-left:1px solid rgba(107,157,255,.1);border-bottom:1px solid rgba(107,157,255,.1)}/* Speaker B — red */.spk-b .speaker-badge .dot{background:#f87171;box-shadow:0 0 6px rgba(248,113,113,.3)}.spk-b .speaker-badge .name{color:#f99}.spk-b .bubble.filled,.spk-b .bubble.complete{background:rgba(248,113,113,.04);border:1px solid rgba(248,113,113,.1)}.spk-b .bubble.filled::before,.spk-b .bubble.complete::before{background:rgba(248,113,113,.04);border-left:1px solid rgba(248,113,113,.1);border-bottom:1px solid rgba(248,113,113,.1)}/* Speaker C — green */.spk-c .speaker-badge .dot{background:#34d399;box-shadow:0 0 6px rgba(52,211,153,.3)}.spk-c .speaker-badge .name{color:#6ee7b7}.spk-c .bubble.filled,.spk-c .bubble.complete{background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.1)}.spk-c .bubble.filled::before,.spk-c .bubble.complete::before{background:rgba(52,211,153,.04);border-left:1px solid rgba(52,211,153,.1);border-bottom:1px solid rgba(52,211,153,.1)}.controls{display:flex;gap:8px;justify-content:center;margin-top:16px}.controls button{padding:8px 18px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:rgba(255,255,255,.45);font-family:'Inter',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s}.controls button:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.12)}.controls button.primary{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.2);color:#34d399;font-weight:600}.legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:9px;color:rgba(255,255,255,.2)}.legend span{display:flex;align-items:center;gap:4px}.legend .ld{width:6px;height:6px;border-radius:2px}.legend .ld.ghost{border:1px dashed rgba(255,255,255,.15);background:transparent}.legend .ld.filled{background:rgba(107,157,255,.5)}.legend .ld.complete{background:rgba(255,255,255,.08)}@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes typingPulse{0%,100%{opacity:.15}50%{opacity:.5}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}</style></head><body><h1>#27 · Speaker Bubbles</h1><p class="subtitle">Time-coded conversation — Ghost → Fill → Complete</p><div class="stage"><div class="stage-header"><span class="room-label">Live Room</span><span class="spk-count" id="spkBadge">3 SPK</span></div><div class="timeline-bar"><span class="ts">00:00</span><div class="track"><div class="track-fill" id="trackFill"></div></div><span class="ts" id="trackEnd">00:22</span></div><div class="bubble-area" id="bubbleArea"></div></div><div class="controls"><button class="primary" onclick="demoAuto()">▶ Auto Demo</button><button onclick="demoStep()">Step</button><button onclick="resetDemo()">Reset</button></div><div class="legend"><span><span class="ld ghost"></span> Ghost</span><span><span class="ld filled"></span> Speaking</span><span><span class="ld complete"></span> Done</span></div><script>
var SCRIPT=[{spk:'A',text:'we are discussing the future of real‑time translation',ts:'00:02'},{spk:'B',text:'and how these systems can bridge language barriers across different cultures',ts:'00:08'},{spk:'A',text:'exactly — deployment at scale remains our biggest challenge this year',ts:'00:16'},{spk:'C',text:'I think the neural models are getting remarkably good at handling edge cases',ts:'00:22'}];
var step=0,autoTimer=null,lastSpk=null;
var area=document.getElementById('bubbleArea');
var track=document.getElementById('trackFill');
var endEl=document.getElementById('trackEnd');

function render(){
  var h='';var prev=null;
  for(var i=0;i<=step&&i<SCRIPT.length;i++){
    var s=SCRIPT[i];var state=i<step?'complete':'filled';var isNew=s.spk!==prev;prev=s.spk;
    if(isNew){
      var spkClass='spk-'+s.spk.toLowerCase();
      h+='<div class="speaker-row '+spkClass+'"><div class="speaker-col"><div class="speaker-badge"><span class="dot"></span><span class="name">SPK '+s.spk+'</span></div><div class="time">'+s.ts+'</div></div><div class="bubble-col">';
    }
    h+='<div class="bubble '+state+'"><div class="text">'+s.text+'</div><div class="meta">'+s.ts+(state==='filled'?' · <span class="live-dot"></span> LIVE':' · ✓')+'</div></div>';
    if(i===step||(i+1<SCRIPT.length&&SCRIPT[i+1].spk!==s.spk))h+='</div></div>';
  }
  // Ghost for next
  if(step+1<SCRIPT.length){
    var n=SCRIPT[step+1];var nClass='spk-'+n.spk.toLowerCase();
    if(n.spk!==prev){h+='<div class="speaker-row '+nClass+'" style="opacity:.5"><div class="speaker-col"><div class="speaker-badge"><span class="dot" style="opacity:.3"></span><span class="name" style="color:rgba(255,255,255,.15)">SPK '+n.spk+'</span></div><div class="time">'+n.ts+'</div></div><div class="bubble-col">'}
    h+='<div class="bubble ghost"></div>';
    if(n.spk!==prev)h+='</div></div>';
  }
  area.innerHTML=h;
  var pct=SCRIPT.length>0?((step+1)/SCRIPT.length*100):0;track.style.width=pct+'%';
  if(SCRIPT.length>0)endEl.textContent=SCRIPT[SCRIPT.length-1].ts;
}
function demoStep(){
  if(step<SCRIPT.length){if(step>0){var f=area.querySelectorAll('.bubble.filled');f.forEach(function(b){b.classList.remove('filled');b.classList.add('complete');var m=b.querySelector('.meta');if(m)m.innerHTML=m.innerHTML.replace('LIVE','✓').replace('live-dot','')})}step++;render()}
}
function demoAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;return}resetDemo();autoTimer=setInterval(function(){if(step>=SCRIPT.length){clearInterval(autoTimer);autoTimer=null;var f=area.querySelectorAll('.bubble.filled');f.forEach(function(b){b.classList.remove('filled');b.classList.add('complete')});var g=area.querySelector('.bubble.ghost');if(g)g.remove();track.style.width='100%';return}demoStep()},2200)}
function resetDemo(){if(autoTimer){clearInterval(autoTimer);autoTimer=null}step=0;lastSpk=null;render();track.style.width='0%'}
render();
</script></body></html>
