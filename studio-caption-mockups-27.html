<!DOCTYPE html><html lang="it" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · #27 Speaker Bubbles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;600;700&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh}
h1{font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:-1px;text-align:center;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6,#60a5fa);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:4px}
@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.subtitle{text-align:center;color:#8b93a5;margin-bottom:20px;font-size:13px}

/* ═══ Speaker Bubble Stage ═══ */
.stage{max-width:700px;margin:0 auto;background:#0d1117;border:1px solid #1a1e2e;border-radius:16px;padding:24px;min-height:400px;position:relative;overflow:hidden}
.timeline{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.timestamp{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.3);min-width:52px}
.progress-bar-wrap{flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.progress-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#a78bfa);transition:width .3s;width:0%}

/* ═══ Bubble styles ═══ */
.bubble-row{display:flex;flex-direction:column;gap:0;position:relative}
.speaker-transition{display:flex;align-items:center;gap:8px;padding:6px 0;animation:transitionIn .4s ease}
.speaker-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
.speaker-label{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.speaker-time{font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(255,255,255,.25);margin-left:auto}
@keyframes transitionIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}

/* ═══ The bubble = the core #27 idea ═══ */
.speech-bubble{position:relative;margin:6px 0 6px 20px;max-width:85%;transition:all .4s cubic-bezier(.4,0,.2,1)}
/* Ghost placeholder — appears empty first */
.speech-bubble.ghost{border:2px dashed rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;min-height:44px;animation:bubbleAppear .35s ease}
.speech-bubble.ghost::after{content:'';display:block;width:40px;height:4px;background:rgba(255,255,255,.04);border-radius:2px;margin-top:4px;animation:typingPulse 1.5s ease infinite}
/* Filled bubble */
.speech-bubble.filled{border:1.5px solid;border-radius:14px;padding:14px 18px;animation:bubbleAppear .35s ease, fillText .6s ease .35s both}
.speech-bubble.filled .bubble-text{font-family:'Work Sans',sans-serif;font-size:14px;font-weight:400;line-height:1.55;color:rgba(255,255,255,.85)}
.speech-bubble.filled .bubble-meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:8px;color:rgba(255,255,255,.25)}
/* Complete bubble */
.speech-bubble.complete{border:1.5px solid;border-radius:14px;padding:14px 18px;opacity:.7;transition:opacity .5s}
.speech-bubble.complete .bubble-text{font-family:'Work Sans',sans-serif;font-size:14px;font-weight:400;line-height:1.55;color:rgba(255,255,255,.6)}

@keyframes bubbleAppear{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fillText{from{opacity:0}to{opacity:1}}
@keyframes typingPulse{0%,100%{opacity:.3}50%{opacity:.8}}

/* ═══ Speaker colors ═══ */
.spk-a .speech-bubble.filled,.spk-a .speech-bubble.complete{border-color:rgba(107,157,255,.25);background:rgba(107,157,255,.04)}
.spk-a .speaker-dot{background:#6b9dff;color:#6b9dff}
.spk-a .speaker-label{color:#8ab4ff}
.spk-b .speech-bubble.filled,.spk-b .speech-bubble.complete{border-color:rgba(248,113,113,.25);background:rgba(248,113,113,.04)}
.spk-b .speaker-dot{background:#f87171;color:#f87171}
.spk-b .speaker-label{color:#f99}
.spk-c .speech-bubble.filled,.spk-c .speech-bubble.complete{border-color:rgba(52,211,153,.25);background:rgba(52,211,153,.04)}
.spk-c .speaker-dot{background:#34d399;color:#34d399}
.spk-c .speaker-label{color:#6ee7b7}

/* ═══ Controls ═══ */
.controls{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.controls button{padding:10px 22px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.controls button:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
.controls button.primary{background:rgba(96,165,250,.15);border-color:rgba(96,165,250,.3);color:#60a5fa}
.controls button.primary:hover{background:rgba(96,165,250,.25)}

/* ═══ Legend ═══ */
.legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:9px;color:rgba(255,255,255,.3)}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:7px;height:7px;border-radius:50%}
.legend-dot.ghost-dot{border:1.5px dashed rgba(255,255,255,.2);background:transparent}
.legend-dot.filled-dot{background:rgba(107,157,255,.5)}
.legend-dot.complete-dot{background:rgba(255,255,255,.15)}
</style>
</head>
<body>
<h1>💬 #27 · Time-coded Speaker Bubbles</h1>
<p class="subtitle">Ghost → Fill → Complete — Natural conversation rhythm with animated transitions</p>

<div class="stage" id="stage">
  <div class="timeline">
    <span class="timestamp">00:00</span>
    <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <span class="timestamp" id="endTime">00:30</span>
  </div>
  <div class="bubble-row" id="bubbleRow">
    <!-- Dynamically filled -->
  </div>
</div>

<div class="controls">
  <button class="primary" onclick="demoAuto()">▶ Auto Demo</button>
  <button onclick="demoStep()">⏭ Step</button>
  <button onclick="resetDemo()">↺ Reset</button>
</div>

<div class="legend">
  <span class="legend-item"><span class="legend-dot ghost-dot"></span> Ghost (appearing)</span>
  <span class="legend-item"><span class="legend-dot filled-dot"></span> Filled (speaking)</span>
  <span class="legend-item"><span class="legend-dot complete-dot"></span> Complete (finished)</span>
</div>

<script>
// ═══ #27 Speaker Bubble Demo ═══
var SCRIPT = [
  {spk:'A',text:'we are discussing the future of real‑time translation',ts:'00:02'},
  {spk:'B',text:'and how these systems can bridge language barriers across different cultures',ts:'00:08'},
  {spk:'A',text:'exactly — deployment at scale remains our biggest challenge this year',ts:'00:16'},
  {spk:'C',text:'I think the neural models are getting remarkably good at handling edge cases',ts:'00:22'}
];

var currentStep = 0;
var bubbleRow = document.getElementById('bubbleRow');
var progressBar = document.getElementById('progressBar');
var endTimeEl = document.getElementById('endTime');
var autoTimer = null;
var lastSpeaker = null;

function createBubble(spk, text, ts, state) {
  var spkClass = 'spk-' + spk.toLowerCase();
  var isNewSpeaker = spk !== lastSpeaker;
  lastSpeaker = spk;

  var html = '';
  // Speaker transition indicator
  if (isNewSpeaker && currentStep > 0) {
    html += '<div class="speaker-transition ' + spkClass + '">' +
      '<span class="speaker-dot"></span>' +
      '<span class="speaker-label">Speaker ' + spk + '</span>' +
      '<span class="speaker-time">' + ts + '</span>' +
      '</div>';
  } else if (currentStep === 0) {
    html += '<div class="speaker-transition ' + spkClass + '">' +
      '<span class="speaker-dot"></span>' +
      '<span class="speaker-label">Speaker ' + spk + '</span>' +
      '<span class="speaker-time">' + ts + '</span>' +
      '</div>';
  }

  // The bubble
  if (state === 'ghost') {
    html += '<div class="speech-bubble ghost ' + spkClass + '"></div>';
  } else if (state === 'filled') {
    html += '<div class="speech-bubble filled ' + spkClass + '">' +
      '<div class="bubble-text">' + text + '</div>' +
      '<div class="bubble-meta"><span>' + ts + '</span><span>● LIVE</span></div>' +
      '</div>';
  } else if (state === 'complete') {
    html += '<div class="speech-bubble complete ' + spkClass + '">' +
      '<div class="bubble-text">' + text + '</div>' +
      '<div class="bubble-meta"><span>' + ts + '</span><span>✓</span></div>' +
      '</div>';
  }

  return html;
}

function renderAll() {
  var html = '';
  var prevSpk = null;
  for (var i = 0; i <= currentStep && i < SCRIPT.length; i++) {
    var s = SCRIPT[i];
    var state = i < currentStep ? 'complete' : (i === currentStep ? 'filled' : 'ghost');
    var isNewSpeaker = s.spk !== prevSpk;
    prevSpk = s.spk;

    if (isNewSpeaker && i > 0) {
      html += '<div class="speaker-transition spk-' + s.spk.toLowerCase() + '">' +
        '<span class="speaker-dot"></span>' +
        '<span class="speaker-label">Speaker ' + s.spk + '</span>' +
        '<span class="speaker-time">' + s.ts + '</span>' +
        '</div>';
    } else if (i === 0) {
      html += '<div class="speaker-transition spk-' + s.spk.toLowerCase() + '">' +
        '<span class="speaker-dot"></span>' +
        '<span class="speaker-label">Speaker ' + s.spk + '</span>' +
        '<span class="speaker-time">' + s.ts + '</span>' +
        '</div>';
    }

    if (state === 'complete') {
      html += '<div class="speech-bubble complete spk-' + s.spk.toLowerCase() + '">' +
        '<div class="bubble-text">' + s.text + '</div>' +
        '<div class="bubble-meta"><span>' + s.ts + '</span><span>✓</span></div>' +
        '</div>';
    } else if (state === 'filled') {
      html += '<div class="speech-bubble filled spk-' + s.spk.toLowerCase() + '">' +
        '<div class="bubble-text">' + s.text + '</div>' +
        '<div class="bubble-meta"><span>' + s.ts + '</span><span>● LIVE</span></div>' +
        '</div>';
    }
  }

  // Next ghost bubble (preview of next speaker)
  if (currentStep + 1 < SCRIPT.length) {
    var next = SCRIPT[currentStep + 1];
    if (next.spk !== prevSpk) {
      html += '<div class="speaker-transition spk-' + next.spk.toLowerCase() + '" style="opacity:.5">' +
        '<span class="speaker-dot" style="opacity:.4"></span>' +
        '<span class="speaker-label" style="color:rgba(255,255,255,.2)">Speaker ' + next.spk + '</span>' +
        '<span class="speaker-time">' + next.ts + '</span>' +
        '</div>';
    }
    html += '<div class="speech-bubble ghost spk-' + next.spk.toLowerCase() + '"></div>';
  }

  bubbleRow.innerHTML = html;

  // Update progress bar
  var pct = SCRIPT.length > 0 ? ((currentStep + 1) / SCRIPT.length * 100) : 0;
  progressBar.style.width = pct + '%';
  if (SCRIPT.length > 0) {
    endTimeEl.textContent = SCRIPT[SCRIPT.length - 1].ts;
  }
}

function demoStep() {
  if (currentStep < SCRIPT.length) {
    // First, mark current as filled
    if (currentStep > 0) {
      // Previous step: change from filled to complete
      var prevBubbles = bubbleRow.querySelectorAll('.speech-bubble.filled');
      prevBubbles.forEach(function(b) {
        b.classList.remove('filled');
        b.classList.add('complete');
        var meta = b.querySelector('.bubble-meta');
        if (meta) {
          var liveSpan = meta.querySelector('span:last-child');
          if (liveSpan) liveSpan.textContent = '✓';
        }
      });
    }
    currentStep++;
    renderAll();
  }
}

function demoAuto() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; return; }
  resetDemo();
  autoTimer = setInterval(function() {
    if (currentStep >= SCRIPT.length) {
      clearInterval(autoTimer);
      autoTimer = null;
      // Mark last as complete
      var filled = bubbleRow.querySelectorAll('.speech-bubble.filled');
      filled.forEach(function(b) {
        b.classList.remove('filled');
        b.classList.add('complete');
        var meta = b.querySelector('.bubble-meta');
        if (meta) {
          var liveSpan = meta.querySelector('span:last-child');
          if (liveSpan) liveSpan.textContent = '✓';
        }
      });
      // Remove ghost
      var ghost = bubbleRow.querySelector('.speech-bubble.ghost');
      if (ghost) ghost.remove();
      progressBar.style.width = '100%';
      return;
    }
    demoStep();
  }, 2000);
}

function resetDemo() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  currentStep = 0;
  lastSpeaker = null;
  renderAll();
  progressBar.style.width = '0%';
}

// Initial render
renderAll();
</script>
</body>
</html>
