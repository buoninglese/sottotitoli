<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · #27 · Speaker Bubbles</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter','Noto Serif JP',system-ui,sans-serif;background:#fafaf8;color:#2c2c2c;padding:40px 24px;min-height:100vh;display:flex;flex-direction:column;align-items:center}h1{font-family:'Noto Serif JP',serif;font-size:clamp(22px,4vw,32px);font-weight:300;letter-spacing:.04em;color:#1a1a1a;margin-bottom:2px;text-align:center}.subtitle{font-size:11px;color:#aaa;margin-bottom:32px;text-align:center;font-weight:300;letter-spacing:.06em}.stage{width:100%;max-width:680px;background:#fff;border:1px solid #e8e5df;border-radius:2px}.stage-header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid #f0ede6}.stage-header .room-label{font-size:11px;font-weight:400;color:#999;letter-spacing:.08em;text-transform:uppercase}.stage-header .spacer{flex:1}.stage-header .spk-count{font-family:'JetBrains Mono',monospace;font-size:9px;color:#bbb}.timeline-bar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid #f5f3ef}.timeline-bar .ts{font-family:'JetBrains Mono',monospace;font-size:9px;color:#ccc;min-width:40px;font-weight:300}.timeline-bar .track{flex:1;height:1px;background:#f0ede6}.timeline-bar .track-fill{height:1px;background:#1a1a1a;transition:width .5s ease;width:0%}.bubble-area{padding:24px;min-height:380px;display:flex;flex-direction:column;gap:20px}.speaker-row{display:flex;gap:16px;animation:fadeIn .5s ease}.speaker-meta{width:64px;flex-shrink:0;text-align:right;padding-top:2px}.speaker-meta .spk-name{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;color:#999}.speaker-meta .spk-time{font-family:'JetBrains Mono',monospace;font-size:8px;color:#ccc;margin-top:2px;font-weight:300}.bubble-wrap{flex:1;min-width:0}.bubble{position:relative;padding:14px 18px;margin-bottom:10px;transition:all .5s ease;max-width:88%}.bubble .text{font-size:14px;font-weight:300;line-height:1.7;color:#2c2c2c}.bubble.filled .text{font-weight:400;color:#1a1a1a}.bubble .meta{font-size:8px;color:#ccc;margin-top:4px;font-weight:300}.bubble.ghost{border:1px dashed #e8e5df;background:transparent;min-height:38px;animation:fadeIn .4s ease}.bubble.ghost::after{content:'';display:block;width:32px;height:2px;background:#f0ede6;margin-top:4px;animation:typingPulse 1.6s ease infinite}.bubble.filled{background:#f5f3ef;border:1px solid #d5d0c8;animation:fadeIn .4s ease;box-shadow:0 1px 4px rgba(0,0,0,.04)}.bubble.filled .live-dot{width:5px;height:5px;border-radius:50%;background:#1a1a1a;display:inline-block;animation:pulse 2s ease infinite;box-shadow:0 0 6px rgba(0,0,0,.15)}.bubble.complete{background:transparent;border:1px solid #e0dcd5;opacity:.78;transition:all .6s ease}.bubble.complete .text{color:#999}.spk-a .speaker-meta .spk-name{color:#5b7fc1}.spk-a .bubble.filled{border-left:3px solid #5b7fc1}.spk-b .speaker-meta .spk-name{color:#c1665b}.spk-b .bubble.filled{border-left:3px solid #c1665b}.spk-c .speaker-meta .spk-name{color:#5b9c6e}.spk-c .bubble.filled{border-left:3px solid #5b9c6e}.controls{display:flex;gap:10px;justify-content:center;margin-top:20px}.controls button{padding:10px 24px;border-radius:2px;border:1px solid #e8e5df;background:#fff;color:#888;font-family:'Inter',sans-serif;font-size:10px;font-weight:400;cursor:pointer;transition:all .2s;letter-spacing:.04em}.controls button:hover{background:#fafaf8;color:#1a1a1a;border-color:#ccc}.controls button.primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-weight:500}.legend{display:flex;gap:20px;justify-content:center;margin-top:12px;font-size:9px;color:#ccc}.legend span{display:flex;align-items:center;gap:5px;font-weight:300}.legend .ld{width:5px;height:5px}.legend .ld.ghost{border:1px dashed #ddd;background:transparent}.legend .ld.filled{background:#5b7fc1}.legend .ld.complete{background:#e8e5df}@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@keyframes typingPulse{0%,100%{opacity:.2}50%{opacity:.6}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}[data-theme="dark"] body{background:#0a0a0f;color:#c8c8d0}[data-theme="dark"] h1{color:#e0e0e8}[data-theme="dark"] .subtitle{color:#555}[data-theme="dark"] .stage{background:#111118;border-color:#1e1e2a}[data-theme="dark"] .stage-header{border-color:#1a1a24}[data-theme="dark"] .stage-header .room-label{color:#666}[data-theme="dark"] .stage-header .spk-count{color:#555}[data-theme="dark"] .timeline-bar{border-color:#1a1a24}[data-theme="dark"] .timeline-bar .ts{color:#555}[data-theme="dark"] .timeline-bar .track{background:#1a1a24}[data-theme="dark"] .timeline-bar .track-fill{background:#e0e0e8}[data-theme="dark"] .speaker-meta .spk-name{color:#777}[data-theme="dark"] .speaker-meta .spk-time{color:#555}[data-theme="dark"] .bubble .text{color:#c8c8d0}[data-theme="dark"] .bubble .meta{color:#555}[data-theme="dark"] .bubble.ghost{border-color:#1e1e2a}[data-theme="dark"] .bubble.ghost::after{background:#1a1a24}[data-theme="dark"] .bubble.filled{background:#1a1a26;border-color:#2a2a3a;box-shadow:0 1px 6px rgba(0,0,0,.2)}[data-theme="dark"] .bubble.filled .live-dot{background:#e0e0e8}[data-theme="dark"] .bubble.complete{border-color:#222236;opacity:.78}[data-theme="dark"] .bubble.complete .text{color:#777}[data-theme="dark"] .controls button{background:#111118;border-color:#1e1e2a;color:#666}[data-theme="dark"] .controls button:hover{background:#16161e;color:#e0e0e8;border-color:#333}[data-theme="dark"] .controls button.primary{background:#e0e0e8;color:#0a0a0f;border-color:#e0e0e8}[data-theme="dark"] .legend{color:#555}[data-theme="dark"] .legend .ld.complete{background:#1e1e2a}[data-theme="dark"] .legend .ld.ghost{border-color:#333}[data-theme="dark"] .spk-a .speaker-meta .spk-name{color:#7b9fe8}[data-theme="dark"] .spk-a .bubble.filled{border-left:3px solid #7b9fe8}[data-theme="dark"] .spk-b .speaker-meta .spk-name{color:#e8887b}[data-theme="dark"] .spk-b .bubble.filled{border-left:3px solid #e8887b}[data-theme="dark"] .spk-c .speaker-meta .spk-name{color:#7bc89b}[data-theme="dark"] .spk-c .bubble.filled{border-left:3px solid #7bc89b}</style></head><body><h1>Speaker Bubbles</h1><p class="subtitle">タイムコード · 会話の流れ · 静寂のデザイン</p><div class="stage"><div class="stage-header"><span class="room-label">Live Room</span><span class="spacer"></span><span class="spk-count">3 speakers</span></div><div class="timeline-bar"><span class="ts">00:00</span><div class="track"><div class="track-fill" id="trackFill"></div></div><span class="ts" id="trackEnd">00:22</span></div><div class="bubble-area" id="bubbleArea"></div></div><div class="controls"><button class="primary" onclick="demoAuto()">Auto Demo</button><button onclick="demoStep()">Step</button><button onclick="resetDemo()">Reset</button><button onclick="toggleTheme()" id="themeBtn" style="margin-left:8px">🌙 Dark</button></div><div class="legend"><span><span class="ld ghost"></span>appearing</span><span><span class="ld filled"></span>speaking</span><span><span class="ld complete"></span>complete</span></div><script>
var SCRIPT=[{spk:'C',text:'I think the neural models are getting remarkably good at handling edge cases',ts:'00:22'},{spk:'A',text:'exactly \u2014 deployment at scale remains our biggest challenge this year',ts:'00:16'},{spk:'B',text:'and how these systems can bridge language barriers across different cultures',ts:'00:08'},{spk:'A',text:'we are discussing the future of real‑time translation',ts:'00:02'}];
var step=0,autoTimer=null;var area=document.getElementById('bubbleArea');var track=document.getElementById('trackFill');var endEl=document.getElementById('trackEnd');
function render(){var h='';var prev=null;for(var i=0;i<=step&&i<SCRIPT.length;i++){var s=SCRIPT[i];var state=i<step?'complete':'filled';var isNew=s.spk!==prev;prev=s.spk;if(isNew){h+='<div class="speaker-row spk-'+s.spk.toLowerCase()+'"><div class="speaker-meta"><div class="spk-name">SPK '+s.spk+'</div><div class="spk-time">'+s.ts+'</div></div><div class="bubble-wrap">'}h+='<div class="bubble '+state+'"><div class="text">'+s.text+'</div><div class="meta">'+s.ts+(state==='filled'?' · <span class="live-dot"></span>':' · ✓')+'</div></div>';if(i===step||(i+1<SCRIPT.length&&SCRIPT[i+1].spk!==s.spk))h+='</div></div>'}if(step+1<SCRIPT.length){var n=SCRIPT[step+1];if(n.spk!==prev){h+='<div class="speaker-row spk-'+n.spk.toLowerCase()+'" style="opacity:.35"><div class="speaker-meta"><div class="spk-name">SPK '+n.spk+'</div><div class="spk-time">'+n.ts+'</div></div><div class="bubble-wrap">'}h+='<div class="bubble ghost"></div>';if(n.spk!==prev)h+='</div></div>'}area.innerHTML=h;track.style.width=(SCRIPT.length>0?((step+1)/SCRIPT.length*100):0)+'%';if(SCRIPT.length>0)endEl.textContent=SCRIPT[SCRIPT.length-1].ts}
function demoStep(){if(step<SCRIPT.length){if(step>0){var f=area.querySelectorAll('.bubble.filled');f.forEach(function(b){b.classList.remove('filled');b.classList.add('complete')})}step++;render()}}
function demoAuto(){if(autoTimer){clearInterval(autoTimer);autoTimer=null;return}resetDemo();autoTimer=setInterval(function(){if(step>=SCRIPT.length){clearInterval(autoTimer);autoTimer=null;track.style.width='100%';return}demoStep()},2400)}
function resetDemo(){if(autoTimer){clearInterval(autoTimer);autoTimer=null}step=0;render();track.style.width='0%'}
render();
</script></body></html>
