<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sottotitoli · Hamburger Typography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Geist+Mono:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e8eaed;padding:24px;-webkit-font-smoothing:antialiased}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.page-header h1{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;color:#34d399;margin-bottom:2px}
.sub{font-size:13px;color:#71717a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:20px}
.card{background:#0c1118;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:visible;position:relative;min-height:380px}
.card-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04)}
.card-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:#52525b}
.card-label{font-size:11px;font-weight:600;color:#71717a;text-transform:uppercase;letter-spacing:.5px}
.card-body{padding:32px 20px 48px;display:flex;align-items:flex-start;justify-content:flex-end;position:relative;min-height:290px}
.card-body .tip{position:absolute;bottom:8px;right:18px;font-size:9px;color:#52525b;font-family:'JetBrains Mono',monospace}

.hamburger-menu{position:relative;display:inline-block;z-index:5}
.hamburger-btn{cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;border:none;background:none;padding:0;user-select:none}
.hamburger-dropdown{position:absolute;top:100%;right:0;margin-top:8px;z-index:20;min-width:210px;border-radius:10px;padding:8px;display:none;flex-direction:column;opacity:0}
.hamburger-dropdown.open{display:flex;animation:hbFeatherIn .4s cubic-bezier(.22,.61,.36,1) forwards}
.hamburger-dropdown.closing{display:flex;animation:hbFeatherOut .25s ease-in forwards}
@keyframes hbFeatherIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes hbFeatherOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-14px)}}

/* Glide variant */
.glide-section .hamburger-dropdown.open{animation:hbGlideIn .35s cubic-bezier(.25,.46,.45,.94) forwards}
.glide-section .hamburger-dropdown.closing{animation:hbGlideOut .22s ease-in forwards}
@keyframes hbGlideIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes hbGlideOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-10px)}}

.hamburger-dropdown a,.dd-item{font-size:12px;font-weight:500;padding:9px 14px;border-radius:7px;text-decoration:none;transition:all .15s;display:flex;align-items:center;gap:8px;cursor:pointer}
.hamburger-dropdown .dd-icon{width:18px;text-align:center;font-size:13px;flex-shrink:0;opacity:.6}
.hamburger-dropdown hr{border:none;border-top:1px solid;margin:4px 0}
.dd-greeting{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;margin-bottom:4px;border-bottom:1px solid}
.dd-avatar{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}

.ghost-btn{height:36px;padding:0 16px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ghost-btn::before{content:'☰';font-size:14px}
.ghost-btn:hover{transform:translateY(-1px)}
@media(max-width:600px){.ghost-btn{width:38px;height:38px;padding:0;border-radius:50%;font-size:0;gap:0}.ghost-btn::before{font-size:17px}.grid{grid-template-columns:1fr}}

/* ═══ 5 STYLES ═══ */
.s-bunko .card{background:#12121a;border-color:#1a1c24}
.s-bunko .ghost-btn{border:1px solid rgba(201,168,76,.2);color:#c9a84c;font-family:'Inter',sans-serif;background:transparent}
.s-bunko .ghost-btn:hover{border-color:rgba(201,168,76,.4);background:rgba(201,168,76,.06);box-shadow:0 4px 14px rgba(201,168,76,.12)}
.s-bunko .hamburger-dropdown{background:#1a1a24;border:1px solid #2a2a38}
.s-bunko .hamburger-dropdown a{color:#b5ad9e}
.s-bunko .hamburger-dropdown a:hover{background:rgba(201,168,76,.07);color:#c9a84c}
.s-bunko .dd-greeting{color:#8b8b8b;border-bottom-color:#2a2a38}

.s-shoji .card{background:#fafafa;border-color:#e5e5e5}
.s-shoji .card-head{border-bottom-color:#e5e5e5}
.s-shoji .card-num,.s-shoji .card-label,.s-shoji .tip{color:#a1a1aa}
.s-shoji .ghost-btn{border:1px solid #d4d4d8;color:#71717a;font-family:'Manrope',sans-serif;font-weight:400;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.s-shoji .ghost-btn:hover{border-color:#a1a1aa;color:#52525b;background:#f9f9f9;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.s-shoji .hamburger-dropdown{background:#fff;border:1px solid #e5e5e5;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.s-shoji .hamburger-dropdown a{color:#52525b}
.s-shoji .hamburger-dropdown a:hover{background:#f5f5f5;color:#18181b}
.s-shoji .dd-greeting{color:#a1a1aa;border-bottom-color:#e5e5e5}

.s-trad .card{background:#0c1118}
.s-trad .ghost-btn{border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-family:'Work Sans',sans-serif;font-weight:500;background:rgba(255,255,255,.02)}
.s-trad .ghost-btn:hover{border-color:rgba(52,211,153,.3);color:#6ee7b7;background:rgba(52,211,153,.04);box-shadow:0 4px 14px rgba(52,211,153,.1)}
.s-trad .hamburger-dropdown{background:#161e28;border:1px solid rgba(255,255,255,.08)}
.s-trad .hamburger-dropdown a{color:#d4d4d8;font-family:'Work Sans',sans-serif}
.s-trad .hamburger-dropdown a:hover{background:rgba(52,211,153,.06);color:#6ee7b7}
.s-trad .dd-greeting{color:rgba(255,255,255,.45);border-bottom-color:rgba(255,255,255,.06)}

.s-idx .card{background:#0f1117}
.s-idx .ghost-btn{border:1px solid #2f333e;color:rgba(255,255,255,.5);font-family:'Inter',sans-serif;font-weight:600;background:rgba(255,255,255,.02)}
.s-idx .ghost-btn:hover{border-color:rgba(167,139,250,.3);color:#a78bfa;background:rgba(167,139,250,.04);box-shadow:0 4px 14px rgba(167,139,250,.1)}
.s-idx .hamburger-dropdown{background:#1a1d26;border:1px solid #2f333e}
.s-idx .hamburger-dropdown a{color:#9ca3af}
.s-idx .hamburger-dropdown a:hover{background:rgba(167,139,250,.08);color:#a78bfa}
.s-idx .dd-greeting{color:#6b7280;border-bottom-color:#2f333e}

.s-start .card{background:#0f1117}
.s-start .ghost-btn{border:1px solid rgba(37,99,235,.15);color:rgba(255,255,255,.4);font-family:'Inter',sans-serif;font-weight:500;background:rgba(255,255,255,.02)}
.s-start .ghost-btn:hover{border-color:rgba(37,99,235,.3);color:#60a5fa;background:rgba(37,99,235,.06);box-shadow:0 4px 14px rgba(37,99,235,.1)}
.s-start .hamburger-dropdown{background:#1a1d26;border:1px solid rgba(37,99,235,.15)}
.s-start .hamburger-dropdown a{color:#94a3b8}
.s-start .hamburger-dropdown a:hover{background:rgba(37,99,235,.08);color:#60a5fa}
.s-start .dd-greeting{color:#64748b;border-bottom-color:rgba(37,99,235,.1)}
</style>
</head>
<body>

<div class="page-header">
  <div>
    <h1>≡ Hamburger · Typography</h1>
    <p class="sub">Feather 400ms ultra-smooth — 20 variants with stylish Unicode icons</p>
  </div>
</div>

<div class="grid" id="gridFeather"></div>

<div style="margin-top:48px;padding-top:24px;border-top:1px solid rgba(255,255,255,.06)">
  <h2 style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:#60a5fa;margin-bottom:4px">Glide · 350ms · long ease</h2>
  <p class="sub" style="margin-bottom:20px">Same 20 variants — different animation timing</p>
  <div class="grid glide-section" id="gridGlide"></div>
</div>

<script>
// Typography variants: each has a font style + icon set
var variants=[
  // BUNKO (editorial)
  {s:'bunko',label:'Serif · Gold Icons',font:'Playfair Display',items:[
    {icon:'\u25C6',label:'Home',desc:'Serif diamond bullet'},
    {icon:'\u25B8',label:'Studio',desc:'Right-pointing triangle'},
    {icon:'\u25C7',label:'Reports',desc:'Hollow diamond'},
    {icon:'\u25CB',label:'Account',desc:'Circle outline'},
    {icon:'\u00A7',label:'Settings',desc:'Section sign'}
  ]},
  {s:'bunko',label:'Elegant · Numbered',font:'Inter',items:[
    {icon:'\u2160',label:'Home',desc:'Roman numeral I'},
    {icon:'\u2161',label:'Studio',desc:'Roman numeral II'},
    {icon:'\u2162',label:'Reports',desc:'Roman numeral III'},
    {icon:'\u2163',label:'Account',desc:'Roman numeral IV'},
    {icon:'\u2014',label:'Preferences',desc:'Em dash divider'}
  ]},
  {s:'bunko',label:'Classic · Typographic',font:'DM Serif Display',items:[
    {icon:'\u2766',label:'Home',desc:'Floral heart bullet'},
    {icon:'\u2767',label:'Studio',desc:'Rotated floral heart'},
    {icon:'\u2042',label:'Analysis',desc:'Asterism'},
    {icon:'\u00B6',label:'Profile',desc:'Pilcrow'},
    {icon:'\u2039\u203A',label:'More',desc:'Guillemets'}
  ]},
  {s:'bunko',label:'Minimal · Dash',font:'Inter',items:[
    {icon:'\u2013',label:'Home',desc:'En dash'},
    {icon:'\u2013',label:'Studio',desc:'En dash'},
    {icon:'\u2013',label:'Reports',desc:'En dash'},
    {icon:'\u2013',label:'Account',desc:'En dash'},
    {icon:'\u2014',label:'Settings',desc:'Em dash'}
  ]},

  // SHOJI (light minimal)
  {s:'shoji',label:'Light · Geometric',font:'Manrope',items:[
    {icon:'\u25B3',label:'Home',desc:'Triangle'},
    {icon:'\u25A1',label:'Studio',desc:'Square'},
    {icon:'\u25CB',label:'Reports',desc:'Circle'},
    {icon:'\u2606',label:'Account',desc:'Star outline'},
    {icon:'\u2666',label:'Settings',desc:'Diamond suit'}
  ]},
  {s:'shoji',label:'With · Arrow hints',font:'Inter',items:[
    {icon:'\u2192',label:'Home',desc:'Right arrow'},
    {icon:'\u2192',label:'Studio',desc:'Right arrow'},
    {icon:'\u2192',label:'Reports',desc:'Right arrow'},
    {icon:'\u2192',label:'Account',desc:'Right arrow'},
    {icon:'\u2194',label:'Settings',desc:'Both arrows'}
  ]},
  {s:'shoji',label:'Delicate · Punctuation',font:'Manrope',items:[
    {icon:'\u00B7',label:'Home',desc:'Middle dot'},
    {icon:'\u00B7',label:'Studio',desc:'Middle dot'},
    {icon:'\u00B7',label:'Analysis',desc:'Middle dot'},
    {icon:'\u00B7',label:'Profile',desc:'Middle dot'},
    {icon:'\u2234',label:'More',desc:'Therefore'}
  ]},
  {s:'shoji',label:'Clean · Hairline',font:'Inter',items:[
    {icon:'\u2502',label:'Home',desc:'Box drawing light vertical'},
    {icon:'\u2502',label:'Studio',desc:'Box drawing light vertical'},
    {icon:'\u2502',label:'Reports',desc:'Box drawing light vertical'},
    {icon:'\u2514',label:'Account',desc:'Box drawing up+right'},
    {icon:'\u2500',label:'Settings',desc:'Box drawing horizontal'}
  ]},

  // TRADUZIONE (dark green)
  {s:'trad',label:'Tech · Monospace Icons',font:'JetBrains Mono',items:[
    {icon:'\u25B6',label:'Home',desc:'Black right triangle'},
    {icon:'\u25C0',label:'Studio',desc:'Black left triangle'},
    {icon:'\u25B2',label:'Reports',desc:'Black up triangle'},
    {icon:'\u25BC',label:'Account',desc:'Black down triangle'},
    {icon:'\u25AA',label:'Settings',desc:'Black small square'}
  ]},
  {s:'trad',label:'Bold · Block indicators',font:'Work Sans',items:[
    {icon:'\u25A0',label:'Home',desc:'Full square'},
    {icon:'\u25A0',label:'Studio',desc:'Full square'},
    {icon:'\u25A1',label:'Reports',desc:'Empty square'},
    {icon:'\u25CB',label:'Account',desc:'Empty circle'},
    {icon:'\u2299',label:'Settings',desc:'Circled dot'}
  ]},
  {s:'trad',label:'Forward · Angles',font:'Inter',items:[
    {icon:'\u203A',label:'Home',desc:'Single right angle quote'},
    {icon:'\u203A',label:'Studio',desc:'Single right angle quote'},
    {icon:'\u203A',label:'Reports',desc:'Single right angle quote'},
    {icon:'\u203A',label:'Account',desc:'Single right angle quote'},
    {icon:'\u00BB',label:'Settings',desc:'Double right angle quote'}
  ]},
  {s:'trad',label:'Status · Dots',font:'Geist Mono',items:[
    {icon:'\u25CF',label:'Home',desc:'Filled circle — active'},
    {icon:'\u25CF',label:'Studio',desc:'Filled circle — active'},
    {icon:'\u25CB',label:'Reports',desc:'Open circle — inactive'},
    {icon:'\u25CB',label:'Account',desc:'Open circle — inactive'},
    {icon:'\u25D8',label:'Settings',desc:'Inverse bullet'}
  ]},

  // INDEX (dark purple)
  {s:'idx',label:'Professional · Tabs',font:'Inter',items:[
    {icon:'\u2503',label:'Home',desc:'Heavy vertical bar'},
    {icon:'\u2503',label:'Studio',desc:'Heavy vertical bar'},
    {icon:'\u2503',label:'Reports',desc:'Heavy vertical bar'},
    {icon:'\u2503',label:'Account',desc:'Heavy vertical bar'},
    {icon:'\u2551',label:'Settings',desc:'Double vertical bar'}
  ]},
  {s:'idx',label:'Sleek · Hash marks',font:'Inter',items:[
    {icon:'\u0023',label:'Home',desc:'Number sign'},
    {icon:'\u0023',label:'Studio',desc:'Number sign'},
    {icon:'\u0023',label:'Reports',desc:'Number sign'},
    {icon:'\u0023',label:'Account',desc:'Number sign'},
    {icon:'\u266F',label:'Settings',desc:'Music sharp'}
  ]},
  {s:'idx',label:'Modern · Circle outlines',font:'Work Sans',items:[
    {icon:'\u25D0',label:'Home',desc:'Circle left half'},
    {icon:'\u25D1',label:'Studio',desc:'Circle right half'},
    {icon:'\u25D2',label:'Reports',desc:'Circle lower half'},
    {icon:'\u25D3',label:'Account',desc:'Circle upper half'},
    {icon:'\u25CE',label:'Settings',desc:'Bullseye'}
  ]},
  {s:'idx',label:'Bold · Math symbols',font:'Inter',items:[
    {icon:'\u2208',label:'Home',desc:'Element of'},
    {icon:'\u220B',label:'Studio',desc:'Contains as member'},
    {icon:'\u2211',label:'Reports',desc:'N-ary summation'},
    {icon:'\u221E',label:'Account',desc:'Infinity'},
    {icon:'\u2261',label:'Settings',desc:'Identical to'}
  ]},

  // START (dark blue)
  {s:'start',label:'Playful · Cards',font:'Inter',items:[
    {icon:'\u2660',label:'Home',desc:'Spade'},
    {icon:'\u2663',label:'Studio',desc:'Club'},
    {icon:'\u2665',label:'Reports',desc:'Heart'},
    {icon:'\u2666',label:'Account',desc:'Diamond'},
    {icon:'\u2726',label:'Settings',desc:'Four-pointed star'}
  ]},
  {s:'start',label:'Clean · Alphabet',font:'Inter',items:[
    {icon:'H',label:'Home',desc:'Letter H'},
    {icon:'S',label:'Studio',desc:'Letter S'},
    {icon:'R',label:'Reports',desc:'Letter R'},
    {icon:'A',label:'Account',desc:'Letter A'},
    {icon:'\u2730',label:'Settings',desc:'Shadowed star'}
  ]},
  {s:'start',label:'Airy · Zodiac',font:'Manrope',items:[
    {icon:'\u2609',label:'Home',desc:'Sun'},
    {icon:'\u263E',label:'Studio',desc:'Last quarter moon'},
    {icon:'\u2605',label:'Reports',desc:'Black star'},
    {icon:'\u2727',label:'Account',desc:'Four-pointed star white'},
    {icon:'\u262F',label:'Settings',desc:'Yin yang'}
  ]},
  {s:'start',label:'Precise · Corners',font:'Geist Mono',items:[
    {icon:'\u2318',label:'Home',desc:'Place of interest'},
    {icon:'\u2325',label:'Studio',desc:'Option key'},
    {icon:'\u2305',label:'Reports',desc:'Projective'},
    {icon:'\u2316',label:'Account',desc:'Position indicator'},
    {icon:'\u2387',label:'Settings',desc:'Alternative key'}
  ]}
];

var styles={bunko:'s-bunko',shoji:'s-shoji',trad:'s-trad',idx:'s-idx',start:'s-start'};

function makeDD(v){
  var h='<div class="dd-greeting"><div class="dd-avatar" style="background:linear-gradient(135deg,#7c3aed,#a78bfa)">U</div><span style="font-family:\''+v.font+'\',sans-serif">Hello, User</span></div>';
  v.items.forEach(function(it){
    h+='<a href="#" style="font-family:\''+v.font+'\',sans-serif"><span class="dd-icon">'+it.icon+'</span>'+it.label+'</a>';
  });
  h+='<hr><a href="#" style="font-family:\''+v.font+'\',sans-serif"><span class="dd-icon">\u263D</span>Theme</a>';
  return h;
}

var gridF=document.getElementById('gridFeather'),hF='';
variants.forEach(function(v,i){
  var cls=styles[v.s];
  hF+='<div class="card '+cls+'"><div class="card-head"><span class="card-num">#'+(i+1)+'</span><span class="card-label">'+v.label+' · '+v.font+'</span></div>';
  hF+='<div class="card-body"><div class="hamburger-menu"><button class="hamburger-btn ghost-btn" onclick="toggleDD(this)">Menu</button><div class="hamburger-dropdown">'+makeDD(v)+'</div></div><span class="tip">Feather 400ms</span></div></div>';
});
gridF.innerHTML=hF;

var gridG=document.getElementById('gridGlide'),hG='';
variants.forEach(function(v,i){
  var cls=styles[v.s];
  hG+='<div class="card '+cls+'"><div class="card-head"><span class="card-num">#'+(i+1)+'</span><span class="card-label">'+v.label+' · '+v.font+'</span></div>';
  hG+='<div class="card-body"><div class="hamburger-menu"><button class="hamburger-btn ghost-btn" onclick="toggleDD(this)">Menu</button><div class="hamburger-dropdown">'+makeDD(v)+'</div></div><span class="tip">Glide 350ms</span></div></div>';
});
gridG.innerHTML=hG;

function toggleDD(btn){
  var dd=btn.parentElement.querySelector('.hamburger-dropdown');
  if(dd.classList.contains('open')){dd.classList.remove('open');dd.classList.add('closing');setTimeout(function(){dd.classList.remove('closing')},300)}
  else{document.querySelectorAll('.hamburger-dropdown.open').forEach(function(d){d.classList.remove('open');d.classList.add('closing');setTimeout(function(){d.classList.remove('closing')},300)});dd.classList.add('open')}
}
document.addEventListener('click',function(e){if(!e.target.closest('.hamburger-menu')){document.querySelectorAll('.hamburger-dropdown.open').forEach(function(d){d.classList.remove('open');d.classList.add('closing');setTimeout(function(){d.classList.remove('closing')},300)})}});
</script>
</body>
</html>
