<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sottotitoli · Hamburger Mockups v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Geist+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e8eaed;padding:24px;-webkit-font-smoothing:antialiased}

/* ═══ HEADER ═══ */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.page-header h1{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;color:#34d399;margin-bottom:2px}
.page-header .sub{font-size:13px;color:#71717a}
.header-actions{display:flex;gap:8px;align-items:center}
.btn-action{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:rgba(255,255,255,.6);cursor:pointer;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap}
.btn-action:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}
.btn-action.copied{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.25);color:#34d399}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;font-size:11px;color:#71717a}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ═══ GRID ═══ */
.section-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;margin:36px 0 16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}
.section-title .count{font-family:'JetBrains Mono',monospace;font-size:11px;color:#52525b;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:20px}
.card{background:#0c1118;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:visible;position:relative;min-height:360px;transition:all .3s}
.card.deleted{opacity:.3;pointer-events:none;filter:grayscale(1)}
.card-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04)}
.card-info{display:flex;align-items:center;gap:10px}
.card-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:#52525b}
.card-label{font-size:11px;font-weight:600;color:#71717a;text-transform:uppercase;letter-spacing:.5px}
.card-actions{display:flex;gap:4px}
.card-actions button{width:26px;height:26px;border-radius:6px;border:1px solid transparent;background:transparent;color:#52525b;cursor:pointer;font-size:13px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.card-actions button:hover{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.1)}
.card-actions button.fav-btn.faved{color:#fbbf24;border-color:rgba(251,191,36,.2);background:rgba(251,191,36,.08)}
.card-actions button.del-btn:hover{color:#f87171;border-color:rgba(248,113,113,.2);background:rgba(248,113,113,.06)}
.card-body{padding:32px 20px 48px;display:flex;align-items:flex-start;justify-content:flex-end;position:relative;min-height:280px}

/* ═══ HAMBURGER ═══ */
.hamburger-menu{position:relative;display:inline-block;z-index:5}
.hamburger-btn{cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;border:none;background:none;padding:0;user-select:none}
.hamburger-dropdown{position:absolute;top:100%;right:0;margin-top:8px;z-index:20;min-width:200px;border-radius:10px;padding:6px;display:none;flex-direction:column}
.hamburger-dropdown.open{display:flex}
.hamburger-dropdown a{font-size:12px;font-weight:500;padding:9px 14px;border-radius:7px;text-decoration:none;transition:all .15s;display:block;cursor:pointer}
.hamburger-dropdown hr{border:none;border-top:1px solid;margin:4px 0}
.dd-greeting{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;margin-bottom:4px;border-bottom:1px solid}
.dd-avatar{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}

/* ═══ GHOST BTN → CIRCLE responsive ═══ */
.ghost-btn{height:36px;padding:0 16px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ghost-btn::before{content:'☰';font-size:14px}
@media(max-width:600px){
  .ghost-btn{width:38px;height:38px;padding:0;border-radius:50%;font-size:0;gap:0}
  .ghost-btn::before{font-size:17px}
  .grid{grid-template-columns:1fr}
  .card-body{min-height:240px}
}

/* ═══ 10 ANIMATIONS ═══ */
@keyframes ddFadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes ddSlideDown{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:translateY(0)}}
@keyframes ddScaleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes ddSlideRight{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}
@keyframes ddBlurIn{from{opacity:0;filter:blur(12px);transform:translateY(-4px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes ddRotateIn{from{opacity:0;transform:rotate(-8deg) scale(.9)}to{opacity:1;transform:rotate(0) scale(1)}}
@keyframes ddBounceIn{0%{opacity:0;transform:scale(.7)}50%{transform:scale(1.06)}75%{transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
@keyframes ddFlipIn{0%{opacity:0;transform:perspective(500px) rotateX(-25deg)}100%{opacity:1;transform:perspective(500px) rotateX(0)}}
@keyframes ddElasticIn{0%{opacity:0;transform:scale(.5)}55%{transform:scale(1.12)}75%{transform:scale(.93)}100%{opacity:1;transform:scale(1)}}
@keyframes ddSwingIn{0%{opacity:0;transform:rotate(-12deg);transform-origin:top right}60%{transform:rotate(3deg)}100%{opacity:1;transform:rotate(0)}}

.anim-fade .hamburger-dropdown.open{animation:ddFadeIn .22s ease-out}
.anim-slide .hamburger-dropdown.open{animation:ddSlideDown .28s cubic-bezier(.4,0,.2,1)}
.anim-scale .hamburger-dropdown.open{animation:ddScaleIn .26s ease-out}
.anim-slideR .hamburger-dropdown.open{animation:ddSlideRight .28s ease-out}
.anim-blur .hamburger-dropdown.open{animation:ddBlurIn .3s ease-out}
.anim-rotate .hamburger-dropdown.open{animation:ddRotateIn .3s ease-out}
.anim-bounce .hamburger-dropdown.open{animation:ddBounceIn .36s ease-out}
.anim-flip .hamburger-dropdown.open{animation:ddFlipIn .3s ease-out}
.anim-elastic .hamburger-dropdown.open{animation:ddElasticIn .45s ease-out}
.anim-swing .hamburger-dropdown.open{animation:ddSwingIn .35s ease-out}

/* ═══ STYLE: BUNKO — Editorial Dark, gold #c9a84c ═══ */
.style-bunko .card{background:#12121a;border-color:#1a1c24}
.style-bunko .ghost-btn{border:1px solid rgba(201,168,76,.2);color:#c9a84c;font-family:'Inter',sans-serif;background:transparent}
.style-bunko .ghost-btn:hover{border-color:rgba(201,168,76,.4);background:rgba(201,168,76,.06)}
.style-bunko .hamburger-dropdown{background:#1a1a24;border:1px solid #2a2a38}
.style-bunko .hamburger-dropdown a{color:#b5ad9e;font-family:'Inter',sans-serif}
.style-bunko .hamburger-dropdown a:hover{background:rgba(201,168,76,.08);color:#c9a84c}
.style-bunko .dd-greeting{color:#8b8b8b;border-bottom-color:#2a2a38}
.style-bunko .btn-lines span{background:#c9a84c}

/* ═══ STYLE: SHOJI — Light, Inter+Manrope ═══ */
.style-shoji .card{background:#fafafa;border-color:#e5e5e5}
.style-shoji .card-head{border-bottom-color:#e5e5e5}
.style-shoji .card-num,.style-shoji .card-label{color:#a1a1aa}
.style-shoji .ghost-btn{border:1px solid #d4d4d8;color:#71717a;font-family:'Manrope',sans-serif;font-weight:400;background:#fff}
.style-shoji .ghost-btn:hover{border-color:#a1a1aa;color:#52525b;background:#f9f9f9}
.style-shoji .hamburger-dropdown{background:#fff;border:1px solid #e5e5e5;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.style-shoji .hamburger-dropdown a{color:#52525b;font-family:'Manrope',sans-serif;font-weight:400}
.style-shoji .hamburger-dropdown a:hover{background:#f5f5f5;color:#18181b}
.style-shoji .dd-greeting{color:#a1a1aa;border-bottom-color:#e5e5e5}
.style-shoji .card-actions button{color:#a1a1aa}

/* ═══ STYLE: TRADUZIONE — Dark Green #34d399 ═══ */
.style-trad .card{background:#0c1118}
.style-trad .ghost-btn{border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);font-family:'Work Sans',sans-serif;font-weight:500;background:rgba(255,255,255,.02)}
.style-trad .ghost-btn:hover{border-color:rgba(52,211,153,.3);color:#6ee7b7;background:rgba(52,211,153,.04)}
.style-trad .hamburger-dropdown{background:#161e28;border:1px solid rgba(255,255,255,.08)}
.style-trad .hamburger-dropdown a{color:#d4d4d8;font-family:'Work Sans',sans-serif}
.style-trad .hamburger-dropdown a:hover{background:rgba(52,211,153,.06);color:#6ee7b7}
.style-trad .dd-greeting{color:rgba(255,255,255,.45);border-bottom-color:rgba(255,255,255,.06)}

/* ═══ STYLE: INDEX — Dark Purple #a78bfa ═══ */
.style-idx .card{background:#0f1117}
.style-idx .ghost-btn{border:1px solid #2f333e;color:rgba(255,255,255,.5);font-family:'Inter',sans-serif;font-weight:600;background:rgba(255,255,255,.02)}
.style-idx .ghost-btn:hover{border-color:rgba(167,139,250,.3);color:#a78bfa;background:rgba(167,139,250,.04)}
.style-idx .hamburger-dropdown{background:#1a1d26;border:1px solid #2f333e}
.style-idx .hamburger-dropdown a{color:#9ca3af;font-family:'Inter',sans-serif}
.style-idx .hamburger-dropdown a:hover{background:rgba(167,139,250,.08);color:#a78bfa}
.style-idx .dd-greeting{color:#6b7280;border-bottom-color:#2f333e}

/* ═══ STYLE: START — Dark Blue #60a5fa ═══ */
.style-start .card{background:#0f1117}
.style-start .ghost-btn{border:1px solid rgba(37,99,235,.15);color:rgba(255,255,255,.4);font-family:'Inter',sans-serif;font-weight:500;background:rgba(255,255,255,.02)}
.style-start .ghost-btn:hover{border-color:rgba(37,99,235,.3);color:#60a5fa;background:rgba(37,99,235,.06)}
.style-start .hamburger-dropdown{background:#1a1d26;border:1px solid rgba(37,99,235,.15)}
.style-start .hamburger-dropdown a{color:#94a3b8;font-family:'Inter',sans-serif}
.style-start .hamburger-dropdown a:hover{background:rgba(37,99,235,.08);color:#60a5fa}
.style-start .dd-greeting{color:#64748b;border-bottom-color:rgba(37,99,235,.1)}
</style>
</head>
<body>

<div class="page-header">
  <div>
    <h1>≡ Hamburger Menus</h1>
    <p class="sub">Ghost Button → Circle · 5 styles × 10 animations = 50 variants</p>
  </div>
  <div class="header-actions">
    <button class="btn-action" onclick="copyFavorites()" id="copyFavBtn">📋 Copy favorites</button>
    <button class="btn-action" onclick="resetAll()">🔄 Reset all</button>
  </div>
</div>

<div class="legend">
  <span><span class="dot" style="background:#c9a84c"></span>Caption Bunko</span>
  <span><span class="dot" style="background:#e5e5e5;border:1px solid #d4d4d8"></span>Caption Shoji</span>
  <span><span class="dot" style="background:#34d399"></span>Traduzione</span>
  <span><span class="dot" style="background:#a78bfa"></span>Index</span>
  <span><span class="dot" style="background:#60a5fa"></span>Start</span>
</div>

<div id="mockupGrid"></div>

<script>
var animations=[
  {id:'fade',name:'Fade In'},
  {id:'slide',name:'Slide Down'},
  {id:'scale',name:'Scale In'},
  {id:'slideR',name:'Slide Right'},
  {id:'blur',name:'Blur In'},
  {id:'rotate',name:'Rotate In'},
  {id:'bounce',name:'Bounce In'},
  {id:'flip',name:'Flip In'},
  {id:'elastic',name:'Elastic In'},
  {id:'swing',name:'Swing In'}
];

var styles=[
  {id:'bunko',name:'Caption · Bunko (i1)',cls:'style-bunko',accent:'#c9a84c'},
  {id:'shoji',name:'Caption · Shoji (j7b)',cls:'style-shoji',accent:'#71717a'},
  {id:'trad',name:'Traduzione',cls:'style-trad',accent:'#34d399'},
  {id:'idx',name:'Index',cls:'style-idx',accent:'#a78bfa'},
  {id:'start',name:'Start',cls:'style-start',accent:'#60a5fa'}
];

var favorites=JSON.parse(localStorage.getItem('hb-favorites')||'[]');
var deleted=JSON.parse(localStorage.getItem('hb-deleted')||'[]');

function isFav(styleId,animId){return favorites.indexOf(styleId+':'+animId)!==-1}
function isDel(styleId,animId){return deleted.indexOf(styleId+':'+animId)!==-1}

function makeDD(greeting){
  var h='';
  if(greeting){
    h+='<div class="dd-greeting"><div class="dd-avatar" style="background:linear-gradient(135deg,#7c3aed,#a78bfa)">U</div><span>Hello, User</span></div>';
  }
  h+='<a href="#">🏠 Home</a><a href="#">🎙 Studio</a><a href="#">📊 AI Reports</a><a href="#">👤 Account</a>';
  if(greeting) h+='<hr><a href="#">🌙 Toggle theme</a>';
  return h;
}

function renderAll(){
  var grid=document.getElementById('mockupGrid');
  var h='',num=1;
  styles.forEach(function(st){
    var favCount=animations.filter(function(a){return isFav(st.id,a.id)}).length;
    h+='<div class="section-title" style="color:'+st.accent+'">'+st.name+'<span class="count">'+animations.length+' variants'+(favCount>0?' · ★'+favCount:'')+'</span></div>';
    h+='<div class="grid">';
    animations.forEach(function(anim){
      var key=st.id+':'+anim.id;
      var deletedCls=isDel(st.id,anim.id)?' deleted':'';
      var greeting=num%3===0;
      h+='<div class="card '+st.cls+' anim-'+anim.id+' '+deletedCls+'" data-key="'+key+'">';
      h+='<div class="card-head">';
      h+='<div class="card-info"><span class="card-num">#'+num+'</span><span class="card-label">'+anim.name+'</span></div>';
      h+='<div class="card-actions">';
      h+='<button class="fav-btn'+(isFav(st.id,anim.id)?' faved':'')+'" onclick="toggleFav(\''+st.id+'\',\''+anim.id+'\',this)" title="Favorite">'+(isFav(st.id,anim.id)?'★':'☆')+'</button>';
      h+='<button class="del-btn" onclick="deleteCard(\''+st.id+'\',\''+anim.id+'\',this)" title="Delete">✕</button>';
      h+='</div></div>';
      h+='<div class="card-body"><div class="hamburger-menu">';
      h+='<button class="hamburger-btn ghost-btn" onclick="toggleDD(this)">Menu</button>';
      h+='<div class="hamburger-dropdown">'+makeDD(greeting)+'</div>';
      h+='</div></div></div>';
      num++;
    });
    h+='</div>';
  });
  grid.innerHTML=h;
}

function toggleDD(btn){
  var dd=btn.parentElement.querySelector('.hamburger-dropdown');
  var wasOpen=dd.classList.contains('open');
  document.querySelectorAll('.hamburger-dropdown.open').forEach(function(d){d.classList.remove('open')});
  if(!wasOpen) dd.classList.add('open');
}

document.addEventListener('click',function(e){
  if(!e.target.closest('.hamburger-menu')){
    document.querySelectorAll('.hamburger-dropdown.open').forEach(function(d){d.classList.remove('open')});
  }
});

function toggleFav(styleId,animId,btn){
  var key=styleId+':'+animId;
  var idx=favorites.indexOf(key);
  if(idx===-1){favorites.push(key);btn.classList.add('faved');btn.textContent='★'}
  else{favorites.splice(idx,1);btn.classList.remove('faved');btn.textContent='☆'}
  localStorage.setItem('hb-favorites',JSON.stringify(favorites));
  // Update section count
  setTimeout(renderAll,100);
}

function deleteCard(styleId,animId,btn){
  var key=styleId+':'+animId;
  if(deleted.indexOf(key)===-1) deleted.push(key);
  localStorage.setItem('hb-deleted',JSON.stringify(deleted));
  var card=btn.closest('.card');
  if(card) card.classList.add('deleted');
}

function resetAll(){
  favorites=[];deleted=[];
  localStorage.removeItem('hb-favorites');
  localStorage.removeItem('hb-deleted');
  renderAll();
}

function copyFavorites(){
  if(favorites.length===0){alert('No favorites selected. Click ☆ to add.');return}
  var list=favorites.map(function(k){
    var parts=k.split(':');
    var st=styles.find(function(s){return s.id===parts[0]});
    var an=animations.find(function(a){return a.id===parts[1]});
    return (st?st.name:'')+' · '+(an?an.name:'');
  }).join('\n');
  navigator.clipboard.writeText('Hamburger Favorites:\n'+list).then(function(){
    var btn=document.getElementById('copyFavBtn');
    btn.textContent='✓ Copied!';
    btn.classList.add('copied');
    setTimeout(function(){btn.textContent='📋 Copy favorites';btn.classList.remove('copied')},2000);
  });
}

renderAll();
</script>
</body>
</html>
