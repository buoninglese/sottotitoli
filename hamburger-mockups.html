<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sottotitoli · Hamburger Menu Mockups (50)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0f14;color:#e8eaed;padding:20px;-webkit-font-smoothing:antialiased}
h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:#34d399;margin-bottom:4px}
.sub{font-size:13px;color:#71717a;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:#0c1118;border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden;position:relative}
.card-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04)}
.card-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:#52525b}
.card-label{font-size:11px;font-weight:600;color:#71717a;text-transform:uppercase;letter-spacing:.5px}
.card-body{min-height:200px;display:flex;align-items:flex-start;justify-content:flex-end;padding:20px 16px;position:relative}
.card-body.center-all{align-items:center;justify-content:center}

/* ═══ HAMBURGER BASE STYLES ═══ */
.hamburger-menu{position:relative;display:inline-block}
.hamburger-btn{cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;border:none;background:none;padding:0}
.hamburger-dropdown{position:absolute;top:100%;right:0;margin-top:6px;z-index:10;min-width:180px;border-radius:8px;padding:6px;display:none;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.card-body:hover .hamburger-dropdown,.hamburger-dropdown.open{display:flex}
.hamburger-dropdown a,.hamburger-dropdown .dd-item{font-size:12px;font-weight:500;padding:8px 12px;border-radius:6px;text-decoration:none;transition:all .15s;display:block}
.hamburger-dropdown hr{border:none;border-top:1px solid;margin:4px 0}
.dd-greeting{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;margin-bottom:4px}
.dd-avatar{width:24px;height:24px;border-radius:50%;flex-shrink:0}

/* ═══ VARIANT 1 — Classic Dark ☰ */
.v1 .hamburger-btn{width:36px;height:36px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);font-size:16px}
.v1 .hamburger-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.v1 .hamburger-dropdown{background:#161e28;border:1px solid rgba(255,255,255,.08)}
.v1 .hamburger-dropdown a{color:#d4d4d8}
.v1 .hamburger-dropdown a:hover{background:rgba(255,255,255,.06);color:#fff}
.v1 .hamburger-dropdown hr{border-color:rgba(255,255,255,.06)}
.v1 .dd-greeting{color:rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.06)}

/* ═══ VARIANT 2 — Pill Soft */
.v2 .hamburger-btn{width:40px;height:40px;border-radius:100px;border:1.5px solid rgba(255,255,255,.1);background:transparent;color:rgba(255,255,255,.6);font-size:18px;font-weight:300}
.v2 .hamburger-btn:hover{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.2)}
.v2 .hamburger-dropdown{background:rgba(20,24,32,.96);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:14px}
.v2 .hamburger-dropdown a{font-family:'Manrope',sans-serif;font-weight:400;color:#a1a1aa}
.v2 .hamburger-dropdown a:hover{background:rgba(255,255,255,.04);color:#fafafa}

/* ═══ VARIANT 3 — Three Dots ⋮ */
.v3 .hamburger-btn{width:32px;height:32px;border-radius:50%;background:transparent;color:rgba(255,255,255,.4);font-size:20px;letter-spacing:2px}
.v3 .hamburger-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.v3 .hamburger-dropdown{background:#1a1a2e;border:1px solid #2a2a4e;border-radius:12px}
.v3 .hamburger-dropdown a{color:#c4c8d0;font-size:11px}
.v3 .hamburger-dropdown a:hover{background:rgba(99,102,241,.1);color:#a5b4fc}

/* ═══ VARIANT 4 — Minimal Line */
.v4 .hamburger-btn{width:28px;height:20px;display:flex;flex-direction:column;gap:5px;background:none;border:none}
.v4 .hamburger-btn span{display:block;width:100%;height:2px;background:rgba(255,255,255,.6);border-radius:1px;transition:all .2s}
.v4 .hamburger-btn:hover span{background:#fff}
.v4 .hamburger-dropdown{background:#fff;border:1px solid #e5e7eb;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.v4 .hamburger-dropdown a{color:#374151;font-weight:500}
.v4 .hamburger-dropdown a:hover{background:#f3f4f6;color:#111827}

/* ═══ VARIANT 5 — Accent Glow */
.v5 .hamburger-btn{width:38px;height:38px;border-radius:50%;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);color:#34d399;font-size:18px}
.v5 .hamburger-btn:hover{box-shadow:0 0 20px rgba(52,211,153,.2)}
.v5 .hamburger-dropdown{background:#0a0f14;border:1px solid rgba(52,211,153,.15);border-radius:12px}
.v5 .hamburger-dropdown a{color:rgba(255,255,255,.6)}
.v5 .hamburger-dropdown a:hover{background:rgba(52,211,153,.06);color:#6ee7b7}

/* ═══ VARIANT 6 — Ghost Icon */
.v6 .hamburger-btn{width:44px;height:44px;border-radius:8px;background:transparent;color:rgba(255,255,255,.3);font-size:22px}
.v6 .hamburger-btn:hover{color:#fff}
.v6 .hamburger-dropdown{background:#0d1117;border:1px solid #21262d;border-radius:8px;min-width:200px}
.v6 .hamburger-dropdown a{font-family:'JetBrains Mono',monospace;font-size:10px;color:#8b949e}
.v6 .hamburger-dropdown a:hover{background:#161b22;color:#c9d1d9}

/* ═══ VARIANT 7 — Frosted Glass */
.v7 .hamburger-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.04);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.7);font-size:16px}
.v7 .hamburger-dropdown{background:rgba(15,18,25,.92);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);border-radius:16px}
.v7 .hamburger-dropdown a{font-weight:400;color:#a1a1aa}

/* ═══ VARIANT 8 — Brutalist Black */
.v8 .hamburger-btn{width:40px;height:40px;border-radius:0;background:#000;border:2px solid #fff;color:#fff;font-size:18px;font-weight:900}
.v8 .hamburger-dropdown{background:#000;border:2px solid #fff;border-radius:0}
.v8 .hamburger-dropdown a{color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.v8 .hamburger-dropdown a:hover{background:#fff;color:#000}

/* ═══ VARIANT 9 — Slide from Right */
.v9 .hamburger-btn{width:40px;height:40px;border-radius:8px;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.2);color:#f97316}
.v9 .hamburger-dropdown{background:#1c1917;border:1px solid rgba(249,115,22,.15);border-radius:0 0 12px 12px;right:-8px}
.v9 .hamburger-dropdown a{color:#d6d3d1}
.v9 .hamburger-dropdown a:hover{background:rgba(249,115,22,.08);color:#fb923c}

/* ═══ VARIANT 10 — Light Minimal */
.v10 .hamburger-btn{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.08);color:rgba(0,0,0,.5);font-size:16px}
.v10 .hamburger-dropdown{background:#fff;border:1px solid #e5e7eb;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.v10 .hamburger-dropdown a{color:#374151}
.v10 .hamburger-dropdown a:hover{background:#f9fafb;color:#111827}
.v10 .dd-greeting{color:#6b7280;border-bottom-color:#f3f4f6}

/* ═══ VARIANT 11 — Navy Professional */
.v11 .hamburger-btn{width:36px;height:36px;border-radius:6px;background:#1e3a5f;border:none;color:#93c5fd;font-size:15px}
.v11 .hamburger-dropdown{background:#0f2440;border:1px solid #1e3a5f;border-radius:8px}
.v11 .hamburger-dropdown a{font-family:'Work Sans',sans-serif;color:#94a3b8}
.v11 .hamburger-dropdown a:hover{background:#1e3a5f;color:#e2e8f0}

/* ═══ VARIANT 12 — Neon Pop */
.v12 .hamburger-btn{width:38px;height:38px;border-radius:50%;background:#000;border:2px solid #ff00ff;color:#ff00ff;font-size:18px;text-shadow:0 0 10px #ff00ff}
.v12 .hamburger-dropdown{background:#0a0a0a;border:1px solid #ff00ff44;border-radius:12px}
.v12 .hamburger-dropdown a{color:#ccc;font-family:'Geist Mono',monospace}
.v12 .hamburger-dropdown a:hover{background:rgba(255,0,255,.1);color:#ff00ff}

/* ═══ VARIANT 13 — Elegant Serif */
.v13 .hamburger-btn{width:44px;height:32px;border-radius:4px;background:transparent;border:1px solid #c9a84c;color:#c9a84c;font-family:'Playfair Display',serif;font-size:20px}
.v13 .hamburger-dropdown{background:#1a1a1a;border:1px solid #c9a84c33;border-radius:4px}
.v13 .hamburger-dropdown a{font-family:'Playfair Display',serif;color:#b5ad9e}
.v13 .hamburger-dropdown a:hover{background:rgba(201,168,76,.08);color:#c9a84c}

/* ═══ VARIANT 14 — Compact Chip */
.v14 .hamburger-btn{height:28px;padding:0 10px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:11px;font-weight:600;gap:4px;display:flex;align-items:center}
.v14 .hamburger-dropdown{background:#1a1d26;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:4px}
.v14 .hamburger-dropdown a{font-size:11px;padding:6px 10px;border-radius:10px}

/* ═══ VARIANT 15 — Bordered Square */
.v15 .hamburger-btn{width:40px;height:40px;border-radius:4px;background:#fff;border:1px solid #d4d4d8;color:#52525b}
.v15 .hamburger-dropdown{background:#fff;border:1px solid #e5e7eb;border-radius:4px;box-shadow:0 2px 16px rgba(0,0,0,.06)}

/* ═══ VARIANT 16 — Dark Academia */
.v16 .hamburger-btn{width:38px;height:38px;border-radius:2px;background:#3e2c1c;border:1px solid #5c4a3a;color:#d4b896;font-size:16px}
.v16 .hamburger-dropdown{background:#2c1f14;border:1px solid #5c4a3a;border-radius:2px}
.v16 .hamburger-dropdown a{font-family:'Playfair Display',serif;color:#b8a088}

/* ═══ VARIANT 17 — Gradient Border */
.v17 .hamburger-btn{width:38px;height:38px;border-radius:50%;background:transparent;border:2px solid transparent;background-clip:padding-box;position:relative;color:#fff;font-size:16px}
.v17 .hamburger-btn::before{content:'';position:absolute;inset:-2px;border-radius:50%;background:linear-gradient(135deg,#34d399,#3b82f6,#8b5cf6);z-index:-1}
.v17 .hamburger-dropdown{background:#0f1219;border:1px solid rgba(255,255,255,.08)}

/* ═══ VARIANT 18 — Soft Shadow */
.v18 .hamburger-btn{width:40px;height:40px;border-radius:12px;background:#fff;border:none;color:#1a1a1a;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:16px}
.v18 .hamburger-dropdown{background:#fff;border:none;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.12)}
.v18 .hamburger-dropdown a{color:#444}

/* ═══ VARIANT 19 — Cyberpunk */
.v19 .hamburger-btn{width:36px;height:36px;clip-path:polygon(0 0,85% 0,100% 15%,100% 100%,15% 100%,0 85%);background:#00ff8855;border:1px solid #00ff88;color:#00ff88}
.v19 .hamburger-dropdown{background:#001a0a;border:1px solid #00ff8833;clip-path:polygon(0 8px,8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}

/* ═══ VARIANT 20 — Mobile Bottom Sheet */
.v20 .hamburger-btn{width:48px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);border:none}
.v20 .hamburger-dropdown{position:fixed;bottom:0;left:0;right:0;top:auto;margin:0;border-radius:20px 20px 0 0;background:#1a1d26;min-width:100%}

/* ═══ VARIANT 21 — Bebas Bold */
.v21 .hamburger-btn{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;width:auto;height:auto;padding:4px 8px;background:none;border:none;color:#34d399}
.v21 .hamburger-dropdown a{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;font-size:14px}

/* ═══ VARIANT 22 — Monospace Tech */
.v22 .hamburger-btn{font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 12px;border-radius:4px;background:#1e1e2e;border:1px solid #31315a;color:#cdd6f4}
.v22 .hamburger-dropdown{background:#1e1e2e;border:1px solid #31315a}
.v22 .hamburger-dropdown a{font-family:'JetBrains Mono',monospace;font-size:10px;color:#a6adc8}

/* ═══ VARIANT 23 — Toolbar Icon */
.v23 .hamburger-btn{width:32px;height:32px;border-radius:4px;background:transparent;color:rgba(255,255,255,.35);font-size:14px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center}
.v23 .hamburger-btn span{width:16px;height:1.5px;background:currentColor;border-radius:1px}
.v23 .hamburger-dropdown{background:#1e1e24;border:1px solid #2e2e38}

/* ═══ VARIANT 24 — Ring Indicator */
.v24 .hamburger-btn{width:40px;height:40px;border-radius:50%;background:rgba(52,211,153,.06);border:2px solid rgba(52,211,153,.15);color:#34d399;position:relative}
.v24 .hamburger-btn::after{content:'';position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}

/* ═══ VARIANT 25 — Inline Text */
.v25 .hamburger-btn{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:rgba(255,255,255,.5);padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:transparent;display:flex;align-items:center;gap:6px}
.v25 .hamburger-btn::before{content:'☰';font-size:16px}

/* ═══ VARIANT 26 — Fullscreen Overlay */
.v26 .hamburger-btn{width:40px;height:40px;border-radius:8px;background:#7c3aed;border:none;color:#fff}
.v26 .hamburger-dropdown{position:fixed;inset:0;margin:0;border-radius:0;background:rgba(0,0,0,.95);align-items:center;justify-content:center;gap:16px}
.v26 .hamburger-dropdown a{font-size:24px;color:#fff;text-align:center}

/* ═══ VARIANT 27 — Underline Animation */
.v27 .hamburger-btn{font-size:14px;font-weight:600;color:rgba(255,255,255,.7);padding:6px 0;background:none;border:none;border-bottom:2px solid transparent;transition:all .3s}
.v27 .hamburger-btn:hover{border-bottom-color:#34d399}
.v27 .hamburger-dropdown{background:#161e28}
.v27 .hamburger-dropdown a{border-left:2px solid transparent}
.v27 .hamburger-dropdown a:hover{border-left-color:#34d399;background:rgba(52,211,153,.04)}

/* ═══ VARIANT 28 — Vertical Text */
.v28 .hamburger-btn{writing-mode:vertical-rl;text-orientation:mixed;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.3);padding:8px 4px;background:none;border:none}
.v28 .hamburger-dropdown{right:100%;top:0;margin-right:8px;margin-top:0}

/* ═══ VARIANT 29 — Floating Action */
.v29 .hamburger-btn{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:#34d399;border:none;color:#000;font-size:20px;box-shadow:0 4px 24px rgba(52,211,153,.3)}
.v29 .hamburger-dropdown{position:fixed;bottom:90px;right:24px;top:auto}

/* ═══ VARIANT 30 — Segmented Control */
.v30 .hamburger-btn{font-size:12px;font-weight:600;padding:6px 14px;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
.v30 .hamburger-dropdown{border-radius:6px;padding:4px;gap:2px}
.v30 .hamburger-dropdown a{border-radius:4px;font-size:11px}

/* ═══ VARIANT 31 — Side Tab */
.v31 .hamburger-btn{position:fixed;right:0;top:50%;transform:translateY(-50%);width:32px;height:80px;border-radius:8px 0 0 8px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.15);border-right:none;color:#34d399;writing-mode:vertical-rl;font-size:10px;letter-spacing:2px}

/* ═══ VARIANT 32 — Diamond Shape */
.v32 .hamburger-btn{width:36px;height:36px;transform:rotate(45deg);background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.2);color:#a855f7}
.v32 .hamburger-btn span{transform:rotate(-45deg);display:block}

/* ═══ VARIANT 33 — Notebook Paper */
.v33 .hamburger-btn{width:36px;height:36px;background:linear-gradient(to bottom,transparent 0,transparent 4px,rgba(255,255,255,.1) 4px,rgba(255,255,255,.1) 5px,transparent 5px,transparent 9px,rgba(255,255,255,.1) 9px,rgba(255,255,255,.1) 10px,transparent 10px,transparent 14px,rgba(255,255,255,.1) 14px,rgba(255,255,255,.1) 15px);border:1px solid rgba(255,255,255,.1);border-radius:2px}
.v33 .hamburger-dropdown{background:#fef3c7;border:1px solid #d9770633}
.v33 .hamburger-dropdown a{color:#78350f;font-family:'Georgia',serif}

/* ═══ VARIANT 34 — Pixel Art */
.v34 .hamburger-btn{font-family:'Geist Mono',monospace;font-size:20px;color:#34d399;background:#000;border:2px solid #34d399;width:40px;height:40px;image-rendering:pixelated}
.v34 .hamburger-dropdown{background:#000;border:2px solid #34d399;border-radius:0}
.v34 .hamburger-dropdown a{font-family:'Geist Mono',monospace;color:#34d399}

/* ═══ VARIANT 35 — Magazine */
.v35 .hamburger-btn{font-family:'Playfair Display',serif;font-style:italic;font-size:24px;color:#1a1a1a;background:#fff;border:none;width:44px;height:44px;border-radius:50%}
.v35 .hamburger-dropdown{background:#fff;border:1px solid #e5e5e5}
.v35 .hamburger-dropdown a{font-family:'Playfair Display',serif;color:#1a1a1a}

/* ═══ VARIANT 36 — Terminal */
.v36 .hamburger-btn{font-family:'JetBrains Mono',monospace;font-size:11px;color:#00ff00;background:#000;border:1px solid #00ff0033;padding:6px 10px;border-radius:0}
.v36 .hamburger-btn::before{content:'$ '}
.v36 .hamburger-dropdown{background:#000;border:1px solid #00ff0033;border-radius:0}
.v36 .hamburger-dropdown a{font-family:'JetBrains Mono',monospace;font-size:10px;color:#00ff00}
.v36 .hamburger-dropdown a::before{content:'> '}

/* ═══ VARIANT 37 — Kanban Card */
.v37 .hamburger-btn{width:100%;padding:8px 12px;border-radius:6px;background:#1e293b;border:1px solid #334155;color:#94a3b8;font-size:12px;justify-content:flex-start}
.v37 .hamburger-dropdown{width:100%;position:static;margin-top:4px;box-shadow:none}

/* ═══ VARIANT 38 — Split Button */
.v38 .hamburger-btn{display:flex;gap:0}
.v38 .hamburger-btn .main{width:36px;height:36px;border-radius:6px 0 0 6px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.2);color:#34d399;font-size:14px}
.v38 .hamburger-btn .caret{width:20px;height:36px;border-radius:0 6px 6px 0;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.2);border-left:none;color:#34d399;font-size:8px}

/* ═══ VARIANT 39 — Dashboard Card */
.v39 .hamburger-btn{width:100%;padding:14px 16px;border-radius:10px;background:linear-gradient(135deg,rgba(52,211,153,.06),rgba(59,130,246,.03));border:1px solid rgba(52,211,153,.1);justify-content:space-between}
.v39 .hamburger-btn .label{font-size:13px;font-weight:600;color:#e8eaed}
.v39 .hamburger-dropdown{width:100%;position:static;margin-top:6px}

/* ═══ VARIANT 40 — Apple Style */
.v40 .hamburger-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:0.5px solid rgba(255,255,255,.1);color:rgba(255,255,255,.8);font-size:14px}
.v40 .hamburger-dropdown{background:rgba(30,30,35,.95);backdrop-filter:blur(40px);border:0.5px solid rgba(255,255,255,.08);border-radius:14px}
.v40 .hamburger-dropdown a{font-weight:400;font-size:13px;color:rgba(255,255,255,.8)}
.v40 .hamburger-dropdown a:hover{background:rgba(255,255,255,.06)}

/* ═══ VARIANT 41 — Tag Pill */
.v41 .hamburger-btn{padding:4px 14px;border-radius:100px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.15);color:#60a5fa;font-size:11px;font-weight:600}
.v41 .hamburger-dropdown a{border-radius:100px}

/* ═══ VARIANT 42 — Hand-drawn */
.v42 .hamburger-btn{width:40px;height:40px;border-radius:40% 60% 50% 50%;background:#fef3c7;border:2px solid #92400e;color:#78350f;font-family:'Georgia',serif;font-size:18px;transform:rotate(-3deg)}
.v42 .hamburger-dropdown{background:#fffbeb;border:2px solid #92400e;border-radius:8px;transform:rotate(-1deg)}

/* ═══ VARIANT 43 — Neon Sign */
.v43 .hamburger-btn{font-size:14px;font-weight:700;color:#fff;text-shadow:0 0 7px #fff,0 0 10px #fff,0 0 21px #fff,0 0 42px #0fa,0 0 82px #0fa;background:transparent;border:none}

/* ═══ VARIANT 44 — Notebook Margin */
.v44 .hamburger-btn{width:36px;border-left:3px double rgba(255,255,255,.15);padding-left:8px;background:transparent;color:rgba(255,255,255,.4);font-size:16px}

/* ═══ VARIANT 45 — Translucent Blob */
.v45 .hamburger-btn{width:44px;height:44px;border-radius:60% 40% 50% 50%;background:rgba(52,211,153,.1);backdrop-filter:blur(8px);border:none;color:#34d399;font-size:18px}

/* ═══ VARIANT 46 — Outlined Circle */
.v46 .hamburger-btn{width:38px;height:38px;border-radius:50%;background:transparent;border:1.5px dashed rgba(255,255,255,.2);color:rgba(255,255,255,.5);font-size:14px}

/* ═══ VARIANT 47 — Tab Bar */
.v47 .hamburger-btn{padding:6px 0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.35);background:none;border:none;border-top:2px solid transparent}
.v47 .hamburger-btn:hover{color:#fff;border-top-color:#34d399}

/* ═══ VARIANT 48 — Material 3 */
.v48 .hamburger-btn{width:40px;height:40px;border-radius:20px;background:transparent;border:none;color:#e8eaed;font-size:18px;transition:background .2s}
.v48 .hamburger-btn:hover{background:rgba(255,255,255,.08)}
.v48 .hamburger-dropdown{background:#1e1e24;border-radius:16px;border:none;box-shadow:0 4px 24px rgba(0,0,0,.4)}

/* ═══ VARIANT 49 — Radial Menu */
.v49 .hamburger-btn{width:44px;height:44px;border-radius:50%;background:rgba(99,102,241,.1);border:2px solid rgba(99,102,241,.2);color:#818cf8}

.v49 .hamburger-dropdown a{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0}

/* ═══ VARIANT 50 — Cinema Scope */
.v50 .hamburger-btn{width:100%;padding:10px;border-radius:0;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.8));border:none;color:#fff;font-size:14px;letter-spacing:4px;text-transform:uppercase;position:absolute;bottom:0;left:0}
</style>
</head>
<body>

<h1>≡ Hamburger Menu Mockups</h1>
<p class="sub">50 design variants · hover each card to preview dropdown · click to toggle open</p>

<div class="grid" id="mockupGrid"></div>

<script>
var variants=[];
for(var i=1;i<=50;i++){
  var greeting=i%3===0?'<div class="dd-greeting"><div class="dd-avatar" style="background:#34d399"></div><span>Hello, User</span></div>':'';
  variants.push({
    num:i,
    cls:'v'+i,
    label:['Classic Dark','Pill Soft','Three Dots','Minimal Line','Accent Glow','Ghost Icon','Frosted Glass','Brutalist','Slide Right','Light Minimal','Navy Pro','Neon Pop','Elegant Serif','Compact Chip','Bordered Square','Dark Academia','Gradient Border','Soft Shadow','Cyberpunk','Bottom Sheet','Bebas Bold','Mono Tech','Toolbar Icon','Ring Indicator','Inline Text','Fullscreen','Underline','Vertical','Floating FAB','Segmented','Side Tab','Diamond','Notebook','Pixel Art','Magazine','Terminal','Kanban','Split Button','Dashboard','Apple Style','Tag Pill','Hand-drawn','Neon Sign','Margin','Blob','Dashed Circle','Tab Bar','Material 3','Radial','Cinema Scope'][i-1],
    greeting:greeting
  });
}

var grid=document.getElementById('mockupGrid');
var h='';
variants.forEach(function(v){
  var btnInner=v.cls==='v4'?'<span></span><span></span><span></span>':v.cls==='v23'?'<span></span><span></span><span></span>':v.cls==='v32'?'<span>☰</span>':v.cls==='v36'?'menu':v.cls==='v38'?'<span class="main">☰</span><span class="caret">▼</span>':v.cls==='v39'?'<span class="label">Menu</span><span>☰</span>':'☰';
  h+='<div class="card '+v.cls+'" onclick="this.querySelector(\'.hamburger-dropdown\').classList.toggle(\'open\')">';
  h+='<div class="card-head"><span class="card-num">#'+v.num+'</span><span class="card-label">'+v.label+'</span></div>';
  h+='<div class="card-body'+(v.cls==='v26'||v.cls==='v49'?' center-all':'')+'">';
  h+='<div class="hamburger-menu">';
  h+='<button class="hamburger-btn">'+btnInner+'</button>';
  h+='<div class="hamburger-dropdown">';
  h+=v.greeting;
  h+='<a href="#">🏠 Home</a><a href="#">🎙 Studio</a><a href="#">📊 Analysis</a><a href="#">👤 Account</a>';
  if(v.greeting)h+='<hr><a href="#">🌙 Toggle theme</a>';
  h+='</div></div></div></div>';
});
grid.innerHTML=h;
</script>

</body>
