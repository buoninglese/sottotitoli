<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sottotitoli · Hamburger — Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e8eaed;padding:40px;display:flex;flex-direction:column;align-items:center;min-height:100vh;-webkit-font-smoothing:antialiased}
[data-theme="light"] body{background:#f0f2f5;color:#111827}

h1{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;color:#34d399;margin-bottom:4px}
[data-theme="light"] h1{color:#059669}
.sub{font-size:14px;color:#71717a;margin-bottom:36px}

.theme-bar{display:flex;gap:4px;margin-bottom:40px}
.theme-bar button{padding:8px 20px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:rgba(255,255,255,.6);cursor:pointer;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;transition:all .2s}
.theme-bar button:hover{background:rgba(255,255,255,.08);color:#fff}
.theme-bar button.active{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.25);color:#34d399}
[data-theme="light"] .theme-bar button{border-color:rgba(0,0,0,.1);background:rgba(0,0,0,.02);color:#555}
[data-theme="light"] .theme-bar button:hover{background:rgba(0,0,0,.04);color:#111}
[data-theme="light"] .theme-bar button.active{background:rgba(5,150,105,.08);border-color:rgba(5,150,105,.2);color:#059669}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;max-width:960px;width:100%}
.card{background:#0f1117;border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:visible;min-height:400px}
[data-theme="light"] .card{background:#fff;border-color:#e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-head{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.04)}
[data-theme="light"] .card-head{border-bottom-color:#e5e7eb}
.card-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px}
.card-label small{font-family:'Inter',sans-serif;font-size:10px;font-weight:400;color:#71717a;letter-spacing:0;margin-left:6px}
.card-body{display:flex;align-items:flex-start;justify-content:flex-end;padding:48px 32px 56px;min-height:320px}

.hamburger-menu{position:relative;display:inline-block;z-index:5}
.hamburger-btn{cursor:pointer;height:36px;padding:0 16px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.2);font-family:'Inter',sans-serif;border:1px solid #2f333e;color:rgba(255,255,255,.5);background:rgba(255,255,255,.02)}
.hamburger-btn::before{content:'☰';font-size:14px}
.hamburger-btn:hover{transform:translateY(-1px)}
[data-theme="light"] .hamburger-btn{border-color:#d1d5db;color:#6b7280;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}
@media(max-width:600px){.grid{grid-template-columns:1fr}.card-body{padding:32px 20px 48px}}

.hamburger-dropdown{position:absolute;top:100%;right:0;margin-top:8px;z-index:20;min-width:220px;border-radius:10px;padding:8px;display:none;flex-direction:column;opacity:0}
.hamburger-dropdown.open{display:flex;animation:hbIn .35s cubic-bezier(.25,.46,.45,.94) forwards}
.hamburger-dropdown.closing{display:flex;animation:hbOut .22s ease-in forwards}
@keyframes hbIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes hbOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-10px)}}
.hamburger-dropdown a{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:9px 14px;border-radius:7px;text-decoration:none;transition:all .15s;display:block;cursor:pointer}
.hamburger-dropdown hr{border:none;border-top:1px solid;margin:4px 0}
.dd-greeting{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:6px;border-bottom:1px solid}
.dd-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.dd-name{font-size:12px;font-weight:600;letter-spacing:-.2px}

/* Index */
.s-idx .card-label{color:#a78bfa}[data-theme="light"] .s-idx .card-label{color:#7c3aed}
.s-idx .hamburger-btn:hover{border-color:rgba(167,139,250,.3);color:#a78bfa;background:rgba(167,139,250,.04);box-shadow:0 4px 14px rgba(167,139,250,.1)}
.s-idx .hamburger-dropdown{background:#1a1d26;border:1px solid #2f333e}
.s-idx .hamburger-dropdown a{color:#9ca3af}
.s-idx .hamburger-dropdown a:hover{background:rgba(167,139,250,.08);color:#a78bfa}
.s-idx .dd-greeting{color:#6b7280;border-bottom-color:#2f333e}
[data-theme="light"] .s-idx .hamburger-btn:hover{border-color:#a78bfa;color:#7c3aed;background:rgba(124,58,237,.04)}
[data-theme="light"] .s-idx .hamburger-dropdown{background:#fff;border-color:#e5e7eb;box-shadow:0 4px 24px rgba(0,0,0,.06)}
[data-theme="light"] .s-idx .hamburger-dropdown a{color:#4b5563}
[data-theme="light"] .s-idx .hamburger-dropdown a:hover{background:#f3f4f6;color:#111827}
[data-theme="light"] .s-idx .dd-greeting{color:#9ca3af;border-bottom-color:#e5e7eb}

/* Start */
.s-start .card-label{color:#60a5fa}[data-theme="light"] .s-start .card-label{color:#2563eb}
.s-start .hamburger-btn{border-color:rgba(37,99,235,.15);color:rgba(255,255,255,.4)}
.s-start .hamburger-btn:hover{border-color:rgba(37,99,235,.3);color:#60a5fa;background:rgba(37,99,235,.06);box-shadow:0 4px 14px rgba(37,99,235,.1)}
.s-start .hamburger-dropdown{background:#1a1d26;border:1px solid rgba(37,99,235,.15)}
.s-start .hamburger-dropdown a{color:#94a3b8}
.s-start .hamburger-dropdown a:hover{background:rgba(37,99,235,.08);color:#60a5fa}
.s-start .dd-greeting{color:#64748b;border-bottom-color:rgba(37,99,235,.1)}
[data-theme="light"] .s-start .hamburger-btn{border-color:#c7d2fe;color:#6b7280;background:#fff}
[data-theme="light"] .s-start .hamburger-btn:hover{border-color:#818cf8;color:#4f46e5;background:rgba(99,102,241,.04)}
[data-theme="light"] .s-start .hamburger-dropdown{background:#fff;border-color:#e5e7eb;box-shadow:0 4px 24px rgba(0,0,0,.06)}
[data-theme="light"] .s-start .hamburger-dropdown a{color:#4b5563}
[data-theme="light"] .s-start .hamburger-dropdown a:hover{background:#eef2ff;color:#4338ca}
[data-theme="light"] .s-start .dd-greeting{color:#9ca3af;border-bottom-color:#e5e7eb}

@media(max-width:600px){.grid{grid-template-columns:1fr}.card-body{padding:32px 20px 48px}}
</style>
</head>
<body>

<h1>≡ Final Proposal</h1>
<p class="sub">Avatar 32px · Zen Spacer · Glide 350ms — Index &amp; Start · day &amp; night</p>

<div class="theme-bar">
  <button class="active" onclick="setTheme('dark')">🌙 Dark</button>
  <button onclick="setTheme('light')">☀️ Light</button>
</div>

<div class="grid">
  <div class="card s-idx">
    <div class="card-head"><span class="card-label">Index <small>purple accent</small></span></div>
    <div class="card-body">
      <div class="hamburger-menu">
        <button class="hamburger-btn" onclick="toggleDD(this)">Menu</button>
        <div class="hamburger-dropdown">
          <div class="dd-greeting"><div class="dd-avatar">U</div><span class="dd-name">Hello, User</span></div>
          <a href="#">Home</a><a href="#">Start</a><a href="#">Profilo</a><a href="#">AI Reports</a>
          <hr><a href="#">Theme</a>
        </div>
      </div>
    </div>
  </div>

  <div class="card s-start">
    <div class="card-head"><span class="card-label">Start <small>blue accent · + Account + Analysis</small></span></div>
    <div class="card-body">
      <div class="hamburger-menu">
        <button class="hamburger-btn" onclick="toggleDD(this)">Menu</button>
        <div class="hamburger-dropdown">
          <div class="dd-greeting"><div class="dd-avatar">U</div><span class="dd-name">Hello, User</span></div>
          <a href="#">Home</a><a href="#">Start</a><a href="#">Profilo</a><a href="#">AI Reports</a>
          <hr><a href="#">Theme</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.theme-bar button').forEach(function(b,i){b.classList.toggle('active',(i===0&&t==='dark')||(i===1&&t==='light'))});
}
function toggleDD(btn){
  var dd=btn.parentElement.querySelector('.hamburger-dropdown');
  if(dd.classList.contains('open')){dd.classList.remove('open');dd.classList.add('closing');setTimeout(function(){dd.classList.remove('closing')},300)}
  else{document.querySelectorAll('.hamburger-dropdown.open').forEach(function(d){d.classList.remove('open');d.classList.add('closing');setTimeout(function(){d.classList.remove('closing')},300)});dd.classList.add('open')}
}
document.addEventListener('click',function(e){if(!e.target.closest('.hamburger-menu')){document.querySelectorAll('.hamburger-dropdown.open').forEach(function(d){d.classList.remove('open');d.classList.add('closing');setTimeout(function(){d.classList.remove('closing')},300)}})});
</script>
</body>
</html>
