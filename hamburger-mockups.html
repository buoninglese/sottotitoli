<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sottotitoli · Hamburger Mockups v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Geist+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e8eaed;padding:24px;-webkit-font-smoothing:antialiased}
h1{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;color:#34d399;margin-bottom:2px}
.sub{font-size:13px;color:#71717a;margin-bottom:8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px;font-size:11px;color:#71717a}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;margin:36px 0 16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}
.card{background:#0c1118;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:visible;position:relative;min-height:340px}
.card-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04)}
.card-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:#52525b}
.card-label{font-size:11px;font-weight:600;color:#71717a;text-transform:uppercase;letter-spacing:.5px}
.card-body{padding:28px 20px 44px;display:flex;align-items:flex-start;justify-content:flex-end;position:relative;min-height:270px}

.hamburger-menu{position:relative;display:inline-block;z-index:5}
.hamburger-btn{cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;border:none;background:none;padding:0;user-select:none}
.hamburger-dropdown{position:absolute;top:100%;right:0;margin-top:8px;z-index:20;min-width:200px;border-radius:10px;padding:6px;display:none;flex-direction:column}
.hamburger-dropdown.open{display:flex}
.hamburger-dropdown a{font-size:12px;font-weight:500;padding:9px 14px;border-radius:7px;text-decoration:none;transition:all .15s;display:block;cursor:pointer}
.hamburger-dropdown hr{border:none;border-top:1px solid;margin:4px 0}
.dd-greeting{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;margin-bottom:4px;border-bottom:1px solid}
.dd-avatar{width:24px;height:24px;border-radius:50%;flex-shrink:0}

/* Animations */
@keyframes ddFadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes ddSlideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes ddScaleIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes ddSlideRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes ddBlurIn{from{opacity:0;filter:blur(10px);transform:translateY(-6px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes ddRotateIn{from{opacity:0;transform:rotate(-6deg) scale(.92)}to{opacity:1;transform:rotate(0) scale(1)}}
@keyframes ddBounceIn{0%{opacity:0;transform:scale(.75)}55%{transform:scale(1.05)}80%{transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
@keyframes ddFlipIn{0%{opacity:0;transform:perspective(400px) rotateX(-20deg)}100%{opacity:1;transform:perspective(400px) rotateX(0)}}
@keyframes ddElasticIn{0%{opacity:0;transform:scale(.6)}50%{transform:scale(1.1)}70%{transform:scale(.94)}100%{opacity:1;transform:scale(1)}}

.anim-fade .hamburger-dropdown.open{animation:ddFadeIn .25s ease-out}
.anim-slide .hamburger-dropdown.open{animation:ddSlideDown .3s cubic-bezier(.4,0,.2,1)}
.anim-scale .hamburger-dropdown.open{animation:ddScaleIn .28s ease-out}
.anim-slideR .hamburger-dropdown.open{animation:ddSlideRight .3s ease-out}
.anim-blur .hamburger-dropdown.open{animation:ddBlurIn .32s ease-out}
.anim-rotate .hamburger-dropdown.open{animation:ddRotateIn .32s ease-out}
.anim-bounce .hamburger-dropdown.open{animation:ddBounceIn .38s ease-out}
.anim-flip .hamburger-dropdown.open{animation:ddFlipIn .32s ease-out}
.anim-elastic .hamburger-dropdown.open{animation:ddElasticIn .48s ease-out}

.tip{position:absolute;bottom:8px;right:18px;font-size:9px;color:#52525b;font-family:'JetBrains Mono',monospace}

/* ═══ CAPTION BUNKO (i1) — Editorial Dark ═══ */
.style-bunko .card{background:#12121a;border-color:#1a1c24}
.style-bunko .hamburger-btn{font-family:'Playfair Display',serif;font-size:18px;color:#c9a84c}
.style-bunko .hamburger-dropdown{background:#1a1a24;border:1px solid #2a2a38}
.style-bunko .hamburger-dropdown a{color:#b5ad9e;font-family:'Inter',sans-serif}
.style-bunko .hamburger-dropdown a:hover{background:rgba(201,168,76,.08);color:#c9a84c}
.style-bunko .dd-greeting{color:#8b8b8b;border-bottom-color:#2a2a38}
.style-bunko .btn-lines span{background:#c9a84c}

/* ═══ CAPTION SHOJI (j7b) — Light ═══ */
.style-shoji .card{background:#fafafa;border-color:#e5e5e5}
.style-shoji .card-head{border-bottom-color:#e5e5e5}
.style-shoji .card-num,.style-shoji .card-label,.style-shoji .tip{color:#a1a1aa}
.style-shoji .hamburger-btn{font-family:'Inter',sans-serif;font-weight:300;color:#71717a}
.style-shoji .hamburger-dropdown{background:#fff;border:1px solid #e5e5e5;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.style-shoji .hamburger-dropdown a{color:#52525b;font-family:'Manrope',sans-serif;font-weight:400}
.style-shoji .hamburger-dropdown a:hover{background:#f5f5f5;color:#18181b}
.style-shoji .dd-greeting{color:#a1a1aa;border-bottom-color:#e5e5e5}
.style-shoji .btn-lines span{background:#a1a1aa}

/* ═══ TRADUZIONE — Dark Green ═══ */
.style-trad .card{background:#0c1118}
.style-trad .hamburger-btn{font-family:'Work Sans',sans-serif;font-weight:500;color:rgba(255,255,255,.5)}
.style-trad .hamburger-dropdown{background:#161e28;border:1px solid rgba(255,255,255,.08)}
.style-trad .hamburger-dropdown a{color:#d4d4d8;font-family:'Work Sans',sans-serif}
.style-trad .hamburger-dropdown a:hover{background:rgba(52,211,153,.06);color:#6ee7b7}
.style-trad .dd-greeting{color:rgba(255,255,255,.45);border-bottom-color:rgba(255,255,255,.06)}
.style-trad .btn-lines span{background:rgba(255,255,255,.4)}

/* ═══ INDEX — Dark Purple ═══ */
.style-idx .card{background:#0f1117}
.style-idx .hamburger-btn{font-family:'Inter',sans-serif;font-weight:600;color:rgba(255,255,255,.5)}
.style-idx .hamburger-dropdown{background:#1a1d26;border:1px solid #2f333e}
.style-idx .hamburger-dropdown a{color:#9ca3af;font-family:'Inter',sans-serif}
.style-idx .hamburger-dropdown a:hover{background:rgba(167,139,250,.08);color:#a78bfa}
.style-idx .dd-greeting{color:#6b7280;border-bottom-color:#2f333e}
.style-idx .btn-lines span{background:rgba(255,255,255,.4)}

/* ═══ START — Dark Blue ═══ */
.style-start .card{background:#0f1117}
.style-start .hamburger-btn{font-family:'Inter',sans-serif;font-weight:500;color:rgba(255,255,255,.4)}
.style-start .hamburger-dropdown{background:#1a1d26;border:1px solid rgba(37,99,235,.15)}
.style-start .hamburger-dropdown a{color:#94a3b8;font-family:'Inter',sans-serif}
.style-start .hamburger-dropdown a:hover{background:rgba(37,99,235,.08);color:#60a5fa}
.style-start .dd-greeting{color:#64748b;border-bottom-color:rgba(37,99,235,.1)}
.style-start .btn-lines span{background:rgba(255,255,255,.35)}

/* Button shapes */
.btn-square{width:38px;height:38px;border-radius:7px;border:1px solid;font-size:17px}
.btn-pill{width:44px;height:44px;border-radius:100px;border:1.5px solid;font-size:18px;font-weight:300}
.btn-circle{width:40px;height:40px;border-radius:50%;font-size:18px}
.btn-ghost{width:auto;height:auto;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;border:1px solid}
.btn-dots{width:34px;height:34px;border-radius:50%;font-size:22px;letter-spacing:3px}
.btn-lines{width:30px;height:22px;display:flex;flex-direction:column;gap:5px;border:none!important}
.btn-lines span{display:block;width:100%;height:2px;border-radius:1px;transition:all .2s}
.btn-underline{width:auto;height:auto;padding:6px 0;font-size:13px;font-weight:600;border-bottom:2px solid transparent;border-radius:0}
.btn-icon-only{width:38px;height:38px;border-radius:8px;font-size:17px}
.btn-badge{height:30px;padding:0 14px;border-radius:16px;font-size:11px;font-weight:600;gap:5px;display:flex;align-items:center;border:1px solid}
.btn-badge::before{content:'☰';font-size:13px}

/* Per-style button borders */
.style-bunko .btn-square,.style-bunko .btn-pill,.style-bunko .btn-circle,.style-bunko .btn-ghost,.style-bunko .btn-dots,.style-bunko .btn-icon-only,.style-bunko .btn-badge{border-color:rgba(201,168,76,.2);color:#c9a84c}
.style-bunko .btn-underline{color:#c9a84c;border-bottom-color:rgba(201,168,76,.2)}

.style-shoji .btn-square,.style-shoji .btn-pill,.style-shoji .btn-circle,.style-shoji .btn-ghost,.style-shoji .btn-dots,.style-shoji .btn-icon-only,.style-shoji .btn-badge{border-color:#e5e5e5;color:#a1a1aa;background:#fff}
.style-shoji .btn-underline{color:#a1a1aa;border-bottom-color:#e5e5e5}

.style-trad .btn-square,.style-trad .btn-pill,.style-trad .btn-circle,.style-trad .btn-ghost,.style-trad .btn-dots,.style-trad .btn-icon-only,.style-trad .btn-badge{border-color:rgba(255,255,255,.1);color:rgba(255,255,255,.5);background:rgba(255,255,255,.03)}
.style-trad .btn-underline{color:rgba(255,255,255,.5);border-bottom-color:rgba(255,255,255,.1)}

.style-idx .btn-square,.style-idx .btn-pill,.style-idx .btn-circle,.style-idx .btn-ghost,.style-idx .btn-dots,.style-idx .btn-icon-only,.style-idx .btn-badge{border-color:#2f333e;color:rgba(255,255,255,.5);background:rgba(255,255,255,.03)}
.style-idx .btn-underline{color:rgba(255,255,255,.5);border-bottom-color:#2f333e}

.style-start .btn-square,.style-start .btn-pill,.style-start .btn-circle,.style-start .btn-ghost,.style-start .btn-dots,.style-start .btn-icon-only,.style-start .btn-badge{border-color:rgba(37,99,235,.12);color:rgba(255,255,255,.4);background:rgba(255,255,255,.02)}
.style-start .btn-underline{color:rgba(255,255,255,.4);border-bottom-color:rgba(37,99,235,.12)}

/* Hover states */
.style-bunko .hamburger-btn:hover{color:#e8d49a!important;border-color:rgba(201,168,76,.4)!important}
.style-shoji .hamburger-btn:hover{color:#52525b!important;border-color:#d4d4d8!important;background:#f5f5f5!important}
.style-trad .hamburger-btn:hover{color:#6ee7b7!important;border-color:rgba(52,211,153,.3)!important;background:rgba(52,211,153,.06)!important}
.style-idx .hamburger-btn:hover{color:#a78bfa!important;border-color:rgba(167,139,250,.3)!important;background:rgba(167,139,250,.06)!important}
.style-start .hamburger-btn:hover{color:#60a5fa!important;border-color:rgba(37,99,235,.25)!important;background:rgba(37,99,235,.06)!important}

@media(max-width:500px){.grid{grid-template-columns:1fr}.card-body{min-height:240px}}
</style>
</head>
<body>

<h1>≡ Hamburger Menus</h1>
<p class="sub">50 variants across 5 page styles — click any ☰ button to preview</p>
<div class="legend">
  <span><span class="dot" style="background:#c9a84c"></span>Caption Bunko</span>
  <span><span class="dot" style="background:#e5e5e5;border:1px solid #d4d4d8"></span>Caption Shoji</span>
  <span><span class="dot" style="background:#34d399"></span>Traduzione</span>
  <span><span class="dot" style="background:#a78bfa"></span>Index</span>
  <span><span class="dot" style="background:#60a5fa"></span>Start</span>
</div>

<div id="mockupGrid"></div>

<script>
var animations=['fade','slide','scale','slideR','blur','rotate','bounce','flip','elastic'];
var btnShapes=[
  {cls:'btn-square',inner:'☰',label:'Square'},
  {cls:'btn-pill',inner:'☰',label:'Pill'},
  {cls:'btn-circle',inner:'☰',label:'Circle'},
  {cls:'btn-ghost',inner:'☰ Menu',label:'Ghost Btn'},
  {cls:'btn-dots',inner:'⋮',label:'3 Dots'},
  {cls:'btn-lines',inner:'<span></span><span></span><span></span>',label:'Lines'},
  {cls:'btn-underline',inner:'Menu',label:'Underline'},
  {cls:'btn-icon-only',inner:'☰',label:'Icon Only'},
  {cls:'btn-badge',inner:'',label:'Chip'},
];
var styles=[
  {id:'bunko',name:'Caption · Bunko (i1)',cls:'style-bunko'},
  {id:'shoji',name:'Caption · Shoji (j7b)',cls:'style-shoji'},
  {id:'trad',name:'Traduzione',cls:'style-trad'},
  {id:'idx',name:'Index',cls:'style-idx'},
  {id:'start',name:'Start',cls:'style-start'},
];

var variants=[],num=1;
styles.forEach(function(st){
  btnShapes.forEach(function(bs,i){
    var anim=animations[i%animations.length];
    var greeting=num%3===0;
    variants.push({num:num,style:st,btnShape:bs,anim:anim,greeting:greeting});
    num++;
    if(num<=50){
      var anim2=animations[(i+5)%animations.length];
      variants.push({num:num,style:st,btnShape:bs,anim:anim2,greeting:!(num%3)});
      num++;
    }
  });
});
variants=variants.slice(0,50);

function makeDD(greeting){
  var h='';
  if(greeting){
    h+='<div class="dd-greeting"><div class="dd-avatar" style="background:linear-gradient(135deg,#7c3aed,#a78bfa)"></div><span>Hello, User</span></div>';
  }
  h+='<a href="#">🏠 Home</a><a href="#">🎙 Studio</a><a href="#">📊 AI Reports</a><a href="#">👤 Account</a>';
  if(greeting) h+='<hr><a href="#">🌙 Toggle theme</a>';
  return h;
}

var grid=document.getElementById('mockupGrid');
styles.forEach(function(st){
  var sv=variants.filter(function(v){return v.style.id===st.id});
  var accent=st.id==='bunko'?'#c9a84c':st.id==='shoji'?'#71717a':st.id==='trad'?'#34d399':st.id==='idx'?'#a78bfa':'#60a5fa';
  var h='<div class="section-title" style="color:'+accent+'">'+st.name+'</div><div class="grid">';
  sv.forEach(function(v){
    var btnInner=v.btnShape.inner;
    h+='<div class="card '+st.cls+' anim-'+v.anim+'">';
    h+='<div class="card-head"><span class="card-num">#'+v.num+'</span><span class="card-label">'+v.btnShape.label+' · '+v.anim+'</span></div>';
    h+='<div class="card-body"><div class="hamburger-menu">';
    h+='<button class="hamburger-btn '+v.btnShape.cls+'" onclick="toggleDD(this)">'+btnInner+'</button>';
    h+='<div class="hamburger-dropdown">'+makeDD(v.greeting)+'</div>';
    h+='</div><span class="tip">click ☰</span></div></div>';
  });
  h+='</div>';
  grid.innerHTML+=h;
});

function toggleDD(btn){
  var dd=btn.parentElement.querySelector('.hamburger-dropdown');
  var wasOpen=dd.classList.contains('open');
  document.querySelectorAll('.hamburger-dropdown.open').forEach(function(d){d.classList.remove('open')});
  if(!wasOpen) dd.classList.add('open');
}

document.addEventListener('click',function(e){
  if(!e.target.closest('.hamburger-menu')){
    document.querySelectorAll('.hamburger-dropdown.open').forEach(function(d){d.classList.remove('open')});
  }
});
</script>
</body>
</html>
