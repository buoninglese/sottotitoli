<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sottotitoli · Hamburger — Final Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&family=Geist+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e8eaed;padding:24px;-webkit-font-smoothing:antialiased}
[data-theme="light"] body{background:#f0f2f5;color:#111827}

h1{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:2px;color:#34d399}
[data-theme="light"] h1{color:#059669}
h2{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;margin:36px 0 16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06)}
[data-theme="light"] h2{border-bottom-color:#e5e7eb;color:#374151}
.sub{font-size:13px;color:#71717a}
.theme-toggle{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:rgba(255,255,255,.6);cursor:pointer;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;transition:all .2s}
[data-theme="light"] .theme-toggle{border-color:rgba(0,0,0,.12);background:rgba(0,0,0,.03);color:#555}
.theme-toggle:hover{background:rgba(255,255,255,.08);color:#fff}
[data-theme="light"] .theme-toggle:hover{background:rgba(0,0,0,.05);color:#111}

.page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:20px}
.grid-sm{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:#0f1117;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:visible;position:relative;min-height:360px}
[data-theme="light"] .card{background:#fff;border-color:#e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04)}
[data-theme="light"] .card-head{border-bottom-color:#e5e7eb}
.card-label{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px}
.card-label small{font-family:'Inter',sans-serif;font-size:9px;font-weight:400;color:#71717a;letter-spacing:0;margin-left:6px}
.card-body{padding:32px 20px 48px;display:flex;align-items:flex-start;justify-content:flex-end;position:relative;min-height:280px}
.tip{position:absolute;bottom:8px;right:18px;font-size:9px;color:#52525b;font-family:'JetBrains Mono',monospace}
[data-theme="light"] .tip{color:#9ca3af}

/* ═══ HAMBURGER ═══ */
.hamburger-menu{position:relative;display:inline-block;z-index:5}
.hamburger-btn{cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;border:none;background:none;padding:0;user-select:none}
.hamburger-dropdown{position:absolute;top:100%;right:0;margin-top:8px;z-index:20;min-width:220px;border-radius:10px;padding:8px;display:none;flex-direction:column;opacity:0}
.hamburger-dropdown.open{display:flex;animation:hbGlideIn .35s cubic-bezier(.25,.46,.45,.94) forwards}
.hamburger-dropdown.closing{display:flex;animation:hbGlideOut .22s ease-in forwards}
@keyframes hbGlideIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes hbGlideOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-10px)}}

.hamburger-dropdown a{font-size:12px;font-weight:500;padding:9px 14px;border-radius:7px;text-decoration:none;transition:all .15s;display:flex;align-items:center;gap:8px;cursor:pointer;font-family:'Inter',sans-serif}
.hamburger-dropdown a .dd-icon{width:18px;text-align:center;font-size:12px;flex-shrink:0;opacity:.45}
.hamburger-dropdown hr{border:none;border-top:1px solid;margin:4px 0}
.dd-greeting{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:6px;border-bottom:1px solid}
.dd-greeting .dd-name{font-size:12px;font-weight:600;letter-spacing:-.2px}
.ghost-btn{height:36px;padding:0 16px;border-radius:8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .25s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 3px rgba(0,0,0,.2);font-family:'Inter',sans-serif}
.ghost-btn::before{content:'☰';font-size:14px}
.ghost-btn:hover{transform:translateY(-1px)}
[data-theme="light"] .ghost-btn{box-shadow:0 1px 2px rgba(0,0,0,.06)}
@media(max-width:600px){.ghost-btn{width:38px;height:38px;padding:0;border-radius:50%;font-size:0;gap:0}.ghost-btn::before{font-size:17px}.grid{grid-template-columns:1fr}}

/* ═══ INDEX STYLE ═══ */
.s-idx .card-label{color:#a78bfa}[data-theme="light"] .s-idx .card-label{color:#7c3aed}
.s-idx .ghost-btn{border:1px solid #2f333e;color:rgba(255,255,255,.5);background:rgba(255,255,255,.02)}
.s-idx .ghost-btn:hover{border-color:rgba(167,139,250,.3);color:#a78bfa;background:rgba(167,139,250,.04);box-shadow:0 4px 14px rgba(167,139,250,.1)}
.s-idx .hamburger-dropdown{background:#1a1d26;border:1px solid #2f333e}
.s-idx .hamburger-dropdown a{color:#9ca3af}
.s-idx .hamburger-dropdown a:hover{background:rgba(167,139,250,.08);color:#a78bfa}
.s-idx .dd-greeting{color:#6b7280;border-bottom-color:#2f333e}
[data-theme="light"] .s-idx .ghost-btn{border-color:#d1d5db;color:#6b7280;background:#fff}
[data-theme="light"] .s-idx .ghost-btn:hover{border-color:#a78bfa;color:#7c3aed;background:rgba(124,58,237,.04)}
[data-theme="light"] .s-idx .hamburger-dropdown{background:#fff;border-color:#e5e7eb;box-shadow:0 4px 24px rgba(0,0,0,.06)}
[data-theme="light"] .s-idx .hamburger-dropdown a{color:#4b5563}
[data-theme="light"] .s-idx .hamburger-dropdown a:hover{background:#f3f4f6;color:#111827}
[data-theme="light"] .s-idx .dd-greeting{color:#9ca3af;border-bottom-color:#e5e7eb}

/* ═══ START STYLE (also Account + Analysis) ═══ */
.s-start .card-label{color:#60a5fa}[data-theme="light"] .s-start .card-label{color:#2563eb}
.s-start .ghost-btn{border:1px solid rgba(37,99,235,.15);color:rgba(255,255,255,.4);background:rgba(255,255,255,.02)}
.s-start .ghost-btn:hover{border-color:rgba(37,99,235,.3);color:#60a5fa;background:rgba(37,99,235,.06);box-shadow:0 4px 14px rgba(37,99,235,.1)}
.s-start .hamburger-dropdown{background:#1a1d26;border:1px solid rgba(37,99,235,.15)}
.s-start .hamburger-dropdown a{color:#94a3b8}
.s-start .hamburger-dropdown a:hover{background:rgba(37,99,235,.08);color:#60a5fa}
.s-start .dd-greeting{color:#64748b;border-bottom-color:rgba(37,99,235,.1)}
[data-theme="light"] .s-start .ghost-btn{border-color:#c7d2fe;color:#6b7280;background:#fff}
[data-theme="light"] .s-start .ghost-btn:hover{border-color:#818cf8;color:#4f46e5;background:rgba(99,102,241,.04)}
[data-theme="light"] .s-start .hamburger-dropdown{background:#fff;border-color:#e5e7eb;box-shadow:0 4px 24px rgba(0,0,0,.06)}
[data-theme="light"] .s-start .hamburger-dropdown a{color:#4b5563}
[data-theme="light"] .s-start .hamburger-dropdown a:hover{background:#eef2ff;color:#4338ca}
[data-theme="light"] .s-start .dd-greeting{color:#9ca3af;border-bottom-color:#e5e7eb}

/* ═══ AVATAR SIZES ═══ */
.av-sm .dd-avatar{width:20px;height:20px}.av-sm .dd-greeting .dd-name{font-size:11px}
.av-md .dd-avatar{width:24px;height:24px}
.av-lg .dd-avatar{width:28px;height:28px}.av-lg .dd-greeting .dd-name{font-size:13px}
.av-xl .dd-avatar{width:32px;height:32px}.av-xl .dd-greeting .dd-name{font-size:13px}
.av-xxl .dd-avatar{width:36px;height:36px}.av-xxl .dd-greeting .dd-name{font-size:14px}
.dd-avatar{flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:linear-gradient(135deg,#7c3aed,#a78bfa);border-radius:50%}
.dd-avatar span{font-size:inherit}
</style>
</head>
<body>

<div class="page-header">
  <div>
    <h1>≡ Master Selection</h1>
    <p class="sub">Index + Start · Glide 350ms · day & night — Account &amp; Analysis use Start style</p>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ Light mode</button>
</div>

<!-- ═══ MASTER BLOCK ═══ -->
<h2 style="color:#a78bfa">▸ Index</h2>
<div class="grid" id="masterIdx"></div>
<h2 style="color:#60a5fa">▸ Start <small style="font-family:Inter;font-size:11px;color:#71717a;font-weight:400;letter-spacing:0">+ Account + Analysis</small></h2>
<div class="grid" id="masterStart"></div>

<!-- ═══ AVATAR SIZE VARIATIONS ═══ -->
<h2>Avatar Sizes <small style="font-family:Inter;font-size:11px;color:#71717a;font-weight:400;letter-spacing:0">5 variations</small></h2>
<div class="grid grid-sm" id="avatarGrid"></div>

<!-- ═══ ICON VARIATIONS ═══ -->
<h2>Icon Sets <small style="font-family:Inter;font-size:11px;color:#71717a;font-weight:400;letter-spacing:0">20 variations</small></h2>
<div class="grid" id="iconGrid"></div>

<script>
function makeDD(items,avatarCls){
  var h='<div class="dd-greeting"><div class="dd-avatar '+avatarCls+'">U</div><span class="dd-name">Hello, User</span></div>';
  items.forEach(function(it){h+='<a href="#"><span class="dd-icon">'+it.icon+'</span>'+it.label+'</a>';});
  h+='<hr><a href="#"><span class="dd-icon">\u2013</span>Theme</a>';
  return h;
}

// ═══ MASTER ═══
function renderMaster(id,cls,items){
  var h='',grid=document.getElementById(id);
  h+='<div class="card '+cls+'"><div class="card-head"><span class="card-label">Dark mode</span></div><div class="card-body"><div class="hamburger-menu"><button class="hamburger-btn ghost-btn" onclick="toggleDD(this)">Menu</button><div class="hamburger-dropdown">'+makeDD(items,'av-md')+'</div></div></div></div>';
  h+='<div class="card '+cls+'"><div class="card-head"><span class="card-label">Light mode <small>toggle ☀️ to see</small></span></div><div class="card-body"><div class="hamburger-menu"><button class="hamburger-btn ghost-btn" onclick="toggleDD(this)">Menu</button><div class="hamburger-dropdown">'+makeDD(items,'av-md')+'</div></div></div></div>';
  grid.innerHTML=h;
}
renderMaster('masterIdx','s-idx',[{icon:'\u2013',label:'Home'},{icon:'\u2013',label:'Start'},{icon:'\u2013',label:'Profilo'},{icon:'\u2014',label:'AI Reports'}]);
renderMaster('masterStart','s-start',[{icon:'\u2013',label:'Home'},{icon:'\u2013',label:'Start'},{icon:'\u2013',label:'Profilo'},{icon:'\u2014',label:'AI Reports'}]);

// ═══ AVATAR SIZES ═══
(function(){
  var sizes=[{cls:'av-sm',label:'20px · Small'},{cls:'av-md',label:'24px · Default'},{cls:'av-lg',label:'28px · Large'},{cls:'av-xl',label:'32px · XL'},{cls:'av-xxl',label:'36px · XXL'}];
  var items=[{icon:'\u2013',label:'Home'},{icon:'\u2013',label:'Start'},{icon:'\u2014',label:'Profilo'}];
  var h='',grid=document.getElementById('avatarGrid');
  sizes.forEach(function(s){
    h+='<div class="card s-start '+s.cls+'"><div class="card-head"><span class="card-label">'+s.label+'</span></div><div class="card-body"><div class="hamburger-menu"><button class="hamburger-btn ghost-btn" onclick="toggleDD(this)">Menu</button><div class="hamburger-dropdown">'+makeDD(items,s.cls)+'</div></div></div></div>';
  });
  grid.innerHTML=h;
})();

// ═══ ICON SETS ═══
(function(){
  var iconSets=[
    {label:'Minimal · Dot',icons:['\u00B7','\u00B7','\u00B7','\u00B7','\u2234']},     // middle dot, therefore
    {label:'Clean · Angle',icons:['\u203A','\u203A','\u203A','\u203A','\u00BB']},      // single angle, double angle
    {label:'Light · Circle',icons:['\u25CB','\u25CB','\u25CB','\u25CB','\u25CF']},     // open circle, filled
    {label:'Soft · Arrow',icons:['\u2192','\u2192','\u2192','\u2192','\u2197']},        // right arrow, NE arrow
    {label:'Tidy · Dash',icons:['\u2013','\u2013','\u2013','\u2013','\u2014']},         // en-dash, em-dash
    {label:'Solid · Square',icons:['\u25A1','\u25A1','\u25A1','\u25A1','\u25A0']},     // open square, filled
    {label:'Subtle · Pipe',icons:['\u2502','\u2502','\u2502','\u2502','\u251C']},      // box drawing
    {label:'Elegant · Diamond',icons:['\u25C7','\u25C7','\u25C7','\u25C7','\u25C6']},  // open diamond, filled
    {label:'Airy · Triangle',icons:['\u25B3','\u25B3','\u25B3','\u25B3','\u25B2']},    // open triangle, filled
    {label:'Sharp · Caret',icons:['\u203A','\u203A','\u203A','\u203A','\u2304']},      // angle + down caret
    {label:'Pure · Bullet',icons:['\u2022','\u2022','\u2022','\u2022','\u25E6']},      // bullet, white bullet
    {label:'Math · Prime',icons:['\u2032','\u2032','\u2032','\u2032','\u2033']},       // prime, double prime
    {label:'Graph · Bar',icons:['\u2502','\u2502','\u2502','\u2502','\u2551']},        // light vert, heavy vert
    {label:'Cross · Plus',icons:['\u002B','\u002B','\u002B','\u002B','\u271A']},       // plus, heavy plus
    {label:'Typo · Guillemet',icons:['\u2039','\u2039','\u2039','\u2039','\u203A']},   // single guillemets
    {label:'Mono · Hash',icons:['\u0023','\u0023','\u0023','\u0023','\u266F']},        // number sign, sharp
    {label:'Round · Ring',icons:['\u25CB','\u25CB','\u25CB','\u25CB','\u2299']},       // circle, circled dot
    {label:'Card · Suit',icons:['\u2663','\u2666','\u2665','\u2660','\u2726']},        // suits + star
    {label:'Tech · Symbol',icons:['\u2318','\u2325','\u2305','\u2387','\u2316']},      // mac keys
    {label:'Zen · Spacer',icons:['\u00A0','\u00A0','\u00A0','\u00A0','\u00A0']}        // no icon (nbsp)
  ];
  var items=[{label:'Home'},{label:'Studio'},{label:'Reports'},{label:'Account'},{label:'Settings'}];
  var h='',grid=document.getElementById('iconGrid');
  iconSets.forEach(function(set,i){
    var cls=i%2===0?'s-idx':'s-start';
    h+='<div class="card '+cls+'"><div class="card-head"><span class="card-label">#'+(i+1)+' '+set.label+'</span></div><div class="card-body"><div class="hamburger-menu"><button class="hamburger-btn ghost-btn" onclick="toggleDD(this)">Menu</button><div class="hamburger-dropdown">'+makeDD(items.map(function(it,j){return{icon:set.icons[j],label:it.label}}),'av-md')+'</div></div></div></div>';
  });
  grid.innerHTML=h;
})();

function toggleDD(btn){
  var dd=btn.parentElement.querySelector('.hamburger-dropdown');
  if(dd.classList.contains('open')){dd.classList.remove('open');dd.classList.add('closing');setTimeout(function(){dd.classList.remove('closing')},300)}
  else{document.querySelectorAll('.hamburger-dropdown.open').forEach(function(d){d.classList.remove('open');d.classList.add('closing');setTimeout(function(){d.classList.remove('closing')},300)});dd.classList.add('open')}
}
document.addEventListener('click',function(e){if(!e.target.closest('.hamburger-menu')){document.querySelectorAll('.hamburger-dropdown.open').forEach(function(d){d.classList.remove('open');d.classList.add('closing');setTimeout(function(){d.classList.remove('closing')},300)})}});

function toggleTheme(){var h=document.documentElement,t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️ Light mode':'🌙 Dark mode';localStorage.setItem('hb-theme',t)}
(function(){var t=localStorage.getItem('hb-theme')||'dark';document.documentElement.setAttribute('data-theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️ Light mode':'🌙 Dark mode'})();
</script>
</body>
</html>
