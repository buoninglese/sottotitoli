<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Obiettivi & Progresso · 60 Wild Variations</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d14;--bg2:#12151e;--card:#161922;--line:#232836;--text:#e8eaed;--t2:#c4c9d4;--t3:#5f6b7a;--a:#a78bfa;--g:#34d399;--b:#60a5fa}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:24px}
h1{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:-.5px;margin-bottom:4px}h1 em{color:var(--a);font-style:normal}
.sub{font-size:13px;color:var(--t2);margin-bottom:16px}
.back{display:inline-block;margin-bottom:16px;color:var(--a);text-decoration:none;font-size:13px;font-weight:500}
.top-tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.top-tabs button{padding:7px 16px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.top-tabs button:hover{border-color:var(--a);color:var(--a)}
.top-tabs button.active{background:var(--a);color:#fff;border-color:var(--a)}
.layout{display:flex;gap:14px;align-items:flex-start}
@media(max-width:860px){.layout{flex-direction:column}}
.nav-col{width:190px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;position:sticky;top:24px;max-height:80vh;overflow-y:auto}
@media(max-width:860px){.nav-col{width:100%;position:static;flex-direction:row;flex-wrap:wrap;max-height:none}}
.nav-btn{padding:6px 10px;border-radius:6px;font-size:10px;font-weight:500;border:1px solid transparent;background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;text-align:left;transition:all .12s}
.nav-btn:hover{background:var(--card);color:var(--text)}
.nav-btn.active{background:var(--card);border-color:var(--line);color:var(--text);font-weight:600}
.nav-btn .n{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--a);margin-right:3px}
.nav-section{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);padding:6px 4px 2px}
.pv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;overflow:hidden;transition:all .3s;margin-bottom:12px}
.pv:hover{border-color:rgba(167,139,250,.2);box-shadow:0 6px 24px rgba(0,0,0,.3);transform:translateY(-2px)}
.pv::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--a),transparent 70%);opacity:.04;pointer-events:none;border-radius:10px}
.pv .pn{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--a);font-weight:700;margin-bottom:8px}
.card-h3{font-size:18px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.mono{font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<a href="account.html" class="back">← Back to Account</a>
<h1>Obiettivi & Progresso <em>Wild Variations</em></h1>
<p class="sub">60 radically different designs. 6 base types × 10 distinct visual styles each.</p>
<div class="top-tabs" id="topTabs"></div>
<div class="layout"><div class="nav-col" id="navCol"></div><div class="preview-area" id="previewArea"></div></div>
<script>
var D={min:12,minMax:120,sess:151,sessMax:5,words:2,wordsMax:200,week:'22 giu – 28 giu'};

var bases=[
  {name:'Donut',group:'Obiettivi',fn:function(s){return'<div class="card-h3">🎯 Obiettivi <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div>'+s}},
  {name:'Thermometer',group:'Obiettivi',fn:function(s){return'<div class="card-h3">🎯 Obiettivi <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div>'+s}},
  {name:'Radar',group:'Obiettivi',fn:function(s){return'<div class="card-h3">🎯 Obiettivi <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div>'+s}},
  {name:'Bullet',group:'Progresso',fn:function(s){return'<div class="card-h3">📈 Progresso <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div>'+s}},
  {name:'Cards',group:'Progresso',fn:function(s){return'<div class="card-h3">📈 Progresso <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div>'+s}},
  {name:'Typographic',group:'Progresso',fn:function(s){return'<div class="card-h3">📈 Progresso <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div>'+s}}
];

// 10 wildly different visual styles applied to each base
var styles=[
  function(){/* 1. Neon Glow */return'style="text-shadow:0 0 10px currentColor"';},
  function(){/* 2. 3D Extruded */return'style="filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3))"';},
  function(){/* 3. Minimal Inline */return'style="font-size:13px;line-height:2"';},
  function(){/* 4. Card Grid */var c=['var(--g)','var(--a)','var(--b)'];return'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">'+[{v:'12',mx:'/120',l:'min',c:c[0]},{v:'151',mx:'/5',l:'sess.',c:c[1]},{v:'2',mx:'/200',l:'parole',c:c[2]}].map(function(d){return'<div style="background:var(--bg2);border-radius:10px;padding:16px;text-align:center;border:1px solid var(--line)"><div class="mono" style="font-size:30px;font-weight:800;color:'+d.c+'">'+d.v+'</div><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em">'+d.l+'</div><div style="font-size:11px;color:var(--t2)">'+d.mx+'</div></div>';}).join('')+'</div>';},
  function(){/* 5. Horizontal Flow */return'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px"><span>⏱️ <strong style="color:var(--g)">12</strong>/120 min</span><span style="color:var(--t3)">|</span><span>📋 <strong style="color:var(--a)">151</strong>/5 sess.</span><span style="color:var(--t3)">|</span><span>📚 <strong style="color:var(--b)">2</strong>/200 parole</span></div>';},
  function(){/* 6. Radial Burst */return'<div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap">'+[{v:10,l:'min',c:'var(--g)'},{v:100,l:'sess.',c:'var(--a)'},{v:1,l:'parole',c:'var(--b)'}].map(function(d){return'<div style="text-align:center"><svg viewBox="0 0 80 80" style="width:70px;height:70px;transform:rotate(-90deg)"><circle cx="40" cy="40" r="32" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="40" cy="40" r="32" fill="none" stroke="'+d.c+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="'+(201-d.v/100*201)+'"/></svg><div class="mono" style="font-size:18px;font-weight:800;color:'+d.c+';margin-top:-54px">'+d.v+'%</div><div style="font-size:10px;color:var(--t3);text-transform:uppercase">'+d.l+'</div></div>';}).join('')+'</div>';},
  function(){/* 7. Thermometer Bars */return'<div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap">'+[{v:10,l:'min',c:'var(--g)'},{v:100,l:'sess.',c:'var(--a)'},{v:1,l:'parole',c:'var(--b)'}].map(function(d){return'<div style="text-align:center"><div style="width:24px;height:100px;background:var(--line);border-radius:12px;margin:0 auto 6px;position:relative;overflow:hidden"><div style="position:absolute;bottom:0;left:0;right:0;height:'+d.v+'%;background:'+d.c+';border-radius:0 0 12px 12px"></div></div><div class="mono" style="font-size:14px;font-weight:800;color:'+d.c+'">'+d.v+'%</div><div style="font-size:9px;color:var(--t3)">'+d.l+'</div></div>';}).join('')+'</div>';},
  function(){/* 8. Pill Badges */return'<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">'+[{v:'12/120',l:'min',c:'var(--g)'},{v:'151/5',l:'sessioni',c:'var(--a)'},{v:'2/200',l:'parole',c:'var(--b)'}].map(function(d){return'<div style="display:flex;align-items:center;gap:8px;padding:12px 20px;background:var(--bg2);border-radius:100px;border:1.5px solid '+d.c+'"><span class="mono" style="font-size:20px;font-weight:800;color:'+d.c+'">'+d.v+'</span><span style="font-size:11px;color:var(--t2)">'+d.l+'</span></div>';}).join('')+'</div>';},
  function(){/* 9. Dot Matrix */return'<div style="display:flex;flex-direction:column;gap:10px">'+[{v:D.min,mx:D.minMax,l:'Minuti',c:'var(--g)'},{v:D.sess,mx:D.sessMax,l:'Sessioni',c:'var(--a)'},{v:D.words,mx:D.wordsMax,l:'Parole',c:'var(--b)'}].map(function(d){var dots='';for(var i=0;i<20;i++)dots+='<span style="width:8px;height:8px;border-radius:50%;background:'+(i/Math.max(1,d.mx)*20<d.v/d.mx*20?d.c:'var(--line)')+';display:inline-block;margin:1px"></span>';return'<div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:var(--t2)">'+d.l+'</span><span class="mono" style="color:'+d.c+'">'+d.v+'/'+d.mx+'</span></div><div>'+dots+'</div></div>';}).join('')+'</div>';},
  function(){/* 10. Massive Type */return'<div style="display:flex;gap:28px;flex-wrap:wrap;justify-content:center">'+[{v:'12',mx:'/120',l:'Minuti',c:'var(--g)'},{v:'151',mx:'/5',l:'Sessioni',c:'var(--a)'},{v:'2',mx:'/200',l:'Parole',c:'var(--b)'}].map(function(d){return'<div style="text-align:center"><div style="font-size:48px;font-weight:900;letter-spacing:-2px;color:'+d.c+';line-height:1">'+d.v+'<span style="font-size:16px;color:var(--t3)">'+d.mx+'</span></div><div style="font-size:11px;color:var(--t2);margin-top:2px">'+d.l+'</div></div>';}).join('')+'</div>';}
];

var proposals=[];
bases.forEach(function(b,bi){
  for(var i=0;i<10;i++){
    var s=styles[i]();
    if(typeof s==='string'&&s.startsWith('style=')){/* wrap basic */var c=['var(--g)','var(--a)','var(--b)'];var items=[{v:'12',mx:'/120',l:'min',c:c[0]},{v:'151',mx:'/5',l:'sess.',c:c[1]},{v:'2',mx:'/200',l:'parole',c:c[2]}];s='<div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap">'+items.map(function(d){return'<div><span class="mono" '+s+' style="font-size:26px;font-weight:800;color:'+d.c+'">'+d.v+'</span><span style="font-size:11px;color:var(--t2)">'+d.mx+'</span><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.04em">'+d.l+'</div></div>';}).join('')+'</div>';}
    proposals.push({html:'<span class="pn">#'+(bi*10+i+1)+' · '+b.name+' · Style '+(i+1)+'</span>'+b.fn(s),group:b.group,base:b.name});
  }
});

// Build UI
var topTabs=document.getElementById('topTabs');
var navCol=document.getElementById('navCol');
var previewArea=document.getElementById('previewArea');
var current=0;

bases.forEach(function(b,bi){
  var tb=document.createElement('button');tb.textContent=b.group+' · '+b.name;tb.dataset.base=bi;
  if(bi===0)tb.classList.add('active');
  tb.addEventListener('click',function(){current=parseInt(this.dataset.base)*10;document.querySelectorAll('.top-tabs button').forEach(function(x){x.classList.remove('active')});this.classList.add('active');show();buildNav();});
  topTabs.appendChild(tb);
});

function buildNav(){
  var bi=Math.floor(current/10);
  navCol.innerHTML='';
  for(var i=0;i<10;i++){
    var btn=document.createElement('button');btn.className='nav-btn'+(i===current%10?' active':'');
    btn.innerHTML='<span class="n">#'+(bi*10+i+1)+'</span>Style '+(i+1);
    btn.addEventListener('click',function(){current=bi*10+parseInt(this.querySelector('.n').textContent.replace('#',''))-1;show();buildNav();});
    navCol.appendChild(btn);
  }
}

function show(){
  var p=proposals[current];
  previewArea.innerHTML='<div class="pv">'+p.html+'</div><div class="pv"><div style="font-size:9px;color:var(--t3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em">Clean view</div>'+p.html.replace(/<span class="pn">.*?<\/span>/,'')+'</div>';
}

buildNav();show();
</script>
</body>
</html>
