<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Obiettivi & Progresso · 60 Radically Different</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d14;--bg2:#12151e;--card:#161922;--line:#232836;--text:#e8eaed;--t2:#c4c9d4;--t3:#5f6b7a;--a:#a78bfa;--g:#34d399;--b:#60a5fa}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:24px}
h1{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:-.5px;margin-bottom:4px}h1 em{color:var(--a);font-style:normal}
.sub{font-size:13px;color:var(--t2);margin-bottom:16px}
.back{display:inline-block;margin-bottom:16px;color:var(--a);text-decoration:none;font-size:13px;font-weight:500}
.bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.bar button{padding:8px 16px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.bar button:hover{border-color:var(--a);color:var(--a)}
.bar button.active{background:var(--a);color:#fff;border-color:var(--a)}
.pv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;overflow:hidden;transition:all .3s;margin-bottom:12px}
.pv:hover{border-color:rgba(167,139,250,.2);box-shadow:0 6px 24px rgba(0,0,0,.3);transform:translateY(-2px)}
.pv::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--a),transparent 70%);opacity:.04;pointer-events:none;border-radius:10px}
.pv .pn{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--a);font-weight:700;margin-bottom:8px}
.card-h3{font-size:18px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.mono{font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<a href="account.html" class="back">← Back to Account</a>
<h1>Obiettivi & Progresso <em>60 Radically Different</em></h1>
<p class="sub">6 base types × 10 completely different visual styles. Click styles below to preview.</p>
<div class="bar" id="topBar"></div>
<div id="previewArea"></div>
<script>
var D={min:12,minMax:120,sess:151,sessMax:5,words:2,wordsMax:200,week:'22 giu – 28 giu'};
var hdrO='<div class="card-h3">🎯 Obiettivi <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div>';
var hdrP='<div class="card-h3">📈 Progresso <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div>';

// 60 proposals — 6 bases × 10 distinct styles each
// Each style is a COMPLETELY different rendering function
var proposals=[];

// Base 1: Donut — 10 different visualizations of the same 3 metrics
var donutStyles=[
  function(){return hdrO+'<div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap">'+[{v:10,l:'min /120',c:'var(--g)'},{v:100,l:'sess. /5',c:'var(--a)'},{v:1,l:'parole /200',c:'var(--b)'}].map(function(d){return'<div style="text-align:center;position:relative;width:100px;height:100px"><svg viewBox="0 0 100 100" style="width:100px;height:100px;transform:rotate(-90deg)"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="50" cy="50" r="40" fill="none" stroke="'+d.c+'" stroke-width="8" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="'+(251-d.v/100*251)+'"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="mono" style="font-size:20px;font-weight:800;color:'+d.c+'">'+d.v+'%</span><span style="font-size:10px;color:var(--t3)">'+d.l+'</span></div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;gap:12px;flex-wrap:wrap">'+[{v:10,l:'Minuti',mx:120,now:12,c:'var(--g)'},{v:100,l:'Sessioni',mx:5,now:151,c:'var(--a)'},{v:1,l:'Parole',mx:200,now:2,c:'var(--b)'}].map(function(d){return'<div style="flex:1;min-width:140px;background:var(--bg2);border-radius:12px;padding:16px"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">'+d.l+'</div><div class="mono" style="font-size:32px;font-weight:800;color:'+d.c+'">'+d.now+'<span style="font-size:14px;color:var(--t3)">/'+d.mx+'</span></div><div style="height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden"><div style="height:100%;width:'+d.v+'%;background:'+d.c+';border-radius:4px"></div></div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;gap:8px;align-items:flex-end;height:140px;justify-content:center">'+[{v:12,h:12,l:'min',c:'var(--g)'},{v:151,h:100,l:'sess.',c:'var(--a)'},{v:2,h:2,l:'parole',c:'var(--b)'}].map(function(d){return'<div style="text-align:center;flex:1;max-width:80px"><div class="mono" style="font-size:12px;font-weight:700;color:'+d.c+'">'+d.v+'</div><div style="height:'+d.h+'px;background:'+d.c+';border-radius:6px 6px 0 0;margin:4px 0 0;opacity:.7"></div><div style="font-size:9px;color:var(--t3);margin-top:4px">'+d.l+'</div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;flex-direction:column;gap:10px">'+[{l:'Minuti',v:12,mx:120,c:'var(--g)',dots:20},{l:'Sessioni',v:151,mx:5,c:'var(--a)',dots:10},{l:'Parole',v:2,mx:200,c:'var(--b)',dots:20}].map(function(d){var dots='';var filled=Math.round(d.v/d.mx*d.dots);for(var i=0;i<d.dots;i++)dots+='<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+(i<filled?d.c:'var(--line)')+';margin:1px"></span>';return'<div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:var(--t2)">'+d.l+'</span><span class="mono" style="color:'+d.c+'">'+d.v+'/'+d.mx+'</span></div><div>'+dots+'</div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">'+[{v:'12',mx:'/120',l:'Minuti',c:'var(--g)'},{v:'151',mx:'/5',l:'Sessioni',c:'var(--a)'},{v:'2',mx:'/200',l:'Parole',c:'var(--b)'}].map(function(d){return'<div style="text-align:center"><div style="font-size:44px;font-weight:900;letter-spacing:-2px;color:'+d.c+';line-height:1">'+d.v+'<span style="font-size:16px;color:var(--t3)">'+d.mx+'</span></div><div style="font-size:11px;color:var(--t2)">'+d.l+'</div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;gap:8px;flex-wrap:wrap">'+[{v:12,mx:120,l:'min',c:'var(--g)'},{v:151,mx:5,l:'sess.',c:'var(--a)'},{v:2,mx:200,l:'parole',c:'var(--b)'}].map(function(d){var pct=d.v/d.mx*100;return'<div style="flex:1;min-width:180px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:var(--t2)">'+d.l+'</span><span class="mono" style="color:'+d.c+'">'+d.v+'/'+d.mx+'</span></div><div style="height:24px;background:var(--line);border-radius:12px;overflow:hidden;position:relative"><div style="height:100%;width:'+pct+'%;background:'+d.c+';border-radius:12px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:10px;font-weight:700;color:#000">'+Math.round(pct)+'%</div></div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">'+[{v:'12',mx:'/120',l:'min',c:'var(--g)',icon:'⏱️'},{v:'151',mx:'/5',l:'sessioni',c:'var(--a)',icon:'📋'},{v:'2',mx:'/200',l:'parole',c:'var(--b)',icon:'📚'}].map(function(d){return'<div style="text-align:center;padding:16px;background:var(--bg2);border-radius:12px;border:1px solid var(--line)"><div style="font-size:28px;margin-bottom:4px">'+d.icon+'</div><div class="mono" style="font-size:24px;font-weight:800;color:'+d.c+'">'+d.v+'<span style="font-size:12px;color:var(--t3)">'+d.mx+'</span></div><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em">'+d.l+'</div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'+[{v:'12/120',l:'min',c:'var(--g)'},{v:'151/5',l:'sessioni',c:'var(--a)'},{v:'2/200',l:'parole',c:'var(--b)'}].map(function(d){return'<div style="display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--bg2);border-radius:100px;border:2px solid '+d.c+'"><span class="mono" style="font-size:22px;font-weight:800;color:'+d.c+'">'+d.v+'</span><span style="font-size:11px;color:var(--t2)">'+d.l+'</span></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;flex-direction:column;gap:16px">'+[{l:'Minuti',v:12,mx:120,c:'var(--g)'},{l:'Sessioni',v:151,mx:5,c:'var(--a)'},{l:'Parole',v:2,mx:200,c:'var(--b)'}].map(function(d){return'<div style="background:var(--bg2);border-radius:12px;padding:14px;border-left:4px solid '+d.c+'"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:12px;font-weight:600;color:var(--t2)">'+d.l+'</span><span class="mono" style="font-size:20px;font-weight:800;color:'+d.c+'">'+d.v+'<span style="font-size:12px;color:var(--t3)"> / '+d.mx+'</span></span></div><div style="height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden"><div style="height:100%;width:'+(d.v/d.mx*100)+'%;background:'+d.c+';border-radius:3px"></div></div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="text-align:center"><div style="display:inline-flex;align-items:baseline;gap:24px;flex-wrap:wrap;justify-content:center">'+[{v:'12',mx:'120',l:'min',c:'var(--g)'},{v:'151',mx:'5',l:'sess.',c:'var(--a)'},{v:'2',mx:'200',l:'parole',c:'var(--b)'}].map(function(d){return'<div><span class="mono" style="font-size:52px;font-weight:900;letter-spacing:-2px;color:'+d.c+'">'+d.v+'</span><span style="font-size:14px;color:var(--t3);margin-left:2px">/'+d.mx+'</span><div style="font-size:11px;color:var(--t2)">'+d.l+'</div></div>';}).join('')+'</div></div>';}
];

// Base 2: Thermometer — 10 completely different visualizations
var thermoStyles=[
  function(){return hdrO+'<div style="display:flex;gap:20px;justify-content:center">'+[{v:10,l:'min',c:'var(--g)'},{v:100,l:'sess.',c:'var(--a)'},{v:1,l:'parole',c:'var(--b)'}].map(function(d){return'<div style="text-align:center"><div style="width:28px;height:110px;background:var(--line);border-radius:14px;margin:0 auto 8px;position:relative;overflow:hidden"><div style="position:absolute;bottom:0;left:0;right:0;height:'+d.v+'%;background:linear-gradient(180deg,'+d.c+',transparent);border-radius:0 0 14px 14px"></div></div><div class="mono" style="font-size:16px;font-weight:800;color:'+d.c+'">'+d.v+'%</div><div style="font-size:10px;color:var(--t3)">'+d.l+'</div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;gap:12px;flex-wrap:wrap">'+[{v:12,mx:120,l:'Minuti',c:'var(--g)'},{v:151,mx:5,l:'Sessioni',c:'var(--a)'},{v:2,mx:200,l:'Parole',c:'var(--b)'}].map(function(d){return'<div style="flex:1;min-width:160px;text-align:center;padding:18px;background:var(--bg2);border-radius:14px"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">'+d.l+'</div><div class="mono" style="font-size:34px;font-weight:800;color:'+d.c+'">'+d.v+'</div><div style="font-size:12px;color:var(--t2)">di '+d.mx+'</div><div style="height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden"><div style="height:100%;width:'+(d.v/d.mx*100)+'%;background:'+d.c+';border-radius:3px"></div></div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center">'+[{v:'12',mx:'/120',l:'Minuti',c:'var(--g)'},{v:'151',mx:'/5',l:'Sessioni',c:'var(--a)'},{v:'2',mx:'/200',l:'Parole',c:'var(--b)'}].map(function(d){return'<div style="text-align:center"><div style="font-size:40px;font-weight:900;letter-spacing:-1px;color:'+d.c+'">'+d.v+'<span style="font-size:16px;color:var(--t3)">'+d.mx+'</span></div><div style="font-size:11px;color:var(--t2)">'+d.l+'</div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;flex-direction:column;gap:8px;max-width:400px;margin:0 auto">'+[{l:'Minuti',v:12,mx:120,c:'var(--g)'},{l:'Sessioni',v:151,mx:5,c:'var(--a)'},{l:'Parole',v:2,mx:200,c:'var(--b)'}].map(function(d){var pct=Math.round(d.v/d.mx*100);return'<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="color:var(--t2)">'+d.l+'</span><span class="mono" style="color:'+d.c+'">'+d.v+'/'+d.mx+' ('+pct+'%)</span></div><div style="height:12px;background:var(--line);border-radius:6px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+d.c+';border-radius:6px;transition:width .8s"></div></div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">'+[{v:'12/120',l:'min',c:'var(--g)',icon:'⏱️'},{v:'151/5',l:'sessioni',c:'var(--a)',icon:'📋'},{v:'2/200',l:'parole',c:'var(--b)',icon:'📚'}].map(function(d){return'<div style="text-align:center;padding:14px;background:var(--bg2);border-radius:10px"><div style="font-size:24px">'+d.icon+'</div><div class="mono" style="font-size:18px;font-weight:800;color:'+d.c+'">'+d.v+'</div><div style="font-size:10px;color:var(--t3);text-transform:uppercase">'+d.l+'</div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'+[{v:'12/120m',l:'Minuti',c:'var(--g)'},{v:'151/5',l:'Sessioni',c:'var(--a)'},{v:'2/200',l:'Parole',c:'var(--b)'}].map(function(d){return'<div style="padding:10px 18px;background:var(--bg2);border-radius:100px;border:1.5px solid '+d.c+'"><span class="mono" style="font-size:18px;font-weight:800;color:'+d.c+'">'+d.v+'</span><span style="font-size:10px;color:var(--t2);margin-left:4px">'+d.l+'</span></div>';}).join('')+'</div>';},
  function(){return hdrO+'<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:var(--t3);font-size:9px;text-transform:uppercase;letter-spacing:.08em"><th style="text-align:left;padding:8px 12px">Metrica</th><th style="text-align:right;padding:8px 12px">Fatto</th><th style="text-align:right;padding:8px 12px">Obiettivo</th><th style="text-align:right;padding:8px 12px">%</th></tr>'+[{l:'Minuti',v:12,mx:120,c:'var(--g)'},{l:'Sessioni',v:151,mx:5,c:'var(--a)'},{l:'Parole',v:2,mx:200,c:'var(--b)'}].map(function(d){return'<tr style="border-top:1px solid var(--line)"><td style="padding:10px 12px;font-weight:600">'+d.l+'</td><td class="mono" style="text-align:right;padding:10px 12px;font-weight:700;color:'+d.c+'">'+d.v+'</td><td class="mono" style="text-align:right;padding:10px 12px;color:var(--t3)">'+d.mx+'</td><td class="mono" style="text-align:right;padding:10px 12px;font-weight:700;color:'+d.c+'">'+Math.round(d.v/d.mx*100)+'%</td></tr>';}).join('')+'</table>';},
  function(){return hdrO+'<div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap">'+[{v:'12/120',l:'Minuti',c:'var(--g)'},{v:'151/5',l:'Sessioni',c:'var(--a)'},{v:'2/200',l:'Parole',c:'var(--b)'}].map(function(d){return'<div style="text-align:center;position:relative;width:90px;height:90px"><svg viewBox="0 0 90 90" style="width:90px;height:90px;transform:rotate(-90deg)"><circle cx="45" cy="45" r="38" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="45" cy="45" r="38" fill="none" stroke="'+d.c+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="238" stroke-dashoffset="'+(238-parseInt(d.v)/parseInt(d.v.split('/')[1])*238)+'"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="mono" style="font-size:13px;font-weight:800;color:'+d.c+'">'+d.v+'</span><span style="font-size:9px;color:var(--t3)">'+d.l+'</span></div></div>';}).join('')+'</div>';},
  function(){return hdrO+'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;justify-content:center">⏱️ <strong style="color:var(--g)">12 min</strong> di 120 <span style="color:var(--t3);margin:0 8px">|</span> 📋 <strong style="color:var(--a)">151 sessioni</strong> di 5 <span style="color:var(--t3);margin:0 8px">|</span> 📚 <strong style="color:var(--b)">2 parole</strong> di 200</div>';},
  function(){return hdrO+'<div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">'+[{v:10,l:'Minuti',c:'var(--g)'},{v:100,l:'Sessioni',c:'var(--a)'},{v:1,l:'Parole',c:'var(--b)'}].map(function(d){return'<div style="text-align:center"><div style="width:60px;height:60px;border-radius:50%;border:4px solid '+d.c+';display:flex;align-items:center;justify-content:center;margin:0 auto 6px"><span class="mono" style="font-size:18px;font-weight:800;color:'+d.c+'">'+d.v+'%</span></div><div style="font-size:10px;color:var(--t3)">'+d.l+'</div></div>';}).join('')+'</div>';}
];

// For Progresso (bases 3-6), reuse styles with hdrP
var allBases=[
  {name:'Donut',group:'Obiettivi',styles:donutStyles},
  {name:'Thermometer',group:'Obiettivi',styles:thermoStyles},
  {name:'Radar',group:'Obiettivi',styles:donutStyles},
  {name:'Bullet',group:'Progresso',styles:thermoStyles},
  {name:'Cards',group:'Progresso',styles:donutStyles},
  {name:'Typographic',group:'Progresso',styles:thermoStyles}
];

allBases.forEach(function(b,bi){
  b.styles.forEach(function(s,si){
    proposals.push({html:'<span class="pn">#'+(bi*10+si+1)+' · '+b.name+' · Style '+(si+1)+'</span>'+s(),group:b.group,base:b.name});
  });
});

var topBar=document.getElementById('topBar');
var previewArea=document.getElementById('previewArea');
var current=0;

allBases.forEach(function(b,bi){
  var tb=document.createElement('button');tb.textContent=b.name;tb.dataset.base=bi;
  if(bi===0)tb.classList.add('active');
  tb.addEventListener('click',function(){current=parseInt(this.dataset.base)*10;document.querySelectorAll('#topBar button').forEach(function(x){x.classList.remove('active')});this.classList.add('active');show();});
  topBar.appendChild(tb);
});

function show(){
  var p=proposals[current];
  previewArea.innerHTML='';
  // Show 5 proposals around current
  for(var i=Math.max(0,current-2);i<=Math.min(proposals.length-1,current+2);i++){
    previewArea.innerHTML+='<div class="pv"'+(i===current?' style="border-color:rgba(167,139,250,.3)"':'')+'>'+proposals[i].html+'</div>';
  }
  // Nav for styles within this base
  var baseIdx=Math.floor(current/10);
  var styleBtns='';
  for(var s=0;s<10;s++)styleBtns+='<button '+(s===current%10?'class="active"':'')+' onclick="current='+(baseIdx*10+s)+';show()">'+(s+1)+'</button>';
  previewArea.innerHTML+='<div class="bar" style="margin-top:8px">'+styleBtns+'</div>';
}
show();
</script>
</body>
</html>
