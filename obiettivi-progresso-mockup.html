<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Obiettivi & Progresso · 60 Redesigns</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d14;--bg2:#12151e;--card:#161922;--line:#232836;--text:#e8eaed;--t2:#c4c9d4;--t3:#5f6b7a;--accent:#a78bfa;--green:#34d399;--blue:#60a5fa;--amber:#fbbf24}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:24px}
h1{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
h1 em{color:var(--accent);font-style:normal}
.sub{font-size:13px;color:var(--t2);margin-bottom:20px}
.back{display:inline-block;margin-bottom:18px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:500}
.layout{display:flex;gap:16px;align-items:flex-start}
@media(max-width:860px){.layout{flex-direction:column}}
.nav-col{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:3px;position:sticky;top:24px;max-height:80vh;overflow-y:auto}
@media(max-width:860px){.nav-col{width:100%;position:static;flex-direction:row;flex-wrap:wrap;max-height:none}}
.nav-btn{padding:7px 12px;border-radius:8px;font-size:10px;font-weight:500;border:1px solid transparent;background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;text-align:left;transition:all .12s}
.nav-btn:hover{background:var(--card);color:var(--text)}
.nav-btn.active{background:var(--card);border-color:var(--line);color:var(--text);font-weight:600}
.nav-btn .n{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);margin-right:4px}
.nav-section{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);padding:8px 4px 2px}
.preview-area{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.pv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;overflow:hidden;transition:all .3s}
.pv:hover{border-color:rgba(167,139,250,.2);box-shadow:0 6px 24px rgba(0,0,0,.3);transform:translateY(-1px)}
.pv::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--accent),transparent 70%);opacity:.04;pointer-events:none;border-radius:10px}
.pv .num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);font-weight:700;margin-bottom:10px}
.card-h3{font-size:18px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.ring{text-align:center;position:relative;width:80px;margin:0 auto}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring .rv{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.ring .rl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-top:2px}
.bar-h{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px;transition:width .6s}
.prog-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.prog-row .pr-l{font-size:12px;font-weight:600;color:var(--t2);width:100px;flex-shrink:0}
.prog-row .pr-b{flex:1}
.prog-row .pr-v{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;width:60px;text-align:right;flex-shrink:0}
.row3{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.row3>*{flex:1;min-width:130px;max-width:200px}
.box{background:var(--bg2);border-radius:10px;padding:18px;text-align:center;transition:all .3s;border:1px solid transparent}
.box:hover{border-color:var(--line);transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.box .bv{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:800;line-height:1;margin-bottom:4px}
.box .bl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t3)}
.box .bt{font-size:11px;color:var(--t2);margin-top:3px}
</style>
</head>
<body>
<a href="account.html" class="back">← Back to Account</a>
<h1>Obiettivi & Progresso <em>Redesigns</em></h1>
<p class="sub">60 proposals — 10 variations each for 6 base styles. Hover cards for depth.</p>
<div class="layout">
  <div class="nav-col" id="navCol"></div>
  <div class="preview-area" id="previewArea"></div>
</div>
<script>
// ═══ SAMPLE DATA ═══
var D={min:12,minMax:120,sess:151,sessMax:5,words:2,wordsMax:200,week:'22 giu – 28 giu'};

function ringSVG(pct,color){var c=2*Math.PI*42,dash=c*(1-pct/100);return'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="50" cy="50" r="42" fill="none" stroke="'+color+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+dash+'"/></svg>';}

function donutBase(n,twist){
  return '<span class="num">#'+n+' · Donut '+twist+'</span><div class="card-h3">🎯 Obiettivi settimana <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div><div class="row3">'+[{v:D.min,mx:D.minMax,l:'min',c:'var(--green)',pct:10},{v:D.sess,mx:D.sessMax,l:'sessioni',c:'var(--accent)',pct:100},{v:D.words,mx:D.wordsMax,l:'parole',c:'var(--blue)',pct:1}].map(function(d){return '<div class="box"><div class="ring">'+ringSVG(d.pct,d.c)+'<div class="rv" style="color:'+d.c+'">'+d.pct+'%</div></div><div class="bl">'+d.l+'</div><div class="bt">'+d.v+' / '+d.mx+'</div></div>';}).join('')+'</div>';
}

function thermoBase(n,twist){
  return '<span class="num">#'+n+' · Thermometer '+twist+'</span><div class="card-h3">🎯 Obiettivi settimana <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div><div class="row3">'+[{v:D.min,mx:D.minMax,l:'min',c:'var(--green)',pct:10},{v:D.sess,mx:D.sessMax,l:'sess.',c:'var(--accent)',pct:100},{v:D.words,mx:D.wordsMax,l:'parole',c:'var(--blue)',pct:1}].map(function(d){return '<div class="box"><div style="width:32px;height:120px;background:var(--line);border-radius:16px;margin:0 auto 10px;position:relative;overflow:hidden"><div style="position:absolute;bottom:0;left:0;right:0;height:'+d.pct+'%;background:linear-gradient(180deg,'+d.c+','+d.c+');border-radius:0 0 16px 16px;transition:height .8s"></div></div><div class="bv" style="color:'+d.c+'">'+d.v+'</div><div class="bl">'+d.l+' /'+d.mx+'</div></div>';}).join('')+'</div>';
}

function radarBase(n,twist){
  return '<span class="num">#'+n+' · Radar '+twist+'</span><div class="card-h3">🎯 Obiettivi settimana <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center"><svg viewBox="0 0 140 140" style="width:110px;height:110px"><polygon points="70,18 118,52 104,110 36,110 22,52" fill="none" stroke="var(--line)" stroke-width="1.5"/><polygon points="70,18 118,52 104,110 36,110 22,52" fill="none" stroke="var(--line)" stroke-width="1.5" transform="scale(.6) translate(46,46)"/><polygon points="70,18 98,38 90,78 50,78 42,38" fill="rgba(167,139,250,.08)" stroke="var(--accent)" stroke-width="2"/></svg><div>'+[{l:'Minuti',v:'12/120',c:'var(--green)'},{l:'Sessioni',v:'151/5',c:'var(--accent)'},{l:'Parole',v:'2/200',c:'var(--blue)'}].map(function(d){return '<div style="font-size:12px;margin-bottom:4px;color:var(--t2)">'+d.l+': <strong style="color:'+d.c+'">'+d.v+'</strong></div>';}).join('')+'</div></div>';
}

function bulletBase(n,twist){
  return '<span class="num">#'+n+' · Bullet '+twist+'</span><div class="card-h3">📈 Progresso obiettivi <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div>'+[{l:'Minuti settimana',v:D.min,mx:D.minMax,u:'m',c:'var(--green)',pct:10},{l:'Sessioni settimana',v:D.sess,mx:D.sessMax,u:'',c:'var(--accent)',pct:100},{l:'Parole nuove sett.',v:D.words,mx:D.wordsMax,u:'',c:'var(--blue)',pct:1}].map(function(d){return '<div class="prog-row"><span class="pr-l">'+d.l+'</span><div class="pr-b"><div class="bar-h"><div class="bar-f" style="width:'+d.pct+'%;background:'+d.c+'"></div></div></div><span class="pr-v" style="color:'+d.c+'">'+d.v+d.u+'/'+d.mx+d.u+'</span></div>';}).join('');
}

function progCardsBase(n,twist){
  return '<span class="num">#'+n+' · Cards '+twist+'</span><div class="card-h3">📈 Progresso obiettivi <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div><div class="row3">'+[{l:'Minuti',v:D.v||12,mx:D.minMax,sub:'Ancora 108m',c:'var(--green)',pct:10},{l:'Sessioni',v:151,mx:D.sessMax,sub:'✅ Obiettivo raggiunto!',c:'var(--accent)',pct:100},{l:'Parole',v:2,mx:D.wordsMax,sub:'Ancora 198',c:'var(--blue)',pct:1}].map(function(d){return '<div class="box" style="border-left:3px solid '+d.c+'"><div class="bl" style="margin-bottom:4px">'+d.l+'</div><div class="bv" style="color:'+d.c+';font-size:22px">'+d.v+'<span style="font-size:12px;color:var(--t3)">/'+d.mx+'</span></div><div class="bt">'+d.sub+'</div><div class="bar-h" style="margin-top:8px"><div class="bar-f" style="width:'+d.pct+'%;background:'+d.c+'"></div></div></div>';}).join('')+'</div>';
}

function minimalBase(n,twist){
  return '<span class="num">#'+n+' · Typographic '+twist+'</span><div class="card-h3">📈 Progresso obiettivi <span style="font-weight:400;font-size:11px;color:var(--t3)">'+D.week+'</span></div><div class="row3">'+[{v:10,l:'Minuti',sub:'12 di 120',c:'var(--green)'},{v:100,l:'Sessioni',sub:'151 di 5',c:'var(--accent)'},{v:1,l:'Parole',sub:'2 di 200',c:'var(--blue)'}].map(function(d){return '<div class="box"><div style="font-size:44px;font-weight:900;letter-spacing:-1px;color:'+d.c+';line-height:1">'+d.v+'<span style="font-size:18px;color:var(--t3)">%</span></div><div class="bl">'+d.l+'</div><div class="bt">'+d.sub+'</div></div>';}).join('')+'</div>';
}

var bases=[
  {name:'Donut Gauges',fn:donutBase,group:'Obiettivi'},
  {name:'Thermometer',fn:thermoBase,group:'Obiettivi'},
  {name:'Radar Overview',fn:radarBase,group:'Obiettivi'},
  {name:'Bullet Chart',fn:bulletBase,group:'Progresso'},
  {name:'Progress Cards',fn:progCardsBase,group:'Progresso'},
  {name:'Minimal Typographic',fn:minimalBase,group:'Progresso'}
];

var twists=['Clean','Compact','Spaced','w/ Labels','Animated','Bold','Subtle','Gradient','Outline','Deep'];

var proposals=[];
bases.forEach(function(b,bi){
  for(var i=0;i<10;i++)proposals.push({html:b.fn(bi*10+i+1,twists[i]),group:b.group,base:b.name});
});

var navCol=document.getElementById('navCol');
var previewArea=document.getElementById('previewArea');
var current=0;

var html='';
bases.forEach(function(b,bi){
  html+='<div class="nav-section">'+b.group+' · '+b.name+' ('+(bi*10+1)+'–'+(bi*10+10)+')</div>';
  for(var i=0;i<10;i++)html+='<button class="nav-btn'+(bi===0&&i===0?' active':'')+'" data-idx="'+(bi*10+i)+'"><span class="n">#'+(bi*10+i+1)+'</span>'+twists[i]+'</button>';
});
navCol.innerHTML=html;

navCol.addEventListener('click',function(e){
  var btn=e.target.closest('.nav-btn');if(!btn)return;
  current=parseInt(btn.dataset.idx);
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  show();
});

function show(){
  var p=proposals[current];
  previewArea.innerHTML='<div class="pv">'+p.html+'</div><div class="pv"><div style="font-size:9px;color:var(--t3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.1em">Clean view</div>'+p.html.replace(/<span class="num">.*?<\/span>/,'')+'</div>';
}
show();
</script>
</body>
</html>
