<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">

<title>Obiettivi & Progresso · 20 Redesign Proposals</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d14;--bg2:#12151e;--card:#161922;--line:#232836;--text:#e8eaed;--t2:#c4c9d4;--t3:#5f6b7a;--accent:#a78bfa;--green:#34d399;--blue:#60a5fa;--amber:#fbbf24}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:24px}
h1{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
h1 em{color:var(--accent);font-style:normal}
.sub{font-size:13px;color:var(--t2);margin-bottom:24px}
.back{display:inline-block;margin-bottom:18px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:500}

.tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:100px;font-size:12px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.layout{display:flex;gap:18px;align-items:flex-start}
@media(max-width:860px){.layout{flex-direction:column}}
.nav-col{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;position:sticky;top:24px}
@media(max-width:860px){.nav-col{width:100%;position:static;flex-direction:row;flex-wrap:wrap}}
.nav-btn{padding:8px 14px;border-radius:10px;font-size:11px;font-weight:500;border:1px solid transparent;background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;text-align:left;transition:all .12s}
.nav-btn:hover{background:var(--card);color:var(--text)}
.nav-btn.active{background:var(--card);border-color:var(--line);color:var(--text);font-weight:600}
.nav-btn .n{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);margin-right:4px}

.preview-area{flex:1;min-width:0}
.preview-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;overflow:hidden;margin-bottom:14px}
.preview-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--accent),transparent 70%);opacity:.06;pointer-events:none;border-radius:10px}
.preview-card .label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.preview-card .proposal-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);font-weight:700}
.preview-card h3{font-size:18px;font-weight:700}

/* Card internals */
.card-h3{font-size:18px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.rings{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.ring{text-align:center;width:80px}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.rv{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;position:absolute}
.rl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-top:2px}
.pv-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.pv-bar-fill{height:100%;border-radius:3px;transition:width .6s}

.mini-stat{display:flex;align-items:baseline;gap:6px}
.mini-stat .ms-val{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;line-height:1}
.mini-stat .ms-unit{font-size:14px;font-weight:600;color:var(--t2)}
.mini-stat .ms-lbl{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.04em}
.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.prog-row .pr-label{font-size:12px;font-weight:600;color:var(--t2);width:120px;flex-shrink:0}
.prog-row .pr-bar-wrap{flex:1}
.prog-row .pr-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;width:55px;text-align:right;flex-shrink:0}

.row2{display:flex;gap:12px;flex-wrap:wrap}
.row2>*{flex:1;min-width:200px}
</style>
</head>
<body>
<a href="account.html" class="back">← Back to Account</a>

// ═══ BUILD NAV ═══
var navCol=document.getElementById('navCol');
var previewArea=document.getElementById('previewArea');
var currentGroup='obiettivi';
var currentProposal=0;

function buildNav(group){
  navCol.innerHTML='';
  proposals[group].forEach(function(p,i){
    var btn=document.createElement('button');
    btn.className='nav-btn'+(i===currentProposal?' active':'');
    btn.innerHTML='<span class="n">#'+p.n+'</span>'+p.name;
    btn.addEventListener('click',function(){currentProposal=i;showProposal();buildNav(currentGroup);});
    navCol.appendChild(btn);
  });
}

function showProposal(){
  var p=proposals[currentGroup][currentProposal];
  previewArea.innerHTML='<div class="preview-card"><div class="label-row"><span class="proposal-num">#'+p.n+' · '+p.name+'</span><span style="font-size:10px;color:var(--t3)">'+(currentGroup==='obiettivi'?'🎯 Obiettivi':'📈 Progresso')+'</span></div>'+p.html+'</div>';
  // Re-render the same card without the label for a clean look
  previewArea.innerHTML+='<div class="preview-card" style="margin-top:14px"><div style="font-size:9px;color:var(--t3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.1em">Clean view (as it would appear on the page)</div>'+p.html+'</div>';
}

// Tab switching
document.querySelectorAll('.tab').forEach(function(tab){
  tab.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
    tab.classList.add('active');
    currentGroup=tab.dataset.group;
    currentProposal=0;
    buildNav(currentGroup);
    showProposal();
  });
});

// Init
buildNav('obiettivi');
showProposal();
</script>
