<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Particle S Logo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px}
h1{font-size:clamp(20px,4vw,28px);font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.mic-status{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;font-size:11px;font-weight:600}
.mic-status.off{background:rgba(255,255,255,.03);color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.06)}
.mic-status.on{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)}
.mic-dot{width:7px;height:7px;border-radius:50%}.mic-status.off .mic-dot{background:rgba(255,255,255,.15)}.mic-status.on .mic-dot{background:#34d399;animation:pulse 1.5s ease infinite}
.level-bar{width:100%;max-width:300px;height:3px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden}
.level-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);transition:width .1s;width:0%}
.controls-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.controls-row button{padding:8px 18px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;transition:all .15s}
.controls-row button:hover{border-color:#a78bfa;color:#a78bfa}
.controls-row button.demo{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:#34d399}
.logo-stage{position:relative;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:32px}
.logo-box{text-align:center}
.logo-label{font-size:10px;color:rgba(255,255,255,.25);font-family:'JetBrains Mono',monospace;margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
#logoTiny{width:36px;height:30px;border-radius:4px}
#logoBig{width:180px;height:150px;border-radius:8px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<h1>Particle S 2 — Sound‑Reactive Logo</h1>
<p style="font-size:12px;color:rgba(255,255,255,.35);margin-top:-12px">Kaleidoscope rest · S‑drift on voice</p>

<div class="controls-row">
  <button id="micBtn" onclick="toggleMic()">🎤 Start Mic</button>
  <button class="demo" id="demoBtn" onclick="toggleDemo()">▶ Demo Voice</button>
</div>
<div class="mic-status off" id="micStatus"><span class="mic-dot"></span> Mic off</div>
<div class="level-bar"><div class="level-fill" id="levelFill"></div></div>

<div class="logo-stage">
  <div class="logo-box">
    <canvas id="logoTiny" width="72" height="60"></canvas>
    <div class="logo-label">topbar 36×30</div>
  </div>
  <div class="logo-box">
    <canvas id="logoBig" width="360" height="300"></canvas>
    <div class="logo-label">preview 180×150</div>
  </div>
</div>

<script>
// ─── Audio ───
var audioCtx=null,analyser=null,micStream=null,micActive=false,volume=0,demoOn=false;

async function toggleMic(){micActive?stopMic():startMic();}
async function startMic(){
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;audioCtx.createMediaStreamSource(micStream).connect(analyser);micActive=true;updateMicUI('on');}catch(e){alert('Mic denied: '+e.message);}
}
function stopMic(){if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}if(audioCtx){audioCtx.close();audioCtx=null;analyser=null}micActive=false;volume=0;updateMicUI('off');}
function updateMicUI(s){
  var btn=document.getElementById('micBtn'),st=document.getElementById('micStatus');
  if(s==='on'){btn.textContent='⏹ Stop Mic';btn.style.borderColor='rgba(248,113,113,.3)';btn.style.color='#f87171';st.className='mic-status on';st.innerHTML='<span class="mic-dot"></span> Mic live';}
  else{btn.textContent='🎤 Start Mic';btn.style.borderColor='rgba(255,255,255,.1)';btn.style.color='rgba(255,255,255,.5)';st.className='mic-status off';st.innerHTML='<span class="mic-dot"></span> Mic off';document.getElementById('levelFill').style.width='0%';}
}

function readMicVolume(){
  if(!micActive||!analyser)return 0;
  var data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);
  var sum=0;for(var i=0;i<data.length;i++)sum+=data[i];
  return Math.min(1,sum/data.length/128);
}

function toggleDemo(){demoOn=!demoOn;document.getElementById('demoBtn').textContent=demoOn?'⏹ Stop Demo':'▶ Demo Voice';}
function demoVolume(){
  var t=performance.now()*0.001;
  return Math.max(0,Math.min(1,0.12+Math.sin(t*0.7)*0.2+Math.sin(t*1.3)*0.25+Math.sin(t*2.1)*0.18));
}

// ─── S-Curve (100×85 coord space, scaled to canvas) ───
var S_PATH='M55,6 C28,6 18,40 42,46 C66,52 82,46 72,66 C62,82 45,80 42,78';

function bezierPoint(p0,p1,p2,p3,t){
  var u=1-t;
  return {
    x:u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],
    y:u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]
  };
}

function sampleSCurve(n){
  var segs=[
    {p0:[55,6],p1:[28,6],p2:[18,40],p3:[42,46]},
    {p0:[42,46],p1:[66,52],p2:[82,46],p3:[72,66]},
    {p0:[72,66],p1:[62,82],p2:[45,80],p3:[42,78]}
  ];
  var pts=[];
  for(var s=0;s<segs.length;s++){
    var seg=segs[s],nPts=Math.round(n/3);
    for(var i=0;i<=nPts;i++){pts.push(bezierPoint(seg.p0,seg.p1,seg.p2,seg.p3,i/nPts));}
  }
  return pts;
}

// ─── Particle System ───
var PARTICLE_COUNT=100;
var particles=[];

function particleColor(i,total,vol){
  var hue=(260+i/total*120+vol*40)%360;
  var sat=60+vol*20;
  var lit=50+vol*25;
  var alpha=0.45+vol*0.45;
  return'hsla('+hue+','+sat+'%,'+lit+'%,'+alpha+')';
}

function initParticles(cw,ch){
  var sPts=sampleSCurve(PARTICLE_COUNT);
  var sx=cw/100,sy=ch/85;
  particles=[];
  for(var i=0;i<PARTICLE_COUNT;i++){
    var tx=sPts[i].x*sx,ty=sPts[i].y*sy;
    particles.push({
      tx:tx, ty:ty,
      x:Math.random()*cw,
      y:Math.random()*ch,
      vx:0, vy:0,
      phase:Math.random()*Math.PI*2,
      freq:0.3+Math.random()*0.7,
      orbitR:3+Math.random()*10
    });
  }
}

// ─── Render ───
var tinyCanvas=document.getElementById('logoTiny');
var tinyCtx=tinyCanvas.getContext('2d');
var bigCanvas=document.getElementById('logoBig');
var bigCtx=bigCanvas.getContext('2d');
var canvases=[{c:tinyCanvas,ctx:tinyCtx},{c:bigCanvas,ctx:bigCtx}];

var particlesPerCanvas=[];
canvases.forEach(function(cv){initParticles(cv.c.width,cv.c.height);particlesPerCanvas.push(particles.slice());});

function ensureParticles(){
  for(var ci=0;ci<canvases.length;ci++){
    if(particlesPerCanvas[ci].length!==PARTICLE_COUNT){
      initParticles(canvases[ci].c.width,canvases[ci].c.height);
      particlesPerCanvas[ci]=particles.slice();
    }
  }
}
ensureParticles();

var prevT=0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=Math.min(50,(ts-prevT))/1000;prevT=ts;if(dt<=0)dt=0.016;

  if(micActive)volume=readMicVolume();
  else if(demoOn)volume=demoVolume();
  else volume=Math.max(0,volume*0.92);

  document.getElementById('levelFill').style.width=(volume*100)+'%';
  var smoothVol=volume;

  for(var ci=0;ci<canvases.length;ci++){
    var cv=canvases[ci],ctx=cv.ctx,w=cv.c.width,h=cv.c.height;
    var ps=particlesPerCanvas[ci];
    if(ps.length!==PARTICLE_COUNT){ensureParticles();ps=particlesPerCanvas[ci];}

    ctx.clearRect(0,0,w,h);

    // Subtle S-glow when sound present
    if(smoothVol>0.05){
      ctx.save();ctx.globalAlpha=smoothVol*0.08;
      ctx.filter='blur('+(4+smoothVol*12)+'px)';
      ctx.beginPath();
      var gp=sampleSCurve(30);
      for(var i=0;i<gp.length;i++){
        var px=gp[i].x*(w/100),py=gp[i].y*(h/85);
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.strokeStyle='#a78bfa';ctx.lineWidth=2+smoothVol*4;ctx.stroke();
      ctx.restore();
    }

    // Update & draw particles
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      var attractForce=0.008+smoothVol*0.25*dt;

      // Kaleidoscope wandering (rest state)
      var kaleiStrength=(1-smoothVol)*1.8;
      var t=ts*0.001;
      var kx=Math.cos(t*p.freq+p.phase)*p.orbitR*kaleiStrength;
      var ky=Math.sin(t*p.freq*0.7+p.phase)*p.orbitR*kaleiStrength;
      kx+=Math.cos(t*0.3+p.phase*2)*p.orbitR*0.5*kaleiStrength;
      ky+=Math.sin(t*0.37+p.phase*1.7)*p.orbitR*0.5*kaleiStrength;

      var targetX=p.tx+kx;
      var targetY=p.ty+ky;

      var dx=targetX-p.x,dy=targetY-p.y;
      p.vx+=dx*attractForce;
      p.vy+=dy*attractForce;

      var damp=0.88+smoothVol*0.06;
      p.vx*=damp;
      p.vy*=damp;

      p.x+=p.vx*dt*60;
      p.y+=p.vy*dt*60;

      var r=1.0+smoothVol*2.2+(1-smoothVol)*1.0*Math.abs(Math.sin(t*2+p.phase));
      ctx.beginPath();
      ctx.arc(p.x,p.y,r,0,Math.PI*2);
      ctx.fillStyle=particleColor(i,PARTICLE_COUNT,smoothVol);
      ctx.fill();

      if(smoothVol>0.25&&r>2){
        ctx.beginPath();
        ctx.arc(p.x,p.y,r*2.5,0,Math.PI*2);
        ctx.fillStyle='hsla('+(260+i/PARTICLE_COUNT*120)+',70%,60%,'+(smoothVol*0.08)+')';
        ctx.fill();
      }
    }
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
