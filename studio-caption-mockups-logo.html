<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · Logo Concepts</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Bebas+Neue&family=Outfit:wght@300;400;600;800&family=Unbounded:wght@300;400;600;800&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh}h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:2px}@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}.subtitle{text-align:center;color:#8b93a5;margin-bottom:32px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:1200px;margin:0 auto}@media(max-width:800px){.grid{grid-template-columns:1fr}}.logo-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:20px;padding:32px;text-align:center;transition:all .4s;position:relative;overflow:hidden;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.logo-card:hover{transform:translateY(-4px);box-shadow:0 20px 60px rgba(0,0,0,.5);border-color:#2a2e3e}.logo-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(167,139,250,.03),transparent 70%);pointer-events:none}.logo-mark{position:relative;display:flex;align-items:center;justify-content:center}.logo-text{font-family:'Outfit','Unbounded',sans-serif;font-weight:800;letter-spacing:-1px}.logo-tagline{font-size:10px;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.2em;font-family:'JetBrains Mono',monospace}.logo-num{position:absolute;top:8px;right:12px;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.12)}@keyframes barDance{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}@keyframes dotPulse{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}@keyframes floatUp{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-40px);opacity:0}}</style></head><body><h1>🔷 Sottotitoli.ai · Logo Concepts</h1><p class="subtitle">Wave-inspired brand marks — Mirror Bars (#2) + Floating Dots (#22) — June 2026</p><div class="grid" id="logoGrid"></div><script>
function hsl(h,s,l,a){return a!==undefined?`hsla(${h},${s}%,${l}%,${a})`:`hsl(${h},${s}%,${l}%)`}
function audioBars(n){return Array.from({length:n},(_,i)=>{const b=Math.sin(i*0.7)*0.4+0.5;const n=(Math.sin(i*2.3+1.7)*0.25)+(Math.cos(i*1.1)*0.2);return Math.max(0.1,Math.min(1,b+n))})}

var logos=[];

// 1 — Mirror Bars as letter "S" (sottotitoli initial)
logos.push({n:1,name:'Wave S — Mirror Bars',tag:'sottotitoli.ai',build:function(){
  var bars=audioBars(8);var h='<div style="display:flex;align-items:center;gap:3px;height:80px">';
  bars.forEach((v,i)=>{h+=`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:center"><div style="width:6px;height:${v*35}px;background:linear-gradient(180deg,#a78bfa,#60a5fa);border-radius:3px;animation:barDance ${0.6+i*0.07}s ease infinite;animation-delay:${i*0.04}s"></div></div>`});
  h+='<span class="logo-text" style="font-size:48px;color:#c4b5fd;margin-left:12px">S</span></div>';
  return h;
}});

// 2 — Mirror Bars as full word
logos.push({n:2,name:'Full Wordmark + Bars',tag:'SOTTOTITOLI',build:function(){
  var bars=audioBars(14);var h='<div style="display:flex;align-items:flex-end;gap:2px;height:70px;margin-bottom:8px">';
  bars.forEach((v,i)=>{h+=`<div style="flex:1;height:${v*100}%;background:linear-gradient(180deg,${hsl(260+i*8,70,60)},${hsl(260+i*8,50,40)});border-radius:3px 3px 0 0;animation:barDance ${0.5+i*0.06}s ease infinite;animation-delay:${i*0.04}s"></div>`});
  h+='</div><span class="logo-text" style="font-size:28px;background:linear-gradient(90deg,#a78bfa,#60a5fa,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent">SOTTOTITOLI</span>';
  return h;
}});

// 3 — Floating dots forming the .ai
logos.push({n:3,name:'Dot Cloud .ai',tag:'sottotitoli.ai',build:function(){
  var h='<div style="position:relative;width:160px;height:100px;margin-bottom:8px">';
  for(var i=0;i<35;i++){var x=20+Math.random()*120;var y=10+Math.random()*80;var s=2+Math.random()*6;var hue=240+Math.random()*120;
    h+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:${hsl(hue,70,65)};animation:dotPulse ${1+Math.random()*1.5}s ease infinite;animation-delay:${Math.random()}s;box-shadow:0 0 ${s*3}px ${hsl(hue,70,65,.4)}"></div>`}
  h+='</div><span class="logo-text" style="font-size:32px;color:#c4b5fd">.ai</span>';
  return h;
}});

// 4 — Combined: bars left, dots right, wordmark center
logos.push({n:4,name:'Bars + Word + Dots',tag:'SOTTOTITOLI',build:function(){
  var bars=audioBars(5);var h='<div style="display:flex;align-items:center;gap:16px">';
  h+='<div style="display:flex;align-items:flex-end;gap:2px;height:50px">';
  bars.forEach((v,i)=>{h+=`<div style="width:4px;height:${v*100}%;background:linear-gradient(180deg,#a78bfa,#818cf8);border-radius:2px;animation:barDance ${0.6+i*0.1}s ease infinite;animation-delay:${i*0.05}s"></div>`});
  h+='</div>';
  h+='<span class="logo-text" style="font-size:30px;background:linear-gradient(90deg,#c4b5fd,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent">SOTTOTITOLI</span>';
  h+='<div style="position:relative;width:60px;height:50px">';
  for(var i=0;i<15;i++){var x=5+Math.random()*50;var y=5+Math.random()*40;var s=1.5+Math.random()*4;
    h+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:${hsl(200+Math.random()*160,70,65)};animation:dotPulse ${1+Math.random()}s ease infinite;animation-delay:${Math.random()}s"></div>`}
  h+='</div></div>';
  return h;
}});

// 5 — Vertical mirror bars as icon
logos.push({n:5,name:'Vertical Icon Mark',tag:'sottotitoli.ai',build:function(){
  var bars=audioBars(12);var h='<div style="display:flex;align-items:flex-end;gap:2px;height:80px;margin-bottom:12px">';
  bars.forEach((v,i)=>{h+=`<div style="flex:1;height:${v*100}%;background:${hsl(260+i*12,65,58)};border-radius:2px;animation:barDance ${0.5+i*0.06}s ease infinite;animation-delay:${i*0.04}s"></div>`});
  h+='</div><span class="logo-text" style="font-size:14px;color:rgba(255,255,255,.4);letter-spacing:.15em">SOTTOTITOLI.AI</span>';
  return h;
}});

// 6 — Dot constellation S
logos.push({n:6,name:'Dot Constellation S',tag:'sottotitoli',build:function(){
  var h='<div style="position:relative;width:140px;height:100px;margin-bottom:8px">';
  var points=[{x:70,y:8},{x:95,y:18},{x:110,y:35},{x:95,y:50},{x:70,y:55},{x:50,y:65},{x:35,y:80},{x:55,y:90},{x:75,y:85},{x:90,y:78},{x:100,y:65},{x:90,y:50},{x:70,y:35},{x:50,y:25},{x:35,y:15},{x:50,y:8}];
  points.forEach((p,i)=>{h+=`<div style="position:absolute;left:${p.x}px;top:${p.y}px;width:${3+Math.sin(i)*2}px;height:${3+Math.sin(i)*2}px;border-radius:50%;background:${hsl(260+i*15,70,65)};animation:dotPulse ${0.8+i*0.08}s ease infinite;animation-delay:${i*0.05}s;box-shadow:0 0 6px ${hsl(260+i*15,70,65,.5)}"></div>`});
  h+='</div><span class="logo-text" style="font-size:16px;color:#a78bfa">sottotitoli.ai</span>';
  return h;
}});

var grid=document.getElementById('logoGrid');
logos.forEach(function(l,i){
  var card=document.createElement('div');card.className='logo-card';
  card.innerHTML='<span class="logo-num">#'+l.n+'</span><div class="logo-mark">'+l.build()+'</div><span class="logo-tagline">'+l.tag+'</span>';
  grid.appendChild(card);
});
</script></body></html>
