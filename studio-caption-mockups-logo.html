<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Particle S Logo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:20px}
h1{font-size:clamp(20px,4vw,28px);font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.mic-status{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;font-size:11px;font-weight:600}
.mic-status.off{background:rgba(255,255,255,.03);color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.06)}
.mic-status.on{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)}
.mic-dot{width:7px;height:7px;border-radius:50%}.mic-status.off .mic-dot{background:rgba(255,255,255,.15)}.mic-status.on .mic-dot{background:#34d399;animation:pulse 1.5s ease infinite}
.level-bar{width:100%;max-width:300px;height:3px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden}
.level-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);transition:width .1s;width:0%}
.controls-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.controls-row button{padding:8px 18px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;transition:all .15s}
.controls-row button:hover{border-color:#a78bfa;color:#a78bfa}
.controls-row button.demo{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:#34d399}
.logo-stage{position:relative;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:32px}
.logo-box{text-align:center}
.logo-label{font-size:10px;color:rgba(255,255,255,.25);font-family:'JetBrains Mono',monospace;margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
#logoTiny{width:36px;height:30px;border-radius:4px}
#logoBig{width:180px;height:150px;border-radius:8px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<h1>Particle S 2 — Sound‑Reactive Logo</h1>
<p style="font-size:12px;color:rgba(255,255,255,.35);margin-top:-12px" id="varDesc">Kaleidoscope rest · S‑drift on voice</p>

<div class="controls-row">
  <button id="micBtn" onclick="toggleMic()">🎤 Start Mic</button>
  <button class="demo" id="demoBtn" onclick="toggleDemo()">▶ Demo Voice</button>
</div>
<div class="mic-status off" id="micStatus"><span class="mic-dot"></span> Mic off</div>
<div class="level-bar"><div class="level-fill" id="levelFill"></div></div>

<div class="controls-row">
  <button onclick="prevVar()" style="width:28px;height:28px;border-radius:50%;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center">←</button>
  <span id="varLabel" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.35);min-width:120px;text-align:center">1/10 · Original</span>
  <button onclick="nextVar()" style="width:28px;height:28px;border-radius:50%;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center">→</button>
</div>

<div class="logo-stage">
  <div class="logo-box">
    <canvas id="logoTiny" width="72" height="60"></canvas>
    <div class="logo-label">topbar 36×30</div>
  </div>
  <div class="logo-box">
    <canvas id="logoBig" width="360" height="300"></canvas>
    <div class="logo-label">preview 180×150</div>
  </div>
</div>

<!-- ═══ Incorporation Mockup — Logo as the "S" in Sottotitoli ═══ -->
<div style="margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.06);text-align:center;max-width:700px">
  <h3 style="font-size:13px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:14px">🔤 Incorporation: Logo as the "S"</h3>

  <!-- Option A: Inline with text -->
  <div style="background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px;justify-content:center">
    <span style="font-size:10px;color:rgba(255,255,255,.2);font-family:'JetBrains Mono',monospace;min-width:60px;text-align:right">A · inline</span>
    <canvas id="incA" width="36" height="30" style="width:36px;height:30px;border-radius:4px;vertical-align:middle"></canvas>
    <span style="font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;letter-spacing:-0.5px;color:#e8eaed">ottotitoli</span>
  </div>

  <!-- Option B: Above the word -->
  <div style="background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;flex-direction:column;align-items:center;gap:2px">
    <span style="font-size:10px;color:rgba(255,255,255,.2);font-family:'JetBrains Mono',monospace">B · above</span>
    <canvas id="incB" width="48" height="40" style="width:48px;height:40px;border-radius:6px"></canvas>
    <span style="font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;letter-spacing:-0.5px;color:#e8eaed">ottotitoli</span>
  </div>

  <!-- Option C: Left of topbar text -->
  <div style="background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px 16px;margin-bottom:10px;display:flex;align-items:center;gap:8px">
    <span style="font-size:10px;color:rgba(255,255,255,.2);font-family:'JetBrains Mono',monospace">C · topbar</span>
    <canvas id="incC" width="28" height="24" style="width:28px;height:24px;border-radius:3px"></canvas>
    <span style="font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;letter-spacing:-0.3px;color:rgba(255,255,255,.85)">Sottotitoli</span>
    <span style="flex:1"></span>
    <span style="font-size:8px;padding:3px 8px;border-radius:100px;background:rgba(52,211,153,.1);color:#34d399;font-weight:600">Menu</span>
  </div>
</div>

<script>
// ─── Audio ───
var audioCtx=null,analyser=null,micStream=null,micActive=false,volume=0,demoOn=false;

async function toggleMic(){micActive?stopMic():startMic();}
async function startMic(){
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;audioCtx.createMediaStreamSource(micStream).connect(analyser);micActive=true;updateMicUI('on');}catch(e){alert('Mic denied: '+e.message);}
}
function stopMic(){if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}if(audioCtx){audioCtx.close();audioCtx=null;analyser=null}micActive=false;volume=0;updateMicUI('off');}
function updateMicUI(s){
  var btn=document.getElementById('micBtn'),st=document.getElementById('micStatus');
  if(s==='on'){btn.textContent='⏹ Stop Mic';btn.style.borderColor='rgba(248,113,113,.3)';btn.style.color='#f87171';st.className='mic-status on';st.innerHTML='<span class="mic-dot"></span> Mic live';}
  else{btn.textContent='🎤 Start Mic';btn.style.borderColor='rgba(255,255,255,.1)';btn.style.color='rgba(255,255,255,.5)';st.className='mic-status off';st.innerHTML='<span class="mic-dot"></span> Mic off';document.getElementById('levelFill').style.width='0%';}
}

function readMicVolume(){
  if(!micActive||!analyser)return 0;
  var data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);
  var sum=0;for(var i=0;i<data.length;i++)sum+=data[i];
  return Math.min(1,sum/data.length/128);
}

function toggleDemo(){demoOn=!demoOn;document.getElementById('demoBtn').textContent=demoOn?'⏹ Stop Demo':'▶ Demo Voice';}
function demoVolume(){
  var t=performance.now()*0.001;
  // Boosted demo so meter can reach max
  return Math.max(0,Math.min(1,0.22+Math.sin(t*0.7)*0.35+Math.sin(t*1.3)*0.35+Math.sin(t*2.1)*0.25));
}

// ─── S-Curve (100×85 coord space, scaled to canvas) ───
var S_PATH='M55,6 C28,6 18,40 42,46 C66,52 82,46 72,66 C62,82 45,80 42,78';

function bezierPoint(p0,p1,p2,p3,t){
  var u=1-t;
  return {
    x:u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],
    y:u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]
  };
}

function sampleSCurve(n){
  var segs=[
    {p0:[55,6],p1:[28,6],p2:[18,40],p3:[42,46]},
    {p0:[42,46],p1:[66,52],p2:[82,46],p3:[72,66]},
    {p0:[72,66],p1:[62,82],p2:[45,80],p3:[42,78]}
  ];
  var pts=[];
  for(var s=0;s<segs.length;s++){
    var seg=segs[s],nPts=Math.round(n/3);
    for(var i=0;i<=nPts;i++){pts.push(bezierPoint(seg.p0,seg.p1,seg.p2,seg.p3,i/nPts));}
  }
  return pts;
}

// ─── 2 Variation Configs ───
var currentVar=0;
var variations=[
  {name:'Ember Swarm',desc:'150pt · warm fire tones · gentle',              n:150, hue0:10,  hueR:50,  orbMin:3, orbMax:12, damp:0.90, attr:0.006, size0:0.9, sizeV:2.0, glow:0.10, kalei:2.0},
  {name:'Frost Mist', desc:'120pt · icy blue · ghostly smooth',             n:120, hue0:190, hueR:60,  orbMin:4, orbMax:14, damp:0.94, attr:0.005, size0:0.8, sizeV:1.5, glow:0.06, kalei:2.2}
];

function switchVariation(idx){
  currentVar=idx;
  var v=variations[currentVar];
  document.getElementById('varLabel').textContent=(currentVar+1)+'/2 · '+v.name;
  document.getElementById('varDesc').textContent=v.desc;
  // Re-init particles for new config
  for(var ci=0;ci<canvases.length;ci++){
    initParticlesForCanvas(canvases[ci].c.width,canvases[ci].c.height,ci);
  }
}
function nextVar(){switchVariation((currentVar+1)%variations.length);}
function prevVar(){switchVariation((currentVar+variations.length-1)%variations.length);}

// ─── Particle System ───
function particleColor(i,total,vol){
  var v=variations[currentVar];
  var hue=((v.hue0||260)+i/total*(v.hueR||120)+vol*40)%360;
  var sat=60+vol*20;
  var lit=50+vol*25;
  var alpha=0.45+vol*0.45;
  return'hsla('+hue+','+sat+'%,'+lit+'%,'+alpha+')';
}

function initParticlesForCanvas(cw,ch,canvasIdx){
  var v=variations[currentVar];
  // Big canvas (idx=1) gets 3x particles, small (idx=0) gets 1x
  var n=canvasIdx===0?(v.n||100):(v.n||100)*3;
  var sPts=sampleSCurve(n);
  var sx=cw/100,sy=ch/85;
  var ps=[];
  for(var i=0;i<n;i++){
    var tx=sPts[i].x*sx,ty=sPts[i].y*sy;
    ps.push({
      tx:tx, ty:ty,
      x:Math.random()*cw,
      y:Math.random()*ch,
      vx:0, vy:0,
      phase:Math.random()*Math.PI*2,
      freq:0.3+Math.random()*0.7,
      orbitR:(v.orbMin||3)+Math.random()*((v.orbMax||10)-(v.orbMin||3))
    });
  }
  particlesPerCanvas[canvasIdx]=ps;
}

// ─── Render ───
var tinyCanvas=document.getElementById('logoTiny');
var tinyCtx=tinyCanvas.getContext('2d');
var bigCanvas=document.getElementById('logoBig');
var bigCtx=bigCanvas.getContext('2d');
var canvases=[{c:tinyCanvas,ctx:tinyCtx},{c:bigCanvas,ctx:bigCtx}];

var particlesPerCanvas=[[],[]];
for(var ci=0;ci<canvases.length;ci++){initParticlesForCanvas(canvases[ci].c.width,canvases[ci].c.height,ci);}

var prevT=0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=Math.min(50,(ts-prevT))/1000;prevT=ts;if(dt<=0)dt=0.016;

  if(micActive)volume=readMicVolume();
  else if(demoOn)volume=demoVolume();
  else volume=Math.max(0,volume*0.92);

  document.getElementById('levelFill').style.width=(volume*100)+'%';
  var smoothVol=volume;
  var v=variations[currentVar];

  for(var ci=0;ci<canvases.length;ci++){
    var cv=canvases[ci],ctx=cv.ctx,w=cv.c.width,h=cv.c.height;
    var expectedN=ci===0?(v.n||100):(v.n||100)*3;
    var ps=particlesPerCanvas[ci];
    if(ps.length!==expectedN){initParticlesForCanvas(w,h,ci);ps=particlesPerCanvas[ci];}

    ctx.clearRect(0,0,w,h);

    // Subtle S-glow when sound present
    if(smoothVol>0.05&&(v.glow||0.08)>0){
      ctx.save();ctx.globalAlpha=smoothVol*(v.glow||0.08);
      ctx.filter='blur('+(4+smoothVol*12)+'px)';
      ctx.beginPath();
      var gp=sampleSCurve(30);
      for(var i=0;i<gp.length;i++){
        var px=gp[i].x*(w/100),py=gp[i].y*(h/85);
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
      }
      ctx.strokeStyle='#a78bfa';ctx.lineWidth=2+smoothVol*4;ctx.stroke();
      ctx.restore();
    }

    // Update & draw particles
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      var attractForce=(v.attr||0.008)+smoothVol*0.25*dt;

      // Kaleidoscope wandering (rest state)
      var kaleiStrength=(1-smoothVol)*(v.kalei||1.8);
      var t=ts*0.001;
      var kx=Math.cos(t*p.freq+p.phase)*p.orbitR*kaleiStrength;
      var ky=Math.sin(t*p.freq*0.7+p.phase)*p.orbitR*kaleiStrength;
      kx+=Math.cos(t*0.3+p.phase*2)*p.orbitR*0.5*kaleiStrength;
      ky+=Math.sin(t*0.37+p.phase*1.7)*p.orbitR*0.5*kaleiStrength;

      var targetX=p.tx+kx;
      var targetY=p.ty+ky;

      var dx=targetX-p.x,dy=targetY-p.y;
      p.vx+=dx*attractForce;
      p.vy+=dy*attractForce;

      var damp=(v.damp||0.88)+smoothVol*0.04;
      p.vx*=damp;
      p.vy*=damp;

      p.x+=p.vx*dt*60;
      p.y+=p.vy*dt*60;

      var r=(v.size0||1.0)+smoothVol*(v.sizeV||2.2)+(1-smoothVol)*1.0*Math.abs(Math.sin(t*2+p.phase));
      ctx.beginPath();
      ctx.arc(p.x,p.y,r,0,Math.PI*2);
      ctx.fillStyle=particleColor(i,ps.length,smoothVol);
      ctx.fill();

      if(smoothVol>0.25&&r>2){
        ctx.beginPath();
        ctx.arc(p.x,p.y,r*2.5,0,Math.PI*2);
        ctx.fillStyle='hsla('+((v.hue0||260)+i/ps.length*(v.hueR||120))+',70%,60%,'+(smoothVol*0.08)+')';
        ctx.fill();
      }
    }
  }
}
requestAnimationFrame(frame);
switchVariation(0);

// ─── Incorporation canvases ───
(function(){
  var incCanvases=[
    {c:document.getElementById('incA'),w:72,h:60},
    {c:document.getElementById('incB'),w:96,h:80},
    {c:document.getElementById('incC'),w:56,h:48}
  ];
  incCanvases.forEach(function(cv){
    cv.c.width=cv.w;cv.c.height=cv.h;
    cv.ctx=cv.c.getContext('2d');
    cv.ps=[];cv.vol=0.15;
    // Init particles for this mini canvas using current variation
    var v=variations[0];
    var n=v.n||100;
    var sPts=sampleSCurve(n);
    var sx=cv.w/100,sy=cv.h/85;
    for(var i=0;i<n;i++){
      cv.ps.push({
        tx:sPts[i].x*sx,ty:sPts[i].y*sy,
        x:Math.random()*cv.w,y:Math.random()*cv.h,
        vx:0,vy:0,
        phase:Math.random()*Math.PI*2,
        freq:0.3+Math.random()*0.7,
        orbitR:(v.orbMin||3)+Math.random()*((v.orbMax||10)-(v.orbMin||3))
      });
    }
  });

  function renderInc(ts){
    requestAnimationFrame(renderInc);
    var t=ts*0.001;
    incCanvases.forEach(function(cv){
      var ctx=cv.ctx,w=cv.w,h=cv.h;
      ctx.clearRect(0,0,w,h);
      var v=variations[0],smoothVol=cv.vol+Math.sin(t*0.5)*0.05;
      for(var i=0;i<cv.ps.length;i++){
        var p=cv.ps[i];
        var attractForce=0.006;
        var kaleiStrength=1.8;
        var kx=Math.cos(t*p.freq+p.phase)*p.orbitR*kaleiStrength;
        var ky=Math.sin(t*p.freq*0.7+p.phase)*p.orbitR*kaleiStrength;
        kx+=Math.cos(t*0.3+p.phase*2)*p.orbitR*0.5*kaleiStrength;
        ky+=Math.sin(t*0.37+p.phase*1.7)*p.orbitR*0.5*kaleiStrength;
        var targetX=p.tx+kx,targetY=p.ty+ky;
        p.vx+=(targetX-p.x)*attractForce;
        p.vy+=(targetY-p.y)*attractForce;
        p.vx*=0.90;p.vy*=0.90;
        p.x+=p.vx*0.06;p.y+=p.vy*0.06;
        var r=0.8+Math.abs(Math.sin(t*2+p.phase))*0.6;
        ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
        var hue=(v.hue0+i/cv.ps.length*v.hueR)%360;
        ctx.fillStyle='hsla('+hue+',60%,55%,0.45)';
        ctx.fill();
      }
    });
  }
  requestAnimationFrame(renderInc);
})();
</script>
</body>
</html>
