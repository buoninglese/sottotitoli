<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Particle Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh;text-align:center}
h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:4px}
@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.subtitle{color:#8b93a5;margin-bottom:8px;font-size:13px}
.mic-status{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;font-size:11px;font-weight:600;margin-bottom:24px;transition:all .3s}
.mic-status.off{background:rgba(255,255,255,.03);color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.06)}
.mic-status.on{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)}
.mic-dot{width:7px;height:7px;border-radius:50%}
.mic-status.off .mic-dot{background:rgba(255,255,255,.15)}
.mic-status.on .mic-dot{background:#34d399;animation:pulse 1.5s ease infinite}
.level-bar{width:100%;max-width:400px;height:3px;background:rgba(255,255,255,.04);border-radius:2px;margin:0 auto 20px;overflow:hidden}
.level-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);transition:width .1s ease;width:0%}
.cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:28px 20px;transition:all .4s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:260px;flex:1;min-width:300px;position:relative;overflow:hidden}
.card.active{border-color:rgba(167,139,250,.2);box-shadow:0 0 30px rgba(167,139,250,.08)}
.card-num{position:absolute;top:10px;right:14px;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.1)}
.card-label{font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.08em;text-transform:uppercase}
canvas{display:block}
button.mic-btn{padding:10px 24px;border-radius:100px;border:1px solid rgba(52,211,153,.2);background:rgba(52,211,153,.08);color:#34d399;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;margin:0 4px}
button.mic-btn:hover{background:rgba(52,211,153,.15)}
button.mic-btn.stop{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.2);color:#f87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<h1>Sottotitoli · Particle Logo</h1>
<p class="subtitle">Speak — particles spell the name at max volume</p>
<div>
  <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤 Start Mic</button>
  <button class="mic-btn" id="demoBtn" onclick="toggleDemo()" style="border-color:rgba(167,139,250,.2);color:#a78bfa;background:rgba(167,139,250,.06)">▶ Demo</button>
</div>
<div class="mic-status off" id="micStatus"><span class="mic-dot"></span> Mic off</div>
<div class="level-bar"><div class="level-fill" id="levelFill"></div></div>
<div class="cards">
  <div class="card" id="card1">
    <span class="card-num">#1</span>
    <canvas id="cv1" width="500" height="180"></canvas>
    <div class="card-label">Particle Cloud</div>
  </div>
  <div class="card" id="card2">
    <span class="card-num">#2</span>
    <canvas id="cv2" width="500" height="180"></canvas>
    <div class="card-label">Scatter</div>
  </div>
</div>
<script>
var audioCtx=null,analyser=null,micStream=null,micActive=false,volume=0;
var demoRunning=false,demoAnimId=null;

// ── Letter paths for "sottotitoli" ──
// Each letter defined as a set of [x,y] points (normalized 0..1)
function getLetterPaths(){
  var W=500,H=180;
  var letters='sottotitoli';
  var paths=[];
  var totalLetters=letters.length;
  var letterW=W/(totalLetters+1);
  var startX=letterW*0.5;
  var cy=H/2;
  var lh=H*0.35;
  
  // Draw each letter as bitmap points
  var ctx=document.createElement('canvas').getContext('2d');
  ctx.canvas.width=W;ctx.canvas.height=H;
  ctx.fillStyle='#fff';
  ctx.font='bold 72px Outfit,Inter,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  
  for(var i=0;i<totalLetters;i++){
    var ch=letters[i];
    var cx=startX+i*letterW;
    ctx.clearRect(0,0,W,H);
    ctx.fillText(ch,cx,cy);
    var imgData=ctx.getImageData(0,0,W,H);
    var letterPts=[];
    // Sample points from the letter shape
    for(var py=0;py<H;py+=3){
      for(var px=0;px<W;px+=3){
        var idx=(py*W+px)*4;
        if(imgData.data[idx+3]>128){
          letterPts.push([px,py]);
        }
      }
    }
    if(letterPts.length>0) paths.push({letter:ch,pts:letterPts});
  }
  return paths;
}

var letterPaths=getLetterPaths();

// Build particle sets for each logo
function buildParticles(count){
  var pts=[];
  for(var i=0;i<count;i++){
    pts.push({
      rx:Math.random()*500,ry:Math.random()*180, // random position
      tx:0,ty:0, // target (will be set per frame)
      color:'hsl('+(180+Math.random()*200)+',70%,'+(45+Math.random()*30)+'%)',
      r:1.5+Math.random()*3,
      phase:Math.random()*Math.PI*2
    });
  }
  return pts;
}

var particles1=buildParticles(300);
var particles2=buildParticles(400);
// Flatten letter paths into a single target array
var allLetterPts=[];
letterPaths.forEach(function(lp){allLetterPts=allLetterPts.concat(lp.pts)});

function assignTargets(particles,vol){
  var count=particles.length;
  var letterCount=allLetterPts.length;
  
  for(var i=0;i<count;i++){
    var p=particles[i];
    if(vol<0.05){
      // Random target
      p.tx=Math.random()*500;p.ty=Math.random()*180;
    }else{
      // Map to letter points
      var idx=Math.floor(i/count*letterCount);
      var lp=allLetterPts[idx%letterCount];
      // Blend between random and letter position based on volume
      var blend=Math.pow(vol,0.6);
      p.tx=lp[0]*blend+p.rx*(1-blend);
      p.ty=lp[1]*blend+p.ry*(1-blend);
    }
  }
}

// ── Render canvas ──
function renderCanvas(canvas,particles,vol,isDark){
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  
  assignTargets(particles,vol);
  
  // Draw connections between nearby particles at higher volumes
  if(vol>0.3){
    var connAlpha=vol*0.15;
    for(var i=0;i<particles.length;i+=3){
      for(var j=i+3;j<particles.length;j+=3){
        var dx=particles[i].tx-particles[j].tx;
        var dy=particles[i].ty-particles[j].ty;
        var dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<25*vol){
          ctx.beginPath();
          ctx.moveTo(particles[i].tx,particles[i].ty);
          ctx.lineTo(particles[j].tx,particles[j].ty);
          ctx.strokeStyle='rgba(167,139,250,'+(connAlpha*(1-dist/(25*vol)))+')';
          ctx.lineWidth=0.3;
          ctx.stroke();
        }
      }
    }
  }
  
  // Draw particles
  particles.forEach(function(p,i){
    // Smooth movement toward target
    p.rx+=(p.tx-p.rx)*0.08;
    p.ry+=(p.ty-p.ry)*0.08;
    
    var hue=180+i*0.5+vol*80;
    var lum=40+vol*35;
    var alpha=0.4+vol*0.5;
    
    ctx.beginPath();
    ctx.arc(p.rx,p.ry,p.r*(0.7+vol*0.5),0,Math.PI*2);
    ctx.fillStyle='hsla('+hue+',70%,'+lum+'%,'+alpha+')';
    ctx.fill();
    
    // Glow at high volume
    if(vol>0.5){
      ctx.beginPath();
      ctx.arc(p.rx,p.ry,p.r*1.8,0,Math.PI*2);
      ctx.fillStyle='hsla('+hue+',80%,'+Math.min(90,lum+20)+'%,'+(alpha*0.2)+')';
      ctx.fill();
    }
  });
}

// ── Update all ──
function updateAllVisuals(vol){
  var isDark=true;
  renderCanvas(document.getElementById('cv1'),particles1,vol,isDark);
  renderCanvas(document.getElementById('cv2'),particles2,vol,isDark);
  
  // Card glow
  [document.getElementById('card1'),document.getElementById('card2')].forEach(function(c){
    if(vol>0.05) c.classList.add('active');else c.classList.remove('active');
  });
}

// ── Mic ──
function toggleMic(){
  if(micActive){stopMic();return}
  if(demoRunning) stopDemo();
  startMic();
}
async function startMic(){
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();analyser.fftSize=256;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    micActive=true;
    document.getElementById('micBtn').textContent='⏹ Stop Mic';
    document.getElementById('micBtn').classList.add('stop');
    document.getElementById('micStatus').className='mic-status on';
    document.getElementById('micStatus').innerHTML='<span class="mic-dot"></span> Mic live';
    updateVolume();
  }catch(e){alert('Mic denied: '+e.message)}
}
function stopMic(){
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}
  if(audioCtx){audioCtx.close();audioCtx=null;analyser=null}
  micActive=false;volume=0;
  document.getElementById('micBtn').textContent='🎤 Start Mic';
  document.getElementById('micBtn').classList.remove('stop');
  document.getElementById('micStatus').className='mic-status off';
  document.getElementById('micStatus').innerHTML='<span class="mic-dot"></span> Mic off';
  document.getElementById('levelFill').style.width='0%';
  updateAllVisuals(0);
}
function updateVolume(){
  if(!micActive||!analyser) return;
  var data=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  var sum=0;for(var i=0;i<data.length;i++) sum+=data[i];
  volume=Math.min(1,sum/data.length/128);
  document.getElementById('levelFill').style.width=(volume*100)+'%';
  updateAllVisuals(volume);
  requestAnimationFrame(updateVolume);
}

// ── Demo ──
function toggleDemo(){
  if(demoRunning){stopDemo();return}
  if(micActive) stopMic();
  demoRunning=true;
  document.getElementById('demoBtn').textContent='⏹ Stop Demo';
  document.getElementById('demoBtn').style.borderColor='rgba(248,113,113,.2)';
  document.getElementById('demoBtn').style.color='#f87171';
  document.getElementById('demoBtn').style.background='rgba(248,113,113,.06)';
  document.getElementById('micStatus').className='mic-status on';
  document.getElementById('micStatus').innerHTML='<span class="mic-dot"></span> Demo — forming name';
  runDemo();
}
function stopDemo(){
  demoRunning=false;
  if(demoAnimId){cancelAnimationFrame(demoAnimId);demoAnimId=null}
  document.getElementById('demoBtn').textContent='▶ Demo';
  document.getElementById('demoBtn').style.borderColor='rgba(167,139,250,.2)';
  document.getElementById('demoBtn').style.color='#a78bfa';
  document.getElementById('demoBtn').style.background='rgba(167,139,250,.06)';
  document.getElementById('micStatus').className='mic-status off';
  document.getElementById('micStatus').innerHTML='<span class="mic-dot"></span> Mic off';
  document.getElementById('levelFill').style.width='0%';
  updateAllVisuals(0);
}
function runDemo(){
  if(!demoRunning) return;
  demoAnimId=requestAnimationFrame(runDemo);
  var cycleLen=6000;
  var t=(Date.now()%cycleLen)/cycleLen;
  var vol;
  if(t<0.35){vol=Math.sin(t/0.35*Math.PI/2)}
  else if(t<0.45){vol=1}
  else if(t<0.8){vol=Math.cos((t-0.45)/0.35*Math.PI/2)}
  else{vol=0}
  document.getElementById('levelFill').style.width=(vol*100)+'%';
  updateAllVisuals(vol);
}

// Init
updateAllVisuals(0);
</script>
</body>
</html>
