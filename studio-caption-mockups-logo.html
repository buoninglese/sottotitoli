<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Dense Particles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh;text-align:center}
h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:titleShift 6s linear infinite;margin-bottom:4px}
@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.subtitle{color:#8b93a5;margin-bottom:24px;font-size:12px}
.controls{margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;max-width:1600px;margin:0 auto}
.card{background:#0f121e;border:1px solid #1a1e2e;border-radius:14px;padding:16px;transition:all .25s;position:relative;overflow:hidden}
.card:hover{border-color:#2a2e3e;transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.card-num{font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(255,255,255,.15);margin-bottom:4px}
.card-title{font-size:10px;font-weight:600;color:rgba(255,255,255,.4);margin-bottom:6px;line-height:1.3}
.card canvas{display:block;width:100%;height:140px;border-radius:8px}
button.mic-btn{padding:10px 24px;border-radius:100px;border:1px solid rgba(167,139,250,.2);background:rgba(167,139,250,.06);color:#a78bfa;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;margin:0 4px}
button.mic-btn:hover{background:rgba(167,139,250,.12)}
</style>
</head>
<body>
<h1>Dense + Large Particles</h1>
<p class="subtitle">20 variations — dense clouds &amp; large particles forming "sottotitoli"</p>
<div class="controls">
  <button class="mic-btn" id="demoBtn" onclick="toggleDemo()">▶ Demo All</button>
  <span style="display:inline-flex;align-items:center;gap:6px;font-size:10px;color:rgba(255,255,255,.3);font-family:'JetBrains Mono',monospace">
    speed <input type="range" id="speedSlider" min="0.2" max="3" step="0.1" value="1" oninput="updateSpeed(this.value)" style="width:70px;accent-color:#a78bfa"> <span id="speedLabel">1.0x</span>
  </span>
</div>
<div class="grid" id="grid"></div>
<script>
var demoRunning=false,demoAnimId=null,globalSpeed=1;
function updateSpeed(v){globalSpeed=parseFloat(v);document.getElementById('speedLabel').textContent=globalSpeed.toFixed(1)+'x'}

function getLetterPaths(W,H,fontSize){
  var letters='sottotitoli';var paths=[];
  var ctx=document.createElement('canvas').getContext('2d');
  ctx.canvas.width=W;ctx.canvas.height=H;ctx.fillStyle='#fff';
  ctx.font='bold '+fontSize+'px Outfit,Inter,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  var lw=W/(letters.length+1),sx=lw*0.5;
  for(var i=0;i<letters.length;i++){
    ctx.clearRect(0,0,W,H);ctx.fillText(letters[i],sx+i*lw,H/2);
    var img=ctx.getImageData(0,0,W,H);var pts=[];
    for(var py=0;py<H;py+=2)for(var px=0;px<W;px+=2){if(img.data[(py*W+px)*4+3]>128)pts.push([px,py])}
    if(pts.length>0) paths.push({letter:letters[i],pts:pts});
  }
  return paths;
}

// ═══════════════════════════════
// 20 variations — dense clouds + large particles
// ═══════════════════════════════
var configs=[
  {name:'Dense base (500)',count:500,lerp:0.08,connect:30,glow:1.5,sizeMul:0.6,hueBase:180,hueRange:200,fontSize:80},
  {name:'Large base (120)',count:120,lerp:0.08,connect:25,glow:1.8,sizeMul:2.5,hueBase:180,hueRange:200,fontSize:80},
  {name:'Dense ×1.5 (750)',count:750,lerp:0.07,connect:35,glow:1.3,sizeMul:0.5,hueBase:180,hueRange:200,fontSize:80},
  {name:'Dense slow drift',count:500,lerp:0.04,connect:30,glow:1.5,sizeMul:0.6,hueBase:200,hueRange:160,fontSize:80},
  {name:'Dense monochrome',count:500,lerp:0.08,connect:30,glow:1.5,sizeMul:0.6,hueBase:270,hueRange:5,fontSize:80},
  {name:'Dense duotone',count:500,lerp:0.08,connect:30,glow:1.5,sizeMul:0.6,hueBase:260,hueRange:100,fontSize:80,colorMode:'duo'},
  {name:'Dense warm',count:500,lerp:0.08,connect:30,glow:1.5,sizeMul:0.6,hueBase:15,hueRange:50,fontSize:80},
  {name:'Dense no connect',count:500,lerp:0.08,connect:0,glow:1.5,sizeMul:0.6,hueBase:180,hueRange:200,fontSize:80},
  {name:'Dense hyper-glow',count:400,lerp:0.08,connect:25,glow:3.5,sizeMul:0.7,hueBase:180,hueRange:200,fontSize:80},
  {name:'Dense 1000 mega',count:1000,lerp:0.06,connect:40,glow:1.2,sizeMul:0.4,hueBase:180,hueRange:200,fontSize:80},
  {name:'Large ×2 (240)',count:240,lerp:0.07,connect:20,glow:2,sizeMul:2.8,hueBase:180,hueRange:200,fontSize:80},
  {name:'Large slow majestic',count:120,lerp:0.03,connect:20,glow:2.5,sizeMul:3,hueBase:260,hueRange:60,fontSize:80},
  {name:'Large gold',count:120,lerp:0.08,connect:25,glow:1.8,sizeMul:2.5,hueBase:42,hueRange:15,fontSize:80},
  {name:'Large emerald',count:120,lerp:0.08,connect:25,glow:1.8,sizeMul:2.5,hueBase:160,hueRange:20,fontSize:80},
  {name:'Large fast snappy',count:120,lerp:0.2,connect:30,glow:2,sizeMul:2.2,hueBase:180,hueRange:200,fontSize:80},
  {name:'Large bold squares',count:120,lerp:0.08,connect:25,glow:1.8,sizeMul:2.5,hueBase:180,hueRange:200,fontSize:80,shape:'square'},
  {name:'Hybrid dense+large',count:300,lerp:0.08,connect:28,glow:1.8,sizeMul:1.4,hueBase:200,hueRange:180,fontSize:80},
  {name:'Hybrid slow reveal',count:300,lerp:0.05,connect:28,glow:2,sizeMul:1.5,hueBase:260,hueRange:80,fontSize:80},
  {name:'Hybrid cool mist',count:300,lerp:0.06,connect:25,glow:2.2,sizeMul:1.3,hueBase:200,hueRange:100,fontSize:80,lumBase:55},
  {name:'Hybrid warm fog',count:300,lerp:0.06,connect:25,glow:2.2,sizeMul:1.3,hueBase:25,hueRange:60,fontSize:80,lumBase:55},
  {name:'Hybrid fire',count:300,lerp:0.07,connect:30,glow:2.5,sizeMul:1.4,hueBase:10,hueRange:30,fontSize:80},
];

var cards=[],globalVol=0;

function buildParticles(cfg){
  var pts=[];var sm=(cfg.sizeMul||1);
  for(var i=0;i<cfg.count;i++) pts.push({rx:Math.random()*520,ry:Math.random()*140,tx:0,ty:0,r:(1.5+Math.random()*3)*sm,phase:Math.random()*Math.PI*2});
  return pts;
}

function assignTargets(particles,letterPts,vol,cfg){
  var count=particles.length,total=letterPts.length;
  for(var i=0;i<count;i++){
    var p=particles[i];
    if(vol<0.05){p.tx=Math.random()*520;p.ty=Math.random()*140}
    else{var idx=Math.floor(i/count*total);var lp=letterPts[idx%total];var blend=Math.pow(vol,0.6);p.tx=lp[0]*blend+p.rx*(1-blend);p.ty=lp[1]*blend+p.ry*(1-blend)}
  }
}

function renderCard(crd,vol){
  var ctx=crd.ctx,W=crd.w,H=crd.h,cfg=crd.cfg;
  ctx.clearRect(0,0,W,H);
  if(!crd.letterPts){var lps=getLetterPaths(W,H,cfg.fontSize||80);crd.letterPts=[];lps.forEach(function(lp){crd.letterPts=crd.letterPts.concat(lp.pts)})}
  assignTargets(crd.particles,crd.letterPts,vol,cfg);
  var sm=cfg.sizeMul||1,lb=cfg.lumBase||45;

  // Connections
  if(cfg.connect>0&&vol>0.25){
    var ca=vol*0.1;
    for(var i=0;i<crd.particles.length;i+=Math.max(2,Math.floor(crd.particles.length/150))){
      for(var j=i+Math.max(2,Math.floor(crd.particles.length/150));j<crd.particles.length;j+=Math.max(2,Math.floor(crd.particles.length/150))){
        var dx=crd.particles[i].tx-crd.particles[j].tx,dy=crd.particles[i].ty-crd.particles[j].ty,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<cfg.connect*vol){ctx.beginPath();ctx.moveTo(crd.particles[i].tx,crd.particles[i].ty);ctx.lineTo(crd.particles[j].tx,crd.particles[j].ty);ctx.strokeStyle='rgba(167,139,250,'+(ca*(1-dist/(cfg.connect*vol)))+')';ctx.lineWidth=0.3;ctx.stroke()}
      }
    }
  }

  // Particles
  crd.particles.forEach(function(p,i){
    var spd=(cfg.lerp||0.08)*globalSpeed;p.rx+=(p.tx-p.rx)*spd;p.ry+=(p.ty-p.ry)*spd;
    var hue,sat=70,lum=lb+vol*30;
    if(cfg.colorMode==='duo'){hue=(cfg.hueBase||260)+(i<crd.particles.length/2?0:cfg.hueRange||100)}
    else{hue=(cfg.hueBase||180)+i*(cfg.hueRange||200)/crd.particles.length+vol*40}
    var alpha=0.4+vol*0.5,r=p.r*(0.7+vol*0.5);
    ctx.beginPath();
    if(cfg.shape==='square'){ctx.rect(p.rx-r,p.ry-r,r*2,r*2)}else{ctx.arc(p.rx,p.ry,r,0,Math.PI*2)}
    ctx.fillStyle='hsla('+hue+','+sat+'%,'+lum+'%,'+alpha+')';ctx.fill();
    if(cfg.glow>0&&vol>0.4){ctx.beginPath();if(cfg.shape==='square')ctx.rect(p.rx-r*cfg.glow,p.ry-r*cfg.glow,r*2*cfg.glow,r*2*cfg.glow);else ctx.arc(p.rx,p.ry,r*cfg.glow,0,Math.PI*2);ctx.fillStyle='hsla('+hue+','+sat+'%,'+Math.min(90,lum+20)+'%,'+(alpha*0.12)+')';ctx.fill()}
  });
}

function buildAll(){
  var grid=document.getElementById('grid');
  configs.forEach(function(cfg,i){
    var card=document.createElement('div');card.className='card';
    var c=document.createElement('canvas');c.width=520;c.height=140;
    card.innerHTML='<div class="card-num">#'+(i+1)+'</div><div class="card-title">'+cfg.name+'</div>';
    card.appendChild(c);grid.appendChild(card);
    cards.push({cfg:cfg,ctx:c.getContext('2d'),w:520,h:140,particles:buildParticles(cfg),letterPts:null});
  });
}

function toggleDemo(){if(demoRunning){stopDemo();return}demoRunning=true;document.getElementById('demoBtn').textContent='\u23f9 Stop';document.getElementById('demoBtn').style.borderColor='rgba(248,113,113,.2)';document.getElementById('demoBtn').style.color='#f87171';runDemo()}
function stopDemo(){demoRunning=false;if(demoAnimId){cancelAnimationFrame(demoAnimId);demoAnimId=null}document.getElementById('demoBtn').textContent='\u25b6 Demo All';document.getElementById('demoBtn').style.borderColor='rgba(167,139,250,.2)';document.getElementById('demoBtn').style.color='#a78bfa';globalVol=0;cards.forEach(function(c){renderCard(c,0)})}
function runDemo(){if(!demoRunning)return;demoAnimId=requestAnimationFrame(runDemo);var cycle=5000/globalSpeed,t=(Date.now()%cycle)/cycle;if(t<0.35)globalVol=Math.sin(t/0.35*Math.PI/2);else if(t<0.45)globalVol=1;else if(t<0.8)globalVol=Math.cos((t-0.45)/0.35*Math.PI/2);else globalVol=0;cards.forEach(function(c){renderCard(c,globalVol)})}

buildAll();cards.forEach(function(c){renderCard(c,0)});
</script>
</body>
</html>
