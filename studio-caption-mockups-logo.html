<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · 53 S-Form Logos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh;text-align:center}
h1{font-size:clamp(24px,5vw,36px);font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:4px}
@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.subtitle{color:#8b93a5;margin-bottom:8px;font-size:13px}
.mic-status{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;font-size:11px;font-weight:600;margin-bottom:16px;transition:all .3s}
.mic-status.off{background:rgba(255,255,255,.03);color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.06)}
.mic-status.on{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)}
.mic-dot{width:7px;height:7px;border-radius:50%}.mic-status.off .mic-dot{background:rgba(255,255,255,.15)}.mic-status.on .mic-dot{background:#34d399;animation:pulse 1.5s ease infinite}
.level-bar{width:100%;max-width:400px;height:3px;background:rgba(255,255,255,.04);border-radius:2px;margin:0 auto 16px;overflow:hidden}
.level-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);transition:width .1s;width:0%}
.controls-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.controls-row button{padding:8px 18px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);cursor:pointer;font-family:inherit;transition:all .15s}
.controls-row button:hover{border-color:#a78bfa;color:#a78bfa}
.controls-row button.active{background:#a78bfa;color:#fff;border-color:#a78bfa}
.controls-row button.demo{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:#34d399}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:1500px;margin:0 auto}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}}
.logo-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:14px;padding:20px 14px;transition:all .35s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;position:relative;overflow:hidden;cursor:pointer}
.logo-card:hover{border-color:rgba(167,139,250,.3);box-shadow:0 8px 28px rgba(0,0,0,.4);transform:translateY(-3px)}
.logo-card .num{position:absolute;top:8px;right:10px;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.1)}
.logo-card .name{font-family:'Outfit',sans-serif;font-size:10px;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:.06em;text-transform:uppercase}
.logo-card .viz{transition:all .15s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<h1>S-Form Logo Concepts</h1>
<p class="subtitle">53 mic-reactive logos forming the letter S · Two modes: Breathe / Pulse · Click any card for demo voice</p>
<div class="controls-row">
  <button id="micBtn" onclick="toggleMic()">🎤 Start Mic</button>
  <button data-mode="breathe" class="active" onclick="setMode('breathe',this)">🫁 Breathe</button>
  <button data-mode="pulse" onclick="setMode('pulse',this)">💓 Pulse</button>
  <button class="demo" id="demoBtn" onclick="toggleDemo()">▶ Demo Voice</button>
</div>
<div class="mic-status off" id="micStatus"><span class="mic-dot"></span> Mic off</div>
<div class="level-bar"><div class="level-fill" id="levelFill"></div></div>
<div class="grid" id="logoGrid"></div>
<script>
var audioCtx=null,analyser=null,micStream=null,micActive=false,volume=0,demoVol=0,demoOn=false,mode='breathe';

function toggleMic(){micActive?stopMic():startMic();}
async function startMic(){
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;audioCtx.createMediaStreamSource(micStream).connect(analyser);micActive=true;updateUI('on');updateVolume();}catch(e){alert('Mic denied: '+e.message);}
}
function stopMic(){if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}if(audioCtx){audioCtx.close();audioCtx=null;analyser=null}micActive=false;volume=0;updateUI('off');renderAll(0);}
function updateUI(s){
  var btn=document.getElementById('micBtn'),st=document.getElementById('micStatus');
  if(s==='on'){btn.textContent='⏹ Stop Mic';btn.style.borderColor='rgba(248,113,113,.3)';btn.style.color='#f87171';st.className='mic-status on';st.innerHTML='<span class="mic-dot"></span> Mic live';}
  else{btn.textContent='🎤 Start Mic';btn.style.borderColor='rgba(255,255,255,.1)';btn.style.color='rgba(255,255,255,.5)';st.className='mic-status off';st.innerHTML='<span class="mic-dot"></span> Mic off';document.getElementById('levelFill').style.width='0%';}
}
function updateVolume(){
  if(!micActive||!analyser){if(demoOn)requestAnimationFrame(updateVolume);return}
  var data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);
  var sum=0;for(var i=0;i<data.length;i++)sum+=data[i];
  volume=Math.min(1,sum/data.length/128);
  document.getElementById('levelFill').style.width=(volume*100)+'%';
  renderAll(volume);
  requestAnimationFrame(updateVolume);
}
function toggleDemo(){
  demoOn=!demoOn;document.getElementById('demoBtn').textContent=demoOn?'⏹ Stop Demo':'▶ Demo Voice';
  if(demoOn&&!micActive)updateVolumeDemo();
}
function updateVolumeDemo(){
  if(!demoOn){renderAll(0);return}
  demoVol=0.15+Math.sin(performance.now()*0.003)*0.25+Math.sin(performance.now()*0.007)*0.3+Math.sin(performance.now()*0.013)*0.2;
  demoVol=Math.max(0,Math.min(1,demoVol+.25));
  document.getElementById('levelFill').style.width=(demoVol*100)+'%';
  renderAll(demoVol);
  requestAnimationFrame(updateVolumeDemo);
}
function setMode(m,btn){mode=m;document.querySelectorAll('[data-mode]').forEach(function(b){b.classList.remove('active')});btn.classList.add('active');}

function hsl(h,s,l,a){return'hsla('+h+','+s+'%,'+l+'%,'+a+')';}
function vc(h,vol){return hsl((h+vol*80)%360,65,55+vol*15,0.5+vol*0.5);}
function br(t,vol){return mode==='breathe'?Math.sin(t*.003)*.15+.25+vol*.4:vol*.7+.15;}
function pv(t,i,vol){return mode==='pulse'?Math.sin(t*.005+i)*.3+.35+vol*.5:vol*.6+.2;}

function Sx(t){return 30+40*Math.sin(t*Math.PI);}
function Sy(t){return 15+t*55;}

var logos=[],vizDivs=[];
for(var v=1;v<=10;v++){(function(vv){logos.push({n:vv,name:'Dot S '+vv,build:function(vol,t){var h='<svg viewBox="0 0 100 85" style="width:90px;height:76px">';for(var i=0;i<40;i++){var p=i/39,x=Sx(p)+Math.sin(p*10+t*.002)*2*vol,y=Sy(p),r=1.5+br(t,vol)*4*(vv/10);h+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+vc(260+vv*20,vol)+'"/>';}return h+'</svg>';}});})(v);}
for(var v=1;v<=10;v++){(function(vv){logos.push({n:vv+10,name:'Bar S '+vv,build:function(vol,t){var h='<div style="display:flex;align-items:center;gap:1px;height:70px">';for(var i=0;i<28;i++){var p=i/27,bh=15+Math.abs(Math.sin(p*Math.PI))*50+br(t,vol)*25*(vv/10);h+='<div style="flex:1;height:'+bh+'%;background:'+vc(280+vv*15,vol)+';border-radius:2px;align-self:'+(p<.5?'flex-start':'flex-end')+'"></div>';}return h+'</div>';}});})(v);}
for(var v=1;v<=10;v++){(function(vv){logos.push({n:vv+20,name:'Ring S '+vv,build:function(vol,t){var h='<svg viewBox="0 0 100 85" style="width:90px;height:76px">';for(var i=0;i<18;i++){var p=i/17,x=Sx(p),y=Sy(p),r=3+pv(t,i,vol)*12*(vv/10);h+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="none" stroke="'+vc(200+vv*18,vol)+'" stroke-width="1.5" opacity="'+(.2+vol*.6)+'"/>';}return h+'</svg>';}});})(v);}
for(var v=1;v<=10;v++){(function(vv){logos.push({n:vv+30,name:'Wave S '+vv,build:function(vol,t){var h='<svg viewBox="0 0 100 85" style="width:90px;height:76px">';for(var w=0;w<6;w++){var d='';for(var i=0;i<60;i++){var p=i/59,x=Sx(p)+(w-2.5)*2.5,y=Sy(p)+Math.sin(p*15+t*.003+w)*3*vol;if(i===0)d+='M'+x+','+y;else d+='L'+x+','+y;}h+='<path d="'+d+'" fill="none" stroke="'+vc(180+w*25,vol)+'" stroke-width="'+(1+vol*1.5)+'" opacity="'+(.3+vol*.4)+'"/>';}return h+'</svg>';}});})(v);}
for(var v=1;v<=10;v++){(function(vv){logos.push({n:vv+40,name:'Particle S '+vv,build:function(vol,t){var h='<svg viewBox="0 0 100 85" style="width:90px;height:76px">';for(var i=0;i<45;i++){var p=i/44,sc=(vv-5)*2*vol,x=Sx(p)+(Math.sin(i*7+t*.005)*sc),y=Sy(p)+(Math.cos(i*5+t*.004)*sc),r=1.5+vol*3.5;h+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+vc(300+vv*12,vol)+'" opacity="'+(.3+vol*.5)+'"/>';}return h+'</svg>';}});})(v);}
logos.push({n:51,name:'Segmented S',build:function(vol,t){var h='<svg viewBox="0 0 100 85" style="width:90px;height:76px">';for(var i=0;i<20;i++){var p=i/19,x=Sx(p),y=Sy(p),len=6+pv(t,i,vol)*10,a=Math.PI/2-p*Math.PI*1.1;h+='<line x1="'+x+'" y1="'+y+'" x2="'+(x+Math.cos(a)*len)+'" y2="'+(y+Math.sin(a)*len)+'" stroke="'+vc(250,vol)+'" stroke-width="'+(1.5+vol*2)+'" stroke-linecap="round"/>';}return h+'</svg>';}});
logos.push({n:52,name:'Gradient S',build:function(vol,t){return'<svg viewBox="0 0 100 85" style="width:90px;height:76px"><defs><linearGradient id="gs" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="'+vc(280,vol)+'"/><stop offset="50%" stop-color="'+vc(180,vol)+'"/><stop offset="100%" stop-color="'+vc(340,vol)+'"/></linearGradient></defs><path d="M35,12 C70,12 80,35 65,42 C50,49 30,48 35,62 C40,76 65,75 65,75" fill="none" stroke="url(#gs)" stroke-width="'+(2+vol*3)+'" stroke-linecap="round"/></svg>';}});
logos.push({n:53,name:'Glow S',build:function(vol,t){return'<svg viewBox="0 0 100 85" style="width:90px;height:76px"><filter id="gl"><feGaussianBlur stdDeviation="'+(1+vol*4)+'"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path d="M35,12 C70,12 80,35 65,42 C50,49 30,48 35,62 C40,76 65,75 65,75" fill="none" stroke="'+vc(270,vol)+'" stroke-width="2" stroke-linecap="round" filter="url(#gl)"/></svg>';}});

var grid=document.getElementById('logoGrid');
logos.forEach(function(l,i){
  var card=document.createElement('div');card.className='logo-card';
  var viz=document.createElement('div');viz.className='viz';viz.id='viz'+i;viz.innerHTML=l.build(0,0);
  card.innerHTML='<span class="num">#'+l.n+'</span>';card.appendChild(viz);
  var name=document.createElement('div');name.className='name';name.textContent=l.name;card.appendChild(name);
  card.addEventListener('click',function(){if(!micActive&&!demoOn)toggleDemo();});
  grid.appendChild(card);vizDivs.push(viz);
});

function renderAll(vol){
  var t=performance.now();
  logos.forEach(function(l,i){vizDivs[i].innerHTML=l.build(vol,t);});
}
renderAll(0);
</script>
</body>
</html>
