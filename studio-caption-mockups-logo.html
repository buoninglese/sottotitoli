<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · Mic-Reactive Logo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px;min-height:100vh;text-align:center}h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:4px}@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}.subtitle{color:#8b93a5;margin-bottom:8px;font-size:13px}.mic-status{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;font-size:11px;font-weight:600;margin-bottom:24px;transition:all .3s}.mic-status.off{background:rgba(255,255,255,.03);color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.06)}.mic-status.on{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)}.mic-dot{width:7px;height:7px;border-radius:50%}.mic-status.off .mic-dot{background:rgba(255,255,255,.15)}.mic-status.on .mic-dot{background:#34d399;animation:pulse 1.5s ease infinite}.level-bar{width:100%;max-width:400px;height:3px;background:rgba(255,255,255,.04);border-radius:2px;margin:0 auto 20px;overflow:hidden}.level-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);transition:width .1s ease;width:0%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1100px;margin:0 auto}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}.logo-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:28px 20px;transition:all .4s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:200px;position:relative;overflow:hidden}.logo-card.active{border-color:rgba(167,139,250,.2);box-shadow:0 0 30px rgba(167,139,250,.08)}.logo-num{position:absolute;top:10px;right:14px;font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.1)}.logo-visual{transition:all .15s ease}.logo-label{font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.08em;text-transform:uppercase}button.mic-btn{padding:10px 24px;border-radius:100px;border:1px solid rgba(52,211,153,.2);background:rgba(52,211,153,.08);color:#34d399;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;margin:0 4px}button.mic-btn:hover{background:rgba(52,211,153,.15)}button.mic-btn.stop{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.2);color:#f87171}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}@keyframes barDance{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}@keyframes dotPulse{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.8;transform:translateY(-8px)}}</style></head><body><h1>🔷 Mic-Reactive Logo</h1><p class="subtitle">Speak into your microphone — watch the logos come alive</p><div><button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤 Start Mic</button></div><div class="mic-status off" id="micStatus"><span class="mic-dot"></span> Mic off</div><div class="level-bar"><div class="level-fill" id="levelFill"></div></div><div class="grid" id="logoGrid"></div><script>
var audioCtx=null,analyser=null,micStream=null,micActive=false,volume=0;

function toggleMic(){
  if(micActive){stopMic();return}
  startMic();
}

async function startMic(){
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();analyser.fftSize=256;
    var source=audioCtx.createMediaStreamSource(micStream);
    source.connect(analyser);
    micActive=true;
    document.getElementById('micBtn').textContent='⏹ Stop Mic';
    document.getElementById('micBtn').classList.add('stop');
    document.getElementById('micStatus').className='mic-status on';
    document.getElementById('micStatus').innerHTML='<span class="mic-dot"></span> Mic live';
    updateVolume();
  }catch(e){alert('Microphone access denied: '+e.message)}
}

function stopMic(){
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
  if(audioCtx){audioCtx.close();audioCtx=null;analyser=null}
  micActive=false;volume=0;
  document.getElementById('micBtn').textContent='🎤 Start Mic';
  document.getElementById('micBtn').classList.remove('stop');
  document.getElementById('micStatus').className='mic-status off';
  document.getElementById('micStatus').innerHTML='<span class="mic-dot"></span> Mic off';
  document.getElementById('levelFill').style.width='0%';
  updateAllVisuals(0);
}

function updateVolume(){
  if(!micActive||!analyser)return;
  var data=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  var sum=0;for(var i=0;i<data.length;i++)sum+=data[i];
  volume=Math.min(1,sum/data.length/128);
  document.getElementById('levelFill').style.width=(volume*100)+'%';
  updateAllVisuals(volume);
  requestAnimationFrame(updateVolume);
}

// ═══ Logo builds that react to volume ═══
function hslVol(h,s,l,vol){var v=.4+vol*.6;var hue=(h+vol*120)%360;return`hsla(${hue},${s}%,${l+v*20}%,${v})`}

function buildLogo1(vol){var bars=Array.from({length:10},(_,i)=>Math.max(.1,Math.sin(i*.7)*.4+.4+vol*.3));var h='<div style="display:flex;align-items:flex-end;gap:3px;height:70px">';bars.forEach((v,i)=>{h+=`<div style="flex:1;height:${v*100}%;background:${hslVol(260+i*8,70,50,vol)};border-radius:3px 3px 0 0;box-shadow:0 0 ${vol*20}px ${hslVol(260+i*8,70,50,vol)}"></div>`});h+='</div>';return h}

function buildLogo2(vol){var bars=Array.from({length:14},(_,i)=>Math.max(.08,Math.sin(i*.7)*.35+.35+vol*.35));var h='<div style="display:flex;align-items:center;gap:2px;height:70px">';bars.forEach((v,i)=>{var hh=v*45;h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;height:100%;justify-content:center"><div style="width:100%;height:${hh}%;background:${hslVol(280,60,55,vol)};border-radius:2px"></div><div style="width:100%;height:${hh}%;background:${hslVol(280,50,50,vol)};border-radius:2px"></div></div>`});h+='</div>';return h}

function buildLogo3(vol){var h='<div style="position:relative;width:180px;height:80px">';for(var i=0;i<40;i++){var x=10+Math.random()*160;var y=5+Math.random()*70;var s=2+vol*8+Math.random()*3;h+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:${hslVol(200+Math.random()*160,70,60,vol)};box-shadow:0 0 ${s*3}px ${hslVol(200+Math.random()*160,70,60,vol)}"></div>`}h+='</div>';return h}

function buildLogo4(vol){var n=Math.floor(12+vol*36);var h='<div style="position:relative;width:90px;height:90px">';for(var i=0;i<n;i++){var angle=(i/n)*360;var len=10+vol*20+Math.sin(i*.5)*8;h+=`<div style="position:absolute;left:50%;top:50%;width:2px;height:${len}px;background:${hslVol(i*8,65,55,vol)};transform-origin:50% 0;transform:translate(-50%,0) rotate(${angle}deg) translateY(6px);border-radius:1px"></div>`}h+='<div style="position:absolute;left:50%;top:50%;width:'+(4+vol*4)+'px;height:'+(4+vol*4)+'px;border-radius:50%;background:#a78bfa;transform:translate(-50%,-50%);box-shadow:0 0 '+(6+vol*20)+'px rgba(167,139,250,'+(.4+vol*.5)+')"></div></div>';return h}

function buildLogo5(vol){var bars=Array.from({length:16},(_,i)=>Math.max(.08,Math.sin(i*.6)*.35+.3+vol*.4));var h='<div style="display:flex;align-items:flex-end;gap:1px;height:70px">';bars.forEach((v,i)=>{h+=`<div style="flex:1;height:${v*100}%;background:${hslVol(320+i*10,70,55,vol)};border-radius:1px;box-shadow:0 0 ${vol*15}px ${hslVol(320+i*10,70,55,vol)}"></div>`});h+='</div>';return h}

function buildLogo6(vol){var r=22+vol*10;var circ=2*Math.PI*r;var dash=circ*.7;var svg=`<svg viewBox="0 0 100 100" style="width:80px;height:80px"><circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="4"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="url(#g6)" stroke-width="${3+vol*3}" stroke-dasharray="${circ}" stroke-dashoffset="${circ-dash}" stroke-linecap="round" transform="rotate(-90 50 50)"/><text x="50" y="46" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="14" font-weight="900" fill="${hslVol(260,70,65,vol)}">${Math.round(vol*100)}%</text><text x="50" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="rgba(255,255,255,.3)">volume</text><defs><linearGradient id="g6"><stop offset="0%" stop-color="${hslVol(200,80,60,vol)}"/><stop offset="100%" stop-color="${hslVol(280,80,60,vol)}"/></linearGradient></defs></svg>`;return svg}

var logos=[{n:1,name:'Bar Spectrum',build:buildLogo1},{n:2,name:'Mirror Duo',build:buildLogo2},{n:3,name:'Particle Cloud',build:buildLogo3},{n:4,name:'Radial Burst',build:buildLogo4},{n:5,name:'Gradient Bars',build:buildLogo5},{n:6,name:'Volume Ring',build:buildLogo6}];

var grid=document.getElementById('logoGrid');
logos.forEach(function(l,i){var card=document.createElement('div');card.className='logo-card';card.id='logoCard'+i;var viz=document.createElement('div');viz.className='logo-visual';viz.id='logoViz'+i;viz.innerHTML=l.build(0);card.innerHTML='<span class="logo-num">#'+l.n+'</span>';card.appendChild(viz);var label=document.createElement('div');label.className='logo-label';label.textContent=l.name;card.appendChild(label);grid.appendChild(card)});

function updateAllVisuals(vol){
  logos.forEach(function(l,i){var viz=document.getElementById('logoViz'+i);var card=document.getElementById('logoCard'+i);if(viz)viz.innerHTML=l.build(vol);if(card){if(vol>.05)card.classList.add('active');else card.classList.remove('active')}});
}
</script></body></html>
