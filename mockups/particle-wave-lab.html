<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Wave — Settings Test</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
:root { --bg:#0f1117;--card:#1a1d26;--card2:#22252f;--line:rgba(255,255,255,.06);--text:#e5e7eb;--muted:#9ca3af;--muted2:#6b7280;--accent:#a78bfa; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
h1{font-size:20px;font-weight:800;margin-bottom:4px}
.sub{font-size:11px;color:var(--muted2);margin-bottom:16px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:12px;font-weight:600;padding:6px 16px;border-radius:100px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.meter{width:100%;height:4px;background:var(--card2);border-radius:2px;overflow:hidden;margin-bottom:16px}
.meter-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);transition:width .05s;width:0%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card-head{display:flex;align-items:center;justify-content:space-between}
.card-name{font-size:12px;font-weight:700}
.card-meta{font-size:9px;color:var(--muted2);font-family:monospace}
.card canvas{width:100%;height:56px;border-radius:8px;background:var(--bg)}
</style>
</head>
<body>

<h1>🔬 Particle Wave — Settings Lab</h1>
<p class="sub">Pure sound-reactive. No speech recognition. Each variant has different particle count, scatter, damping, and responsiveness.</p>

<div class="topbar">
  <button class="btn" id="micBtn" onclick="toggleMic()">🎤 Start Mic</button>
  <span style="font-size:10px;color:var(--muted2)" id="micLabel">Mic off</span>
</div>
<div class="meter"><div class="meter-fill" id="meterFill"></div></div>

<div class="grid" id="grid"></div>

<script>
// ─── Audio (pure Web Audio API, no speech recognition) ───
var audioCtx=null, analyser=null, micStream=null, micActive=false, volume=0;

async function toggleMic(){
  if(micActive){stopMic();return;}
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();analyser.fftSize=256;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
    micActive=true;
    document.getElementById('micBtn').textContent='⏹ Stop Mic';
    document.getElementById('micBtn').classList.add('active');
    document.getElementById('micLabel').textContent='Mic live';
  }catch(e){alert('Mic denied: '+e.message);}
}
function stopMic(){
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}
  if(audioCtx){audioCtx.close();audioCtx=null;analyser=null}
  micActive=false;volume=0;
  document.getElementById('micBtn').textContent='🎤 Start Mic';
  document.getElementById('micBtn').classList.remove('active');
  document.getElementById('micLabel').textContent='Mic off';
  document.getElementById('meterFill').style.width='0%';
}
function readVolume(){
  if(!analyser)return 0;
  var d=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(d);
  var s=0;for(var i=0;i<d.length;i++)s+=d[i];
  return Math.min(1,s/d.length/128);
}

// ─── Variants — wildly different settings ───
var variants=[
  {name:'A · Default',     desc:'n:80 kalei:2 damp:.90 attr:.006 — current defaults',          n:80,  kalei:2.0, damp:0.90, attr:0.006, orbMin:2, orbMax:10, size0:0.8,sizeV:2.0, hue0:10,hueR:50, smoothUp:0.55,smoothDown:0.35},
  {name:'B · Snappy Decay',desc:'n:100 kalei:6 damp:.85 attr:.004 — fast scatter on silence',  n:100, kalei:6.0, damp:0.85, attr:0.004, orbMin:4, orbMax:22, size0:0.7,sizeV:2.0, hue0:10,hueR:50, smoothUp:0.60,smoothDown:0.90},
  {name:'C · Wide Wander', desc:'n:60 kalei:12 damp:.92 attr:.003 — huge idle spread',         n:60,  kalei:12,  damp:0.92, attr:0.003, orbMin:8, orbMax:40, size0:1.0,sizeV:1.5, hue0:190,hueR:60, smoothUp:0.50,smoothDown:0.85},
  {name:'D · Tight Line',  desc:'n:200 kalei:1 damp:.95 attr:.008 — stays tight even quiet',   n:200, kalei:1.0, damp:0.95, attr:0.008, orbMin:1, orbMax:4,  size0:0.5,sizeV:1.5, hue0:260,hueR:100,smoothUp:0.70,smoothDown:0.70},
  {name:'E · Responsive',  desc:'n:120 kalei:4 damp:.82 attr:.007 — jumps to any noise',       n:120, kalei:4.0, damp:0.82, attr:0.007, orbMin:3, orbMax:16, size0:0.8,sizeV:2.5, hue0:30, hueR:80, smoothUp:0.80,smoothDown:0.95},
  {name:'F · Lazy Bloom',  desc:'n:90 kalei:8 damp:.96 attr:.002 — slow gentle drift',         n:90,  kalei:8.0, damp:0.96, attr:0.002, orbMin:5, orbMax:30, size0:1.2,sizeV:3.0, hue0:160,hueR:100,smoothUp:0.30,smoothDown:0.40},
  {name:'G · Micro Noise', desc:'n:160 kalei:3 damp:.88 attr:.010 — highly sensitive',         n:160, kalei:3.0, damp:0.88, attr:0.010, orbMin:2, orbMax:8,  size0:0.6,sizeV:1.8, hue0:340,hueR:60, smoothUp:0.85,smoothDown:0.92},
  {name:'H · Storm',       desc:'n:140 kalei:5 damp:.80 attr:.006 — chaotic, fast everything', n:140, kalei:5.0, damp:0.80, attr:0.006, orbMin:4, orbMax:25, size0:0.9,sizeV:2.8, hue0:200,hueR:140,smoothUp:0.75,smoothDown:0.88}
];

// ─── Per-variant particle state ───
var states=[];

function buildGrid(){
  var g=document.getElementById('grid'),h='';
  variants.forEach(function(v,i){
    h+='<div class="card">';
    h+='<div class="card-head"><span class="card-name">'+v.name+'</span><span class="card-meta">'+v.desc+'</span></div>';
    h+='<canvas id="cv'+i+'"></canvas>';
    h+='</div>';
  });
  g.innerHTML=h;
  // Init each canvas
  variants.forEach(function(v,i){
    var cv=document.getElementById('cv'+i);
    cv.width=cv.clientWidth*devicePixelRatio;
    cv.height=56*devicePixelRatio;
    initParticles(cv,i);
  });
}

function initParticles(canvas,idx){
  var v=variants[idx],w=canvas.clientWidth,h=56;
  canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;
  var ps=[];
  for(var i=0;i<v.n;i++){
    ps.push({
      tx:(i/(v.n-1))*w, ty:h/2,
      x:Math.random()*w, y:5+Math.random()*(h-10),
      vx:0,vy:0,
      phase:Math.random()*Math.PI*2,
      freq:0.2+Math.random()*0.8,
      orbitR:v.orbMin+Math.random()*(v.orbMax-v.orbMin)
    });
  }
  if(!states[idx])states[idx]={vol:0,particles:ps};
  else states[idx].particles=ps;
}

function particleColor(i,total,vol,idx){
  var v=variants[idx];
  var hue=((v.hue0||10)+i/total*(v.hueR||50)+vol*40)%360;
  var sat=60+vol*20,lit=50+vol*25,alpha=0.4+vol*0.5;
  return'hsla('+hue+','+sat+'%,'+lit+'%,'+alpha+')';
}

function frame(ts){
  requestAnimationFrame(frame);
  if(micActive){var raw=readVolume();volume+=(raw-volume)*0.9;}
  else volume=Math.max(0,volume*0.92);
  document.getElementById('meterFill').style.width=(volume*100)+'%';

  variants.forEach(function(v,idx){
    var cv=document.getElementById('cv'+idx);if(!cv)return;
    var w=cv.clientWidth,h=56;
    if(cv.width!==w*devicePixelRatio||cv.height!==h*devicePixelRatio){initParticles(cv,idx);}
    var ctx=cv.getContext('2d'),dpr=devicePixelRatio;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);

    var st=states[idx]||{vol:0};if(!st.particles)return;
    // Asymmetric smoothing per variant
    var rawVol=volume;
    var sUp=v.smoothUp||0.55,sDown=v.smoothDown||0.35;
    var smooth=rawVol>st.vol?sUp:sDown;
    st.vol+=(rawVol-st.vol)*smooth;
    var vol=Math.max(0.02,Math.min(1,st.vol));

    // Glow
    if(vol>0.05){
      ctx.save();ctx.globalAlpha=vol*0.08;ctx.filter='blur('+(4+vol*12)+'px)';
      ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);
      ctx.strokeStyle='#a78bfa';ctx.lineWidth=2+vol*4;ctx.stroke();ctx.restore();
    }
    // Particles
    for(var i=0;i<st.particles.length;i++){
      var p=st.particles[i],time=ts*0.001;
      var attrF=(v.attr||0.006)+vol*0.25*(1/60);
      var kaleiS=(1-vol)*(v.kalei||2.0);
      var kx=Math.cos(time*p.freq+p.phase)*p.orbitR*kaleiS;
      var ky=Math.sin(time*p.freq*0.7+p.phase)*p.orbitR*kaleiS;
      kx+=Math.cos(time*0.3+p.phase*2)*p.orbitR*0.5*kaleiS;
      ky+=Math.sin(time*0.37+p.phase*1.7)*p.orbitR*0.5*kaleiS;
      var tx=p.tx+kx,ty=p.ty+ky;
      p.vx+=(tx-p.x)*attrF;p.vy+=(ty-p.y)*attrF;
      p.vx*=(v.damp||0.88);p.vy*=(v.damp||0.88);
      p.x+=p.vx;p.y+=p.vy;
      var r=(v.size0||1)+vol*(v.sizeV||2)+(1-vol)*Math.abs(Math.sin(time*2+p.phase));
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
      ctx.fillStyle=particleColor(i,st.particles.length,vol,idx);ctx.fill();
      if(vol>0.25&&r>1.5){ctx.beginPath();ctx.arc(p.x,p.y,r*2.5,0,Math.PI*2);
        ctx.fillStyle='hsla('+((v.hue0||10)+i/st.particles.length*(v.hueR||50))+',70%,60%,'+(vol*0.08)+')';ctx.fill();}
    }
  });
}

buildGrid();
requestAnimationFrame(frame);
</script>
</body>
</html>
