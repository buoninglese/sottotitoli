<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>50 Apple-Style Device Layouts</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#000;color:#ccc;min-height:100vh}
h1{text-align:center;font-size:28px;font-weight:700;padding:36px 0 4px;letter-spacing:-.02em;color:#f5f5f7}
.sub{text-align:center;color:#86868b;font-size:13px;margin-bottom:6px}
.note{text-align:center;color:#555;font-size:11px;margin-bottom:32px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:0 12px 50px;max-width:1100px;margin:0 auto}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}}

.cell{aspect-ratio:1;background:#0d0d0f;border-radius:16px;position:relative;overflow:hidden;border:1px solid #1a1a1d;cursor:pointer;transition:border-color .3s,background .3s}
.cell:hover{border-color:#86868b;background:#111115}
.cell-num{position:absolute;top:8px;left:10px;font-size:9px;font-weight:600;color:#3a3a3d;z-index:5}

/* Device representations */
.mac{position:absolute;background:linear-gradient(180deg,#c8cacf 0%,#a1a5ad 7%,#2d3038 7%,#1a1c22 8%,#0d0e12 9%,#0a0b0e 88%,#1a1c22 89%,#4a4d55 90%,#6e7179 100%);border-radius:8px 8px 3px 3px}
.mac::after{content:'';position:absolute;bottom:-4px;left:12%;right:12%;height:4px;background:#c8cacf;border-radius:0 0 3px 3px}
.mac .screen{position:absolute;inset:9% 2.5% 11% 2.5%;background:linear-gradient(180deg,#0f1c24,#0b151c);border-radius:2px}

.iphone{position:absolute;background:linear-gradient(180deg,#1a1a1a 0%,#111 3%,#000 4%,#000 96%,#1a1a1a 97%,#222 100%);border-radius:14px}
.iphone::before{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);width:28%;height:3px;background:#1a1a1a;border-radius:999px;z-index:2}
.iphone .screen{position:absolute;inset:5% 5% 5% 5%;background:linear-gradient(180deg,#0f1c24,#0b151c);border-radius:10px}

.ipad{position:absolute;background:linear-gradient(180deg,#2a2a2a 0%,#1a1a1a 5%,#000 6%,#000 94%,#1a1a1a 95%,#2a2a2a 100%);border-radius:10px}
.ipad .screen{position:absolute;inset:5% 5% 5% 5%;background:linear-gradient(180deg,#0f1c24,#0b151c);border-radius:7px}

/* Mini Sotto Supreme UI dots */
.ui-dot{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(34,211,238,.6)}
.ui-bar{position:absolute;height:1.5px;background:rgba(255,255,255,.04);border-radius:1px}
.ui-chip{position:absolute;padding:0.5px 3px;background:rgba(34,211,238,.12);border-radius:2px}
</style>
</head>
<body>
<h1>50 Apple-Style Device Layouts</h1>
<p class="sub">MacBook · iPhone · iPad — inspired by Apple keynote aesthetics</p>
<p class="note">Click any cell for specs. Tell me your favorites.</p>
<div class="grid" id="grid"></div>

<script>
// Generate 50 Apple-inspired layouts
const layouts = [];
function r(min,max){return Math.round(min+Math.random()*(max-min))}

for(let i=0;i<50;i++){
  const v=[];
  const strategies = [
    // Hero MacBook, iPhone + iPad supporting
    ()=>{v.push({d:'mac',w:r(48,65),h:r(30,40),t:r(5,15),l:r(5,20),rot:r(-3,0)});
         v.push({d:'iphone',w:r(8,14),h:r(18,28),t:r(40,55),l:r(55,72),rot:r(2,8)});
         v.push({d:'ipad',w:r(16,24),h:r(22,32),t:r(45,60),l:r(8,22),rot:r(-8,-2)});},
    // iPhone hero, MacBook + iPad background
    ()=>{v.push({d:'iphone',w:r(14,22),h:r(28,42),t:r(15,30),l:r(35,50),rot:r(-3,3)});
         v.push({d:'mac',w:r(55,70),h:r(34,44),t:r(45,65),l:r(-10,15),rot:r(-5,0)});
         v.push({d:'ipad',w:r(18,26),h:r(24,34),t:r(50,65),l:r(60,80),rot:r(3,8)});},
    // iPad hero center
    ()=>{v.push({d:'ipad',w:r(30,44),h:r(38,52),t:r(18,32),l:r(28,42),rot:r(-2,2)});
         v.push({d:'mac',w:r(50,62),h:r(30,38),t:r(-5,8),l:r(-15,5),rot:r(-6,-2)});
         v.push({d:'iphone',w:r(9,13),h:r(20,28),t:r(10,25),l:r(65,80),rot:r(3,7)});},
    // Diagonal cascade
    ()=>{v.push({d:'mac',w:r(45,58),h:r(26,34),t:r(2,12),l:r(-5,10),rot:r(-4,-1)});
         v.push({d:'ipad',w:r(20,28),h:r(24,34),t:r(30,44),l:r(35,50),rot:r(1,5)});
         v.push({d:'iphone',w:r(8,12),h:r(18,26),t:r(50,65),l:r(65,78),rot:r(4,8)});},
    // Steve Jobs' classic: one device, perfectly centered
    ()=>{v.push({d:'mac',w:r(55,70),h:r(36,46),t:r(25,35),l:r(15,25),rot:0});
         v.push({d:'iphone',w:0,h:0,t:0,l:0,rot:0});
         v.push({d:'ipad',w:0,h:0,t:0,l:0,rot:0});},
    // Floating cluster, all visible
    ()=>{v.push({d:'mac',w:r(40,52),h:r(24,32),t:r(5,15),l:r(8,20),rot:r(-3,0)});
         v.push({d:'iphone',w:r(7,11),h:r(16,24),t:r(38,50),l:r(55,70),rot:r(3,8)});
         v.push({d:'ipad',w:r(18,26),h:r(22,32),t:r(50,65),l:r(15,28),rot:r(-6,-1)});},
    // Pyramid: MacBook bottom, iPhone top
    ()=>{v.push({d:'mac',w:r(55,68),h:r(32,40),t:r(45,58),l:r(10,22),rot:r(-2,1)});
         v.push({d:'iphone',w:r(8,12),h:r(18,26),t:r(8,18),l:r(42,56),rot:r(-1,3)});
         v.push({d:'ipad',w:r(20,28),h:r(26,36),t:r(20,34),l:r(8,18),rot:r(-4,0)});},
    // Side by side lineup
    ()=>{v.push({d:'mac',w:r(30,40),h:r(18,24),t:r(35,48),l:r(2,12),rot:r(-2,2)});
         v.push({d:'iphone',w:r(6,10),h:r(14,22),t:r(32,45),l:r(48,58),rot:r(-1,3)});
         v.push({d:'ipad',w:r(16,22),h:r(20,28),t:r(38,50),l:r(68,82),rot:r(-3,0)});},
    // Overlapping depth
    ()=>{v.push({d:'mac',w:r(55,70),h:r(34,44),t:r(20,32),l:r(-2,12),rot:r(-3,0)});
         v.push({d:'iphone',w:r(8,12),h:r(20,28),t:r(5,15),l:r(52,65),rot:r(3,6)});
         v.push({d:'ipad',w:r(16,24),h:r(20,30),t:r(40,55),l:r(50,65),rot:r(-5,-1)});},
    // Minimal corner peeks
    ()=>{v.push({d:'mac',w:r(60,78),h:r(38,50),t:r(30,45),l:r(-20,5),rot:r(-5,-1)});
         v.push({d:'iphone',w:r(6,10),h:r(16,22),t:r(-5,8),l:r(60,78),rot:r(4,8)});
         v.push({d:'ipad',w:r(14,20),h:r(18,26),t:r(55,72),l:r(60,78),rot:r(-8,-2)});},
  ];

  const s = strategies[i % strategies.length];
  s();
  // Filter out invisible (w=0)
  const visible = v.filter(d=>d.w>0);
  // Ensure at least 1 device
  if(visible.length===0){v[0].w=50;v[0].h=32;v[0].t=25;v[0].l=25;v[0].rot=0}
  layouts.push(v);
}

const grid=document.getElementById('grid');
layouts.forEach((v,i)=>{
  const cell=document.createElement('div');
  cell.className='cell';
  cell.innerHTML='<span class="cell-num">'+(i+1)+'</span>';

  v.forEach(d=>{
    if(d.w===0)return;
    const el=document.createElement('div');
    el.className=d.d;
    el.style.cssText='width:'+d.w+'%;height:'+d.h+'%;top:'+d.t+'%;left:'+d.l+'%;transform:rotate('+d.rot+'deg)';
    // Add screen + mini UI
    const screen=document.createElement('div');
    screen.className='screen';
    // Mini Sotto Supreme UI
    const dot=document.createElement('div');dot.className='ui-dot';
    if(d.d==='mac'){dot.style.cssText='top:14%;right:8%'}
    else if(d.d==='iphone'){dot.style.cssText='top:12%;right:10%'}
    else{dot.style.cssText='top:12%;right:8%'}
    screen.appendChild(dot);
    const bar=document.createElement('div');bar.className='ui-bar';
    if(d.d==='mac'){bar.style.cssText='top:32%;left:18%;right:8%'}
    else if(d.d==='iphone'){bar.style.cssText='top:28%;left:8%;right:8%'}
    else{bar.style.cssText='top:28%;left:14%;right:8%'}
    screen.appendChild(bar);
    const bar2=document.createElement('div');bar2.className='ui-bar';
    if(d.d==='mac'){bar2.style.cssText='top:44%;left:18%;right:22%'}
    else if(d.d==='iphone'){bar2.style.cssText='top:42%;left:8%;right:28%'}
    else{bar2.style.cssText='top:40%;left:14%;right:24%'}
    screen.appendChild(bar2);
    if(d.d==='mac'){
      const chip=document.createElement('div');chip.className='ui-chip';
      chip.style.cssText='top:22%;right:8%';screen.appendChild(chip);
    }
    el.appendChild(screen);
    cell.appendChild(el);
  });

  cell.addEventListener('click',()=>{
    cell.style.borderColor='#86868b';
    let msg='Layout #'+(i+1)+'\n\n';
    v.forEach((d,j)=>{
      if(d.w===0)return;
      const names={mac:'MacBook',iphone:'iPhone',ipad:'iPad'};
      msg+=names[d.d]+': '+d.w+'%×'+d.h+'% top:'+d.t+'% left:'+d.l+'% rot:'+d.rot+'°\n';
    });
    alert(msg);
    setTimeout(()=>cell.style.borderColor='',600);
  });
  grid.appendChild(cell);
});
</script>
</body>
</html>
