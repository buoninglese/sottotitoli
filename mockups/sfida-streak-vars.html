<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SFIDA + Streak — Big Banner Variations · Sottotitoli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-snap-type:y mandatory;overflow-y:scroll}
body{background:#0a0c10;color:#fff;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}

.section{position:relative;width:100vw;height:100vh;scroll-snap-align:start;overflow:hidden;
  background:url('../img/bg-home.png') center/cover no-repeat;background-attachment:fixed}
.section::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.48);z-index:0}
.section::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.45) 100%)}

.section-inner{position:relative;z-index:2;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;padding:clamp(40px,8vh,80px) clamp(28px,5vw,80px)}

.panel{width:100%;max-width:580px;display:flex;flex-direction:column;gap:14px}

.label{position:absolute;bottom:24px;right:32px;z-index:10;
  font-size:12px;font-weight:600;color:rgba(255,255,255,.25);
  font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);
  border-radius:100px;padding:6px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:100;
  display:flex;flex-direction:column;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .25s}
.dot:hover,.dot.active{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.4);transform:scale(1.4)}

/* ═══════════════════════════════════════
   01 — HERO BANNER: massive card, icon+number
   ═══════════════════════════════════════ */
.v01-banner{background:linear-gradient(135deg,rgba(192,132,252,.12),rgba(192,132,252,.03));
  border:1px solid rgba(192,132,252,.18);border-radius:18px;padding:clamp(24px,4vh,36px) clamp(22px,4vw,32px);
  display:flex;align-items:center;gap:clamp(18px,3vw,28px)}
.v01-icon-wrap{width:clamp(56px,8vw,72px);height:clamp(56px,8vw,72px);border-radius:16px;
  background:rgba(192,132,252,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v01-icon-wrap i{font-size:clamp(26px,3.5vw,34px);color:#c084fc}
.v01-core{flex:1;display:flex;flex-direction:column;gap:2px}
.v01-eyebrow{font-size:clamp(11px,1.1vw,13px);font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.08em}
.v01-big{font-size:clamp(42px,6vw,60px);font-weight:900;color:#fff;font-family:'Manrope',sans-serif;line-height:1}
.v01-sub{font-size:clamp(14px,1.4vw,16px);color:rgba(255,255,255,.4);font-weight:500}
.v01-badge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  background:rgba(192,132,252,.15);border:1px solid rgba(192,132,252,.25);
  border-radius:100px;padding:6px 16px;font-size:13px;font-weight:700;color:#c084fc;align-self:flex-start}
.v01-badge i{font-size:11px}

.v01-streak{background:rgba(255,107,53,.06);border:1px solid rgba(255,107,53,.12);
  border-radius:16px;padding:clamp(16px,2.5vh,22px) clamp(18px,3vw,26px);
  display:flex;align-items:center;gap:clamp(14px,2vw,20px)}
.v01-flame-wrap{width:clamp(48px,7vw,60px);height:clamp(48px,7vw,60px);border-radius:14px;
  background:rgba(255,107,53,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v01-flame-wrap i{font-size:clamp(22px,3vw,28px);color:#ff6b35}
.v01-streak-info{display:flex;flex-direction:column;gap:2px}
.v01-streak-num{font-size:clamp(28px,4vw,38px);font-weight:800;color:#ff6b35;font-family:'Manrope',sans-serif;line-height:1}

/* ═══════════════════════════════════════
   02 — SPLIT BANNER: two equal massive cards
   ═══════════════════════════════════════ */
.v02-row{display:flex;gap:12px}
.v02-card{flex:1;border-radius:18px;padding:clamp(20px,3vh,30px) clamp(16px,2.5vw,22px);
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(8px,1.5vh,12px)}
.v02-card.chal{background:linear-gradient(180deg,rgba(192,132,252,.1),rgba(192,132,252,.02));
  border:1px solid rgba(192,132,252,.15)}
.v02-card.streak{background:linear-gradient(180deg,rgba(255,107,53,.1),rgba(255,107,53,.02));
  border:1px solid rgba(255,107,53,.15)}
.v02-card i{font-size:clamp(30px,4.5vw,40px)}
.v02-card.chal i{color:#c084fc}
.v02-card.streak i{color:#ff6b35}
.v02-huge{font-size:clamp(38px,5.5vw,52px);font-weight:900;color:#fff;font-family:'Manrope',sans-serif;line-height:1}
.v02-label{font-size:clamp(12px,1.2vw,14px);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.v02-card.chal .v02-label{color:rgba(192,132,252,.5)}
.v02-card.streak .v02-label{color:rgba(255,107,53,.5)}
.v02-tag{font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px}
.v02-card.chal .v02-tag{background:rgba(192,132,252,.15);color:#c084fc}
.v02-card.streak .v02-tag{background:rgba(255,107,53,.15);color:#ff6b35}

/* ═══════════════════════════════════════
   03 — WIDE BANNER: full-width horizontal stack
   ═══════════════════════════════════════ */
.v03-banner{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);
  border-radius:18px;padding:clamp(22px,3.5vh,32px) clamp(20px,3vw,28px);
  display:flex;flex-direction:column;gap:clamp(12px,2vh,18px)}
.v03-row{display:flex;align-items:center;gap:clamp(12px,2vw,18px)}
.v03-icon-circle{width:clamp(50px,7vw,64px);height:clamp(50px,7vw,64px);border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.v03-icon-circle.chal{background:rgba(192,132,252,.1)}
.v03-icon-circle.chal i{font-size:clamp(22px,3vw,28px);color:#c084fc}
.v03-icon-circle.streak{background:rgba(255,107,53,.1)}
.v03-icon-circle.streak i{font-size:clamp(22px,3vw,28px);color:#ff6b35}
.v03-mid{flex:1;display:flex;flex-direction:column;gap:2px}
.v03-eyebrow{font-size:11px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.08em}
.v03-num{font-size:clamp(34px,5vw,46px);font-weight:900;color:#fff;font-family:'Manrope',sans-serif;line-height:1}
.v03-end{text-align:right;display:flex;flex-direction:column;gap:4px}
.v03-badge-pill{display:inline-flex;align-items:center;gap:4px;align-self:flex-end;
  font-size:13px;font-weight:700;padding:5px 14px;border-radius:100px}
.v03-badge-pill.chal{background:rgba(192,132,252,.12);color:#c084fc;border:1px solid rgba(192,132,252,.2)}
.v03-badge-pill.streak{background:rgba(255,107,53,.12);color:#ff6b35;border:1px solid rgba(255,107,53,.2)}
.v03-deadline{font-size:12px;color:rgba(255,255,255,.25)}
.v03-divider{height:1px;background:rgba(255,255,255,.04);margin:2px 0}

/* ═══════════════════════════════════════
   04 — DASHBOARD METRIC: huge number
   ═══════════════════════════════════════ */
.v04-banner{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:20px;padding:clamp(24px,4vh,36px) clamp(22px,3.5vw,30px);
  display:flex;align-items:center;gap:clamp(20px,3vw,32px)}
.v04-left{display:flex;align-items:center;gap:clamp(12px,2vw,18px);flex:1}
.v04-hex{width:clamp(54px,7.5vw,70px);height:clamp(54px,7.5vw,70px);border-radius:14px;
  background:rgba(192,132,252,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v04-hex i{font-size:clamp(24px,3.5vw,32px);color:#c084fc}
.v04-metric{display:flex;flex-direction:column}
.v04-huge{font-size:clamp(50px,7vw,72px);font-weight:900;color:#fff;font-family:'Manrope',sans-serif;line-height:.9}
.v04-unit{font-size:clamp(14px,1.5vw,18px);color:rgba(255,255,255,.25);font-weight:600}
.v04-tag-row{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.v04-pill{font-size:13px;font-weight:700;color:#c084fc;background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.2);border-radius:100px;padding:6px 16px}

.v04-streak{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:20px;padding:clamp(16px,2.5vh,22px) clamp(18px,3vw,26px);
  display:flex;align-items:center;gap:clamp(14px,2vw,20px)}
.v04-flame-big i{font-size:clamp(28px,4vw,38px);color:#ff6b35;
  filter:drop-shadow(0 0 8px rgba(255,107,53,.3))}
.v04-streak-num{font-size:clamp(30px,4.5vw,42px);font-weight:800;color:#ff6b35;font-family:'Manrope',sans-serif;line-height:1}

/* ═══════════════════════════════════════
   05 — GRADIENT BANNER: colored backgrounds
   ═══════════════════════════════════════ */
.v05-banner{background:linear-gradient(135deg,rgba(192,132,252,.15),rgba(99,102,241,.08),rgba(192,132,252,.04));
  border:1px solid rgba(192,132,252,.2);border-radius:18px;padding:clamp(22px,3.5vh,32px) clamp(20px,3vw,28px);
  display:flex;flex-direction:column;gap:clamp(10px,1.8vh,14px)}
.v05-row1{display:flex;align-items:center;gap:12px}
.v05-row1 i{font-size:clamp(24px,3vw,30px);color:#c084fc;opacity:.8}
.v05-row1 span{font-size:clamp(12px,1.2vw,14px);font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.08em}
.v05-huge-wrap{display:flex;align-items:baseline;gap:clamp(8px,1vw,12px)}
.v05-huge{font-size:clamp(56px,8vw,80px);font-weight:900;color:#fff;font-family:'Manrope',sans-serif;line-height:1}
.v05-of{font-size:clamp(20px,2.5vw,28px);color:rgba(255,255,255,.2);font-weight:700}
.v05-bottom{display:flex;align-items:center;gap:10px}
.v05-chip{font-size:13px;font-weight:700;color:#c084fc;background:rgba(192,132,252,.12);border:1px solid rgba(192,132,252,.2);border-radius:8px;padding:5px 12px}
.v05-dl{font-size:12px;color:rgba(255,255,255,.25)}

.v05-streak{background:linear-gradient(135deg,rgba(255,107,53,.12),rgba(255,107,53,.04));
  border:1px solid rgba(255,107,53,.18);border-radius:18px;padding:clamp(18px,2.8vh,24px) clamp(18px,3vw,26px);
  display:flex;align-items:center;gap:clamp(16px,2.5vw,24px)}
.v05-flame-big i{font-size:clamp(34px,5vw,44px);color:#ff6b35}
.v05-streak-num{font-size:clamp(36px,5vw,48px);font-weight:800;color:#ff6b35;font-family:'Manrope',sans-serif;line-height:1}

/* ═══════════════════════════════════════
   06 — OVERLAPPING BANNER: layered depth
   ═══════════════════════════════════════ */
.v06-card{background:rgba(20,22,30,.7);border:1px solid rgba(255,255,255,.06);
  border-radius:18px;padding:clamp(20px,3vh,28px) clamp(18px,3vw,26px);
  display:flex;align-items:center;gap:clamp(14px,2vw,20px);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.v06-card.top{z-index:2;border-color:rgba(192,132,252,.2)}
.v06-card.bot{z-index:1;margin-top:-8px;border-color:rgba(255,107,53,.15)}
.v06-icon-sq{width:clamp(48px,7vw,60px);height:clamp(48px,7vw,60px);border-radius:12px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v06-icon-sq.chal{background:rgba(192,132,252,.1)}
.v06-icon-sq.chal i{font-size:clamp(22px,3vw,26px);color:#c084fc}
.v06-icon-sq.streak{background:rgba(255,107,53,.1)}
.v06-icon-sq.streak i{font-size:clamp(22px,3vw,26px);color:#ff6b35}
.v06-big{font-size:clamp(32px,4.5vw,44px);font-weight:800;color:#fff;font-family:'Manrope',sans-serif;line-height:1}
.v06-meta{display:flex;flex-direction:column;gap:2px;margin-left:auto;text-align:right}
.v06-tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:100px}
.v06-tag.chal{background:rgba(192,132,252,.12);color:#c084fc}
.v06-tag.streak{background:rgba(255,107,53,.12);color:#ff6b35}

/* ═══════════════════════════════════════
   07 — COUNTDOWN BANNER: enormous numbers
   ═══════════════════════════════════════ */
.v07-banner{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.05);
  border-radius:18px;padding:clamp(22px,3.5vh,32px) clamp(20px,3vw,28px);
  display:flex;flex-direction:column;gap:clamp(10px,1.5vh,14px)}
.v07-eyebrow-row{display:flex;align-items:center;gap:8px}
.v07-eyebrow-row i{font-size:14px;color:#c084fc}
.v07-eyebrow-row span{font-size:12px;font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.08em}
.v07-num-row{display:flex;align-items:baseline;gap:clamp(10px,1.5vw,16px)}
.v07-enormous{font-size:clamp(64px,9vw,96px);font-weight:900;color:#fff;font-family:'Manrope',sans-serif;line-height:.85}
.v07-slash{font-size:clamp(28px,3.5vw,40px);color:rgba(255,255,255,.15);font-weight:800}
.v07-pills{display:flex;gap:8px}
.v07-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:100px;font-size:13px;font-weight:600}
.v07-pill.c1{background:rgba(192,132,252,.12);color:#c084fc;border:1px solid rgba(192,132,252,.2)}
.v07-pill.dl{background:rgba(255,255,255,.03);color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.06)}

.v07-streak{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.05);
  border-radius:18px;padding:clamp(16px,2.5vh,22px) clamp(18px,3vw,26px);
  display:flex;align-items:center;gap:clamp(14px,2vw,20px)}
.v07-flame-big i{font-size:clamp(30px,4vw,40px);color:#ff6b35}
.v07-streak-num{font-size:clamp(32px,4.5vw,44px);font-weight:800;color:#ff6b35;font-family:'Manrope',sans-serif;line-height:1}

/* ═══════════════════════════════════════
   08 — RIBBON BANNER: side accent stripe
   ═══════════════════════════════════════ */
.v08-banner{position:relative;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:16px;padding:clamp(22px,3.5vh,30px) clamp(18px,3vw,26px);overflow:hidden}
.v08-banner::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#c084fc}
.v08-inner{display:flex;align-items:center;gap:clamp(14px,2vw,20px)}
.v08-inner i{font-size:clamp(28px,4vw,36px);color:#c084fc;flex-shrink:0}
.v08-stack{flex:1;display:flex;flex-direction:column;gap:2px}
.v08-eyebrow{font-size:11px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.08em}
.v08-big{font-size:clamp(38px,5.5vw,52px);font-weight:900;color:#fff;font-family:'Manrope',sans-serif;line-height:1}
.v08-side{text-align:right;display:flex;flex-direction:column;gap:6px}
.v08-badge{font-size:14px;font-weight:700;color:#c084fc;background:rgba(192,132,252,.1);padding:4px 12px;border-radius:8px;align-self:flex-end}
.v08-sub{font-size:12px;color:rgba(255,255,255,.25)}

.v08-streak{position:relative;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:16px;padding:clamp(16px,2.5vh,22px) clamp(16px,2.5vw,24px);overflow:hidden}
.v08-streak::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#ff6b35}
.v08-streak .v08-inner i{color:#ff6b35}
.v08-streak .v08-big{font-size:clamp(28px,4vw,38px);color:#ff6b35}

/* ═══════════════════════════════════════
   09 — GLOW BANNER: illuminated
   ═══════════════════════════════════════ */
.v09-banner{background:rgba(20,22,30,.6);border:1px solid rgba(192,132,252,.18);
  border-radius:20px;padding:clamp(24px,4vh,34px) clamp(22px,3.5vw,30px);
  box-shadow:0 0 40px rgba(192,132,252,.06),inset 0 1px 0 rgba(255,255,255,.03);
  display:flex;align-items:center;gap:clamp(18px,3vw,28px)}
.v09-icon-glow{width:clamp(58px,8vw,74px);height:clamp(58px,8vw,74px);border-radius:16px;
  background:rgba(192,132,252,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 0 24px rgba(192,132,252,.15)}
.v09-icon-glow i{font-size:clamp(26px,3.5vw,34px);color:#c084fc}
.v09-info{flex:1;display:flex;flex-direction:column;gap:2px}
.v09-label{font-size:12px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.08em}
.v09-huge{font-size:clamp(44px,6.5vw,60px);font-weight:900;color:#fff;font-family:'Manrope',sans-serif;line-height:1}
.v09-end{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.v09-chip{font-size:13px;font-weight:700;color:#c084fc;background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.2);border-radius:100px;padding:5px 14px}

.v09-streak{background:rgba(20,22,30,.6);border:1px solid rgba(255,107,53,.15);
  border-radius:20px;padding:clamp(18px,3vh,24px) clamp(20px,3vw,28px);
  box-shadow:0 0 40px rgba(255,107,53,.05),inset 0 1px 0 rgba(255,255,255,.03);
  display:flex;align-items:center;gap:clamp(16px,2.5vw,24px)}
.v09-flame-glow{width:clamp(50px,7vw,62px);height:clamp(50px,7vw,62px);border-radius:14px;
  background:rgba(255,107,53,.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 0 20px rgba(255,107,53,.12)}
.v09-flame-glow i{font-size:clamp(24px,3vw,30px);color:#ff6b35}
.v09-streak-num{font-size:clamp(30px,4.5vw,42px);font-weight:800;color:#ff6b35;font-family:'Manrope',sans-serif;line-height:1}

/* ═══════════════════════════════════════
   10 — ULTRA MINIMAL: giant type, no chrome
   ═══════════════════════════════════════ */
.v10-banner{display:flex;align-items:center;gap:clamp(16px,2.5vw,24px);padding:clamp(18px,3vh,26px) 0}
.v10-i-wrap{width:clamp(56px,8vw,72px);height:clamp(56px,8vw,72px);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.v10-i-wrap i{font-size:clamp(36px,5vw,48px);color:#c084fc}
.v10-core{flex:1;display:flex;flex-direction:column;gap:0}
.v10-giga{font-size:clamp(60px,8.5vw,88px);font-weight:900;color:#fff;font-family:'Manrope',sans-serif;line-height:.85;letter-spacing:-.02em}
.v10-meta-row{display:flex;align-items:center;gap:10px;margin-top:4px}
.v10-chip{font-size:13px;font-weight:700;color:#c084fc;background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.2);border-radius:100px;padding:4px 12px}
.v10-dl{font-size:12px;color:rgba(255,255,255,.25)}

.v10-streak{display:flex;align-items:center;gap:clamp(14px,2vw,20px);padding:clamp(14px,2vh,20px) 0}

const dotsEl=document.getElementById('dots');
variants.forEach((v,i)=>{
  const sec=document.createElement('div');
  sec.className='section';
  sec.id='v'+v.n;
  sec.innerHTML='<div class="section-inner">'+v.html+'</div><div class="label">#'+v.n+' '+v.label+'</div>';
  document.body.appendChild(sec);
  const dot=document.createElement('div');dot.className='dot';
  dot.title='#'+v.n+' '+v.label;
  dot.addEventListener('click',()=>{document.getElementById('v'+v.n).scrollIntoView({behavior:'smooth'});});
  dotsEl.appendChild(dot);
});

const dots=document.querySelectorAll('.dot');
function updateActive(){
  const sections=document.querySelectorAll('.section');
  let active=0;
  sections.forEach((s,i)=>{const r=s.getBoundingClientRect();if(r.top<window.innerHeight*.5&&r.bottom>window.innerHeight*.5)active=i;});
  dots.forEach((d,i)=>d.classList.toggle('active',i===active));
}
window.addEventListener('scroll',updateActive,{passive:true});updateActive();
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const sections=document.querySelectorAll('.section');let active=0;
    sections.forEach((s,i)=>{const r=s.getBoundingClientRect();if(r.top<window.innerHeight*.5&&r.bottom>window.innerHeight*.5)active=i;});
    const next=e.key==='ArrowDown'?Math.min(active+1,sections.length-1):Math.max(active-1,0);
    sections[next].scrollIntoView({behavior:'smooth'});
  }
});
</script>
