<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>50 Polaroid Layout Variations</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#ccc;min-height:100vh}
h1{text-align:center;font-size:28px;font-weight:700;padding:32px 0 8px;letter-spacing:-.02em}
.sub{text-align:center;color:#666;font-size:13px;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:0 10px 40px;max-width:1100px;margin:0 auto}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr)}}

.cell{aspect-ratio:1;background:#13161c;border-radius:10px;position:relative;overflow:hidden;border:1px solid #1e2230;cursor:pointer;transition:border-color .2s}
.cell:hover{border-color:#3b82f6}
.cell-num{position:absolute;top:6px;left:8px;font-size:9px;font-weight:700;color:#555;z-index:5}
.cell .marker{position:absolute;background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.06)}
.cell .marker.t{top:0;left:0;right:0;height:33.33%}
.cell .marker.m{top:33.33%;left:0;right:0;height:33.33%}
.cell .marker.b{bottom:0;left:0;right:0;height:33.33%}
.cell .marker.r{position:absolute;right:0;top:0;bottom:0;width:33.33%;border-left:1px dashed rgba(255,255,255,.06)}
.p{position:absolute;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.4);background-size:cover;background-position:center}
.p1{background:linear-gradient(135deg,#4ecdc4,#2c8c84)}
.p2{background:linear-gradient(135deg,#a78bfa,#6d5acb)}
.p3{background:linear-gradient(135deg,#f59e0b,#d97706)}

.p1{background-image:url(https://images.unsplash.com/photo-1590602847861-f357a9332bbc?w=120&h=150&fit=crop)}
.p2{background-image:url(https://images.unsplash.com/photo-1478737270239-2f02b77fc618?w=120&h=150&fit=crop)}
.p3{background-image:url(https://images.unsplash.com/photo-1558618666-fcd25c85f82e?w=120&h=150&fit=crop)}

.note{text-align:center;color:#555;font-size:11px;padding-bottom:40px}
</style>
</head>
<body>
<h1>50 Polaroid Layout Variations</h1>
<p class="sub">Each cell = a different arrangement of the 3 polaroids on the right third of the page</p>
<div class="grid" id="grid"></div>
<p class="note">Click any cell → number will be logged. Tell me your 3 favorites.</p>

<script>
// Generate 50 variations
const layouts = [];
const names = [];

function r(min,max){return Math.round(min+Math.random()*(max-min))}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

for(let i=0;i<50;i++){
  const v=[];
  // Each variation has different position strategy
  const strategies = [
    // Stacked vertical
    ()=>{
      const sz=r(25,40);
      v.push({w:sz,h:sz*1.25,t:r(2,8),r:r(2,10),rot:r(-6,6)});
      v.push({w:sz-4,h:(sz-4)*1.25,t:r(30,38),r:r(4,14),rot:r(-6,6)});
      v.push({w:sz-8,h:(sz-8)*1.25,t:r(58,68),r:r(2,12),rot:r(-6,6)});
    },
    // Diagonal cascade top-right to bottom-left
    ()=>{
      const sz=r(28,42);
      v.push({w:sz,h:sz*1.2,t:r(2,12),r:r(2,8),rot:r(-8,0)});
      v.push({w:sz-5,h:(sz-5)*1.2,t:r(22,34),r:r(8,16),rot:r(-2,4)});
      v.push({w:sz-10,h:(sz-10)*1.2,t:r(45,58),r:r(14,22),rot:r(2,8)});
    },
    // Cluster top
    ()=>{
      const sz=r(22,35);
      v.push({w:sz,h:sz*1.3,t:r(2,10),r:r(2,8),rot:r(-4,4)});
      v.push({w:sz-3,h:(sz-3)*1.3,t:r(4,14),r:r(10,18),rot:r(2,6)});
      v.push({w:sz-6,h:(sz-6)*1.3,t:r(8,18),r:r(18,26),rot:r(-6,0)});
    },
    // Cluster bottom
    ()=>{
      const sz=r(22,35);
      v.push({w:sz,h:sz*1.3,t:r(50,58),r:r(2,8),rot:r(-4,4)});
      v.push({w:sz-3,h:(sz-3)*1.3,t:r(55,65),r:r(10,18),rot:r(2,6)});
      v.push({w:sz-6,h:(sz-6)*1.3,t:r(58,68),r:r(18,26),rot:r(-6,0)});
    },
    // Scattered
    ()=>{
      v.push({w:r(22,38),h:r(28,48),t:r(2,18),r:r(2,18),rot:r(-8,8)});
      v.push({w:r(20,34),h:r(26,44),t:r(22,44),r:r(6,22),rot:r(-8,8)});
      v.push({w:r(18,30),h:r(24,40),t:r(48,70),r:r(2,20),rot:r(-8,8)});
    },
    // Overlapping fan
    ()=>{
      const sz=r(28,42);
      v.push({w:sz,h:sz*1.25,t:r(4,14),r:r(2,8),rot:r(-8,-2)});
      v.push({w:sz,h:sz*1.25,t:r(10,20),r:r(6,14),rot:0});
      v.push({w:sz,h:sz*1.25,t:r(16,26),r:r(10,20),rot:r(2,8)});
    },
    // Column left-aligned
    ()=>{
      const sz=r(22,34);
      v.push({w:sz,h:sz*1.35,t:r(2,10),r:r(14,22),rot:r(-3,3)});
      v.push({w:sz,h:sz*1.35,t:r(28,38),r:r(14,22),rot:r(-3,3)});
      v.push({w:sz,h:sz*1.35,t:r(54,65),r:r(14,22),rot:r(-3,3)});
    },
    // Two big one small
    ()=>{
      v.push({w:r(32,44),h:r(40,55),t:r(2,12),r:r(2,8),rot:r(-4,2)});
      v.push({w:r(30,40),h:r(38,50),t:r(38,50),r:r(4,12),rot:r(1,5)});
      v.push({w:r(16,22),h:r(20,30),t:r(62,72),r:r(10,18),rot:r(-6,6)});
    },
    // One big two small
    ()=>{
      v.push({w:r(36,48),h:r(44,58),t:r(8,20),r:r(4,12),rot:r(-3,3)});
      v.push({w:r(18,26),h:r(22,32),t:r(2,10),r:r(18,26),rot:r(-5,5)});
      v.push({w:r(18,26),h:r(22,32),t:r(54,66),r:r(16,24),rot:r(-5,5)});
    },
    // Horizontal spread
    ()=>{
      const sz=r(20,30);
      v.push({w:sz,h:sz*1.3,t:r(8,20),r:r(2,8),rot:r(-4,2)});
      v.push({w:sz,h:sz*1.3,t:r(8,20),r:r(10,16),rot:r(-1,3)});
      v.push({w:sz,h:sz*1.3,t:r(8,20),r:r(18,24),rot:r(2,6)});
    },
  ];

  const s = pick(strategies);
  s();
  // Ensure all have required props
  v.forEach(p=>{
    p.w=p.w||30;p.h=p.h||38;p.t=p.t||20;p.r=p.r||8;p.rot=p.rot||0;
  });
  layouts.push(v);
  names.push(`Var ${i+1}`);
}

const grid=document.getElementById('grid');
layouts.forEach((v,i)=>{
  const cell=document.createElement('div');
  cell.className='cell';
  cell.innerHTML='<span class="cell-num">'+(i+1)+'</span>'+
    '<div class="marker t"></div><div class="marker m"></div><div class="marker b"></div><div class="marker r"></div>';
  v.forEach((p,j)=>{
    const el=document.createElement('div');
    el.className='p p'+(j+1);
    el.style.cssText='width:'+p.w+'%;height:'+p.h+'%;top:'+p.t+'%;right:'+p.r+'%;transform:rotate('+p.rot+'deg)';
    cell.appendChild(el);
  });
  cell.addEventListener('click',()=>{
    cell.style.borderColor='#22d3ee';
    alert('Layout #'+(i+1)+'\n\nP1: '+v[0].w+'%×'+v[0].h+'% top:'+v[0].t+'% right:'+v[0].r+'% rot:'+v[0].rot+'°\nP2: '+v[1].w+'%×'+v[1].h+'% top:'+v[1].t+'% right:'+v[1].r+'% rot:'+v[1].rot+'°\nP3: '+v[2].w+'%×'+v[2].h+'% top:'+v[2].t+'% right:'+v[2].r+'% rot:'+v[2].rot+'°');
    setTimeout(()=>cell.style.borderColor='',800);
  });
  grid.appendChild(cell);
});
</script>
</body>
</html>
