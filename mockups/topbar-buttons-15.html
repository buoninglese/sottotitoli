<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Bar — Interactive Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrapper{text-align:center;width:100%;max-width:800px;padding:0 20px}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.25);margin-bottom:24px}

/* ═══ TOPBAR ═══ */
.topbar{display:flex;align-items:center;justify-content:center;gap:20px}
.topbar-center{display:flex;align-items:center;gap:8px;position:relative}

/* ═══ BUTTONS ═══ */
.btn{
  font-family:Inter,sans-serif;font-size:14px;font-weight:900;
  padding:12px 24px;border:3px solid #fff;background:transparent;color:#fff;
  cursor:pointer;text-transform:uppercase;letter-spacing:.04em;
  border-radius:16px;transition:all .15s cubic-bezier(.4,0,.2,1);
  display:inline-flex;align-items:center;justify-content:center;
  height:48px;line-height:1;white-space:nowrap;position:relative;z-index:2;
  user-select:none;-webkit-tap-highlight-color:transparent;
}
.btn:hover{background:#fff;color:#000;transform:translate(-3px,-3px);box-shadow:6px 6px 0 rgba(255,255,255,.2)}
.btn:active{transform:translate(0,0);box-shadow:none}
.btn.active{background:#06b6d4;border-color:#06b6d4;color:#000;box-shadow:6px 6px 0 rgba(6,182,212,.3)}
.btn.active:hover{background:#06b6d4;color:#000;box-shadow:6px 6px 0 rgba(6,182,212,.3)}
.btn-cap,.btn-tr{padding:12px 20px;min-width:120px}
.btn-flag{width:48px;padding:0;font-size:18px;border-radius:16px}

/* ═══ FLAG EXPANDER ═══ */
.flag-expander{display:inline-flex;align-items:center;position:relative;z-index:1}
.flag-row{display:flex;gap:8px;align-items:center;overflow:hidden;max-width:0;opacity:0;transition:max-width .35s cubic-bezier(.4,0,.2,1),opacity .25s ease,margin .35s cubic-bezier(.4,0,.2,1)}
.flag-row.open{max-width:400px;opacity:1}
.flag-row.left{margin-right:0}
.flag-row.left.open{margin-right:8px}
.flag-row.right{margin-left:0}
.flag-row.right.open{margin-left:8px}

/* Staggered appear for each flag */
.flag-row .btn-flag{transform:scale(0);opacity:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .15s ease}
.flag-row.open .btn-flag:nth-child(1){transform:scale(1);opacity:1;transition-delay:.05s}
.flag-row.open .btn-flag:nth-child(2){transform:scale(1);opacity:1;transition-delay:.1s}
.flag-row.open .btn-flag:nth-child(3){transform:scale(1);opacity:1;transition-delay:.15s}
.flag-row.open .btn-flag:nth-child(4){transform:scale(1);opacity:1;transition-delay:.2s}
.flag-row.open .btn-flag:nth-child(5){transform:scale(1);opacity:1;transition-delay:.25s}
.flag-row.open .btn-flag:nth-child(6){transform:scale(1);opacity:1;transition-delay:.3s}

.flag-row .btn-flag.selected{background:#06b6d4;border-color:#06b6d4;color:#000;box-shadow:6px 6px 0 rgba(6,182,212,.3);transform:scale(1)!important}

/* ═══ MODE LABEL ═══ */
.mode-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.2);margin-top:20px;transition:color .3s}
.mode-label strong{color:#06b6d4;transition:color .3s}
.mode-label strong.translate{color:#a78bfa}

/* ═══ INFO ═══ */
.info{font-size:11px;color:rgba(255,255,255,.15);margin-top:32px;line-height:1.8}
.info kbd{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:2px 6px;font-family:Inter,sans-serif;font-size:10px}
</style>
</head>
<body>
<div class="wrapper">

<h2>Click flags to pick languages · Click Caption/Translate to switch mode</h2>

<div class="topbar">

  <!-- LEFT side: flag expander (source language) -->
  <div class="flag-expander" id="leftExpander">
    <button class="btn btn-flag" id="btnLeftFlag" title="Source language">🇬🇧</button>
    <div class="flag-row left" id="leftFlagRow">
      <button class="btn btn-flag" data-lang="en" data-flag="🇬🇧">🇬🇧</button>
      <button class="btn btn-flag" data-lang="nl" data-flag="🇳🇱">🇳🇱</button>
      <button class="btn btn-flag" data-lang="it" data-flag="🇮🇹">🇮🇹</button>
      <button class="btn btn-flag" data-lang="es" data-flag="🇪🇸">🇪🇸</button>
      <button class="btn btn-flag" data-lang="fr" data-flag="🇫🇷">🇫🇷</button>
      <button class="btn btn-flag" data-lang="de" data-flag="🇩🇪">🇩🇪</button>
    </div>
  </div>

  <!-- CENTER: Caption / Translate toggle -->
  <div class="topbar-center">
    <button class="btn btn-cap active" id="btnCaption"><i class="fas fa-closed-captioning"></i>&nbsp;Caption</button>
    <button class="btn btn-tr" id="btnTranslate"><i class="fas fa-language"></i>&nbsp;Translate</button>
  </div>

  <!-- RIGHT side: flag expander (target language) -->
  <div class="flag-expander" id="rightExpander">
    <div class="flag-row right" id="rightFlagRow">
      <button class="btn btn-flag" data-lang="en" data-flag="🇬🇧">🇬🇧</button>
      <button class="btn btn-flag" data-lang="nl" data-flag="🇳🇱">🇳🇱</button>
      <button class="btn btn-flag" data-lang="it" data-flag="🇮🇹">🇮🇹</button>
      <button class="btn btn-flag" data-lang="es" data-flag="🇪🇸">🇪🇸</button>
      <button class="btn btn-flag" data-lang="fr" data-flag="🇫🇷">🇫🇷</button>
      <button class="btn btn-flag" data-lang="de" data-flag="🇩🇪">🇩🇪</button>
    </div>
    <button class="btn btn-flag" id="btnRightFlag" title="Target language">🇮🇹</button>
  </div>

</div>

<div class="mode-label" id="modeLabel">
  MODE: <strong id="modeStrong">CAPTION</strong> · SOURCE: <strong id="sourceLang">🇬🇧 EN</strong><span id="targetInfo" style="display:none"> · TARGET: <strong id="targetLang" class="translate">🇮🇹 IT</strong></span>
</div>

<div class="info">
  Click the <kbd>🇬🇧</kbd> flag to expand language options &nbsp;|&nbsp; Click <kbd>Caption</kbd> / <kbd>Translate</kbd> to switch mode &nbsp;|&nbsp; In Translate mode, pick a target language on the right
</div>

</div>

<script>
(function(){
  const btnLeftFlag   = document.getElementById('btnLeftFlag');
  const btnRightFlag  = document.getElementById('btnRightFlag');
  const leftFlagRow   = document.getElementById('leftFlagRow');
  const rightFlagRow  = document.getElementById('rightFlagRow');
  const btnCaption    = document.getElementById('btnCaption');
  const btnTranslate  = document.getElementById('btnTranslate');
  const rightExpander = document.getElementById('rightExpander');
  const modeStrong    = document.getElementById('modeStrong');
  const sourceLang    = document.getElementById('sourceLang');
  const targetLang    = document.getElementById('targetLang');
  const targetInfo    = document.getElementById('targetInfo');

  let mode = 'caption';    // 'caption' | 'translate'
  let leftOpen = false;
  let rightOpen = false;
  let sourceFlag = '🇬🇧', sourceCode = 'EN';
  let targetFlag = '🇮🇹', targetCode = 'IT';

  function closeAllExcept(keep){
    if(keep!=='left') closeLeft();
    if(keep!=='right') closeRight();
  }
  function closeLeft(){
    leftFlagRow.classList.remove('open'); leftOpen=false;
    btnLeftFlag.classList.remove('active');
  }
  function closeRight(){
    rightFlagRow.classList.remove('open'); rightOpen=false;
    btnRightFlag.classList.remove('active');
  }

  function markSelected(row, code){
    row.querySelectorAll('.btn-flag').forEach(b => b.classList.remove('selected'));
    const match = row.querySelector(`[data-lang="${code}"]`);
    if(match) match.classList.add('selected');
  }

  // Hide the currently-selected flag from its own dropdown row
  function refreshFlagRows(){
    leftFlagRow.querySelectorAll('.btn-flag').forEach(b => {
      b.style.display = (b.dataset.lang === sourceCode.toLowerCase()) ? 'none' : '';
    });
    rightFlagRow.querySelectorAll('.btn-flag').forEach(b => {
      b.style.display = (b.dataset.lang === targetCode.toLowerCase()) ? 'none' : '';
    });
  }

  function updateUI(){
    if(mode==='caption'){
      btnCaption.classList.add('active'); btnTranslate.classList.remove('active');
      modeStrong.textContent='CAPTION'; modeStrong.className='';
      targetInfo.style.display='none';
      rightExpander.style.opacity='0.3'; rightExpander.style.pointerEvents='none';
      closeRight();
    } else {
      btnTranslate.classList.add('active'); btnCaption.classList.remove('active');
      modeStrong.textContent='TRANSLATE'; modeStrong.className='translate';
      targetInfo.style.display='';
      rightExpander.style.opacity='1'; rightExpander.style.pointerEvents='auto';
    }
    sourceLang.textContent = sourceFlag+' '+sourceCode;
    targetLang.textContent = targetFlag+' '+targetCode;
    refreshFlagRows();
  }

  // ── LEFT FLAG click ──
  btnLeftFlag.addEventListener('click',(e)=>{
    e.stopPropagation();
    closeRight();
    if(leftOpen){ closeLeft(); return; }
    leftFlagRow.classList.add('open'); leftOpen=true;
    btnLeftFlag.classList.add('active');
    markSelected(leftFlagRow, sourceCode.toLowerCase());
  });

  // ── RIGHT FLAG click ──
  btnRightFlag.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(mode!=='translate') return;
    closeLeft();
    if(rightOpen){ closeRight(); return; }
    rightFlagRow.classList.add('open'); rightOpen=true;
    btnRightFlag.classList.add('active');
    markSelected(rightFlagRow, targetCode.toLowerCase());
  });

  // ── pick a language from row ──
  document.querySelectorAll('.flag-row .btn-flag').forEach(btn=>{
    btn.addEventListener('click',(e)=>{
      e.stopPropagation();
      const lang = btn.dataset.lang, flag = btn.dataset.flag;
      const row = btn.closest('.flag-row');
      const isLeft = row.classList.contains('left');
      markSelected(row, lang);
      if(isLeft){
        sourceFlag=flag; sourceCode=lang.toUpperCase();
        btnLeftFlag.textContent=flag;
      } else {
        targetFlag=flag; targetCode=lang.toUpperCase();
        btnRightFlag.textContent=flag;
      }
      setTimeout(()=>{
        row.classList.remove('open');
        if(isLeft){leftOpen=false;btnLeftFlag.classList.remove('active');}
        else {rightOpen=false;btnRightFlag.classList.remove('active');}
      },200);
      updateUI();
    });
  });

  // ── CAPTION / TRANSLATE toggle ──
  btnCaption.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(mode==='caption') return;
    mode='caption'; closeAllExcept(null); updateUI();
    btnCaption.style.transform='scale(1.08)'; setTimeout(()=>btnCaption.style.transform='',150);
  });
  btnTranslate.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(mode==='translate') return;
    mode='translate'; closeAllExcept(null); updateUI();
    btnTranslate.style.transform='scale(1.08)'; setTimeout(()=>btnTranslate.style.transform='',150);
  });

  // ── click outside closes ──
  document.addEventListener('click',()=>closeAllExcept(null));

  // ── init ──
  markSelected(leftFlagRow, sourceCode.toLowerCase());
  markSelected(rightFlagRow, targetCode.toLowerCase());
  refreshFlagRows();
  updateUI();
})();
</script>
</body>
</html>
