<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Wave — Interactive Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--card:#1a1d26;--card2:#22252f;--line:rgba(255,255,255,.06);--text:#e5e7eb;--muted:#9ca3af;--muted2:#6b7280;--accent:#a78bfa;--accent2:#c4b5fd}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
h1{font-size:20px;font-weight:800;margin-bottom:2px}
.sub{font-size:11px;color:var(--muted2);margin-bottom:14px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:11px;font-weight:600;padding:6px 14px;border-radius:100px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--accent)}
.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{background:transparent;color:#f87171;border-color:rgba(248,113,113,.3)}
.meter{width:100%;height:3px;background:var(--card2);border-radius:2px;overflow:hidden;margin-bottom:12px}
.meter-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);transition:width .04s;width:0%}
.main-layout{display:flex;gap:14px}
.controls{width:280px;flex-shrink:0;display:flex;flex-direction:column;gap:10px}
.ctrl-group{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.ctrl-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2);margin-bottom:8px}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ctrl-row span{font-size:10px;color:var(--muted)}
.ctrl-row input[type=range]{width:100px;accent-color:var(--accent)}
.ctrl-row select{font-family:inherit;font-size:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.toggle-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.toggle-pill{font-family:inherit;font-size:9px;font-weight:600;padding:3px 10px;border-radius:100px;border:1px solid var(--line);background:var(--card2);color:var(--muted2);cursor:pointer;transition:all .15s}
.toggle-pill:hover{border-color:var(--accent)}
.toggle-pill.on{background:rgba(167,139,250,.15);color:var(--accent2);border-color:var(--accent)}
.preview-area{flex:1;display:flex;flex-direction:column;gap:10px}
.preview-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.preview-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted2)}
.preview-box canvas{width:100%;height:64px;border-radius:8px;background:var(--bg)}
@media(max-width:700px){.main-layout{flex-direction:column}.controls{width:100%}}
</style>
</head>
<body>

<h1>🔬 Particle Wave — Interactive Lab</h1>
<p class="sub">Adjust sliders in real-time. Toggle modes. Pure Web Audio — no speech recognition.</p>

<div class="topbar">
  <button class="btn" id="micBtn" onclick="toggleMic()">🎤 Start Mic</button>
  <span style="font-size:10px;color:var(--muted2)" id="micLabel">Mic off</span>
</div>
<div class="meter"><div class="meter-fill" id="meterFill"></div></div>

<div class="main-layout">
  <!-- Controls -->
  <div class="controls">
    <div class="ctrl-group">
      <div class="ctrl-label">🎨 Mode</div>
      <div class="toggle-row" id="modeToggles">
        <button class="toggle-pill on" data-mode="scatter">🌌 Scatter→Line</button>
        <button class="toggle-pill" data-mode="fill">✨ Fill Empty</button>
        <button class="toggle-pill" data-mode="swarm">🐝 Swarm</button>
        <button class="toggle-pill" data-mode="pulse">💫 Pulse</button>
      </div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label">🎯 Behavior</div>
      <div class="ctrl-row"><span>Particles</span><input type="range" min="20" max="300" value="120" id="rParticles" oninput="updateAll()"><span id="vParticles">120</span></div>
      <div class="ctrl-row"><span>Scatter</span><input type="range" min="1" max="25" value="8" id="rScatter" oninput="updateAll()"><span id="vScatter">8</span></div>
      <div class="ctrl-row"><span>Response</span><input type="range" min="50" max="100" value="92" id="rResponse" oninput="updateAll()"><span id="vResponse">0.92</span></div>
      <div class="ctrl-row"><span>Damping</span><input type="range" min="55" max="96" value="78" id="rDamping" oninput="updateAll()"><span id="vDamping">0.78</span></div>
      <div class="ctrl-row"><span>Attraction</span><input type="range" min="3" max="40" value="12" id="rAttract" oninput="updateAll()"><span id="vAttract">0.012</span></div>
      <div class="ctrl-row"><span>Glow</span><input type="range" min="0" max="50" value="20" id="rGlow" oninput="updateAll()"><span id="vGlow">0.20</span></div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label">🌈 Color</div>
      <div class="ctrl-row"><span>Hue base</span><input type="range" min="0" max="360" value="10" id="rHue0" oninput="updateAll()"><span id="vHue0">10</span></div>
      <div class="ctrl-row"><span>Hue range</span><input type="range" min="10" max="200" value="80" id="rHueR" oninput="updateAll()"><span id="vHueR">80</span></div>
      <div class="ctrl-row"><span>Size</span><input type="range" min="3" max="18" value="8" id="rSize" oninput="updateAll()"><span id="vSize">0.8</span></div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label">⚡ Presets</div>
      <div class="toggle-row">
        <button class="toggle-pill" onclick="preset('wild')">🌪 Wild</button>
        <button class="toggle-pill" onclick="preset('tight')">📏 Tight</button>
        <button class="toggle-pill" onclick="preset('ghost')">👻 Ghost</button>
        <button class="toggle-pill" onclick="preset('fire')">🔥 Fire</button>
        <button class="toggle-pill" onclick="preset('ice')">❄️ Ice</button>
        <button class="toggle-pill" onclick="preset('aurora')">🌌 Aurora</button>
      </div>
    </div>
  </div>

  <!-- Preview -->
  <div class="preview-area">
    <div class="preview-box">
      <div class="preview-title" id="previewLabel">🌌 Scatter→Line</div>
      <canvas id="mainCanvas"></canvas>
    </div>
    <div class="preview-box">
      <div class="preview-title">🔍 Zoom (2× scale)</div>
      <canvas id="zoomCanvas" style="height:128px"></canvas>
    </div>
  </div>
</div>

<script>
// ═══ Audio ═══
var audioCtx=null,analyser=null,micStream=null,micActive=false,rawVolume=0;
async function toggleMic(){micActive?stopMic():startMic()}
async function startMic(){
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;audioCtx.createMediaStreamSource(micStream).connect(analyser);micActive=true;updateMicUI(true)}catch(e){alert('Mic denied')}
}
function stopMic(){if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}if(audioCtx){audioCtx.close();audioCtx=null;analyser=null}micActive=false;rawVolume=0;updateMicUI(false)}
function updateMicUI(on){
  var b=document.getElementById('micBtn'),l=document.getElementById('micLabel');
  if(on){b.textContent='⏹ Stop Mic';b.classList.add('active');l.textContent='Mic live'}else{b.textContent='🎤 Start Mic';b.classList.remove('active');l.textContent='Mic off';document.getElementById('meterFill').style.width='0%'}
}
function readVolume(){
  if(!analyser)return 0;var d=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(d);var s=0;for(var i=0;i<d.length;i++)s+=d[i];return Math.min(1,s/d.length/128);
}

// ═══ State ═══
var params={mode:'scatter',n:120,kalei:8,smooth:0.92,damp:0.78,attr:0.012,glow:0.20,hue0:10,hueR:80,size0:0.8,orbMin:3,orbMax:20};
var vol=0,particles=[],inited=false;

function updateAll(){
  params.n=parseInt(document.getElementById('rParticles').value);
  params.kalei=parseInt(document.getElementById('rScatter').value);
  params.smooth=parseInt(document.getElementById('rResponse').value)/100;
  params.damp=parseInt(document.getElementById('rDamping').value)/100;
  params.attr=parseInt(document.getElementById('rAttract').value)/1000;
  params.glow=parseInt(document.getElementById('rGlow').value)/100;
  params.hue0=parseInt(document.getElementById('rHue0').value);
  params.hueR=parseInt(document.getElementById('rHueR').value);
  params.size0=parseInt(document.getElementById('rSize').value)/10;
  refreshLabels();
  initParticles();
}
function refreshLabels(){
  document.getElementById('vParticles').textContent=params.n;
  document.getElementById('vScatter').textContent=params.kalei;
  document.getElementById('vResponse').textContent=params.smooth.toFixed(2);
  document.getElementById('vDamping').textContent=params.damp.toFixed(2);
  document.getElementById('vAttract').textContent=params.attr.toFixed(3);
  document.getElementById('vGlow').textContent=params.glow.toFixed(2);
  document.getElementById('vHue0').textContent=params.hue0;
  document.getElementById('vHueR').textContent=params.hueR;
  document.getElementById('vSize').textContent=params.size0.toFixed(1);
}
function setSliders(){
  document.getElementById('rParticles').value=params.n;
  document.getElementById('rScatter').value=params.kalei;
  document.getElementById('rResponse').value=Math.round(params.smooth*100);
  document.getElementById('rDamping').value=Math.round(params.damp*100);
  document.getElementById('rAttract').value=Math.round(params.attr*1000);
  document.getElementById('rGlow').value=Math.round(params.glow*100);
  document.getElementById('rHue0').value=params.hue0;
  document.getElementById('rHueR').value=params.hueR;
  document.getElementById('rSize').value=Math.round(params.size0*10);
  refreshLabels();
}

function preset(name){
  var p={};
  if(name==='wild')p={n:80,kalei:18,damp:0.62,attr:0.025,smooth:0.97,glow:0.28,hue0:20,hueR:120,size0:1.0,orbMin:8,orbMax:45};
  if(name==='tight')p={n:220,kalei:3,damp:0.88,attr:0.014,smooth:0.90,glow:0.10,hue0:260,hueR:60,size0:0.4,orbMin:1,orbMax:6};
  if(name==='ghost')p={n:60,kalei:22,damp:0.92,attr:0.003,smooth:0.85,glow:0.04,hue0:180,hueR:40,size0:0.6,orbMin:10,orbMax:55};
  if(name==='fire')p={n:140,kalei:12,damp:0.72,attr:0.018,smooth:0.95,glow:0.32,hue0:5,hueR:40,size0:0.9,orbMin:5,orbMax:30};
  if(name==='ice')p={n:160,kalei:7,damp:0.84,attr:0.010,smooth:0.93,glow:0.14,hue0:195,hueR:50,size0:0.5,orbMin:3,orbMax:16};
  if(name==='aurora')p={n:130,kalei:10,damp:0.76,attr:0.015,smooth:0.94,glow:0.22,hue0:260,hueR:140,size0:0.7,orbMin:4,orbMax:25};
  Object.keys(p).forEach(function(k){params[k]=p[k]});
  setSliders();
  initParticles();
}

function initParticles(){
  var cv=document.getElementById('mainCanvas'),w=cv.clientWidth,h=64;
  cv.width=w*devicePixelRatio;cv.height=h*devicePixelRatio;
  var ps=[],n=params.n,mode=params.mode;
  for(var i=0;i<n;i++){
    var tx=(i/(n-1))*w,ty=h/2;
    // Starting positions vary by mode
    var sx,sy;
    if(mode==='fill'){sx=tx+(Math.random()-.5)*params.orbMax*8;sy=ty+(Math.random()-.5)*params.orbMax*8} // far outside
    else if(mode==='swarm'){sx=Math.random()*w;sy=Math.random()*h}
    else if(mode==='pulse'){sx=w/2+(Math.random()-.5)*20;sy=h/2+(Math.random()-.5)*20}
    else{sx=Math.random()*w;sy=5+Math.random()*(h-10)}
    ps.push({tx:tx,ty:ty,x:sx,y:sy,vx:0,vy:0,phase:Math.random()*Math.PI*2,freq:0.2+Math.random()*0.8,orbitR:params.orbMin+Math.random()*(params.orbMax-params.orbMin)});
  }
  particles=ps;inited=true;
}

// Mode toggles
document.getElementById('modeToggles').addEventListener('click',function(e){
  if(!e.target.classList.contains('toggle-pill'))return;
  document.querySelectorAll('#modeToggles .toggle-pill').forEach(function(b){b.classList.remove('on')});
  e.target.classList.add('on');
  params.mode=e.target.dataset.mode;
  document.getElementById('previewLabel').textContent=e.target.textContent;
  initParticles();
});

function frame(ts){
  requestAnimationFrame(frame);
  if(micActive){var raw=readVolume();rawVolume+=(raw-rawVolume)*0.9;vol+=(rawVolume-vol)*params.smooth}
  else{vol=Math.max(0,vol*0.92);rawVolume=Math.max(0,rawVolume*0.92)}
  document.getElementById('meterFill').style.width=(rawVolume*100)+'%';
  if(!inited)return;

  var cv=document.getElementById('mainCanvas'),w=cv.clientWidth,h=64;
  if(cv.width!==w*devicePixelRatio||cv.height!==h*devicePixelRatio){initParticles();return}
  var ctx=cv.getContext('2d'),dpr=devicePixelRatio;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);

  var mode=params.mode;
  // Fill mode: opacity based on volume
  var alphaMult=1;
  if(mode==='fill')alphaMult=Math.pow(vol,1.5);

  // Glow
  if(vol>0.02&&params.glow>0){
    ctx.save();ctx.globalAlpha=vol*params.glow;ctx.filter='blur('+(4+vol*12)+'px)';
    ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);
    ctx.strokeStyle='#a78bfa';ctx.lineWidth=2+vol*6;ctx.stroke();ctx.restore();
  }

  // Draw target line faintly
  ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);
  ctx.strokeStyle='rgba(255,255,255,'+(0.03+vol*0.08)+')';ctx.lineWidth=1;ctx.stroke();

  for(var i=0;i<particles.length;i++){
    var p=particles[i],time=ts*0.001;
    // Kaleidoscope
    var kaleiS=(1-vol)*params.kalei;
    if(mode==='pulse')kaleiS*=(0.5+0.5*Math.sin(time*3+i*0.1));
    if(mode==='swarm')kaleiS*=1.5;
    var kx=Math.cos(time*p.freq+p.phase)*p.orbitR*kaleiS;
    var ky=Math.sin(time*p.freq*0.7+p.phase)*p.orbitR*kaleiS;
    kx+=Math.cos(time*0.3+p.phase*2)*p.orbitR*0.5*kaleiS;
    ky+=Math.sin(time*0.37+p.phase*1.7)*p.orbitR*0.5*kaleiS;

    var tx=p.tx+kx,ty=p.ty+ky;

    // Swarm mode: targets move
    if(mode==='swarm'){tx+=Math.cos(time*0.5+i*0.3)*20*vol;ty+=Math.sin(time*0.4+i*0.25)*15*vol}

    var dx=tx-p.x,dy=ty-p.y;
    p.vx+=dx*params.attr*(mode==='fill'?1+vol*3:1);
    p.vy+=dy*params.attr*(mode==='fill'?1+vol*3:1);
    p.vx*=params.damp;p.vy*=params.damp;
    p.x+=p.vx;p.y+=p.vy;

    var r=params.size0+vol*3.0+(1-vol)*Math.abs(Math.sin(time*2+p.phase));
    if(mode==='fill')r=vol*4.0;
    if(mode==='pulse')r=params.size0+vol*5.0*Math.abs(Math.sin(time*4+i*0.2));

    var hue=(params.hue0+i/particles.length*params.hueR+vol*40)%360;
    var sat=55+vol*25,lit=45+vol*30;
    var alpha=(0.35+vol*0.55)*alphaMult;
    if(alpha<0.02)continue;

    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fillStyle='hsla('+hue+','+sat+'%,'+lit+'%,'+alpha+')';ctx.fill();

    if(vol>0.2&&r>1.5){
      ctx.beginPath();ctx.arc(p.x,p.y,r*2.8,0,Math.PI*2);
      ctx.fillStyle='hsla('+(params.hue0+i/particles.length*params.hueR)+',70%,60%,'+(vol*0.07)+')';ctx.fill();
    }
  }

  // Zoom canvas (copy main at 2x)
  var zcv=document.getElementById('zoomCanvas'),zw=zcv.clientWidth,zh=128;
  if(zcv.width!==zw*devicePixelRatio)zcv.width=zw*devicePixelRatio;
  if(zcv.height!==zh*devicePixelRatio)zcv.height=zh*devicePixelRatio;
  var zctx=zcv.getContext('2d');zctx.setTransform(dpr,0,0,dpr,0,0);zctx.clearRect(0,0,zw,zh);
  zctx.drawImage(cv,0,0,w,h,0,0,zw,zh);
}

preset('wild');
requestAnimationFrame(frame);
</script>
</body>
</html>
