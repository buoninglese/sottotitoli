<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · 37 · 10 Grammar Rings</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px}h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:2px}@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}.subtitle{text-align:center;color:#8b93a5;margin-bottom:28px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;max-width:1200px;margin:0 auto}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:440px){.grid{grid-template-columns:1fr;max-width:280px}}.ring-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:20px 16px 18px;text-align:center;transition:all .35s;animation:fadeInUp .5s ease both;display:flex;flex-direction:column;align-items:center;gap:10px}.ring-card:hover{transform:translateY(-4px);box-shadow:0 14px 44px rgba(0,0,0,.5);border-color:#2a2e3e}.ring-svg{width:110px;height:110px}.ring-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:8}.ring-arc{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1.8s cubic-bezier(.25,.46,.45,.94)}.ring-center{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:900;fill:#e8eaed}.ring-pct{font-family:'JetBrains Mono',monospace;font-size:9px;fill:rgba(255,255,255,.35)}.ring-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.7);line-height:1.3;max-width:130px}.ring-sub{font-size:9px;color:rgba(255,255,255,.3);margin-top:2px}@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:32px;padding:16px;background:#0f121e;border:1px solid #1a1e2e;border-radius:12px;max-width:1200px;margin-left:auto;margin-right:auto}.legend-item{display:flex;align-items:center;gap:6px;font-size:10px;color:rgba(255,255,255,.5)}.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}</style></head><body><h1>📊 37 · 10 Grammar Rings</h1><p class="subtitle">Real-time Grammar Accuracy Gauges — June 2026</p><div class="grid" id="ringGrid"></div><div class="legend" id="legend"></div><script>const rings=[{name:'Prepositions',sub:'in, on, at, to, for',pct:90,color:'#a78bfa',delay:0},{name:'Articles',sub:'a, an, the, Ø article',pct:85,color:'#60a5fa',delay:80},{name:'Verb Tense',sub:'past, present, future, perfect',pct:78,color:'#34d399',delay:160},{name:'S-V Agreement',sub:'subject matches verb number',pct:92,color:'#fbbf24',delay:240},{name:'Word Order',sub:'SVO, clause positioning',pct:88,color:'#f472b6',delay:320},{name:'Pronoun Ref',sub:'it, they, this, that, which',pct:81,color:'#22d3ee',delay:400},{name:'Conjunction Use',sub:'and, but, because, although',pct:76,color:'#fb923c',delay:480},{name:'Plural Forms',sub:'-s, -es, irregular plurals',pct:94,color:'#f87171',delay:560},{name:'Possessives',sub:"'s, of, possessive pronouns",pct:83,color:'#818cf8',delay:640},{name:'Overall Score',sub:'combined grammar accuracy',pct:87,color:'url(#gradG)',delay:720}];const R=45;const circumference=2*Math.PI*R;function buildRing(r){const uid='arc'+r.name.replace(/[^a-zA-Z]/g,'');const gradientId='grad'+r.name.replace(/[^a-zA-Z]/g,'');const dashVal=(r.pct/100)*circumference;const offset=circumference;let defs='';if(typeof r.color==='string'&&r.color.startsWith('url')){defs=`<defs><linearGradient id="${gradientId}" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#34d399"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs>`}const strokeColor=typeof r.color==='string'&&r.color.startsWith('url')?`url(#${gradientId})`:r.color;return`<svg class="ring-svg" viewBox="0 0 120 120">${defs}<circle class="ring-bg" cx="60" cy="60" r="${R}"/><circle class="ring-arc" id="${uid}" cx="60" cy="60" r="${R}" stroke="${strokeColor}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" data-target="${dashVal}" data-offset="${offset}"/><text class="ring-center" x="60" y="56" text-anchor="middle">${r.pct}%</text><text class="ring-pct" x="60" y="72" text-anchor="middle">accuracy</text></svg>`}function buildLabel(r){return`<div class="ring-label">${r.name}</div><div class="ring-sub">${r.sub}</div>`}const grid=document.getElementById('ringGrid');const legend=document.getElementById('legend');rings.forEach((r,i)=>{const card=document.createElement('div');card.className='ring-card';card.style.animationDelay=(i*0.06)+'s';card.innerHTML=buildRing(r)+buildLabel(r);grid.appendChild(card);const dot=document.createElement('span');dot.className='legend-dot';if(r.color.startsWith('url')){dot.style.background='linear-gradient(90deg,#60a5fa,#34d399,#a78bfa)'}else{dot.style.background=r.color}const item=document.createElement('div');item.className='legend-item';item.appendChild(dot);item.appendChild(document.createTextNode(r.name+' '+r.pct+'%'));legend.appendChild(item)});requestAnimationFrame(()=>{requestAnimationFrame(()=>{rings.forEach(r=>{const uid='arc'+r.name.replace(/[^a-zA-Z]/g,'');const el=document.getElementById(uid);if(!el)return;setTimeout(()=>{el.style.strokeDashoffset=el.dataset.target},r.delay)})})});</script></body></html>
