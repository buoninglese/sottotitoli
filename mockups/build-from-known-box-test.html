<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Box Test — Build From What You Know · Sottotitoli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{--font-ui:"Inter",ui-sans-serif,system-ui,sans-serif;--font-display:"Manrope",sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-ui);background:#0b151c;color:#d8eaf4;min-height:100vh;transition:background .3s,color .3s}
    body.light{background:#f0f6f8;color:#0f1c24}

    /* Top bar */
    .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:rgba(20,30,40,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.06)}
    body.light .topbar{background:rgba(255,255,255,.85);border-bottom:1px solid #d4e6ee}
    .topbar h1{font-size:20px;font-weight:800;letter-spacing:-.5px}
    .topbar h1 span{color:#06b6d4}
    .topbar-actions{display:flex;gap:8px;align-items:center}
    .topbar button{height:32px;padding:0 14px;border-radius:99px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font-ui);transition:all .2s}
    body.light .topbar button{border-color:rgba(0,0,0,.1);background:rgba(0,0,0,.02);color:rgba(0,0,0,.5)}
    .topbar button:hover{border-color:#06b6d4;color:#06b6d4}
    .topbar button.active{background:#06b6d4;color:#fff;border-color:#06b6d4}

    /* Control panel */
    .controls{max-width:1300px;margin:0 auto;padding:20px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .controls input{flex:1;min-width:200px;max-width:360px;height:40px;padding:0 16px;border-radius:10px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;font-size:14px;font-family:var(--font-ui);outline:none;transition:border .2s}
    body.light .controls input{border-color:rgba(0,0,0,.12);background:#fff;color:#0f1c24}
    .controls input:focus{border-color:#06b6d4}
    .controls select{height:40px;padding:0 12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#fff;font-size:13px;font-family:var(--font-ui);cursor:pointer;outline:none}
    body.light .controls select{border-color:rgba(0,0,0,.12);background:#fff;color:#0f1c24}
    .controls .sep{width:1px;height:24px;background:rgba(255,255,255,.08);margin:0 4px}
    body.light .controls .sep{background:rgba(0,0,0,.08)}

    /* API selectors row */
    .api-selectors{max-width:1300px;margin:0 auto;padding:0 24px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .api-selectors label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.3);margin-right:2px}
    body.light .api-selectors label{color:rgba(0,0,0,.35)}
    .api-selectors .chip-row{display:flex;gap:4px}
    .api-selectors .chip{font-size:10px;font-weight:600;padding:5px 12px;border-radius:99px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:rgba(255,255,255,.4);cursor:pointer;transition:all .2s;white-space:nowrap}
    body.light .api-selectors .chip{border-color:rgba(0,0,0,.1);background:rgba(0,0,0,.02);color:rgba(0,0,0,.4)}
    .api-selectors .chip:hover{border-color:#06b6d4;color:#06b6d4}
    .api-selectors .chip.active{background:#06b6d4;color:#fff;border-color:#06b6d4}

    /* Box grid */
    .results-wrap{max-width:1300px;margin:0 auto;padding:0 24px 40px}
    .results-wrap h2{font-size:14px;font-weight:700;margin-bottom:12px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em}
    body.light .results-wrap h2{color:rgba(0,0,0,.35)}
    .box-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;overflow:visible}

    /* ═══ BOX STYLES ═══ */
    /* Shared variables per box variant */
    .box-grid{--sz-dark:#0f1c24;--sz-dark-border:#0f1c24;--sz-darktext:#fff;--sz-darktext2:rgba(255,255,255,.5);--sz-accent:#06b6d4;--sz-trans-border:#0f1c24}
    body.light .box-grid{--sz-dark:#d8eaf4;--sz-dark-border:#d8eaf4;--sz-darktext:#0b151c;--sz-darktext2:rgba(11,21,28,.5);--sz-accent:#0e7490;--sz-trans-border:#d8eaf4}

    /* Box base */
    .bx{background:#fff;border:3px solid #0f1c24;border-radius:0;padding:0;box-shadow:10px 10px 0 rgba(0,0,0,.2);display:grid;grid-template-columns:1fr 56px;grid-template-rows:1fr;grid-template-areas:"main bar";align-items:stretch;font-family:var(--font-ui);transition:transform .25s,box-shadow .25s;margin:3px}
    body.light .bx{background:#fff;border-color:#0f1c24}
    body.light .bx{background:#1a2630;border-color:#d8eaf4}
    .bx:hover{transform:translate(-3px,-3px);box-shadow:14px 14px 0 rgba(0,0,0,.28)}

    /* Variant indicator badge */
    .bx-var{position:absolute;top:-10px;left:8px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:99px;background:#06b6d4;color:#fff;z-index:2;letter-spacing:.04em}

    .bx-main-col{grid-area:main;display:flex;flex-direction:column;min-width:0;overflow:hidden}
    .bx-word-zone{background:var(--sz-dark);padding:18px 20px 10px;overflow:hidden;min-width:0}
    .bx-meta-zone{display:flex;flex-direction:column;padding:16px 24px 20px;gap:6px;flex:auto;min-width:0}
    .bx-save-col{grid-area:bar;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--sz-dark);border-left:3px solid var(--sz-dark-border);padding:14px 0;min-width:56px}
    .bx-save-col button{width:32px;height:32px;border-radius:0;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);transition:all .25s cubic-bezier(.34,1.56,.64,1);border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:rgba(255,255,255,.5)}
    .bx-save-col button:hover{background:#059669;border-color:#059669;color:#fff;transform:scale(1.15);box-shadow:0 0 20px rgba(5,150,105,.4)}

    .bx-head{display:flex;align-items:baseline;gap:6px;overflow:hidden;flex-wrap:nowrap;min-width:0}
    .bx-w{font-size:28px;color:var(--sz-darktext);text-transform:uppercase;letter-spacing:.08em;font-weight:900;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex-shrink:1}
    .bx-cefr{font-size:12px;padding:2px 6px;border-radius:0;border:2px solid var(--sz-darktext);color:var(--sz-darktext);background:transparent;white-space:nowrap}
    .bx-pos{font-size:12px;color:var(--sz-darktext2);text-transform:uppercase;white-space:nowrap}
    .bx-ipa{font-size:12px;color:var(--sz-darktext2);margin-bottom:2px}
    .bx-def{font-size:13px;color:#3d5260;line-height:1.5}
    .bx-trans{font-size:14px;color:var(--sz-accent);font-weight:800;padding-top:6px;border-top:3px solid var(--sz-trans-border)}
    .bx-syns{display:flex;gap:4px;flex-wrap:wrap}
    .bx-syns span{font-size:12px;padding:3px 8px;border-radius:0;border:3px solid var(--sz-accent);font-weight:700;background:transparent;color:var(--sz-accent);cursor:pointer}
    .bx-syns span:hover{background:var(--sz-accent);color:#fff}

    /* Dark body light mode overrides */
    body.light .bx-def{color:#3d5260}
    body.light .bx-meta-zone{background:#fff}

    /* Scheme styles for body */
    body[data-scheme="1"] .box-grid{--sz-dark:#000;--sz-dark-border:#000;--sz-darktext:#fff;--sz-darktext2:rgba(255,255,255,.45);--sz-accent:#fff;--sz-trans-border:#333}
    body.light[data-scheme="1"] .box-grid{--sz-dark:#111;--sz-dark-border:#333;--sz-darktext:#fff;--sz-darktext2:rgba(255,255,255,.45);--sz-accent:#fff;--sz-trans-border:#444}
    body[data-scheme="2"] .box-grid{--sz-dark:#0c4a6e;--sz-dark-border:#0c4a6e;--sz-darktext:#fff;--sz-darktext2:rgba(255,255,255,.5);--sz-accent:#22d3ee;--sz-trans-border:#0c4a6e}
    body[data-scheme="3"] .box-grid{--sz-dark:#0f2a1a;--sz-dark-border:#0f2a1a;--sz-darktext:#fff;--sz-darktext2:rgba(255,255,255,.5);--sz-accent:#10b981;--sz-trans-border:#0f2a1a}
    body[data-scheme="4"] .box-grid{--sz-dark:#1a0f2e;--sz-dark-border:#1a0f2e;--sz-darktext:#fff;--sz-darktext2:rgba(255,255,255,.5);--sz-accent:#a78bfa;--sz-trans-border:#1a0f2e}
    body[data-scheme="5"] .box-grid{--sz-dark:#2e2410;--sz-dark-border:#2e2410;--sz-darktext:#fff;--sz-darktext2:rgba(255,255,255,.5);--sz-accent:#d97706;--sz-trans-border:#2e2410}
    body[data-scheme="6"] .box-grid{--sz-dark:#2a0f24;--sz-dark-border:#2a0f24;--sz-darktext:#fff;--sz-darktext2:rgba(255,255,255,.5);--sz-accent:#e879a4;--sz-trans-border:#2a0f24}

    /* API source badge on each box */
    .bx-source-tag{font-size:9px;color:rgba(255,255,255,.25);margin-top:2px}
    body.light .bx-source-tag{color:rgba(0,0,0,.25)}

    .loading-overlay{text-align:center;padding:40px;color:rgba(255,255,255,.2);font-size:13px}
    .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,.15)}
    .empty-state .icon{font-size:48px;margin-bottom:12px}
  </style>
</head>
<body data-scheme="0">
  <header class="topbar">
    <h1>sottotitoli<span>.ai</span> · Box Test</h1>
    <div class="topbar-actions">
      <button id="themeBtn" onclick="window.toggleTheme()">🌙 Dark</button>
      <button onclick="window.cycleScheme()">🎨 Scheme <span id="schemeLabel">0</span></button>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Scrivi una parola…" onkeydown="if(event.key==='Enter')search()">
    <select id="relationSel">
      <option value="synonyms">Sinonimi</option>
      <option value="antonyms">Contrari</option>
      <option value="word-family">Famiglia di parole</option>
      <option value="collocations">Collocazioni</option>
      <option value="next-level">Livello superiore ↗</option>
    </select>
    <button onclick="search()" style="background:#06b6d4;color:#fff;border-color:#06b6d4">Cerca</button>
  </div>

  <div class="api-selectors">
    <label>Definizione:</label>
    <div class="chip-row" id="defApiRow">
      <span class="chip active" data-api="wordnik">Wordnik</span>
      <span class="chip" data-api="freedict">Free Dict</span>
      <span class="chip" data-api="none">Nessuna</span>
    </div>
    <span class="sep"></span>
    <label>Word pills:</label>
    <div class="chip-row" id="synApiRow">
      <span class="chip active" data-api="datamuse">Datamuse</span>
      <span class="chip" data-api="none">Nessuno</span>
    </div>
    <span class="sep"></span>
    <label>Box cols:</label>
    <div class="chip-row" id="colRow">
      <span class="chip" data-cols="2">2</span>
      <span class="chip active" data-cols="3">3</span>
      <span class="chip" data-cols="4">4</span>
    </div>
  </div>

  <div class="results-wrap">
    <h2 id="resultsHead">Risultati</h2>
    <div class="box-grid" id="boxGrid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">
      <div class="empty-state"><div class="icon">🧠</div>Cerca una parola per vedere i box</div>
    </div>
  </div>

  <script>
    // ═══ Box Test — Build From What You Know ═══
    var _schemeIdx = 0;
    var _schemes = ['0','1','2','3','4','5','6'];
    var _defApi = 'wordnik';
    var _synApi = 'datamuse';

    window.toggleTheme = function(){
      var b = document.body;
      b.classList.toggle('light');
      var btn = document.getElementById('themeBtn');
      btn.innerHTML = b.classList.contains('light') ? '☀️ Light' : '🌙 Dark';
    };

    window.cycleScheme = function(){
      _schemeIdx = (_schemeIdx + 1) % _schemes.length;
      document.body.setAttribute('data-scheme', _schemes[_schemeIdx]);
      document.getElementById('schemeLabel').textContent = _schemes[_schemeIdx];
    };

    // API selector clicks
    document.getElementById('defApiRow').addEventListener('click', function(e){
      var c = e.target.closest('.chip'); if(!c) return;
      this.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active')});
      c.classList.add('active');
      _defApi = c.getAttribute('data-api');
      window.doSearch();
    });
    document.getElementById('synApiRow').addEventListener('click', function(e){
      var c = e.target.closest('.chip'); if(!c) return;
      this.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active')});
      c.classList.add('active');
      _synApi = c.getAttribute('data-api');
      window.doSearch();
    });
    document.getElementById('colRow').addEventListener('click', function(e){
      var c = e.target.closest('.chip'); if(!c) return;
      this.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active')});
      c.classList.add('active');
      var cols = c.getAttribute('data-cols');
      document.getElementById('boxGrid').style.gridTemplateColumns = 'repeat(auto-fill,minmax(' + (cols==='2'?'420':'320') + 'px,1fr))';
    });

    // ── Search ──
    window.doSearch = async function(){
      var query = document.getElementById('searchInput').value.trim();
      if (!query || query.length < 2) return;
      var rel = document.getElementById('relationSel').value;
      var grid = document.getElementById('boxGrid');
      var head = document.getElementById('resultsHead');
      head.textContent = 'Cercando…';
      grid.innerHTML = '<div class="loading-overlay"><i class="fa-solid fa-spinner fa-spin"></i> Cercando suggerimenti per "' + query + '"…</div>';

      var enc = encodeURIComponent(query);
      var apiUrl = 'https://api.datamuse.com/words?ml=' + enc + '&max=24&md=p';
      if (rel === 'antonyms') apiUrl = 'https://api.datamuse.com/words?rel_ant=' + enc + '&max=24&md=p';
      else if (rel === 'word-family') apiUrl = 'https://api.datamuse.com/words?sp=' + enc.substring(0,Math.min(4,enc.length)) + '*&md=p&max=30';
      else if (rel === 'collocations') apiUrl = 'https://api.datamuse.com/words?rel_jjb=' + enc + '&max=12&md=p';
      else if (rel === 'next-level') apiUrl = 'https://api.datamuse.com/words?ml=' + enc + '&max=30&md=p';

      try {
        var resp = await fetch(apiUrl);
        if (!resp.ok) throw new Error('API error');
        var data = await resp.json();

        var seen = {};
        var suggestions = [];
        data.forEach(function(item){
          var w = (item.word||'').toLowerCase().replace(/[^a-z\s-]/g,'').replace(/\s+/g,' ').trim();
          if (!w || w === query.toLowerCase() || seen[w]) return;
          seen[w] = true;
          var sl = estimateCEFR(w);
          var pos = extractPos(item.tags);
          suggestions.push({word:w, level:sl, pos:pos, score:item.score||0});
        });

        suggestions.sort(function(a,b){return b.score - a.score});
        suggestions = suggestions.slice(0, 24);

        if (!suggestions.length){
          grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>Nessun suggerimento per "'+query+'"</div>';
          head.textContent = 'Nessun risultato';
          return;
        }

        head.textContent = suggestions.length + ' suggerimenti per "' + query + '" — def: ' + _defApi + ' · pills: ' + _synApi;
        renderBoxes(suggestions, query);
      } catch(e){
        grid.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div>Errore: ' + e.message + '</div>';
        head.textContent = 'Errore';
      }
    };

    async function renderBoxes(suggestions, query){
      var grid = document.getElementById('boxGrid');
      var html = '';
      suggestions.forEach(function(s, i){
        var sourceTag = 'def:'+_defApi+' pills:'+_synApi;
        html += '<article class="bx" data-word="'+s.word+'" data-cefr="'+s.level+'" data-pos="'+s.pos+'">'+
          '<span class="bx-var">#'+(i+1)+'</span>'+
          '<div class="bx-main-col">'+
          '<div class="bx-word-zone">'+
          '<div class="bx-head"><span class="bx-w">'+s.word+'</span><span class="bx-cefr">'+s.level+'</span><span class="bx-pos">'+s.pos+'</span></div>'+
          '<div class="bx-ipa">—</div>'+
          '</div>'+
          '<div class="bx-meta-zone">'+
          '<div class="bx-def">Caricamento…</div>'+
          '<div class="bx-trans" style="opacity:0">—</div>'+
          '<div class="bx-syns"></div>'+
          '<div class="bx-source-tag">'+sourceTag+'</div>'+
          '</div>'+
          '</div>'+
          '<div class="bx-save-col"><button title="Save">+</button><button title="Bookmark"><i class="fa-regular fa-bookmark"></i></button><button title="Dismiss">×</button></div>'+
          '</article>';
      });
      grid.innerHTML = html;

      var boxes = grid.querySelectorAll('.bx');
      for (var i = 0; i < boxes.length; i += 3){
        var batch = Array.from(boxes).slice(i, i+3);
        await Promise.all(batch.map(function(box){ return enrichBox(box, query); }));
      }
      autoSize();
    }

    async function enrichBox(box, query){
      var word = box.getAttribute('data-word');
      if (!word) return;
      var defData = null;
      if (_defApi === 'wordnik') defData = await fetchWordnik(word);
      else if (_defApi === 'freedict') defData = await fetchFreeDict(word);
      var syns = null;
      if (_synApi === 'datamuse') syns = await fetchDatamuseSyns(word);
      var trans = await fetchMyMemory(word);

      var defEl = box.querySelector('.bx-def');
      if (defData && defData.definition) { defEl.textContent = defData.definition; }
      else { defEl.textContent = '—'; defEl.style.opacity = '0.5'; }

      var ipaEl = box.querySelector('.bx-ipa');
      if (defData && defData.ipa) { ipaEl.textContent = defData.ipa; }

      if (trans && trans.length){
        var transEl = box.querySelector('.bx-trans');
        transEl.innerHTML = '→ ' + trans.slice(0,4).map(function(t){return '<span>'+t+'</span>';}).join(' · ');
        transEl.style.opacity = '1';
      }

      if (syns && syns.length){
        var synsEl = box.querySelector('.bx-syns');
        synsEl.innerHTML = syns.slice(0,6).map(function(s){return '<span data-word="'+s+'" title="Click to explore">'+s+'</span>';}).join('');
      }
    }

    // ── API helpers ──
    async function fetchWordnik(word){
      try {
        var url = 'https://api.wordnik.com/v4/word.json/' + encodeURIComponent(word) + '/definitions?limit=1' + '&api_key=c23b4c8b32e0e5b0a13b3020ef30d053a0a0c60b3a6f5e3b0';
        var resp = await fetch(url);
        if (!resp.ok) return null;
        var data = await resp.json();
        if (!data||!data.length) return null;
        return {definition:data[0].text, ipa:null};
      }catch(e){return null;}
    }

    async function fetchFreeDict(word){
      try {
        var resp = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
        if (!resp.ok) return null;
        var data = await resp.json();
        if (!data||!data.length) return null;
        var e = data[0];
        var def = '', ipa = '';
        if (e.meanings&&e.meanings.length&&e.meanings[0].definitions&&e.meanings[0].definitions.length) def = e.meanings[0].definitions[0].definition;
        if (e.phonetics&&e.phonetics.length&&e.phonetics[0].text) ipa = e.phonetics[0].text;
        return {definition:def, ipa:ipa};
      }catch(e){return null;}
    }

    async function fetchDatamuseSyns(word){
      try {
        var resp = await fetch('https://api.datamuse.com/words?ml=' + encodeURIComponent(word) + '&max=8');
        if (!resp.ok) return null;
        var data = await resp.json();
        return (data||[]).map(function(d){return d.word;}).filter(function(w){return w&&w!==word;});
      }catch(e){return null;}
    }

    async function fetchMyMemory(word){
      try {
        var resp = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=en|it');
        if (!resp.ok) return null;
        var data = await resp.json();
        if (data.responseData&&data.responseData.translatedText){
          return data.responseData.translatedText.split(/[,;]/).map(function(t){return t.trim();}).filter(function(t){return t&&t.toLowerCase()!==word.toLowerCase();});
        }
        return null;
      }catch(e){return null;}
    }

    function extractPos(tags){
      if (!tags||!tags.length) return '—';
      var posTags = ['n','v','adj','adv'];
      for (var i=0;i<tags.length;i++){ var t=(tags[i]||'').toLowerCase(); if(posTags.indexOf(t)>=0) return t.toUpperCase(); }
      return '—';
    }

    function estimateCEFR(w){
      if (!w) return 'A2';
      var l = w.length;
      if (l<=4) return 'A1'; if (l<=6) return 'A2'; if (l<=8) return 'B1'; if (l<=10) return 'B2';
      return 'C1';
    }

    function autoSize(){
      document.querySelectorAll('.bx-w').forEach(function(el){
        el.style.fontSize = '';
        var a=el.clientWidth, n=el.scrollWidth;
        if(n>a&&a>0){var r=a/n; var c=parseFloat(getComputedStyle(el).fontSize); el.style.fontSize=Math.max(12,(c*r)*0.95)+'px';}
      });
    }
    window.addEventListener('resize',function(){clearTimeout(window._rst);window._rst=setTimeout(autoSize,150);});

    // ── Word pill click → search ──
    document.getElementById('boxGrid').addEventListener('click', function(e){
      var chip = e.target.closest('.bx-syns span[data-word]');
      if (!chip) return;
      document.getElementById('searchInput').value = chip.getAttribute('data-word');
      window.doSearch();
    });
  </script>
</body>
</html>
