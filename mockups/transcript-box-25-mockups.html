<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Transcript Box · 25 Animated Mockups</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ═══ SHARED ═══ */
:root{--bg:#0b0f15;--card:#131820;--line:#1e2632;--line2:#283242;--text:#e2e4e9;--t2:#9099a8;--t3:#5e6676;--accent:#7c3aed;--a2:#a78bfa;--green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;--red:#ef4444;--teal:#14b8a6;--pink:#ec4899;--r:12px;--f:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.subtitle{font-size:12px;color:var(--t3);margin:4px 0 20px}
.page{padding:24px 24px 60px;max-width:1800px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:16px}

/* Card */
.m{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.mh{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.mn{font-size:10px;font-weight:700;color:var(--a2);letter-spacing:.08em;min-width:42px}
.mt{font-size:11px;font-weight:600;color:var(--text);flex:1;margin-left:6px}
.mb{font-size:8px;padding:2px 7px;border-radius:99px;font-weight:600;margin-left:3px}
.be{background:rgba(59,130,246,.15);color:var(--blue)}
.ba{background:rgba(34,197,94,.15);color:var(--green)}
.bs{background:rgba(236,72,153,.15);color:var(--pink)}
.bt{background:rgba(20,184,166,.15);color:var(--teal)}
.mc{flex:1;overflow-y:auto;position:relative;min-height:200px;max-height:300px}

/* Play/pause indicator */
.play-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:playPulse 1s infinite}
@keyframes playPulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Shared word editor */
.wp{display:none;position:absolute;z-index:50;background:var(--card);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:140px}
.wp.on{display:block}
.wp input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--text);font:inherit;font-size:12px;padding:6px 8px;outline:none}
.wp input:focus{border-color:var(--accent)}
.wp .wa{display:flex;gap:4px;margin-top:6px}
.wp .wa button{font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;border:none;cursor:pointer}
.wps{background:var(--accent);color:#fff}
.wpc{background:var(--line);color:var(--t2)}
.word{display:inline-block;padding:0 1px;border-radius:2px;transition:all .12s;cursor:pointer;position:relative}
.word:hover{background:rgba(59,130,246,.2);outline:1px dashed rgba(59,130,246,.4)}
.word.alt{color:var(--amber);text-decoration:underline wavy rgba(245,158,11,.3);text-underline-offset:3px}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12);background:rgba(124,58,237,.25)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease-out}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
@media(max-width:440px){.grid{grid-template-columns:1fr}.page{padding:12px}}

/* ═══ VARIATION CSS ═══ */

/* V1 Chat Bubbles */
.v1{padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.v1b{max-width:88%;padding:8px 13px;border-radius:14px;font-size:12px;line-height:1.45;position:relative;opacity:0;transform:translateY(10px) scale(.96);animation:v1in .35s ease-out forwards}
.v1b.l{align-self:flex-start;background:var(--line);border-bottom-left-radius:3px}
.v1b.r{align-self:flex-end;background:rgba(124,58,237,.2);border-bottom-right-radius:3px}
@keyframes v1in{to{opacity:1;transform:translateY(0) scale(1)}} .v1b{animation-duration:.6s}

/* V2 Timeline */
.v2{padding:8px 16px;position:relative}
.v2::before{content:'';position:absolute;left:20px;top:0;bottom:0;width:1px;background:var(--line2)}
.v2i{position:relative;padding:6px 0 6px 26px;opacity:0;transform:translateX(-8px);animation:v2in .35s ease-out forwards}
.v2d{position:absolute;left:16px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);z-index:1}
.v2t{font-size:12px;line-height:1.4}
@keyframes v2in{to{opacity:1;transform:translateX(0)}} .v2i{animation-duration:.55s}

/* V3 Minimal List */
.v3{padding:0}
.v3r{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;opacity:0;animation:v3in .25s ease-out forwards}
.v3r:nth-child(even){background:rgba(255,255,255,.01)}
.v3i{font-size:9px;color:var(--t3);font-family:var(--mono);min-width:16px;text-align:right;flex-shrink:0}
.v3x{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v3c{width:12px;height:12px;border:1.5px solid var(--line2);border-radius:3px;flex-shrink:0}
.v3r.sel .v3c{background:var(--accent);border-color:var(--accent)}
@keyframes v3in{to{opacity:1}} .v3r{animation-duration:.4s}

/* V4 Card Stack */
.v4{padding:10px;display:flex;flex-direction:column;gap:7px}
.v4c{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.45;opacity:0;transform:translateX(-16px);animation:v4in .4s ease-out forwards}
@keyframes v4in{to{opacity:1;transform:translateX(0)}} .v4c{animation-duration:.55s}

/* V5 Teleprompter */
.v5{padding:14px 18px;font-size:14px;line-height:1.7;overflow-y:auto}
.v5l{padding:3px 0;transition:all .4s;opacity:0;animation:v5in .5s ease-out forwards}
.v5l.cur{color:#fff;font-weight:600;font-size:15px;background:rgba(124,58,237,.12);padding:5px 8px;border-radius:6px}
.v5l.past{color:var(--t3)}
@keyframes v5in{to{opacity:1}} .v5l{animation-duration:.7s}

/* V6 Accordion */
.v6{padding:0}
.v6r{border-bottom:1px solid var(--line)}
.v6s{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;font-size:12px;opacity:0;animation:v6in .3s ease-out forwards}
.v6c{font-size:9px;color:var(--t3);transition:transform .25s;flex-shrink:0}
.v6r.open .v6c{transform:rotate(90deg)}
.v6p{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v6d{display:none;padding:0 12px 10px 34px;font-size:11px;color:var(--t2);line-height:1.7}
.v6r.open .v6d{display:block}
@keyframes v6in{to{opacity:1}} .v6s{animation-duration:.45s}

/* V7 Grid */
.v7{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-content:start}
.v7c{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11px;line-height:1.4;opacity:0;animation:v7in .3s ease-out forwards}
@keyframes v7in{to{opacity:1}} .v7c{animation-duration:.45s}

/* V8 Terminal */
.v8{background:#080a0d;font-family:var(--mono);font-size:10px;line-height:1.7;color:#22c55e;padding:12px 14px;overflow-y:auto}
.v8l{padding:1px 0;opacity:0;animation:v8in .3s ease-out forwards}
.v8p{color:var(--t3);margin-right:5px}
@keyframes v8in{to{opacity:1}} .v8l{animation-duration:.45s}

/* V9 Speaker Columns */
.v9{display:flex;gap:0;min-height:100%}
.v9c{flex:1;padding:6px;overflow-y:auto;border-right:1px solid var(--line)}
.v9c:last-child{border-right:none}
.v9h{font-size:8px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:3px 6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.v9i{font-size:11px;padding:5px 6px;margin:2px 0;border-radius:4px;background:var(--bg);border:1px solid transparent;line-height:1.4;opacity:0;animation:v9in .3s ease-out forwards}
@keyframes v9in{to{opacity:1}} .v9i{animation-duration:.45s}

/* V10 Inline Edit */
.v10{padding:0}
.v10r{display:flex;align-items:flex-start;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.5;opacity:0;animation:v10in .3s ease-out forwards}
.v10r.ed .v10x{display:none}
.v10r.ed .v10n{display:block}
.v10n{display:none;flex:1;background:var(--bg);border:1px solid var(--accent);border-radius:5px;color:var(--text);font:inherit;font-size:12px;padding:5px 7px;outline:none;min-height:28px}
@keyframes v10in{to{opacity:1}} .v10r{animation-duration:.45s}

/* V11 Marquee Pills */
.v11{padding:6px;display:flex;flex-wrap:wrap;gap:5px;align-content:start}
.v11p{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:10px;cursor:pointer;white-space:nowrap;max-width:fit-content;opacity:0;transform:translateX(-20px);animation:v11in .35s ease-out forwards}
@keyframes v11in{to{opacity:1;transform:translateX(0)}} .v11p{animation-duration:.5s}

/* V12 Sticky Notes */
.v12{background:linear-gradient(135deg,#1a1510 0%,#151210 100%);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:start}
.v12n{padding:14px 16px;border-radius:2px;font-family:'Caveat',cursive;font-size:15px;line-height:1.5;color:#2d1b0a;box-shadow:2px 2px 6px rgba(0,0,0,.12);width:calc(50% - 4px);opacity:0;transform:rotate(-1deg) scale(.9);animation:v12in .4s ease-out forwards}
.v12n:nth-child(odd){background:#fef3c7;transform:rotate(-.5deg) scale(.9)}
.v12n:nth-child(even){background:#dbeafe;transform:rotate(.5deg) scale(.9)}
.v12n:nth-child(3n){background:#fce7f3;transform:rotate(-.3deg) scale(.9)}
@keyframes v12in{to{opacity:1;transform:rotate(0deg) scale(1)}} .v12n{animation-duration:.6s}

/* V13 Book Pages */
.v13{padding:16px 20px;column-count:2;column-gap:20px;column-rule:1px solid var(--line);overflow-y:auto}
.v13p{font-size:12px;line-height:1.7;margin-bottom:10px;break-inside:avoid;opacity:0;animation:v13in .4s ease-out forwards}
@keyframes v13in{to{opacity:1}} .v13p{animation-duration:.55s}

/* V14 Toast Stack */
.v14{padding:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.v14t{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11px;line-height:1.4;max-width:90%;box-shadow:0 3px 12px rgba(0,0,0,.15);opacity:0;transform:translateX(30px);animation:v14in .4s ease-out forwards}
@keyframes v14in{to{opacity:1;transform:translateX(0)}} .v14t{animation-duration:.55s}

/* V15 Expandable Chips */
.v15{padding:8px;display:flex;flex-wrap:wrap;gap:5px;align-content:start}
.v15c{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:11px;cursor:pointer;max-width:180px;overflow:hidden;white-space:nowrap;opacity:0;transform:scale(.85);animation:v15in .35s ease-out forwards}
.v15c.open{max-width:100%;white-space:normal;background:var(--line)}
.v15c .v15f{display:none}
.v15c.open .v15f{display:inline}
.v15c.open .v15w{display:none}
@keyframes v15in{to{opacity:1;transform:scale(1)}} .v15c{animation-duration:.5s}

/* ═══ NEW V16-V25 ═══ */

/* V16 Typewriter */
.v16{padding:14px 16px;font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--text);overflow-y:auto}
.v16l{padding:2px 0;opacity:0;animation:v16in .1s ease-out forwards}
.v16l .ch{opacity:0;animation:v16ch .02s ease-out forwards}
@keyframes v16in{to{opacity:1}}
@keyframes v16ch{to{opacity:1}}

/* V17 Fade Cascade */
.v17{padding:12px 14px;font-size:13px;line-height:1.7;overflow-y:auto}
.v17l{padding:3px 0;opacity:0;animation:v17in .6s ease-out forwards}
.v17l .w17{display:inline-block;opacity:0;animation:v17w .15s ease-out forwards}
@keyframes v17in{to{opacity:1}}
@keyframes v17w{to{opacity:1}}

/* V18 Slide Deck */
.v18{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;padding:0}
.v18s{flex:0 0 85%;scroll-snap-align:center;padding:20px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1.5;text-align:center;background:var(--bg);border-right:1px solid var(--line);opacity:0;animation:v18in .7s ease-out forwards}
@keyframes v18in{to{opacity:1}}

/* V19 Waterfall */
.v19{padding:8px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.v19l{padding:7px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;font-size:12px;line-height:1.4;opacity:0;transform:translateY(-30px);animation:v19in .8s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes v19in{to{opacity:1;transform:translateY(0)}}

/* V20 Highlight Reel */
.v20{padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.v20l{padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.4;opacity:0;animation:v20in 1.2s ease-out forwards;background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2)}
.v20l:nth-child(1){animation-delay:0s}
@keyframes v20in{0%{opacity:0;background:rgba(124,58,237,.3);border-color:rgba(124,58,237,.5);transform:scale(1.02)}60%{opacity:1;background:rgba(124,58,237,.15);border-color:rgba(124,58,237,.3);transform:scale(1)}100%{opacity:1;background:rgba(124,58,237,.08);border-color:rgba(124,58,237,.2);transform:scale(1)}}

/* V21 Breadcrumb Trail */
.v21{padding:8px;display:flex;flex-wrap:wrap;gap:0;align-items:center;overflow-x:auto}
.v21b{padding:6px 12px;font-size:10px;color:var(--t2);white-space:nowrap;position:relative;opacity:0;animation:v21in .5s ease-out forwards}
.v21b::after{content:'/';color:var(--t3);margin-left:8px}
.v21b:last-child::after{content:''}
.v21b:last-child{color:var(--text);font-weight:600}
@keyframes v21in{to{opacity:1}}

/* V22 Stacked Blocks */
.v22{padding:6px 10px;display:flex;flex-direction:column-reverse;gap:3px;overflow-y:auto}
.v22b{padding:8px 12px;background:var(--accent);color:#fff;border-radius:6px 6px 0 0;font-size:11px;font-weight:600;line-height:1.4;opacity:0;transform:translateY(20px);animation:v22in .6s ease-out forwards}
.v22b:nth-child(odd){background:var(--a2);color:#1a1030}
@keyframes v22in{to{opacity:1;transform:translateY(0)}}

/* V23 Notebook Pages */
.v23{background:repeating-linear-gradient(transparent,transparent 27px,var(--line) 27px,var(--line) 28px);padding:16px 20px 16px 32px;font-family:'Playfair Display',serif;font-size:13px;line-height:28px;color:var(--text);overflow-y:auto;border-left:2px solid rgba(239,68,68,.3)}
.v23l{padding:0;opacity:0;animation:v23in .7s ease-out forwards;margin-bottom:0}
@keyframes v23in{to{opacity:1}}

/* V24 Sonar Pulse */
.v24{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.v24l{display:flex;align-items:center;gap:10px;font-size:12px;line-height:1.4;opacity:0;animation:v24in .6s ease-out forwards}
.v24r{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;animation:v24p 1.2s ease-out}
.v24r::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--accent);animation:v24ripple 1s ease-out}
@keyframes v24in{to{opacity:1}}
@keyframes v24ripple{0%{inset:-2px;opacity:.6}100%{inset:-14px;opacity:0}}

/* V25 Film Strip */
.v25{display:flex;overflow-x:auto;gap:4px;padding:8px 4px}
.v25f{flex:0 0 auto;width:160px;padding:14px 12px;background:#111;border:2px solid #333;border-radius:4px;font-size:10px;line-height:1.4;color:var(--text);position:relative;opacity:0;animation:v25in .6s ease-out forwards}
.v25f::before,.v25f::after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#333}
.v25f::before{top:-10px}.v25f::after{bottom:-10px}
@keyframes v25in{to{opacity:1}}
</style>
</head>
<body>

<div class="page">
  <h1>📝 Transcript Box · 25 Animated Mockups</h1>
  <p class="subtitle">Each variation shows a <strong>live animated demo</strong> — sentences appear in real time as they would during speech.</p>

  <div class="grid" id="grid"></div>
</div>

<script>
// ═══ DEMO ENGINE ═══
// Each variation: { id, title, html template, demo sentences[], render fn, clear fn }
// The engine cycles: clear → add sentences one by one with delay → pause → repeat

var demoData = [];

function define(id, title, badges, bodyHtml, sentences, renderFn) {
  demoData.push({ id:id, title:title, badges:badges, bodyHtml:bodyHtml, sentences:sentences, render:renderFn, delay:0 });
}

// ═══ Helper: create word spans ═══
function w(text, alt) {
  return '<span class="word'+(alt?' alt':'')+'"'+(alt?' title="Maybe: '+alt+'"':'')+'>'+text+'</span>';
}

// ═══ DEMO SENTENCE POOL (Dutch/English mix for realism) ═══
var S = [
  'The <span class="word">weather</span> <span class="word">today</span> <span class="word">is</span> <span class="word">quite</span> <span class="word alt" title="Maybe: lovely">lovly</span>.',
  'Ik <span class="word">wil</span> <span class="word">graag</span> <span class="word">een</span> <span class="word">kopje</span> <span class="word">koffie</span> <span class="word">alsjeblieft</span>.',
  'The <span class="word">project</span> <span class="word">deadline</span> <span class="word">has</span> <span class="word">been</span> <span class="word">extended</span> <span class="word">to</span> <span class="word">Friday</span>.',
  'We <span class="word">moeten</span> <span class="word">nog</span> <span class="word">even</span> <span class="word">geduld</span> <span class="word alt" title="Maybe: hebben">hebben</span> <span class="word">met</span> <span class="word">de</span> <span class="word">resultaten</span>.',
  'She <span class="word">said</span> <span class="word">she</span> <span class="word">would</span> <span class="word">call</span> <span class="word">back</span> <span class="word">within</span> <span class="word">the</span> <span class="word">hour</span>.',
  'Het <span class="word">is</span> <span class="word">vandaag</span> <span class="word">echt</span> <span class="word">prachtig</span> <span class="word">weer</span> <span class="word">buiten</span>.',
  'Can <span class="word">you</span> <span class="word">send</span> <span class="word">me</span> <span class="word">the</span> <span class="word alt" title="Maybe: document">documment</span> <span class="word">by</span> <span class="word">email</span>?',
  'Ik <span class="word">denk</span> <span class="word">dat</span> <span class="word">we</span> <span class="word">morgen</span> <span class="word">een</span> <span class="word">beslissing</span> <span class="word">kunnen</span> <span class="word">nemen</span>.',
  'The <span class="word">meeting</span> <span class="word">room</span> <span class="word">is</span> <span class="word">on</span> <span class="word">the</span> <span class="word">third</span> <span class="word">floor</span>.',
  'Dat <span class="word">klinkt</span> <span class="word">als</span> <span class="word">een</span> <span class="word">uitstekend</span> <span class="word">plan</span> <span class="word">voor</span> <span class="word">vanavond</span>.',
  'I <span class="word">really</span> <span class="word">appreciate</span> <span class="word">your</span> <span class="word">help</span> <span class="word">with</span> <span class="word">this</span>.',
  'Zij <span class="word">heeft</span> <span class="word">gisteren</span> <span class="word">nog</span> <span class="word">gebeld</span> <span class="word">over</span> <span class="word">de</span> <span class="word">afspraak</span>.'
];

// ═══ Build all 25 definitions ═══

// V1 Chat Bubbles
define('V1','Chat Bubbles','ba be bs',
  '<div class="v1" id="v1b"></div>',
  [0,1,2,3],
  function(body,s,i){
    var d=document.createElement('div');
    d.className='v1b '+(i%2?'r':'l');
    d.innerHTML=s;
    body.appendChild(d);
  }
);

// V2 Timeline
define('V2','Vertical Timeline','ba bs',
  '<div class="v2" id="v2b"></div>',
  [0,3,5,7],
  function(body,s,i){

// ═══ BUILD THE GRID ═══
var grid=document.getElementById('grid');
var cardMap={}; // map variation id → card element

demoData.forEach(function(v){
  var card=document.createElement('div');
  card.className='m';
  card.dataset.varId=v.id;
  var badgesHtml=v.badges.split(' ').map(function(b){
    var cls=b==='ba'?'ba':b==='be'?'be':b==='bs'?'bs':'bt';
    var label=b==='ba'?'anim':b==='be'?'edit':b==='bs'?'select':'space';
    return '<span class="mb '+cls+'">'+label+'</span>';
  }).join('');
  card.innerHTML='<div class="mh"><span class="mn">'+v.id+'</span><span class="mt">'+v.title+'</span>'+badgesHtml+'<button class="play-btn" data-var="'+v.id+'" onclick="toggleDemo(\''+v.id+'\')" title="Play demo">▶</button></div><div class="mc">'+v.bodyHtml+'</div>';
  grid.appendChild(card);
  cardMap[v.id]=card;
});

// ── Play button style ──
var playStyle=document.createElement('style');
playStyle.textContent='.play-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;color:var(--t2);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;margin-left:4px}.play-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(124,58,237,.1)}.play-btn.playing{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.1)}.play-btn.playing:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.1)}';
document.head.appendChild(playStyle);

// ═══ PER-VARIATION DEMO PLAYER ═══
// Each variation runs independently when its play button is clicked.
// Real speech pace: ~2.5s between sentences, ~5s pause after all shown.
var playerStates={};

function getPlayerState(id){
  if(!playerStates[id]){
    var card=cardMap[id];
    var body=card.querySelector('.mc > *');
    var def=demoData.find(function(d){return d.id===id});
    playerStates[id]={body:body,def:def,playing:false,idx:0,timer:null,phase:'idle'};
  }
  return playerStates[id];
}

function stopDemo(id){
  var ps=getPlayerState(id);
  if(ps.timer){clearTimeout(ps.timer);ps.timer=null;}
  ps.playing=false;
  ps.phase='idle';
  // Reset body HTML
  ps.body.innerHTML=ps.def.bodyHtml.replace(/ id="[^"]*"/,'');
  // Update button
  var btn=cardMap[id].querySelector('.play-btn');
  if(btn){btn.textContent='▶';btn.classList.remove('playing');btn.title='Play demo';}
}

function toggleDemo(id){
  var ps=getPlayerState(id);
  if(ps.playing){
    // Stop
    stopDemo(id);
    return;
  }
  // Start playing
  ps.playing=true;
  ps.idx=0;
  ps.phase='adding';
  var btn=cardMap[id].querySelector('.play-btn');
  if(btn){btn.textContent='⏹';btn.classList.add('playing');btn.title='Stop demo';}
  // Clear & start
  ps.body.innerHTML=ps.def.bodyHtml.replace(/ id="[^"]*"/,'');
  advanceDemo(id);
}

function advanceDemo(id){
  var ps=getPlayerState(id);
  if(!ps.playing)return;
  var def=ps.def;
  
  if(ps.phase==='adding'){
    if(ps.idx < def.sentences.length){
      var si=def.sentences[ps.idx];
      var s=S[si];
      def.render(ps.body,s,ps.idx,def.sentences.length);
      ps.idx++;
      // 🐌 Real speech pace: 2–3 seconds between sentences
      var gap=2200+Math.random()*1200;
      ps.timer=setTimeout(function(){advanceDemo(id)},gap);
      return;
    } else {
      // All shown — pause then stop
      ps.phase='done';
      ps.timer=setTimeout(function(){advanceDemo(id)},5000);
      return;
    }
  }
  
  if(ps.phase==='done'){
    // Stay showing for a while, then auto-stop
    stopDemo(id);
  }
}

// ═══ Stop any demo if user scrolls/interacts with the card body ═══
// (Keep it simple — clicking play is the only control)

// ═══ WORD CLICK EDITOR ═══
document.addEventListener('click',function(e){
  var word=e.target.closest('.word');
  if(!word)return;
  document.querySelectorAll('.wp').forEach(function(p){p.remove()});
  var popup=document.createElement('div');
  popup.className='wp on';
  popup.innerHTML='<input value="'+word.textContent.replace(/"/g,'&quot;')+'"><div class="wa"><button class="wps" onclick="saveWord(this)">Save</button><button class="wpc" onclick="this.closest(\'.wp\').remove()">Cancel</button></div>';
  word.appendChild(popup);
  word.classList.add('pop');
  setTimeout(function(){word.classList.remove('pop')},250);
  setTimeout(function(){var i=popup.querySelector('input');if(i){i.focus();i.select()}},10);
});
document.addEventListener('click',function(e){
  if(!e.target.closest('.wp')&&!e.target.closest('.word')){
    document.querySelectorAll('.wp').forEach(function(p){p.remove()});
  }
});
function saveWord(btn){
  var popup=btn.closest('.wp');
  var word=popup.parentElement;
  var input=popup.querySelector('input');
  if(input&&input.value.trim()){word.textContent=input.value.trim();word.classList.add('pop');setTimeout(function(){word.classList.remove('pop')},250)}
  popup.remove();
}
</script>
