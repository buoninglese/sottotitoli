<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Transcript Box · 17 Animated Mockups</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ═══ SHARED ═══ */
:root{--bg:#0b0f15;--card:#131820;--line:#1e2632;--line2:#283242;--text:#e2e4e9;--t2:#9099a8;--t3:#5e6676;--accent:#7c3aed;--a2:#a78bfa;--green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;--red:#ef4444;--teal:#14b8a6;--pink:#ec4899;--r:14px;--f:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
.subtitle{font-size:13px;color:var(--t3);margin:4px 0 22px}
.page{padding:28px 28px 64px;max-width:1920px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:18px}

/* Card */
.m{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.mn{font-size:11px;font-weight:700;color:var(--a2);letter-spacing:.08em;min-width:44px}
.mt{font-size:12px;font-weight:600;color:var(--text);flex:1;margin-left:8px}
.mb{font-size:9px;padding:2px 8px;border-radius:99px;font-weight:600;margin-left:3px}
.be{background:rgba(59,130,246,.15);color:var(--blue)}
.ba{background:rgba(34,197,94,.15);color:var(--green)}
.bs{background:rgba(236,72,153,.15);color:var(--pink)}
.bt{background:rgba(20,184,166,.15);color:var(--teal)}
.mc{flex:1;overflow-y:auto;position:relative;min-height:300px;max-height:440px}

/* Play/pause indicator */
.play-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:playPulse 1s infinite}
@keyframes playPulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Word spans — visual only (no click-to-edit) */
.word{display:inline-block;padding:0 1px;border-radius:2px}
.word.alt{color:var(--amber);text-decoration:underline wavy rgba(245,158,11,.35);text-underline-offset:4px}
.sel{outline:2px solid var(--accent);outline-offset:-2px;border-radius:5px;background:rgba(124,58,237,.1)!important;transition:all .15s}

/* Smooth scrolling + GPU hints */
.mc *{will-change:transform,opacity}
.mc{scroll-behavior:smooth;-webkit-overflow-scrolling:touch}

::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.page{padding:14px}.mc{min-height:240px;max-height:360px}}

/* ═══ VARIATION CSS ═══ */

/* V1 Chat Bubbles — polished, legible */
.v1{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.v1b{max-width:82%;padding:12px 18px;border-radius:18px;font-size:15px;line-height:1.5;position:relative;opacity:0;transform:translateY(12px) scale(.97);animation:v1in .6s ease-out forwards;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.v1b.l{align-self:flex-start;background:var(--line);border-bottom-left-radius:6px;color:var(--text)}
.v1b.r{align-self:flex-end;background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(59,130,246,.2));border-bottom-right-radius:6px;color:#fff}
.v1{padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.v1b{max-width:88%;padding:10px 16px;border-radius:16px;font-size:15px;line-height:1.5;position:relative;opacity:0;transform:translateY(12px) scale(.97);animation:v1in .6s ease-out forwards}
.v1b.l{align-self:flex-start;background:var(--line);border-bottom-left-radius:4px}
.v1b.r{align-self:flex-end;background:rgba(124,58,237,.2);border-bottom-right-radius:4px}
@keyframes v1in{to{opacity:1;transform:translateY(0) scale(1)}} .v1b{animation-duration:.7s}

/* V2 Timeline — smooth professional animation */
.v2{padding:10px 0;position:relative}
.v2::before{content:'';position:absolute;left:60px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#7c3aed,#3b82f6,#06b6d4,transparent);transition:all 1.2s ease}
.v2i{position:relative;padding:10px 0 10px 80px;opacity:0;transform:translateX(-12px);animation:v2in .8s cubic-bezier(.22,1,.36,1) forwards}
.v2d{position:absolute;left:54px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--card);z-index:1;box-shadow:0 0 16px rgba(124,58,237,.5);transition:all .6s ease}
.v2i:hover .v2d{box-shadow:0 0 24px rgba(124,58,237,.8);transform:scale(1.2)}
.v2t{font-size:15px;line-height:1.5;margin-top:2px;transition:color .4s}
.v2i:hover .v2t{color:#fff}
.v2time{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent);letter-spacing:-.04em;line-height:1;margin-bottom:2px;transition:all .4s}
.v2time .v2ms{font-size:13px;color:var(--t3);font-weight:400;margin-left:2px}
.v2gap{font-size:9px;color:var(--t3);font-family:var(--mono);margin-left:6px}
@keyframes v2in{0%{opacity:0;transform:translateX(-16px);filter:blur(4px)}100%{opacity:1;transform:translateX(0);filter:blur(0)}} .v2i{animation:v2in .9s cubic-bezier(.16,1,.3,1) forwards}

/* V3 Word Bank — click words to collect */
.v3{padding:0}
.v3r{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:15px;opacity:0;animation:v3in .4s ease-out forwards}
.v3r:nth-child(even){background:rgba(255,255,255,.01)}
.v3i{font-size:11px;color:var(--t3);font-family:var(--mono);min-width:20px;text-align:right;flex-shrink:0}
.v3x{flex:1;line-height:1.5}
.v3x .v3w{display:inline-block;padding:2px 5px;border-radius:4px;cursor:pointer;transition:all .12s;border:1.5px solid transparent}
.v3x .v3w:hover{border-color:rgba(124,58,237,.5);background:rgba(124,58,237,.1)}
.v3x .v3w.collected{background:rgba(34,197,94,.2);border-color:var(--green);color:var(--green);font-weight:700;box-shadow:0 0 6px rgba(34,197,94,.2)}
.v3bank{display:flex;align-items:center;gap:6px;padding:8px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--t2);font-weight:600;position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.v3bank .v3bc{background:var(--green);color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;min-width:20px;text-align:center}
.v3bank .v3bw{display:inline-block;background:rgba(124,58,237,.15);color:var(--a2);font-size:10px;padding:2px 8px;border-radius:99px;margin:1px 2px}
.v3toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#000;font-size:13px;font-weight:700;padding:10px 20px;border-radius:99px;z-index:999;opacity:0;animation:v3toast 1.5s ease-out forwards;pointer-events:none}
@keyframes v3in{to{opacity:1}} .v3r{animation-duration:.5s}
@keyframes v3toast{0%{opacity:0;transform:translateX(-50%) translateY(10px)}20%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}

/* V4 Card Stack */
.v4{padding:12px;display:flex;flex-direction:column;gap:8px}
.v4c{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:22px;line-height:1.5;opacity:0;transform:translateX(-18px);animation:v4in .55s ease-out forwards}
@keyframes v4in{to{opacity:1;transform:translateX(0)}} .v4c{animation-duration:.65s}

/* V5 Teleprompter — CNN American news style */
.v5{background:#0a0d14;padding:0;overflow-y:auto;font-family:'Arial',sans-serif}
.v5l{padding:10px 24px;transition:all .7s ease;opacity:0;animation:v5in .8s ease-out forwards;font-size:18px;line-height:1.6;color:rgba(255,255,255,.5);font-weight:400;letter-spacing:.01em}
.v5l.cur{color:#fff;font-weight:700;font-size:22px;background:rgba(255,255,255,.04);border-left:3px solid #cc0000}
.v5l.past{color:rgba(255,255,255,.3);font-size:16px}
@keyframes v5in{to{opacity:1}}

/* V6 Accordion — always open + translation */
.v6{padding:0}
.v6r{border-bottom:1px solid var(--line)}
.v6s{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-size:15px;opacity:0;animation:v6in .45s ease-out forwards}
.v6c{font-size:11px;color:var(--t3);transition:transform .25s;flex-shrink:0}
.v6r.open .v6c{transform:rotate(90deg)}
.v6p{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v6d{display:none;padding:0 16px 12px 38px;font-size:14px;color:var(--t2);line-height:1.75}
.v6r.open .v6d{display:block}
@keyframes v6in{to{opacity:1}} .v6s{animation-duration:.55s}

/* V9 — Two-speaker split, fills box */
.v9{display:flex;height:100%;min-height:0}
.v9c{flex:0 0 50%;width:50%;display:flex;flex-direction:column;overflow-y:auto;min-width:0}
.v9c:first-child{border-right:1px solid var(--line)}
.v9ch{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1;flex-shrink:0}
.v9av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.v9av.a{background:var(--accent)}.v9av.b{background:var(--teal)}
.v9nm{font-size:12px;font-weight:700;color:var(--text)}
.v9rl{font-size:8px;color:var(--t3);text-transform:uppercase}
.v9i{font-size:14px;padding:8px 12px;line-height:1.45;opacity:0;animation:v9in .5s ease-out forwards;border-bottom:1px solid rgba(255,255,255,.03)}
.v9i .v9ts{font-size:9px;color:var(--t3);font-family:var(--mono);display:block;margin-bottom:2px}
@keyframes v9in{to{opacity:1}} .v9i{animation-duration:.6s}

/* V10 — Single-click word edit, underline after edit */
.v10{padding:0}
.v10r{display:flex;align-items:center;flex-wrap:wrap;gap:2px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:16px;line-height:1.6;opacity:0;animation:v10in .45s ease-out forwards}
.v10r .v10w{display:inline-block;padding:1px 3px;border-radius:3px;cursor:pointer;transition:all .1s;border:1px solid transparent}
.v10r .v10w:hover{border-color:rgba(124,58,237,.4);background:rgba(124,58,237,.08)}
.v10r .v10w.editing{border-color:var(--accent);background:rgba(124,58,237,.15);outline:none}
.v10r .v10w.edited{text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:3px;text-decoration-thickness:2px}
.v10r .v10in{display:none;position:absolute;z-index:5;background:var(--card);border:1.5px solid var(--accent);border-radius:6px;color:var(--text);font:inherit;font-size:15px;padding:5px 8px;outline:none;width:auto;min-width:60px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.v10r .v10in.on{display:block;background:var(--card);box-shadow:0 4px 20px rgba(0,0,0,.6)}
@keyframes v10in{to{opacity:1}} .v10r{animation-duration:.55s}

/* V12 Sticky Notes — with copy + save PNG */
.v12{background:transparent;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-content:start}
.v12n{padding:18px 20px 28px;border-radius:3px;font-family:'Caveat',cursive;font-size:24px;line-height:1.55;color:#2d1b0a;box-shadow:2px 2px 8px rgba(0,0,0,.15);width:calc(50% - 5px);opacity:0;transform:rotate(-1deg) scale(.92);animation:v12in .6s ease-out forwards;position:relative}
.v12n .v12act{position:absolute;bottom:4px;right:6px;display:flex;gap:3px;opacity:0;transition:opacity .12s}
.v12n:hover .v12act{opacity:1}
.v12act button{font-size:9px;background:none;border:none;cursor:pointer;color:rgba(0,0,0,.3);padding:1px 4px;border-radius:3px;font-family:var(--f)}
.v12act button:hover{background:rgba(0,0,0,.1);color:rgba(0,0,0,.6)}
.v12n:nth-child(odd){background:#fef3c7;transform:rotate(-.5deg) scale(.92)}
.v12n:nth-child(even){background:#dbeafe;transform:rotate(.5deg) scale(.92)}
.v12n:nth-child(3n){background:#fce7f3;transform:rotate(-.3deg) scale(.92)}
@keyframes v12in{to{opacity:1;transform:rotate(0deg) scale(1)}} .v12n{animation-duration:.7s}

/* ═══ NEW V16-V25 ═══ */


/* V17 Fade Cascade — real speech word timing (~150wpm) */
.v17{padding:14px 18px;font-size:16px;line-height:1.75;overflow-y:auto}
.v17l{padding:4px 0;opacity:0;animation:v17in .6s ease-out forwards}
.v17l .w17{display:inline-block;opacity:0;animation:v17w .35s ease-out forwards}
@keyframes v17in{to{opacity:1}}
@keyframes v17w{to{opacity:1}}

/* V20 — bottom-up smooth slide */
.v20{padding:12px 16px;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;min-height:100%}
.v20l{padding:10px 14px;border-radius:7px;font-size:15px;line-height:1.45;opacity:0;animation:v20in 1s cubic-bezier(.22,1,.36,1) forwards;background:rgba(124,58,237,.06);border:1px solid rgba(124,58,237,.15)}
@keyframes v20in{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}

/* V25 Film Strip — with action icons */
.v25{display:flex;flex-direction:column;overflow-y:auto;gap:6px;padding:10px 8px;overflow-x:hidden}
.v25f{padding:14px 16px;background:#111;border:2px solid #333;border-radius:5px;font-size:13px;line-height:1.45;color:var(--text);position:relative;opacity:0;animation:v25in .6s ease-out forwards}
.v25f::before,.v25f::after{content:'';position:absolute;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:#333}
.v25f::before{left:-11px}.v25f::after{right:-11px}
.v25f .v25act{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;gap:4px;opacity:0;transition:opacity .15s}
.v25f:hover .v25act{opacity:1}
.v25act button{width:22px;height:22px;border-radius:50%;border:1px solid #444;background:#1a1a1a;color:var(--t3);cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.v25act button:hover{border-color:var(--accent);color:var(--accent)}
.v25act .v25del:hover{border-color:var(--red);color:var(--red)}
.v25act .v25bm:hover{border-color:var(--amber);color:var(--amber)}
@keyframes v25in{to{opacity:1}}

/* V6bis — Tabbed translation */
.v6b{padding:0}
.v6b .v6btabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.v6b .v6btab{padding:8px 16px;font-size:11px;font-weight:600;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.v6b .v6btab.on{color:var(--accent);border-bottom-color:var(--accent)}
.v6b .v6brow{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;opacity:0;animation:v6in .45s ease-out forwards}
.v6b .v6btran{font-size:12px;color:var(--t2);font-style:italic;margin-top:2px}

/* V6tris — Side-by-side original/translation */
.v6t{padding:10px;display:flex;flex-direction:column;gap:6px}
.v6t .v6trow{display:flex;gap:8px;opacity:0;animation:v6tin .5s ease-out forwards}
.v6t .v6torig{flex:1;font-size:15px;line-height:1.5;padding:8px 12px;background:var(--bg);border-radius:8px}
.v6t .v6tarrow{color:var(--accent);font-size:16px;align-self:center}
.v6t .v6ttran{flex:1;font-size:14px;line-height:1.5;padding:8px 12px;background:rgba(124,58,237,.06);border-radius:8px;color:var(--t2);font-style:italic}
@keyframes v6tin{to{opacity:1}}

/* V12bis — Banksy stencil */
.v12b{padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-content:start}
.v12bn{font-family:'Impact','Arial Black',sans-serif;font-size:26px;color:#fff;text-transform:uppercase;letter-spacing:2px;padding:8px 14px;background:#000;border:2px solid #fff;opacity:0;animation:v12in .6s ease-out forwards;position:relative;line-height:1.2;transition:all .2s}
.v12bn.collected{background:var(--green);border-color:var(--green);color:#000;box-shadow:0 0 16px rgba(34,197,94,.4)}
.v12bn::after{content:'';position:absolute;inset:-4px;border:1px solid rgba(255,255,255,.3)}

/* V12tris — Banksy spray */
.v12t{padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-content:start}
.v12tn{font-family:'Caveat',cursive;font-size:22px;color:#111;padding:10px 18px;opacity:0;animation:v12tin .5s ease-out forwards;position:relative;background:rgba(255,255,255,.85);border-radius:2px 16px 2px 16px;box-shadow:0 0 20px rgba(255,255,255,.1)}
.v12tn::before{content:'';position:absolute;inset:-6px;border:1px dashed rgba(255,255,255,.2);border-radius:4px 20px 4px 20px}
@keyframes v12tin{to{opacity:1}}

/* V25tris — Film Strip interactive cards */
.v25t{display:flex;flex-direction:column;overflow-y:auto;gap:4px;padding:8px}
.v25tf{padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:14px;line-height:1.5;color:var(--text);cursor:pointer;opacity:0;animation:v25tin .5s ease-out forwards;transition:all .2s}
.v25tf:hover{border-color:var(--accent);transform:translateX(4px);box-shadow:0 2px 12px rgba(0,0,0,.2)}
.v25tf .v25meta{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.v25tf .v25n{font-size:9px;color:var(--t3);font-family:var(--mono)}
@keyframes v25tin{to{opacity:1}}
</style>
</head>
<body>

<div class="page">
  <h1>📝 Transcript Box · 25 Animated Mockups</h1>
  <p class="subtitle">Each variation shows a <strong>live animated demo</strong> — sentences appear in real time as they would during speech.</p>

  <div class="grid" id="grid"></div>
</div>

<script>
// ═══ DEMO ENGINE ═══
// Each variation: { id, title, html template, demo sentences[], render fn, clear fn }
// The engine cycles: clear → add sentences one by one with delay → pause → repeat

var demoData = [];

function define(id, title, badges, bodyHtml, sentences, renderFn) {
  demoData.push({ id:id, title:title, badges:badges, bodyHtml:bodyHtml, sentences:sentences, render:renderFn, delay:0 });
}

// ═══ Helper: create word spans ═══
function w(text, alt) {
  return '<span class="word'+(alt?' alt':'')+'"'+(alt?' title="Maybe: '+alt+'"':'')+'>'+text+'</span>';
}

// ═══ DEMO SENTENCE POOL (Dutch/English mix for realism) ═══
var S = [
  'The <span class="word">weather</span> <span class="word">today</span> <span class="word">is</span> <span class="word">quite</span> <span class="word alt" title="Maybe: lovely">lovly</span>.',
  'Ik <span class="word">wil</span> <span class="word">graag</span> <span class="word">een</span> <span class="word">kopje</span> <span class="word">koffie</span> <span class="word">alsjeblieft</span>.',
  'The <span class="word">project</span> <span class="word">deadline</span> <span class="word">has</span> <span class="word">been</span> <span class="word">extended</span> <span class="word">to</span> <span class="word">Friday</span>.',
  'We <span class="word">moeten</span> <span class="word">nog</span> <span class="word">even</span> <span class="word">geduld</span> <span class="word alt" title="Maybe: hebben">hebben</span> <span class="word">met</span> <span class="word">de</span> <span class="word">resultaten</span>.',
  'She <span class="word">said</span> <span class="word">she</span> <span class="word">would</span> <span class="word">call</span> <span class="word">back</span> <span class="word">within</span> <span class="word">the</span> <span class="word">hour</span>.',
  'Het <span class="word">is</span> <span class="word">vandaag</span> <span class="word">echt</span> <span class="word">prachtig</span> <span class="word">weer</span> <span class="word">buiten</span>.',
  'Can <span class="word">you</span> <span class="word">send</span> <span class="word">me</span> <span class="word">the</span> <span class="word alt" title="Maybe: document">documment</span> <span class="word">by</span> <span class="word">email</span>?',

// V3 Word Bank — click words to collect, animated toast notification
var v3bankWords=[];
function v3collect(wordEl){
  wordEl.classList.toggle('collected');
  var w=wordEl.textContent.trim().toLowerCase();
  if(wordEl.classList.contains('collected')){
    if(v3bankWords.indexOf(w)===-1)v3bankWords.push(w);
    showV3Toast('✓ Added: '+w);
  } else {
    v3bankWords=v3bankWords.filter(function(x){return x!==w});
  }
  updateV3Bank();
}
function showV3Toast(msg){
  var t=document.createElement('div');t.className='v3toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.remove()},1600);
}
function updateV3Bank(){
  var bc=document.getElementById('v3bankCount');if(bc)bc.textContent=v3bankWords.length;
  var bw=document.getElementById('v3bankWords');
  if(bw){bw.innerHTML=v3bankWords.map(function(w){return '<span class=\"v3bw\">'+w+'</span>'}).join('');}
}
define('V3','Word Bank','bs bt',
  '<div class="v3" id="v3b"></div>',
  [0,2,4,6,8,10],
  function(body,s,i){
    var d=document.createElement('div');
    d.className='v3r';
    // Wrap each word in a clickable span
    var words=s.match(/<span[^>]*>.*?<\/span>|\S+/g)||[];
    var html='<span class="v3i">'+(i+1).toString().padStart(2,'0')+'</span><span class="v3x">';
    words.forEach(function(wd){
      if(wd.indexOf('<span')===0){
        // Extract text from word span
        var m=wd.match(/>([^<]+)</);
        var txt=m?m[1]:wd.replace(/<[^>]*>/g,'');
        var alt=wd.indexOf('alt')!==-1;
        html+='<span class="v3w'+(alt?' alt':'')+'" onclick="v3collect(this);event.stopPropagation()">'+txt+'</span>';
      } else {
        html+='<span class="v3w" onclick="v3collect(this);event.stopPropagation()">'+wd+'</span>';
      }
      html+=' ';
    });
    html+='</span>';
    d.innerHTML=html;
    body.appendChild(d);
  }
);

// ═══ BUILD THE GRID ═══
var grid=document.getElementById('grid');
var cardMap={}; // map variation id → card element

demoData.forEach(function(v){
  var card=document.createElement('div');
  card.className='m';
  card.dataset.varId=v.id;
  var badgesHtml=v.badges.split(' ').map(function(b){
    var cls=b==='ba'?'ba':b==='be'?'be':b==='bs'?'bs':'bt';
    var label=b==='ba'?'anim':b==='be'?'edit':b==='bs'?'select':'space';

  }).join('');

  grid.appendChild(card);
  cardMap[v.id]=card;
});

// ── Play button style ──
var playStyle=document.createElement('style');
playStyle.textContent='.play-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;color:var(--t2);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;margin-left:4px}.play-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(124,58,237,.1)}.play-btn.playing{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.1)}.play-btn.playing:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.1)}';
document.head.appendChild(playStyle);

// ═══ PER-VARIATION DEMO PLAYER ═══
// Each variation runs independently when its play button is clicked.
// Real speech pace: ~2.5s between sentences, ~5s pause after all shown.
var playerStates={};

function getPlayerState(id){
  if(!playerStates[id]){
    var card=cardMap[id];
    var body=card.querySelector('.mc > *');
    var def=demoData.find(function(d){return d.id===id});
    playerStates[id]={body:body,def:def,playing:false,idx:0,timer:null,phase:'idle'};
  }
  return playerStates[id];
}

function stopDemo(id){
  var ps=getPlayerState(id);
  if(ps.timer){clearTimeout(ps.timer);ps.timer=null;}
  ps.playing=false;
  ps.phase='idle';
  // Reset body HTML
  ps.body.innerHTML=ps.def.bodyHtml.replace(/ id="[^"]*"/,'');
  // Update button
  var btn=cardMap[id].querySelector('.play-btn');
  if(btn){btn.textContent='▶';btn.classList.remove('playing');btn.title='Play demo';}
}

function toggleDemo(id){
  var ps=getPlayerState(id);
  if(ps.playing){
    // Stop
    stopDemo(id);
    return;
  }
  // Start playing
  ps.playing=true;
  ps.idx=0;
  ps.phase='adding';
  var btn=cardMap[id].querySelector('.play-btn');
  if(btn){btn.textContent='⏹';btn.classList.add('playing');btn.title='Stop demo';}
  // Clear & start
  ps.body.innerHTML=ps.def.bodyHtml.replace(/ id="[^"]*"/,'');
  advanceDemo(id);
}

function advanceDemo(id){
  var ps=getPlayerState(id);
  if(!ps.playing)return;
  var def=ps.def;
  
  if(ps.phase==='adding'){
    if(ps.idx < def.sentences.length){
      var si=def.sentences[ps.idx];
      var s=S[si];
      def.render(ps.body,s,ps.idx,def.sentences.length);
      ps.idx++;
      // 🐌 Real speech pace: 2–3 seconds between sentences
      var gap=2200+Math.random()*1200;
      ps.timer=setTimeout(function(){advanceDemo(id)},gap);
      return;
    } else {
      // All shown — pause then stop
      ps.phase='done';
      ps.timer=setTimeout(function(){advanceDemo(id)},5000);
      return;
    }
  }
  
  if(ps.phase==='done'){
    // Stay showing for a while, then auto-stop
    stopDemo(id);
  }
}

// ═══ Stop any demo if user scrolls/interacts with the card body ═══
// (Keep it simple — clicking play is the only control)
