<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Duo Matrix · 15 Variants</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f15;--card:#131820;--line:#1e2632;--text:#e2e4e9;--t2:#9099a8;--t3:#5e6676;--accent:#7c3aed;--green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;--red:#ef4444;--pink:#ec4899;--teal:#14b8a6;--f:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;padding:24px 24px 4px}
.sub{font-size:13px;color:var(--t3);padding:0 24px 20px}
.page{padding:0 20px 40px;max-width:1920px;margin:0 auto}
/* Grid: 3 columns (one per style) */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.col-head{grid-column:span 1;text-align:center;font-size:14px;font-weight:700;color:var(--t2);padding:8px 0;letter-spacing:.03em;text-transform:uppercase}
/* Card */
.m{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.mh{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;flex-shrink:0}
.mn{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.05em}
.mc{flex:1;overflow-y:auto;min-height:180px;max-height:260px;position:relative}
/* ═══ DUO1 — Side-by-Side (1 speaker) ═══ */
.d1s{padding:10px;display:flex;flex-direction:column;gap:10px}
.d1s .dr{display:flex;gap:10px;align-items:flex-start}
.d1s .do{flex:1;font-size:14px;line-height:1.45;padding:10px 12px;background:var(--bg);border-radius:10px;border:1px solid var(--line);min-width:0}
.d1s .da{color:var(--accent);font-size:16px;align-self:center;flex-shrink:0;font-weight:700}
.d1s .dt{flex:1;font-size:15px;font-weight:600;line-height:1.45;padding:10px 12px;border-radius:10px;min-width:0}
/* d1 color variants per speaker count */
.d1s.s1 .dt{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);color:var(--text)}
.d1s.s2 .dt{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:var(--text)}
.d1s.s3 .dt{background:rgba(236,72,153,.08);border:1px solid rgba(236,72,153,.2);color:var(--text)}
.d1s.s4 .dt{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);color:var(--text)}
.d1s.s5 .dt{background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.2);color:var(--text)}
/* ═══ DUO2 — Chat Bubbles (2 speakers) ═══ */
.d2s{padding:10px;display:flex;flex-direction:column;gap:8px}
.d2s .db{max-width:86%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.45;display:flex;align-items:flex-start;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.d2s .db.l{align-self:flex-start;border-bottom-left-radius:6px}
.d2s .db.r{align-self:flex-end;border-bottom-right-radius:6px;color:#fff}
.d2s .dbt{flex:1;min-width:0;font-size:13px}
.d2s .dbl{font-size:10px;margin-top:3px;opacity:.75;display:flex;align-items:center;gap:4px}
.d2s .db.r .dbl{color:rgba(255,255,255,.6)}
/* d2 color variants */
.d2s.s1 .db.l{background:var(--line);color:var(--text)} .d2s.s1 .db.r{background:linear-gradient(135deg,rgba(59,130,246,.4),rgba(59,130,246,.2))}
.d2s.s2 .db.l{background:#1a2a1a;color:#bbf7d0} .d2s.s2 .db.r{background:linear-gradient(135deg,rgba(34,197,94,.4),rgba(34,197,94,.2))}
.d2s.s3 .db.l{background:#2a1a2a;color:#fbcfe8} .d2s.s3 .db.r{background:linear-gradient(135deg,rgba(236,72,153,.4),rgba(236,72,153,.2))}
.d2s.s4 .db.l{background:#2a2010;color:#fde68a} .d2s.s4 .db.r{background:linear-gradient(135deg,rgba(245,158,11,.4),rgba(245,158,11,.2))}
.d2s.s5 .db.l{background:#1a1a2a;color:#ddd6fe} .d2s.s5 .db.r{background:linear-gradient(135deg,rgba(139,92,246,.4),rgba(139,92,246,.2))}
/* ═══ DUO3 — Tabs (3+ speakers) ═══ */
.d3s{padding:0}
.d3s .d3t{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2;flex-wrap:wrap}
.d3s .d3tb{padding:6px 10px;font-size:10px;font-weight:600;color:var(--t3);border-bottom:2px solid transparent;background:transparent;font-family:var(--f)}
.d3s .d3tb.on{color:var(--accent);border-bottom-color:var(--accent)}
.d3s .d3r{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(128,128,128,.04);font-size:13px}
.d3s .d3tt{font-weight:700;font-size:14px;line-height:1.4}
.d3s .d3so{font-size:11px;color:var(--t2);margin-top:2px;line-height:1.4;font-style:italic}
.d3s .d3sn{font-size:9px;color:#fff;padding:1px 5px;border-radius:3px;margin-left:5px;font-weight:700}
/* d3 color variants */
.d3s.s1 .d3tb.on{color:#3b82f6;border-color:#3b82f6} .d3s.s1 .d3sn{background:#3b82f6}
.d3s.s2 .d3tb.on{color:#22c55e;border-color:#22c55e} .d3s.s2 .d3sn{background:#22c55e}
.d3s.s3 .d3tb.on{color:#ec4899;border-color:#ec4899} .d3s.s3 .d3sn{background:#ec4899}
.d3s.s4 .d3tb.on{color:#f59e0b;border-color:#f59e0b} .d3s.s4 .d3sn{background:#f59e0b}
.d3s.s5 .d3tb.on{color:#8b5cf6;border-color:#8b5cf6} .d3s.s5 .d3sn{background:#8b5cf6}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>🔢 Duo Matrix · 5×3 = 15 Variants</h1>
<p class="sub">Speakers (1→5) ↓ &nbsp;·&nbsp; Styles (d1 Side-by-Side | d2 Bubbles | d3 Tabs) → &nbsp;·&nbsp; Each with unique color palette</p>
<div class="page"><div class="grid" id="grid"></div></div>

<script>
var speakers = [
  {name:'Alice',snl:'en',color:'#3b82f6'},
  {name:'Marco',snl:'it',color:'#22c55e'},
  {name:'Sofie',snl:'nl',color:'#ec4899'},
  {name:'Jean',snl:'fr',color:'#f59e0b'},
  {name:'Klaus',snl:'de',color:'#8b5cf6'}
];

var demoSentences = [
  {orig:'The weather is lovely today.',tran:'Il tempo è bello oggi.'},
  {orig:'Can we start the meeting?',tran:'Possiamo iniziare la riunione?'},
  {orig:'I have the documents ready.',tran:'Ho i documenti pronti.'},
  {orig:'That sounds like a great plan.',tran:'Sembra un ottimo piano.'},
  {orig:'Let us review the proposal.',tran:'Esaminiamo la proposta.'}
];

function buildCard(style, spkCount, spkIdx) {
  var sp = speakers[spkIdx];
  var sClass = 's'+spkCount;
  var html = '';

  if (style === 'd1') {
    // Side-by-side — show one row per speaker
    html = '<div class="d1s '+sClass+'">';
    for (var i = 0; i < spkCount; i++) {
      var s = speakers[i];
      var d = demoSentences[i % demoSentences.length];
      html += '<div class="dr"><div class="do">'+esc(d.orig)+' <span style="font-size:9px;color:var(--t3)">('+s.snl.toUpperCase()+')</span></div><div class="da">→</div><div class="dt">'+esc(d.tran)+'</div></div>';
    }
    html += '</div>';
  } else if (style === 'd2') {
    // Bubbles — alternate left/right, use first 2 speakers only
    html = '<div class="d2s '+sClass+'">';
    var a = speakers[0], b = speakers[1] || speakers[0];
    for (var i = 0; i < Math.min(spkCount, 4); i++) {
      var d = demoSentences[i];
      var side = (i%2===0) ? 'l' : 'r';
      var spk = (i%2===0) ? a : b;
      html += '<div class="db '+side+'"><span class="dbt">'+esc(d.tran)+'<div class="dbl"><span style="color:'+spk.color+'">●</span> '+spk.name+'</div></span></div>';
    }
    html += '</div>';
  } else {
    // Tabs — one tab per speaker
    html = '<div class="d3s '+sClass+'"><div class="d3t">';
    for (var i = 0; i < spkCount; i++) {
      var s = speakers[i];
      html += '<span class="d3tb'+(i===0?' on':'')+'">'+s.name.substring(0,3).toUpperCase()+'</span>';
    }
    html += '</div>';
    for (var i = 0; i < Math.min(spkCount, 4); i++) {
      var s = speakers[i];
      var d = demoSentences[i];
      html += '<div class="d3r"><div style="flex:1;min-width:0"><div class="d3tt">'+esc(d.tran)+'</div><div class="d3so">'+esc(d.orig)+'<span class="d3sn" style="background:'+s.color+'">'+s.name.substring(0,3).toUpperCase()+'</span></div></div></div>';
    }
    html += '</div>';
  }
  return html;
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

var grid = document.getElementById('grid');
var styleNames = ['d1 — Side-by-Side','d2 — Chat Bubbles','d3 — Accordion Tabs'];
var styleIds = ['d1','d2','d3'];
var colorNames = ['🔵 Blue','🟢 Green','🔴 Pink','🟠 Amber','🟣 Violet'];

// Column headers
for (var si = 0; si < 3; si++) {
  var hdr = document.createElement('div');
  hdr.className = 'col-head';
  hdr.textContent = styleNames[si];
  grid.appendChild(hdr);
}

// 5 rows × 3 columns
for (var spk = 1; spk <= 5; spk++) {
  for (var si = 0; si < 3; si++) {
    var card = document.createElement('div');
    card.className = 'm';
    card.innerHTML = '<div class="mh"><span class="mn">'+spk+' speaker'+(spk>1?'s':'')+'</span><span style="font-size:10px;color:var(--t3)">'+colorNames[spk-1]+'</span></div><div class="mc">'+buildCard(styleIds[si], spk, spk-1)+'</div>';
    grid.appendChild(card);
  }
}
</script>
</body>
</html>
