<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px}
h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:2px}
@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.subtitle{text-align:center;color:#8b93a5;margin-bottom:20px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:1600px;margin:0 auto}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.mockup-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:14px;overflow:hidden;transition:all .35s;animation:fadeInUp .5s ease both}
.mockup-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,.5);border-color:#2a2e3e}
.mockup-card.deleted-card{display:none!important}
.mockup-label{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:#1a1e2e;font-size:11px;font-weight:600;color:#8b93a5}
.mockup-label span:last-child{font-size:9px;color:#4e5566;font-family:'JetBrains Mono',monospace}
.mockup-body{padding:14px;min-height:320px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.cap-box{border-radius:10px;padding:14px;position:relative;transition:all .3s}
.cap-interim{font-weight:600;line-height:1.2;margin-bottom:4px;font-size:14px}
.cap-line{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:11px}
.cap-ts{flex-shrink:0;font-size:8px;opacity:.4;padding-top:1px;min-width:44px}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{padding:4px 10px;border-radius:100px;font-size:9px;font-weight:600;display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.6)}

var designs=[
{n:'01 · Progressive Word Card',d:'Tap to expand word details',p:function(){var h='<div style="display:flex;flex-direction:column;gap:4px">';S.forEach(function(w){h+='<details style="background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:8px;overflow:hidden"><summary style="padding:8px 12px;cursor:pointer;font-size:11px;font-weight:600;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:6px"><span>'+w.i+'</span>'+w.w+'<span style="font-size:8px;color:'+(w.p==='VERB'?'#60a5fa':w.p==='NOUN'?'#34d399':'#f97316')+';margin-left:auto">'+w.p+'</span></summary><div style="padding:8px 12px;font-size:10px;color:rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.04)">CEFR: <b>'+w.c+'</b> · Synonym: <i>'+w.s+'</i></div></details>'});h+='</div>';return h}},
{n:'02 · Color-coded Transcript',d:'Each POS type gets a distinct color',p:function(){var h='<div style="font-size:12px;line-height:1.8;padding:8px;background:rgba(255,255,255,.02);border-radius:8px">';S.forEach(function(w){var c=w.p==='VERB'?'#3b82f6':w.p==='NOUN'?'#34d399':w.p==='ADJ'?'#f97316':'#a78bfa';h+='<span style="background:'+c+'18;color:'+c+';padding:2px 6px;border-radius:4px;margin:0 2px;font-weight:600">'+w.w+'</span>'});h+='</div>';return h}},
{n:'03 · Word Timeline',d:'When each word first appeared',p:function(){var h='<div style="font-size:10px;color:rgba(255,255,255,.5);line-height:2">';var times=['03:42:15.2','03:42:15.5','03:42:15.8','03:42:16.1','03:43:00.3','03:43:02.7'];S.forEach(function(w,i){h+='<div style="display:flex;align-items:center;gap:8px"><span style="font-family:JetBrains Mono,monospace;font-size:9px;color:rgba(255,255,255,.3);width:60px">'+times[i]+'</span><span style="width:4px;height:4px;border-radius:50%;background:#60a5fa;flex-shrink:0"></span><span style="color:rgba(255,255,255,.7);font-weight:600">'+w.w+'</span><span style="font-size:8px;color:rgba(255,255,255,.3)">'+w.p+'</span></div>'});h+='</div>';return h}},
{n:'04 · CEFR Distribution Ring',d:'Donut chart by language level',p:function(){var h='<div style="display:flex;align-items:center;gap:16px;padding:8px"><div style="position:relative;width:100px;height:100px;flex-shrink:0"><svg viewBox="0 0 120 120" style="transform:rotate(-90deg)">';var segs=[{c:'#60a5fa',p:35,o:0,l:'A1-A2'},{c:'#fbbf24',p:45,o:35,l:'B1-B2'},{c:'#f87171',p:20,o:80,l:'C1-C2'}];segs.forEach(function(s){var circ=Math.PI*90;h+='<circle cx="60" cy="60" r="45" fill="none" stroke="'+s.c+'" stroke-width="14" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-(s.o+s.p)/100))+'" style="stroke-dashoffset:'+(circ*(1-(s.o+s.p)/100))+'"/>'});h+='</svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff">B1</div></div><div style="font-size:9px;color:rgba(255,255,255,.4);line-height:2">';segs.forEach(function(s){h+='<div style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:'+s.c+'"></span>'+s.l+': '+s.p+'%</div>'});h+='</div></div>';return h}},
{n:'05 · Word Family Tree',d:'Related word forms',p:function(){var h='<div style="display:flex;flex-wrap:wrap;gap:6px">';var families=[{root:'discuss',forms:['discussion','discussing','discussed','discussable']},{root:'translate',forms:['translation','translator','translating','translated']},{root:'internat',forms:['international','internationally','internationalize']}];families.forEach(function(f){h+='<div style="background:rgba(167,139,250,.04);border:1px solid rgba(167,139,250,.12);border-radius:8px;padding:8px;min-width:120px"><div style="font-size:11px;font-weight:700;color:#c4b5fd;margin-bottom:4px">'+f.root+'</div>';f.forms.forEach(function(ff){h+='<div style="font-size:9px;color:rgba(255,255,255,.5);padding:1px 0">↳ '+ff+'</div>'});h+='</div>'});h+='</div>';return h}},
{n:'06 · Live Grammar Parse',d:'Sentence structure tree',p:function(){return'<div style="font-family:JetBrains Mono,monospace;font-size:9px;color:rgba(255,255,255,.4);line-height:1.8;padding:8px;background:rgba(255,255,255,.02);border-radius:8px">S<br>├─ NP: <span style="color:#60a5fa">we</span><br>├─ VP: <span style="color:#3b82f6">are discussing</span><br>│  └─ NP: <span style="color:#34d399">the future</span><br>│     └─ PP: <span style="color:#f97316">of real-time translation</span><br>└─ CC: <span style="color:#a78bfa">and</span><br>   └─ S: how it can be used…</div>'}},
{n:'07 · N-gram Frequency',d:'Recurring word sequences',p:function(){var h='<div style="display:flex;flex-direction:column;gap:3px">';var grams=[{ng:'we are discussing',c:3},{ng:'the future of',c:2},{ng:'real-time translation',c:2},{ng:'in international meetings',c:2},{ng:'can be used',c:1}];grams.forEach(function(g){var bar=Math.min(100,g.c*33);h+='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:rgba(255,255,255,.6);width:140px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+g.ng+'</span><div style="flex:1;height:5px;background:rgba(255,255,255,.06);border-radius:3px"><div style="height:100%;width:'+bar+'%;border-radius:3px;background:linear-gradient(90deg,#60a5fa,#a78bfa)"></div></div><span style="font-size:9px;color:rgba(255,255,255,.3);width:16px">×'+g.c+'</span></div>'});h+='</div>';return h}},
{n:'08 · Sentence Complexity',d:'Clause nesting depth',p:function(){var h='<div style="padding:8px;background:rgba(255,255,255,.02);border-radius:8px"><div style="font-size:10px;color:rgba(255,255,255,.5);margin-bottom:6px">Complexity: <span style="color:#fbbf24;font-weight:700">Moderate</span> · 2 clauses · Max depth: 3</div><div style="display:flex;gap:2px;height:24px;align-items:flex-end">';[1,2,3,1,2,1].forEach(function(d){var hh=d*25+'%';var c=['#60a5fa','#34d399','#fbbf24','#f97316','#a78bfa','#f472b6'][d-1]||'#60a5fa';h+='<div style="flex:1;height:'+hh+';background:'+c+';border-radius:2px 2px 0 0;opacity:'+(0.3+d*0.2)+'"></div>'});h+='</div><div style="font-size:7px;color:rgba(255,255,255,.2);margin-top:3px;display:flex;justify-content:space-between"><span>Clause 1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div></div>'}},
{n:'09 · Active Vocabulary Size',d:'Estimated known words',p:function(){return'<div style="text-align:center;padding:8px"><div style="font-family:JetBrains Mono,monospace;font-size:32px;font-weight:900;color:#34d399">2,847</div><div style="font-size:9px;color:rgba(255,255,255,.3)">Estimated active vocabulary</div><div style="display:flex;justify-content:space-between;margin-top:6px;font-size:7px;color:rgba(255,255,255,.2)"><span>A1: 600</span><span>A2: 1,200</span><span style="color:#34d399">B1: 2,800</span><span>B2: 5,000</span></div><div style="height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:2px"><div style="width:57%;height:100%;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#34d399)"></div></div></div>'}},
{n:'10 · Word Difficulty Meter',d:'Rare vs common words',p:function(){var h='<div style="display:flex;flex-direction:column;gap:4px">';S.forEach(function(w,i){var diff=[25,15,68,35,30,20][i];var c=diff<30?'#34d399':diff<50?'#fbbf24':'#f87171';var l=diff<30?'Common':diff<50?'Intermediate':'Advanced';h+='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;width:70px;color:rgba(255,255,255,.6)">'+w.w+'</span><div style="flex:1;height:5px;background:rgba(255,255,255,.06);border-radius:3px"><div style="height:100%;width:'+diff+'%;border-radius:3px;background:'+c+'"></div></div><span style="font-size:8px;color:'+c+';width:70px">'+l+'</span></div>'});h+='</div>';return h}},
{n:'11 · Multi-Language Gloss',d:'Word in 5 target languages',p:function(){var h='<div style="overflow-x:auto"><table style="width:100%;font-size:10px;border-collapse:collapse"><tr style="color:rgba(255,255,255,.3);font-size:8px"><th style="padding:4px 6px;text-align:left">EN</th><th>IT</th><th>NL</th><th>ES</th><th>FR</th><th>DE</th></tr>';var rows=[{en:'discussing',it:'discutendo',nl:'bespreken',es:'discutiendo',fr:'discutant',de:'diskutieren'},{en:'future',it:'futuro',nl:'toekomst',es:'futuro',fr:'avenir',de:'Zukunft'},{en:'translation',it:'traduzione',nl:'vertaling',es:'traducción',fr:'traduction',de:'Übersetzung'}];rows.forEach(function(r){h+='<tr style="border-top:1px solid rgba(255,255,255,.04)"><td style="padding:4px 6px;font-weight:600;color:#60a5fa">'+r.en+'</td><td style="color:rgba(255,255,255,.6)">'+r.it+'</td><td style="color:rgba(255,255,255,.5)">'+r.nl+'</td><td style="color:rgba(255,255,255,.5)">'+r.es+'</td><td style="color:rgba(255,255,255,.5)">'+r.fr+'</td><td style="color:rgba(255,255,255,.5)">'+r.de+'</td></tr>'});h+='</table></div>';return h}},
{n:'12 · Speech Rate Gauge',d:'Real-time WPM speedometer',p:function(){return'<div style="text-align:center;padding:8px"><div style="position:relative;width:120px;height:60px;margin:0 auto;overflow:hidden"><div style="position:absolute;bottom:0;left:0;right:0;height:120px;border-radius:50%;background:conic-gradient(from 180deg,#60a5fa 0deg,#34d399 60deg,#fbbf24 120deg,#f87171 180deg);mask:radial-gradient(circle at 50% 100%,transparent 60%,#000 60%)"></div><div style="position:relative;font-family:JetBrains Mono,monospace;font-size:20px;font-weight:900;color:#fbbf24;padding-top:24px">142<span style="font-size:9px;color:rgba(255,255,255,.3)"> WPM</span></div></div></div>'}},
{n:'13 · Phoneme Count',d:'Sounds per word breakdown',p:function(){var h='<div style="display:flex;flex-direction:column;gap:6px">';var phonemes=[{w:'discussing',ph:'dɪˈskʌsɪŋ',cnt:8},{w:'future',ph:'ˈfjuːtʃər',cnt:6},{w:'translation',ph:'trænsˈleɪʃən',cnt:10}];phonemes.forEach(function(p){h+='<div style="background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:6px;padding:6px 10px"><div style="display:flex;justify-content:space-between;margin-bottom:2px"><span style="font-size:10px;font-weight:600;color:rgba(255,255,255,.7)">'+p.w+'</span><span style="font-size:9px;color:rgba(255,255,255,.3)">'+p.cnt+' phonemes</span></div><div style="font-family:JetBrains Mono,monospace;font-size:9px;color:#a78bfa">'+p.ph+'</div></div>'});h+='</div>';return h}},
{n:'14 · Idiom Detector',d:'Common expression flagging',p:function(){return'<div style="font-size:10px;color:rgba(255,255,255,.5);padding:8px;background:rgba(251,191,36,.04);border:1px solid rgba(251,191,36,.1);border-radius:8px"><div style="display:flex;align-items:center;gap:4px;margin-bottom:6px"><span style="color:#fbbf24">💡</span><span style="font-weight:600;color:#fbbf24">1 idiom-like expression detected</span></div><div style="padding:4px 0">"<span style="color:rgba(255,255,255,.7)">the future of</span>" — common collocation (B1)</div><div style="font-size:8px;color:rgba(255,255,255,.2);margin-top:4px">Alternatives: "what lies ahead for", "the outlook for"</div></div>'}},
{n:'15 · Lexical Gap Analysis',d:'Missing word categories',p:function(){return'<div style="padding:8px;background:rgba(248,113,113,.04);border:1px solid rgba(248,113,113,.1);border-radius:8px"><div style="font-size:10px;font-weight:600;color:#f87171;margin-bottom:6px">⚠ Lexical Gaps Detected</div><div style="font-size:9px;color:rgba(255,255,255,.5);line-height:1.8">No adverbs used in this segment<br>No conjunctions besides "and"<br>Limited adjectives (only "international", "real-time")</div><div style="font-size:8px;color:rgba(255,255,255,.2);margin-top:4px">Suggestion: Try adding adverbs like "currently", "actively"</div></div>'}},
{n:'16 · Syllable Rhythm',d:'Stress pattern visualization',p:function(){var h='<div style="display:flex;flex-direction:column;gap:6px">';var rhythms=[{w:'discussing',p:'○●○○'},{w:'future',p:'●○'},{w:'translation',p:'○●○'},{w:'international',p:'○○●○○'}];rhythms.forEach(function(r){h+='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;width:80px;color:rgba(255,255,255,.6)">'+r.w+'</span><span style="font-family:JetBrains Mono,monospace;font-size:12px;letter-spacing:2px">';for(var j=0;j<r.p.length;j++){h+='<span style="color:'+(r.p[j]==='●'?'#60a5fa':'rgba(255,255,255,.2)')+'">'+r.p[j]+'</span>'}h+='</span></div>'});h+='</div>';return h}},
{n:'17 · Word Cloud Live',d:'Growing word visualization',p:function(){var h='<div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;padding:8px">';S.forEach(function(w,i){var sz=10+(6-i)*3;h+='<span style="font-size:'+sz+'px;font-weight:'+(700-i*40)+';color:rgba(255,255,255,'+(0.3+i*0.12)+')">'+w.w+'</span>'});h+='</div>';return h}},
{n:'18 · False Friend Alert',d:'Cross-language traps',p:function(){return'<div style="font-size:10px;color:rgba(255,255,255,.5);padding:8px;background:rgba(248,113,113,.04);border:1px solid rgba(248,113,113,.1);border-radius:8px"><div style="color:#f87171;font-weight:600;margin-bottom:4px">⚠ False Friend Warning</div><div style="line-height:1.6">"discussing" ≠ Italian "discutere" (argue)<br>✓ Better: "parlare di" / "trattare"<br>"translation" ≠ "traslazione" (physics)<br>✓ Correct: "traduzione"</div></div>'}},
{n:'19 · Speech Act Classifier',d:'Intent of each utterance',p:function(){var h='<div style="display:flex;gap:4px;flex-wrap:wrap">';[{a:'INFORMING',c:'#60a5fa'},{a:'ELABORATING',c:'#34d399'},{a:'CONNECTING',c:'#a78bfa'}].forEach(function(sa){h+='<span class="chip" style="background:'+sa.c+'10;color:'+sa.c+';border:1px solid '+sa.c+'33;font-weight:700;font-size:9px">'+sa.a+'</span>'});h+='</div>';return h}},

{n:'21 · Contextual Synonyms',d:'Best synonym based on context',p:function(){var h='<div style="display:flex;flex-direction:column;gap:4px">';S.forEach(function(w){h+='<div style="display:flex;align-items:center;gap:6px;padding:4px 8px;background:rgba(255,255,255,.02);border-radius:6px"><span style="font-size:10px;font-weight:600;color:rgba(255,255,255,.7);width:70px">'+w.w+'</span><span style="color:rgba(255,255,255,.2);font-size:14px">→</span><span style="font-size:10px;color:#a78bfa;font-weight:500">'+w.s+'</span><span style="font-size:7px;color:rgba(255,255,255,.2);margin-left:auto">'+Math.floor(Math.random()*15+85)+'% match</span></div>'});h+='</div>';return h}},

  if(isFaveComment(msg)){
    var f=JSON.parse(localStorage.getItem(FAV_KEY)||'{}');
    if(!f[key]){f[key]=true;localStorage.setItem(FAV_KEY,JSON.stringify(f));favBtn.classList.add('active');card.classList.add('favorited');if(!label.querySelector('.favorite-star')){var s=document.createElement('span');s.className='favorite-star';s.textContent='⭐';label.appendChild(s);}}
  }
  
  var existingNote=card.querySelector('.comment-note');
  if(existingNote){existingNote.textContent=msg;}
  else{
    var note=document.createElement('div');note.className='comment-note';note.textContent=msg;
    var body=card.querySelector('.mockup-body');
    if(body){var panel=body.querySelector('.extra-panel');if(panel){panel.insertAdjacentElement('afterend',note);}else{body.appendChild(note);}}
  }
  
  var span=document.createElement('span');span.className='sent-msg';span.textContent='✓ Salvato';tools.appendChild(span);
  setTimeout(function(){span.remove()},2000);
  input.value='';
  
  // Update debug panel
  updateDebugPanel();
}

function updateDebugPanel(){
  var panel=document.getElementById("debug-notes-panel");
  if(!panel)return;
  var all=JSON.parse(localStorage.getItem("mockup_comments")||"{}");
  var allKeys=Object.keys(all);
  var pageKeys=allKeys.filter(function(k){return k.startsWith(pageId+"::")});
  
  // Always show the panel
  panel.style.display="block";
  
  if(allKeys.length===0){
    panel.innerHTML='<strong style="color:#6b7280">📋 Nessuna nota salvata. Scrivi un'+"'"+"istruzione e premi Enter per salvarla.</strong>";
    return;
  }
  
  var html='<strong style="color:#a78bfa">📋 '+allKeys.length+' note totali ('+pageKeys.length+' su questa pagina)</strong> ';
  html+='<button id="copyAllNotesBtn" style="background:#7c3aed;color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:10px;margin-left:8px;font-weight:600">📋 Copia TUTTE le note</button><br>';
  
  // Show notes on this page
  if(pageKeys.length>0){
    html+='<div style="margin-top:4px;color:#8b93a5;font-size:10px">Questa pagina:</div>';
    pageKeys.forEach(function(k){
      var name=k.replace(pageId+"::","");
      html+='<div style="margin:3px 0;padding:4px 8px;background:rgba(167,139,250,.08);border-radius:4px;font-size:10px"><span style="color:#60a5fa">'+name+'</span> → <span style="color:#e8eaed">'+all[k]+'</span></div>';
    });
  }
  
  // Show notes from other pages
  var otherKeys=allKeys.filter(function(k){return !k.startsWith(pageId+"::")});
  if(otherKeys.length>0){
    html+='<div style="margin-top:6px;color:#6b7280;font-size:10px">Altre pagine:</div>';
    otherKeys.forEach(function(k){
      var parts=k.split("::");
      var pg=parts[0].replace("studio-caption-mockups-","Pg ").replace("studio-caption-mockups","Pg 1");
      var name=parts[1]||"";
      html+='<div style="margin:2px 0;padding:3px 8px;background:rgba(107,114,128,.06);border-radius:4px;font-size:9px"><span style="color:#6b7280">['+pg+']</span> <span style="color:#60a5fa">'+name+'</span> → <span style="color:#9ca3af">'+all[k]+'</span></div>';
    });
  }
  
  panel.innerHTML=html;
  
  // Wire up copy button
  var btn=document.getElementById("copyAllNotesBtn");
  if(btn){
    btn.addEventListener("click",function(){
      var notes=JSON.parse(localStorage.getItem("mockup_comments")||"{}");
      navigator.clipboard.writeText(JSON.stringify(notes,null,2)).then(function(){
        btn.textContent="✓ Copiato!";
        setTimeout(function(){btn.textContent="📋 Copia TUTTE le note"},2000);
      });
    });
  }
}
document.querySelectorAll('.mockup-card').forEach(function(card){
  var label=card.querySelector('.mockup-label span:first-child');
  var name=label?label.textContent.trim():'';
  var key=pageId+'::'+name;
  
  var isDeleted=deleted.some(function(d){return d.name===name&&d.page===pageId});
  if(isDeleted){card.classList.add('deleted-card');return}
  
  var isFave=!!favorites[key];
  var savedComment=comments[key]||'';
  if(!isFave && savedComment && isFaveComment(savedComment)){
    isFave=true;favorites[key]=true;localStorage.setItem(FAV_KEY,JSON.stringify(favorites));
  }
  
  var isExtra=extras.some(function(e){return e.name===name&&e.sourcePage===pageId});
  if(isExtra){
    card.classList.add('extra-card');
    var badge=document.createElement('span');badge.className='extra-badge';badge.textContent='📌';badge.title='Già inviato agli Extra';label.appendChild(badge);
  }
  
  if(versioned[key]){
    card.classList.add('versioned');
    var vbadge=document.createElement('span');vbadge.className='version-badge';vbadge.textContent='◆ v2';vbadge.title='Nuova versione — nota processata il '+new Date(versioned[key]).toLocaleDateString('it-IT');label.appendChild(vbadge);
  }
  
  if(isFave){
    card.classList.add('favorited');
    var star=document.createElement('span');star.className='favorite-star';star.textContent='⭐';star.title='Preferito: '+savedComment;label.appendChild(star);
  }
  
  if(savedComment && savedComment.trim()){
    var note=document.createElement('div');note.className='comment-note';note.textContent=savedComment;
    var body=card.querySelector('.mockup-body');
    if(body){var panel=body.querySelector('.extra-panel');if(panel){panel.insertAdjacentElement('afterend',note);}else{body.appendChild(note);}}
  }
  
  var tools=document.createElement('div');tools.className='mockup-tools';
  var favActive=isFave?' active':'';
  tools.innerHTML='<input type="text" placeholder="✏️ Istruzioni per '+name+'..." class="mockup-msg" value="'+savedComment.replace(/"/g,'&quot;').replace(/</g,'&lt;')+'"><button class="fav-btn'+favActive+' mockup-fav" title="Preferito">⭐</button><button class="extra-btn mockup-extra" title="Sposta negli Extra">📌 Extra</button><button class="send-btn mockup-send">Invia</button><button class="del-btn mockup-del">'+String.fromCodePoint(0x1F5D1)+' Elimina</button>';
  card.appendChild(tools);
  
  var input=tools.querySelector('.mockup-msg');
  var favBtn=tools.querySelector('.mockup-fav');
  var extraBtn=tools.querySelector('.mockup-extra');
  
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();saveComment(card,label,name,key,input,tools,favBtn);}
  });
  
  favBtn.addEventListener('click',function(){
    var f=JSON.parse(localStorage.getItem(FAV_KEY)||'{}');
    if(f[key]){delete f[key];favBtn.classList.remove('active');card.classList.remove('favorited');var s=label.querySelector('.favorite-star');if(s)s.remove();}
    else{f[key]=true;favBtn.classList.add('active');card.classList.add('favorited');if(!label.querySelector('.favorite-star')){var s=document.createElement('span');s.className='favorite-star';s.textContent='⭐';label.appendChild(s);}}
    localStorage.setItem(FAV_KEY,JSON.stringify(f));
  });
  
  extraBtn.addEventListener('click',function(){
    var e=JSON.parse(localStorage.getItem(EXTRA_KEY)||'[]');
    if(e.some(function(x){return x.name===name&&x.sourcePage===pageId})){alert('📌 "'+name+'" è già negli Extra!');return;}
    // Capture the page's full style so extras page can render it
    var pageStyle='';
    var styleEls=document.querySelectorAll('style');
    styleEls.forEach(function(s){pageStyle+=s.textContent});
    var cardClone=card.cloneNode(true);
    var cloneTools=cardClone.querySelector('.mockup-tools');if(cloneTools)cloneTools.remove();
    var cloneNotes=cardClone.querySelectorAll('.comment-note');cloneNotes.forEach(function(n){n.remove()});
    e.push({name:name,sourcePage:pageId,html:cardClone.outerHTML,style:pageStyle,comment:savedComment||'',time:Date.now()});
    localStorage.setItem(EXTRA_KEY,JSON.stringify(e));
    extraBtn.classList.add('sent');extraBtn.textContent='✓ Inviato';extraBtn.disabled=true;
    var d=JSON.parse(localStorage.getItem(DELETED_KEY)||'[]');d.push({name:name,page:pageId,time:Date.now()});
    localStorage.setItem(DELETED_KEY,JSON.stringify(d));
    card.classList.add('deleting');
    setTimeout(function(){card.classList.add('deleted-card');card.classList.remove('deleting')},450);
    var bar=document.querySelector('.deleted-bar');if(bar){var dd=JSON.parse(localStorage.getItem(DELETED_KEY)||'[]');bar.classList.add('visible');bar.querySelector('strong').textContent=dd.length}
    var ebar=document.querySelector('.extras-bar');if(ebar){var ee=JSON.parse(localStorage.getItem(EXTRA_KEY)||'[]');ebar.querySelector('strong').textContent=ee.length}
  });
  
  tools.querySelector('.mockup-send').addEventListener('click',function(){saveComment(card,label,name,key,input,tools,favBtn);});
  
  tools.querySelector('.mockup-del').addEventListener('click',function(){
    var confirm=document.createElement('div');confirm.className='del-confirm';
    confirm.innerHTML='<div><h3>'+String.fromCodePoint(0x1F5D1)+' Eliminare '+name+'?</h3><p>Questa versione sparirà dalla pagina e resterà eliminata anche dopo il refresh.</p><div class="btns"><button class="btn-yes">Sì, elimina</button><button class="btn-no">Annulla</button></div></div>';
    document.body.appendChild(confirm);
    confirm.querySelector('.btn-yes').addEventListener('click',function(){
      confirm.remove();
      var d=JSON.parse(localStorage.getItem(DELETED_KEY)||'[]');d.push({name:name,page:pageId,time:Date.now()});
      localStorage.setItem(DELETED_KEY,JSON.stringify(d));
      card.classList.add('deleting');
      setTimeout(function(){card.classList.add('deleted-card');card.classList.remove('deleting')},450);
      var bar=document.querySelector('.deleted-bar');if(bar){var dd=JSON.parse(localStorage.getItem(DELETED_KEY)||'[]');bar.classList.add('visible');bar.querySelector('strong').textContent=dd.length}
    });
    confirm.querySelector('.btn-no').addEventListener('click',function(){confirm.remove()});
    confirm.addEventListener('click',function(e){if(e.target===confirm)confirm.remove()});
  });
});
})();

</script></body></html>
