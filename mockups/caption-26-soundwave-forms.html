<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sottotitoli · 26 · Soundwave Forms</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:24px}h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6,#34d399);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s linear infinite;margin-bottom:2px}@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}.subtitle{text-align:center;color:#8b93a5;margin-bottom:24px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:900px;margin:0 auto}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:440px){.grid{grid-template-columns:1fr}}.wave-card{background:#0f121e;border:1px solid #1a1e2e;border-radius:16px;padding:24px 20px;transition:all .3s;animation:fadeIn .4s ease both;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:200px;justify-content:center}.wave-card:hover{transform:translateY(-4px);box-shadow:0 14px 40px rgba(0,0,0,.5);border-color:#2a2e3e}.wave-viz{width:100%;height:100px;display:flex;align-items:center;justify-content:center}.wave-label{font-size:12px;font-weight:700;color:rgba(255,255,255,.55);text-align:center}.wave-num{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.2)}@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}@keyframes barDance{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}@keyframes dotPulse{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-8px)}}@keyframes pulseGlow{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}@keyframes waterfall{0%{transform:translateY(-100%);opacity:0}50%{opacity:1}100%{transform:translateY(100%);opacity:0}}@keyframes flowRight{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}</style></head><body><h1>🎵 26 · Soundwave Forms</h1><p class="subtitle">9 Curated Audio Visualizations — June 2026</p><div class="grid" id="waveGrid"></div><script>
function audioBars(n){return Array.from({length:n},(_,i)=>{const b=Math.sin(i*0.7)*0.4+0.5;const n=(Math.sin(i*2.3+1.7)*0.25)+(Math.cos(i*1.1)*0.2);return Math.max(0.12,Math.min(1,b+n))})}
function hsl(h,s,l,a){return a!==undefined?`hsla(${h},${s}%,${l}%,${a})`:`hsl(${h},${s}%,${l}%)`}
var waves=[];
waves.push({n:2,name:'Mirror Bars',build(){var bars=audioBars(12);var h='<div style="display:flex;align-items:center;gap:2px;height:90px;width:100%">';bars.forEach((v,i)=>{var hh=v*45;h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;height:100%;justify-content:center"><div style="width:100%;height:${hh}%;background:${hsl(280+i*5,60,60)};border-radius:3px;animation:barDance ${0.7+i*0.05}s ease infinite;animation-delay:${i*0.03}s"></div><div style="width:100%;height:${hh}%;background:${hsl(280+i*5,60,55,.7)};border-radius:3px;animation:barDance ${0.7+i*0.05}s ease infinite;animation-delay:${i*0.03}s"></div></div>`});h+='</div>';return h}});
waves.push({n:5,name:'Dot Wave',build(){var pts=audioBars(18);var h='<div style="display:flex;align-items:center;gap:4px;height:90px;width:100%">';pts.forEach((v,i)=>{var size=3+v*10;h+=`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${hsl(200+i*15,70,65)};animation:dotPulse ${0.8+i*0.05}s ease infinite;animation-delay:${i*0.06}s;flex-shrink:0;box-shadow:0 0 ${size*2}px ${hsl(200+i*15,70,65,.4)}"></div>`});h+='</div>';return h}});
waves.push({n:10,name:'Particle Wave',build(){var h='<div style="position:relative;width:100%;height:90px">';for(var i=0;i<30;i++){var x=(i/29)*100;h+=`<div style="position:absolute;left:${x}%;bottom:${20+Math.sin(i*0.7)*15}px;width:4px;height:4px;border-radius:50%;background:${hsl(200+i*12,70,70)};animation:dotPulse ${1+i*0.1}s ease infinite;animation-delay:${i*0.06}s;box-shadow:0 0 6px ${hsl(200+i*12,70,70,.5)}"></div>`}h+='</div>';return h}});
waves.push({n:14,name:'Radial Wave',build(){var h='<div style="position:relative;width:100px;height:100px">';for(var i=0;i<48;i++){var angle=(i/48)*360;var len=16+Math.sin(i*0.6)*14;h+=`<div style="position:absolute;left:50%;top:50%;width:2px;height:${len}px;background:${hsl(i*7,70,60)};transform-origin:50% 0;transform:translate(-50%,0) rotate(${angle}deg) translateY(6px);animation:barDance ${0.6+(i%6)*0.1}s ease infinite;animation-delay:${i*0.02}s;border-radius:1px"></div>`}h+='<div style="position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#a78bfa;transform:translate(-50%,-50%);box-shadow:0 0 12px rgba(167,139,250,.5)"></div></div>';return h}});
waves.push({n:15,name:'Waterfall',build(){var h='<div style="position:relative;width:100%;height:90px;overflow:hidden;background:rgba(0,0,0,.2);border-radius:6px">';for(var i=0;i<16;i++){h+=`<div style="position:absolute;left:${i*6.5}%;top:0;width:2px;height:18px;background:${hsl(200+i*10,70,65)};animation:waterfall ${1+i*0.12}s linear infinite;animation-delay:${i*0.08}s;border-radius:1px;box-shadow:0 0 4px ${hsl(200+i*10,70,65,.5)}"></div>`}h+='</div>';return h}});
waves.push({n:19,name:'Bar Code',build(){var widths=[2,6,1,4,8,2,7,1,3,5,2,8,1,4,6,2,3,7,1,5,2,8,1,4];var h='<div style="display:flex;align-items:center;gap:0;height:90px;width:100%">';widths.forEach((w,i)=>{var hue=i%2===0?200:280;h+=`<div style="width:${w}px;height:${50+Math.sin(i*0.5)*30}px;background:${hsl(hue,55,65)};flex-shrink:0;border-radius:0"></div>`});h+='</div>';return h}});
waves.push({n:22,name:'Floating Dots',build(){var h='<div style="position:relative;width:100%;height:90px">';for(var i=0;i<40;i++){var x=5+Math.random()*90;var y=8+Math.random()*70;var s=2+Math.random()*5;h+=`<div style="position:absolute;left:${x}%;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:${hsl(180+Math.random()*180,75,65)};animation:dotPulse ${1+Math.random()*1.5}s ease infinite;animation-delay:${Math.random()}s;box-shadow:0 0 ${s*3}px ${hsl(180+Math.random()*180,75,65,.4)}"></div>`}h+='</div>';return h}});
waves.push({n:29,name:'Fire Bars',build(){var bars=audioBars(14);var h='<div style="display:flex;align-items:flex-end;gap:2px;height:90px;width:100%">';bars.forEach((v,i)=>{h+=`<div style="flex:1;height:${v*100}%;background:linear-gradient(180deg,#fbbf24,#f97316,#ef4444);border-radius:3px 3px 0 0;animation:barDance ${0.5+i*0.06}s ease infinite;animation-delay:${i*0.04}s;box-shadow:0 0 8px rgba(251,191,36,.3)"></div>`});h+='</div>';return h}});
waves.push({n:30,name:'Ice Bars',build(){var bars=audioBars(14);var h='<div style="display:flex;align-items:flex-end;gap:2px;height:90px;width:100%">';bars.forEach((v,i)=>{h+=`<div style="flex:1;height:${v*100}%;background:linear-gradient(180deg,#67e8f9,#22d3ee,#0ea5e9);border-radius:3px 3px 0 0;animation:barDance ${0.5+i*0.06}s ease infinite;animation-delay:${i*0.04}s;box-shadow:0 0 8px rgba(34,211,238,.3)"></div>`});h+='</div>';return h}});
var grid=document.getElementById('waveGrid');waves.forEach((w,i)=>{var card=document.createElement('div');card.className='wave-card';card.style.animationDelay=(i*0.08)+'s';card.innerHTML=`<div class="wave-viz">${w.build()}</div><div class="wave-label">${w.name}</div><div class="wave-num">#${w.n}</div>`;grid.appendChild(card)});
</script></body></html>
