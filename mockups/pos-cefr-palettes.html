<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS/CEFR Accent Modes · Sottotitoli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg:#f0f6f8; --bg2:#ecf2f4; --panel:#fdfefe;
      --line:#d4e6ee;
      --text:#0f1c24; --text-soft:#3d5260; --text-faint:#71899e;
      --cyan:#06b6d4;
      --shadow-sm:0 1px 3px rgba(0,0,0,.04); --shadow-lg:0 12px 32px rgba(0,0,0,.08);
      --font-ui:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
      --font-display:"Manrope",sans-serif;
      --font-mono:"JetBrains Mono",monospace;
      --transition:260ms cubic-bezier(.2,.8,.2,1);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:var(--font-ui);
      background:radial-gradient(circle at top left,rgba(255,255,255,.35),transparent 32%),linear-gradient(180deg,var(--bg),var(--bg2));
      color:var(--text);min-height:100vh;
      transition:background var(--transition),color var(--transition);
    }
    .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:60px;background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .topbar-brand{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--text)}
    .topbar-brand span{color:var(--cyan)}
    .topbar-actions{display:flex;align-items:center;gap:10px}
    .theme-btn{height:34px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-ui);transition:all var(--transition);display:flex;align-items:center;gap:5px}
    .theme-btn:hover{border-color:var(--cyan);color:var(--cyan)}
    .bar{position:sticky;top:60px;z-index:49;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;align-items:center;gap:8px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .bar::-webkit-scrollbar{display:none}
    .bar .st-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-right:8px;flex-shrink:0}
    .chip{font-size:11px;font-weight:600;padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel);color:var(--text-soft);cursor:pointer;font-family:var(--font-ui);transition:all .2s;flex-shrink:0;white-space:nowrap}
    .chip:hover{border-color:var(--cyan);color:var(--cyan)}
    .chip.active{background:var(--cyan);color:#fff;border-color:var(--cyan)}
    .page-wrap{max-width:1300px;margin:0 auto;padding:36px 28px 80px}
    .page-hero{text-align:center;margin-bottom:40px}
    .page-hero h1{font-size:48px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px}
    .page-hero h1 em{font-style:italic;color:var(--cyan)}
    .page-hero p{font-size:15px;color:var(--text-soft);max-width:640px;margin:0 auto;line-height:1.5}
    .section{margin-bottom:40px}
    .section-label{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .section-label h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
    .section-label .badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 12px;border-radius:99px}
    .box-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    @media(max-width:860px){.box-row{grid-template-columns:1fr}.page-hero h1{font-size:32px}}

    /* ═══════════════════════════════════════════
       STYLE 10 POSTER — fixed layout
       ═══════════════════════════════════════════ */
    .box{font-family:var(--font-mono);display:grid;grid-template-columns:1fr 56px;grid-template-rows:1fr;grid-template-areas:"main bar";align-items:stretch;border:3px solid #0f1c24;border-radius:0;padding:0;box-shadow:10px 10px 0 rgba(0,0,0,.2);gap:0;min-height:0;transition:all .3s cubic-bezier(.2,.8,.2,1);background:#fff;position:relative;overflow:hidden}
    .box:hover{transform:translate(-3px,-3px);box-shadow:14px 14px 0 rgba(0,0,0,.28)}
    .pc-word-zone{display:block;background:var(--hdr,#0f1c24);padding:18px 20px 10px}
    .pc-word-zone .pc-ipa{display:block}
    .pc-meta-zone{display:flex;flex-direction:column;padding:16px 24px 20px;gap:6px;flex:auto;min-width:0}
    .pc-meta-zone .pc-ipa{display:none}
    .pc-main-col{grid-area:main;display:flex;flex-direction:column}
    .pc-head{gap:6px;align-items:baseline;overflow:hidden;flex-wrap:nowrap}
    .pc-save-col{grid-area:bar;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--hdr,#0f1c24);padding:14px 0;min-width:56px}
    .pc-save-btn,.pc-bookmark-btn,.pc-close-btn{width:32px;height:32px;border-radius:0;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:var(--font-ui);transition:all .25s cubic-bezier(.34,1.56,.64,1);border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:rgba(255,255,255,.55)}
    .pc-save-btn:hover{background:#059669;border-color:#059669;color:#fff;transform:scale(1.15);box-shadow:0 0 20px rgba(5,150,105,.4)}
    .pc-save-btn.saved{background:#059669;border-color:#059669;color:#fff}
    .pc-bookmark-btn:hover{background:rgba(6,182,212,.25);border-color:var(--cyan);color:var(--cyan);transform:scale(1.15);box-shadow:0 0 16px rgba(6,182,212,.35)}
    .pc-bookmark-btn.bookmarked{background:rgba(245,158,11,.2);border-color:#f59e0b;color:#f59e0b}
    .pc-bookmark-btn.bookmarked i{color:#f59e0b}
    .pc-close-btn:hover{background:#dc2626;border-color:#dc2626;color:#fff;transform:scale(1.15);box-shadow:0 0 20px rgba(220,38,38,.4)}
    .pc-save-btn:active,.pc-bookmark-btn:active,.pc-close-btn:active{transform:scale(.9);transition:all .08s}
    .pc-save-btn i,.pc-bookmark-btn i,.pc-close-btn i{display:flex;align-items:center;justify-content:center}

    .pc-w{font-size:28px;color:var(--hdrtxt,#fff);text-transform:uppercase;letter-spacing:.08em;font-weight:900;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
    .pc-cefr{font-size:12px;padding:2px 6px;border-radius:0;border:2px solid var(--hdrtxt,#fff);color:var(--hdrtxt,#fff);background:transparent;font-weight:700;line-height:1}
    .pc-pos{font-size:12px;color:var(--hdrtxt2,rgba(255,255,255,.5));text-transform:uppercase;font-weight:600}
    .pc-ipa{font-size:12px;color:#06b6d4;margin-bottom:2px}
    .pc-def{font-size:13px;color:#3d5260;line-height:1.5;margin-bottom:0}
    .pc-trans{font-size:14px;color:#06b6d4;font-weight:800;margin-bottom:0;padding-top:6px;border-top:3px solid #0f1c24;display:flex;align-items:baseline;gap:2px;flex-wrap:wrap}
    .pc-trans-chip{font-weight:600;white-space:nowrap}
    .pc-syns{gap:4px;display:flex;flex-wrap:wrap}
    .pc-syns span{font-size:12px;padding:3px 8px;border-radius:0;border:3px solid #06b6d4;font-weight:700;background:transparent;color:#06b6d4;cursor:pointer;transition:all .2s}
    .pc-syns span:hover{background:#06b6d4;color:#fff}
    .pc-syns span.chip-clicked{background:#06b6d4!important;border-color:#06b6d4!important;color:#fff!important}

    .box.expanded{animation:expandIn .35s cubic-bezier(.2,.8,.2,1) both;box-shadow:inset 0 0 0 3px #06b6d4,10px 10px 0 rgba(0,0,0,.2)!important;border-color:#06b6d4!important}
    @keyframes expandIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
    .pc-close-exp{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.3);color:rgba(255,255,255,.5);cursor:pointer;font-size:11px;display:none;align-items:center;justify-content:center;z-index:2;font-family:var(--font-ui);transition:all .15s}
    .pc-close-exp:hover{background:rgba(248,113,113,.25);border-color:rgba(248,113,113,.4);color:#f87171}
    .box.expanded .pc-close-exp{display:flex}

    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @keyframes toastOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(-8px)}}
    .toast-live{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:100px;background:#059669;color:#fff;font-weight:700;font-size:12px;z-index:99999;animation:toastIn .3s ease,toastOut .3s ease 2.2s forwards;pointer-events:none;font-family:var(--font-ui);white-space:nowrap}

    /* ═══════════════════════════════════════════
       15+ COLOUR PALETTES — Light mode POS/CEFR
       Each palette defines --hdr colours per POS & CEFR
       ═══════════════════════════════════════════ */

    /* ── NOACCENT: Ocean dark teal ── */
    [data-accent="none"] .pc-word-zone,[data-accent="none"] .pc-save-col{background:#0c4a6e!important;border-color:#0c4a6e!important}
    [data-accent="none"] .pc-w{color:#fff!important}
    [data-accent="none"] .pc-cefr{color:#fff!important;border-color:#fff!important}
    [data-accent="none"] .pc-pos{color:rgba(255,255,255,.5)!important}
    /* ── POSACCENT: Ocean teal family ── */
    [data-accent="pos"] [data-pos="NOUN"] .pc-word-zone,[data-accent="pos"] [data-pos="NOUN"] .pc-save-col{background:#0c4a6e!important;border-color:#0c4a6e!important}
    [data-accent="pos"] [data-pos="VERB"] .pc-word-zone,[data-accent="pos"] [data-pos="VERB"] .pc-save-col{background:#0f766e!important;border-color:#0f766e!important}
    [data-accent="pos"] [data-pos="ADJ"] .pc-word-zone,[data-accent="pos"] [data-pos="ADJ"] .pc-save-col{background:#0e7490!important;border-color:#0e7490!important}
    [data-accent="pos"] [data-pos="ADV"] .pc-word-zone,[data-accent="pos"] [data-pos="ADV"] .pc-save-col{background:#9d174d!important;border-color:#9d174d!important}
    /* ── CEFRACCENT: emerald greens — A1 lightest → C2 darkest ── */
    [data-accent="cefr"] [data-cefr="A1"] .pc-word-zone,[data-accent="cefr"] [data-cefr="A1"] .pc-save-col{background:#34d399!important;border-color:#34d399!important}
    [data-accent="cefr"] [data-cefr="A1"] .pc-w{color:#0f1c24!important}
    [data-accent="cefr"] [data-cefr="A1"] .pc-cefr{color:#0f1c24!important;border-color:#0f1c24!important}
    [data-accent="cefr"] [data-cefr="A1"] .pc-pos{color:rgba(0,0,0,.5)!important}
    [data-accent="cefr"] [data-cefr="A2"] .pc-word-zone,[data-accent="cefr"] [data-cefr="A2"] .pc-save-col{background:#10b981!important;border-color:#10b981!important}
    [data-accent="cefr"] [data-cefr="A2"] .pc-w{color:#0f1c24!important}
    [data-accent="cefr"] [data-cefr="A2"] .pc-cefr{color:#0f1c24!important;border-color:#0f1c24!important}
    [data-accent="cefr"] [data-cefr="A2"] .pc-pos{color:rgba(0,0,0,.5)!important}
    [data-accent="cefr"] [data-cefr="B1"] .pc-word-zone,[data-accent="cefr"] [data-cefr="B1"] .pc-save-col{background:#059669!important;border-color:#059669!important}
    [data-accent="cefr"] [data-cefr="B2"] .pc-word-zone,[data-accent="cefr"] [data-cefr="B2"] .pc-save-col{background:#047857!important;border-color:#047857!important}
    [data-accent="cefr"] [data-cefr="C1"] .pc-word-zone,[data-accent="cefr"] [data-cefr="C1"] .pc-save-col{background:#064e3b!important;border-color:#064e3b!important}
    [data-accent="cefr"] [data-cefr="C2"] .pc-word-zone,[data-accent="cefr"] [data-cefr="C2"] .pc-save-col{background:#022c22!important;border-color:#022c22!important}

    @media(max-width:860px){.box-row{grid-template-columns:1fr}.page-hero h1{font-size:32px}}
    @media(max-width:860px){.box-row{grid-template-columns:1fr}.page-hero h1{font-size:32px}}
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">sottotitoli<span>.ai</span></div>
    <div class="topbar-actions">
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">
        <i class="fa-regular fa-sun"></i> <span>Tema</span>
      </button>
    </div>
  </header>

  <nav class="bar" id="modeBar" style="top:60px">
    <span class="st-label">MODE</span>
    <button class="chip active" data-m="none">NOACCENT</button>
    <button class="chip" data-m="pos">POSACCENT</button>
    <button class="chip" data-m="cefr">CEFRACCENT</button>
  </nav>

  <div class="page-wrap">
    <header class="page-hero">
      <h1>POS/CEFR <em>Accent Modes</em></h1>
      <p>3 accent modes: NOACCENT (Ocean teal), POSACCENT (Ocean teals by POS), CEFRACCENT (Plum emeralds by CEFR).</p>
    </header>

    <section class="section">
      <div class="section-label"><h2>Pinned</h2><span class="badge" style="background:rgba(124,58,237,.18);color:#7c3aed">Always available</span></div>
      <div class="box-row" id="pinnedRow"></div>
    </section>
    <section class="section">
      <div class="section-label"><h2>Smart</h2><span class="badge" style="background:rgba(6,182,212,.18);color:#0895b0">Suggested</span></div>
      <div class="box-row" id="smartRow"></div>
    </section>
    <section class="section">
      <div class="section-label"><h2>Yours</h2><span class="badge" style="background:rgba(5,150,105,.18);color:#059669">Your collections</span></div>
      <div class="box-row" id="yoursRow"></div>
    </section>

    <footer style="text-align:center;padding:40px 0 20px;color:var(--text-faint);font-size:12px">
      <p>POS/CEFR Accent Modes — Ocean NOACCENT · Ocean POSACCENT · Plum CEFRACCENT</p>
    </footer>
  </div>

  <script>
    function toggleTheme(){
      var html=document.documentElement,body=document.body;
      var cur=html.getAttribute('data-theme'),nxt=cur==='dark'?'light':'dark';
      html.setAttribute('data-theme',nxt);body.setAttribute('data-theme',nxt);
      var btn=document.getElementById('themeToggle');
      var icon=btn.querySelector('i');
      if(nxt==='dark'){icon.className='fa-regular fa-moon';btn.querySelector('span').textContent='Scuro'}
      else{icon.className='fa-regular fa-sun';btn.querySelector('span').textContent='Chiaro'}
      localStorage.setItem('sottotitoli-theme',nxt);
    }
    (function(){
      var s=localStorage.getItem('sottotitoli-theme');
      if(s==='dark'){document.documentElement.setAttribute('data-theme','dark');document.body.setAttribute('data-theme','dark');var btn=document.getElementById('themeToggle');btn.querySelector('i').className='fa-regular fa-moon';btn.querySelector('span').textContent='Scuro'}
    })();

    /* ── MODE toggle ── */
    var modeBar=document.getElementById('modeBar');
    modeBar.addEventListener('click',function(e){
      var chip=e.target.closest('.chip');if(!chip)return;
      var m=chip.getAttribute('data-m');document.body.setAttribute('data-accent',m);
      modeBar.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active')});chip.classList.add('active');
      localStorage.setItem('pcefr-mode',m);
    });
    (function(){
      var saved=localStorage.getItem('pcefr-mode')||'none';document.body.setAttribute('data-accent',saved);
      var chip=modeBar.querySelector('[data-m="'+saved+'"]');
      if(chip){modeBar.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active')});chip.classList.add('active')}
    })();

    function showToast(msg){var t=document.createElement('div');t.className='toast-live';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}

    function toggleSave(btn,word){
      var saved=btn.classList.toggle('saved');
      var toast=btn.parentElement.querySelector('.pc-toast');
      if(saved){
        btn.textContent='✓';
        if(toast){toast.style.opacity='1';setTimeout(function(){toast.style.opacity='0'},2000)}
        showToast('✓ '+word+' saved');
      }else{
        btn.textContent='+';
        if(toast)toast.style.opacity='0';
      }
    }

    /* ── Word data ── */
    var WORD_DICT = {
      growth:{w:'growth',cefr:'B1',pos:'NOUN',ipa:'/ɡroʊθ/',def:'The process of increasing in size or value.',trans:['crescita','sviluppo','aumento','espansione'],syns:['development','expansion','increase','rise']},
      beautiful:{w:'beautiful',cefr:'A1',pos:'ADJ',ipa:'/ˈbjuː.tɪ.fəl/',def:'Pleasing to the senses or mind.',trans:['bello','splendido','magnifico'],syns:['pretty','lovely','gorgeous','stunning']},
      extraordinary:{w:'extraordinary',cefr:'C2',pos:'ADJ',ipa:'/ɪkˈstrɔː.dɪn.ər.i/',def:'Very unusual or remarkable.',trans:['straordinario','eccezionale','incredibile'],syns:['remarkable','exceptional','incredible','amazing']},
      scalable:{w:'scalable',cefr:'C1',pos:'ADJ',ipa:'/ˈskeɪ.lə.bəl/',def:'Able to be changed in size or scale.',trans:['scalabile','espandibile','adattabile'],syns:['expandable','flexible','adaptable','elastic']},
      quickly:{w:'quickly',cefr:'A2',pos:'ADV',ipa:'/ˈkwɪk.li/',def:'At a fast speed; rapidly.',trans:['velocemente','rapidamente','in fretta'],syns:['rapidly','fast','swiftly','speedily']},
      implement:{w:'implement',cefr:'B1',pos:'VERB',ipa:'/ˈɪm.plɪ.ment/',def:'To put a decision or plan into effect.',trans:['implementare','attuare','realizzare','eseguire'],syns:['execute','apply','deploy','enact']},
      strategy:{w:'strategy',cefr:'B2',pos:'NOUN',ipa:'/ˈstræt.ə.dʒi/',def:'A plan of action to achieve a long-term goal.',trans:['strategia','piano','tattica'],syns:['plan','approach','tactic','methodology']},
      happiness:{w:'happiness',cefr:'A2',pos:'NOUN',ipa:'/ˈhæp.i.nəs/',def:'The state of being happy.',trans:['felicità','gioia','contentezza'],syns:['joy','delight','pleasure','bliss']},
      profound:{w:'profound',cefr:'C2',pos:'ADJ',ipa:'/prəˈfaʊnd/',def:'Very great or intense; having deep meaning.',trans:['profondo','intenso','significativo'],syns:['deep','intense','thoughtful','insightful']},
      development:{w:'development',cefr:'B2',pos:'NOUN',ipa:'/dɪˈvel.əp.mənt/',def:'The process of growing or improving.',trans:['sviluppo','crescita','evoluzione'],syns:['growth','progress','advancement','evolution']}
    };

    var pin=[{w:'development',cefr:'B2',pos:'NOUN',ipa:'/dɪˈvel.əp.mənt/',def:'The process of growing or improving.',trans:['sviluppo','crescita','evoluzione'],syns:['growth','progress','advancement','evolution']},{w:'beautiful',cefr:'A1',pos:'ADJ',ipa:'/ˈbjuː.tɪ.fəl/',def:'Pleasing to the senses or mind.',trans:['bello','splendido','magnifico'],syns:['pretty','lovely','gorgeous','stunning']},{w:'extraordinary',cefr:'C2',pos:'ADJ',ipa:'/ɪkˈstrɔː.dɪn.ər.i/',def:'Very unusual or remarkable.',trans:['straordinario','eccezionale','incredibile'],syns:['remarkable','exceptional','incredible','amazing']}];
    var smt=[{w:'scalable',cefr:'C1',pos:'ADJ',ipa:'/ˈskeɪ.lə.bəl/',def:'Able to be changed in size or scale.',trans:['scalabile','espandibile','adattabile'],syns:['expandable','flexible','adaptable','elastic']},{w:'quickly',cefr:'A2',pos:'ADV',ipa:'/ˈkwɪk.li/',def:'At a fast speed; rapidly.',trans:['velocemente','rapidamente','in fretta'],syns:['rapidly','fast','swiftly','speedily']},{w:'implement',cefr:'B1',pos:'VERB',ipa:'/ˈɪm.plɪ.ment/',def:'To put a decision or plan into effect.',trans:['implementare','attuare','realizzare','eseguire'],syns:['execute','apply','deploy','enact']}];
    var yrs=[{w:'strategy',cefr:'B2',pos:'NOUN',ipa:'/ˈstræt.ə.dʒi/',def:'A plan of action to achieve a long-term goal.',trans:['strategia','piano','tattica'],syns:['plan','approach','tactic','methodology']},{w:'happiness',cefr:'A2',pos:'NOUN',ipa:'/ˈhæp.i.nəs/',def:'The state of being happy.',trans:['felicità','gioia','contentezza'],syns:['joy','delight','pleasure','bliss']},{w:'profound',cefr:'C2',pos:'ADJ',ipa:'/prəˈfaʊnd/',def:'Very great or intense; having deep meaning.',trans:['profondo','intenso','significativo'],syns:['deep','intense','thoughtful','insightful']}];

    function buildCard(d,type,isExpanded){
      var transHtml=Array.isArray(d.trans)?d.trans.slice(0,4).map(function(t){return'<span class="pc-trans-chip">'+t+'</span>'}).join(' <span style="color:rgba(0,0,0,.15);font-weight:400">·</span> '):('<span class="pc-trans-chip">'+d.trans+'</span>');
      var h='<article class="box '+type+(isExpanded?' expanded':'')+'" data-pos="'+d.pos+'" data-cefr="'+d.cefr+'">';
      h+='<button class="pc-close-exp" title="Close">×</button>';
      h+='<div class="pc-main-col">';
      h+='<div class="pc-word-zone">';
      h+='<div class="pc-head"><span class="pc-w">'+d.w+'</span><span class="pc-cefr">'+d.cefr+'</span><span class="pc-pos">'+d.pos+'</span></div>';
      h+='<div class="pc-ipa">'+d.ipa+'</div>';
      h+='</div>';
      h+='<div class="pc-meta-zone">';
      h+='<div class="pc-def">'+d.def+'</div>';
      h+='<div class="pc-trans">→ '+transHtml+'</div>';
      h+='<div class="pc-syns">'+d.syns.map(function(s){return'<span data-word="'+s+'" title="Click to explore">'+s+'</span>'}).join('')+'</div>';
      h+='</div>';
      h+='</div>';
      h+='<div class="pc-save-col"><button class="pc-save-btn" data-word="'+d.w+'" title="Save"><i class="fa-solid fa-plus"></i></button><button class="pc-bookmark-btn" title="Bookmark"><i class="fa-regular fa-bookmark"></i></button><button class="pc-close-btn" title="Dismiss"><i class="fa-solid fa-xmark"></i></button></div>';
      h+='</article>';
      return h;
    }

    function renderAllBoxes(){
      document.getElementById('pinnedRow').innerHTML=pin.map(function(d){return buildCard(d,'pin')}).join('');
      document.getElementById('smartRow').innerHTML=smt.map(function(d){return buildCard(d,'smt')}).join('');
      document.getElementById('yoursRow').innerHTML=yrs.map(function(d){return buildCard(d,'yrs')}).join('');
    }
    renderAllBoxes();

    /* ── Chip clicks expand ── */
    document.addEventListener('click',function(e){
      var chip=e.target.closest('.pc-syns span[data-word]');
      if(!chip)return;e.stopPropagation();
      var word=chip.getAttribute('data-word');
      var d=WORD_DICT[word];
      if(!d){showToast('No data for "'+word+'"');return}
      var box=chip.closest('.box');if(!box)return;
      var dup=false;var sib=box.nextElementSibling;
      while(sib){if(sib.classList.contains('expanded')&&sib.querySelector('.pc-w')&&sib.querySelector('.pc-w').textContent===word){dup=true;break}sib=sib.nextElementSibling}
      if(dup)return;
      var type=box.classList.contains('pin')?'pin':box.classList.contains('smt')?'smt':'yrs';
      var html=buildCard(d,type,true);
      var temp=document.createElement('div');temp.innerHTML=html;var newBox=temp.firstChild;
      box.insertAdjacentElement('afterend',newBox);
      newBox.scrollIntoView({behavior:'smooth',block:'nearest'});
    });

    /* ── Save ── */
    document.addEventListener('click',function(e){
      var btn=e.target.closest('.pc-save-btn');
      if(!btn)return;e.stopPropagation();
      toggleSave(btn,btn.getAttribute('data-word')||'');
    });

    /* ── Bookmark ── */
    document.addEventListener('click',function(e){
      var btn=e.target.closest('.pc-bookmark-btn');
      if(!btn)return;e.stopPropagation();
      var toggled=btn.classList.toggle('bookmarked');
      var icon=btn.querySelector('i');
      if(toggled){if(icon)icon.className='fa-solid fa-bookmark';showToast('🔖 Bookmarked')}
      else{if(icon)icon.className='fa-regular fa-bookmark';showToast('🔖 Removed')}
    });

    /* ── Close ── */
    document.addEventListener('click',function(e){
      var btn=e.target.closest('.pc-close-btn');
      if(!btn)return;e.stopPropagation();
      var box=btn.closest('.box');
      if(box){box.style.opacity='0';box.style.transform='scale(.95)';box.style.transition='all .2s';setTimeout(function(){box.remove()},200)}
    });

    /* ── Close expanded ── */
    document.addEventListener('click',function(e){
      var btn=e.target.closest('.pc-close-exp');
      if(!btn)return;e.stopPropagation();
      var box=btn.closest('.box.expanded');
      if(box){box.style.opacity='0';box.style.transform='scale(.95)';box.style.transition='all .2s';setTimeout(function(){box.remove()},200)}
    });
  </script>
</body>
</html>
