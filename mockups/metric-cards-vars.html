<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-snap-type:y mandatory;overflow-y:scroll}
body{background:#0a0c10;color:#fff;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}

.sec{position:relative;width:100vw;height:100vh;scroll-snap-align:start;overflow:hidden;
  background:url('../img/bg-home.png') center/cover no-repeat;background-attachment:fixed}
.sec::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.48);z-index:0}
.sec::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.45) 100%)}
.sec-inner{position:relative;z-index:2;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:clamp(40px,8vh,80px) clamp(20px,3vw,40px)}

.panel{max-width:680px;width:100%;display:flex;gap:10px;justify-content:center}
.panel>div{flex:0 0 auto!important;min-width:0}

.label{position:absolute;bottom:24px;right:32px;z-index:10;font-size:12px;font-weight:600;color:rgba(255,255,255,.25);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);border-radius:100px;padding:6px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .25s}
.dot:hover,.dot.active{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.4);transform:scale(1.4)}
</style>

const dotsEl=document.getElementById('dots');
vars.forEach((v,i)=>{
  const sec=document.createElement('div');sec.className='sec';sec.id='v'+v.n;
  sec.innerHTML='<div class="sec-inner">'+v.html+'</div><div class="label">#'+v.n+' '+v.label+'</div>';
  document.body.appendChild(sec);
  const dot=document.createElement('div');dot.className='dot';dot.title='#'+v.n+' '+v.label;
  dot.addEventListener('click',()=>{document.getElementById('v'+v.n).scrollIntoView({behavior:'smooth'});});
  dotsEl.appendChild(dot);
});
const dots=document.querySelectorAll('.dot');
function updateActive(){
  const sections=document.querySelectorAll('.sec');let active=0;
  sections.forEach((s,i)=>{const r=s.getBoundingClientRect();if(r.top<window.innerHeight*.5&&r.bottom>window.innerHeight*.5)active=i;});
  dots.forEach((d,i)=>d.classList.toggle('active',i===active));
}
window.addEventListener('scroll',updateActive,{passive:true});updateActive();
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();
    const sections=document.querySelectorAll('.sec');let active=0;
    sections.forEach((s,i)=>{const r=s.getBoundingClientRect();if(r.top<window.innerHeight*.5&&r.bottom>window.innerHeight*.5)active=i;});
    const next=e.key==='ArrowDown'?Math.min(active+1,sections.length-1):Math.max(active-1,0);
    sections[next].scrollIntoView({behavior:'smooth'});
  }
});
</script>
