<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Split Screen Slider · Recreation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;overflow:hidden;height:100vh;background:#0a0a0a}

.slider{position:relative;width:100%;height:100vh}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:2fr 1fr;pointer-events:none;z-index:0}
@media(max-width:768px){.slide{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.slide.active{z-index:2;pointer-events:auto}

/* ── Text side ── */
.text-side{display:flex;align-items:center;justify-content:center;padding:80px 60px;position:relative;z-index:2}
@media(max-width:768px){.text-side{padding:40px 28px;text-align:center}}
.text-side.s0{background:#121826}.text-side.s1{background:#0f1828}.text-side.s2{background:#151220}.text-side.s3{background:#101014}
.text-inner{max-width:520px;width:100%}
.slide-tag{font-size:14px;font-weight:400;color:rgba(255,255,255,.7);margin-bottom:12px;letter-spacing:.02em;opacity:0;transform:translateY(20px);transition:opacity .6s ease .1s,transform .6s ease .1s}
.slide-h2{font-size:clamp(36px,5.5vw,60px);font-weight:800;line-height:1.15;letter-spacing:-2.5px;color:#fff;margin-bottom:28px;opacity:0;transform:translateY(20px);transition:opacity .6s ease .2s,transform .6s ease .2s}
.slide-cta{display:inline-block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#fff;cursor:pointer;position:relative;padding-bottom:6px;opacity:0;transform:translateY(20px);transition:opacity .6s ease .3s,transform .6s ease .3s}
.slide-cta::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:#fff;transition:width .4s ease}
.slide-cta:hover::after{width:100%}
.active .slide-tag,.active .slide-h2,.active .slide-cta{opacity:1;transform:translateY(0)}

/* ── Image side ── */
.img-side{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.img-composition{position:relative;width:100%;height:100%}
.shape{position:absolute;border-radius:50%;transition:transform .8s cubic-bezier(.25,.1,.25,1),opacity .8s ease}
.slide:not(.active) .shape{opacity:.3}
.active .shape{opacity:1}

/* Slide 0 shapes — teal/blue theme */
.s0 .img-side{background:linear-gradient(160deg,#0d7377 0%,#14a3a8 30%,#0e8b90 60%,#095055 100%)}
.s0 .sh-a{width:220px;height:220px;top:8%;right:15%;background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.15)}
.s0 .sh-b{width:140px;height:140px;bottom:20%;left:12%;background:rgba(255,255,255,.08);backdrop-filter:blur(4px)}
.s0 .sh-c{width:100px;height:100px;top:45%;right:40%;background:rgba(32,211,238,.4);border-radius:30% 70% 50% 50%}
.s0 .sh-d{width:180px;height:180px;bottom:8%;right:8%;background:rgba(20,163,168,.3);border-radius:60% 40% 55% 45%;border:1.5px solid rgba(255,255,255,.12)}
.active.s0 .sh-a{transform:translate(-10px,-15px)}
.active.s0 .sh-b{transform:translate(15px,10px)}
.active.s0 .sh-c{transform:translate(-8px,20px) rotate(15deg)}
.active.s0 .sh-d{transform:translate(10px,-8px) rotate(-10deg)}

/* Slide 1 shapes — deep blue/purple theme */
.s1 .img-side{background:linear-gradient(160deg,#1a1040 0%,#2d1b69 30%,#1e3a6e 60%,#0f1a30 100%)}
.s1 .sh-a{width:200px;height:200px;top:12%;right:20%;background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(139,92,246,.08));border:1px solid rgba(255,255,255,.1);border-radius:40% 60% 55% 45%}
.s1 .sh-b{width:160px;height:160px;bottom:15%;left:18%;background:rgba(99,102,241,.25);border-radius:30% 70% 70% 30%}
.s1 .sh-c{width:110px;height:110px;top:50%;right:35%;background:rgba(167,139,250,.35);border-radius:50%}
.s1 .sh-d{width:130px;height:130px;bottom:25%;right:10%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.08)}
.active.s1 .sh-a{transform:translate(12px,-20px) rotate(8deg)}
.active.s1 .sh-b{transform:translate(-12px,8px)}
.active.s1 .sh-c{transform:translate(10px,15px) scale(1.1)}
.active.s1 .sh-d{transform:translate(-15px,-5px)}

/* Slide 2 shapes — amber/orange theme */
.s2 .img-side{background:linear-gradient(160deg,#7c2d12 0%,#9a3412 30%,#c2410c 60%,#431407 100%)}
.s2 .sh-a{width:240px;height:240px;top:5%;right:10%;background:linear-gradient(135deg,rgba(251,191,36,.25),rgba(251,146,60,.1));border:1px solid rgba(255,255,255,.12)}
.s2 .sh-b{width:150px;height:150px;bottom:12%;left:15%;background:rgba(253,230,138,.2);border-radius:40% 60% 45% 55%}
.s2 .sh-c{width:90px;height:90px;top:40%;right:45%;background:rgba(254,215,170,.3);border-radius:60% 40% 50% 50%}
.s2 .sh-d{width:170px;height:170px;bottom:30%;right:8%;background:rgba(251,146,60,.25);border-radius:50%}
.active.s2 .sh-a{transform:translate(-15px,10px)}
.active.s2 .sh-b{transform:translate(18px,-12px) rotate(-5deg)}
.active.s2 .sh-c{transform:translate(-5px,-18px)}
.active.s2 .sh-d{transform:translate(8px,12px) scale(1.08)}

/* Slide 3 shapes — multicolor pop theme */
.s3 .img-side{background:linear-gradient(160deg,#1e1940 0%,#2d2050 30%,#1a2a50 60%,#0a1020 100%)}
.s3 .sh-a{width:180px;height:180px;top:10%;right:18%;background:rgba(244,114,182,.3);border-radius:50%}
.s3 .sh-b{width:130px;height:130px;bottom:18%;left:20%;background:rgba(56,189,248,.25);border-radius:35% 65% 60% 40%}
.s3 .sh-c{width:100px;height:100px;top:55%;right:30%;background:rgba(251,191,36,.3);border-radius:55% 45% 50% 50%}
.s3 .sh-d{width:150px;height:150px;bottom:8%;right:5%;background:rgba(52,211,153,.2);border:1.5px solid rgba(255,255,255,.08);border-radius:40% 60% 55% 45%}
.active.s3 .sh-a{transform:translate(-12px,15px)}
.active.s3 .sh-b{transform:translate(10px,-10px) rotate(12deg)}
.active.s3 .sh-c{transform:translate(8px,-15px)}
.active.s3 .sh-d{transform:translate(-8px,8px) scale(1.05)}

/* ── Nav arrows ── */
.nav-arrows{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:8px}
@media(max-width:768px){.nav-arrows{right:12px;gap:4px}}
.nav-arrow{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;transition:all .3s ease;background:transparent;font-family:inherit}
.nav-arrow:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.08)}

/* ── Bottom nav ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:40px;padding:28px 20px}
.bottom-nav a{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.45);text-decoration:none;transition:color .3s}
.bottom-nav a:hover{color:#fff}
.bottom-nav .nav-center{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:3px}
@media(max-width:768px){.bottom-nav{gap:24px;padding:20px}.bottom-nav a{font-size:10px;letter-spacing:1.5px}}

/* ── Transition ── */
.slide.mask-out{animation:maskOut .65s cubic-bezier(.55,0,.12,1) forwards;z-index:3}
.slide.mask-in{animation:maskIn .65s cubic-bezier(.55,0,.12,1) forwards;z-index:4}
@keyframes maskOut{from{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}to{clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%)}}
@keyframes maskIn{from{clip-path:polygon(0 0,100% 0,100% 0,0 0)}to{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}
</style>
</head>
<body>

<div class="slider" id="slider">
  <!-- Slide 0 -->
  <div class="slide s0 active" data-idx="0">
    <div class="text-side s0">
      <div class="text-inner">
        <div class="slide-tag">Daring to Dream</div>
        <h2 class="slide-h2">Where Passions Ignite and Soar</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="img-composition">
        <div class="shape sh-a"></div><div class="shape sh-b"></div>
        <div class="shape sh-c"></div><div class="shape sh-d"></div>
      </div>
    </div>
  </div>

  <!-- Slide 1 -->
  <div class="slide s1" data-idx="1">
    <div class="text-side s1">
      <div class="text-inner">
        <div class="slide-tag">Vibrant Wanderlust</div>
        <h2 class="slide-h2">Whispers of Freedom</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="img-composition">
        <div class="shape sh-a"></div><div class="shape sh-b"></div>
        <div class="shape sh-c"></div><div class="shape sh-d"></div>
      </div>
    </div>
  </div>

  <!-- Slide 2 -->
  <div class="slide s2" data-idx="2">
    <div class="text-side s2">
      <div class="text-inner">
        <div class="slide-tag">A Journey of Creative Wonder</div>
        <h2 class="slide-h2">Beyond Boundaries, Skies Ablaze</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="img-composition">
        <div class="shape sh-a"></div><div class="shape sh-b"></div>
        <div class="shape sh-c"></div><div class="shape sh-d"></div>
      </div>
    </div>
  </div>

  <!-- Slide 3 -->
  <div class="slide s3" data-idx="3">
    <div class="text-side s3">
      <div class="text-inner">
        <div class="slide-tag">Beyond the Canvas</div>
        <h2 class="slide-h2">Colors of Urban Expression</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="img-composition">
        <div class="shape sh-a"></div><div class="shape sh-b"></div>
        <div class="shape sh-c"></div><div class="shape sh-d"></div>
      </div>
    </div>
  </div>
</div>

<div class="nav-arrows">
  <button class="nav-arrow" id="prevBtn">▲</button>
  <button class="nav-arrow" id="nextBtn">▼</button>
</div>

<div class="bottom-nav">
  <a href="#">contact</a>
  <span class="nav-center">50/50</span>
  <a href="#">about</a>
</div>

<script>
var slides=document.querySelectorAll('.slide'),total=slides.length,current=0,transitioning=false;

function goTo(idx,dir){
  if(transitioning||idx===current||idx<0||idx>=total)return;transitioning=true;
  var old=slides[current],neu=slides[idx];

  old.classList.add('mask-out');old.classList.remove('active');
  neu.classList.add('mask-in','active');

  setTimeout(function(){
    old.classList.remove('mask-out');
    neu.classList.remove('mask-in');
    slides.forEach(function(s,i){if(i!==current&&i!==idx)s.classList.remove('active','mask-in','mask-out')});
    current=idx;transitioning=false;
  },700);
}

document.getElementById('prevBtn').addEventListener('click',function(){goTo(current>0?current-1:total-1,-1)});
document.getElementById('nextBtn').addEventListener('click',function(){goTo(current<total-1?current+1:0,1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowDown'||e.key==='ArrowRight')goTo(current<total-1?current+1:0,1);if(e.key==='ArrowUp'||e.key==='ArrowLeft')goTo(current>0?current-1:total-1,-1)});
var ta=0;document.addEventListener('wheel',function(e){ta+=e.deltaY;if(Math.abs(ta)>80){if(ta>0)goTo(current<total-1?current+1:0,1);else goTo(current>0?current-1:total-1,-1);ta=0}},{passive:true});
</script>
</body>
</html>
