<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Split Screen Slider · Exact Recreation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;overflow:hidden;height:100vh;background:#000}

.slider{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:66.667fr 33.333fr;pointer-events:none;z-index:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
@media(max-width:768px){.slide{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.slide.active{z-index:2;pointer-events:auto}

/* ── Text side ── */
.text-side{display:flex;align-items:center;padding-left:clamp(40px,8vw,10%);position:relative;z-index:2}
@media(max-width:768px){.text-side{padding:40px 28px;justify-content:center;text-align:center}}
.slide.s0 .text-side{background:#121826}.slide.s1 .text-side{background:#0f1828}
.slide.s2 .text-side{background:#1a1210}.slide.s3 .text-side{background:#101014}
.text-inner{max-width:520px;width:100%}
.slide-tag{font-size:14px;font-weight:400;color:rgba(255,255,255,.65);margin-bottom:10px;letter-spacing:.02em;opacity:0;transform:translateY(16px);transition:opacity .55s ease .05s,transform .55s ease .05s}
.slide-h2{font-size:50px;font-weight:800;line-height:1.15;letter-spacing:-2.5px;color:#fff;margin-bottom:24px;opacity:0;transform:translateY(16px);transition:opacity .55s ease .15s,transform .55s ease .15s}
.slide-cta{display:inline-block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.87px;color:#fff;cursor:pointer;position:relative;padding-bottom:6px;text-decoration:none;opacity:0;transform:translateY(16px);transition:opacity .55s ease .25s,transform .55s ease .25s}
.slide-cta::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1.5px;background:#fff;transition:width .35s ease}
.slide-cta:hover::after{width:100%}
.active .slide-tag,.active .slide-h2,.active .slide-cta{opacity:1;transform:translateY(0)}

/* ── Image side ── */
.img-side{position:relative;overflow:hidden}
.img-side canvas,.img-side .bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* Slide 0 — Teal composition */
.s0 .img-side{background:linear-gradient(160deg,#095b60 0%,#0e7a80 25%,#0d7277 50%,#084b50 100%)}
.s0 .sh{position:absolute;border-radius:50%}
.s0 .sh-1{width:230px;height:230px;top:6%;right:12%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.22),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.12)}
.s0 .sh-2{width:150px;height:150px;bottom:18%;left:14%;background:rgba(255,255,255,.06);backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.08)}
.s0 .sh-3{width:105px;height:105px;top:42%;right:38%;background:rgba(32,211,238,.45);border-radius:32% 68% 48% 52%}
.s0 .sh-4{width:190px;height:190px;bottom:6%;right:6%;background:rgba(20,170,175,.35);border-radius:58% 42% 52% 48%;border:1.5px solid rgba(255,255,255,.1)}
.s0 .sh-5{width:80px;height:80px;top:22%;left:8%;background:rgba(78,205,196,.2);border-radius:44% 56% 60% 40%}

/* Slide 1 — Blue/purple composition */
.s1 .img-side{background:linear-gradient(160deg,#1a1040 0%,#2d1b69 25%,#1e2d5e 50%,#0f1a30 100%)}
.s1 .sh{position:absolute;border-radius:50%}
.s1 .sh-1{width:210px;height:210px;top:8%;right:16%;background:radial-gradient(circle at 40% 40%,rgba(139,92,246,.25),rgba(139,92,246,.05));border:1.5px solid rgba(255,255,255,.08);border-radius:42% 58% 54% 46%}
.s1 .sh-2{width:165px;height:165px;bottom:14%;left:16%;background:rgba(99,102,241,.22);border-radius:34% 66% 68% 32%}
.s1 .sh-3{width:115px;height:115px;top:48%;right:34%;background:rgba(167,139,250,.32)}
.s1 .sh-4{width:140px;height:140px;bottom:22%;right:8%;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.07);border-radius:50%}
.s1 .sh-5{width:90px;height:90px;top:18%;left:10%;background:rgba(245,158,11,.18);border-radius:40% 60% 55% 45%}

/* Slide 2 — Amber/orange composition */
.s2 .img-side{background:linear-gradient(160deg,#7c2d12 0%,#9a3412 25%,#c2410c 50%,#431407 100%)}
.s2 .sh{position:absolute;border-radius:50%}
.s2 .sh-1{width:240px;height:240px;top:4%;right:10%;background:radial-gradient(circle at 40% 40%,rgba(251,191,36,.22),rgba(251,146,60,.06));border:1.5px solid rgba(255,255,255,.1)}
.s2 .sh-2{width:155px;height:155px;bottom:10%;left:14%;background:rgba(253,230,138,.18);border-radius:38% 62% 48% 52%}
.s2 .sh-3{width:95px;height:95px;top:38%;right:42%;background:rgba(254,215,170,.28);border-radius:56% 44% 50% 50%}
.s2 .sh-4{width:175px;height:175px;bottom:28%;right:6%;background:rgba(251,146,60,.22)}
.s2 .sh-5{width:70px;height:70px;top:55%;left:20%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06)}

/* Slide 3 — Multicolor pop composition */
.s3 .img-side{background:linear-gradient(160deg,#1e1940 0%,#2d2050 25%,#1a2a50 50%,#0a1020 100%)}
.s3 .sh{position:absolute;border-radius:50%}
.s3 .sh-1{width:185px;height:185px;top:8%;right:15%;background:rgba(244,114,182,.28)}
.s3 .sh-2{width:135px;height:135px;bottom:15%;left:18%;background:rgba(56,189,248,.22);border-radius:36% 64% 58% 42%}
.s3 .sh-3{width:105px;height:105px;top:52%;right:28%;background:rgba(251,191,36,.28);border-radius:54% 46% 48% 52%}
.s3 .sh-4{width:155px;height:155px;bottom:6%;right:4%;background:rgba(52,211,153,.18);border:1.5px solid rgba(255,255,255,.07);border-radius:42% 58% 54% 46%}
.s3 .sh-5{width:80px;height:80px;top:25%;left:8%;background:rgba(232,121,249,.2);border-radius:48% 52% 44% 56%}

/* ── Shape animations ── */
.sh{transition:transform .9s cubic-bezier(.25,.1,.25,1)}
.slide:not(.active) .sh{opacity:.35}
.active.s0 .sh-1{transform:translate(-12px,-18px)}.active.s0 .sh-2{transform:translate(18px,12px)}
.active.s0 .sh-3{transform:translate(-8px,22px) rotate(15deg)}.active.s0 .sh-4{transform:translate(12px,-10px) rotate(-8deg)}
.active.s0 .sh-5{transform:translate(20px,-6px)}
.active.s1 .sh-1{transform:translate(14px,-22px) rotate(10deg)}.active.s1 .sh-2{transform:translate(-15px,10px)}
.active.s1 .sh-3{transform:translate(10px,16px) scale(1.1)}.active.s1 .sh-4{transform:translate(-12px,-6px)}
.active.s1 .sh-5{transform:translate(18px,8px)}
.active.s2 .sh-1{transform:translate(-16px,12px)}.active.s2 .sh-2{transform:translate(20px,-14px) rotate(-6deg)}
.active.s2 .sh-3{transform:translate(-6px,-20px)}.active.s2 .sh-4{transform:translate(10px,14px) scale(1.08)}
.active.s2 .sh-5{transform:translate(-18px,5px)}
.active.s3 .sh-1{transform:translate(-14px,16px)}.active.s3 .sh-2{transform:translate(12px,-12px) rotate(14deg)}
.active.s3 .sh-3{transform:translate(10px,-18px)}.active.s3 .sh-4{transform:translate(-10px,10px) scale(1.06)}
.active.s3 .sh-5{transform:translate(16px,12px)}

/* ── Nav arrows ── */
.nav-arrows{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:8px}
@media(max-width:768px){.nav-arrows{right:12px}}
.nav-arrow{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.65);font-size:14px;cursor:pointer;transition:all .25s ease;background:transparent;font-family:inherit;line-height:1}
.nav-arrow:hover{border-color:rgba(255,255,255,.6);color:#fff;background:rgba(255,255,255,.06)}

/* ── Bottom nav ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:44px;padding:26px 20px}
.bottom-nav a{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:2.5px;color:rgba(255,255,255,.4);text-decoration:none;transition:color .3s}
.bottom-nav a:hover{color:rgba(255,255,255,.8)}
.bottom-nav .nav-center{font-size:12px;font-weight:700;color:rgba(255,255,255,.65);letter-spacing:3px}
@media(max-width:768px){.bottom-nav{gap:24px;padding:20px 12px}.bottom-nav a{font-size:10px;letter-spacing:1.5px}}

/* ── Mask transition ── */
.slide.mask-out{animation:maskOut .62s cubic-bezier(.55,0,.12,1) forwards;z-index:3}
.slide.mask-in{animation:maskIn .62s cubic-bezier(.55,0,.12,1) forwards;z-index:4}
@keyframes maskOut{from{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}to{clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%)}}
@keyframes maskIn{from{clip-path:polygon(0 0,100% 0,100% 0,0 0)}to{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}
</style>
</head>
<body>

<div class="slider" id="slider">
  <div class="slide s0 active" data-idx="0">
    <div class="text-side">
      <div class="text-inner">
        <div class="slide-tag">Daring to Dream</div>
        <h2 class="slide-h2">Where Passions Ignite and Soar</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="sh sh-1"></div><div class="sh sh-2"></div><div class="sh sh-3"></div>
      <div class="sh sh-4"></div><div class="sh sh-5"></div>
    </div>
  </div>
  <div class="slide s1" data-idx="1">
    <div class="text-side">
      <div class="text-inner">
        <div class="slide-tag">Vibrant Wanderlust</div>
        <h2 class="slide-h2">Whispers of Freedom</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="sh sh-1"></div><div class="sh sh-2"></div><div class="sh sh-3"></div>
      <div class="sh sh-4"></div><div class="sh sh-5"></div>
    </div>
  </div>
  <div class="slide s2" data-idx="2">
    <div class="text-side">
      <div class="text-inner">
        <div class="slide-tag">A Journey of Creative Wonder</div>
        <h2 class="slide-h2">Beyond Boundaries, Skies Ablaze</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="sh sh-1"></div><div class="sh sh-2"></div><div class="sh sh-3"></div>
      <div class="sh sh-4"></div><div class="sh sh-5"></div>
    </div>
  </div>
  <div class="slide s3" data-idx="3">
    <div class="text-side">
      <div class="text-inner">
        <div class="slide-tag">Beyond the Canvas</div>
        <h2 class="slide-h2">Colors of Urban Expression</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="sh sh-1"></div><div class="sh sh-2"></div><div class="sh sh-3"></div>
      <div class="sh sh-4"></div><div class="sh sh-5"></div>
    </div>
  </div>
</div>

<div class="nav-arrows">
  <button class="nav-arrow" id="prevBtn">▲</button>
  <button class="nav-arrow" id="nextBtn">▼</button>
</div>

<div class="bottom-nav">
  <a href="#">contact</a>
  <span class="nav-center">50/50</span>
  <a href="#">about</a>
</div>

<script>
var slides=document.querySelectorAll('.slide'),total=slides.length,current=0,transitioning=false;
function goTo(idx,dir){
  if(transitioning||idx===current||idx<0||idx>=total)return;transitioning=true;
  var old=slides[current],neu=slides[idx];
  old.classList.add('mask-out');old.classList.remove('active');
  neu.classList.add('mask-in','active');
  setTimeout(function(){
    old.classList.remove('mask-out');neu.classList.remove('mask-in');
    slides.forEach(function(s,i){if(i!==current&&i!==idx)s.classList.remove('active','mask-in','mask-out')});
    current=idx;transitioning=false;
  },680);
}
document.getElementById('prevBtn').addEventListener('click',function(){goTo(current>0?current-1:total-1,-1)});
document.getElementById('nextBtn').addEventListener('click',function(){goTo(current<total-1?current+1:0,1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowDown'||e.key==='ArrowRight')goTo(current<total-1?current+1:0,1);if(e.key==='ArrowUp'||e.key==='ArrowLeft')goTo(current>0?current-1:total-1,-1)});
var ta=0;document.addEventListener('wheel',function(e){ta+=e.deltaY;if(Math.abs(ta)>70){if(ta>0)goTo(current<total-1?current+1:0,1);else goTo(current>0?current-1:total-1,-1);ta=0}},{passive:true});
</script>
</body>
</html>
