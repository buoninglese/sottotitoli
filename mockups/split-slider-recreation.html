<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Split Screen Slider · Exact Recreation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;overflow:hidden;height:100vh;background:#000}

.slider{position:fixed;inset:0}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:66.667fr 33.333fr;pointer-events:none;z-index:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
@media(max-width:768px){.slide{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.slide.active{z-index:2;pointer-events:auto}

/* ── Text side ── */
.text-side{display:flex;align-items:center;padding-left:clamp(40px,8vw,10%);position:relative;z-index:2}
@media(max-width:768px){.text-side{padding:40px 28px;justify-content:center;text-align:center}}
.slide.s0 .text-side{background:#121826}.slide.s1 .text-side{background:#0f1828}
.slide.s2 .text-side{background:#1a1210}.slide.s3 .text-side{background:#101014}
.text-inner{max-width:520px;width:100%}
.slide-tag{font-size:14px;font-weight:400;color:rgba(255,255,255,.65);margin-bottom:10px;letter-spacing:.02em;opacity:0;transform:translateY(16px);transition:opacity .55s ease .05s,transform .55s ease .05s}
.slide-h2{font-size:50px;font-weight:800;line-height:1.15;letter-spacing:-2.5px;color:#fff;margin-bottom:24px;opacity:0;transform:translateY(16px);transition:opacity .55s ease .15s,transform .55s ease .15s}
.slide-cta{display:inline-block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.87px;color:#fff;cursor:pointer;position:relative;padding-bottom:6px;text-decoration:none;opacity:0;transform:translateY(16px);transition:opacity .55s ease .25s,transform .55s ease .25s}
.slide-cta::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1.5px;background:#fff;transition:width .35s ease}
.slide-cta:hover::after{width:100%}
.active .slide-tag,.active .slide-h2,.active .slide-cta{opacity:1;transform:translateY(0)}

/* ── Image side — Polaroid gallery ── */
.img-side{position:relative;overflow:hidden;background:#1a1d24;display:flex;align-items:center;justify-content:center}
.polaroid{position:absolute;background:#fff;padding:8px 8px 32px;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.35);transition:transform .9s cubic-bezier(.25,.1,.25,1)}
.polaroid img{display:block;width:100%;height:100%;object-fit:cover;border-radius:2px}
.slide:not(.active) .polaroid{opacity:.5}

/* Slide 0 — Voice/mic theme */
.s0 .img-side{background:linear-gradient(160deg,#0d2137 0%,#153048 40%,#0f2840 100%)}
.s0 .p1{width:195px;height:240px;top:14%;right:18%;transform:rotate(-3deg);z-index:3}
.s0 .p2{width:160px;height:200px;bottom:12%;left:14%;transform:rotate(2deg);z-index:2}
.s0 .p3{width:140px;height:175px;top:48%;right:40%;transform:rotate(5deg);z-index:1}
.active.s0 .p1{transform:rotate(-2deg) translate(-8px,-12px)}
.active.s0 .p2{transform:rotate(3deg) translate(12px,8px)}
.active.s0 .p3{transform:rotate(4deg) translate(-5px,10px)}

/* Slide 1 — Caption/studio theme */
.s1 .img-side{background:linear-gradient(160deg,#1a1228 0%,#241a38 40%,#1a1830 100%)}
.s1 .p1{width:200px;height:250px;top:10%;right:14%;transform:rotate(2deg);z-index:3}
.s1 .p2{width:170px;height:210px;bottom:10%;left:12%;transform:rotate(-4deg);z-index:2}
.s1 .p3{width:145px;height:180px;top:44%;right:36%;transform:rotate(-1deg);z-index:1}
.active.s1 .p1{transform:rotate(1deg) translate(10px,-15px)}
.active.s1 .p2{transform:rotate(-3deg) translate(-14px,6px)}
.active.s1 .p3{transform:rotate(-2deg) translate(8px,14px)}

/* Slide 2 — Language/translation theme */
.s2 .img-side{background:linear-gradient(160deg,#1a1410 0%,#241c14 40%,#1a1612 100%)}
.s2 .p1{width:210px;height:255px;top:8%;right:12%;transform:rotate(-2deg);z-index:3}
.s2 .p2{width:165px;height:205px;bottom:14%;left:16%;transform:rotate(3deg);z-index:2}
.s2 .p3{width:150px;height:185px;top:42%;right:38%;transform:rotate(-5deg);z-index:1}
.active.s2 .p1{transform:rotate(-1deg) translate(-10px,10px)}
.active.s2 .p2{transform:rotate(4deg) translate(16px,-10px)}
.active.s2 .p3{transform:rotate(-4deg) translate(-8px,-16px)}

/* Slide 3 — Connection/communication theme */
.s3 .img-side{background:linear-gradient(160deg,#121820 0%,#1a2430 40%,#141c28 100%)}
.s3 .p1{width:190px;height:240px;top:12%;right:16%;transform:rotate(4deg);z-index:3}
.s3 .p2{width:175px;height:215px;bottom:8%;left:10%;transform:rotate(-3deg);z-index:2}
.s3 .p3{width:140px;height:175px;top:46%;right:34%;transform:rotate(1deg);z-index:1}
.active.s3 .p1{transform:rotate(3deg) translate(-12px,-14px)}
.active.s3 .p2{transform:rotate(-2deg) translate(10px,12px)}
.active.s3 .p3{transform:rotate(0deg) translate(-6px,8px)}

/* ── Nav arrows ── */
.nav-arrows{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;gap:8px}
@media(max-width:768px){.nav-arrows{right:12px}}
.nav-arrow{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.65);font-size:14px;cursor:pointer;transition:all .25s ease;background:transparent;font-family:inherit;line-height:1}
.nav-arrow:hover{border-color:rgba(255,255,255,.6);color:#fff;background:rgba(255,255,255,.06)}

/* ── Bottom nav ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:44px;padding:26px 20px}
.bottom-nav a{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:2.5px;color:rgba(255,255,255,.4);text-decoration:none;transition:color .3s}
.bottom-nav a:hover{color:rgba(255,255,255,.8)}
.bottom-nav .nav-center{font-size:12px;font-weight:700;color:rgba(255,255,255,.65);letter-spacing:3px}
@media(max-width:768px){.bottom-nav{gap:24px;padding:20px 12px}.bottom-nav a{font-size:10px;letter-spacing:1.5px}}

/* ── Mask transition ── */
.slide.mask-out{animation:maskOut .62s cubic-bezier(.55,0,.12,1) forwards;z-index:3}
.slide.mask-in{animation:maskIn .62s cubic-bezier(.55,0,.12,1) forwards;z-index:4}
@keyframes maskOut{from{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}to{clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%)}}
@keyframes maskIn{from{clip-path:polygon(0 0,100% 0,100% 0,0 0)}to{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}
</style>
</head>
<body>

<div class="slider" id="slider">
  <div class="slide s0 active" data-idx="0">
    <div class="text-side">
      <div class="text-inner">
        <div class="slide-tag">Daring to Dream</div>
        <h2 class="slide-h2">Where Passions Ignite and Soar</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="polaroid p1"><img src="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?w=400&h=500&fit=crop" alt="Microphone in studio" loading="lazy"></div>
      <div class="polaroid p2"><img src="https://images.unsplash.com/photo-1478737270239-2f02b77fc618?w=350&h=440&fit=crop" alt="Sound mixing desk" loading="lazy"></div>
      <div class="polaroid p3"><img src="https://images.unsplash.com/photo-1558618666-fcd25c85f82e?w=300&h=380&fit=crop" alt="Studio headphones" loading="lazy"></div>
    </div>
  </div>
  <div class="slide s1" data-idx="1">
    <div class="text-side">
      <div class="text-inner">
        <div class="slide-tag">Vibrant Wanderlust</div>
        <h2 class="slide-h2">Whispers of Freedom</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="polaroid p1"><img src="https://images.unsplash.com/photo-1586892477838-2b96e85e0f96?w=400&h=500&fit=crop" alt="Live captioning on screen" loading="lazy"></div>
      <div class="polaroid p2"><img src="https://images.unsplash.com/photo-1488190211105-8b0e65b80b4e?w=350&h=440&fit=crop" alt="Writing in notebook" loading="lazy"></div>
      <div class="polaroid p3"><img src="https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=300&h=380&fit=crop" alt="Pen on paper closeup" loading="lazy"></div>
    </div>
  </div>
  <div class="slide s2" data-idx="2">
    <div class="text-side">
      <div class="text-inner">
        <div class="slide-tag">A Journey of Creative Wonder</div>
        <h2 class="slide-h2">Beyond Boundaries, Skies Ablaze</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="polaroid p1"><img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=400&h=500&fit=crop" alt="People having conversation" loading="lazy"></div>
      <div class="polaroid p2"><img src="https://images.unsplash.com/photo-1573497491208-6b1acb260507?w=350&h=440&fit=crop" alt="Language exchange meeting" loading="lazy"></div>
      <div class="polaroid p3"><img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=300&h=380&fit=crop" alt="Workspace with laptop" loading="lazy"></div>
    </div>
  </div>
  <div class="slide s3" data-idx="3">
    <div class="text-side">
      <div class="text-inner">
        <div class="slide-tag">Beyond the Canvas</div>
        <h2 class="slide-h2">Colors of Urban Expression</h2>
        <span class="slide-cta">learn more</span>
      </div>
    </div>
    <div class="img-side">
      <div class="polaroid p1"><img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=400&h=500&fit=crop" alt="Friends talking at cafe" loading="lazy"></div>
      <div class="polaroid p2"><img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=350&h=440&fit=crop" alt="Coffee and conversation" loading="lazy"></div>
      <div class="polaroid p3"><img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=300&h=380&fit=crop" alt="Smiling people connecting" loading="lazy"></div>
    </div>
  </div>
</div>

<div class="nav-arrows">
  <button class="nav-arrow" id="prevBtn">▲</button>
  <button class="nav-arrow" id="nextBtn">▼</button>
</div>

<div class="bottom-nav">
  <a href="#">contact</a>
  <span class="nav-center">50/50</span>
  <a href="#">about</a>
</div>

<script>
var slides=document.querySelectorAll('.slide'),total=slides.length,current=0,transitioning=false;
function goTo(idx,dir){
  if(transitioning||idx===current||idx<0||idx>=total)return;transitioning=true;
  var old=slides[current],neu=slides[idx];
  old.classList.add('mask-out');old.classList.remove('active');
  neu.classList.add('mask-in','active');
  setTimeout(function(){
    old.classList.remove('mask-out');neu.classList.remove('mask-in');
    slides.forEach(function(s,i){if(i!==current&&i!==idx)s.classList.remove('active','mask-in','mask-out')});
    current=idx;transitioning=false;
  },680);
}
document.getElementById('prevBtn').addEventListener('click',function(){goTo(current>0?current-1:total-1,-1)});
document.getElementById('nextBtn').addEventListener('click',function(){goTo(current<total-1?current+1:0,1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowDown'||e.key==='ArrowRight')goTo(current<total-1?current+1:0,1);if(e.key==='ArrowUp'||e.key==='ArrowLeft')goTo(current>0?current-1:total-1,-1)});
var ta=0;document.addEventListener('wheel',function(e){ta+=e.deltaY;if(Math.abs(ta)>70){if(ta>0)goTo(current<total-1?current+1:0,1);else goTo(current>0?current-1:total-1,-1);ta=0}},{passive:true});
</script>
</body>
</html>
