<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 2 · Director's Cut v3 · Sottotitoli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-snap-type:y mandatory;overflow-y:scroll}
body{background:#0a0c10;color:#fff;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}

.sec{position:relative;width:100vw;height:100vh;scroll-snap-align:start;overflow:hidden;
  background:url('../img/bg-home.png') center/cover no-repeat;background-attachment:fixed}
.sec::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:0}
.sec::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.45) 100%)}

.sec-inner{position:relative;z-index:2;width:100%;height:100%;
  display:flex;align-items:flex-start;justify-content:center;
  padding:clamp(90px,15vh,130px) clamp(28px,5vw,80px) clamp(70px,12vh,100px)}

.row{display:flex;align-items:flex-start;gap:clamp(32px,6vw,80px);max-width:1100px;width:100%}

/* ── Left Column ── */
.s2-left{flex:1;display:flex;flex-direction:column;gap:clamp(10px,2vh,18px)}

.s2-title{font-family:Manrope,sans-serif;font-weight:800;line-height:1.1;font-size:clamp(38px,6vw,60px);
  text-shadow:-1px -1px 0 rgba(6,182,212,.35),1px 1px 0 rgba(0,0,0,.8),0 3px 10px rgba(0,0,0,.6)}
.s2-title em{font-style:normal;color:#06b6d4}

/* Both titles use same cinematic entry: blur + scale + translateY */
.title-cinematic{opacity:0;transform:translateY(10px) scale(.985);filter:blur(6px)}
.title-cinematic.is-visible{opacity:1;transform:translateY(0) scale(1);filter:blur(0);
  transition:opacity 1.8s cubic-bezier(.16,1,.30,1),transform 1.8s cubic-bezier(.16,1,.30,1),filter .9s ease-out}

/* LIVE bar — matches index.html */
.s2-livebar{display:inline-flex;align-items:center;gap:8px;
  font-family:'Arial Narrow','Arial',sans-serif;font-size:clamp(20px,2.3vw,24px);
  color:#fff;-webkit-text-stroke:2px rgb(10,10,10);paint-order:stroke fill;text-shadow:none;
  opacity:0;transform:translateY(12px)}
.s2-livebar.is-visible{opacity:1;transform:translateY(0);
  transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1)}
.s2-live-dot{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block;flex-shrink:0}
.s2-live-label{font-weight:600;flex-shrink:0}
.s2-live-divider{color:rgba(255,255,255,.25);flex-shrink:0;margin:0 1px}
.s2-live-text{transition:opacity .22s ease-out}
.s2-live-text.is-resolving{opacity:.55}

/* CEFR — hidden, then fades with A1-B2 pre-filled */
.s2-cefr-box{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;
  opacity:0;transform:translateY(8px)}
.s2-cefr-box.is-visible{opacity:1;transform:translateY(0);
  transition:opacity .65s ease-out,transform .65s cubic-bezier(.22,1,.36,1)}
.cefr-row{display:flex;align-items:center;gap:10px}
.cefr-lbl{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;width:26px}
.cefr-trk{flex:1;height:clamp(9px,1.1vh,12px);background:rgba(255,255,255,.04);border-radius:5px;overflow:hidden}
.cefr-fill{height:100%;border-radius:5px;width:0%}
/* Pre-filled bars animate instantly when box appears */
.cefr-fill.pre-filled{transition:width .01s}
.cefr-fill.animate-grow{transition:width .7s cubic-bezier(.34,1.56,.64,1)}

/* Metrics row — hidden */
.s2-metrics-row{display:flex;gap:6px;opacity:0;transform:translateY(8px);justify-content:center}
.s2-metrics-row.is-visible{opacity:1;transform:translateY(0);
  transition:opacity .65s ease-out,transform .65s cubic-bezier(.22,1,.36,1)}
.s2-card{display:flex;align-items:flex-end;gap:clamp(10px,1.5vw,16px);padding:clamp(8px,1.5vh,14px) 0}
.s2-card i{font-size:clamp(29px,3.8vw,39px);flex-shrink:0}
.s2-card .fa-arrow-trend-up{color:#c084fc}
.s2-card .fa-gem{color:#06b6d4}
.s2-card-label{font-size:clamp(10px,1vw,12px);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.s2-card-num{font-size:clamp(28px,4vw,42px);font-weight:800;font-family:'Manrope',sans-serif;line-height:1}
.s2-card-sub{font-size:.4em;font-weight:600}

/* SFIDA counter pop */
.s2-card-sfida{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.s2-card-sfida.is-popping{transform:scale(1.08)}

/* C2 card — hidden until payoff, space reserved */
.s2-card-c2{visibility:hidden;opacity:0;transform:scale(.7)}
.s2-card-c2.is-visible{visibility:visible;opacity:1;transform:scale(1);
  transition:opacity .35s ease-out,transform .6s cubic-bezier(.175,.885,.32,1.275)}
.s2-card-c2.is-visible i{animation:s2GemGlow .9s ease-out}
@keyframes s2GemGlow{0%{filter:drop-shadow(0 0 30px rgba(6,182,212,.9)) brightness(2)}60%{filter:drop-shadow(0 0 12px rgba(6,182,212,.5))}100%{filter:drop-shadow(0 0 4px rgba(6,182,212,.25))}}

/* SFIDA card cinematic entrance */
.s2-card-sfida-entrance{opacity:0;transform:scale(.85)}
.s2-card-sfida-entrance.is-visible{opacity:1;transform:scale(1);
  transition:opacity .5s ease-out,transform .55s cubic-bezier(.175,.885,.32,1.275)}

/* ── Right Column ── */
.s2-right{width:42%;display:flex;flex-direction:column;gap:clamp(8px,1.5vh,14px);min-width:0}

.s2-caption{opacity:0;transform:translateY(14px) scale(.995);
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);
  border-radius:12px;padding:clamp(10px,1.5vh,14px) clamp(12px,2vw,16px);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:flex-start;gap:10px}
.s2-caption.is-visible{opacity:1;transform:translateY(0) scale(1);
  transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1)}
.s2-caption-time{font-size:clamp(13px,1.3vw,16px);color:rgba(255,255,255,.5);
  font-family:'JetBrains Mono',monospace;min-width:42px;text-align:right;font-weight:500;padding-top:2px}
.s2-caption-text{flex:1;font-size:clamp(15px,1.5vw,18px);color:rgba(255,255,255,.85);line-height:1.5;font-weight:400}

/* Word recognition — cinematic highlight + clickable */
.s2-word{border-radius:.4em;transition:all .4s cubic-bezier(.175,.885,.32,1.275);cursor:default}
.s2-word[data-word]:hover{background:rgba(255,255,255,.06)}
.s2-word.is-found-c1{color:#fff;background:rgba(168,85,247,.22);
  box-shadow:0 0 0 2px rgba(168,85,247,.4),0 0 28px rgba(168,85,247,.3);transform:scale(1.07)}
.s2-word.is-found-c2{color:#fff;background:rgba(6,182,212,.22);
  box-shadow:0 0 0 3px rgba(6,182,212,.5),0 0 40px rgba(6,182,212,.4);transform:scale(1.1);
  animation:s2C2Force .55s cubic-bezier(.175,.885,.32,1.275)}
@keyframes s2C2Force{0%{transform:scale(1)}55%{transform:scale(1.14)}100%{transform:scale(1.1)}}

/* C2 flash on caption box */
.s2-caption.flash-c2{animation:s2CaptionFlash .7s ease-out}
@keyframes s2CaptionFlash{0%{box-shadow:0 0 50px rgba(6,182,212,.5),inset 0 0 50px rgba(6,182,212,.1)}100%{box-shadow:none}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Button */
.s2-continue{position:absolute;bottom:clamp(70px,12vh,90px);left:50%;transform:translateX(-50%) translateY(10px);
  font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  padding:10px 22px;border-radius:100px;cursor:pointer;z-index:10;
  opacity:0;pointer-events:none}
.s2-continue.is-visible{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;
  transition:opacity .5s ease-out,transform .5s cubic-bezier(.22,1,.36,1)}
.s2-continue:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}

.start-btn{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:10;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:#fff;
  background:rgba(124,58,237,.25);border:1px solid rgba(124,58,237,.4);
  padding:10px 24px;border-radius:100px;cursor:pointer;
  transition:background .2s,border-color .2s,opacity .3s}
.start-btn:hover{background:rgba(124,58,237,.4);border-color:rgba(124,58,237,.6)}
.start-btn.done{opacity:.3;pointer-events:none}

.label{position:absolute;bottom:24px;right:32px;z-index:10;
  font-size:12px;font-weight:600;color:rgba(255,255,255,.25);
  font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);
  border-radius:100px;padding:6px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

@media(prefers-reduced-motion:reduce){
  .title-cinematic,.s2-livebar,.s2-caption,.s2-card,.s2-cefr-box,.s2-continue,.s2-metrics-row{transition-duration:.01s!important}
  .title-cinematic{filter:none!important}
  .s2-word{transition-duration:.01s!important}
}
</style>
</head>
<body>

<div class="sec" id="slide">
  <div class="sec-inner">
    <div class="row">
      <!-- Left -->
      <div class="s2-left">
        <h2 class="s2-title title-cinematic s2-title-left">Ogni momento,<br><em>le sue parole.</em></h2>
        <div class="s2-livebar">
          <span class="s2-live-dot"></span>
          <span class="s2-live-label">LIVE</span>
          <span class="s2-live-divider">|</span>
          <span class="s2-live-text"></span>
        </div>
        <div class="s2-cefr-box">
          <div class="cefr-row"><span class="cefr-lbl" style="color:#22c55e">A1</span><div class="cefr-trk"><div class="cefr-fill pre-filled s2-bar-a1" style="background:#22c55e"></div></div></div>
          <div class="cefr-row"><span class="cefr-lbl" style="color:#a3e635">A2</span><div class="cefr-trk"><div class="cefr-fill pre-filled s2-bar-a2" style="background:#a3e635"></div></div></div>
          <div class="cefr-row"><span class="cefr-lbl" style="color:#facc15">B1</span><div class="cefr-trk"><div class="cefr-fill pre-filled s2-bar-b1" style="background:#facc15"></div></div></div>
          <div class="cefr-row"><span class="cefr-lbl" style="color:#fb923c">B2</span><div class="cefr-trk"><div class="cefr-fill pre-filled s2-bar-b2" style="background:#fb923c"></div></div></div>
          <div class="cefr-row"><span class="cefr-lbl" style="color:#c084fc">C1</span><div class="cefr-trk"><div class="cefr-fill animate-grow s2-bar-c1" style="background:#c084fc"></div></div></div>
          <div class="cefr-row"><span class="cefr-lbl" style="color:#06b6d4">C2</span><div class="cefr-trk"><div class="cefr-fill animate-grow s2-bar-c2" style="background:#06b6d4"></div></div></div>
        </div>
        <div class="s2-metrics-row">
          <div class="s2-card s2-card-sfida s2-card-sfida-entrance" style="flex-direction:column;align-items:center;gap:6px;background:linear-gradient(180deg,rgba(192,132,252,.16),rgba(192,132,252,.05));border:1px solid rgba(192,132,252,.25);border-radius:16px;padding:18px 22px">
            <span class="s2-card-label" style="color:rgba(192,132,252,.55);text-align:center">SFIDA C1</span>
            <div style="display:flex;align-items:flex-end;gap:10px">
              <i class="fa-solid fa-arrow-trend-up"></i>
              <span class="s2-card-num" style="color:#fff"><span class="s2-sfida-count">4</span><span class="s2-card-sub" style="color:rgba(255,255,255,.5)">/10</span></span>
            </div>
          </div>
          <div class="s2-card s2-card-c2" style="flex-direction:column;align-items:center;gap:6px;background:linear-gradient(180deg,rgba(6,182,212,.14),rgba(6,182,212,.04));border:1px solid rgba(6,182,212,.25);border-radius:16px;padding:18px 22px">
            <span class="s2-card-label" style="color:rgba(6,182,212,.5);text-align:center">C2 Trovata</span>
            <div style="display:flex;align-items:flex-end;gap:10px">
              <i class="fa-solid fa-gem"></i>
              <span class="s2-card-num" style="color:#06b6d4">+1<span class="s2-card-sub" style="color:rgba(6,182,212,.35)">parola</span></span>
            </div>
          </div>
        </div>
      </div>
      <!-- Right -->
      <div class="s2-right">
        <h2 class="s2-title title-cinematic s2-title-right" style="white-space:nowrap">Ogni parola,<br><em>il suo momento.</em></h2>
        <article class="s2-caption s2-caption-1">
          <span class="s2-caption-time s2-time-1">00:00</span>
          <p class="s2-caption-text">Each moment is a <span class="s2-word s2-word-c1" data-word="skyline">skyline</span> of words.</p>
        </article>
        <article class="s2-caption s2-caption-2">
          <span class="s2-caption-time s2-time-2">00:00</span>
          <p class="s2-caption-text">And now every word has its moment.</p>
        </article>
        <article class="s2-caption s2-caption-3">
          <span class="s2-caption-time s2-time-3">00:00</span>
          <p class="s2-caption-text">We can make every moment together <span class="s2-word s2-word-c2" data-word="indelible">indelible</span>.</p>
        </article>
        <!-- Word definition box — appears on click -->
        <div id="s2WordDef" style="display:none;background:rgba(15,18,28,.92);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:clamp(14px,2vh,20px) clamp(16px,2.5vw,22px);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin-top:4px">
          <div style="display:flex;align-items:flex-start;gap:clamp(8px,1.5vw,14px)">
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                <span id="defWord" style="font-size:clamp(16px,1.8vw,20px);font-weight:700;color:#fff;font-family:'Inter',sans-serif"></span>
                <span id="defCefr" style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px"></span>
                <span id="defPos" style="font-size:11px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.04em"></span>
              </div>
              <div id="defIpa" style="font-size:12px;color:rgba(255,255,255,.3);font-family:'JetBrains Mono',monospace;margin-bottom:4px"></div>
              <div id="defDef" style="font-size:13px;color:rgba(255,255,255,.7);line-height:1.5;margin-bottom:4px"></div>
              <div id="defTrans" style="font-size:13px;color:#06b6d4;font-weight:500;margin-bottom:6px"></div>
              <div id="defSyns" style="display:flex;flex-wrap:wrap;gap:6px"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button class="s2-continue">Continua <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <button class="start-btn" id="startBtn">▶ Avvia sequenza</button>
  <div class="label">Slide 2 · Director's Cut v3</div>
</div>

<script>
const LINES=[
  "Each moment is a skyline of words.",
  "And now every word has its moment.",
  "We can make every moment together indelible."
];
const TIMES=[240,220,200];
const PRE_FILLED={a1:40,a2:30,b1:12,b2:10};

function wait(ms){return new Promise(r=>setTimeout(r,ms));}
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);

const titleL=$('.s2-title-left'),titleR=$('.s2-title-right');
const liveBar=$('.s2-livebar'),liveText=$('.s2-live-text');
const cefrBox=$('.s2-cefr-box'),metricsRow=$('.s2-metrics-row');
const sfidaCount=$('.s2-sfida-count'),sfidaCard=$('.s2-card-sfida');
const cardC2=$('.s2-card-c2');
const barC1=$('.s2-bar-c1'),barC2=$('.s2-bar-c2');
const barFills={a1:$('.s2-bar-a1'),a2:$('.s2-bar-a2'),b1:$('.s2-bar-b1'),b2:$('.s2-bar-b2'),c1:barC1,c2:barC2};
const captions=$$('.s2-caption');
const btn=$('.s2-continue'),startBtn=$('#startBtn');
const defBox=$('#s2WordDef');

// Word dictionary for clickable definitions
var wordDict={
  skyline:{w:'skyline',cefr:'C1',pos:'NOUN',ipa:'/ˈskaɪ.laɪn/',def:'The outline of buildings or mountains against the sky.',trans:'→ profilo urbano, skyline',syns:['horizon','cityscape','silhouette'],cefrColor:'#c084fc'},
  indelible:{w:'indelible',cefr:'C2',pos:'ADJ',ipa:'/ɪnˈdel.ə.bəl/',def:'Making marks that cannot be removed, or memories that cannot be forgotten.',trans:'→ indelebile, incancellabile',syns:['permanent','unerasable','lasting'],cefrColor:'#06b6d4'}
};

function showWordDef(key){
  var d=wordDict[key];if(!d)return;
  $('#defWord').textContent=d.w;
  var cefr=$('#defCefr');cefr.textContent=d.cefr;cefr.style.background=d.cefrColor+'22';cefr.style.color=d.cefrColor;
  $('#defPos').textContent=d.pos;
  $('#defIpa').textContent=d.ipa;
  $('#defDef').textContent=d.def;
  $('#defTrans').textContent=d.trans;
  var syns=$('#defSyns');syns.innerHTML='';
  d.syns.forEach(function(s){var sp=document.createElement('span');sp.textContent=s;sp.style.cssText='font-size:11px;color:rgba(255,255,255,.25);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:100px;padding:2px 10px';syns.appendChild(sp);});
  defBox.style.display='block';
  defBox.style.animation='none';void defBox.offsetWidth;
  defBox.style.animation='fadeIn .4s ease-out both';
}

// Make word spans clickable
function setupClickableWords(){
  $$('.s2-word[data-word]').forEach(function(el){
    el.style.cursor='pointer';
    el.addEventListener('click',function(e){e.stopPropagation();showWordDef(this.getAttribute('data-word'));});
  });
}

function resetAll(){
  titleL.classList.remove('is-visible');titleR.classList.remove('is-visible');
  liveBar.classList.remove('is-visible');liveText.textContent='';liveText.classList.remove('is-resolving');
  cefrBox.classList.remove('is-visible');metricsRow.classList.remove('is-visible');
  sfidaCard.classList.remove('is-popping');sfidaCard.classList.remove('is-visible');
  sfidaCount.textContent='4';
  cardC2.classList.remove('is-visible');
  captions.forEach(c=>{c.classList.remove('is-visible');c.classList.remove('flash-c2');});
  $$('.s2-word').forEach(w=>{w.classList.remove('is-found-c1','is-found-c2');w.style.cursor='pointer';});
  defBox.style.display='none';
  // Set real computer time on caption timestamps
  var now=new Date();
  var hh=now.getHours().toString().padStart(2,'0');
  var mm=now.getMinutes().toString().padStart(2,'0');
  $$('.s2-time-1,.s2-time-2,.s2-time-3').forEach(function(el){el.textContent=hh+':'+mm;});
  // Reset bar widths
  Object.values(barFills).forEach(b=>b.style.width='0%');
  btn.classList.remove('is-visible');
}

async function playTitleLeft(){titleL.classList.add('is-visible');}
async function playTitleRight(){titleR.classList.add('is-visible');}
async function showLiveBar(){liveBar.classList.add('is-visible');}

async function typeLiveLine(idx){
  const words=LINES[idx].split(' ');
  liveText.textContent='';
  for(const w of words){
    liveText.textContent+=(liveText.textContent?' ':'')+w;
    await wait(TIMES[idx]);
  }
}

async function resolveLiveLineToCaption(idx){
  liveText.classList.add('is-resolving');
  captions[idx].classList.add('is-visible');
  await wait(220);
  liveText.textContent='';
  liveText.classList.remove('is-resolving');
}

// Show CEFR box + metrics row with A1-B2 pre-filled, C1+C2 empty
async function showCefrBox(){
  Object.entries(PRE_FILLED).forEach(([k,v])=>{if(barFills[k])barFills[k].style.width=v+'%';});
  barC1.style.width='0%';barC2.style.width='0%';
  cefrBox.classList.add('is-visible');
  metricsRow.classList.add('is-visible');
}

function activateWord(wordKey){
  const el=document.querySelector(`.s2-word[data-word="${wordKey}"]`);
  if(!el)return;
  if(el.classList.contains('s2-word-c2')){
    el.classList.add('is-found-c2');
    el.closest('.s2-caption').classList.add('flash-c2');
  }else{
    el.classList.add('is-found-c1');
  }
}

function growC1Bar(pct){barC1.style.width=pct+'%';}
function growC2Bar(pct){barC2.style.width=pct+'%';}

function incrementSfida(){
  const next=Number(sfidaCount.textContent)+1;
  sfidaCard.classList.remove('is-popping');
  void sfidaCard.offsetWidth;
  sfidaCard.classList.add('is-popping');
  setTimeout(()=>{sfidaCount.textContent=String(next);sfidaCard.classList.remove('is-popping');},300);
}

async function showC2CardBombastic(){
  cardC2.classList.add('is-visible');
}

async function showContinueButton(){btn.classList.add('is-visible');}

// ── Master Sequence ──
async function runSequence(){
  resetAll();
  setupClickableWords();
  startBtn.classList.add('done');

  // Act 1 — Invocation
  await wait(200); playTitleLeft();
  await wait(900); playTitleRight();
  await wait(1000); showLiveBar();

  // Act 2 — Capture
  await wait(450);
  await typeLiveLine(0); await wait(800); await resolveLiveLineToCaption(0);
  await wait(700);
  await typeLiveLine(1); await wait(700); await resolveLiveLineToCaption(1);
  await wait(500);
  await typeLiveLine(2); await wait(800); await resolveLiveLineToCaption(2);

  // Act 3 — Recognition
  await wait(400);
  // CEFR box fades in: A1-B2 pre-filled, C1+C2 empty
  await showCefrBox();
  await wait(400);

  // C1 word: "skyline" — highlight → pause → SFIDA pops → C1 bar grows
  activateWord('skyline');
  await wait(500);
  sfidaCard.classList.add('is-visible');
  await wait(400);
  growC1Bar(7);
  await wait(300);
  incrementSfida();
  await wait(900);

  // C2 word: "indelible" — cinematic highlight → C1 bump → C2 bombastic
  activateWord('indelible');
  await wait(500);
  growC1Bar(8);
  await wait(400);
  growC2Bar(3);
  await wait(500);
  await showC2CardBombastic();

  // Settle
  await wait(500);
  await showContinueButton();
}

startBtn.addEventListener('click',runSequence);
</script>
