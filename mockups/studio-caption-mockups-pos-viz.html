<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · POS Visualizations</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#060610;color:#e8eaed;padding:32px 24px}
h1{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-1.5px;text-align:center;background:linear-gradient(90deg,#34d399,#60a5fa,#a78bfa,#f472b6);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:titleShift 6s linear infinite;margin-bottom:4px}
@keyframes titleShift{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.subtitle{text-align:center;color:#8b93a5;margin-bottom:32px;font-size:12px}
.section-title{font-size:15px;font-weight:800;color:rgba(255,255,255,.5);margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06);letter-spacing:-.3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;max-width:1400px;margin:0 auto}
.card{background:#0f121e;border:1px solid #1a1e2e;border-radius:14px;padding:18px;transition:all .25s}
.card:hover{border-color:#2a2e3e;transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.card-num{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.2);margin-bottom:6px}
.card-title{font-size:11px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:12px;letter-spacing:.3px}
.viz-area{min-height:80px;display:flex;align-items:center;justify-content:center}
.chip{display:inline-block;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:600;margin:2px}
.bar-h{height:8px;border-radius:4px;transition:width .6s ease}
.dot{display:inline-block;border-radius:50%}
</style>
</head>
<body>
<h1>POS Visualization Explorer</h1>
<p class="subtitle">4 variations for 05 · POS Distribution &amp; 4 variations for 01 · POS Tags — June 2026</p>

<!-- ══════════════════════════════════════ -->
<h2 class="section-title">05 · POS Distribution — 4 Variations</h2>
<div class="grid" id="distGrid"></div>

<!-- ══════════════════════════════════════ -->
<h2 class="section-title">01 · POS Tags — 4 Variations</h2>
<div class="grid" id="tagGrid"></div>

<script>
// Sample data
var DATA={Verbs:7,Nouns:12,Adj:4,Adv:3,Other:5};
var total=DATA.Verbs+DATA.Nouns+DATA.Adj+DATA.Adv+DATA.Other;
var tags=[{w:'discussing',pos:'VERB'},{w:'future',pos:'NOUN'},{w:'translation',pos:'NOUN'},{w:'systems',pos:'NOUN'},{w:'barriers',pos:'NOUN'},{w:'deployment',pos:'NOUN'},{w:'remains',pos:'VERB'},{w:'biggest',pos:'ADJ'},{w:'challenge',pos:'NOUN'},{w:'neural',pos:'ADJ'},{w:'remarkably',pos:'ADV'},{w:'bridge',pos:'VERB'},{w:'cultures',pos:'NOUN'},{w:'different',pos:'ADJ'},{w:'scale',pos:'NOUN'},{w:'quickly',pos:'ADV'},{w:'international',pos:'ADJ'},{w:'across',pos:'PREP'},{w:'these',pos:'DET'},{w:'and',pos:'CONJ'}];
var posColors={VERB:'#34d399',NOUN:'#60a5fa',ADJ:'#f472b6',ADV:'#c084fc',PREP:'#fbbf24',CONJ:'#fb923c',DET:'#22d3ee',PRON:'#a78bfa',OTHER:'#6b7280'};
var posNames={VERB:'Verbs',NOUN:'Nouns',ADJ:'Adj',ADV:'Adv',PREP:'Prep',CONJ:'Conj',DET:'Det',PRON:'Pron',OTHER:'Other'};

// ══════════════════════════════════════
// 4 POS DISTRIBUTION VARIATIONS (#2, #3, #13, #15)
// ══════════════════════════════════════
var distVars=[
  // 2: Vertical columns
  function(c){
    var max=Math.max(DATA.Verbs,DATA.Nouns,DATA.Adj,DATA.Adv,DATA.Other);
    var h='<div style="display:flex;align-items:flex-end;gap:12px;height:70px">';
    [{l:'Verbs',v:DATA.Verbs,c:'#34d399'},{l:'Nouns',v:DATA.Nouns,c:'#60a5fa'},{l:'Adj',v:DATA.Adj,c:'#f472b6'},{l:'Adv',v:DATA.Adv,c:'#c084fc'},{l:'Other',v:DATA.Other,c:'#6b7280'}].forEach(function(b){
      var hgt=Math.max(8,b.v/max*60);
      h+='<div style="text-align:center"><div style="width:24px;height:'+hgt+'px;background:'+b.c+';border-radius:4px 4px 0 0;margin:0 auto"></div><div style="font-size:7px;color:'+b.c+';margin-top:2px">'+b.l+'</div><div style="font-size:8px;color:rgba(255,255,255,.3)">'+b.v+'</div></div>';
    });
    h+='</div>';return h;
  },
  // 3: Donut ring
  function(c){
    var circ=2*Math.PI*32;var offset=0;
    var h='<svg viewBox="0 0 100 100" style="width:90px;height:90px">';
    [{v:DATA.Verbs,c:'#34d399'},{v:DATA.Nouns,c:'#60a5fa'},{v:DATA.Adj,c:'#f472b6'},{v:DATA.Adv,c:'#c084fc'},{v:DATA.Other,c:'#6b7280'}].forEach(function(b){
      var dash=(b.v/total)*circ;
      h+='<circle cx="50" cy="50" r="32" fill="none" stroke="'+b.c+'" stroke-width="10" stroke-dasharray="'+dash+' '+circ+'" stroke-dashoffset="'+-offset+'" transform="rotate(-90 50 50)"/>';
      offset+=dash;
    });
    h+='<text x="50" y="46" text-anchor="middle" font-family="JetBrains Mono" font-size="16" font-weight="900" fill="#e8eaed">'+total+'</text><text x="50" y="56" text-anchor="middle" font-size="6" fill="rgba(255,255,255,.3)">words</text></svg>';
    return h;
  },
  // 13: Dot matrix
  function(c){
    var h='<div style="display:flex;gap:10px">';
    [{l:'V',v:DATA.Verbs,c:'#34d399'},{l:'N',v:DATA.Nouns,c:'#60a5fa'},{l:'J',v:DATA.Adj,c:'#f472b6'},{l:'D',v:DATA.Adv,c:'#c084fc'},{l:'O',v:DATA.Other,c:'#6b7280'}].forEach(function(b){
      h+='<div style="text-align:center"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-bottom:2px">';
      for(var i=0;i<Math.min(b.v,15);i++) h+='<div style="width:8px;height:8px;border-radius:2px;background:'+b.c+'"></div>';
      h+='</div><div style="font-size:7px;color:rgba(255,255,255,.2)">'+b.l+' '+b.v+'</div></div>';
    });
    h+='</div>';return h;
  },
  // 15: 3D isometric blocks
  function(c){
    var h='<div style="display:flex;align-items:flex-end;gap:6px;height:65px;perspective:200px">';
    [{l:'V',v:DATA.Verbs,c:'#34d399'},{l:'N',v:DATA.Nouns,c:'#60a5fa'},{l:'J',v:DATA.Adj,c:'#f472b6'},{l:'D',v:DATA.Adv,c:'#c084fc'},{l:'O',v:DATA.Other,c:'#6b7280'}].forEach(function(b){
      var hgt=b.v*3.5;
      h+='<div style="width:28px;text-align:center"><div style="width:28px;height:'+hgt+'px;background:linear-gradient(135deg,'+b.c+','+b.c+'88);border-radius:3px 3px 0 0;box-shadow:3px 3px 0 '+b.c+'44"></div><div style="font-size:7px;color:rgba(255,255,255,.2);margin-top:2px">'+b.l+'</div></div>';
    });
    h+='</div>';return h;
  }
];

// ══════════════════════════════════════
// 4 POS TAGS VARIATIONS (#1, #2, #4, #9)
// ══════════════════════════════════════
var tagVars=[
  // 1: Color-coded chips
  function(c){
    var h='<div style="display:flex;flex-wrap:wrap;gap:3px">';
    tags.slice(0,12).forEach(function(t){
      var color=posColors[t.pos];h+='<span class="chip" style="background:'+color+'18;color:'+color+';border:1px solid '+color+'22">'+t.w+' <small style="opacity:.6">'+t.pos+'</small></span>';
    });
    h+='</div>';return h;
  },
  // 2: Stacked by POS
  function(c){
    var h='<div style="display:flex;flex-direction:column;gap:6px">';
    Object.keys(posNames).forEach(function(pos){
      var words=tags.filter(function(t){return t.pos===pos});
      if(words.length===0) return;
      h+='<div><div style="font-size:8px;color:'+posColors[pos]+';margin-bottom:2px;font-weight:600">'+posNames[pos]+' ('+words.length+')</div><div style="display:flex;flex-wrap:wrap;gap:2px">';
      words.forEach(function(t){h+='<span style="padding:2px 8px;border-radius:4px;background:'+posColors[pos]+'15;color:'+posColors[pos]+';font-size:9px">'+t.w+'</span>'});
      h+='</div></div>';
    });
    h+='</div>';return h;
  },
  // 4: Table view
  function(c){
    var h='<table style="width:100%;font-size:9px;border-collapse:collapse">';
    h+='<tr style="color:rgba(255,255,255,.2);font-size:7px;text-transform:uppercase"><th style="text-align:left;padding:3px">Word</th><th>POS</th><th style="text-align:right">Color</th></tr>';
    tags.slice(0,10).forEach(function(t){
      h+='<tr style="border-top:1px solid rgba(255,255,255,.03)"><td style="padding:3px;font-weight:500">'+t.w+'</td><td style="color:'+posColors[t.pos]+';font-weight:600;text-align:center">'+t.pos+'</td><td style="text-align:right"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:'+posColors[t.pos]+'"></span></td></tr>';
    });
    h+='</table>';return h;
  },
  // 9: Grid cards
  function(c){
    var h='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">';
    tags.slice(0,12).forEach(function(t){
      var color=posColors[t.pos];
      h+='<div style="background:'+color+'10;border:1px solid '+color+'18;border-radius:6px;padding:6px 4px;text-align:center"><div style="font-size:10px;font-weight:600;color:rgba(255,255,255,.6)">'+t.w+'</div><div style="font-size:7px;color:'+color+';font-weight:700;margin-top:1px">'+t.pos+'</div></div>';
    });
    h+='</div>';return h;
  }
];

// Render
var distNums = [2, 3, 13, 15];
var distGrid=document.getElementById('distGrid');
distVars.forEach(function(fn,i){
  var card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="card-num">#'+distNums[i]+'</div><div class="card-title">05 · POS Distribution — Variation '+distNums[i]+'</div><div class="viz-area">'+fn(i)+'</div>';
  distGrid.appendChild(card);
});

var tagNums = [1, 2, 4, 9];
var tagGrid=document.getElementById('tagGrid');
tagVars.forEach(function(fn,i){
  var card=document.createElement('div');card.className='card';
  card.innerHTML='<div class="card-num">#'+tagNums[i]+'</div><div class="card-title">01 · POS Tags — Variation '+tagNums[i]+'</div><div class="viz-area">'+fn(i)+'</div>';
  tagGrid.appendChild(card);
});
</script>
</body>
</html>
