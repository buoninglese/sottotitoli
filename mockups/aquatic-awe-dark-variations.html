<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aquatic Awe · 15 Dark Mode Variations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ui:"Inter",ui-sans-serif,system-ui,sans-serif;--serif:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ui);background:#0a0e12;color:#e0e4e8}
h1{font-family:var(--serif);font-size:48px;font-weight:600;text-align:center;margin:52px 0 4px;letter-spacing:-.03em;color:#d8eaf4}
.sub{text-align:center;color:#6b8a9e;font-size:14px;margin-bottom:8px}
.note{text-align:center;color:#4d6270;font-size:12px;margin-bottom:40px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(500px,1fr));gap:20px;padding:0 20px 60px;max-width:1600px;margin:0 auto}
@media(max-width:560px){.grid{grid-template-columns:1fr;padding:0 12px}}
.card{border-radius:20px;overflow:hidden;border:1px solid #253545;cursor:pointer;transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.card-head{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;letter-spacing:.03em}
.card-body{padding:28px 24px 24px}
.mini-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid}
.mini-brand{font-size:20px;font-weight:800;letter-spacing:-.4px}
.mini-dots{display:flex;gap:6px}.mini-dot{width:7px;height:7px;border-radius:50%}
.preview-tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;padding:2px 10px;border-radius:999px;margin-bottom:12px}
.preview-h1{font-size:36px;font-weight:900;letter-spacing:-1.2px;line-height:1.05;margin:0 0 8px}
.preview-p{font-size:14px;line-height:1.5;max-width:400px;margin:0 0 18px;opacity:.65}
.preview-btn{display:inline-block;padding:10px 24px;border-radius:12px;font-size:13px;font-weight:600;cursor:default;border:none}
.preview-panel{margin:18px auto 0;padding:24px 20px;border-radius:16px;max-width:400px;text-align:center;border:2px solid}
.preview-panel h3{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.preview-panel p{font-size:11px;opacity:.55;line-height:1.4;margin:0}
.swatch-row{display:flex;gap:6px;justify-content:center;margin-top:18px}
.sr{width:16px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.06)}
.back-link{display:block;text-align:center;color:#4d6270;font-size:13px;padding-bottom:50px}
</style>
</head>
<body>

<h1>Aquatic Awe · 15 Dark Modes</h1>
<p class="sub">Each is a dark companion to the Aquatic Awe light palette (#f0f6f8 / #0e7490)</p>
<p class="note">Light mode reference: bg&nbsp;#f0f6f8 &nbsp;·&nbsp; text&nbsp;#0f1c24 &nbsp;·&nbsp; accent&nbsp;#0e7490 &nbsp;·&nbsp; panels&nbsp;#fdfefe &nbsp;— Click any card to preview full page</p>

<div class="grid" id="grid"></div>
<p class="back-link"><a href="supreme-index.html">← Supreme Index</a></p>

<script>
const lightRef = {bg:"#f0f6f8",panel:"#fdfefe",panel2:"#f4f9fb",line:"#d4e6ee",lineStrong:"#bcd6e2",text:"#0f1c24",textSoft:"#3d5260",textFaint:"#71899e",btn:"#12222e",accent:"#0e7490",accentSoft:"rgba(14,116,144,.15)",tagBg:"#ffedd5",tagText:"#c2410c"};

const variations = [
  {n:"01",name:"Deep Navy & Amber",desc:"Warm contrast against cool light mode",dark:{bg:"#0a1628",panel:"#141f35",panel2:"#18243c",line:"#243248",lineStrong:"#2e3e52",text:"#dce6f4",textSoft:"#a0b4cc",textFaint:"#6a7e99",btn:"#dce6f4",accent:"#f59e0b",accentSoft:"rgba(245,158,11,.15)",tagBg:"rgba(245,158,11,.15)",tagText:"#fbbf24"}},
  {n:"02",name:"Dark Teal & Rose",desc:"Teal depths with warm rose accents",dark:{bg:"#0a1a1a",panel:"#142524",panel2:"#182a29",line:"#243c3a",lineStrong:"#2e4a48",text:"#d4f0ea",textSoft:"#98c4ba",textFaint:"#62968a",btn:"#d4f0ea",accent:"#fb7185",accentSoft:"rgba(251,113,133,.15)",tagBg:"rgba(251,113,133,.15)",tagText:"#fb7185"}},
  {n:"03",name:"Midnight Ink & Mint",desc:"Deep blue-black with fresh mint pop",dark:{bg:"#0a0f1a",panel:"#141a28",panel2:"#181f2e",line:"#242d42",lineStrong:"#2e3850",text:"#d8e0f4",textSoft:"#a0acc4",textFaint:"#6a7894",btn:"#d8e0f4",accent:"#34d399",accentSoft:"rgba(52,211,153,.15)",tagBg:"rgba(52,211,153,.15)",tagText:"#34d399"}},
  {n:"04",name:"Charcoal & Electric",desc:"Neutral dark with vibrant cyan",dark:{bg:"#121418",panel:"#1c1e24",panel2:"#20232a",line:"#30343c",lineStrong:"#3c4048",text:"#e0e4ec",textSoft:"#a4aab4",textFaint:"#6e7480",btn:"#e0e4ec",accent:"#06b6d4",accentSoft:"rgba(6,182,212,.15)",tagBg:"rgba(6,182,212,.15)",tagText:"#06b6d4"}},
  {n:"05",name:"Deep Indigo & Gold",desc:"Rich indigo with warm gold highlights",dark:{bg:"#0f0f1f",panel:"#1a1a30",panel2:"#1f1f38",line:"#2c2c48",lineStrong:"#383856",text:"#dde0f4",textSoft:"#a4a8cc",textFaint:"#6e7299",btn:"#dde0f4",accent:"#fbbf24",accentSoft:"rgba(251,191,36,.15)",tagBg:"rgba(251,191,36,.15)",tagText:"#fbbf24"}},
  {n:"06",name:"Forest Dark & Coral",desc:"Deep green-black with coral warmth",dark:{bg:"#0a140e",panel:"#141e18",panel2:"#18241c",line:"#24342a",lineStrong:"#2e4034",text:"#d4eadc",textSoft:"#98c4a6",textFaint:"#629674",btn:"#d4eadc",accent:"#fb923c",accentSoft:"rgba(251,146,60,.15)",tagBg:"rgba(251,146,60,.15)",tagText:"#fb923c"}},
  {n:"07",name:"Slate Blue & Lime",desc:"Cool slate with zesty lime accents",dark:{bg:"#0e141c",panel:"#181e28",panel2:"#1c2230",line:"#283040",lineStrong:"#323c4e",text:"#dae2f0",textSoft:"#a0acbf",textFaint:"#6a768c",btn:"#dae2f0",accent:"#a3e635",accentSoft:"rgba(163,230,53,.15)",tagBg:"rgba(163,230,53,.15)",tagText:"#a3e635"}},
  {n:"08",name:"Deep Ocean & Peach",desc:"Ocean depths with soft peach warmth",dark:{bg:"#09141e",panel:"#131e2a",panel2:"#172332",line:"#233244",lineStrong:"#2d3e52",text:"#d4e4f4",textSoft:"#98b8cc",textFaint:"#62869e",btn:"#d4e4f4",accent:"#fb923c",accentSoft:"rgba(251,146,60,.15)",tagBg:"rgba(251,146,60,.15)",tagText:"#fb923c"}},
  {n:"09",name:"Violet Night & Aqua",desc:"Deep violet with the original aquatic accent",dark:{bg:"#100e1a",panel:"#1a1828",panel2:"#1f1c2e",line:"#2e2a42",lineStrong:"#3a3650",text:"#e0dcf4",textSoft:"#a8a4c4",textFaint:"#727094",btn:"#e0dcf4",accent:"#22d3ee",accentSoft:"rgba(34,211,238,.15)",tagBg:"rgba(34,211,238,.15)",tagText:"#22d3ee"}},
  {n:"10",name:"Warm Earth & Cyan",desc:"Dark brown earth with cool cyan sky",dark:{bg:"#140f0a",panel:"#1e1812",panel2:"#241d16",line:"#342c22",lineStrong:"#40382c",text:"#ece0d0",textSoft:"#bfae88",textFaint:"#897a58",btn:"#ece0d0",accent:"#06b6d4",accentSoft:"rgba(6,182,212,.15)",tagBg:"rgba(6,182,212,.15)",tagText:"#06b6d4"}},
  {n:"11",name:"Arctic Night & Rose",desc:"Icy dark blue with warm rose contrast",dark:{bg:"#0a101c",panel:"#141a2a",panel2:"#181f30",line:"#242d44",lineStrong:"#2e3852",text:"#d8e2f4",textSoft:"#9eb0cc",textFaint:"#687a99",btn:"#d8e2f4",accent:"#f472b6",accentSoft:"rgba(244,114,182,.15)",tagBg:"rgba(244,114,182,.15)",tagText:"#f472b6"}},
  {n:"12",name:"Graphite & Emerald",desc:"Neutral graphite with rich emerald",dark:{bg:"#131518",panel:"#1d1f24",panel2:"#22242a",line:"#32343a",lineStrong:"#3e4048",text:"#e2e4e8",textSoft:"#a6a8b0",textFaint:"#70727a",btn:"#e2e4e8",accent:"#10b981",accentSoft:"rgba(16,185,129,.15)",tagBg:"rgba(16,185,129,.15)",tagText:"#10b981"}},
  {n:"13",name:"Burgundy Deep & Ice",desc:"Deep burgundy with cool ice blue",dark:{bg:"#160e10",panel:"#20181a",panel2:"#261c1e",line:"#382a2e",lineStrong:"#44363a",text:"#f0dce0",textSoft:"#c4a6ac",textFaint:"#8e7278",btn:"#f0dce0",accent:"#38bdf8",accentSoft:"rgba(56,189,248,.15)",tagBg:"rgba(56,189,248,.15)",tagText:"#38bdf8"}},
  {n:"14",name:"True Black & Cyan",desc:"Pure black base with the aquatic cyan signature",dark:{bg:"#080808",panel:"#141414",panel2:"#181818",line:"#262626",lineStrong:"#323232",text:"#e4e4e4",textSoft:"#a4a4a4",textFaint:"#6e6e6e",btn:"#e4e4e4",accent:"#22d3ee",accentSoft:"rgba(34,211,238,.18)",tagBg:"rgba(34,211,238,.18)",tagText:"#22d3ee"}},
  {n:"15",name:"Deep Lagoon & Warm Gold",desc:"Rich lagoon depths with golden warmth",dark:{bg:"#0a1618",panel:"#142022",panel2:"#182628",line:"#243638",lineStrong:"#2e4446",text:"#d4ecee",textSoft:"#98c0c4",textFaint:"#629094",btn:"#d4ecee",accent:"#fbbf24",accentSoft:"rgba(251,191,36,.15)",tagBg:"rgba(251,191,36,.15)",tagText:"#fbbf24"}}
];

function s(c){return'<span class="sr" style="background:'+c+'"></span>'}

const grid = document.getElementById('grid');
variations.forEach(v=>{
  const D=v.dark;
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML=
    '<div class="card-head" style="background:'+D.line+';color:'+D.textSoft+'">'+
      '<span>'+v.n+' &nbsp;'+v.name+'</span>'+
      '<span style="font-size:10px;opacity:.7">'+v.desc+'</span>'+
    '</div>'+
    '<div class="card-body" style="background:'+D.bg+';color:'+D.text+'">'+
      '<div class="mini-bar" style="border-color:'+D.line+'">'+
        '<div class="mini-brand">sotto<span style="color:'+D.accent+'">titoli</span></div>'+
        '<div class="mini-dots"><span class="mini-dot" style="background:'+D.textFaint+'"></span><span class="mini-dot" style="background:'+D.textFaint+'"></span><span class="mini-dot" style="background:'+D.accent+'"></span></div>'+
      '</div>'+
      '<span class="preview-tag" style="background:'+D.tagBg+';color:'+D.tagText+'">Sottotitoli</span>'+
      '<div class="preview-h1">Tutto chiaro.<br><em style="font-style:normal;color:'+D.accent+'">Sempre. Subito.</em></div>'+
      '<p class="preview-p" style="color:'+D.textSoft+'">Sottotitoli e traduzione in tempo reale per capire subito meglio riunioni, lezioni e conversazioni.</p>'+
      '<span class="preview-btn" style="background:'+D.btn+';color:'+D.bg+'">Inizia gratis</span>'+
      '<div class="preview-panel" style="background:'+D.panel+';border-color:'+D.lineStrong+'">'+
        '<h3>La tua voce, in tutte le sue parti</h3>'+
        '<p style="color:'+D.textSoft+'">Scomponiamo il tuo parlato in decine di indicatori.</p>'+
      '</div>'+
      '<div class="swatch-row">'+s(D.bg)+s(D.panel)+s(D.line)+s(D.text)+s(D.accent)+s(D.btn)+'</div>'+
    '</div>';
  card.addEventListener('click',()=>{
    const w=window.open('','_blank');
    w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+v.name+' Preview</title><style>'+
      ':root{--bg:'+lightRef.bg+';--panel:'+lightRef.panel+';--panel-2:'+lightRef.panel2+';--line:'+lightRef.line+';--line-strong:'+lightRef.lineStrong+';--text:'+lightRef.text+';--text-soft:'+lightRef.textSoft+';--text-faint:'+lightRef.textFaint+';--btn:'+lightRef.btn+';--accent:'+lightRef.accent+';--accent-soft:'+lightRef.accentSoft+';--tag-bg:'+lightRef.tagBg+';--tag-text:'+lightRef.tagText+';--radius-btn:15px;--radius-panel:34px;font-family:Inter,sans-serif}'+
      '[data-theme="dark"]{--bg:'+D.bg+';--panel:'+D.panel+';--panel-2:'+D.panel2+';--line:'+D.line+';--line-strong:'+D.lineStrong+';--text:'+D.text+';--text-soft:'+D.textSoft+';--text-faint:'+D.textFaint+';--btn:'+D.btn+';--accent:'+D.accent+';--accent-soft:'+D.accentSoft+';--tag-bg:'+D.tagBg+';--tag-text:'+D.tagText+'}'+
      '*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:inherit;min-height:100vh;transition:background .3s,color .3s}'+
      '.bar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:64px;border-bottom:1px solid var(--line)}'+
      '.brand{font-size:24px;font-weight:800}.brand span{color:var(--accent)}'+
      '.toggle{padding:6px 16px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--text);font-family:inherit}'+
      '.hero{max-width:700px;margin:60px auto;text-align:center;padding:0 24px}'+
      '.tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;padding:3px 12px;border-radius:999px;margin-bottom:14px;background:var(--tag-bg);color:var(--tag-text)}'+
      'h1{font-size:56px;font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin:0 0 12px}'+
      'h1 em{font-style:normal;color:var(--accent)}'+
      '.hp{font-size:17px;color:var(--text-soft);line-height:1.6;max-width:480px;margin:0 auto 24px}'+
      '.btn{display:inline-block;padding:14px 32px;border-radius:var(--radius-btn);background:var(--btn);color:var(--bg);font-size:15px;font-weight:600;cursor:pointer;border:none;font-family:inherit}'+
      '.panel{max-width:600px;margin:0 auto 40px;padding:40px;border-radius:var(--radius-panel);background:var(--panel);border:2px solid var(--line-strong)}'+
      '.panel h3{font-size:24px;font-weight:600;margin:0 0 8px;letter-spacing:-.03em}'+
      '.panel p{font-size:13px;color:var(--text-soft);line-height:1.6;margin:0}'+
      '.info{text-align:center;font-size:12px;color:var(--text-faint);padding:20px}'+
      '</style></head><body data-theme="light"><script>'+
      'var b=document.documentElement;function toggle(){var t=b.getAttribute("data-theme")==="dark"?"light":"dark";b.setAttribute("data-theme",t)}'+
      '<\\/script>'+
      '<div class="bar"><div class="brand">sotto<span>titoli</span></div><button class="toggle" onclick="toggle()">Light / Dark</button></div>'+
      '<div class="hero"><div class="tag">Sottotitoli</div><h1>Tutto chiaro.<br><em>Sempre. Subito.</em></h1><p class="hp">Aquatic Awe light + <strong>'+v.name+'</strong> dark.</p><button class="btn">Inizia gratis</button></div>'+
      '<div class="panel"><h3>La tua voce, in tutte le sue parti</h3><p>Scomponiamo il tuo parlato in decine di indicatori. Uno strumento che unisce comprensione e autoanalisi.</p></div>'+
      '<div class="info">Light: Aquatic Awe &nbsp;·&nbsp; Dark: <strong>'+v.name+'</strong> (#0'+v.n+') &nbsp;·&nbsp; Click "Light / Dark" to toggle</div>'+
      '</body></html>');
    w.document.close();
  });
  grid.appendChild(card);
});
</script>
</body>
</html>
