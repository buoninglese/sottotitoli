<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Confronto · 30 Wild Variations</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0d14;--bg2:#12151e;--card:#161922;--line:#232836;--text:#e8eaed;--t2:#c4c9d4;--t3:#5f6b7a;--a:#a78bfa;--g:#34d399;--b:#60a5fa;--am:#fbbf24;--r:#f87171}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:24px}
h1{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:-.5px;margin-bottom:4px}h1 em{color:var(--a);font-style:normal}
.sub{font-size:13px;color:var(--t2);margin-bottom:16px}
.back{display:inline-block;margin-bottom:16px;color:var(--a);text-decoration:none;font-size:13px;font-weight:500}
.top-tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.top-tabs button{padding:7px 16px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.top-tabs button:hover{border-color:var(--a);color:var(--a)}
.top-tabs button.active{background:var(--a);color:#fff;border-color:var(--a)}
.layout{display:flex;gap:14px;align-items:flex-start}
@media(max-width:860px){.layout{flex-direction:column}}
.nav-col{width:190px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;position:sticky;top:24px;max-height:80vh;overflow-y:auto}
@media(max-width:860px){.nav-col{width:100%;position:static;flex-direction:row;flex-wrap:wrap;max-height:none}}
.nav-btn{padding:6px 10px;border-radius:6px;font-size:10px;font-weight:500;border:1px solid transparent;background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;text-align:left;transition:all .12s}
.nav-btn:hover{background:var(--card);color:var(--text)}
.nav-btn.active{background:var(--card);border-color:var(--line);color:var(--text);font-weight:600}
.nav-btn .n{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--a);margin-right:3px}
.pv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;overflow:hidden;transition:all .3s;margin-bottom:12px}
.pv:hover{border-color:rgba(167,139,250,.2);box-shadow:0 6px 24px rgba(0,0,0,.3);transform:translateY(-2px)}
.pv::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,var(--a),transparent 70%);opacity:.04;pointer-events:none;border-radius:10px}
.pv .pn{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--a);font-weight:700;margin-bottom:8px}
.card-h3{font-size:18px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.mono{font-family:'JetBrains Mono',monospace}
.chip-row{display:flex;gap:4px}
.chip{padding:6px 14px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit}
.chip.active{background:var(--a);color:#fff;border-color:var(--a)}
.delta{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:100px;font-size:10px;font-weight:600}
.d-up{background:rgba(52,211,153,.1);color:var(--g)}.d-down{background:rgba(248,113,113,.1);color:var(--r)}
</style>
</head>
<body>
<a href="account.html" class="back">← Back to Account</a>
<h1>Confronto <em>Wild Variations</em></h1>
<p class="sub">30 radically different designs. 3 base types × 10 distinct visual styles each.</p>
<div class="top-tabs" id="topTabs"></div>
<div class="layout"><div class="nav-col" id="navCol"></div><div class="preview-area" id="previewArea"></div></div>
<script>
var D={sessions:{val:187,prev:167,delta:12,up:true},talk:{val:'42h',prev:'39h',delta:8,up:true},words:{val:'12.4k',prev:'12.8k',delta:3,up:false}};
function dl(d){return'<span class="delta '+(d.up?'d-up':'d-down')+'">'+(d.up?'↑':'↓')+' '+d.delta+'%</span>';}
function hdr(){return'<div class="card-h3">📊 Confronto <span style="font-weight:400;font-size:11px;color:var(--t3);margin-left:auto"><span class="chip active">Mese</span><span class="chip">Settimana</span></span></div>';}

var bases=[
  {name:'3-Column',group:'Stat Cards',fn:function(s){return hdr()+s;}},
  {name:'Sparkline',group:'Trend Lines',fn:function(s){return hdr()+s;}},
  {name:'Table',group:'Data Table',fn:function(s){return hdr()+s;}}
];

var styles=[
  function(){return'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">'+[{l:'Sessioni',d:D.sessions,c:'var(--a)'},{l:'Tempo parlato',d:D.talk,c:'var(--g)'},{l:'Parole uniche',d:D.words,c:'var(--b)'}].map(function(x){return'<div style="text-align:center;padding:12px"><div class="mono" style="font-size:32px;font-weight:800;color:'+x.c+'">'+x.d.val+'</div><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin:4px 0">'+x.l+'</div>'+dl(x.d)+'</div>';}).join('')+'</div>';},
  function(){return'<div style="display:flex;flex-direction:column;gap:8px">'+[{l:'Sessioni',d:D.sessions,c:'var(--a)'},{l:'Tempo',d:D.talk,c:'var(--g)'},{l:'Parole',d:D.words,c:'var(--b)'}].map(function(x){var pct=50+(x.d.up?x.d.delta*1.5:-x.d.delta*1.5);return'<div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:var(--t2)">'+x.l+'</span><span class="mono" style="color:'+x.c+'">'+x.d.val+' · '+dl(x.d)+'</span></div><div style="height:18px;background:var(--line);border-radius:9px;overflow:hidden;display:flex"><div style="width:'+pct+'%;background:'+x.c+';border-radius:9px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:8px;color:#000">questo mese</div></div></div>';}).join('')+'</div>';},
  function(){return'<div style="display:flex;gap:16px;flex-wrap:wrap">'+[{l:'Sessioni',d:D.sessions,c:'var(--a)'},{l:'Tempo',d:D.talk,c:'var(--g)'},{l:'Parole',d:D.words,c:'var(--b)'}].map(function(x){return'<div style="flex:1;min-width:150px;text-align:center;background:var(--bg2);border-radius:12px;padding:18px"><div style="font-size:36px">'+(x.d.up?'📈':'📉')+'</div><div class="mono" style="font-size:24px;font-weight:800;color:'+x.c+'">'+x.d.val+'</div><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em">'+x.l+'</div>'+dl(x.d)+'<div style="font-size:10px;color:var(--t3);margin-top:4px">vs '+x.d.prev+'</div></div>';}).join('')+'</div>';},
  function(){return'<div style="display:flex;flex-direction:column;gap:16px">'+[{l:'Sessioni',d:D.sessions,c:'var(--a)'},{l:'Tempo parlato',d:D.talk,c:'var(--g)'},{l:'Parole uniche',d:D.words,c:'var(--b)'}].map(function(x,i){return'<div style="display:flex;align-items:center;gap:12px"><span style="font-size:12px;font-weight:600;color:var(--t2);width:90px">'+x.l+'</span><span class="mono" style="font-size:22px;font-weight:800;color:'+x.c+';width:60px">'+x.d.val+'</span><svg viewBox="0 0 100 20" style="width:100px;height:20px;flex:1"><polyline points="'+Array(10).fill(0).map(function(_,j){return(j*11)+','+(x.d.up?18-j*1.6:2+j*1.6)}).join(' ')+'" fill="none" stroke="'+x.c+'" stroke-width="2" stroke-linecap="round"/></svg>'+dl(x.d)+'</div>';}).join('')+'</div>';},
  function(){return'<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'+[{d:D.sessions,c:'var(--a)'},{d:D.talk,c:'var(--g)'},{d:D.words,c:'var(--b)'}].map(function(x){var pct=50+(x.d.up?x.d.delta*2:-x.d.delta*2);return'<div style="text-align:center;position:relative;width:90px;height:90px"><svg viewBox="0 0 90 90" style="width:90px;height:90px;transform:rotate(-90deg)"><circle cx="45" cy="45" r="36" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="45" cy="45" r="36" fill="none" stroke="'+x.c+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="'+(226-pct/100*226)+'"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="mono" style="font-size:14px;font-weight:800;color:'+x.c+'">'+x.d.val+'</span>'+dl(x.d)+'</div></div>';}).join('')+'</div>';},
  function(){return'<div style="display:flex;align-items:flex-end;gap:16px;height:120px;justify-content:center">'+[{d:D.sessions,c:'var(--a)',l:'Sessioni'},{d:D.talk,c:'var(--g)',l:'Tempo'},{d:D.words,c:'var(--b)',l:'Parole'}].map(function(x){var h=40+(x.d.up?x.d.delta*2.5:30-x.d.delta*2);return'<div style="text-align:center"><div class="mono" style="font-size:12px;color:'+x.c+'">'+x.d.val+'</div><div style="width:40px;height:'+h+'px;background:'+x.c+';border-radius:6px 6px 0 0;margin:4px auto 0;opacity:.8"></div><div style="width:40px;height:'+(120-h)+'px;background:var(--line);border-radius:0;margin:0 auto;opacity:.3"></div><div style="font-size:9px;color:var(--t3);margin-top:4px">'+x.l+'</div></div>';}).join('')+'</div>';},
  function(){return'<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="color:var(--t3);font-size:10px;text-transform:uppercase;letter-spacing:.06em"><th style="text-align:left;padding:10px 14px">Metrica</th><th style="text-align:right;padding:10px 14px">Questo mese</th><th style="text-align:right;padding:10px 14px">Scorso</th><th style="text-align:right;padding:10px 14px">Δ</th></tr>'+[{l:'Sessioni',d:D.sessions,c:'var(--a)'},{l:'Tempo parlato',d:D.talk,c:'var(--g)'},{l:'Parole uniche',d:D.words,c:'var(--b)'}].map(function(x){return'<tr style="border-top:1px solid var(--line)" onmouseover="this.style.background=\'var(--bg2)\'" onmouseout="this.style.background=\'\'"><td style="padding:12px 14px;font-weight:600">'+x.l+'</td><td class="mono" style="text-align:right;padding:12px 14px;font-weight:700;color:'+x.c+'">'+x.d.val+'</td><td class="mono" style="text-align:right;padding:12px 14px;color:var(--t3)">'+x.d.prev+'</td><td style="text-align:right;padding:12px 14px">'+dl(x.d)+'</td></tr>';}).join('')+'</table>';},
  function(){return'<div style="display:flex;gap:14px;flex-wrap:wrap">'+[{l:'Sessioni',d:D.sessions,c:'var(--a)'},{l:'Tempo',d:D.talk,c:'var(--g)'},{l:'Parole',d:D.words,c:'var(--b)'}].map(function(x){return'<div style="flex:1;min-width:160px;background:var(--bg2);border-radius:12px;padding:18px;border-left:3px solid '+x.c+'"><div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">'+x.l+'</div><div class="mono" style="font-size:28px;font-weight:800;color:'+x.c+'">'+x.d.val+'</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span style="font-size:10px;color:var(--t3)">vs '+x.d.prev+'</span>'+dl(x.d)+'</div></div>';}).join('')+'</div>';},
  function(){return'<div style="display:flex;gap:24px;flex-wrap:wrap;justify-content:center">'+[{l:'Sessioni',d:D.sessions,c:'var(--a)'},{l:'Tempo',d:D.talk,c:'var(--g)'},{l:'Parole',d:D.words,c:'var(--b)'}].map(function(x){return'<div style="text-align:center"><div style="font-size:44px;font-weight:900;letter-spacing:-2px;color:'+x.c+';line-height:1">'+x.d.val+'</div><div style="font-size:11px;color:var(--t2)">'+x.l+'</div>'+dl(x.d)+'</div>';}).join('')+'</div>';},
  function(){return'<div style="display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:10px;overflow:hidden">'+[{l:'Sessioni',d:D.sessions,c:'var(--a)'},{l:'Tempo parlato',d:D.talk,c:'var(--g)'},{l:'Parole uniche',d:D.words,c:'var(--b)'}].map(function(x,i){return'<div style="display:flex;align-items:center;padding:14px 16px;background:var(--card);gap:12px"><span style="font-size:20px">'+(i+1)+'</span><span style="font-size:13px;font-weight:600;flex:1">'+x.l+'</span><span class="mono" style="font-size:18px;font-weight:800;color:'+x.c+'">'+x.d.val+'</span><span style="font-size:11px;color:var(--t3)">vs '+x.d.prev+'</span>'+dl(x.d)+'</div>';}).join('')+'</div>';}
];

var proposals=[];
bases.forEach(function(b,bi){
  for(var i=0;i<10;i++)proposals.push({html:'<span class="pn">#'+(bi*10+i+1)+' · '+b.name+' · Style '+(i+1)+'</span>'+b.fn(styles[i]()),group:b.group,base:b.name});
});

var topTabs=document.getElementById('topTabs');
var navCol=document.getElementById('navCol');
var previewArea=document.getElementById('previewArea');
var current=0;

bases.forEach(function(b,bi){
  var tb=document.createElement('button');tb.textContent=b.group+' · '+b.name;tb.dataset.base=bi;
  if(bi===0)tb.classList.add('active');
  tb.addEventListener('click',function(){current=parseInt(this.dataset.base)*10;document.querySelectorAll('.top-tabs button').forEach(function(x){x.classList.remove('active')});this.classList.add('active');show();buildNav();});
  topTabs.appendChild(tb);
});

function buildNav(){
  var bi=Math.floor(current/10);
  navCol.innerHTML='';
  for(var i=0;i<10;i++){
    var btn=document.createElement('button');btn.className='nav-btn'+(i===current%10?' active':'');
    var names=['Stat Cards','Bar Compare','Icon Cards','Sparklines','Donut %','Bar Chart','Table','Side Cards','Massive Type','Ranked List'];
    btn.innerHTML='<span class="n">#'+(bi*10+i+1)+'</span>'+names[i];
    btn.addEventListener('click',function(){current=bi*10+parseInt(this.querySelector('.n').textContent.replace('#',''))-1;show();buildNav();});
    navCol.appendChild(btn);
  }
}

function show(){
  var p=proposals[current];
  previewArea.innerHTML='<div class="pv">'+p.html+'</div><div class="pv"><div style="font-size:9px;color:var(--t3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em">Clean view</div>'+p.html.replace(/<span class="pn">.*?<\/span>/,'')+'</div>';
}

buildNav();show();
</script>
</body>
</html>
