<!doctype html>
<html lang="it" data-theme="dark" class="font-crisp">
<head>
<meta charset="utf-8">
<title>Live Box · Sottotitoli</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&family=Geist+Mono:wght@300;400;500;600;700&family=DM+Serif+Display&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ═══ CSS VARIABLES — exact replica from caption-s8t.html ═══ */
:root {
  --bg: #f8fafc; --bg-2: #f1f5f9; --bg2: #f1f5f9;
  --line: #e2e8f0; --text: #1a1a1a; --muted: #3d5260; --muted2: #71899e;
  --accent: #06b6d4; --accent2: #0891b2; --good: #16a34a; --warn: #d97706; --danger: #dc2626;
  --glow: rgba(6,182,212,.04); --gauge-bg: #e2e8f0; --panel-bg: #ffffff;
  --card: #ffffff; --card2: #f8fafc;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
.font-crisp {
  --font-live: 'Inter', sans-serif; --font-live-weight: 500;
  --font-live-size: clamp(28px, 4.5vw, 40px); --font-live-ls: 0; --font-live-lh: 1.15;
  --font-tx: 'Inter', sans-serif; --font-tx-weight: 400; --font-tx-size: 15px; --font-tx-lh: 1.7;
}

:root {
  --cap-v5-color: #1a1a1a; --cap-v5-panel-bg: rgba(0,0,0,.03); --cap-v5-panel-border: rgba(0,0,0,.06);
  --cap-v6-color: #1a1a1a; --cap-v6-panel-bg: rgba(255,255,255,.92); --cap-v6-shadow: 0 0 40px rgba(0,0,0,.08);
  --cap-v7-color: #1a1a1a; --cap-v7-stroke-color: rgba(180,185,195,.5); --cap-v7-stroke-width: 2px;
}
[data-theme="dark"] {
  --bg: #0d1114; --bg-2: #050810; --bg2: #0d1114;
  --line: #1a1c24; --text: #e8e5df; --muted: #a0c0d4; --muted2: #6b8a9e;
  --accent: #38bdf8; --accent2: #7dd3fc;
  --glow: rgba(56,189,248,.08); --gauge-bg: #1a1c24; --panel-bg: #18232e;
  --card: #1a1d26; --card2: #15181f;
  --cap-v5-color: #fff; --cap-v5-panel-bg: rgba(255,255,255,.06); --cap-v5-panel-border: rgba(255,255,255,.08);
  --cap-v6-color: #fafafa; --cap-v6-panel-bg: rgba(10,10,14,.88); --cap-v6-shadow: 0 0 40px rgba(0,0,0,.3);
  --cap-v7-color: #facc15; --cap-v7-stroke-color: rgb(10,10,10); --cap-v7-stroke-width: 3px;
}

/* ═══ LIVE CAPTION VARIANTS ═══ */
.cap-var6 .caption-panel { background: var(--cap-v6-panel-bg) !important; border-color: transparent !important; box-shadow: var(--cap-v6-shadow) !important; border-radius: 99px !important; }
.cap-var6 .caption-interim { color: var(--cap-v6-color); background: transparent; text-shadow: none; -webkit-text-stroke: 0; font-weight: 600; }
.cap-var6 .caption-interim:empty::after { color: var(--cap-v6-color); }
.cap-var7 .caption-panel { background: transparent !important; border-color: transparent !important; box-shadow: none !important; }
.cap-var7 .caption-interim { color: var(--cap-v7-color); background: transparent; -webkit-text-stroke: var(--cap-v7-stroke-width) var(--cap-v7-stroke-color); paint-order: stroke fill; text-shadow: none; font-weight: 400; }
.cap-var7 .caption-interim:empty::after { color: var(--cap-v7-color); -webkit-text-stroke: 0; }
.cap-var5 .caption-panel { background: var(--cap-v5-panel-bg) !important; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-color: var(--cap-v5-panel-border) !important; box-shadow: none !important; }
.cap-var5 .caption-interim { color: var(--cap-v5-color); background: transparent; text-shadow: none; -webkit-text-stroke: 0; font-weight: 500; }
.cap-var5 .caption-interim:empty::after { color: var(--cap-v5-color); }

body {
  font-family: var(--font-body), system-ui, sans-serif;
  color: var(--text);
  display: flex; flex-direction: column;
  height: 100dvh; overflow: hidden;
  -webkit-font-smoothing: antialiased;
  background: radial-gradient(circle at top left,rgba(255,255,255,.35),transparent 32%),linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
  transition: background .4s, color .4s;
}

/* ═══ TOP BAR ═══ */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 32px 12px; background: transparent; flex-shrink: 0; }
.topbar-brand { font-size: 31px; font-family: 'Manrope', sans-serif; font-weight: 700; text-decoration: none; letter-spacing: -0.02em; color: var(--text); }
.topbar-brand span { color: var(--accent); }
.topbar-tools { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all .2s; }
.icon-btn:hover { background: rgba(128,128,128,.08); color: var(--text); }

/* ═══ STATUS PILLS ═══ */
.status-strip { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; flex-shrink: 0; padding: 4px 0; }
.s-pill { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 100px; font-size: 13px; font-weight: 500; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.s-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted2); flex-shrink: 0; }
.s-pill .dot.live { background: var(--good); box-shadow: 0 0 6px var(--good); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ═══ TRANSCRIPT BOX (above, scrollable) ═══ */
.transcript-area {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 24px 28px; margin: 14px;
  position: relative;
  scrollbar-width: none; -ms-overflow-style: none;
}
.transcript-area::-webkit-scrollbar { display: none; }

.caption-transcript {
  font-family: var(--font-tx); font-size: var(--font-tx-size);
  font-weight: var(--font-tx-weight); line-height: var(--font-tx-lh);
  color: var(--muted);
  flex: 1; min-height: 0;
}
.caption-transcript:empty::after {
  content: attr(data-placeholder);
  color: var(--muted2); font-size: 15px; text-align: center;
  display: block; padding: 40px 20px;
}

/* ═══ V20Q CONTENT ═══ */
.v20q-content {
  display: flex; flex-direction: column; justify-content: flex-end;
  gap: 6px; flex: 1 1 auto; min-height: 100%; overflow-y: auto;
  scroll-behavior: smooth; padding: 6px 0;
  max-width: 780px; align-self: center; width: 100%;
  scrollbar-width: none; -ms-overflow-style: none;
}
.v20q-content::-webkit-scrollbar { display: none; }

/* ── CAP1: Minimal — time + text, hover accent ── */
.v20q-cap1 .v20q-line { display:flex; align-items:flex-start; gap:14px; padding:6px 10px; opacity:1; animation:v20qIn .4s cubic-bezier(.16,1,.3,1) forwards; position:relative; border-left:3px solid transparent; transition:border-color .15s; }
.v20q-cap1 .v20q-line:hover { border-left-color:rgba(56,189,248,.25); }
.v20q-cap1 .v20q-meta { display:inline-flex; align-items:center; gap:4px; flex-shrink:0; width:52px; justify-content:flex-end; }
.v20q-cap1 .v20q-time { font-size:13px; color:var(--muted); font-family:var(--font-mono); font-weight:500; }
.v20q-cap1 .v20q-text { flex:1; font-size:20px; line-height:1.5; min-width:0; word-break:break-word; overflow-wrap:break-word; }

/* ── CAP5: Dashboard Air — floating cards ── */
.v20q-cap5 .v20q-line { display:flex; align-items:flex-start; gap:24px; padding:18px 24px; border-radius:14px; opacity:1; animation:v20qInS .65s cubic-bezier(.16,1,.3,1) forwards; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.04); position:relative; box-shadow:0 2px 8px rgba(0,0,0,.1); transition:box-shadow .3s ease; }
.v20q-cap5 .v20q-line:hover { box-shadow:0 4px 16px rgba(0,0,0,.18); }
[data-theme="light"] .v20q-cap5 .v20q-line { background:rgba(0,0,0,.01); border:1px solid rgba(0,0,0,.06); }
.v20q-cap5 .v20q-text { flex:1; font-size:20px; line-height:1.5; padding:10px 14px; background:rgba(255,255,255,.015); border-radius:8px; border:1px solid var(--line); transition:border-color .2s; min-width:0; word-break:break-word; overflow-wrap:break-word; }
.v20q-cap5 .v20q-line:hover .v20q-text { border-color:rgba(56,189,248,.15); }
.v20q-cap5 .v20q-meta { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; min-width:80px; }
.v20q-cap5 .v20q-meta .v20q-act { position:static; opacity:1; margin:0; gap:4px; }

/* ── Shared: word spans ── */
.v20q-w { display:inline-block; padding:0 1px; border-radius:2px; border:1px solid transparent; transition:all .1s; }
.v20q-w:hover { border-color:rgba(56,189,248,.25); background:rgba(56,189,248,.04); }

/* ── Shared: action buttons ── */
.v20q-act { display:flex; gap:4px; flex-shrink:0; align-items:center; opacity:.35; transition:opacity .15s; margin-left:6px; }
.v20q-line:hover .v20q-act { opacity:1; }
.v20q-act button { width:28px; height:28px; border-radius:50%; border:1px solid rgba(128,128,128,.2); background:rgba(128,128,128,.05); color:var(--muted2); cursor:pointer; font-size:11px; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.v20q-act button:hover { border-color:var(--accent); color:var(--accent); background:rgba(124,58,237,.08); }
.v20q-act .v20q-del:hover { border-color:var(--danger); color:var(--danger); background:rgba(239,68,68,.08); }

/* ── Animations ── */
@keyframes v20qIn { 0%{opacity:0;transform:translateY(14px)} 100%{opacity:1;transform:translateY(0)} }
@keyframes v20qInS { 0%{opacity:0;transform:scale(.94)} 100%{opacity:1;transform:scale(1)} }

/* ═══ LIVE CAPTION BOX (bottom, separate) ═══ */
.live-bar {
  flex-shrink: 0; padding: 0 14px 18px 14px;
  background: var(--bg);
}
.caption-panel {
  background: var(--panel-bg, var(--card));
  border: 2px solid var(--line);
  border-radius: 34px; padding: 14px 24px;
  box-shadow: 0 4px 32px rgba(0,0,0,.06);
  position: relative; transition: all .4s;
}
.caption-interim {
  text-align: center; min-height: 150px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-live);
  font-size: var(--font-size-override, var(--font-live-size));
  font-weight: var(--font-live-weight);
  letter-spacing: var(--font-live-ls);
  line-height: var(--font-live-lh);
  color: var(--text);
  word-break: break-word; transition: all .3s;
}
.caption-interim:empty::after {
  content: attr(data-placeholder);
  color: var(--text); opacity: .4;
  font-family: var(--font-live);
  font-weight: var(--font-live-weight);
  font-size: clamp(18px, 3vw, var(--font-live-size));
}

/* ═══ LIVE TOOLS (top-right of live box) ═══ */
.live-tools {
  position: absolute; top: 10px; right: 14px;
  display: flex; align-items: center; gap: 6px; z-index: 5;
}
.tool-btn {
  font-size: 13px; padding: 5px 10px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  cursor: pointer; font-family: var(--font-body);
  display: flex; align-items: center; gap: 4px; transition: all .15s;
}
.tool-btn:hover { border-color: var(--accent); color: var(--text); }
.tool-btn.on { color: var(--accent); border-color: var(--accent); }
.tool-btn-icon {
  font-size: 14px; padding: 4px 6px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  cursor: pointer; transition: all .15s;
}
.tool-btn-icon:hover { border-color: var(--accent); color: var(--text); }

/* ═══ ACTION BUTTONS ═══ */
.btn-grad {
  font-family: var(--font-body); font-size: 12px; font-weight: 700;
  padding: 10px 24px; border-radius: 8px; border: 1.5px solid transparent;
  cursor: pointer; transition: all .2s;
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; white-space: nowrap;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.btn-grad i { font-size: 15px; }
.btn-start { background: rgba(34,197,94,.12); color: #22c55e; border-color: rgba(34,197,94,.25); }
.btn-start:hover { background: rgba(34,197,94,.2); border-color: #22c55e; transform: translateY(-1px); }
.btn-stop { background: rgba(239,68,68,.12); color: #ef4444; border-color: rgba(239,68,68,.25); }
.btn-stop:hover { background: rgba(239,68,68,.2); border-color: #ef4444; transform: translateY(-1px); }
.btn-pause { background: rgba(245,158,11,.12); color: #f59e0b; border-color: rgba(245,158,11,.25); }
.btn-pause:hover { background: rgba(245,158,11,.2); border-color: #f59e0b; transform: translateY(-1px); }
.btn-pause.paused { background: rgba(245,158,11,.2); color: #fbbf24; border-color: rgba(251,191,36,.4); }
[data-theme="light"] .btn-start { background: rgba(34,197,94,.1); }
[data-theme="light"] .btn-start:hover { background: rgba(34,197,94,.18); }
[data-theme="light"] .btn-stop { background: rgba(239,68,68,.1); }
[data-theme="light"] .btn-stop:hover { background: rgba(239,68,68,.18); }
[data-theme="light"] .btn-pause { background: rgba(245,158,11,.1); }
[data-theme="light"] .btn-pause:hover { background: rgba(245,158,11,.18); }

.action-bar {
  display: flex; gap: 8px; flex-shrink: 0; justify-content: center;
  padding: 10px 0 0; align-items: center;
}
.rec-timer {
  font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600;
  color: var(--text); min-width: 48px; text-align: center;
}

/* ═══ TRANSCRIPT TOOLS BAR ═══ */
.transcript-tools {
  position: absolute; top: 12px; right: 12px; z-index: 100;
  display: flex; align-items: center; gap: 6px;
}

@media (max-width: 700px) {
  .transcript-area { padding: 12px; margin: 8px; }
  .topbar { padding: 12px 16px 8px; }
}
</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;overflow:hidden">

<!-- ═══ TOP BAR ═══ -->
<header class="topbar">
  <a href="index.html" class="topbar-brand">sottotitoli<span>.pro</span></a>
  <div class="topbar-tools">
    <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </div>
</header>

<!-- ═══ STATUS STRIP ═══ -->
<div class="status-strip">
  <div class="s-pill"><span class="dot" id="wsDot"></span><span id="wsLabel">WS —</span></div>
  <div class="s-pill"><span class="dot" id="micDot"></span><span id="micLabel">Mic Off</span></div>
  <div class="s-pill" style="gap:4px"><span style="font-size:11px">⚡</span><span id="wordCount">0 parole</span></div>
</div>

<!-- ═══ TRANSCRIPT BOX — above, scrollable ═══ -->
<div class="transcript-area" id="transcriptArea">
  <!-- Palette style toggle — fixed top-right -->
  <div class="transcript-tools">
    <button type="button" class="icon-btn" id="styleCycleBtn" aria-label="Cycle caption style" title="Cycle caption style" onclick="cycleCaptionStyle()" style="font-size:15px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:50%;width:34px;height:34px"><i class="fas fa-palette"></i></button>
  </div>

  <div class="caption-transcript" id="captionTranscript" data-placeholder="Previous sentences will appear here…">
    <div class="v20q-content v20q-cap1" id="v20qContent"></div>
  </div>
</div>

<!-- ═══ LIVE CAPTION BOX — bottom, separate, always visible ═══ -->
<div class="live-bar">
  <div class="caption-panel" id="captionPanel">
    <div class="live-tools">
      <button class="tool-btn" id="fontSizeBtn" onclick="cycleFontSize()" title="Font size: 45 → 55 → 65">
        A<span id="fontSizeLabel" style="font-weight:700;color:var(--text)">55</span>
      </button>
      <button class="tool-btn" id="magicFixBtn" onclick="toggleMagicFix()" title="Magic Fix">
        <i class="fas fa-wand-magic-sparkles" style="font-size:11px"></i>
        <span id="magicFixLabel" style="font-size:11px;font-weight:600">Fix</span>
      </button>
      <button class="tool-btn-icon" id="liveStyleBtn" onclick="cycleLiveStyle()" title="Cycle live caption style">
        <i class="fas fa-palette"></i>
      </button>
    </div>
    <div class="caption-interim" id="captionInterim" data-placeholder="Speak to see subtitles…"></div>
  </div>
  <div class="action-bar">
    <button class="btn-grad btn-start" id="startBtn" onclick="toggleMic()"><i class="fas fa-microphone"></i>Ascolta</button>
    <button class="btn-grad btn-pause" id="pauseBtn" style="display:none" onclick="togglePause()"><i class="fas fa-pause"></i>Pausa</button>
    <span class="rec-timer" id="recTimer">00:00</span>
    <button class="btn-grad btn-stop" id="stopBtn" style="display:none" onclick="stopMic()"><i class="fas fa-stop"></i>Stop</button>
  </div>
</div>

<script src="config.js"></script>
<script>
// ── Room + WebSocket ──
var ROOM_ID = 'mockup-' + Date.now().toString(36);
var WS_URL = (window.SOTTOTITOLI_CONFIG && window.SOTTOTITOLI_CONFIG.websocketUrl) || 'wss://sottotitoli-websocket.onrender.com';
var ws = null, msgCounter = 0, sentenceCount = 0;

function connectWS() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = function() { ws.send(JSON.stringify({ type: 'join', room: ROOM_ID })); updateWS('connected'); };
    ws.onclose = function() { updateWS('closed'); };
    ws.onerror = function() { updateWS('error'); };
    ws.onmessage = function(e) {
      try { var d = JSON.parse(e.data); if (d.interm) showInterim(d.interm); if (d.final) showFinal(d.final); } catch(ex) {}
    };
  } catch(e) { updateWS('error'); }
}

function updateWS(state) {
  var dot = document.getElementById('wsDot'), label = document.getElementById('wsLabel');
  if (state === 'connected') { dot.className = 'dot live'; label.textContent = 'WS ✓'; }
  else if (state === 'closed') { dot.className = 'dot'; label.textContent = 'WS ✗'; }
  else { dot.className = 'dot'; label.textContent = 'WS —'; }
}

// ── Microphone ──
var recognition = null, isRecording = false, paused = false, timerInterval = null, seconds = 0, totalWords = 0;

function toggleMic() { isRecording ? stopMic() : startMic(); }

function startMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) { alert('Use Chrome for speech recognition.'); return; }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = true; recognition.interimResults = true;
  recognition.lang = localStorage.getItem('sottotitoli-caption-lang') || 'en-US';
  recognition.onresult = function(e) {
    var interim = '', final = '';
    for (var i = e.resultIndex; i < e.results.length; i++) { var r = e.results[i]; if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript; }
    if (interim) showInterim(interim);
    if (final) { showFinal(final); msgCounter++; broadcast(final); }
  };
  recognition.onerror = function(e) { console.error('SR:', e.error); stopMic(); };
  recognition.onend = function() { if (isRecording && !paused) { try { recognition.start(); } catch(ex) {} } };
  try { recognition.start(); } catch(ex) { return; }
  isRecording = true; paused = false;
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('pauseBtn').style.display = ''; document.getElementById('pauseBtn').classList.remove('paused');
  document.getElementById('stopBtn').style.display = '';
  document.getElementById('micDot').classList.add('live'); document.getElementById('micLabel').textContent = 'Live';
  document.getElementById('captionInterim').textContent = '';
  seconds = 0; updateTimer(); timerInterval = setInterval(updateTimer, 1000);
  connectWS();
}

function stopMic() {
  isRecording = false; paused = false;
  if (recognition) { try { recognition.stop(); } catch(ex) {} }
  clearInterval(timerInterval);
  document.getElementById('startBtn').style.display = ''; document.getElementById('pauseBtn').style.display = 'none'; document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('micDot').classList.remove('live'); document.getElementById('micLabel').textContent = 'Mic Off';
  document.getElementById('recTimer').textContent = '00:00';
}

function togglePause() {
  paused = !paused;
  var btn = document.getElementById('pauseBtn');
  if (paused) { btn.classList.add('paused'); btn.innerHTML = '<i class="fas fa-play"></i>Riprendi'; document.getElementById('micDot').classList.remove('live'); document.getElementById('micLabel').textContent = 'Paused'; clearInterval(timerInterval); }
  else { btn.classList.remove('paused'); btn.innerHTML = '<i class="fas fa-pause"></i>Pausa'; document.getElementById('micDot').classList.add('live'); document.getElementById('micLabel').textContent = 'Live'; updateTimer(); timerInterval = setInterval(updateTimer, 1000); }
}

function updateTimer() { var m = Math.floor(seconds / 60), s = seconds % 60; document.getElementById('recTimer').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); seconds++; }

function broadcast(text) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'msg', msg: true, final: text, id: msgCounter, label: 'speaker', room: ROOM_ID })); }

// ── Live caption display ──
function showInterim(text) {
  var el = document.getElementById('captionInterim'); if (!el) return;
  el.textContent = formatCaption(text, 50, 3);
}

function showFinal(text) {
  var el = document.getElementById('captionInterim'); if (!el) return;
  el.textContent = formatCaption(text, 50, 3);
  // Add to transcript with v20q structure
  addTranscriptLine(text);
  setTimeout(function() { if (!isRecording) el.textContent = ''; }, 3000);
}

function formatCaption(text, maxChars, maxLines) {
  if (!text) return ''; var words = text.trim().split(/\s+/), lines = [], current = '';
  for (var i = 0; i < words.length; i++) { var w = words[i], test = current ? current + ' ' + w : w; if (test.length <= maxChars) current = test; else { if (current) lines.push(current); current = w.length > maxChars ? w.substring(0, maxChars) : w; } }
  if (current) lines.push(current); while (lines.length > maxLines) lines.shift();
  return lines.join('\n');
}

// ── Transcript: render finalized sentence as v20q-line ──
function addTranscriptLine(text) {
  var container = document.getElementById('v20qContent'); if (!container) return;
  var words = text.trim().split(/\s+/).filter(Boolean);
  totalWords += words.length;
  document.getElementById('wordCount').textContent = totalWords + ' parole';
  sentenceCount++;
  var ts = new Date().toTimeString().substring(0,5);
  var style = localStorage.getItem('sottotitoli-caption-style') || 'cap1';

  var line = document.createElement('div'); line.className = 'v20q-line';

  // Meta: timestamp
  var meta = document.createElement('span'); meta.className = 'v20q-meta';
  if (style === 'cap5') {
    var num = document.createElement('span'); num.className = 'v20q-num'; num.textContent = String(sentenceCount).padStart(2,'0');
    var time = document.createElement('span'); time.className = 'v20q-time'; time.textContent = ts;
    meta.appendChild(num); meta.appendChild(time);
  } else {
    var time = document.createElement('span'); time.className = 'v20q-time'; time.textContent = ts;
    meta.appendChild(time);
  }
  line.appendChild(meta);

  // Text: word spans
  var textEl = document.createElement('span'); textEl.className = 'v20q-text';
  words.forEach(function(w) {
    var span = document.createElement('span'); span.className = 'v20q-w'; span.textContent = w;
    textEl.appendChild(span);
    textEl.appendChild(document.createTextNode(' '));
  });
  line.appendChild(textEl);

  // Actions: copy + delete
  var act = document.createElement('span'); act.className = 'v20q-act';
  var copyBtn = document.createElement('button'); copyBtn.className = 'v20q-copy'; copyBtn.title = 'Copy'; copyBtn.innerHTML = '<i class="fas fa-copy"></i>';
  copyBtn.onclick = function(e) { e.stopPropagation(); navigator.clipboard.writeText(text); };
  var delBtn = document.createElement('button'); delBtn.className = 'v20q-del'; delBtn.title = 'Delete'; delBtn.innerHTML = '<i class="fas fa-trash"></i>';
  delBtn.onclick = function(e) { e.stopPropagation(); line.style.opacity='0'; line.style.transform='scale(.95)'; setTimeout(function(){ line.remove(); }, 200); };
  act.appendChild(copyBtn); act.appendChild(delBtn);
  line.appendChild(act);

  container.appendChild(line);
  // Scroll transcript to bottom
  var ta = document.getElementById('transcriptArea'); if (ta) ta.scrollTop = ta.scrollHeight;
}

// ── Transcript style toggle: cap1 ↔ cap5 ──
function cycleCaptionStyle() {
  var current = localStorage.getItem('sottotitoli-caption-style') || 'cap1';
  var next = current === 'cap1' ? 'cap5' : 'cap1';
  localStorage.setItem('sottotitoli-caption-style', next);
  var vc = document.getElementById('v20qContent');
  if (vc) { vc.className = 'v20q-content v20q-' + next; }
  // Flash palette button
  var btn = document.getElementById('styleCycleBtn');
  if (btn) { btn.style.boxShadow = '0 0 12px var(--accent)'; setTimeout(function(){ btn.style.boxShadow = ''; }, 400); }
}
(function(){
  var saved = localStorage.getItem('sottotitoli-caption-style') || 'cap1';
  var vc = document.getElementById('v20qContent');
  if (vc) vc.className = 'v20q-content v20q-' + saved;
})();

// ── Font size ──
var _fontSizes = [45, 55, 65], _fontIdx = 1;
function cycleFontSize() { _fontIdx = (_fontIdx + 1) % _fontSizes.length; var px = _fontSizes[_fontIdx]; document.documentElement.style.setProperty('--font-size-override', px + 'px'); document.getElementById('fontSizeLabel').textContent = px; localStorage.setItem('sottotitoli-font-size', px); }
(function(){ var s = localStorage.getItem('sottotitoli-font-size'); if (s) { var px = parseInt(s), idx = _fontSizes.indexOf(px); if (idx >= 0) { _fontIdx = idx; document.documentElement.style.setProperty('--font-size-override', px + 'px'); } document.getElementById('fontSizeLabel').textContent = px; } })();

// ── Live style cycle (var5=Glass, var6=Cinema, var7=Neon) ──
var _liveStyles = ['6','7','5'], _liveStyleIdx = 0;
function cycleLiveStyle() { _liveStyleIdx = (_liveStyleIdx + 1) % _liveStyles.length; var val = _liveStyles[_liveStyleIdx]; [5,6,7].forEach(function(i){ document.documentElement.classList.remove('cap-var'+i); }); document.documentElement.classList.add('cap-var'+val); localStorage.setItem('sottotitoli-caption-var', val); }
(function(){ var s = localStorage.getItem('sottotitoli-caption-var') || '0', idx = _liveStyles.indexOf(s); if (idx >= 0) _liveStyleIdx = idx; if (s !== '0') document.documentElement.classList.add('cap-var'+s); })();

// ── Magic Fix ──
var _magicFixOn = false;
function toggleMagicFix() { _magicFixOn = !_magicFixOn; var b = document.getElementById('magicFixBtn'), l = document.getElementById('magicFixLabel'); if (_magicFixOn) { b.classList.add('on'); l.textContent = 'On'; localStorage.setItem('sottotitoli-magic-fix', '1'); } else { b.classList.remove('on'); l.textContent = 'Fix'; localStorage.setItem('sottotitoli-magic-fix', '0'); } }
(function(){ if (localStorage.getItem('sottotitoli-magic-fix') === '1') { _magicFixOn = true; document.getElementById('magicFixBtn').classList.add('on'); document.getElementById('magicFixLabel').textContent = 'On'; } })();

// ── Theme ──
function toggleTheme() { var h = document.documentElement, t = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; h.setAttribute('data-theme', t); localStorage.setItem('sottotitoli-theme', t); document.getElementById('themeToggle').textContent = t === 'dark' ? '☀️' : '🌙'; }
(function(){ var t = localStorage.getItem('sottotitoli-theme') || 'dark'; document.documentElement.setAttribute('data-theme', t); document.getElementById('themeToggle').textContent = t === 'dark' ? '☀️' : '🌙'; })();
</script>
