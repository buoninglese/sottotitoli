<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 2 Animation Styles · 10 Directors · Sottotitoli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-snap-type:y mandatory;overflow-y:scroll}
body{background:#0a0c10;color:#fff;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}

.section{position:relative;width:100vw;height:100vh;scroll-snap-align:start;overflow:hidden;
  background:url('../img/bg-home.png') center/cover no-repeat;background-attachment:fixed}
.section::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:0}
.section::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.45) 100%)}

.section-inner{position:relative;z-index:2;width:100%;height:100%;
  display:flex;align-items:flex-start;justify-content:center;
  padding:clamp(90px,15vh,130px) clamp(28px,5vw,80px) clamp(70px,12vh,100px)}

.row{display:flex;align-items:flex-start;gap:clamp(32px,6vw,80px);max-width:1100px;width:100%}

/* Left column */
.left-col{flex:1;display:flex;flex-direction:column;gap:clamp(10px,2vh,18px)}
.ttl{font-family:Manrope,sans-serif;font-weight:800;line-height:1.1;font-size:clamp(38px,6vw,60px);
  text-shadow:-1px -1px 0 rgba(6,182,212,.35),1px 1px 0 rgba(0,0,0,.8),0 3px 10px rgba(0,0,0,.6)}
.ttl em{font-style:normal;color:#06b6d4}

.live-bar{display:inline-flex;align-items:center;gap:8px;
  font-family:'Arial Narrow','Arial',sans-serif;font-size:clamp(20px,2.3vw,24px);
  color:#fff;-webkit-text-stroke:2px rgb(10,10,10);paint-order:stroke fill;text-shadow:none}
.live-dot{width:8px;height:8px;border-radius:50%;background:#fff;display:inline-block;flex-shrink:0}
.live-divider{color:rgba(255,255,255,.25);flex-shrink:0;margin:0 1px}

/* Right column */
.right-col{width:42%;display:flex;flex-direction:column;gap:clamp(8px,1.5vh,14px);min-width:0;padding-top:clamp(60px,10vh,110px)}

.cap-box{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);
  border-radius:12px;padding:clamp(10px,1.5vh,14px) clamp(12px,2vw,16px);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.cap-time{font-size:clamp(13px,1.3vw,16px);color:rgba(255,255,255,.5);
  font-family:'JetBrains Mono',monospace;font-weight:500}
.cap-text{font-size:clamp(15px,1.5vw,18px);color:rgba(255,255,255,.85);line-height:1.5;font-weight:400}

/* CEFR */
.cefr-box{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.cefr-row{display:flex;align-items:center;gap:10px}
.cefr-lbl{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;width:26px}
.cefr-trk{flex:1;height:clamp(9px,1.1vh,12px);background:rgba(255,255,255,.04);border-radius:5px;overflow:hidden}
.cefr-fill{height:100%;border-radius:5px}

/* Challenge */
.chal-box{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:12px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.chal-label{font-size:13px;font-weight:600;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.04em}
.chal-count{font-size:15px;font-weight:700;color:#fff}
.chal-deadline{font-size:12px;color:rgba(255,255,255,.35)}

/* Streak */
.streak-box{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:12px;padding:12px 20px;display:flex;align-items:center;justify-content:center;min-height:44px}
.streak-flame{font-size:22px}

/* Label */
.label{position:absolute;bottom:24px;right:32px;z-index:10;
  font-size:12px;font-weight:600;color:rgba(255,255,255,.25);
  font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);
  border-radius:100px;padding:6px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* Start button */
.start-btn{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:10;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:#fff;
  background:rgba(124,58,237,.25);border:1px solid rgba(124,58,237,.4);
  padding:10px 24px;border-radius:100px;cursor:pointer;
  transition:background .2s,border-color .2s,opacity .3s}
.start-btn:hover{background:rgba(124,58,237,.4);border-color:rgba(124,58,237,.6)}
.start-btn.done{opacity:.3;pointer-events:none}

/* Nav dots */
.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:100;
  display:flex;flex-direction:column;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .25s}
.dot:hover,.dot.active{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.4);transform:scale(1.4)}

/* ── Director-specific animation classes ── */

/* 01 — MICHAEL BAY: explosive, lens flares, orange/teal, shake */
.bay-explode{animation:bayShake .4s ease-out}
@keyframes bayShake{0%,100%{transform:translate(0)}10%{transform:translate(-8px,4px)}30%{transform:translate(6px,-3px)}50%{transform:translate(-4px,-6px)}70%{transform:translate(3px,5px)}90%{transform:translate(-1px,1px)}}
.bay-flare{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;
  background:radial-gradient(ellipse at 20% 30%,rgba(255,180,60,.35) 0%,transparent 60%),
             radial-gradient(ellipse at 80% 60%,rgba(6,182,212,.25) 0%,transparent 50%);}
.bay-pop{animation:bayPop .5s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes bayPop{0%{transform:scale(0) rotate(-15deg);opacity:0}60%{transform:scale(1.3) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}

/* 02 — CHRISTOPHER NOLAN: temporal, precise, building, reverse-order reveals */
.nolan-time{opacity:0;animation:nolanFade .9s ease-out both}
@keyframes nolanFade{0%{opacity:0;filter:blur(8px)}40%{opacity:.3;filter:blur(3px)}100%{opacity:1;filter:blur(0)}}
.nolan-reverse{animation:nolanReverse .7s ease-out both}
@keyframes nolanReverse{0%{opacity:0;transform:translateY(-30px);letter-spacing:8px}100%{opacity:1;transform:translateY(0);letter-spacing:normal}}

/* 03 — STANLEY KUBRICK: slow, symmetrical, one-point, ominous tracking */
.kubrick-slow{opacity:0;animation:kubrickReveal 2s ease-out both}
@keyframes kubrickReveal{0%{opacity:0;transform:scale(.95)}60%{opacity:.4}100%{opacity:1;transform:scale(1)}}
.kubrick-track{animation:kubrickTrack 1.6s cubic-bezier(.25,.1,.1,1) both}
@keyframes kubrickTrack{0%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:translateY(0)}}

/* 04 — WES ANDERSON: flat, centered, pastel pops, whip-pan snap */
.anderson-snap{opacity:0;animation:andersonSnap .35s steps(1) both}
@keyframes andersonSnap{0%{opacity:0;transform:translateX(-60px)}50%{opacity:1;transform:translateX(0)}100%{opacity:1;transform:translateX(0)}}
.anderson-pop{animation:andersonPop .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes andersonPop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

/* 05 — QUENTIN TARANTINO: snappy, bold, trunk-shot reveals, sudden cuts */
.tarantino-snap{opacity:0;animation:tarantinoCut .25s steps(1) both}
@keyframes tarantinoCut{0%{opacity:0;transform:translateY(80px) scale(.9)}100%{opacity:1;transform:translateY(0) scale(1)}}
.tarantino-pop{animation:tarantinoPop .5s cubic-bezier(.68,-.55,.265,1.55) both}
@keyframes tarantinoPop{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}

/* 06 — DAVID FINCHER: cold, precise, creeping, clinical, desaturated */
.fincher-creep{opacity:0;animation:fincherCreep 1.4s ease-out both}
@keyframes fincherCreep{0%{opacity:0;transform:translateY(4px);filter:grayscale(1)}60%{opacity:.5;filter:grayscale(.5)}100%{opacity:1;transform:translateY(0);filter:grayscale(0)}}
.fincher-track{animation:fincherTrack 1.2s cubic-bezier(.2,.05,.1,1) both}
@keyframes fincherTrack{0%{opacity:0;transform:scale(.98)}100%{opacity:1;transform:scale(1)}}

/* 07 — DENIS VILLENEUVE: vast, monumental, slow burn, bass-heavy */
.villeneuve-vast{opacity:0;animation:villeneuveReveal 2s ease-out both}
@keyframes villeneuveReveal{0%{opacity:0;transform:scale(.88);filter:blur(6px) brightness(.4)}50%{filter:blur(2px) brightness(.7)}100%{opacity:1;transform:scale(1);filter:blur(0) brightness(1)}}
.villeneuve-rise{animation:villeneuveRise 1.8s ease-out both}
@keyframes villeneuveRise{0%{opacity:0;transform:translateY(60px)}100%{opacity:1;transform:translateY(0)}}

/* 08 — EDGAR WRIGHT: quick cuts, match cuts, snappy, comedic timing */
.wright-whip{opacity:0;animation:wrightWhip .3s ease-out both}
@keyframes wrightWhip{0%{opacity:0;transform:translateX(-100px) skewX(-15deg)}60%{transform:translateX(10px) skewX(3deg)}100%{opacity:1;transform:translateX(0) skewX(0)}}
.wright-pop{animation:wrightPop .35s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes wrightPop{0%{transform:scale(0);opacity:0}80%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}

/* 09 — RIDLEY SCOTT: atmospheric haze, shafts of light, epic scale */
.scott-haze{opacity:0;animation:scottHaze 1.8s ease-out both}
@keyframes scottHaze{0%{opacity:0;transform:scale(.92);filter:brightness(.3) saturate(.5)}100%{opacity:1;transform:scale(1);filter:brightness(1) saturate(1)}}
.scott-beam{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.04) 45%,rgba(255,255,255,.08) 48%,rgba(255,255,255,.04) 51%,transparent 65%);}

/* 10 — SPIKE LEE: double-dolly, floating, bold color, direct */
.lee-float{opacity:0;animation:leeFloat 1.5s ease-out both}
@keyframes leeFloat{0%{opacity:0;transform:translateY(20px) scale(.96)}50%{opacity:.6;transform:translateY(-8px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
.lee-bold{animation:leeBold .6s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes leeBold{0%{transform:scale(.5);opacity:0;color:#ff6b35}100%{transform:scale(1);opacity:1}}

/* Hidden reset state */
.hidden{opacity:0!important;transform:none!important;filter:none!important}
</style>
</head>
<body>

<div class="dots" id="dots"></div>

<script>
const cefrColors={A1:'#22c55e',A2:'#a3e635',B1:'#facc15',B2:'#fb923c',C1:'#c084fc',C2:'#f472b6'};
const cefrData=[{l:'A1',p:15},{l:'A2',p:45},{l:'B1',p:25},{l:'B2',p:10},{l:'C1',p:4},{l:'C2',p:1}];

function cefrHTML(done){
  return cefrData.map(d=>'<div class="cefr-row"><span class="cefr-lbl" style="color:'+cefrColors[d.l]+'">'+d.l+'</span><div class="cefr-trk"><div class="cefr-fill" style="width:'+(done?d.p:0)+'%;background:'+cefrColors[d.l]+';transition:width 1.2s cubic-bezier(.15,.8,.2,1)'+(done?'':'')+'"></div></div></div>').join('');
}

const captionsHTML=`
<div class="cap-box"><div class="cap-time">00:49</div><div class="cap-text">It's not just about reading what's being said.</div></div>
<div class="cap-box"><div class="cap-time">00:49</div><div class="cap-text">It's about giving every word its moment, its full context...</div></div>
<div class="cap-box"><div class="cap-time">00:49</div><div class="cap-text">...and the real chance to be recognized, remembered, and used.</div></div>`;

function buildSlide(done){
  return `
    <div class="row">
      <div class="left-col">
        <h2 class="ttl" id="ttl-${done?'d':'s'}">Ogni momento,<br><em>le sue parole.</em></h2>
        <div class="live-bar"><span class="live-dot"></span><span style="font-weight:600;flex-shrink:0">LIVE</span><span class="live-divider">|</span><span></span></div>
        <div class="cefr-box">${cefrHTML(done)}</div>
        <div class="chal-box">
          <span class="chal-label">SFIDA</span>
          <span class="chal-count"><span>${done?'5':'4'}</span>/10 <span style="color:#c084fc;font-weight:800">C1</span></span>
          <span class="chal-deadline">Scade: <span style="color:rgba(255,255,255,.5)">Domani</span></span>
        </div>
        <div class="streak-box"><span class="streak-flame">${done?'🔥':''}</span></div>
      </div>
      <div class="right-col">
        <h2 class="ttl">Ogni parola,<br><em>il suo momento.</em></h2>
        ${done?captionsHTML:'<div style="min-height:clamp(200px,26vh,280px)"></div>'}
      </div>
    </div>`;
}

const directors=[
  {n:'01',label:'Michael Bay — Explosive Reveal',cls:'bay',desc:'Lens flares, screen shake, orange/teal pops, everything slams in'},
  {n:'02',label:'Christopher Nolan — Temporal Build',cls:'nolan',desc:'Reverse-order reveals, time-bending fades, precise interlocking'},
  {n:'03',label:'Stanley Kubrick — Slow Symmetry',cls:'kubrick',desc:'One-point perspective, ominous slow tracking, deliberate reveals'},
  {n:'04',label:'Wes Anderson — Whip-Pan Snap',cls:'anderson',desc:'Flat composition, pastel pops, centered symmetry, snappy whip pans'},
  {n:'05',label:'Quentin Tarantino — Trunk-Shot Cut',cls:'tarantino',desc:'Sudden cuts, bold typography, snappy dialogue-like reveals'},
  {n:'06',label:'David Fincher — Clinical Creep',cls:'fincher',desc:'Cold precision, desaturated crawl, ominous clinical tracking'},
  {n:'07',label:'Denis Villeneuve — Monumental Vast',cls:'villeneuve',desc:'Vast scale, slow burn, atmospheric bass-heavy emergence'},
  {n:'08',label:'Edgar Wright — Match-Cut Quick',cls:'wright',desc:'Snappy cuts, match transitions, comedic whip-speed timing'},
  {n:'09',label:'Ridley Scott — Atmospheric Haze',cls:'scott',desc:'Shafts of light, slow epic reveals, atmospheric glow'},
  {n:'10',label:'Spike Lee — Double-Dolly Float',cls:'lee',desc:'Floating reveals, bold color contrasts, direct presence'}
];

const dotsEl=document.getElementById('dots');

directors.forEach((d,i)=>{
  const sec=document.createElement('div');
  sec.className='section '+d.cls;
  sec.id='v'+d.n;
  sec.innerHTML=`
    <div class="section-inner">
      <div class="content-area" style="width:100%;max-width:1100px">${buildSlide(false)}</div>
    </div>
    <button class="start-btn" data-idx="${i}">▶ Avvia — ${d.label.split(' — ')[1]}</button>
    <div class="label">#${d.n} ${d.label}</div>
    ${d.cls==='bay'?'<div class="bay-flare"></div>':''}
    ${d.cls==='scott'?'<div class="scott-beam"></div>':''}
  `;
  document.body.appendChild(sec);

  const dot=document.createElement('div');
  dot.className='dot';dot.title='#'+d.n+' '+d.label;
  dot.addEventListener('click',()=>{document.getElementById('v'+d.n).scrollIntoView({behavior:'smooth'});});
  dotsEl.appendChild(dot);

  // Click handler
  const btn=sec.querySelector('.start-btn');
  btn.addEventListener('click',function(){
    if(this.classList.contains('done'))return;
    this.classList.add('done');
    runAnimation(sec,d,i);
  });
});

function runAnimation(sec,director,idx){
  const content=sec.querySelector('.content-area');
  const els={
    ttl:content.querySelector('.ttl'),
    live:content.querySelector('.live-bar'),
    cefr:content.querySelector('.cefr-box'),
    cefrFills:content.querySelectorAll('.cefr-fill'),
    chal:content.querySelector('.chal-box'),
    chalNum:content.querySelector('.chal-count span'),
    streak:content.querySelector('.streak-box'),
    flame:content.querySelector('.streak-flame'),
    rightTtl:content.querySelectorAll('.ttl')[1],
    rightCol:content.querySelector('.right-col')
  };
  const flare=sec.querySelector('.bay-flare');
  const beam=sec.querySelector('.scott-beam');

  const sty=director.cls;
  const pause=t=>new Promise(r=>setTimeout(r,t));

  async function animate(){
    switch(sty){
      case 'bay':
        // 1. EXPLOSION — everything slams at once with shake
        if(flare){flare.style.transition='opacity .3s ease';flare.style.opacity='1';}
        sec.classList.add('bay-explode');
        els.ttl.classList.add('bay-pop');els.ttl.style.animationDelay='0s';
        els.live.classList.add('bay-pop');els.live.style.animationDelay='.1s';
        await pause(400);
        // CEFR slam
        els.cefr.classList.add('bay-pop');els.cefr.style.animationDelay='0s';
        els.cefrFills.forEach((f,i)=>{setTimeout(()=>f.style.width=cefrData[i].p+'%',i*80);});
        await pause(400);
        // Challenge + streak
        els.chal.classList.add('bay-pop');els.chal.style.animationDelay='0s';
        await pause(300);
        els.chalNum.textContent='5';els.chalNum.style.cssText='transition:transform .4s cubic-bezier(.175,.885,.32,1.275);transform:scale(1.5);color:#c084fc';
        setTimeout(()=>els.chalNum.style.transform='scale(1)',400);
        await pause(500);
        els.flame.textContent='🔥';els.flame.classList.add('bay-pop');
        // Right side slams
        els.rightTtl.classList.add('bay-pop');els.rightTtl.style.animationDelay='0s';
        await pause(300);
        els.rightCol.innerHTML=captionsHTML;
        els.rightCol.querySelectorAll('.cap-box').forEach((b,i)=>{b.classList.add('bay-pop');b.style.animationDelay=(i*.15)+'s';});
        if(flare)setTimeout(()=>{flare.style.opacity='0';},1500);
        break;

      case 'nolan':
        // 2. TEMPORAL — builds in order, then reverse-punch
        els.ttl.classList.add('nolan-reverse');
        await pause(800);
        els.live.classList.add('nolan-time');
        await pause(600);
        els.cefr.classList.add('nolan-time');
        els.cefrFills.forEach((f,i)=>{setTimeout(()=>f.style.width=cefrData[i].p+'%',i*150);});
        await pause(1000);
        els.chal.classList.add('nolan-time');
        await pause(400);
        els.chalNum.textContent='5';els.chalNum.style.cssText='transition:all .8s ease;transform:scale(1.3);color:#c084fc;filter:blur(0)';
        setTimeout(()=>{els.chalNum.style.transform='scale(1)';els.chalNum.style.filter='blur(0)';},800);
        await pause(800);
        els.flame.textContent='🔥';els.flame.classList.add('nolan-reverse');
        els.rightTtl.classList.add('nolan-reverse');
        await pause(600);
        els.rightCol.innerHTML=captionsHTML;
        els.rightCol.querySelectorAll('.cap-box').forEach((b,i)=>{b.classList.add('nolan-time');b.style.animationDelay=(i*.5)+'s';});
        break;

      case 'kubrick':
        // 3. SLOW SYMMETRY — everything creeps in deliberately
        els.ttl.classList.add('kubrick-slow');
        await pause(1500);
        els.live.classList.add('kubrick-track');
        await pause(1000);
        els.cefr.classList.add('kubrick-track');
        els.cefrFills.forEach((f,i)=>{setTimeout(()=>f.style.width=cefrData[i].p+'%',i*300);});
        await pause(2000);
        els.chal.classList.add('kubrick-track');
        await pause(800);
        els.chalNum.textContent='5';els.chalNum.style.cssText='transition:all 1.5s ease;transform:scale(1.2);color:#c084fc';
        setTimeout(()=>els.chalNum.style.transform='scale(1)',1500);
        await pause(1500);
        els.flame.textContent='🔥';els.flame.classList.add('kubrick-slow');
        els.rightTtl.classList.add('kubrick-slow');
        await pause(1200);
        els.rightCol.innerHTML=captionsHTML;
        els.rightCol.querySelectorAll('.cap-box').forEach((b,i)=>{b.classList.add('kubrick-track');b.style.animationDelay=(i*.8)+'s';});
        break;

      case 'anderson':
        // 4. WHIP-PAN — snappy centered reveals
        els.ttl.classList.add('anderson-pop');
        await pause(300);
        els.live.classList.add('anderson-snap');
        await pause(250);
        els.cefr.classList.add('anderson-pop');
        els.cefrFills.forEach((f,i)=>{setTimeout(()=>f.style.width=cefrData[i].p+'%',i*60);});
        await pause(350);
        els.chal.classList.add('anderson-pop');
        await pause(200);
        els.chalNum.textContent='5';els.chalNum.style.cssText='transition:transform .3s cubic-bezier(.34,1.56,.64,1);transform:scale(1.4);color:#c084fc';
        setTimeout(()=>els.chalNum.style.transform='scale(1)',300);
        await pause(350);
        els.flame.textContent='🔥';els.flame.classList.add('anderson-pop');
        els.rightTtl.classList.add('anderson-pop');
        await pause(250);
        els.rightCol.innerHTML=captionsHTML;
        els.rightCol.querySelectorAll('.cap-box').forEach((b,i)=>{b.classList.add('anderson-snap');b.style.animationDelay=(i*.1)+'s';});
        break;

      case 'tarantino':
        // 5. SNAPPY CUTS — bold sudden reveals
        els.ttl.classList.add('tarantino-pop');
        els.ttl.style.animationDelay='0s';
        await pause(200);
        els.live.classList.add('tarantino-snap');
        els.live.style.animationDelay='0s';
        await pause(150);
        els.cefr.classList.add('tarantino-snap');
        els.cefrFills.forEach((f,i)=>{setTimeout(()=>f.style.width=cefrData[i].p+'%',i*50);});
        await pause(250);
        els.chal.classList.add('tarantino-snap');
        await pause(150);
        els.chalNum.textContent='5';els.chalNum.style.cssText='transition:transform .25s cubic-bezier(.68,-.55,.265,1.55);transform:scale(1.6);color:#c084fc';
        setTimeout(()=>els.chalNum.style.transform='scale(1)',250);

}

// Dot tracking
const dots=document.querySelectorAll('.dot');
function updateActive(){
  const sections=document.querySelectorAll('.section');
  let active=0;
  sections.forEach((s,i)=>{
    const r=s.getBoundingClientRect();
    if(r.top<window.innerHeight*.5&&r.bottom>window.innerHeight*.5)active=i;
  });
  dots.forEach((d,i)=>d.classList.toggle('active',i===active));
}
window.addEventListener('scroll',updateActive,{passive:true});
updateActive();

// Keyboard
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const sections=document.querySelectorAll('.section');
    let active=0;
    sections.forEach((s,i)=>{const r=s.getBoundingClientRect();if(r.top<window.innerHeight*.5&&r.bottom>window.innerHeight*.5)active=i;});
    const next=e.key==='ArrowDown'?Math.min(active+1,sections.length-1):Math.max(active-1,0);
    sections[next].scrollIntoView({behavior:'smooth'});
  }
});
</script>
