<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVE Bar VAR Variations · Sottotitoli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&family=Arial+Narrow&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e4e4e7;font-family:Inter,sans-serif;min-height:100vh;padding:32px;user-select:none;-webkit-user-select:none}
h1{font-family:Manrope,sans-serif;font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
h1 span{color:#06b6d4}
.sub{color:#71717a;font-size:13px;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px;max-width:1400px;margin:0 auto}
.card{background:#1a1d26;border:1px solid #252836;border-radius:14px;overflow:hidden}
.card-head{padding:12px 16px;border-bottom:1px solid #252836;display:flex;justify-content:space-between;align-items:center}
.card-num{font-size:10px;font-weight:700;color:#06b6d4;text-transform:uppercase;letter-spacing:.06em}
.card-label{font-size:13px;font-weight:600;color:#e4e4e7}
.card-label small{font-weight:400;color:#71717a;font-size:11px}
.card-body{padding:20px 20px 28px;min-height:130px;display:flex;align-items:flex-end;background:#0a0d14}

.live-stage{width:100%;position:relative}
.live-bar{min-height:56px;display:flex;align-items:center;gap:8px;padding:14px 20px;font-family:'Inter',sans-serif;font-size:14px;transition:all .3s;cursor:pointer}
.live-bar:active{opacity:.7}
.live-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.live-text-wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-family:inherit}
.live-word{animation:wordIn .25s ease-out both;font-family:inherit}
@keyframes wordIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── VAR styles — exact match to caption-bg-variations.html ── */

/* VAR 1 — Transparent, no background */
.v1 .live-bar{background:transparent;border:none;color:#e4e4e7;font-weight:400}
.v1 .live-dot{background:#06b6d4;animation:dotPulse 1.5s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.3}}

/* VAR 2 — Solid black bar */
.v2 .live-bar{background:#000;color:#fff;font-weight:600;border-radius:0;padding:14px 28px}
.v2 .live-dot{background:#22c55e}

/* VAR 3 — Yellow on dark (Dutch TV) */
.v3 .live-bar{background:rgba(0,0,0,.78);color:#ffd43b;font-weight:700;font-style:italic;font-family:'Arial','Inter',sans-serif}
.v3 .live-dot{background:#ffd43b}

/* VAR 4 — Semi-transparent black, white text */
.v4 .live-bar{background:rgba(0,0,0,.72);color:#fff;font-weight:600;border-radius:6px}
.v4 .live-dot{background:#fff}

/* VAR 5 — Frosted glass */
.v5 .live-bar{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-weight:500;border:1px solid rgba(255,255,255,.08);border-radius:8px}
.v5 .live-dot{background:#22c55e}

/* VAR 6 — Dark pill + glow */
.v6 .live-bar{background:rgba(10,10,14,.88);color:#fafafa;font-weight:600;border-radius:99px;padding:12px 28px;box-shadow:0 0 40px rgba(0,0,0,.3)}
.v6 .live-dot{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.4)}

/* VAR 7 — NLTV text-stroke outline only */
.v7 .live-bar{background:transparent;color:#fff;font-family:'Arial Narrow','Arial',sans-serif;font-weight:400;font-size:18px;-webkit-text-stroke:2px rgb(10,10,10);paint-order:stroke fill;text-shadow:none;border-radius:0}
.v7 .live-dot{background:#fff}

/* VAR 8 — YouTube style compact */
.v8 .live-bar{background:rgba(23,23,23,.94);color:#fff;font-weight:600;border-radius:4px;font-size:13px;padding:8px 14px;min-height:auto}
.v8 .live-dot{background:#ef4444;width:6px;height:6px}

/* VAR 9 — Warm cinema glow */
.v9 .live-bar{background:rgba(20,16,12,.85);color:#f5f0e8;font-weight:500;border-radius:12px;box-shadow:0 0 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.v9 .live-dot{background:#f59e0b}

/* VAR 10 — Light bg, dark text */
.v10 .live-bar{background:rgba(255,255,255,.92);color:#111;font-weight:600;border-radius:8px;box-shadow:0 2px 20px rgba(0,0,0,.15)}
.v10 .live-dot{background:#111}

.info-row{display:flex;gap:6px;padding:10px 16px 12px;flex-wrap:wrap}
.info-chip{font-size:10px;font-family:'JetBrains Mono',monospace;padding:3px 7px;border-radius:4px;background:rgba(255,255,255,.04);color:#71717a;border:1px solid rgba(255,255,255,.05)}
</style>
</head>
<body>

<h1>LIVE Bar · <span>10 VAR Variations</span></h1>
<p class="sub">Typing simulation — words appear one by one mimicking real-time speech, then loop</p>

<div class="grid" id="grid"></div>

<script>
const sentences = [
  "Ogni lingua è fatta di parole.",
  "Metterle davanti ai tuoi occhi nel momento in cui nascono.",
  "È un modo per chiedere al cervello di ricordarle.",
  "I sottotitoli normali si fermano qui.",
  "Noi ti offriamo aiuto per capirle e usarle.",
  "Un clic mostra definizione e pronuncia.",
  "Senza mai uscire dal flusso della conversazione.",
  "Segui una conversazione in tempo reale.",
  "Usa i sottotitoli per accompagnare una presentazione.",
  "Aiuta i tuoi studenti a seguire senza perdersi."
];

const vars = [
  {n:1, label:'Transparent — no background', sub:'text floats on screen', cls:'v1', css:'background: transparent; color: #e4e4e7'},
  {n:2, label:'Solid black bar', sub:'cinema standard', cls:'v2', css:'background: #000 solid; color: #fff; padding: 14px 28px'},
  {n:3, label:'Dutch TV · yellow on dark', sub:'NPO/RTBF classic', cls:'v3', css:'background: rgba(0,0,0,.78); color: #ffd43b; font: italic 700 Arial'},
  {n:4, label:'Semi-transparent black', sub:'streaming popular', cls:'v4', css:'background: rgba(0,0,0,.72); color: #fff; border-radius: 6px'},
  {n:5, label:'Frosted glass blur', sub:'premium UI feel', cls:'v5', css:'background: rgba(255,255,255,.06); backdrop-filter: blur(12px)'},
  {n:6, label:'Dark pill · soft glow', sub:'bold & clean', cls:'v6', css:'background: rgba(10,10,14,.88); border-radius: 99px; box-shadow glow'},
  {n:7, label:'NLTV · text-stroke only', sub:'no background', cls:'v7', css:'background: transparent; font: Arial Narrow; -webkit-text-stroke: 2px'},
  {n:8, label:'YouTube compact', sub:'small & sharp', cls:'v8', css:'background: rgba(23,23,23,.94); border-radius: 4px; font-size: 13px'},
  {n:9, label:'Warm cinema · amber', sub:'atmospheric glow', cls:'v9', css:'background: rgba(20,16,12,.85); color: #f5f0e8 warm white'},
  {n:10, label:'Light bg · dark text', sub:'inverted contrast', cls:'v10', css:'background: rgba(255,255,255,.92); color: #111'},
];

const grid = document.getElementById('grid');

vars.forEach((v, vi) => {
  const card = document.createElement('div');
  card.className = 'card ' + v.cls;
  const startIdx = vi % sentences.length;

  card.innerHTML =
    '<div class="card-head">' +
      '<span class="card-num">VAR ' + v.n + '</span>' +
      '<span class="card-label">' + v.label + ' <small>— ' + v.sub + '</small></span>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="live-stage">' +
        '<div class="live-bar">' +
          '<span class="live-dot"></span>' +
          '<span class="live-text-wrap"></span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="info-row">' +
      '<span class="info-chip">' + v.css + '</span>' +
    '</div>';

  grid.appendChild(card);

  // ── Typing engine ──
  const wrap = card.querySelector('.live-text-wrap');
  let sentIdx = startIdx;
  let wordIdx = 0;

  function typeNext() {
    if (!wrap) return;
    const sentence = sentences[sentIdx % sentences.length];
    const words = sentence.split(' ');

    if (wordIdx === 0) wrap.innerHTML = '';

    if (wordIdx < words.length) {
      const span = document.createElement('span');
      span.className = 'live-word';
      span.textContent = words[wordIdx];
      wrap.appendChild(span);
      wordIdx++;
      setTimeout(typeNext, 120 + Math.random() * 80);
    } else {
      // Sentence complete — pause, then next sentence
      wordIdx = 0;
      sentIdx++;
      setTimeout(typeNext, 2800);
    }
  }

  setTimeout(typeNext, vi * 350 + 500);

  // Click: flash feedback
  card.querySelector('.live-bar').addEventListener('click', function() {
    this.style.filter = 'brightness(1.5)';
    setTimeout(() => { this.style.filter = ''; }, 200);
  });
});
</script>

</body>
</html>
