:root{

*{box-sizing:border-box}
body{margin:0;font-family:var(--font-ui);background:#0f0f13;color:#e8e8ec;min-height:100vh}

.subtitle{text-align:center;color:#888;font-size:15px;margin-bottom:48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px;padding:0 20px 60px;max-width:1600px;margin:0 auto}

.card{border-radius:20px;overflow:hidden;border:1px solid #2a2a30}
.card-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;letter-spacing:.03em}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.card-half{padding:24px 20px;display:flex;flex-direction:column;gap:12px}
.card-half.light{}
.card-half.dark{}

.swatches{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.sw{width:22px;height:22px;border-radius:6px;flex-shrink:0;border:1px solid rgba(0,0,0,.06)}
.pal-name{font-size:12px;font-weight:600;margin-bottom:2px}

.sample-box{padding:14px;border-radius:12px;font-size:11px;line-height:1.5}
.sample-tag{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.sample-h3{font-size:14px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em}
.sample-p{font-size:10px;opacity:.7;line-height:1.4;margin:0}
.sample-btn{display:inline-block;padding:5px 12px;border-radius:999px;font-size:10px;font-weight:600;margin-top:6px;cursor:default}

.note{text-align:center;color:#666;font-size:12px;margin-bottom:20px;padding:0 20px;line-height:1.6}
.back-link{display:block;text-align:center;color:#888;font-size:13px;margin-bottom:40px}
</style>
</head>

<div class="grid" id="grid"></div>

      '.info{text-align:center;font-size:12px;color:var(--text-faint);padding:20px}'+
      '</style></head><body data-theme="light"><script>'+
      'var b=document.documentElement;function toggle(){var t=b.getAttribute("data-theme")==="dark"?"light":"dark";b.setAttribute("data-theme",t)}'+
      '<\\/script>'+
      '<div class="bar"><div class="brand">sotto<span>titoli</span></div><button class="toggle" onclick="toggle()">Light / Dark</button></div>'+
      '<div class="hero"><div class="tag">Sottotitoli</div><h1>Tutto chiaro.<br><em>Sempre. Subito.</em></h1><p class="hp">Sottotitoli e traduzione in tempo reale per capire subito meglio riunioni, lezioni e conversazioni.</p><button class="btn">Inizia gratis</button></div>'+
      '<div class="panel"><h3>La tua voce, in tutte le sue parti</h3><p>Scomponiamo il tuo parlato in decine di indicatori. Uno strumento che unisce comprensione e autoanalisi in un\'unica esperienza live.</p></div>'+
      '<div class="info"><strong>'+p.name+'</strong> — Palette #'+p.n+' &nbsp;·&nbsp; Click "Light / Dark" to toggle mode</div>'+
      '</body></html>');
    w.document.close();
  });
  card.style.cursor = 'pointer';
  grid.appendChild(card);
});
