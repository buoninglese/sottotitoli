<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sotto Supreme · 5 Selected Palettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ui:"Inter",ui-sans-serif,system-ui,sans-serif;--serif:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ui);background:#0c0c12;color:#e4e4ec}
h1{font-family:var(--serif);font-size:52px;font-weight:600;text-align:center;margin:56px 0 6px;letter-spacing:-.03em}
.sub{text-align:center;color:#777;font-size:15px;margin-bottom:48px}
.palette-section{padding:0 0 60px}
.palette-header{padding:16px 40px;display:flex;align-items:center;justify-content:space-between;max-width:1300px;margin:0 auto 20px}
.palette-header .ph-left{display:flex;align-items:baseline;gap:12px}
.palette-header .ph-num{font-size:48px;font-weight:900;line-height:1}
.palette-header .ph-name{font-size:26px;font-weight:700;letter-spacing:-.02em}
.palette-header .ph-pantone{font-size:13px;opacity:.6;font-weight:500;letter-spacing:.04em}
.preview-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1300px;margin:0 auto;padding:0 40px}
@media(max-width:860px){.preview-row{grid-template-columns:1fr;padding:0 20px}.palette-header{padding:16px 20px}}
.preview-half{border-radius:24px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.preview-half .mini-bar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;border-bottom:1px solid}
.preview-half .mini-brand{font-size:22px;font-weight:800;letter-spacing:-.4px}
.preview-half .mini-tools{display:flex;align-items:center;gap:8px}
.preview-half .mini-dot{width:8px;height:8px;border-radius:50%}
.preview-body{padding:48px 40px 44px;text-align:center}
.preview-tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;padding:3px 12px;border-radius:999px;margin-bottom:16px}
.preview-h1{font-size:48px;font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin:0 0 10px}
.preview-p{font-size:16px;line-height:1.55;max-width:440px;margin:0 auto 22px;opacity:.7}
.preview-btn{display:inline-block;padding:13px 30px;border-radius:14px;font-size:14px;font-weight:600;cursor:default;border:none}
.preview-panel{margin:24px auto 0;padding:32px 28px;border-radius:22px;max-width:500px;text-align:center;border:2px solid}
.preview-panel h3{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.03em;margin:0 0 8px}
.preview-panel p{font-size:12px;opacity:.6;line-height:1.5;margin:0}
.swatch-row{display:flex;gap:7px;justify-content:center;margin-top:24px}
.swatch-row .sr{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.08)}
.mode-label{text-align:center;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-bottom:0;padding:14px 0 0}
.back-link{display:block;text-align:center;color:#666;font-size:13px;padding-bottom:50px}
</style>
</head>
<body>

<h1>5 Sotto Supreme Palettes</h1>
<p class="sub">Pantone 2025–26 · Large previews · Light on left, Dark on right</p>

<div id="app"></div>

<p class="back-link"><a href="supreme-index.html">← Supreme Index</a> &nbsp;·&nbsp; <a href="supreme-palettes-wes.html">Wes Anderson Palettes</a></p>

<script>
const palettes = [
  {n:"03",pantone:"PANTONE 14-4510",name:"Aquatic Awe",light:{bg:"#f0f6f8",panel:"#fdfefe",panel2:"#f4f9fb",line:"#d4e6ee",lineStrong:"#bcd6e2",text:"#0f1c24",textSoft:"#3d5260",textFaint:"#71899e",btn:"#12222e",accent:"#0e7490",accentSoft:"#cffafe",tagBg:"#ffedd5",tagText:"#c2410c"},dark:{bg:"#0b151c",panel:"#141e28",panel2:"#18232e",line:"#253545",lineStrong:"#2f4254",text:"#d8eaf4",textSoft:"#a0c0d4",textFaint:"#6b8a9e",btn:"#d8eaf4",accent:"#22d3ee",accentSoft:"#142836",tagBg:"rgba(251,146,60,.18)",tagText:"#fb923c"}},
  {n:"06",pantone:"PANTONE 17-4432",name:"Blue Curaçao",light:{bg:"#f2f5f9",panel:"#fdfefe",panel2:"#f5f8fc",line:"#dce4f0",lineStrong:"#c4d0e4",text:"#0f1828",textSoft:"#3d4a60",textFaint:"#71809e",btn:"#122034",accent:"#2563eb",accentSoft:"#dbeafe",tagBg:"#fef3c7",tagText:"#a16207"},dark:{bg:"#0b111c",panel:"#151c2a",panel2:"#192130",line:"#253248",lineStrong:"#2f3e58",text:"#dce4f4",textSoft:"#a0b4cc",textFaint:"#6b8099",btn:"#dce4f4",accent:"#60a5fa",accentSoft:"#1a2840",tagBg:"rgba(251,191,36,.15)",tagText:"#fbbf24"}},
  {n:"09",pantone:"PANTONE 12-0738",name:"Celestial Yellow",light:{bg:"#fdfcf4",panel:"#ffffff",panel2:"#fefdf8",line:"#f0edd4",lineStrong:"#e4dfb8",text:"#1c1808",textSoft:"#4d4420",textFaint:"#8a7d4a",btn:"#241e0c",accent:"#6366f1",accentSoft:"#e0e7ff",tagBg:"#fef3c7",tagText:"#b45309"},dark:{bg:"#19160a",panel:"#231f11",panel2:"#292415",line:"#3b3622",lineStrong:"#49422c",text:"#f0ecc8",textSoft:"#c4be80",textFaint:"#8f8850",btn:"#f0ecc8",accent:"#818cf8",accentSoft:"#1e2045",tagBg:"rgba(251,191,36,.15)",tagText:"#fbbf24"}},
  {n:"11",pantone:"PANTONE 19-4526",name:"Deep Lagoon",light:{bg:"#f0f5f5",panel:"#fdfefe",panel2:"#f4f9f9",line:"#d2e6e4",lineStrong:"#b8d6d2",text:"#0f1c1a",textSoft:"#36524e",textFaint:"#648a84",btn:"#122420",accent:"#0d9488",accentSoft:"#ccfbf1",tagBg:"#fef3c7",tagText:"#b45309"},dark:{bg:"#0b1917",panel:"#142320",panel2:"#182825",line:"#253b36",lineStrong:"#2f4842",text:"#d6f0ea",textSoft:"#98c4ba",textFaint:"#64968a",btn:"#d6f0ea",accent:"#2dd4bf",accentSoft:"#142a24",tagBg:"rgba(251,191,36,.15)",tagText:"#fbbf24"}},
  {n:"15",pantone:"PANTONE 16-0324",name:"Basil",light:{bg:"#f2f5ed",panel:"#fdfefb",panel2:"#f6f9f1",line:"#dce4d2",lineStrong:"#c8d2ba",text:"#141c0f",textSoft:"#3c4d2e",textFaint:"#6e8760",btn:"#182413",accent:"#eab308",accentSoft:"#fef9c3",tagBg:"#fce7f3",tagText:"#be185d"},dark:{bg:"#0f140c",panel:"#181d15",panel2:"#1c2219",line:"#2a3225",lineStrong:"#343e2f",text:"#dee6d4",textSoft:"#a4b896",textFaint:"#708264",btn:"#dee6d4",accent:"#fde047",accentSoft:"#2d2808",tagBg:"rgba(244,114,182,.18)",tagText:"#f472b6"}}
];

function s(c){return'<span class="sr" style="background:'+c+'"></span>'}

function half(P,label){
  return'<div class="preview-half" style="background:'+P.bg+';color:'+P.text+'">'+
    '<div class="mode-label" style="color:'+P.textFaint+'">'+label+'</div>'+
    '<div class="mini-bar" style="border-color:'+P.line+'">'+
      '<div class="mini-brand">sotto<span style="color:'+P.accent+'">titoli</span></div>'+
      '<div class="mini-tools">'+
        '<span class="mini-dot" style="background:'+P.textFaint+'"></span>'+
        '<span class="mini-dot" style="background:'+P.textFaint+'"></span>'+
        '<span class="mini-dot" style="background:'+P.accent+'"></span>'+
      '</div>'+
    '</div>'+
    '<div class="preview-body">'+
      '<span class="preview-tag" style="background:'+P.tagBg+';color:'+P.tagText+'">Sottotitoli</span>'+
      '<div class="preview-h1">Tutto chiaro.<br><em style="font-style:normal;color:'+P.accent+'">Sempre. Subito.</em></div>'+
      '<p class="preview-p" style="color:'+P.textSoft+'">Sottotitoli e traduzione in tempo reale per capire subito meglio riunioni, lezioni e conversazioni.</p>'+
      '<span class="preview-btn" style="background:'+P.btn+';color:'+P.panel+'">Inizia gratis</span>'+
      '<div class="preview-panel" style="background:'+P.panel+';border-color:'+P.lineStrong+'">'+
        '<h3>La tua voce,<br>in tutte le sue parti</h3>'+
        '<p style="color:'+P.textSoft+'">Scomponiamo il tuo parlato in decine di indicatori. Uno strumento che unisce comprensione e autoanalisi.</p>'+
      '</div>'+
      '<div class="swatch-row">'+s(P.bg)+s(P.panel)+s(P.line)+s(P.text)+s(P.accent)+s(P.btn)+'</div>'+
    '</div>'+
  '</div>';
}

const app=document.getElementById('app');
palettes.forEach(p=>{
  const sec=document.createElement('div');
  sec.className='palette-section';
  sec.innerHTML=
    '<div class="palette-header" style="color:#e4e4ec">'+
      '<div class="ph-left"><span class="ph-num">'+p.n+'</span><span class="ph-name">'+p.name+'</span></div>'+
      '<span class="ph-pantone">'+p.pantone+'</span>'+
    '</div>'+
    '<div class="preview-row">'+
      half(p.light,'Light Mode')+
      half(p.dark,'Dark Mode')+
    '</div>';
  app.appendChild(sec);
});
</script>
</body>
</html>
