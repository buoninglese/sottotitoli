<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Border Depth Variations · Sottotitoli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c10;color:#fff;font-family:Inter,sans-serif;min-height:100vh;padding:48px 28px;user-select:none;-webkit-user-select:none}
h1{font-family:Manrope,sans-serif;font-size:clamp(28px,5vw,44px);font-weight:800;text-align:center;margin-bottom:4px;letter-spacing:-.025em}
h1 span{background:linear-gradient(135deg,#06b6d4,#e8944a,#c06040);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:rgba(255,255,255,.35);font-size:13px;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;max-width:1500px;margin:0 auto}

.card{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/10;background:url('../img/bg-home.png') center/cover no-repeat;cursor:pointer;transition:transform .4s ease}
.card:hover{transform:translateY(-4px)}
.card::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.35);border-radius:20px}
.card-inner{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:20px;text-align:center}
.card-inner h3{font-family:Manrope,sans-serif;font-size:15px;font-weight:700;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.card-inner h3 em{font-style:normal;color:#06b6d4}
.card-label{position:absolute;bottom:10px;right:14px;z-index:3;font-size:9px;font-weight:600;color:rgba(255,255,255,.25);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.04em}

/* ══════════════════════════════════════════
   01 — Deep Inset Shadow (sunken frame)
   ══════════════════════════════════════════ */
.b01{box-shadow:inset 0 0 0 8px rgba(0,0,0,.3),inset 0 0 0 9px rgba(255,255,255,.04),inset 0 0 60px rgba(0,0,0,.5)}

/* 02 — Layered Bevel (3D picture frame) */
.b02{box-shadow:inset 0 2px 8px rgba(255,255,255,.06),inset 0 -2px 8px rgba(0,0,0,.4),inset 2px 0 8px rgba(255,255,255,.04),inset -2px 0 8px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.05)}

/* 03 — Floating Depth (elevated card with deep shadow underneath) */
.b03{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.6),0 8px 20px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.3)}

/* 04 — Glass Edge Refraction */
.b04{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),inset 0 0 0 3px rgba(6,182,212,.04),0 0 0 1px rgba(255,255,255,.05),0 0 40px rgba(6,182,212,.04)}

/* 05 — Inner Glow Border (light bleeding in from edges) */
.b05{box-shadow:inset 0 0 40px rgba(6,182,212,.06),inset 0 0 0 1px rgba(255,255,255,.08),0 0 0 1px rgba(0,0,0,.4)}

/* 06 — Double Ring (two concentric borders) */
.b06{box-shadow:0 0 0 3px rgba(0,0,0,.3),0 0 0 4px rgba(255,255,255,.04),0 0 0 7px rgba(0,0,0,.2),0 0 0 8px rgba(255,255,255,.03)}

/* 07 — Corner Light Leaks */
.b07{box-shadow:inset 0 0 80px rgba(255,180,60,.04),inset 0 0 0 1px rgba(255,255,255,.06);position:relative}
.b07::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:20px;background:radial-gradient(circle at 0% 0%,rgba(255,200,100,.08),transparent 30%),radial-gradient(circle at 100% 100%,rgba(6,182,212,.06),transparent 30%),radial-gradient(circle at 100% 0%,rgba(255,200,100,.05),transparent 25%),radial-gradient(circle at 0% 100%,rgba(6,182,212,.05),transparent 25%)}

/* 08 — Deep Tunnel (heavy vignette + thin bright edge) */
.b08{box-shadow:inset 0 0 120px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.1)}

/* 09 — Frosted Border (blurred glass edge) */
.b09{box-shadow:inset 0 0 0 6px rgba(255,255,255,.03);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}

/* 10 — Animated Breathing Border */
.b10{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);animation:borderBreathe 4s ease-in-out infinite}
@keyframes borderBreathe{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),inset 0 0 40px rgba(6,182,212,.02)}50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 0 60px rgba(6,182,212,.08)}}

/* 11 — Multi-stop Gradient Border (metallic edge) */
.b11{box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 0 2px rgba(255,255,255,.04),0 0 0 3px rgba(0,0,0,.3),0 0 0 5px rgba(255,255,255,.03),0 0 0 6px rgba(0,0,0,.2)}

/* 12 — Offset Light Source (directional depth, light from top-left) */
.b12{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 2px 2px 12px rgba(255,255,255,.04),inset -3px -3px 16px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.3)}

/* 13 — Cinema Matte (letterbox bars creating depth) */
.b13{box-shadow:inset 0 30px 50px rgba(0,0,0,.6),inset 0 -30px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05)}

/* 14 — Prism Edge (thin rainbow/iridescent border) */
.b14{box-shadow:0 0 0 1px rgba(6,182,212,.12),0 0 0 2px rgba(124,58,237,.08),0 0 0 3px rgba(236,72,153,.05),0 0 0 4px rgba(6,182,212,.03)}

/* 15 — Floating Above Surface (drop shadow on "floor") */
.b15{box-shadow:0 0 0 1px rgba(255,255,255,.06),0 16px 40px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.4),0 30px 80px rgba(0,0,0,.3)}

/* 16 — Inner Chamfer (machined edge, 45° bevel illusion) */
.b16{box-shadow:inset 1px 1px 0 rgba(255,255,255,.05),inset -1px -1px 0 rgba(0,0,0,.4),inset 0 0 0 4px rgba(0,0,0,.2),0 0 0 1px rgba(255,255,255,.06)}

/* 17 — Optical Illusion Gap (thin bright line separated from dark mass) */
.b17{box-shadow:0 0 0 4px rgba(0,0,0,.4),0 0 0 5px rgba(255,255,255,.06),0 0 0 9px rgba(0,0,0,.3)}

/* 18 — Vignette Ring (soft dark ring, no hard line) */
.b18{box-shadow:inset 0 0 50px rgba(0,0,0,.6),inset 0 0 100px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.04)}

/* 19 — Holographic Edge (translucent foil shimmer) */
.b19{box-shadow:0 0 0 1px rgba(6,182,212,.1),0 0 0 3px rgba(124,58,237,.06),0 0 0 5px rgba(6,182,212,.04),inset 0 0 40px rgba(6,182,212,.03)}

/* 20 — Lens Distortion Edge (barrel distortion vignette + bright rim) */
.b20{box-shadow:inset 0 0 80px rgba(0,0,0,.65),inset 0 0 0 1.5px rgba(255,255,255,.08),0 0 30px rgba(0,0,0,.4)}
</style>
</head>
<body>

<h1>Border <span>Depth</span> Variations</h1>
<p class="sub">20 optical edge effects · depth illusion between browser and frame</p>

<div class="grid" id="grid"></div>

<script>
const variants = [
  {n:'01',label:'Deep Inset Shadow',desc:'Sunken frame'},
  {n:'02',label:'Layered Bevel',desc:'3D picture frame'},
  {n:'03',label:'Floating Depth',desc:'Elevated card'},
  {n:'04',label:'Glass Edge Refraction',desc:'Cyan rim light'},
  {n:'05',label:'Inner Glow Border',desc:'Light bleeding in'},
  {n:'06',label:'Double Ring',desc:'Two concentric borders'},
  {n:'07',label:'Corner Light Leaks',desc:'Warm amber corners'},
  {n:'08',label:'Deep Tunnel',desc:'Heavy vignette + thin edge'},
  {n:'09',label:'Frosted Border',desc:'Blurred glass edge'},
  {n:'10',label:'Breathing Border',desc:'Animated pulse'},
  {n:'11',label:'Metallic Edge',desc:'Multi-stop gradient'},
  {n:'12',label:'Offset Light Source',desc:'Directional depth'},
  {n:'13',label:'Cinema Matte',desc:'Letterbox depth'},
  {n:'14',label:'Prism Edge',desc:'Iridescent rainbow'},
  {n:'15',label:'Floating Above Surface',desc:'Floor drop shadow'},
  {n:'16',label:'Inner Chamfer',desc:'Machined 45° bevel'},
  {n:'17',label:'Optical Illusion Gap',desc:'Bright line + dark mass'},
  {n:'18',label:'Vignette Ring',desc:'Soft dark ring'},
  {n:'19',label:'Holographic Edge',desc:'Translucent shimmer'},
  {n:'20',label:'Lens Distortion Edge',desc:'Barrel vignette + rim'},
];

const grid = document.getElementById('grid');
variants.forEach(v => {
  const card = document.createElement('div');
  card.className = 'card b' + v.n;
  card.innerHTML =
    '<div class="card-inner"><h3>Tutto chiaro.<br><em>Sempre. Subito.</em></h3></div>' +
    '<div class="card-label">#' + v.n + ' ' + v.label + '</div>';
  grid.appendChild(card);
});
</script>
</body>
</html>
