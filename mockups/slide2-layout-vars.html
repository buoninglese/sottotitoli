<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 2 Layout Variations · Sottotitoli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-snap-type:y mandatory;overflow-y:scroll}
body{background:#0a0c10;color:#fff;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}

/* ── Full-screen section ── */
.section{position:relative;width:100vw;height:100vh;scroll-snap-align:start;overflow:hidden;
  background:url('../img/bg-home.png') center/cover no-repeat;background-attachment:fixed}
.section::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:0}
.section::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.45) 100%)}
.section-inner{position:relative;z-index:2;width:100%;height:100%;display:flex}

/* ── Label badge ── */
.label{position:absolute;bottom:24px;right:32px;z-index:10;
  font-size:12px;font-weight:600;color:rgba(255,255,255,.25);
  font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.05em;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);
  border-radius:100px;padding:6px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* ── Nav dots ── */
.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:100;
  display:flex;flex-direction:column;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .25s}
.dot:hover,.dot.active{background:rgba(255,255,255,.7);border-color:rgba(255,255,255,.4);
  transform:scale(1.4)}

/* ── Shared typography ── */
.ttl{font-family:Manrope,sans-serif;font-weight:800;line-height:1.1;
  text-shadow:-1px -1px 0 rgba(6,182,212,.35),1px 1px 0 rgba(0,0,0,.8),0 3px 10px rgba(0,0,0,.6)}
.ttl em{font-style:normal;color:#06b6d4}
.subt{font-size:clamp(12px,1vw,14px);color:rgba(255,255,255,.55);line-height:1.5;
  text-shadow:0 1px 4px rgba(0,0,0,.8);font-weight:500}

/* Caption box */
.cap-box{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);
  border-radius:12px;padding:clamp(12px,1.6vh,18px) clamp(14px,2vw,22px);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.cap-time{font-size:clamp(8px,.9vw,10px);color:rgba(255,255,255,.2);
  font-family:'JetBrains Mono',monospace;margin-bottom:4px}
.cap-text{font-size:clamp(12px,1.2vw,15px);color:rgba(255,255,255,.8);line-height:1.5;font-weight:500}

/* LIVE bar — VAR 7 NLTV style */
.live-bar{display:inline-flex;align-items:center;gap:6px;
  font-family:'Arial Narrow','Arial',sans-serif;font-size:clamp(14px,1.6vw,18px);
  color:#fff;-webkit-text-stroke:2px rgb(10,10,10);paint-order:stroke fill;text-shadow:none}
.live-dot{width:7px;height:7px;border-radius:50%;background:#fff;display:inline-block}

/* CEFR bar */
.cefr-row{display:flex;align-items:center;gap:6px}
.cefr-lbl{font-size:clamp(8px,.9vw,10px);font-weight:700;
  font-family:'JetBrains Mono',monospace;width:20px}
.cefr-trk{flex:1;height:clamp(5px,.6vh,7px);background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden}
.cefr-fill{height:100%;border-radius:3px}

/* ═══════════════════════════════════════════════════
   01 — CURRENT: iMac left, content right
   ═══════════════════════════════════════════════════ */
.s01 .section-inner{flex-direction:row;align-items:center;padding:clamp(24px,4vh,48px) clamp(32px,5vw,64px);gap:clamp(20px,3vw,40px)}
.s01-imac{flex:1;min-width:0;background:#0b1016;border:2px solid rgba(255,255,255,.07);
  border-radius:16px;padding:clamp(14px,2.5vh,24px);display:flex;flex-direction:column;
  gap:clamp(8px,1.5vh,14px);box-shadow:0 0 0 2px #111318,0 12px 40px rgba(0,0,0,.5)}
.s01-right{width:38%;display:flex;flex-direction:column;gap:clamp(10px,1.8vh,16px)}

/* 02 — OPPOSING TITLES */
.s02 .section-inner{flex-direction:column;justify-content:space-between;
  padding:clamp(28px,5vh,48px) clamp(32px,5vw,64px)}
.s02-top{display:flex;justify-content:space-between;align-items:flex-start}
.s02-mid{display:flex;flex:1;align-items:center;justify-content:center}
.s02-bot{display:flex;justify-content:center;gap:clamp(16px,2vw,32px);align-items:center}

/* 03 — CAPTION-FIRST */
.s03 .section-inner{flex-direction:column;justify-content:center;align-items:center;
  gap:clamp(14px,2.5vh,24px);padding:clamp(24px,4vh,48px)}
.s03-titles{display:flex;gap:clamp(24px,4vw,48px);opacity:.6}

/* 04 — DIAGONAL SPLIT */
.s04 .section-inner{flex-direction:row}
.s04-tl{position:absolute;top:clamp(28px,5vh,48px);left:clamp(32px,5vw,64px);max-width:45%}
.s04-br{position:absolute;bottom:clamp(24px,4vh,40px);right:clamp(28px,4vw,48px);max-width:48%}

/* 05 — VERTICAL STACK */
.s05 .section-inner{flex-direction:column;justify-content:center;align-items:center;
  gap:clamp(16px,2.5vh,24px);padding:clamp(28px,4vh,48px) clamp(32px,5vw,64px)}

/* 06 — MAGAZINE SPREAD */
.s06 .section-inner{flex-direction:row;align-items:stretch;
  padding:clamp(24px,4vh,40px) clamp(32px,5vw,64px)}
.s06-left{flex:1;display:flex;align-items:center;justify-content:center}
.s06-right{width:42%;display:flex;flex-direction:column;justify-content:center;
  gap:clamp(10px,1.8vh,16px)}

/* 07 — TIMELINE */
.s07 .section-inner{flex-direction:row;align-items:center;
  padding:clamp(24px,4vh,48px) clamp(32px,5vw,64px);gap:clamp(16px,2.5vw,32px)}
.s07-timeline{display:flex;flex-direction:column;gap:clamp(8px,1.5vh,12px);flex:1}
.s07-side{width:35%;display:flex;flex-direction:column;gap:clamp(8px,1.5vh,12px)}

/* 08 — GRID MOSAIC */
.s08 .section-inner{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  padding:clamp(18px,3vh,28px);gap:clamp(10px,1.5vw,16px)}
.s08-cell{display:flex;align-items:center;justify-content:center}

/* 09 — MINIMAL ZEN */
.s09 .section-inner{flex-direction:column;justify-content:center;align-items:center;
  gap:clamp(32px,6vh,56px);padding:clamp(32px,5vh,56px)}

/* 10 — CINEMA WIDE */
.s10 .section-inner{flex-direction:column;justify-content:flex-end;
  padding:clamp(28px,4vh,48px) clamp(32px,5vw,64px)}
.s10-top{position:absolute;top:clamp(18px,3vh,28px);left:clamp(32px,5vw,64px);
  right:clamp(32px,5vw,64px);display:flex;justify-content:space-between;opacity:.35}

/* ── Keyboard hint ── */
.kb-hint{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:100;
  font-size:11px;color:rgba(255,255,255,.15);font-family:'JetBrains Mono',monospace;
  letter-spacing:.03em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body>

<!-- Nav dots -->
<div class="dots" id="dots"></div>
<div class="kb-hint" id="kbHint">↓ scroll / ↑↓ arrow keys</div>

<script>
/* ── Shared builders ── */
const cefrData = [{l:'A1',p:15,c:'#22c55e'},{l:'A2',p:45,c:'#a3e635'},{l:'B1',p:25,c:'#facc15'},{l:'B2',p:10,c:'#fb923c'},{l:'C1',p:4,c:'#c084fc'},{l:'C2',p:1,c:'#f472b6'}];
function cefrBars(){return cefrData.map(d=>'<div class="cefr-row"><span class="cefr-lbl" style="color:'+d.c+'">'+d.l+'</span><div class="cefr-trk"><div class="cefr-fill" style="width:'+d.p+'%;background:'+d.c+'"></div></div></div>').join('');}
function captions(){
  return '<div class="cap-box"><div class="cap-time">00:01</div><div class="cap-text">Non si tratta solo di leggere ciò che viene detto.</div></div>'+
    '<div class="cap-box"><div class="cap-time">00:06</div><div class="cap-text">Si tratta di dare a ogni parola il suo tempo, il suo contesto...</div></div>'+
    '<div class="cap-box"><div class="cap-time">00:15</div><div class="cap-text">e quindi la possibilità reale di essere riconosciuta, ricordata e usata.</div></div>';
}
function liveBar(){return '<div class="live-bar"><span class="live-dot"></span>LIVE</div>';}
function leftTitle(size){return '<div class="ttl" style="font-size:'+size+'">Ogni momento,<br><em>le sue parole.</em></div>';}
function rightTitle(size){return '<div class="ttl" style="font-size:'+size+'">Ogni parola,<br><em>il suo momento.</em></div>';}
function profileText(){return '<div class="subt">Scopri il tuo profilo linguistico completo. Statistiche in tempo reale e report AI che tracciano il percorso migliore per te.</div>';}

/* ── Variant definitions ── */
const variants = [
  {n:'01',label:'Current — iMac left, content right',cls:'s01',html:
    '<div class="s01-imac">'+captions()+'<div style="margin-top:4px">'+liveBar()+'</div></div>'+
    '<div class="s01-right">'+rightTitle('clamp(22px,3vw,34px)')+profileText()+'<div style="margin-top:4px">'+cefrBars()+'</div></div>'
  },
  {n:'02',label:'Opposing Titles — left vs right',cls:'s02',html:
    '<div class="s02-top">'+leftTitle('clamp(26px,3.5vw,42px)')+rightTitle('clamp(26px,3.5vw,42px)')+'</div>'+
    '<div class="s02-mid"><div style="max-width:620px;display:flex;flex-direction:column;gap:10px;width:100%">'+captions()+'</div></div>'+
    '<div class="s02-bot">'+liveBar()+'<div style="display:flex;gap:5px;flex-direction:column;min-width:220px">'+cefrBars()+'</div></div>'
  },
  {n:'03',label:'Caption-First — captions dominant',cls:'s03',html:
    '<div class="s03-titles">'+leftTitle('clamp(20px,2.5vw,30px)')+rightTitle('clamp(20px,2.5vw,30px)')+'</div>'+
    '<div style="max-width:660px;width:100%;display:flex;flex-direction:column;gap:10px">'+captions()+'</div>'+
    '<div style="display:flex;gap:24px;align-items:center">'+liveBar()+profileText()+'</div>'
  },
  {n:'04',label:'Diagonal Split — TL title, BR captions',cls:'s04',html:
    '<div class="s04-tl">'+leftTitle('clamp(30px,4.5vw,48px)')+'</div>'+
    '<div class="s04-br" style="display:flex;flex-direction:column;gap:10px">'+captions()+'<div style="margin-top:4px">'+liveBar()+'</div></div>'
  },
  {n:'05',label:'Vertical Stack — full-width centered',cls:'s05',html:
    leftTitle('clamp(28px,4vw,44px)')+
    '<div style="max-width:640px;width:100%;display:flex;flex-direction:column;gap:10px">'+captions()+'</div>'+
    '<div style="display:flex;gap:20px;align-items:center">'+liveBar()+rightTitle('clamp(22px,3vw,34px)')+'</div>'+
    '<div style="display:flex;gap:14px">'+cefrBars()+'</div>'
  },
  {n:'06',label:'Magazine Spread — huge title left',cls:'s06',html:
    '<div class="s06-left">'+leftTitle('clamp(38px,6vw,60px)')+'</div>'+
    '<div class="s06-right">'+rightTitle('clamp(20px,2.5vw,30px)')+profileText()+'<div style="display:flex;flex-direction:column;gap:10px">'+captions()+'</div>'+liveBar()+'<div>'+cefrBars()+'</div></div>'
  },
  {n:'07',label:'Timeline — captions flow vertically',cls:'s07',html:
    '<div class="s07-timeline">'+captions()+'<div>'+liveBar()+'</div></div>'+
    '<div class="s07-side">'+leftTitle('clamp(22px,3vw,34px)')+rightTitle('clamp(22px,3vw,34px)')+profileText()+'<div>'+cefrBars()+'</div></div>'
  },
  {n:'08',label:'Grid Mosaic — 2×2 layout',cls:'s08',html:
    '<div class="s08-cell">'+leftTitle('clamp(20px,2.8vw,32px)')+'</div>'+
    '<div class="s08-cell">'+rightTitle('clamp(20px,2.8vw,32px)')+'</div>'+
    '<div class="s08-cell" style="flex-direction:column;gap:5px">'+captions()+'</div>'+
    '<div class="s08-cell" style="flex-direction:column;gap:6px">'+liveBar()+profileText()+'<div>'+cefrBars()+'</div></div>'
  },
  {n:'09',label:'Minimal Zen — one title, one caption',cls:'s09',html:
    leftTitle('clamp(34px,5vw,52px)')+
    '<div style="max-width:580px;width:100%">'+captions()+'</div>'+
    '<div style="display:flex;gap:20px;align-items:center">'+liveBar()+'<span class="subt">Ogni parola, il suo momento.</span></div>'
  },
  {n:'10',label:'Cinema Wide — ultra-wide, titles watermark',cls:'s10',html:
    '<div class="s10-top">'+leftTitle('clamp(30px,4.5vw,48px)')+rightTitle('clamp(30px,4.5vw,48px)')+'</div>'+
    '<div style="max-width:800px;width:100%;display:flex;flex-direction:column;gap:10px">'+captions()+'</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">'+liveBar()+'<div style="display:flex;gap:10px">'+cefrBars()+'</div></div>'
  },
];

/* ── Build sections ── */
const dotsEl = document.getElementById('dots');
variants.forEach((v,i) => {
  const sec = document.createElement('div');
  sec.className = 'section '+v.cls;
  sec.id = 'v'+v.n;
  sec.innerHTML = '<div class="section-inner">'+v.html+'</div><div class="label">#'+v.n+' '+v.label+'</div>';
  document.body.appendChild(sec);
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.title = '#'+v.n+' '+v.label;
  dot.addEventListener('click',()=>{document.getElementById('v'+v.n).scrollIntoView({behavior:'smooth'});});
  dotsEl.appendChild(dot);
});

/* ── Active dot tracking ── */
const dots = document.querySelectorAll('.dot');
const kbHint = document.getElementById('kbHint');
function updateActive(){
  const sections = document.querySelectorAll('.section');
  let active = 0;
  sections.forEach((s,i)=>{
    const r = s.getBoundingClientRect();
    if(r.top < window.innerHeight*.5 && r.bottom > window.innerHeight*.5) active = i;
  });
  dots.forEach((d,i)=>d.classList.toggle('active',i===active));
}
window.addEventListener('scroll',updateActive,{passive:true});
updateActive();

/* ── Keyboard navigation ── */
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const sections = document.querySelectorAll('.section');
    let active = 0;
    sections.forEach((s,i)=>{
      const r = s.getBoundingClientRect();
      if(r.top < window.innerHeight*.5 && r.bottom > window.innerHeight*.5) active = i;
    });
    const next = e.key==='ArrowDown' ? Math.min(active+1,sections.length-1) : Math.max(active-1,0);
    sections[next].scrollIntoView({behavior:'smooth'});
  }
});

/* ── Fade hint on scroll ── */
let hintTimeout;
window.addEventListener('scroll',()=>{
  kbHint.style.opacity='.3';
  clearTimeout(hintTimeout);
  hintTimeout = setTimeout(()=>{kbHint.style.opacity='.15';},2000);
},{passive:true});
</script>
</body>
</html>
