<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Entrance — 20 Bottom-Up Variations · Sottotitoli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cyan:#06b6d4}
body{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;background:url('../img/bg-home.png') center/cover no-repeat;color:#fff;min-height:100vh;padding:40px 24px 80px}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(0,0,0,.3)}
.page-border{position:fixed;inset:0;z-index:200;pointer-events:none;border-radius:20px;box-shadow:inset 0 0 80px rgba(0,0,0,.65),inset 0 0 0 1.5px rgba(255,255,255,.08),0 0 30px rgba(0,0,0,.4);margin:10px}
.content{position:relative;z-index:1;max-width:1400px;margin:0 auto}
h1{font-family:'Manrope',sans-serif;font-size:clamp(32px,5vw,40px);font-weight:800;text-align:center;margin-bottom:6px;letter-spacing:-1px}
.subtitle{text-align:center;color:rgba(255,255,255,.3);font-size:13px;margin-bottom:48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.04);border-radius:16px;padding:32px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden;min-height:360px}
.card-num{position:absolute;top:10px;left:14px;font-size:10px;font-weight:700;color:rgba(255,255,255,.1);text-transform:uppercase;letter-spacing:.06em;z-index:2}
.card-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.08em;z-index:2}
.card-desc{font-size:10px;color:rgba(255,255,255,.12);text-align:center;max-width:170px;line-height:1.4}
.card-btn{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:7px 18px;border-radius:100px;cursor:pointer;transition:background .2s,border-color .2s;z-index:2;margin-top:auto}
.card-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}

.phone-frame{position:relative;display:flex;flex-direction:column;aspect-ratio:9/19;width:130px;background:#000;border:2px solid #1a1a22;border-radius:22px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.6),0 0 0 1px #0a0a0e,0 0 0 3px #0f0f15,0 0 0 4px #1a1a22;flex-shrink:0}
.phone-notch{display:flex;justify-content:center;background:#000;padding-top:5px}
.phone-notch-pill{width:44px;height:11px;background:#000;border-radius:10px;border:1px solid rgba(255,255,255,.04)}
.phone-screen{flex:1;background:linear-gradient(180deg,#0f1922 0%,#0a1018 100%);display:flex;align-items:center;justify-content:center}
.phone-app-title{font-size:7px;font-weight:700;color:rgba(255,255,255,.15);text-transform:uppercase;letter-spacing:.04em}
.phone-status{display:flex;justify-content:space-between;padding:3px 8px 1px;font-size:6px;font-weight:600;color:rgba(255,255,255,.3)}
.phone-status .time{color:#fff}
.phone-nav{display:flex;justify-content:space-around;padding:3px 4px 8px;border-top:1px solid rgba(255,255,255,.04);background:rgba(0,0,0,.4)}
.phone-nav i{font-size:7px;color:rgba(255,255,255,.15)}
.phone-nav i.active{color:var(--cyan)}

/* === All bottom-up, slower (~1.5-2.5s) === */

/* 01 — Simple rise + fade */
@keyframes a01{0%{opacity:0;transform:translateY(80px)}100%{opacity:1;transform:translateY(0)}}
.v01.animate .phone-frame{animation:a01 1.5s ease-out both}

/* 02 — Rise with slight rotation */
@keyframes a02{0%{opacity:0;transform:translateY(90px) rotate(-2deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
.v02.animate .phone-frame{animation:a02 1.6s ease-out both}

/* 03 — Rise + overshoot settle */
@keyframes a03{0%{opacity:0;transform:translateY(100px)}65%{opacity:1;transform:translateY(-8px)}85%{transform:translateY(2px)}100%{opacity:1;transform:translateY(0)}}
.v03.animate .phone-frame{animation:a03 1.8s cubic-bezier(.34,1.56,.64,1) both}

/* 04 — Slow rise with micro-wobble */
@keyframes a04{0%{opacity:0;transform:translateY(70px) rotate(1deg)}40%{opacity:1;transform:translateY(15px) rotate(-.5deg)}70%{transform:translateY(-3px) rotate(.3deg)}85%{transform:translateY(1px) rotate(-.1deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
.v04.animate .phone-frame{animation:a04 2s ease-out both}

/* 05 — Shaky rise (handheld from below) */
@keyframes a05{0%{opacity:0;transform:translateY(60px) rotate(-1.5deg)}8%{opacity:.6;transform:translateY(55px) rotate(-.8deg)}16%{transform:translateY(62px) rotate(-2deg)}24%{transform:translateY(48px) rotate(-.5deg)}32%{transform:translateY(55px) rotate(-1.2deg)}40%{transform:translateY(38px) rotate(-.3deg)}50%{transform:translateY(28px) rotate(-.8deg)}60%{transform:translateY(16px) rotate(-.2deg)}72%{transform:translateY(5px) rotate(-.3deg)}84%{transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(0) rotate(0)}}
.v05.animate .phone-frame{animation:a05 2.2s ease-out both}

/* 06 — Rise, slight squash on landing */
@keyframes a06{0%{opacity:0;transform:translateY(110px) scale(.95,.92)}50%{opacity:1;transform:translateY(0) scale(1.02,.98)}62%{transform:translateY(-4px) scale(1,1.02)}72%{transform:translateY(0) scale(1,.99)}82%{transform:translateY(-1px) scale(1,1.005)}100%{opacity:1;transform:translateY(0) scale(1)}}
.v06.animate .phone-frame{animation:a06 1.8s ease-out both}

/* 07 — Decelerating rise (easing out hard) */
@keyframes a07{0%{opacity:0;transform:translateY(120px)}100%{opacity:1;transform:translateY(0)}}
.v07.animate .phone-frame{animation:a07 2s cubic-bezier(.25,.1,.1,1) both}

/* 08 — Gentle float up */
@keyframes a08{0%{opacity:0;transform:translateY(50px) scale(1.03)}40%{opacity:1;transform:translateY(10px) scale(1.01)}70%{transform:translateY(2px) scale(1)}100%{opacity:1;transform:translateY(0) scale(1)}}
.v08.animate .phone-frame{animation:a08 2.2s ease-out both}

/* 09 — Rise + lean correction */
@keyframes a09{0%{opacity:0;transform:translateY(80px) rotate(3deg)}50%{opacity:1;transform:translateY(20px) rotate(-1deg)}75%{transform:translateY(-2px) rotate(.5deg)}90%{transform:translateY(0) rotate(-.2deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
.v09.animate .phone-frame{animation:a09 2s ease-out both}

/* 10 — Subtle rise, no rotation, pure vertical */
@keyframes a10{0%{opacity:0;transform:translateY(65px)}70%{opacity:.9;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
.v10.animate .phone-frame{animation:a10 2.4s ease-out both}

/* 11 — Rise from below with shadow bloom */
@keyframes a11{0%{opacity:0;transform:translateY(90px);filter:drop-shadow(0 40px 20px rgba(0,0,0,.8))}100%{opacity:1;transform:translateY(0);filter:drop-shadow(0 16px 30px rgba(0,0,0,.5))}}
.v11.animate .phone-frame{animation:a11 1.8s ease-out both}

/* 12 — Pocket pull: overshoot + settle */
@keyframes a12{0%{opacity:0;transform:translateY(130px) scale(.85)}55%{opacity:1;transform:translateY(-12px) scale(1.03)}72%{transform:translateY(3px) scale(.98)}85%{transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:translateY(0) scale(1)}}
.v12.animate .phone-frame{animation:a12 2s ease-out both}

/* 13 — Rise with subtle horizontal drift */
@keyframes a13{0%{opacity:0;transform:translateY(85px) translateX(-15px)}60%{opacity:1;transform:translateY(8px) translateX(2px)}80%{transform:translateY(-1px) translateX(-1px)}100%{opacity:1;transform:translateY(0) translateX(0)}}
.v13.animate .phone-frame{animation:a13 1.9s ease-out both}

/* 14 — Elastic from below */
@keyframes a14{0%{opacity:0;transform:translateY(100px) scale(.9)}50%{opacity:1;transform:translateY(-14px) scale(1.04)}68%{transform:translateY(5px) scale(.97)}82%{transform:translateY(-3px) scale(1.02)}92%{transform:translateY(1px) scale(.99)}100%{opacity:1;transform:translateY(0) scale(1)}}
.v14.animate .phone-frame{animation:a14 2.2s ease-out both}

/* 15 — Tilt rise: starts tilted, straightens */
@keyframes a15{0%{opacity:0;transform:translateY(75px) rotate(-4deg)}40%{opacity:1;transform:translateY(25px) rotate(2deg)}65%{transform:translateY(5px) rotate(-1deg)}85%{transform:translateY(0) rotate(.3deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
.v15.animate .phone-frame{animation:a15 2.1s ease-out both}

/* 16 — Two-step rise: pause midway */
@keyframes a16{0%{opacity:0;transform:translateY(90px)}35%{opacity:.7;transform:translateY(40px)}36%{opacity:.7;transform:translateY(40px)}70%{opacity:1;transform:translateY(2px)}100%{opacity:1;transform:translateY(0)}}
.v16.animate .phone-frame{animation:a16 2.5s ease-out both}

/* 17 — Smooth rise + scale */
@keyframes a17{0%{opacity:0;transform:translateY(70px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
.v17.animate .phone-frame{animation:a17 2s cubic-bezier(.22,.61,.36,1) both}

/* 18 — Rise with micro-shake */
@keyframes a18{0%{opacity:0;transform:translateY(80px) rotate(.5deg)}12%{opacity:.8;transform:translateY(70px) rotate(-.8deg)}24%{transform:translateY(58px) rotate(1deg)}36%{transform:translateY(42px) rotate(-.5deg)}48%{transform:translateY(28px) rotate(.3deg)}60%{transform:translateY(14px) rotate(-.2deg)}75%{transform:translateY(4px) rotate(.1deg)}100%{opacity:1;transform:translateY(0) rotate(0)}}
.v18.animate .phone-frame{animation:a18 2.5s ease-out both}

/* 19 — Quick rise, slow settle */
@keyframes a19{0%{opacity:0;transform:translateY(80px)}30%{opacity:1;transform:translateY(-5px)}50%{transform:translateY(3px)}70%{transform:translateY(-1px)}85%{transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
.v19.animate .phone-frame{animation:a19 2.2s ease-out both}

/* 20 — Heavy phone: weighty rise */
@keyframes a20{0%{opacity:0;transform:translateY(140px)}60%{opacity:1;transform:translateY(6px)}80%{transform:translateY(1px)}100%{opacity:1;transform:translateY(0)}}
.v20.animate .phone-frame{animation:a20 2.4s cubic-bezier(.45,0,.2,1) both}
</style>
</head>
<body>
<div class="page-border"></div>
<div class="content">
<h1>Phone Entrance — 20 Bottom-Up Variations</h1>
<p class="subtitle">All rise from below · Slower pacing · Click to replay</p>
<div class="grid" id="grid"></div>
</div>
<script>
var variants=[
  {num:'01',label:'Simple Rise',desc:'Straight up 80px, clean fade-in'},
  {num:'02',label:'Rise + Slight Tilt',desc:'90px up with -2° rotation that straightens'},
  {num:'03',label:'Overshoot Settle',desc:'Springy: goes past, snaps back gently'},
  {num:'04',label:'Micro-Wobble Rise',desc:'Slow rise with tiny rotational corrections'},
  {num:'05',label:'Handheld Shaky',desc:'Shaky drift up, like held in a hand'},
  {num:'06',label:'Squash on Landing',desc:'Compresses slightly on arrival, bounces back'},
  {num:'07',label:'Decelerating Rise',desc:'Hard ease-out, slows dramatically near top'},
  {num:'08',label:'Gentle Float',desc:'Light scale + slow drift, barely there'},
  {num:'09',label:'Lean Correction',desc:'Starts tilted 3°, overcorrects, settles'},
  {num:'10',label:'Pure Vertical',desc:'No rotation, no scale, just slow rise'},
  {num:'11',label:'Shadow Bloom',desc:'Rise with shadow softening as it lands'},
  {num:'12',label:'Pocket Pull',desc:'Deep pull from below, elastic overshoot'},
  {num:'13',label:'Drift + Correct',desc:'Rises with slight horizontal nudge'},
  {num:'14',label:'Elastic Bounce',desc:'Big overshoot, double bounce settle'},
  {num:'15',label:'Tilt Straighten',desc:'Starts tilted -4°, overcorrects to straight'},
  {num:'16',label:'Two-Step Pause',desc:'Pauses mid-rise, then completes'},
  {num:'17',label:'Scale + Rise',desc:'Starts .92 scale, rises to full size'},
  {num:'18',label:'Extended Tremor',desc:'8-keyframe micro-shake over 2.5s'},
  {num:'19',label:'Quick Rise Slow Settle',desc:'Fast up, then slow micro-bounce settle'},
  {num:'20',label:'Heavy Weight Rise',desc:'140px from below, weighty deceleration'}
];

function buildPhone(){
  return `<div class="phone-frame">
    <div class="phone-notch"><div class="phone-notch-pill"></div></div>
    <div class="phone-status"><span class="time">9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
    <div class="phone-screen"><span class="phone-app-title">sottotitoli</span></div>
    <div class="phone-nav"><i class="fa-solid fa-closed-captioning active"></i><i class="fa-solid fa-language"></i><i class="fa-solid fa-chart-bar"></i><i class="fa-solid fa-user"></i></div>
  </div>`;
}

var grid=document.getElementById('grid');
variants.forEach(function(v){
  var card=document.createElement('div');
  card.className='card v'+v.num;
  card.innerHTML='<span class="card-num">'+v.num+'</span><span class="card-label">'+v.label+'</span>'+buildPhone()+'<span class="card-desc">'+v.desc+'</span><button class="card-btn" onclick="replay(this)">▶ Replay</button>';
  grid.appendChild(card);
  setTimeout(function(){card.classList.add('animate');},200+parseInt(v.num)*120);
});

function replay(btn){
  var card=btn.closest('.card');
  card.classList.remove('animate');
  void card.offsetWidth;
  card.classList.add('animate');
}
</script>
</body>
</html>
