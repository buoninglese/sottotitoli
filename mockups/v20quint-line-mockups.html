<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>V20quint · 10 Line Layout Mockups</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f15;--card:#131820;--line:#1e2632;--line2:#283242;--text:#e2e4e9;--t2:#9099a8;--t3:#5e6676;--accent:#7c3aed;--a2:#a78bfa;--green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;--red:#ef4444;--teal:#14b8a6;--pink:#ec4899;--r:14px;--f:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.sub{font-size:13px;color:var(--t3);margin:4px 0 20px}
.page{padding:24px;max-width:1500px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:14px}

/* Card */
.m{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.mh{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.mn{font-size:10px;font-weight:700;color:var(--a2);letter-spacing:.08em;min-width:36px}
.mt{font-size:12px;font-weight:600;color:var(--text);flex:1;margin-left:6px}
.mc{flex:1;overflow-y:auto;min-height:320px;max-height:450px;padding:12px 14px;display:flex;flex-direction:column}
.mc.fill{justify-content:flex-end}
.play-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;color:var(--t2);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;margin-left:6px}
.play-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(124,58,237,.1)}
.play-btn.playing{border-color:var(--green);color:var(--green)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.page{padding:10px}.mc{min-height:240px;max-height:360px}}

/* ═══ SHARED ELEMENTS ═══ */
.act{display:inline-flex;gap:3px;opacity:0;transition:opacity .12s;flex-shrink:0}
.line:hover .act,.row:hover .act,.entry:hover .act{opacity:1}
.act button{width:22px;height:22px;border-radius:50%;border:1px solid rgba(128,128,128,.2);background:rgba(128,128,128,.05);color:var(--t3);cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;transition:all .1s}
.act button:hover{border-color:var(--accent);color:var(--accent)}
.act .del:hover{border-color:var(--red);color:var(--red)}
.act .bm:hover{border-color:var(--amber);color:var(--amber)}
/* Animations */
@keyframes in{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:translateY(0)}}
@keyframes inLeft{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:translateX(0)}}

/* ── V1: Compact Inline — all on one line ── */
.v1 .line{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;background:rgba(20,184,166,.06);border:1px solid rgba(20,184,166,.1);opacity:0;animation:in .4s ease-out forwards;position:relative}
.v1 .line .meta{display:flex;align-items:center;gap:5px;flex-shrink:0;width:80px;justify-content:flex-end}
.v1 .line .num{font-size:8px;font-weight:700;color:var(--teal);background:rgba(20,184,166,.15);padding:1px 6px;border-radius:99px}
.v1 .line .time{font-size:9px;color:var(--t3);font-family:var(--mono)}
.v1 .line .txt{flex:1;min-width:0;font-size:14px;line-height:1.4;margin-left:4px}

/* ── V2: Stacked Left — two-line, meta drops below ── */
.v2 .line{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;border-radius:6px;background:rgba(59,130,246,.05);border:1px solid rgba(59,130,246,.1);opacity:0;animation:in .4s ease-out forwards;position:relative;flex-wrap:wrap}
.v2 .line .meta{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0;width:38px;padding-top:2px}
.v2 .line .num{font-size:9px;font-weight:700;color:var(--blue)}
.v2 .line .time{font-size:8px;color:var(--t3);font-family:var(--mono)}
.v2 .line .txt{flex:1;min-width:200px;font-size:14px;line-height:1.45;margin-left:4px}

/* ── V3: Chat Bubble — text in bubble, meta below ── */
.v3 .line{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:0;opacity:0;animation:in .4s ease-out forwards;position:relative}
.v3 .line .bubble{max-width:85%;padding:10px 14px;border-radius:14px 14px 14px 4px;background:rgba(124,58,237,.12);font-size:14px;line-height:1.45;color:var(--text)}
.v3 .line .meta{display:flex;align-items:center;gap:6px;padding-left:4px}
.v3 .line .num{font-size:8px;color:var(--a2);font-weight:700}
.v3 .line .time{font-size:9px;color:var(--t3);font-family:var(--mono)}
.v3 .act{position:absolute;right:0;top:50%;transform:translateY(-50%)}

/* ── V4: Pill Inline — floating pill with badge ── */
.v4 .line{display:flex;align-items:center;gap:0;padding:6px 10px 6px 0;border-radius:99px;background:rgba(236,72,153,.05);border:1px solid rgba(236,72,153,.1);opacity:0;animation:in .4s ease-out forwards;position:relative}
.v4 .line .badge{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:rgba(236,72,153,.12);flex-shrink:0;margin-right:10px}
.v4 .line .num{font-size:11px;font-weight:800;color:var(--pink);line-height:1}
.v4 .line .time{font-size:8px;color:var(--t3);font-family:var(--mono);margin-top:1px}
.v4 .line .txt{flex:1;min-width:0;font-size:14px;line-height:1.4;margin:0 8px}

/* ── V5: Terminal — monospace, hacker style ── */
.v5 .line{display:flex;align-items:center;gap:8px;padding:6px 10px;font-family:var(--mono);font-size:13px;border-bottom:1px solid rgba(255,255,255,.03);opacity:0;animation:in .35s ease-out forwards;position:relative}
.v5 .line .time{color:var(--green);flex-shrink:0;font-size:12px}
.v5 .line .prompt{color:var(--accent);flex-shrink:0}
.v5 .line .txt{flex:1;min-width:0;color:var(--t2)}
.v5 .act button{font-family:var(--mono);font-size:8px}

/* ── V6: Card — full card with title bar ── */
.v6 .line{display:flex;flex-direction:column;border-radius:8px;background:var(--bg);border:1px solid var(--line2);overflow:hidden;opacity:0;animation:in .4s ease-out forwards;position:relative}
.v6 .line .hbar{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--line)}
.v6 .line .hbar .meta{display:flex;align-items:center;gap:6px}
.v6 .line .num{font-size:8px;font-weight:700;color:var(--a2);background:rgba(124,58,237,.15);padding:1px 6px;border-radius:3px}
.v6 .line .time{font-size:9px;color:var(--t3);font-family:var(--mono)}
.v6 .line .txt{padding:10px 12px;font-size:14px;line-height:1.5}

/* ── V7: Newspaper — clean, editorial, no backgrounds ── */
.v7 .line{display:flex;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid rgba(128,128,128,.05);opacity:0;animation:inLeft .45s ease-out forwards;position:relative}
.v7 .line .num{font-size:22px;font-weight:900;color:var(--t3);font-family:'Playfair Display',serif;min-width:28px;text-align:right;flex-shrink:0;line-height:1}
.v7 .line .txt{flex:1;font-size:16px;line-height:1.55;font-family:'Playfair Display',serif}
.v7 .line .time{font-size:9px;color:var(--t3);font-family:var(--mono);flex-shrink:0;padding-top:3px}

/* ── V8: Timeline — vertical bar with dots ── */
.v8 .line{display:flex;align-items:flex-start;gap:12px;padding:0 0 16px 0;position:relative;opacity:0;animation:in .4s ease-out forwards}
.v8 .line::before{content:'';position:absolute;left:11px;top:22px;bottom:-16px;width:2px;background:var(--line2)}
.v8 .line:last-child::before{display:none}
.v8 .line .dot{width:24px;height:24px;border-radius:50%;background:var(--accent);border:3px solid var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:center;z-index:1;box-shadow:0 0 12px rgba(124,58,237,.3)}
.v8 .line .dot .num{font-size:8px;font-weight:800;color:#fff}
.v8 .line .body{flex:1;min-width:0}
.v8 .line .time{font-size:9px;color:var(--t3);font-family:var(--mono);margin-bottom:2px}
.v8 .line .txt{font-size:14px;line-height:1.45;padding:8px 10px;background:rgba(255,255,255,.015);border-radius:6px;border:1px solid var(--line)}

/* ── V9: Superwide Dashboard — big typography, generous spacing ── */
.v9 .line{display:flex;align-items:center;gap:20px;padding:14px 20px;border-radius:10px;background:rgba(20,184,166,.04);border:1px solid rgba(20,184,166,.08);opacity:0;animation:in .5s ease-out forwards;position:relative}
.v9 .line .meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;min-width:70px}
.v9 .line .num{font-size:11px;font-weight:800;color:var(--teal)}
.v9 .line .time{font-size:18px;font-weight:700;color:var(--text);font-family:var(--mono);letter-spacing:-.02em}
.v9 .line .txt{flex:1;font-size:18px;line-height:1.5;font-weight:500}
.v9 .act button{width:28px;height:28px;font-size:11px}

/* ── V10: Minimal — just time + text, icons hover right ── */
.v10 .line{display:flex;align-items:center;gap:12px;padding:6px 8px;opacity:0;animation:in .3s ease-out forwards;position:relative;border-left:3px solid transparent;transition:border-color .15s}
.v10 .line:hover{border-left-color:rgba(124,58,237,.2)}
.v10 .line .time{font-size:10px;color:var(--t3);font-family:var(--mono);flex-shrink:0;width:50px;text-align:right}
.v10 .line .txt{flex:1;font-size:14px;line-height:1.4}
</style>
</head>
<body>
<div class="page">
  <h1>🔤 V20quint · 10 Line Layout Mockups</h1>
  <p class="sub">Exploring different ways to arrange #N · timestamp · sentence text · action icons</p>

  <div class="grid" id="grid"></div>
</div>

<script>
// ═══ DEMO ENGINE ═══
var S = [
  'The weather today is quite lovely.',
  'Het is vandaag echt prachtig weer buiten.',
  'The project deadline has been extended to Friday.',
  'We moeten nog even geduld hebben met de resultaten.',
  'She said she would call back within the hour.',
  'Can you send me the document by email?',
  'Ik denk dat we morgen een beslissing kunnen nemen.',
  'The meeting room is on the third floor.',
  'Dat klinkt als een uitstekend plan voor vanavond.',
  'I really appreciate your help with this.',
  'Zij heeft gisteren nog gebeld over de afspraak.',
  'Looking forward to our next conversation together.'
];

function fmtTime(sec){ var m=Math.floor(sec/60); var s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

var iconsHTML = '<span class="act"><button title="Edit">✎</button><button class="bm" title="Bookmark">☆</button><button class="del" title="Delete">🗑</button></span>';

var variations = [
  {
    id:'V1', title:'Compact Inline', desc:'All on one line, meta right-aligned',
    bodyClass:'v1',
    cardClass:'fill',
    render:function(b,s,i,t){ return '<div class="line"><span class="meta"><span class="num">#'+(i+1)+'</span><span class="time">'+t+'</span></span><span class="txt">'+s+'</span>'+iconsHTML+'</div>'; }
  },
  {
    id:'V2', title:'Stacked Left', desc:'Number+time stacked, text fills right',
    bodyClass:'v2',
    cardClass:'fill',
    render:function(b,s,i,t){ return '<div class="line"><span class="meta"><span class="num">'+(i+1).toString().padStart(2,'0')+'</span><span class="time">'+t+'</span></span><span class="txt">'+s+'</span>'+iconsHTML+'</div>'; }
  },
  {
    id:'V3', title:'Chat Bubble', desc:'Text in bubble, meta below, icons on side',
    bodyClass:'v3',
    cardClass:'fill',
    render:function(b,s,i,t){ return '<div class="line"><div class="bubble">'+s+'</div><span class="meta"><span class="num">#'+(i+1)+'</span><span class="time">'+t+'</span></span>'+iconsHTML+'</div>'; }
  },
  {
    id:'V4', title:'Pill Inline', desc:'Circular badge with number, floating pill',
    bodyClass:'v4',
    cardClass:'fill',
    render:function(b,s,i,t){ return '<div class="line"><span class="badge"><span class="num">'+(i+1)+'</span><span class="time">'+t+'</span></span><span class="txt">'+s+'</span>'+iconsHTML+'</div>'; }
  },
  {
    id:'V5', title:'Terminal', desc:'Monospace hacker style with prompt',
    bodyClass:'v5',
    cardClass:'',
    render:function(b,s,i,t){ return '<div class="line"><span class="time">['+t+']</span><span class="prompt">$</span><span class="txt">'+s+'</span>'+iconsHTML+'</div>'; }
  },
  {
    id:'V6', title:'Card', desc:'Full card with title bar for meta',
    bodyClass:'v6',
    cardClass:'fill',
    render:function(b,s,i,t){ return '<div class="line"><div class="hbar"><span class="meta"><span class="num">#'+(i+1)+'</span><span class="time">'+t+'</span></span>'+iconsHTML+'</div><div class="txt">'+s+'</div></div>'; }
  },
  {
    id:'V7', title:'Newspaper', desc:'Editorial — big number, serif text, clean',
    bodyClass:'v7',
    cardClass:'',
    render:function(b,s,i,t){ return '<div class="line"><span class="num">'+(i+1)+'</span><span class="txt">'+s+'</span><span class="time">'+t+'</span>'+iconsHTML+'</div>'; }
  },
  {
    id:'V8', title:'Timeline', desc:'Vertical bar + dots, meta on dot',
    bodyClass:'v8',
    cardClass:'',
    render:function(b,s,i,t){ return '<div class="line"><span class="dot"><span class="num">'+(i+1)+'</span></span><div class="body"><div class="time">'+t+'</div><div class="txt">'+s+'</div></div>'+iconsHTML+'</div>'; }
  },
  {
    id:'V9', title:'Superwide Dashboard', desc:'Big type, generous spacing',
    bodyClass:'v9',
    cardClass:'fill',
    render:function(b,s,i,t){ return '<div class="line"><span class="meta"><span class="num">#'+(i+1)+'</span><span class="time">'+t+'</span></span><span class="txt">'+s+'</span>'+iconsHTML+'</div>'; }
  },
  {
    id:'V10', title:'Minimal', desc:'Just time + text, no numbers, hover accent',
    bodyClass:'v10',
    cardClass:'',
    render:function(b,s,i,t){ return '<div class="line"><span class="time">'+t+'</span><span class="txt">'+s+'</span>'+iconsHTML+'</div>'; }
  }
];

// ═══ BUILD GRID ═══
var grid = document.getElementById('grid');
var timers = {};

variations.forEach(function(v){
  var card = document.createElement('div');
  card.className = 'm';
  card.dataset.varId = v.id;
  card.innerHTML = '<div class="mh"><span class="mn">'+v.id+'</span><span class="mt">'+v.title+' <span style="font-weight:400;color:var(--t3);font-size:11px">— '+v.desc+'</span></span><button class="play-btn" data-var="'+v.id+'" onclick="toggleDemo(\''+v.id+'\')" title="Play demo">▶</button></div><div class="mc '+(v.cardClass||'')+'" id="mc-'+v.id+'"></div>';
  grid.appendChild(card);
});

// ═══ DEMO PLAYER ═══
function toggleDemo(id){
  var mc = document.getElementById('mc-'+id);
  var btn = document.querySelector('[data-var="'+id+'"]');
  if (timers[id]) { clearTimeout(timers[id]); delete timers[id]; mc.innerHTML = ''; btn.textContent = '▶'; btn.classList.remove('playing'); return; }
  btn.textContent = '⏹'; btn.classList.add('playing');
  var v = variations.find(function(x){return x.id===id});
  var base = Math.floor(Math.random()*120);
  var idx = 0;
  function next(){
    if (!timers[id]) return;
    if (idx >= 6) { delete timers[id]; btn.textContent = '▶'; btn.classList.remove('playing'); return; }
    var si = [2,5,8,11,0,3][idx];
    var s = S[si];
    var t = fmtTime(base + idx*6);
    mc.insertAdjacentHTML('beforeend', v.render(mc,s,idx,t));
    // Scroll to bottom for fill containers
    if (v.cardClass==='fill') mc.scrollTop = mc.scrollHeight;
    idx++;
    timers[id] = setTimeout(next, 1800 + Math.random()*800);
  }
  timers[id] = setTimeout(next, 300);
}
</script>
</body>
</html>
