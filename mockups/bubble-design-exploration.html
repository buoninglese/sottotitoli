<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Word Dictionary Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cyan:#06b6d4}
body{font-family:'Nunito Sans',sans-serif;background:#060d14;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:40px 24px}
.scene{max-width:560px;width:100%;display:flex;flex-direction:column;gap:16px}
h2{font-size:16px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:4px}
.note{font-size:11px;color:rgba(255,255,255,.25);margin-bottom:12px}

.bub-row{display:flex;flex-direction:column;gap:12px}

.bub{padding:16px 20px;border-radius:14px;line-height:1.6;animation:inUp .7s ease-out both;max-width:86%;position:relative}
.bub.other{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(59,130,246,.03));border:1px solid rgba(59,130,246,.1);align-self:flex-start;border-bottom-left-radius:6px}
.bub.self{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);align-self:flex-end;max-width:70%;text-align:right;border-bottom-right-radius:6px;animation:inRight .7s ease-out both}
.bub-main{font-size:15px;font-weight:600;color:#fff;line-height:1.7}
.bub.other .bub-main{color:#bfdbfe}

/* V5+V2 hybrid: dashed border box, cyan accent, larger */
.bub-orig{font-size:13px;color:var(--cyan);margin-top:10px;padding:10px 14px;border:1px dashed rgba(6,182,212,.25);border-radius:8px;line-height:1.7;font-weight:500}

/* Clickable words */
.bub-main .w,.bub-orig .w{display:inline-block;cursor:pointer;border-radius:4px;padding:1px 4px;margin:0 1px;transition:background .15s,color .15s,box-shadow .15s;position:relative}
.bub-main .w:hover,.bub-orig .w:hover{background:rgba(6,182,212,.2)}
.bub-main .w.active,.bub-orig .w.active{background:rgba(6,182,212,.35);color:#fff;box-shadow:0 0 10px rgba(6,182,212,.25)}

/* Definition popup card */
.def-popup{position:absolute;z-index:50;background:#0f1923;border:1px solid rgba(6,182,212,.2);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 20px rgba(6,182,212,.06);display:none;min-width:180px;max-width:280px;animation:popIn .2s ease-out}
.def-popup.show{display:block}
.def-popup .dp-word{font-size:16px;font-weight:700;color:#fff;margin-bottom:2px}
.def-popup .dp-lang{font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.def-popup .dp-def{font-size:12px;color:rgba(255,255,255,.55);line-height:1.6}
.def-popup .dp-def .tr{color:var(--cyan);font-weight:600;font-size:13px}
.def-popup .dp-close{position:absolute;top:6px;right:8px;background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px;font-family:'Nunito Sans',sans-serif}
.def-popup .dp-close:hover{color:#fff;background:rgba(255,255,255,.05)}

/* Footer bar — clean, legible */
.bub-foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.05);font-size:11px;color:rgba(255,255,255,.35)}
.bub.self .bub-foot{justify-content:flex-end}
.bub-foot .spkr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bub-foot .spkr-name{font-weight:600;color:rgba(255,255,255,.5)}
.bub-foot .spkr-flag{font-size:13px}
.bub-foot .lang-badge{font-size:10px;padding:2px 8px;border-radius:100px;background:rgba(6,182,212,.12);color:var(--cyan);font-weight:600;margin-left:auto}
.bub.self .lang-badge{display:none}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:200;background:var(--cyan);color:#000;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@keyframes inUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes inRight{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body>

<div class="scene">
  <h2>🔤 Tap any word — Italian or English</h2>
  <p class="note">Italian words → English translation · English words → definition</p>
  <div class="bub-row" id="bubRow"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// WORD DICTIONARY — every word from all messages
// ═══════════════════════════════════════════
var dict={
  // Italian → English translations
  'crediamo':{lang:'it',def:'we believe',tr:['we believe','we think','we hold']},
  'che':{lang:'it',def:'that / which / who',tr:['that','which','who']},
  'la':{lang:'it',def:'the (feminine singular)',tr:['the']},
  'chiave':{lang:'it',def:'key',tr:['key','wrench','spanner']},
  'per':{lang:'it',def:'for / in order to',tr:['for','to','in order to']},
  'comprensione':{lang:'it',def:'understanding / comprehension',tr:['understanding','comprehension','grasp']},
  'linguistica':{lang:'it',def:'linguistic / language (adj.)',tr:['linguistic','language','linguistics']},
  'sia':{lang:'it',def:'is (subjunctive) / both ... and',tr:['is','be','whether it be']},
  'visualizzazione':{lang:'it',def:'visualization / display',tr:['visualization','display','rendering']},
  'questo':{lang:'it',def:'this',tr:['this','that']},
  'vogliamo':{lang:'it',def:'we want',tr:['we want','we wish','we desire']},
  'ogni':{lang:'it',def:'every / each',tr:['every','each','any']},
  'conversazione':{lang:'it',def:'conversation',tr:['conversation','talk','discussion']},
  'cristallina':{lang:'it',def:'crystal-clear / crystalline',tr:['crystal clear','crystalline','limpid']},
  'mi':{lang:'it',def:'me / to me (pronoun)',tr:['me','to me','myself']},
  'sembra':{lang:'it',def:'it seems / it looks like',tr:['seems','looks like','appears']},
  'ottimo':{lang:'it',def:'excellent / great / optimal',tr:['excellent','great','optimal','very good']},
  'uno':{lang:'it',def:'one / a (masculine)',tr:['one','a','an']},
  'strumento':{lang:'it',def:'tool / instrument',tr:['tool','instrument','device']},
  'unisce':{lang:'it',def:'unites / combines',tr:['unites','combines','joins','merges']},
  'apprendimento':{lang:'it',def:'learning / education',tr:['learning','education','training']},
  'esperienza':{lang:'it',def:'experience',tr:['experience','background','expertise']},
  'unica':{lang:'it',def:'unique / single (feminine)',tr:['unique','single','one of a kind']},

  // English → definitions
  'we':{lang:'en',def:'First-person plural pronoun. Refers to the speaker and one or more others.'},
  'believe':{lang:'en',def:'To accept something as true; to have confidence in a statement or person.'},
  'the':{lang:'en',def:'Definite article. Refers to a specific person or thing already mentioned.'},
  'key':{lang:'en',def:'A thing that provides access, understanding, or a solution. Also: a metal instrument for opening locks.'},
  'to':{lang:'en',def:'Preposition expressing direction, purpose, or relationship. Used before verbs to form infinitives.'},
  'language':{lang:'en',def:'A system of communication used by a particular country, community, or field.'},
  'learning':{lang:'en',def:'The acquisition of knowledge or skills through study, experience, or being taught.'},
  'is':{lang:'en',def:'Third-person singular present of "be". Indicates existence, identity, or quality.'},
  'visualization':{lang:'en',def:'The act of forming a mental image; representing data or concepts in a visual form.'},
  'that\'s':{lang:'en',def:'Contraction of "that is". Used to introduce an explanation or identification.'},
  'why':{lang:'en',def:'For what reason or purpose. Used to ask about causes or explanations.'},
  'want':{lang:'en',def:'To have a desire to possess, do, or experience something.'},
  'every':{lang:'en',def:'Each one of a group or series, without exception.'},
  'conversation':{lang:'en',def:'An informal talk between two or more people where thoughts and ideas are exchanged.'},
  'be':{lang:'en',def:'To exist; to have a specified quality, identity, or state. The most fundamental English verb.'},
  'crystal':{lang:'en',def:'A solid material whose atoms are arranged in a highly ordered structure. Metaphorically: perfectly clear.'},
  'clear':{lang:'en',def:'Easy to perceive, understand, or interpret. Free from obscurity or ambiguity.'},
  'sounds':{lang:'en',def:'Vibrations that travel through the air and can be heard. Also: gives a specified impression.'},
  'good':{lang:'en',def:'Of a high quality or standard; satisfactory, pleasant, or desirable.'}
};

var messages=[
  {type:'other',tran:'Crediamo che la chiave per la comprensione linguistica sia la visualizzazione.',
   orig:'We believe the key to language learning is visualization.',speaker:'Marco',snl:'🇬🇧',color:'#3b82f6'},
  {type:'other',tran:'Per questo vogliamo che ogni conversazione sia cristallina.',
   orig:'That\'s why we want every conversation to be crystal clear.',speaker:'Marco',snl:'🇬🇧',color:'#3b82f6'},
  {type:'self',tran:'Mi sembra ottimo.',orig:'',speaker:'Sofie',snl:'🇮🇹',color:'#22c55e'}
];

var toast=document.getElementById('toast'),toastTimer;
function showToast(msg){clearTimeout(toastTimer);toast.textContent=msg;toast.classList.add('show');toastTimer=setTimeout(function(){toast.classList.remove('show');},2000);}

// ── Tokenize ──
function tokenize(text,lang){
  return text.split(' ').map(function(w){
    // Handle contractions and punctuation
    var clean=w.replace(/[.,!?;:'\u2019]/g,'').toLowerCase();
    // Special: handle "that's" → "thats"
    if(clean==='thats')clean='that\'s';
    if(clean==='that\u2019s')clean='that\'s';
    var hasData=!!dict[clean];
    var cls=hasData?'w':'';
    return '<span class="'+cls+'" data-word="'+clean+'" data-lang="'+lang+'" data-full="'+w+'">'+w+'</span>';
  }).join(' ');
}

// ── Show definition popup ──
function showDefPopup(wordEl){
  var word=wordEl.getAttribute('data-word');
  var lang=wordEl.getAttribute('data-lang');
  var full=wordEl.getAttribute('data-full');
  var data=dict[word];if(!data)return;

  // Remove any other popup
  document.querySelectorAll('.def-popup').forEach(function(p){p.remove();});
  document.querySelectorAll('.w.active').forEach(function(w){w.classList.remove('active');});
  wordEl.classList.add('active');

  var popup=document.createElement('div');popup.className='def-popup show';
  var bub=wordEl.closest('.bub');
  var bubRect=bub.getBoundingClientRect();
  var wRect=wordEl.getBoundingClientRect();

  var defHTML='';
  var wordFlag=lang==='it'?'🇮🇹':'🇬🇧';
  if(lang==='it'){
    defHTML='<div class="dp-def" style="margin-top:4px">';
    if(data.tr){
      data.tr.forEach(function(t,i){
        defHTML+='<span>🇬🇧 <span class="tr">'+t+'</span></span>'+(i<data.tr.length-1?'<span style="color:rgba(255,255,255,.15);margin:0 4px">·</span>':'');
      });
    }
    defHTML+=data.def?'<div style="margin-top:6px;color:rgba(255,255,255,.3);font-size:10px">'+data.def+'</div>':'';
    defHTML+='</div>';
  }else{
    defHTML='<div class="dp-def">'+data.def+'</div>';
  }

  popup.innerHTML='<div class="dp-word">'+wordFlag+' '+full+'</div><div class="dp-lang">'+(lang==='it'?'italiano':'english')+'</div>'+defHTML+'<button class="dp-close">✕</button>';
  bub.appendChild(popup);

  // Position
  var left=wRect.left-bubRect.left;
  var top=wRect.bottom-bubRect.top+6;
  if(left+280>bubRect.width)left=bubRect.width-290;
  if(left<0)left=4;
  popup.style.left=left+'px';
  popup.style.top=top+'px';

  popup.querySelector('.dp-close').addEventListener('click',function(e){e.stopPropagation();popup.remove();wordEl.classList.remove('active');});

  // Click outside closes
  function outsideClick(e){
    if(!popup.contains(e.target)&&e.target!==wordEl){popup.remove();wordEl.classList.remove('active');document.removeEventListener('click',outsideClick);}
  }
  setTimeout(function(){document.addEventListener('click',outsideClick);},10);
}

// ── Build ──
var bubRow=document.getElementById('bubRow');
messages.forEach(function(m,j){
  var el=document.createElement('div');el.className='bub '+m.type;
  el.style.animationDelay=(j*1.1)+'s';
  el.innerHTML='<div class="bub-main">'+tokenize(m.tran,'it')+'</div>'
    +(m.orig?'<div class="bub-orig">'+tokenize(m.orig,'en')+'</div>':'')
    +'<div class="bub-foot"><span class="spkr-dot" style="background:'+m.color+'"></span><span class="spkr-name">'+m.speaker+'</span><span class="spkr-flag">'+m.snl+'</span>'
    +(m.type==='other'?'<span class="lang-badge">'+m.snl+' IT</span>':'')
    +'</div>';

  el.querySelectorAll('.w').forEach(function(wEl){
    wEl.addEventListener('click',function(e){e.stopPropagation();showDefPopup(this);});
  });

  bubRow.appendChild(el);
});
</script>
</body>
</html>
