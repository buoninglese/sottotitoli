<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Duo Mockups · Sottotitoli</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@400;700&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ═══ SHARED ═══ */
:root{--bg:#0b0f15;--card:#131820;--line:#1e2632;--line2:#283242;--text:#e2e4e9;--t2:#9099a8;--t3:#5e6676;--accent:#7c3aed;--a2:#a78bfa;--green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;--red:#ef4444;--teal:#14b8a6;--pink:#ec4899;--r:14px;--f:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--f);min-height:100vh}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
.subtitle{font-size:13px;color:var(--t3);margin:4px 0 22px}
.page{padding:28px 28px 64px;max-width:1920px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:18px}
.m{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.mn{font-size:11px;font-weight:700;color:var(--a2);letter-spacing:.08em;min-width:44px}
.mt{font-size:12px;font-weight:600;color:var(--text);flex:1;margin-left:8px}
.mb{font-size:9px;padding:2px 8px;border-radius:99px;font-weight:600;margin-left:3px}
.be{background:rgba(59,130,246,.15);color:var(--blue)}
.ba{background:rgba(34,197,94,.15);color:var(--green)}
.bs{background:rgba(236,72,153,.15);color:var(--pink)}
.bt{background:rgba(20,184,166,.15);color:var(--teal)}
.mc{flex:1;overflow-y:auto;position:relative;min-height:300px;max-height:440px}
.play-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;color:var(--t2);cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;margin-left:4px}
.play-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(124,58,237,.1)}
.play-btn.playing{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.1)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
@media(max-width:520px){.grid{grid-template-columns:1fr}.page{padding:14px}.mc{min-height:240px;max-height:360px}}

/* ═══ V1 Chat Bubbles ═══ */
.v1{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.v1b{max-width:82%;padding:12px 18px;border-radius:18px;font-size:15px;line-height:1.55;position:relative;opacity:0;animation:v1in .6s ease-out forwards;box-shadow:0 1px 2px rgba(0,0,0,.1);display:flex;align-items:flex-start;gap:8px}
.v1b.l{align-self:flex-start;background:var(--line);border-bottom-left-radius:6px;color:var(--text)}
.v1b.r{align-self:flex-end;background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(59,130,246,.2));border-bottom-right-radius:6px;color:#fff}
.v1b .v1text{flex:1;min-width:0}
.v1b .v1acts{display:flex;gap:3px;flex-shrink:0;opacity:.55;transition:opacity .15s;padding-top:1px}
.v1b:hover .v1acts{opacity:1}
.v1acts button{width:20px;height:20px;border-radius:50%;border:none;background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center}
.v1b.l .v1acts button{color:var(--t3)}
@keyframes v1in{to{opacity:1}}

/* ═══ V6b Accordion Tabs — Target Translation top, Original (SNL) below ═══ */
.v6b{padding:0}
.v6b .v6btabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1;flex-wrap:wrap}
.v6b .v6btab{padding:8px 14px;font-size:11px;font-weight:600;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.v6b .v6btab.on{color:var(--accent);border-bottom-color:var(--accent)}
.v6b .v6brow{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;opacity:0;animation:v6in .45s ease-out forwards}
.v6b .v6bsrc{font-size:11px;color:var(--t3);margin-top:2px;line-height:1.5}
.v6b .v6bsnl{font-size:8px;color:var(--t3);padding:1px 5px;border-radius:4px;background:rgba(128,128,128,.1);margin-left:4px;vertical-align:middle}
@keyframes v6in{to{opacity:1}}

/* ═══ V6t Side-by-Side ═══ */
.v6t{padding:10px;display:flex;flex-direction:column;gap:6px}
.v6t .v6trow{display:flex;gap:8px;opacity:0;animation:v6tin .5s ease-out forwards}
.v6t .v6torig{flex:1;font-size:15px;line-height:1.5;padding:8px 12px;background:var(--bg);border-radius:8px}
.v6t .v6tarrow{color:var(--accent);font-size:16px;align-self:center}
.v6t .v6ttran{flex:1;font-size:14px;line-height:1.5;padding:8px 12px;background:rgba(124,58,237,.06);border-radius:8px;color:var(--t2);font-style:italic}
@keyframes v6tin{to{opacity:1}}
</style>
</head>
<body>

<div class="page">
  <h1>🎭 Duo Mockups · Chat + Translation</h1>
  <p class="subtitle">V1 Chat Bubbles · V6 Accordion · V6b Tabs · V6t Side-by-Side</p>
  <div class="grid" id="grid"></div>
</div>

<script>
var demoData=[];

var S=[
  'The <span class="word">weather</span> <span class="word">today</span> <span class="word">is</span> <span class="word">quite</span> <span class="word alt" title="Maybe: lovely">lovly</span>.',
  'Ik <span class="word">wil</span> <span class="word">graag</span> <span class="word">een</span> <span class="word">kopje</span> <span class="word">koffie</span> <span class="word">alsjeblieft</span>.',
  'The <span class="word">project</span> <span class="word">deadline</span> <span class="word">has</span> <span class="word">been</span> <span class="word">extended</span> <span class="word">to</span> <span class="word">Friday</span>.',
  'We <span class="word">moeten</span> <span class="word">nog</span> <span class="word">even</span> <span class="word">geduld</span> <span class="word alt" title="Maybe: hebben">hebben</span> <span class="word">met</span> <span class="word">de</span> <span class="word">resultaten</span>.',
  'She <span class="word">said</span> <span class="word">she</span> <span class="word">would</span> <span class="word">call</span> <span class="word">back</span> <span class="word">within</span> <span class="word">the</span> <span class="word">hour</span>.',
  'Het <span class="word">is</span> <span class="word">vandaag</span> <span class="word">echt</span> <span class="word">prachtig</span> <span class="word">weer</span> <span class="word">buiten</span>.',
  'Can <span class="word">you</span> <span class="word">send</span> <span class="word">me</span> <span class="word">the</span> <span class="word alt" title="Maybe: document">documment</span> <span class="word">by</span> <span class="word">email</span>?',
  'Ik <span class="word">denk</span> <span class="word">dat</span> <span class="word">we</span> <span class="word">morgen</span> <span class="word">een</span> <span class="word">beslissing</span> <span class="word">kunnen</span> <span class="word">nemen</span>.',
  'The <span class="word">meeting</span> <span class="word">room</span> <span class="word">is</span> <span class="word">on</span> <span class="word">the</span> <span class="word">third</span> <span class="word">floor</span>.',
  'Dat <span class="word">klinkt</span> <span class="word">als</span> <span class="word">een</span> <span class="word">uitstekend</span> <span class="word">plan</span> <span class="word">voor</span> <span class="word">vanavond</span>.',
  'I <span class="word">really</span> <span class="word">appreciate</span> <span class="word">your</span> <span class="word">help</span> <span class="word">with</span> <span class="word">this</span>.',
  'Zij <span class="word">heeft</span> <span class="word">gisteren</span> <span class="word">nog</span> <span class="word">gebeld</span> <span class="word">over</span> <span class="word">de</span> <span class="word">afspraak</span>.'
];

function define(id,title,badges,bodyHtml,sentences,renderFn){demoData.push({id:id,title:title,badges:badges,bodyHtml:bodyHtml,sentences:sentences,render:renderFn});}

// V1 Chat Bubbles — icons inline after text, top-aligned
define('V1','Chat Bubbles','ba be bs','<div class="v1" id="v1b"></div>',[0,1,2,3],function(body,s,i){var d=document.createElement('div');d.className='v1b '+(i%2?'r':'l');d.innerHTML='<span class="v1text">'+s+'</span><div class="v1acts"><button title="Bookmark" onclick="event.stopPropagation();this.textContent=this.textContent===\'☆\'?\'★\':\'☆\'">☆</button><button title="Delete" onclick="event.stopPropagation();this.closest(\'.v1b\').style.opacity=\'0.15\'">🗑</button></div>';body.appendChild(d);});

// V6b Accordion Tabs — Target Translation on top, Original (SNL) below
define('V6b','Accordion Tabs','be','<div class="v6b" id="v6bb"><div class="v6btabs"><span class="v6btab on">🇬🇧 EN</span><span class="v6btab">🇮🇹 IT</span><span class="v6btab">🇳🇱 NL</span><span class="v6btab">🇫🇷 FR</span><span class="v6btab">🇩🇪 DE</span><span class="v6btab">🇪🇸 ES</span></div></div>',[0,2,5,8],function(body,s,i){var orig=['The weather today is quite lovely.','The project deadline has been extended to Friday.','Het is vandaag echt prachtig weer buiten.','The meeting room is on the third floor.'];var tran=['Il tempo oggi è bello.','Il progetto è stato esteso.','Che bella giornata fuori oggi.','La sala riunioni è al terzo piano.'];var d=document.createElement('div');d.className='v6brow';d.innerHTML='<div style="flex:1;min-width:0"><div style="font-weight:600;color:var(--text)">'+tran[i]+'</div><div class="v6bsrc">'+orig[i]+'<span class="v6bsnl">SNL</span></div></div>';body.appendChild(d);});

// V6t Side-by-Side
define('V6t','Side-by-Side Translation','be','<div class="v6t" id="v6tb"></div>',[1,4,7,10],function(body,s,i){var t=['Ik wil graag een kopje koffie.','Ha detto che richiamerà entro un\'ora.','Ik denk dat we morgen kunnen beslissen.','Dat klinkt als een uitstekend plan.'];var d=document.createElement('div');d.className='v6trow';d.innerHTML='<div class="v6torig">'+s+'</div><div class="v6tarrow">→</div><div class="v6ttran">'+t[i%4]+'</div>';body.appendChild(d);});

// ═══ BUILD GRID ═══
var grid=document.getElementById('grid'),cardMap={};
demoData.forEach(function(v){
  var card=document.createElement('div');card.className='m';card.dataset.varId=v.id;
  var badgesHtml=v.badges.split(' ').map(function(b){var cls=b==='ba'?'ba':b==='be'?'be':b==='bs'?'bs':'bt';var label=b==='ba'?'anim':b==='be'?'edit':b==='bs'?'select':'space';return '<span class="mb '+cls+'">'+label+'</span>';}).join('');
  card.innerHTML='<div class="mh"><span class="mn">'+v.id+'</span><span class="mt">'+v.title+'</span>'+badgesHtml+'<button class="play-btn" data-var="'+v.id+'" onclick="toggleDemo(\''+v.id+'\')" title="Play demo">▶</button></div><div class="mc">'+v.bodyHtml+'</div>';
  grid.appendChild(card);cardMap[v.id]=card;
});

// ═══ PLAYER ═══
var playerStates={};
function getPlayerState(id){if(!playerStates[id]){var card=cardMap[id];var body=card.querySelector('.mc > *');var def=demoData.find(function(d){return d.id===id});playerStates[id]={body:body,def:def,playing:false,idx:0,timer:null,phase:'idle'};}return playerStates[id];}
function stopDemo(id){var ps=getPlayerState(id);if(ps.timer){clearTimeout(ps.timer);ps.timer=null;}ps.playing=false;ps.phase='idle';ps.body.innerHTML=ps.def.bodyHtml.replace(/ id="[^"]*"/,'');var btn=cardMap[id].querySelector('.play-btn');if(btn){btn.textContent='▶';btn.classList.remove('playing');btn.title='Play demo';}}
function toggleDemo(id){var ps=getPlayerState(id);if(ps.playing){stopDemo(id);return;}ps.playing=true;ps.idx=0;ps.phase='adding';var btn=cardMap[id].querySelector('.play-btn');if(btn){btn.textContent='⏹';btn.classList.add('playing');btn.title='Stop demo';}ps.body.innerHTML=ps.def.bodyHtml.replace(/ id="[^"]*"/,'');advanceDemo(id);}
function advanceDemo(id){var ps=getPlayerState(id);if(!ps.playing)return;var def=ps.def;if(ps.phase==='adding'){if(ps.idx<def.sentences.length){var si=def.sentences[ps.idx];var s=S[si];def.render(ps.body,s,ps.idx,def.sentences.length);ps.idx++;var gap=2200+Math.random()*1200;ps.timer=setTimeout(function(){advanceDemo(id)},gap);return;}else{ps.phase='done';ps.timer=setTimeout(function(){advanceDemo(id)},5000);return;}}if(ps.phase==='done'){stopDemo(id);}}
</script>
</body>
</html>
