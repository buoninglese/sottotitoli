<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SELF-PLAN · multi-agent orchestration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fafafa;--card:#fff;--text:#1a1a2e;--dim:#6b7280;--line:#e5e7eb;--accent:#7c3aed;--accent-bg:rgba(124,58,237,.08);--green:#059669;--amber:#d97706;--red:#dc2626;--radius:12px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.container{width:100%;max-width:800px}
.header{text-align:center;margin-bottom:32px}
.header h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.header .sub{font-size:15px;color:var(--dim);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:12px}
textarea{width:100%;min-height:100px;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.6;resize:vertical;background:var(--bg);color:var(--text);transition:border-color .15s}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-outline:disabled{opacity:.4;cursor:not-allowed}
.btn-pdf{background:#ef4444;color:#fff}
.btn-pdf:hover{filter:brightness(1.1);transform:translateY(-1px)}
.code-block{background:#1e1e2e;color:#cdd6f4;border-radius:10px;padding:20px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;max-height:400px;overflow-y:auto}
.code-block .kw{color:#cba6f7}
.code-block .fn{color:#89b4fa}
.code-block .str{color:#a6e3a1}
.code-block .num{color:#fab387}
.code-block .cm{color:#6c7086;font-style:italic}
.code-block .dec{color:#f9e2af}
.log-feed{background:#1e1e2e;color:#cdd6f4;border-radius:10px;padding:16px 20px;max-height:300px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8;margin-top:8px}
.log-line{padding:2px 0}
.log-line .ts{color:#6c7086}
.log-line .agent-name{color:#89b4fa;font-weight:500}
.log-line .count{color:#f9e2af}
.log-line .check{color:#a6e3a1}
.log-line.done{color:#a6e3a1}
.log-line.error{color:#f38ba8}
.result-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-top:16px}
.result-box h2{font-size:20px;font-weight:700;margin:24px 0 12px}
.result-box h3{font-size:16px;font-weight:700;margin:20px 0 10px}
.result-box h2:first-child{margin-top:0}
.result-box p{line-height:1.8;color:var(--text);margin-bottom:12px}
.result-box ul,.result-box ol{padding-left:24px;margin-bottom:12px}
.result-box li{line-height:1.8;margin-bottom:4px}
.result-box code{background:var(--accent-bg);padding:2px 6px;border-radius:4px;font-size:.9em;font-family:'JetBrains Mono',monospace}
.result-box pre{background:#1e1e2e;color:#cdd6f4;padding:16px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.6;margin:12px 0}
.result-box table{width:100%;border-collapse:collapse;margin:12px 0}
.result-box th,.result-box td{border:1px solid var(--line);padding:10px 14px;text-align:left;font-size:14px}
.result-box th{background:var(--bg);font-weight:700}
.result-box blockquote{border-left:3px solid var(--accent);padding-left:16px;color:var(--dim);margin:12px 0;font-style:italic}
.hidden{display:none!important}
.divider{height:1px;background:var(--line);margin:24px 0}
.spinner{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status-msg{text-align:center;padding:8px;font-size:13px;color:var(--dim);font-weight:500}

/* Print / PDF styles */
@media print {
  body{background:#fff;padding:0}
  .container{max-width:100%}
  .no-print{display:none!important}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .btn-row{display:none}
  textarea{border:1px solid #ddd}
  .code-block{background:#f5f5f5!important;color:#222!important;border:1px solid #ddd}
  .code-block .kw{color:#7c3aed}
  .code-block .fn{color:#2563eb}
  .code-block .str{color:#059669}
  .code-block .num{color:#d97706}
  .code-block .cm{color:#9ca3af}
  .code-block .dec{color:#d97706}
  .log-feed{background:#f9f9f9!important;color:#222!important;border:1px solid #ddd}
  .log-line .ts{color:#9ca3af}
  .log-line .agent-name{color:#2563eb}
  .log-line .count{color:#d97706}
  .log-line .check{color:#059669}
  .log-line.done{color:#059669}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>SELF-PLAN</h1>
    <p class="sub">multi-agent orchestration — plans that write themselves</p>
  </div>

  <!-- Task input -->
  <div class="card no-print" id="s-task">
    <div class="card-title">🎯 What do you want to accomplish?</div>
    <textarea id="task" placeholder="Describe your goal, research question, or project…&#10;&#10;Example: Write a 7-day learning plan for intermediate Python, or Research the environmental impact of AI training and draft a summary report."></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="run" onclick="generate()">⚡ RUN</button>
      <button class="btn btn-outline" id="btn-demo" onclick="loadDemo()">📋 Load demo</button>
    </div>
  </div>

  <!-- Plan code -->
  <div class="card hidden" id="s-plan">
    <div class="card-title">📐 Generated Plan</div>
    <div class="code-block" id="plan-code"></div>
    <div class="btn-row no-print">
      <button class="btn btn-primary" id="btn-execute" onclick="execute()">▶ EXECUTE</button>
      <button class="btn btn-outline" onclick="reset()">✕ CANCEL</button>
    </div>
  </div>

  <!-- Execution log -->
  <div class="card hidden" id="s-log">
    <div class="card-title">📋 Execution Log</div>
    <div class="log-feed" id="log-feed"></div>
  </div>

  <!-- Result -->
  <div class="hidden" id="s-divider"><div class="divider"></div></div>
  <div class="result-box hidden" id="s-result">
    <div class="btn-row no-print" style="margin-bottom:16px">
      <button class="btn btn-pdf" onclick="downloadPDF()">📄 Download PDF</button>
    </div>
    <div id="result-text"></div>
  </div>
</div>

<script>
const $ = s => document.getElementById(s);
const show = s => $(s).classList.remove("hidden");
const hide = s => $(s).classList.add("hidden");

let currentCode = "";

function reset() {
  hide("s-plan"); hide("s-log"); hide("s-divider"); hide("s-result");
  $("run").disabled = false; $("task").disabled = false;
  currentCode = "";
}

async function generate() {
  const taskText = $("task").value.trim();
  if (!taskText) return;
  $("run").disabled = true; $("task").disabled = true;
  $("log-feed").innerHTML = "";
  $("result-text").innerHTML = "";
  hide("s-plan"); hide("s-log"); hide("s-divider"); hide("s-result");

  // Simulate plan generation
  show("s-log");
  addLog('<span class="spinner">◑</span> generating plan...');
  await sleep(800);

  currentCode = generateFakePlan(taskText);
  $("log-feed").innerHTML = "";
  addLog("✓ plan generated · " + countLines(currentCode) + " lines");
  $("plan-code").innerHTML = hlPython(currentCode);
  show("s-plan"); hide("s-log");
}

function execute() {
  $("btn-execute").disabled = true;
  hide("s-divider"); hide("s-result");
  $("log-feed").innerHTML = "";
  show("s-log");

  const agents = ["researcher","analyst","writer","reviewer","compiler"];
  let step = 0;
  let totalSteps = 5 + Math.floor(Math.random() * 4);

  function nextStep() {
    if (step >= totalSteps) {
      addLog("✓ done · execution complete", "done");
      showResults();
      $("run").disabled = false; $("task").disabled = false;
      $("btn-execute").disabled = false;
      hide("s-log");
      return;
    }
    const agent = agents[step % agents.length];
    const actions = [
      "gathering sources…", "analyzing data…", "drafting section…",
      "cross-referencing…", "compiling findings…", "validating claims…",
      "synthesizing insights…", "formatting output…"
    ];
    const action = actions[step % actions.length];
    const duration = (0.3 + Math.random() * 0.8).toFixed(1);
    addLog(`▶ [${1}x] <span class="agent-name">${agent}</span> ${action} <span class="ts">[${duration}s]</span>`);
    step++;
    setTimeout(nextStep, 400 + Math.random() * 600);
  }
  nextStep();
}

function showResults() {
  show("s-divider");
  show("s-result");
  const task = $("task").value.trim();
  $("result-text").innerHTML = generateReport(task);
}

function addLog(msg, cls = "") {
  const div = document.createElement("div");
  div.className = "log-line" + (cls ? " " + cls : "");
  div.innerHTML = msg;
  $("log-feed").appendChild(div);
  div.scrollIntoView({behavior:"smooth",block:"end"});
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function countLines(code) { return code.split("\n").filter(l => l.trim()).length; }

function hlPython(code) {
  const KW = new Set(["def","class","return","if","elif","else","for","while","in","import","from","as","not","and","or","is","with","try","except","finally","raise","yield","break","continue","pass","True","False","None","lambda","global","async","await"]);
  let tokens = [], i = 0;
  while (i < code.length) {
    if (code[i] === "#") { let j = code.indexOf("\n", i); if (j === -1) j = code.length; tokens.push({t:"cm",v:code.slice(i,j)}); i = j; continue; }
    if (code.slice(i,i+3)==='"""'||code.slice(i,i+3)==="'''") { const q=code.slice(i,i+3); let j=code.indexOf(q,i+3); j=j===-1?code.length:j+3; tokens.push({t:"str",v:code.slice(i,j)}); i=j; continue; }
    if (code[i]==='"'||code[i]==="'"||(code[i]==='f'&&i+1<code.length&&(code[i+1]==='"'||code[i+1]==="'"))) { let s=i; if(code[i]==='f')i++; const q=code[i];i++; while(i<code.length&&code[i]!==q){if(code[i]==="\\")i++;i++;} i++; tokens.push({t:"str",v:code.slice(s,i)}); continue; }
    if (/\d/.test(code[i])&&(i===0||!/\w/.test(code[i-1]))){let j=i;while(j<code.length&&/[\d.]/.test(code[j]))j++;tokens.push({t:"num",v:code.slice(i,j)});i=j;continue;}
    if (/[a-zA-Z_]/.test(code[i])){let j=i;while(j<code.length&&/\w/.test(code[j]))j++;const w=code.slice(i,j);let k=j;while(k<code.length&&code[k]===" ")k++;if(KW.has(w))tokens.push({t:"kw",v:w});else if(code[k]==="(")tokens.push({t:"fn",v:w});else tokens.push({t:"",v:w});i=j;continue;}
    if (code[i]==="@"&&(i===0||code[i-1]==="\n")){let j=i+1;while(j<code.length&&/\w/.test(code[j]))j++;tokens.push({t:"dec",v:code.slice(i,j)});i=j;continue;}
    tokens.push({t:"",v:code[i]});i++;
  }
  return tokens.map(t=>{const e=t.v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");return t.t?`<span class="${t.t}">${e}</span>`:e}).join("");
}

function generateFakePlan(task) {
  const topic = task.length > 40 ? task.slice(0, 40) + "..." : task;
  return `# Auto-generated plan for: ${topic}
# Generated by SELF-PLAN orchestrator

from self_plan.agents import Researcher, Analyst, Writer, Reviewer

def execute_plan():
    """Multi-agent execution plan"""
    
    # Phase 1: Research & Information Gathering
    researcher = Researcher(
        sources=["web", "academic", "news"],
        max_depth=3,
        credibility_threshold=0.8
    )
    findings = researcher.investigate(
        query="${topic.replace(/"/g,'\\"')}",
        include_recent=True,
        language="en"
    )
    
    # Phase 2: Analysis & Synthesis
    analyst = Analyst(model="expert")
    insights = analyst.process(
        data=findings,
        extract_key_themes=True,
        identify_gaps=True,
        confidence_level="high"
    )
    
    # Phase 3: Draft & Structure
    writer = Writer(style="comprehensive", tone="professional")
    draft = writer.compose(
        outline=insights.structure,
        sections=insights.recommended_sections,
        citations="apa"
    )
    
    # Phase 4: Review & Refine
    reviewer = Reviewer(criteria=["accuracy", "clarity", "completeness"])
    final = reviewer.evaluate(
        draft=draft,
        fact_check=True,
        suggest_improvements=True
    )
    
    return final.report`;
}

function generateReport(task) {
  return `<h2>📊 Research Report</h2>
<p><strong>Task:</strong> ${task.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</p>
<p><strong>Generated:</strong> ${new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'})} · <strong>Agents:</strong> 5 · <strong>Sources:</strong> 23</p>

<h2>Executive Summary</h2>
<p>This report presents a comprehensive analysis of the requested topic, synthesized through a multi-agent orchestration pipeline. Five specialized agents collaborated across research, analysis, writing, and review phases to produce this document. Key findings are organized into thematic sections below, each supported by verified sources and cross-referenced for accuracy.</p>

<h2>1. Background & Context</h2>
<p>The investigation began with a broad scoping phase, mapping the landscape of existing knowledge and identifying key stakeholders, historical developments, and current trends. Our research agent surveyed 23 sources including academic papers, industry reports, and expert commentary.</p>
<p>Three major themes emerged during the initial scoping: <strong>technological advancement</strong>, <strong>societal impact</strong>, and <strong>future trajectory</strong>. Each is explored in depth in the sections that follow.</p>

<h2>2. Key Findings</h2>

<h3>2.1 Primary Insights</h3>
<ul>
  <li><strong>Finding A:</strong> The data indicates a significant shift in established patterns, with measurable effects across multiple domains. Cross-referencing with secondary sources confirms the robustness of this observation.</li>
  <li><strong>Finding B:</strong> Analysis reveals an emerging consensus among experts regarding best practices and recommended approaches. The convergence of opinion across diverse stakeholder groups strengthens the reliability of these conclusions.</li>
  <li><strong>Finding C:</strong> Quantitative metrics show a 34% improvement in key performance indicators when recommended strategies are implemented, based on controlled studies conducted in 2024–2025.</li>
</ul>

<h3>2.2 Statistical Overview</h3>
<table>
  <tr><th>Metric</th><th>Before</th><th>After</th><th>Change</th></tr>
  <tr><td>Efficiency</td><td>62%</td><td>89%</td><td>+27%</td></tr>
  <tr><td>Accuracy</td><td>78%</td><td>94%</td><td>+16%</td></tr>
  <tr><td>Coverage</td><td>3 domains</td><td>7 domains</td><td>+133%</td></tr>
  <tr><td>User Satisfaction</td><td>3.8/5</td><td>4.6/5</td><td>+21%</td></tr>
</table>

<h2>3. Analysis & Discussion</h2>
<p>The findings suggest a coherent narrative: organizations that adopt a structured, multi-perspective approach achieve superior outcomes compared to those relying on single-source analysis. The reviewer agent identified this pattern across all examined cases, with a confidence level of 92%.</p>

<blockquote>"The integration of diverse analytical perspectives is not merely additive — it is transformative. When multiple specialized agents collaborate, the resulting synthesis exceeds what any single approach could achieve."</blockquote>

<h2>4. Recommendations</h2>
<ol>
  <li><strong>Adopt multi-agent orchestration</strong> for complex research tasks to ensure comprehensive coverage and reduce blind spots.</li>
  <li><strong>Implement iterative review cycles</strong> — our data shows that three rounds of agent review reduce error rates by 68%.</li>
  <li><strong>Maintain human oversight</strong> at key decision points; the most effective workflows pair autonomous agents with human judgment at critical gates.</li>
  <li><strong>Invest in source diversity</strong> — plans drawing from 10+ sources produced 2.4× more novel insights than those limited to 3 or fewer.</li>
</ol>

<h2>5. Conclusion</h2>
<p>This multi-agent research process has produced a thorough, well-validated analysis of the requested topic. The collaborative approach — spanning research, analysis, writing, and review — ensures that the conclusions presented here are both comprehensive and reliable. We recommend using this report as a foundation for decision-making, supplemented with domain-specific expertise as needed.</p>

<hr>
<p style="font-size:12px;color:#6b7280;text-align:center;margin-top:24px">Generated by SELF-PLAN · multi-agent orchestration system · ${new Date().toISOString().split('T')[0]}</p>`;
}

function loadDemo() {
  $("task").value = "Research the environmental impact of AI model training and inference. Compare energy usage across major cloud providers, analyze carbon offset programs, and provide actionable recommendations for sustainable AI deployment.";
}

function downloadPDF() {
  // Add a temporary title for the PDF
  const titleEl = document.createElement("h1");
  titleEl.textContent = "SELF-PLAN · Research Report";
  titleEl.style.cssText = "font-size:24px;margin-bottom:8px;font-family:Inter,sans-serif";
  const subtitleEl = document.createElement("p");
  subtitleEl.textContent = "Multi-agent orchestration — plans that write themselves";
  subtitleEl.style.cssText = "font-size:14px;color:#6b7280;margin-bottom:24px;font-family:Inter,sans-serif";
  const result = $("result-text");
  result.insertBefore(subtitleEl, result.firstChild);
  result.insertBefore(titleEl, result.firstChild);

  window.print();

  // Clean up temporary elements
  titleEl.remove();
  subtitleEl.remove();
}

// Keyboard shortcut
$("task").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) generate();
});
</script>
</body>
</html>
