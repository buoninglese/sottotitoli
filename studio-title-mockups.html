<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Studio · Final Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent-green:#34d399;--accent-blue:#60a5fa}
html,body{height:100%;overflow:hidden;background:#0a0c11}
body{font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center}

/* ── The App Shell — fills screen like a real PWA ── */
.app{width:100vw;height:100vh;max-width:430px;max-height:900px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:background .5s}
.app::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.012) 1px,transparent 1px);background-size:clamp(14px,2.5vw,18px) clamp(14px,2.5vw,18px);pointer-events:none;mask-image:radial-gradient(ellipse at 50% 50%,#000 30%,transparent 70%);z-index:0}
.app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;transition:background .5s}
.app>*{position:relative;z-index:1}
.app.mode-caption{background:#06120e}
.app.mode-caption::after{background:radial-gradient(ellipse at 50% 30%,rgba(52,211,153,.09) 0%,transparent 55%)}
.app.mode-translate{background:#060d18}
.app.mode-translate::after{background:radial-gradient(ellipse at 50% 30%,rgba(96,165,250,.09) 0%,transparent 55%)}

/* ── Shared Glass Card ── */
.glass{background:rgba(255,255,255,.025);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.05);border-radius:clamp(14px,3vw,20px)}

/* ── Title Block ── */
.title-block{display:flex;align-items:center;gap:clamp(8px,2vw,12px);padding:clamp(14px,3vw,20px) clamp(12px,3vw,18px);margin:clamp(10px,2vw,14px) clamp(10px,2.5vw,14px) 0;position:relative;z-index:10}
.title-icon{font-size:clamp(36px,8vw,50px);line-height:1;flex-shrink:0;animation:floatUp 3s ease-in-out infinite}
.title-text{flex-shrink:1;min-width:0}
.title-row{display:flex;align-items:center}
.title-main{font-size:clamp(22px,7vw,44px);font-weight:900;color:#f1f5f9;letter-spacing:-0.04em;line-height:1.05;white-space:nowrap}

/* ── Hamburger ── */
.hamburger{display:flex;align-items:center;justify-content:center;width:clamp(32px,7vw,40px);height:clamp(32px,7vw,40px);border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:clamp(16px,4vw,20px);cursor:pointer;transition:all .2s;flex-shrink:0;position:relative;z-index:50;font-family:Inter,system-ui,sans-serif;line-height:1;margin-left:auto}
.hamburger:hover{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.15)}

/* ── Menu Dropdown ── */
.menu-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:rgba(0,0,0,.94);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:6px;min-width:clamp(170px,40vw,200px);opacity:0;pointer-events:none;transform:translateY(-6px);transition:all .2s;z-index:60}
.menu-dropdown.open{opacity:1;pointer-events:auto;transform:translateY(0)}
.menu-item{display:flex;align-items:center;gap:10px;padding:clamp(10px,2.5vw,13px) clamp(12px,3vw,16px);border-radius:10px;color:rgba(255,255,255,.7);font-size:clamp(12px,3vw,14px);font-weight:500;cursor:pointer;transition:all .15s;text-decoration:none;font-family:inherit;border:none;background:none;width:100%;text-align:left}
.menu-item:hover{background:rgba(255,255,255,.06);color:#fff}
.menu-item .mi-icon{font-size:clamp(14px,3.5vw,17px);width:clamp(20px,5vw,24px);text-align:center;flex-shrink:0}
.menu-divider{height:1px;background:rgba(255,255,255,.06);margin:4px 8px;border-radius:1px}

/* ── Info Icon ── */
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:clamp(18px,4vw,22px);height:clamp(18px,4vw,22px);border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.4);font-size:clamp(10px,2.2vw,12px);cursor:pointer;transition:all .2s;flex-shrink:0;font-weight:700;line-height:1;position:relative}
.info-icon:hover{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.2)}
.info-tip{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.95);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 16px;font-size:clamp(10px,2vw,11px);color:#e8eaed;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;font-weight:400;letter-spacing:0;z-index:40;line-height:1.5;text-align:center}
.info-tip::before{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:rgba(255,255,255,.12)}
.info-icon.show-tip .info-tip{opacity:1}

/* ── Middle Block ── */
.middle-block{flex:1;display:flex;align-items:center;justify-content:center;padding:0 clamp(12px,3vw,16px);flex-direction:column;gap:clamp(10px,2.5vw,14px)}
.option-card{width:100%;max-width:100%;display:flex;flex-direction:column;gap:clamp(14px,3vw,18px);padding:clamp(20px,5vw,28px) clamp(16px,4vw,22px) clamp(16px,4vw,22px);min-height:clamp(200px,38vh,260px);justify-content:center}

/* ── Flag Chips ── */
.flag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(7px,1.8vw,10px)}
.flag-chip{display:inline-flex;align-items:center;justify-content:center;border-radius:clamp(12px,2.5vw,16px);font-weight:500;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);cursor:pointer;transition:all .25s;font-family:inherit;padding:clamp(14px,3.5vw,20px) clamp(6px,1.5vw,10px);font-size:clamp(28px,7vw,42px)}
.flag-chip:hover{transform:translateY(-2px);background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.25)}
.flag-chip.active{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4);box-shadow:0 0 0 3px rgba(52,211,153,.12)}

/* ── Pair Selector ── */
.pair-selector{display:flex;align-items:center;gap:clamp(12px,3vw,18px);justify-content:center}
.pair-block{text-align:center;cursor:pointer;transition:all .25s;border-radius:clamp(14px,2.5vw,18px);border:1px solid transparent;background:rgba(255,255,255,.02);padding:clamp(14px,3vw,18px) clamp(12px,3vw,18px)}
.pair-block:hover{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.05);transform:translateY(-2px)}
.pair-block .big-flag{line-height:1;transition:transform .25s;display:block;font-size:clamp(40px,10vw,60px)}
.pair-block:hover .big-flag{transform:scale(1.1)}
.pair-block .pair-name{font-weight:700;color:#f1f5f9;margin-top:clamp(2px,.5vh,4px);font-size:clamp(13px,3vw,17px)}
.pair-block .pair-label{font-size:clamp(8px,1.8vw,10px);text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.2);margin-top:clamp(1px,.3vh,2px)}
.pair-arrow{font-size:clamp(20px,5vw,28px);color:var(--accent-blue);font-weight:700;animation:pairPulse 1.5s ease-in-out infinite}

/* ── Avvia Button ── */
.btn-avvia{display:inline-flex;align-items:center;gap:8px;padding:clamp(12px,2.5vw,15px) 0;border-radius:100px;font-size:clamp(12px,2.5vw,14px);font-weight:700;cursor:pointer;transition:all .3s;font-family:inherit;border:none;width:100%;justify-content:center}
.btn-avvia-cap{background:linear-gradient(135deg,var(--accent-green),#34d399);color:#000;box-shadow:0 clamp(2px,.5vw,4px) clamp(14px,3vw,20px) rgba(52,211,153,.25)}
.btn-avvia-cap:hover{transform:translateY(-2px);box-shadow:0 clamp(5px,1vw,8px) clamp(20px,5vw,32px) rgba(52,211,153,.4)}
.btn-avvia-tr{background:linear-gradient(135deg,var(--accent-blue),#60a5fa);color:#fff;box-shadow:0 clamp(2px,.5vw,4px) clamp(14px,3vw,20px) rgba(96,165,250,.25)}
.btn-avvia-tr:hover{transform:translateY(-2px);box-shadow:0 clamp(5px,1vw,8px) clamp(20px,5vw,32px) rgba(96,165,250,.4)}

/* ── V10 Premium Toggle ── */
.toggle-wrap{padding:0 clamp(12px,3vw,16px) clamp(10px,2vw,12px)}
.toggle-bar{display:flex;align-items:center;gap:clamp(2px,.5vw,4px);background:rgba(255,255,255,.06);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:clamp(4px,1vw,6px);box-shadow:0 clamp(2px,.5vw,4px) clamp(14px,4vw,24px) rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05)}
.toggle-btn{flex:1;padding:clamp(12px,2.8vw,15px) clamp(16px,4vw,24px);border:none;border-radius:100px;font-family:inherit;font-size:clamp(13px,2.8vw,15px);font-weight:800;letter-spacing:.01em;cursor:pointer;color:rgba(255,255,255,.45);background:transparent;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:clamp(5px,1.2vw,8px)}
.toggle-btn .ico{font-size:clamp(17px,4vw,21px)}
.toggle-btn.cap-active{background:var(--accent-green);color:#000;box-shadow:0 clamp(2px,.5vw,4px) clamp(10px,3vw,18px) rgba(52,211,153,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.toggle-btn.tr-active{background:var(--accent-blue);color:#fff;box-shadow:0 clamp(2px,.5vw,4px) clamp(10px,3vw,18px) rgba(96,165,250,.35),inset 0 1px 0 rgba(255,255,255,.15)}
.toggle-btn:not(.cap-active):not(.tr-active):hover{color:#fff;background:rgba(255,255,255,.06)}
.toggle-divider{width:1px;height:clamp(18px,4vw,24px);background:rgba(255,255,255,.12);border-radius:1px;flex-shrink:0}

/* ── Spinner Overlay ── */
.spinner-overlay{position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.94);backdrop-filter:blur(16px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.spinner-overlay.show{display:flex}
.spinner-title{font-size:clamp(14px,3vw,17px);font-weight:700;color:#f1f5f9;margin-bottom:clamp(14px,3vw,20px)}
.spinner-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,1.8vw,10px);width:100%;max-width:clamp(250px,60vw,300px);margin-bottom:clamp(14px,3vw,20px)}
.spinner-chip{padding:clamp(12px,3vw,16px);border-radius:14px;font-size:clamp(13px,2.8vw,15px);font-weight:600;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:#cbd5e1;cursor:pointer;transition:all .2s;font-family:inherit;text-align:center}
.spinner-chip:hover{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.3);color:#fff;transform:translateY(-1px)}
.spinner-chip.selected{background:rgba(96,165,250,.22);border-color:var(--accent-blue);color:var(--accent-blue);box-shadow:0 0 0 3px rgba(96,165,250,.18)}
.spinner-confirm{padding:clamp(12px,3vw,16px) clamp(40px,10vw,56px);border-radius:100px;font-size:clamp(13px,2.8vw,15px);font-weight:700;background:linear-gradient(135deg,var(--accent-blue),#60a5fa);color:#fff;cursor:pointer;font-family:inherit;border:none;box-shadow:0 4px 24px rgba(96,165,250,.4);transition:all .3s}
.spinner-confirm:hover{transform:translateY(-2px);box-shadow:0 8px 34px rgba(96,165,250,.55)}

/* ── Anims ── */
@keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pairPulse{0%,100%{opacity:.5;transform:translateX(0)}50%{opacity:1;transform:translateX(5px)}}
</style>
</head>
<body>

<div class="app mode-caption" id="app">
  <!-- Title Block -->
  <div class="glass title-block">
    <div class="title-icon mode-icon">🎙️</div>
    <div class="title-text">
      <div class="title-row">
        <div class="title-main mode-title">Sottotitoli</div>
      </div>
    </div>
    <div class="info-icon" id="infoIcon">ℹ
      <div class="info-tip" data-tip-cap="Scegli una lingua qui sotto,<br>poi premi <b>Avvia</b> per iniziare" data-tip-tr="Tocca la lingua che parli<br>e quella per i sottotitoli">Scegli una lingua qui sotto,<br>poi premi <b>Avvia</b> per iniziare</div>
    </div>
    <!-- Hamburger -->
    <div class="hamburger" id="hamburger">☰
      <div class="menu-dropdown" id="menuDropdown">
        <a class="menu-item" href="account.html"><span class="mi-icon">👤</span> Il tuo viaggio</a>
        <a class="menu-item" href="analysis.html"><span class="mi-icon">📊</span> Analisi sessioni</a>
        <a class="menu-item" href="wallet.html"><span class="mi-icon">💳</span> Portafoglio crediti</a>
        <div class="menu-divider"></div>
        <a class="menu-item" href="goals.html"><span class="mi-icon">🎯</span> Impostazioni</a>
        <button class="menu-item" onclick="alert('Logout — usciresti dallo Studio')"><span class="mi-icon">🚪</span> Esci</button>
      </div>
    </div>
  </div>

  <!-- Caption Panel -->
  <div class="middle-block panel-caption">
    <div class="glass option-card">
      <div class="flag-grid" id="flagGrid"></div>
    </div>
    <button class="btn-avvia btn-avvia-cap cta-cap" id="ctaCap">Avvia Caption →</button>
    <button class="btn-avvia btn-avvia-tr cta-tr" id="ctaTr" style="display:none">Avvia Traduzione →</button>
  </div>

  <!-- Translate Panel -->
  <div class="middle-block panel-translate" style="display:none">
    <div class="glass option-card">
      <div class="pair-selector">
        <div class="pair-block" id="srcBlock"><div class="big-flag" id="srcFlag">🇬🇧</div><div class="pair-name" id="srcName">Inglese</div><div class="pair-label">Io parlo</div></div>
        <div class="pair-arrow">→</div>
        <div class="pair-block" id="tgtBlock"><div class="big-flag" id="tgtFlag">🇮🇹</div><div class="pair-name" id="tgtName">Italiano</div><div class="pair-label">Sottotitoli</div></div>
      </div>
    </div>
    <button class="btn-avvia btn-avvia-tr cta-tr">Avvia Traduzione →</button>
  </div>

  <!-- Spinner Overlay — full screen, covers everything -->
  <div class="spinner-overlay" id="spinner">
    <div class="spinner-title" id="spinnerTitle">Io parlo in…</div>
    <div class="spinner-grid" id="spinnerGrid"></div>
    <button class="spinner-confirm" id="spinnerClose">Conferma selezione ✓</button>
  </div>

  <!-- Toggle -->
  <div class="toggle-wrap">
    <div class="toggle-bar">
      <button class="toggle-btn cap-active" data-mode="caption" id="btnCap"><span class="ico">🎙️</span> Caption</button>
      <div class="toggle-divider"></div>
      <button class="toggle-btn" data-mode="translate" id="btnTr"><span class="ico">🌐</span> Translate</button>
    </div>
  </div>
</div>

<script>
(function(){
  var languages = [
    {code:'en',flag:'🇬🇧',name:'Inglese'},{code:'it',flag:'🇮🇹',name:'Italiano'},
    {code:'fr',flag:'🇫🇷',name:'Francese'},{code:'de',flag:'🇩🇪',name:'Tedesco'},
    {code:'es',flag:'🇪🇸',name:'Spagnolo'},{code:'nl',flag:'🇳🇱',name:'Olandese'},
    {code:'pt',flag:'🇵🇹',name:'Portoghese'},{code:'pl',flag:'🇵🇱',name:'Polacco'}
  ];
  function findLang(c){return languages.find(function(l){return l.code===c})}

  var app=document.getElementById('app');
  var flagGrid=document.getElementById('flagGrid');
  var panelCap=app.querySelector('.panel-caption'), panelTr=app.querySelector('.panel-translate');
  var ctaCap=document.getElementById('ctaCap'), ctaTrAll=app.querySelectorAll('.cta-tr');
  var icons=app.querySelectorAll('.mode-icon'), titles=app.querySelectorAll('.mode-title');
  var btnCap=document.getElementById('btnCap'), btnTr=document.getElementById('btnTr');
  var srcF=document.getElementById('srcFlag'), srcN=document.getElementById('srcName');
  var tgtF=document.getElementById('tgtFlag'), tgtN=document.getElementById('tgtName');
  var srcBlock=document.getElementById('srcBlock'), tgtBlock=document.getElementById('tgtBlock');
  var spinner=document.getElementById('spinner'), spinnerT=document.getElementById('spinnerTitle');
  var spinnerG=document.getElementById('spinnerGrid'), spinnerC=document.getElementById('spinnerClose');
  var selSrc='en', selTgt='it', selCap='en';

  // Build flag grid
  function buildFlags(){
    flagGrid.innerHTML='';
    languages.forEach(function(l){
      var chip=document.createElement('span');
      chip.className='flag-chip'+(l.code===selCap?' active':'');
      chip.setAttribute('data-lang',l.code); chip.textContent=l.flag;
      chip.addEventListener('click',function(){
        flagGrid.querySelectorAll('.flag-chip').forEach(function(c){c.classList.remove('active')});
        chip.classList.add('active'); selCap=chip.getAttribute('data-lang');
      });
      flagGrid.appendChild(chip);
    });
  }

  function updPair(){
    var s=findLang(selSrc), t=findLang(selTgt);
    srcF.textContent=s.flag; srcN.textContent=s.name;
    tgtF.textContent=t.flag; tgtN.textContent=t.name;
  }

  function openSpin(side){
    spinnerT.textContent=side==='source'?'Io parlo in…':'Sottotitoli in…';
    spinnerG.innerHTML='';
    var cur=side==='source'?selSrc:selTgt;
    languages.forEach(function(l){
      var c=document.createElement('button');
      c.className='spinner-chip'+(l.code===cur?' selected':'');
      c.textContent=l.flag+' '+l.name;
      c.addEventListener('click',function(){
        if(side==='source') selSrc=l.code; else selTgt=l.code;
        updPair();
        spinnerG.querySelectorAll('.spinner-chip').forEach(function(x){x.classList.remove('selected')});
        c.classList.add('selected');
      });
      spinnerG.appendChild(c);
    });
    spinner.classList.add('show');
  }

  spinnerC.addEventListener('click',function(){spinner.classList.remove('show')});
  srcBlock.addEventListener('click',function(){openSpin('source')});
  tgtBlock.addEventListener('click',function(){openSpin('target')});

  // ── Info Icon ──
  var infoIcon=document.getElementById('infoIcon');
  var infoTip=infoIcon.querySelector('.info-tip');
  infoIcon.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();infoIcon.classList.toggle('show-tip')});
  app.addEventListener('click',function(e){if(!infoIcon.contains(e.target))infoIcon.classList.remove('show-tip')});
  document.addEventListener('click',function(e){if(!app.contains(e.target))infoIcon.classList.remove('show-tip')});

  // ── Hamburger Menu ──
  var hamburger=document.getElementById('hamburger');
  var menuDropdown=document.getElementById('menuDropdown');
  hamburger.addEventListener('click',function(e){e.stopPropagation();menuDropdown.classList.toggle('open')});
  document.addEventListener('click',function(e){if(!hamburger.contains(e.target))menuDropdown.classList.remove('open')});

  // ── Mode Toggle ──
  function setMode(m){
    var isCap=m==='caption';
    app.classList.remove('mode-caption','mode-translate');
    app.classList.add(isCap?'mode-caption':'mode-translate');

    btnCap.classList.remove('cap-active'); btnTr.classList.remove('tr-active');
    if(isCap) btnCap.classList.add('cap-active'); else btnTr.classList.add('tr-active');

    panelCap.style.display=isCap?'flex':'none'; panelTr.style.display=isCap?'none':'flex';
    ctaCap.style.display=isCap?'inline-flex':'none';
    ctaTrAll.forEach(function(b){b.style.display=isCap?'none':'inline-flex'});

    icons.forEach(function(ico){ico.textContent=isCap?'🎙️':'🌐'});
    titles.forEach(function(t){t.textContent=isCap?'Sottotitoli':'Traduzione'});
    infoTip.innerHTML = isCap ? infoTip.getAttribute('data-tip-cap') : infoTip.getAttribute('data-tip-tr');
  }

  btnCap.addEventListener('click',function(){setMode('caption')});
  btnTr.addEventListener('click',function(){setMode('translate')});

  buildFlags(); updPair();
})();
</script>
</body>
</html>
