<h1>📊 40 Real-Time Extra Info</h1><p class="subtitle">Parts of Speech · Synonyms · CEFR · Grammar · Live Visual Feedback — June 2026</p>
<div class="grid" id="mgrid"></div>
<script>
var words=[{w:'discussing',pos:'VERB',cefr:'B1',syn:'debating, examining, exploring'},{w:'future',pos:'NOUN',cefr:'A2',syn:'tomorrow, prospect, destiny'},{w:'real-time',pos:'ADJ',cefr:'B2',syn:'instant, live, immediate'},{w:'translation',pos:'NOUN',cefr:'B1',syn:'interpretation, rendering, conversion'},{w:'international',pos:'ADJ',cefr:'B1',syn:'global, worldwide, cross-border'},{w:'meetings',pos:'NOUN',cefr:'A2',syn:'gatherings, conferences, assemblies'}];
var extraStyles=[
  {n:'POS Color Tags',desc:'Parts of speech as colored tags',panel:function(){var h='<div class="extra-panel" style="grid-template-columns:repeat(auto-fill,minmax(80px,1fr))">';words.forEach(function(w){var c=w.pos==='VERB'?'#3b82f6':w.pos==='NOUN'?'#34d399':w.pos==='ADJ'?'#f97316':'#a78bfa';h+='<span class="pos-tag" style="background:'+c+'22;color:'+c+';border:1px solid '+c+'44">'+w.w+'<br><span style="font-size:7px;opacity:.7">'+w.pos+'</span></span>'});h+='</div>';return h}},
  {n:'CEFR Level Bars',desc:'CEFR proficiency per word',panel:function(){var h='<div class="extra-panel">';words.forEach(function(w){var pct=w.cefr==='A1'?20:w.cefr==='A2'?40:w.cefr==='B1'?60:w.cefr==='B2'?80:95;var c=pct>=80?'#f87171':pct>=60?'#fbbf24':pct>=40?'#34d399':'#60a5fa';h+='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;width:56px;color:rgba(255,255,255,.6)">'+w.w+'</span><span style="font-size:8px;font-weight:700;width:20px;color:'+c+'">'+w.cefr+'</span><div style="flex:1;height:3px;background:rgba(255,255,255,.06);border-radius:2px"><div class="meter-bar" style="width:'+pct+'%;background:'+c+'"></div></div></div>'});h+='</div>';return h}},
  {n:'Synonym Cloud',desc:'Hover synonyms per word',panel:function(){var h='<div class="extra-panel" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">';words.forEach(function(w){h+='<div class="syn-box" style="background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.1)"><span style="font-weight:600;color:#c4b5fd">'+w.w+'</span><br><span style="color:rgba(200,200,255,.5)">'+w.syn+'</span></div>'});h+='</div>';return h}},
  {n:'Grammar Breakdown',desc:'Tense, mood, voice indicators',panel:function(){return'<div class="extra-panel"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip" style="background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.2)">Present Continuous</span><span class="chip" style="background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)">Active Voice</span><span class="chip" style="background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.2)">Indicative Mood</span><span class="chip" style="background:rgba(167,139,250,.1);color:#a78bfa;border:1px solid rgba(167,139,250,.2)">B1 Level</span></div></div>'}},
  {n:'Dual Column POS',desc:'Words split by type in 2 columns',panel:function(){var verbs=words.filter(function(w){return w.pos==='VERB'});var nouns=words.filter(function(w){return w.pos==='NOUN'});var h='<div class="extra-panel" style="grid-template-columns:1fr 1fr">';h+='<div style="background:rgba(59,130,246,.04);border:1px solid rgba(59,130,246,.1);border-radius:8px;padding:8px"><div style="font-size:9px;font-weight:700;color:#60a5fa;margin-bottom:4px">🔵 Verbs</div>';verbs.forEach(function(w){h+='<div style="font-size:10px;color:rgba(255,255,255,.7);padding:2px 0">'+w.w+'</div>'});h+='</div>';h+='<div style="background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.1);border-radius:8px;padding:8px"><div style="font-size:9px;font-weight:700;color:#34d399;margin-bottom:4px">🟢 Nouns</div>';nouns.forEach(function(w){h+='<div style="font-size:10px;color:rgba(255,255,255,.7);padding:2px 0">'+w.w+'</div>'});h+='</div></div>';return h}},
  {n:'Live Confidence',desc:'Per-word confidence meter',panel:function(){var h='<div class="extra-panel">';words.forEach(function(w){var conf=Math.floor(Math.random()*20+80);var c=conf>=95?'#34d399':conf>=85?'#fbbf24':'#f87171';h+='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;width:56px;color:rgba(255,255,255,.6)">'+w.w+'</span><div style="flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px"><div style="height:100%;width:'+conf+'%;border-radius:2px;background:'+c+'"></div></div><span style="font-size:9px;font-weight:600;width:28px;color:'+c+'">'+conf+'%</span></div>'});h+='</div>';return h}},
  {n:'Etymology Hints',desc:'Word origins displayed inline',panel:function(){return'<div class="extra-panel"><div style="font-size:9px;color:rgba(255,255,255,.4);line-height:1.6;padding:8px;background:rgba(167,139,250,.04);border:1px solid rgba(167,139,250,.08);border-radius:8px"><span style="color:#c4b5fd">discuss</span> ← Latin <i>discutere</i> "shake apart"<br><span style="color:#c4b5fd">future</span> ← Latin <i>futurus</i> "about to be"<br><span style="color:#c4b5fd">translate</span> ← Latin <i>translatus</i> "carried across"</div></div>'}},
  {n:'Word Frequency Rank',desc:'NGSL frequency ranking',panel:function(){var h='<div class="extra-panel">';words.forEach(function(w,i){var rank=[350,180,1200,600,400,900][i];var bar=Math.max(5,100-rank/20);h+='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;width:56px;color:rgba(255,255,255,.6)">'+w.w+'</span><div style="flex:1;height:4px;background:rgba(255,255,255,.06);border-radius:2px"><div style="height:100%;width:'+bar+'%;border-radius:2px;background:linear-gradient(90deg,#60a5fa,#a78bfa)"></div></div><span style="font-size:8px;color:rgba(255,255,255,.3);width:32px">#'+rank+'</span></div>'});h+='</div>';return h}},
  {n:'Pronunciation IPA',desc:'Phonetic transcription',panel:function(){return'<div class="extra-panel"><div style="font-size:10px;color:rgba(255,255,255,.5);line-height:1.8;padding:6px 8px;font-family:\'JetBrains Mono\',monospace"><span style="color:#60a5fa">/dɪˈskʌs/</span> discuss · <span style="color:#34d399">/ˈfjuːtʃər/</span> future · <span style="color:#fbbf24">/trænsˈleɪʃən/</span> translation</div></div>'}},
  {n:'Collocation Pairs',desc:'Common word partnerships',panel:function(){return'<div class="extra-panel" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))"><div class="syn-box" style="background:rgba(59,130,246,.04);border:1px solid rgba(59,130,246,.1)"><span style="color:#60a5fa;font-weight:600">discuss +</span><br><span style="font-size:9px;color:rgba(255,255,255,.4)">the matter<br>in detail<br>at length</span></div><div class="syn-box" style="background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.1)"><span style="color:#34d399;font-weight:600">future +</span><br><span style="font-size:9px;color:rgba(255,255,255,.4)">of work<br>generations<br>prospects</span></div></div>'}},
  {n:'Morphology Tree',desc:'Word structure breakdown',panel:function(){return'<div class="extra-panel"><div style="font-size:10px;color:rgba(255,255,255,.5);line-height:1.8;padding:8px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:8px;font-family:\'JetBrains Mono\',monospace">discuss + ing → discussing<br>inter + nation + al → international<br>trans + late + ion → translation<br>real + time → real-time</div></div>'}},
  {n:'Error Prediction',desc:'Common mistakes to avoid',panel:function(){return'<div class="extra-panel"><div style="font-size:9px;color:rgba(248,113,113,.8);line-height:1.6;padding:6px 8px;background:rgba(248,113,113,.04);border:1px solid rgba(248,113,113,.1);border-radius:8px">⚠ discussing <strong>about</strong> the future → ✗<br>✓ discussing the future<br>⚠ real time translation → hyphen missing<br>✓ real-time translation</div></div>'}},
  {n:'Semantic Field Map',desc:'Related concept clusters',panel:function(){var h='<div class="extra-panel" style="grid-template-columns:repeat(3,1fr)">';var clusters=[{n:'COMMUNICATION',w:'discuss, translation, meetings',c:'#60a5fa'},{n:'TIME',w:'future, real-time, now',c:'#fbbf24'},{n:'GLOBAL',w:'international, worldwide',c:'#34d399'}];clusters.forEach(function(cl){h+='<div style="background:'+cl.c+'08;border:1px solid '+cl.c+'22;border-radius:8px;padding:8px;text-align:center"><div style="font-size:8px;font-weight:700;color:'+cl.c+';margin-bottom:3px">'+cl.n+'</div><div style="font-size:9px;color:rgba(255,255,255,.5)">'+cl.w+'</div></div>'});h+='</div>';return h}},
  {n:'Register Indicator',desc:'Formal vs informal',panel:function(){return'<div class="extra-panel"><div style="display:flex;gap:4px"><span class="chip" style="background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2)">FORMAL</span><span class="chip" style="background:rgba(251,191,36,.05);color:rgba(251,191,36,.6);border:1px solid rgba(251,191,36,.1)">discussing ✓</span><span class="chip" style="background:rgba(248,113,113,.05);color:rgba(248,113,113,.5);border:1px solid rgba(248,113,113,.1)">chatting about ✗</span></div></div>'}},
  {n:'Word Count Pulse',desc:'Live word/minute counter',panel:function(){return'<div class="extra-panel" style="text-align:center"><div style="font-size:28px;font-weight:900;font-family:\'JetBrains Mono\',monospace;color:#fbbf24">142<span style="font-size:12px;color:rgba(255,255,255,.4)"> WPM</span></div><div style="font-size:9px;color:rgba(255,255,255,.3)">● ● ● ● ○ ○ ○ ○ ○ ○</div></div>'}},
  {n:'Sentence Length',desc:'Running avg sentence length',panel:function(){return'<div class="extra-panel"><div style="display:flex;align-items:flex-end;gap:3px;height:40px"><div style="width:8px;height:60%;background:rgba(96,165,250,.4);border-radius:2px"></div><div style="width:8px;height:80%;background:rgba(96,165,250,.5);border-radius:2px"></div><div style="width:8px;height:40%;background:rgba(96,165,250,.3);border-radius:2px"></div><div style="width:8px;height:90%;background:rgba(96,165,250,.6);border-radius:2px"></div><div style="width:8px;height:50%;background:rgba(96,165,250,.4);border-radius:2px"></div><div style="width:8px;height:70%;background:rgba(96,165,250,.5);border-radius:2px"></div><div style="width:8px;height:30%;background:rgba(96,165,250,.3);border-radius:2px"></div></div><div style="font-size:8px;color:rgba(255,255,255,.2);margin-top:4px">Avg: 12.4 words/sentence</div></div>'}},
  {n:'Vocabulary Density',desc:'Unique/total word ratio',panel:function(){return'<div class="extra-panel" style="text-align:center"><div style="position:relative;width:80px;height:80px;margin:0 auto"><svg viewBox="0 0 100 100" style="transform:rotate(-90deg)"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="8"/><circle cx="50" cy="50" r="40" fill="none" stroke="#a78bfa" stroke-width="8" stroke-dasharray="251.3" stroke-dashoffset="75" stroke-linecap="round"/></svg><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:\'JetBrains Mono\',monospace;font-size:18px;font-weight:900;color:#c4b5fd">0.7</div></div><div style="font-size:8px;color:rgba(255,255,255,.3);margin-top:4px">Lexical Diversity</div></div>'}},
  {n:'Emotion Tone',desc:'Sentiment indicator',panel:function(){return'<div class="extra-panel"><div style="display:flex;align-items:center;gap:8px;padding:8px;background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.1);border-radius:8px"><span style="font-size:16px">😊</span><div><div style="font-size:10px;font-weight:600;color:#34d399">Neutral-Positive</div><div style="font-size:8px;color:rgba(255,255,255,.3)">Confidence: 78% · Objective tone</div></div></div></div>'}},
  {n:'Filler Counter',desc:'Uhm/ah/like counter',panel:function(){return'<div class="extra-panel"><div style="display:flex;gap:6px;align-items:center"><span style="font-size:9px;color:rgba(248,113,113,.6)">Fillers this session:</span><span style="font-size:18px;font-weight:900;color:#f87171;font-family:\'JetBrains Mono\',monospace">3</span><span style="font-size:9px;color:rgba(255,255,255,.3)">· 0.8/min · 🟢 Good</span></div></div>'}},
  {n:'Pace Indicator',desc:'Speed zones visual',panel:function(){return'<div class="extra-panel"><div style="display:flex;height:6px;border-radius:3px;overflow:hidden"><div style="width:30%;background:rgba(96,165,250,.3)"></div><div style="width:40%;background:rgba(52,211,153,.5)"></div><div style="width:20%;background:rgba(251,191,36,.4)"></div><div style="width:10%;background:rgba(248,113,113,.3)"></div></div><div style="display:flex;justify-content:space-between;font-size:7px;color:rgba(255,255,255,.2);margin-top:2px"><span>Slow</span><span>Ideal</span><span>Fast</span><span>Too fast</span></div></div>'}},
  {n:'Interactive Word',desc:'Click any word for details',panel:function(){var h='<div class="extra-panel" style="grid-template-columns:repeat(auto-fill,minmax(60px,1fr))">';words.forEach(function(w){h+='<div style="padding:6px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:6px;text-align:center;cursor:pointer;transition:all .2s" onmouseenter="this.style.borderColor=\'#a78bfa\';this.style.background=\'rgba(167,139,250,.08)\'" onmouseleave="this.style.borderColor=\'rgba(255,255,255,.06)\';this.style.background=\'rgba(255,255,255,.03)\'"><div style="font-size:10px;font-weight:600;color:rgba(255,255,255,.8)">'+w.w+'</div><div style="font-size:7px;color:rgba(255,255,255,.3)">'+w.pos+' · '+w.cefr+'</div></div>'});h+='</div>';return h}},

ck}.extra-badge{font-size:11px;margin-left:6px;display:inline-block}.version-badge{font-size:9px;margin-left:6px;color:#60a5fa;font-weight:700;display:inline-block;animation:starPop .3s ease}@keyframes starPop{0%{transform:scale(0)}60%{transform:scale(1.4)}100%{transform:scale(1)}}.comment-note{padding:6px 10px;margin:6px 0 0 0;background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.15);border-radius:8px;font-size:10px;color:#c4b5fd;font-style:italic;line-height:1.4;display:flex;align-items:flex-start;gap:6px}.comment-note::before{content:"💬";flex-shrink:0;font-style:normal}@keyframes deleteOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.85);max-height:0;padding:0;margin:0;overflow:hidden}}.del-confirm{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}.del-confirm>div{background:#1a1e2e;border:1px solid #2a2e3e;border-radius:14px;padding:24px;max-width:360px;text-align:center}.del-confirm h3{font-size:15px;margin-bottom:8px;color:#f87171}.del-confirm p{font-size:12px;color:#8b93a5;margin-bottom:16px}.del-confirm .btns{display:flex;gap:8px;justify-content:center}.del-confirm .btns button{padding:8px 20px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}.del-confirm .btn-yes{background:#dc2626;color:#fff}.del-confirm .btn-no{background:#2a2e3e;color:#e8eaed}.sent-msg{font-size:9px;color:#34d399;white-space:nowrap}.deleted-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.15);border-radius:10px;margin-bottom:16px;font-size:11px;color:#f87171;display:none}.deleted-bar.visible{display:flex}.deleted-bar button{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.2);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:10px;font-weight:600;font-family:inherit;transition:all .2s}.deleted-bar button:hover{background:#059669;color:#fff}.extras-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.15);border-radius:10px;margin-bottom:16px;font-size:11px;color:#34d399}.extras-bar a{color:#34d399;font-weight:700}@keyframes fadeIn{from{opacity:0}to{opacity:1}}';
document.head.appendChild(style);

var extrasBar=document.createElement('div');
extrasBar.className='extras-bar';
extrasBar.innerHTML='📌 <strong>'+extras.length+'</strong> design raccolt'+((extras.length!==1)?'i':'o')+' come extra — <a href="studio-caption-mockups-extras.html">Vai alla pagina Extra →</a>';
var grid=document.querySelector('.grid');
if(grid)grid.parentNode.insertBefore(extrasBar,grid);

var deletedBar=document.createElement('div');
deletedBar.className='deleted-bar'+(deleted.length>0?' visible':'');
deletedBar.innerHTML='<span>'+String.fromCodePoint(0x1F5D1)+' <strong>'+deleted.length+'</strong> version'+((deleted.length!==1)?'i':'e')+' elimination. </span><button id="restoreAllBtn">'+String.fromCodePoint(0x1F504)+' Ripristina tutte</button>';
if(grid)grid.parentNode.insertBefore(deletedBar,grid);
var restoreBtn=document.getElementById('restoreAllBtn');
if(restoreBtn)restoreBtn.addEventListener('click',function(){if(confirm('Ripristinare TUTTE le versioni eliminate?')){localStorage.setItem(DELETED_KEY,'[]');location.reload()}});

function isFaveComment(text){
  if(!text)return false;
  var t=text.toLowerCase();
  return /favourite|favorite|preferito|preferita|favo|⭐|★|☆|top|bellissimo|ottimo|best|love|amo|adoro|piaciuto|bello/i.test(t);
}

function saveComment(card,label,name,key,input,tools,favBtn){
  var msg=input.value.trim();
  if(!msg)return;
  var all=JSON.parse(localStorage.getItem(COMMENTS_KEY)||'{}');
  all[key]=msg;
  localStorage.setItem(COMMENTS_KEY,JSON.stringify(all));
  
  if(isFaveComment(msg)){
    var f=JSON.parse(localStorage.getItem(FAV_KEY)||'{}');
    if(!f[key]){f[key]=true;localStorage.setItem(FAV_KEY,JSON.stringify(f));favBtn.classList.add('active');card.classList.add('favorited');if(!label.querySelector('.favorite-star')){var s=document.createElement('span');s.className='favorite-star';s.textContent='⭐';label.appendChild(s);}}
  }
  
  var existingNote=card.querySelector('.comment-note');
  if(existingNote){existingNote.textContent=msg;}
  else{
    var note=document.createElement('div');note.className='comment-note';note.textContent=msg;
    var body=card.querySelector('.mockup-body');
    if(body){var panel=body.querySelector('.extra-panel');if(panel){panel.insertAdjacentElement('afterend',note);}else{body.appendChild(note);}}
  }
  
  var span=document.createElement('span');span.className='sent-msg';span.textContent='✓ Salvato';tools.appendChild(span);
  setTimeout(function(){span.remove()},2000);
  input.value='';
  
  // Update debug panel
  updateDebugPanel();
}

function updateDebugPanel(){
  var panel=document.getElementById("debug-notes-panel");
  if(!panel)return;
  var all=JSON.parse(localStorage.getItem("mockup_comments")||"{}");
  var allKeys=Object.keys(all);
  var pageKeys=allKeys.filter(function(k){return k.startsWith(pageId+"::")});
  
  // Always show the panel
  panel.style.display="block";
  
  if(allKeys.length===0){
    panel.innerHTML='<strong style="color:#6b7280">📋 Nessuna nota salvata. Scrivi un'+"'"+"istruzione e premi Enter per salvarla.</strong>";
    return;
  }
  
  var html='<strong style="color:#a78bfa">📋 '+allKeys.length+' note totali ('+pageKeys.length+' su questa pagina)</strong> ';
  html+='<button id="copyAllNotesBtn" style="background:#7c3aed;color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:10px;margin-left:8px;font-weight:600">📋 Copia TUTTE le note</button><br>';
  
  // Show notes on this page
  if(pageKeys.length>0){
    html+='<div style="margin-top:4px;color:#8b93a5;font-size:10px">Questa pagina:</div>';
    pageKeys.forEach(function(k){
      var name=k.replace(pageId+"::","");
      html+='<div style="margin:3px 0;padding:4px 8px;background:rgba(167,139,250,.08);border-radius:4px;font-size:10px"><span style="color:#60a5fa">'+name+'</span> → <span style="color:#e8eaed">'+all[k]+'</span></div>';
    });
  }
  
  // Show notes from other pages
  var otherKeys=allKeys.filter(function(k){return !k.startsWith(pageId+"::")});
  if(otherKeys.length>0){
    html+='<div style="margin-top:6px;color:#6b7280;font-size:10px">Altre pagine:</div>';
    otherKeys.forEach(function(k){
      var parts=k.split("::");
      var pg=parts[0].replace("studio-caption-mockups-","Pg ").replace("studio-caption-mockups","Pg 1");
      var name=parts[1]||"";
      html+='<div style="margin:2px 0;padding:3px 8px;background:rgba(107,114,128,.06);border-radius:4px;font-size:9px"><span style="color:#6b7280">['+pg+']</span> <span style="color:#60a5fa">'+name+'</span> → <span style="color:#9ca3af">'+all[k]+'</span></div>';
    });
  }
  
  panel.innerHTML=html;
  
  // Wire up copy button
  var btn=document.getElementById("copyAllNotesBtn");
  if(btn){
    btn.addEventListener("click",function(){
      var notes=JSON.parse(localStorage.getItem("mockup_comments")||"{}");
      navigator.clipboard.writeText(JSON.stringify(notes,null,2)).then(function(){
        btn.textContent="✓ Copiato!";
        setTimeout(function(){btn.textContent="📋 Copia TUTTE le note"},2000);
      });
    });
  }
}
document.querySelectorAll('.mockup-card').forEach(function(card){
  var label=card.querySelector('.mockup-label span:first-child');
  var name=label?label.textContent.trim():'';
  var key=pageId+'::'+name;
  
  var isDeleted=deleted.some(function(d){return d.name===name&&d.page===pageId});
  if(isDeleted){card.classList.add('deleted-card');return}
  
  var isFave=!!favorites[key];
  var savedComment=comments[key]||'';
  if(!isFave && savedComment && isFaveComment(savedComment)){
    isFave=true;favorites[key]=true;localStorage.setItem(FAV_KEY,JSON.stringify(favorites));
  }
  
  var isExtra=extras.some(function(e){return e.name===name&&e.sourcePage===pageId});
  if(isExtra){
    card.classList.add('extra-card');
    var badge=document.createElement('span');badge.className='extra-badge';badge.textContent='📌';badge.title='Già inviato agli Extra';label.appendChild(badge);
  }
  
  if(versioned[key]){
    card.classList.add('versioned');
    var vbadge=document.createElement('span');vbadge.className='version-badge';vbadge.textContent='◆ v2';vbadge.title='Nuova versione — nota processata il '+new Date(versioned[key]).toLocaleDateString('it-IT');label.appendChild(vbadge);
  }
  
  if(isFave){
    card.classList.add('favorited');
    var star=document.createElement('span');star.className='favorite-star';star.textContent='⭐';star.title='Preferito: '+savedComment;label.appendChild(star);
  }
  
  if(savedComment && savedComment.trim()){
    var note=document.createElement('div');note.className='comment-note';note.textContent=savedComment;
    var body=card.querySelector('.mockup-body');
    if(body){var panel=body.querySelector('.extra-panel');if(panel){panel.insertAdjacentElement('afterend',note);}else{body.appendChild(note);}}
  }
  
  var tools=document.createElement('div');tools.className='mockup-tools';
  var favActive=isFave?' active':'';
  tools.innerHTML='<input type="text" placeholder="✏️ Istruzioni per '+name+'..." class="mockup-msg" value="'+savedComment.replace(/"/g,'&quot;').replace(/</g,'&lt;')+'"><button class="fav-btn'+favActive+' mockup-fav" title="Preferito">⭐</button><button class="extra-btn mockup-extra" title="Sposta negli Extra">📌 Extra</button><button class="send-btn mockup-send">Invia</button><button class="del-btn mockup-del">'+String.fromCodePoint(0x1F5D1)+' Elimina</button>';
  card.appendChild(tools);
  
  var input=tools.querySelector('.mockup-msg');
  var favBtn=tools.querySelector('.mockup-fav');
  var extraBtn=tools.querySelector('.mockup-extra');
  
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();saveComment(card,label,name,key,input,tools,favBtn);}
  });
  
  favBtn.addEventListener('click',function(){
    var f=JSON.parse(localStorage.getItem(FAV_KEY)||'{}');
    if(f[key]){delete f[key];favBtn.classList.remove('active');card.classList.remove('favorited');var s=label.querySelector('.favorite-star');if(s)s.remove();}
    else{f[key]=true;favBtn.classList.add('active');card.classList.add('favorited');if(!label.querySelector('.favorite-star')){var s=document.createElement('span');s.className='favorite-star';s.textContent='⭐';label.appendChild(s);}}
    localStorage.setItem(FAV_KEY,JSON.stringify(f));
  });
  
  extraBtn.addEventListener('click',function(){
    var e=JSON.parse(localStorage.getItem(EXTRA_KEY)||'[]');
    if(e.some(function(x){return x.name===name&&x.sourcePage===pageId})){alert('📌 "'+name+'" è già negli Extra!');return;}
    // Capture the page's full style so extras page can render it
    var pageStyle='';
    var styleEls=document.querySelectorAll('style');
    styleEls.forEach(function(s){pageStyle+=s.textContent});
    var cardClone=card.cloneNode(true);
    var cloneTools=cardClone.querySelector('.mockup-tools');if(cloneTools)cloneTools.remove();
    var cloneNotes=cardClone.querySelectorAll('.comment-note');cloneNotes.forEach(function(n){n.remove()});
    e.push({name:name,sourcePage:pageId,html:cardClone.outerHTML,style:pageStyle,comment:savedComment||'',time:Date.now()});
    localStorage.setItem(EXTRA_KEY,JSON.stringify(e));
    extraBtn.classList.add('sent');extraBtn.textContent='✓ Inviato';extraBtn.disabled=true;
    var d=JSON.parse(localStorage.getItem(DELETED_KEY)||'[]');d.push({name:name,page:pageId,time:Date.now()});
    localStorage.setItem(DELETED_KEY,JSON.stringify(d));
    card.classList.add('deleting');
    setTimeout(function(){card.classList.add('deleted-card');card.classList.remove('deleting')},450);
    var bar=document.querySelector('.deleted-bar');if(bar){var dd=JSON.parse(localStorage.getItem(DELETED_KEY)||'[]');bar.classList.add('visible');bar.querySelector('strong').textContent=dd.length}
    var ebar=document.querySelector('.extras-bar');if(ebar){var ee=JSON.parse(localStorage.getItem(EXTRA_KEY)||'[]');ebar.querySelector('strong').textContent=ee.length}
  });
  
  tools.querySelector('.mockup-send').addEventListener('click',function(){saveComment(card,label,name,key,input,tools,favBtn);});
  
  tools.querySelector('.mockup-del').addEventListener('click',function(){
    var confirm=document.createElement('div');confirm.className='del-confirm';
    confirm.innerHTML='<div><h3>'+String.fromCodePoint(0x1F5D1)+' Eliminare '+name+'?</h3><p>Questa versione sparirà dalla pagina e resterà eliminata anche dopo il refresh.</p><div class="btns"><button class="btn-yes">Sì, elimina</button><button class="btn-no">Annulla</button></div></div>';
    document.body.appendChild(confirm);
    confirm.querySelector('.btn-yes').addEventListener('click',function(){
      confirm.remove();
      var d=JSON.parse(localStorage.getItem(DELETED_KEY)||'[]');d.push({name:name,page:pageId,time:Date.now()});
      localStorage.setItem(DELETED_KEY,JSON.stringify(d));
      card.classList.add('deleting');
      setTimeout(function(){card.classList.add('deleted-card');card.classList.remove('deleting')},450);
      var bar=document.querySelector('.deleted-bar');if(bar){var dd=JSON.parse(localStorage.getItem(DELETED_KEY)||'[]');bar.classList.add('visible');bar.querySelector('strong').textContent=dd.length}
    });
    confirm.querySelector('.btn-no').addEventListener('click',function(){confirm.remove()});
    confirm.addEventListener('click',function(e){if(e.target===confirm)confirm.remove()});
  });
});
})();

</script>
</body></html>
