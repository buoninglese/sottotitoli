<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Box Mockup · Sottotitoli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0f1117;
  --panel: #1a1d26;
  --card: #1e2130;
  --line: #2a2d3a;
  --line-strong: #3a3d4a;
  --text: #e6edf3;
  --text-soft: #9ca3af;
  --text-faint: #6b7280;
  --muted: #9ca3af;
  --muted2: #6b7280;
  --accent: #7c3aed;
  --teal: #0e7490;
  --cyan: #06b6d4;
  --warn: #f59e0b;
  --green: #10b981;
  --font-body: 'Inter', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 20px;
}
.caption-bar {
  width: 100%; max-width: 900px;
  background: var(--panel);
  border: 2px solid var(--line-strong);
  border-radius: 34px;
  padding: 18px 28px;
  box-shadow: 0 4px 32px rgba(0,0,0,.3);
  position: relative;
  min-height: 180px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.caption-interim {
  text-align: center;
  font-size: var(--font-size-override, 55px);
  font-weight: 800;
  line-height: 1.25;
  color: var(--text);
  letter-spacing: -0.02em;
  word-break: break-word;
  width: 100%;
  min-height: 80px;
  transition: font-size .15s;
}
.caption-interim:empty::after {
  content: attr(data-placeholder);
  color: var(--text-faint);
  font-weight: 400;
  font-size: 28px;
}
.caption-tools {
  position: absolute; top: 10px; right: 14px;
  display: flex; align-items: center; gap: 6px;
}
.tool-btn {
  font-size: 13px; padding: 5px 10px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  cursor: pointer; font-family: var(--font-body);
  display: flex; align-items: center; gap: 4px;
  transition: all .15s;
}
.tool-btn:hover { border-color: var(--accent); color: var(--text); }
.tool-btn.on { color: var(--accent); border-color: var(--accent); }
.tool-btn-icon {
  font-size: 14px; padding: 4px 6px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
  cursor: pointer;
}
.tool-btn-icon:hover { border-color: var(--accent); color: var(--text); }
.action-bar {
  display: flex; align-items: center; justify-content: center;
  gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
}
.btn-start {
  font-size: 15px; padding: 10px 26px; border-radius: 100px;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  color: #fff; border: none; cursor: pointer;
  font-family: var(--font-body); font-weight: 700;
  display: inline-flex; align-items: center; gap: 8px;
  transition: filter .2s, transform .15s;
}
.btn-start:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-start:active { transform: scale(.97); }
.btn-start.recording { background: linear-gradient(135deg, #ef4444, #f43f5e); }
.rec-timer {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px; font-weight: 600; color: var(--text);
  min-width: 48px; text-align: center;
}
.mic-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--muted);
}
.mic-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.mic-dot.live { background: #ef4444; animation: pulse-dot 1s infinite; }
@keyframes pulse-dot { 0%,100% { opacity: 1 } 50% { opacity: .4 } }

/* Live caption variants */
.cap-var5 .caption-interim { color: #fff; text-shadow: 0 0 20px rgba(255,255,255,.15); }
.cap-var6 .caption-interim {
  color: #facc15; font-weight: 900;
  text-shadow: 0 0 30px rgba(250,204,21,.3), 0 2px 8px rgba(0,0,0,.4);
}
.cap-var7 .caption-interim {
  color: #22d3ee; font-weight: 900;
  text-shadow: 0 0 24px rgba(34,211,238,.5), 0 0 60px rgba(34,211,238,.2);
}

.lang-select {
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted);
}
.lang-select select {
  padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card);
  color: var(--text); font-family: var(--font-body); font-size: 13px;
}

.room-id {
  font-size: 11px; color: var(--text-faint); font-family: 'JetBrains Mono', monospace;
  text-align: center; margin-top: 8px;
}
</style>
</head>
<body>

<div style="width:100%;max-width:900px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
  <div class="lang-select">
    <i class="fas fa-globe"></i>
    <select id="langSelect" onchange="setLanguage(this.value)">
      <option value="en-US">English</option>
      <option value="it-IT">Italiano</option>
      <option value="nl-NL">Nederlands</option>
      <option value="fr-FR">Français</option>
      <option value="de-DE">Deutsch</option>
      <option value="es-ES">Español</option>
      <option value="pt-PT">Português</option>
      <option value="pl-PL">Polski</option>
    </select>
  </div>
  <div class="room-id" id="roomId" style="margin-top:0">—</div>
</div>

<div class="caption-bar" id="captionBar">
  <div class="caption-interim" id="captionInterim" data-placeholder="Speak to see subtitles…"></div>
  <div class="caption-tools">
    <button class="tool-btn" id="fontSizeBtn" onclick="cycleFontSize()" title="Font size">
      A<span id="fontSizeLabel" style="font-weight:700;color:var(--text)">55</span>
    </button>
    <button class="tool-btn" id="magicFixBtn" onclick="toggleMagicFix()" title="Magic Fix">
      <i class="fas fa-wand-magic-sparkles" style="font-size:11px"></i>
      <span id="magicFixLabel" style="font-size:11px;font-weight:600">Fix</span>
    </button>
    <button class="tool-btn-icon" id="liveStyleBtn" onclick="cycleLiveStyle()" title="Cycle style">
      <i class="fas fa-palette"></i>
    </button>
  </div>
</div>

<div class="action-bar">
  <button class="btn-start" id="startBtn" onclick="toggleMic()">
    <i class="fas fa-microphone"></i> Ascolta
  </button>
  <span class="rec-timer" id="recTimer">00:00</span>
  <span class="mic-status">
    <span class="mic-dot" id="micDot"></span>
    <span id="micStatus">Mic Off</span>
  </span>
</div>

<div class="room-id" id="roomIdBottom">Room: —</div>

<script src="config.js"></script>
<script>
// ── Room ID ──
var ROOM_ID = 'mockup-' + Date.now().toString(36);
localStorage.setItem('sottotitoli-caption-room-id', ROOM_ID);
document.getElementById('roomId').textContent = 'Room: ' + ROOM_ID.substring(0, 12) + '…';
document.getElementById('roomIdBottom').textContent = 'Room: ' + ROOM_ID.substring(0, 12) + '…';

// ── Language ──
var currentLang = localStorage.getItem('sottotitoli-caption-lang') || 'en-US';
document.getElementById('langSelect').value = currentLang;
function setLanguage(code) {
  currentLang = code;
  localStorage.setItem('sottotitoli-caption-lang', code);
}

// ── WebSocket ──
var WS_URL = (window.SOTTOTITOLI_CONFIG && window.SOTTOTITOLI_CONFIG.websocketUrl) || 'wss://sottotitoli-websocket.onrender.com';
var ws = null;
var msgCounter = 0;

function connectWS() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = function() {
      ws.send(JSON.stringify({ type: 'join', room: ROOM_ID }));
      console.log('WS connected, room:', ROOM_ID);
    };
    ws.onmessage = function(e) {
      try {
        var data = JSON.parse(e.data);
        if (data.interm) showInterim(data.interm);
        if (data.final) showFinal(data.final);
      } catch(ex) {}
    };
    ws.onclose = function() { console.log('WS closed'); };
    ws.onerror = function() { console.warn('WS error'); };
  } catch(e) { console.error('WS connect failed:', e); }
}

// ── Microphone ──
var recognition = null;
var isRecording = false;
var timerInterval = null;
var seconds = 0;

function toggleMic() {
  if (isRecording) { stopMic(); return; }
  startMic();
}

function startMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Speech recognition not supported in this browser. Use Chrome.');
    return;
  }
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = currentLang;

  recognition.onresult = function(e) {
    var interim = '', final = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var r = e.results[i];
      if (r.isFinal) final += r[0].transcript;
      else interim += r[0].transcript;
    }
    if (interim) showInterim(interim);
    if (final) {
      showFinal(final);
      msgCounter++;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'msg', msg: true, final: final, id: msgCounter, label: 'speaker', room: ROOM_ID }));
      }
    }
  };

  recognition.onerror = function(e) { console.error('SR error:', e.error); stopMic(); };
  recognition.onend = function() { if (isRecording) { try { recognition.start(); } catch(ex) {} } };

  try { recognition.start(); } catch(ex) { console.error('SR start failed:', ex); return; }

  isRecording = true;
  document.getElementById('startBtn').classList.add('recording');
  document.getElementById('startBtn').innerHTML = '<i class="fas fa-stop"></i> Stop';
  document.getElementById('micDot').classList.add('live');
  document.getElementById('micStatus').textContent = 'Live';
  seconds = 0;
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
  connectWS();
  document.getElementById('captionInterim').textContent = '';
}

function stopMic() {
  isRecording = false;
  if (recognition) { try { recognition.stop(); } catch(ex) {} }
  clearInterval(timerInterval);
  document.getElementById('startBtn').classList.remove('recording');
  document.getElementById('startBtn').innerHTML = '<i class="fas fa-microphone"></i> Ascolta';
  document.getElementById('micDot').classList.remove('live');
  document.getElementById('micStatus').textContent = 'Mic Off';
  document.getElementById('recTimer').textContent = '00:00';
}

function updateTimer() {
  var m = Math.floor(seconds / 60);
  var s = seconds % 60;
  document.getElementById('recTimer').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  seconds++;
}

// ── Caption display ──
function showInterim(text) {
  var el = document.getElementById('captionInterim');
  if (!el) return;
  el.textContent = formatCaption(text, 50, 3);
}

function showFinal(text) {
  var el = document.getElementById('captionInterim');
  if (!el) return;
  el.textContent = formatCaption(text, 50, 3);
  setTimeout(function() { if (!isRecording) el.textContent = ''; }, 3000);
}

function formatCaption(text, maxChars, maxLines) {
  if (!text) return '';
  var words = text.trim().split(/\s+/);
  var lines = [], current = '';
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    var test = current ? current + ' ' + w : w;
    if (test.length <= maxChars) { current = test; }
    else { if (current) lines.push(current); current = w.length > maxChars ? w.substring(0, maxChars) : w; }
  }
  if (current) lines.push(current);
  while (lines.length > maxLines) lines.shift();
  if (lines.length === 0) return text;
  return lines.join('\n');
}

// ── Font size ──
var _fontSizes = [45, 55, 65];
var _fontIdx = 1;
function cycleFontSize() {
  _fontIdx = (_fontIdx + 1) % _fontSizes.length;
  var px = _fontSizes[_fontIdx];
  document.documentElement.style.setProperty('--font-size-override', px + 'px');
  document.getElementById('fontSizeLabel').textContent = px;
  localStorage.setItem('sottotitoli-font-size', px);
}
(function(){
  var saved = localStorage.getItem('sottotitoli-font-size');
  if (saved) {
    var px = parseInt(saved);
    var idx = _fontSizes.indexOf(px);
    if (idx >= 0) { _fontIdx = idx; document.documentElement.style.setProperty('--font-size-override', px + 'px'); }
    document.getElementById('fontSizeLabel').textContent = px;
  }
})();

// ── Live style cycle ──
var _liveStyles = ['6','7','5'];
var _liveStyleIdx = 0;
function cycleLiveStyle() {
  _liveStyleIdx = (_liveStyleIdx + 1) % _liveStyles.length;
  var val = _liveStyles[_liveStyleIdx];
  [5,6,7].forEach(function(i){ document.documentElement.classList.remove('cap-var'+i); });
  document.documentElement.classList.add('cap-var'+val);
  localStorage.setItem('sottotitoli-caption-var', val);
}
(function(){
  var saved = localStorage.getItem('sottotitoli-caption-var') || '0';
  var idx = _liveStyles.indexOf(saved);
  if (idx >= 0) _liveStyleIdx = idx;
  if (saved !== '0') document.documentElement.classList.add('cap-var'+saved);
})();

// ── Magic Fix ──
var _magicFixOn = false;
function toggleMagicFix() {
  _magicFixOn = !_magicFixOn;
  var btn = document.getElementById('magicFixBtn');
  var label = document.getElementById('magicFixLabel');
  if (_magicFixOn) {
    btn.classList.add('on');
    label.textContent = 'On';
    localStorage.setItem('sottotitoli-magic-fix', '1');
  } else {
    btn.classList.remove('on');
    label.textContent = 'Fix';
    localStorage.setItem('sottotitoli-magic-fix', '0');
  }
}
(function(){
  if (localStorage.getItem('sottotitoli-magic-fix') === '1') {
    _magicFixOn = true;
    document.getElementById('magicFixBtn').classList.add('on');
    document.getElementById('magicFixLabel').textContent = 'On';
  }
})();
</script>
</body>
</html>
