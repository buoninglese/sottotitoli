<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI Guards · Sottotitoli</title>
<!--
  tests/ui-guards.html — regression harness for the UI/UX audit fixes.

  WHY THIS EXISTS
  Every fix from the audit (see ~/Desktop/OS/sottotitoli/ui-audit/) must improve its own target
  without moving any other number. This page measures those numbers.

  HARD-WON RULES baked in (each cost a false finding during the audit):
    1. Assert VISIBILITY before measuring — offsetParent !== null AND a non-zero rect.
       Five audit findings were false because text/geometry was measured on hidden elements.
    2. Before trusting a NEGATIVE, calibrate: these checks print a control so an empty result
       is distinguishable from a blind one.
    3. Force the DEFAULT state before fingerprinting; SPA state persists across interactions.
    4. Never claim what a user "sees" from textContent alone — icons render as glyphs, and the
       ligature text stays in the accessibility tree.

  HOW TO RUN
    Serve the repo (python3 -m http.server 8147), then open
        http://localhost:8147/tests/ui-guards.html
    It loads panoramica.html in a same-origin iframe and reports BASELINE vs CURRENT.

  SCOPE — what this harness CANNOT measure, and must never be reported as passing:
    * Keyboard / focus order  — a headless-ish harness delivers no key events
                                (verified: a keydown listener saw 0 events). Needs a real browser
                                or CDP Input.dispatchKeyEvent.
    * Mode-B-only metrics     — anything needing a signed-in session (real balances, banners).
    * #wbDrawer               — requires a word saved in a bank.
-->
<style>
  body{font:13px/1.55 Inter,system-ui,sans-serif;margin:0;padding:20px;background:#0f1115;color:#e6e9ef}
  h1{font-size:17px;margin:0 0 4px}
  p.sub{margin:0 0 18px;opacity:.65}
  table{border-collapse:collapse;width:100%;margin-bottom:18px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #23262e;vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;opacity:.6}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .pass{color:#34d399}.fail{color:#f87171}.na{color:#9ca3af}
  code{background:#1a1d24;padding:1px 5px;border-radius:4px}
  iframe{width:100%;height:420px;border:1px solid #23262e;border-radius:10px;background:#fff}
  .note{margin-top:16px;padding:12px 14px;border-radius:10px;background:#1a1d24;font-size:12px}
</style>
</head>
<body>
<h1>UI Guards — panoramica</h1>
<p class="sub">Regression harness for the audit fixes. Baseline captured 2026-09-27 at
<code>a912b48</code> (v321). A fix passes only if its own row improves and no other row moves.</p>

<table id="out">
  <thead><tr><th>#</th><th>Metric</th><th>Baseline</th><th>Current</th><th>Verdict</th></tr></thead>
  <tbody><tr><td colspan="5">loading…</td></tr></tbody>
</table>

<div class="note" id="notes"></div>
<iframe id="frame" src="../panoramica.html?bypass_auth=1"></iframe>
  <!-- The measured page is a parameter so the whole B13 family can run against every
       page, not just this one. It was hardcoded, which meant onboarding.html,
       caption-s8t.html, index.html, purchase.html, termini.html and privacy.html were
       never measured at all — and onboarding turned out to hold seven placeholders with
       no English counterpart. This runs AFTER the iframe: placed before it,
       getElementById('frame') returns null and the parameter is silently ignored.
       Usage: ?page=../onboarding.html  -->
  <script>
    (function(){
      var q = new URLSearchParams(location.search).get('page');
      var f = document.getElementById('frame');
      if (q && f) f.setAttribute('src', q);
    })();
  </script>

<script>
/* ── baseline: measured, not guessed. Source: ui-audit/16-BASELINE.md ───────────── */
var BASELINE = {
  B1:  91,     // Material Symbols spans WITHOUT aria-hidden  (of 94)
  B1t: 94,
  B8:  0,      // themes with horizontal overflow (of 4)
  B9:  0,      // horizontal overflow at 375px
  B10: 0,      // uncaught JS errors on load (calibrated)
  B13: 5,      // Italian-only visible strings on the dashboard, lang=en (lower bound)
  B13t:95,
  B13x: 0,     // CORRECTED detector: all text nodes, no viewport limit. Target is 0.
  B13a: 0,     // Italian-only ATTRIBUTE strings (data-tip/title/aria-label/placeholder)
  B13z: 0,     // MIRROR: English-only strings while the UI is ITALIAN. Target is 0.
  B16: 8,      // sidebar nav items that are href="#"  (corrected from 9 — see 16-BASELINE.md)
  B16t:9       // of 9 items total; the 9th, "Vocabulary Trainer", is href="#learner"
};

var rows = [];
var errs = [];
/* The actual strings behind the B13 family's counts.
   Without these, a count like "B13x 35" is unactionable: you have to go and
extract the
   same thing by hand, with a DIFFERENT script, and mine had a bug that reported a bound
   string as unannotated. The harness has working positives controls, so let the harness
   say what it found. Kept in full so the numbers can be read rather than guessed at. */
var lastHits = { x: [], a: [], z: [], zc: [] };
function row(id, name, base, cur, verdict, note) {
  rows.push({ id: id, name: name, base: base, cur: cur, verdict: verdict, note: note || '' });
}

var frame = document.getElementById('frame');
var win, doc;

/* Real uncaught errors from the MEASURED page. Deliberately separate from `errs`, which
   holds the harness's own findings about the page rather than things the page threw.
   console.error is NOT counted: under ?bypass_auth=1 the mock user 401s on every
   Supabase call, so a console count would be pure noise and would drown the signal.
   "Uncaught JS errors" is what this row says, so uncaught is what it measures. */
var pageErrors = [];
var armedOnce = false;
function armFrame() {
  var w = frame.contentWindow;
  if (!w) return;
  w.addEventListener('error', function (e) {
    pageErrors.push('error: ' + (e.message || '(no message)') +
      (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno : ''));
  });
  w.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    pageErrors.push('unhandled rejection: ' + ((r && r.message) ? r.message : String(r)));
  });
}

frame.addEventListener('load', function () {
  win = frame.contentWindow;
  doc = frame.contentDocument;

  /* ⚠️ TWO LOADS, ON PURPOSE — this is the entire fix.

     A listener can only be attached to a frame's window AFTER that window exists.
     Anything the page throws while its own scripts run happens BEFORE the first load
     event, so by the time we could attach, the evidence is gone. Not hypothetical: a
     change of mine threw "ReferenceError: I18n is not defined" on EVERY load of
     panoramica.html, and this row reported 0 the whole time.

     So arm the fresh window, force one reload, and measure the SECOND load — by then
     the listeners are in place before that load's scripts run. The first load is
     thrown away. It also means the old `win.__guardErrs` dependence is gone: that
     only ever counted errors the app volunteered to record, which is why this row
     was hardcoded to 'pass' and could not fail. */
  if (!armedOnce) {
    armedOnce = true;
    armFrame();
    try { frame.contentWindow.location.reload(); } catch (e) { frame.setAttribute('src', frame.getAttribute('src')); }
    return;
  }
  armFrame();
  // First give the page's own scripts a head start, then let run() poll until the
  // DOM actually stops changing, instead of trusting a single fixed wait (D6).
  setTimeout(run, 4000);
});

function visible(el) {
  // RULE 1 — the single most important line in this file.
  if (!el || el.offsetParent === null) return false;
  var s = win.getComputedStyle(el);
  if (s.visibility === 'hidden') return false;
  var r = el.getBoundingClientRect();
  return r.width > 0 && r.height > 0;
}
function txt(el) { return (el.textContent || '').replace(/\s+/g, ' ').trim(); }

/* ── D6 · settle BEFORE measuring ───────────────────────────────────────────────
   The fixed 4000ms wait was not enough. Panels render lazily, so the SAME build
   produced B13 denominators of 95, 52 and 55, and B1 of 93, 81 and 93. The
   NUMERATORS were right every time (0), but a moving denominator twice cost real
   time to rule out as a regression. So poll a cheap DOM signature and only
   measure once it has been unchanged for STABLE_READS consecutive polls.
   settleInfo records whether it actually settled, so a reader can tell a stable
   reading from one taken at the cap without knowing to ask.                       */
var STABLE_READS = 5, POLL_MS = 250, MAX_MS = 30000;
var settleInfo = { ms: 0, settled: false };
// Holds the Italian-pass readings, which are the POSITIVE CONTROLS for the B13 family.
// Kept separate from `rows` because the Italian pass is not a result — it exists only to
// prove the detectors can see Italian. Without it, a 0 is indistinguishable from a blind test.
var itControl = null;
function domSignature() {
  var allCount = doc.querySelectorAll('body *').length;
  var leaves = doc.querySelectorAll('h1,h2,h3,h4,p,span,div,button,label,option,li');
  var leafCount = 0;
  for (var i = 0; i < leaves.length; i++) if (leaves[i].children.length === 0) leafCount++;
  return allCount + ':' + leafCount + ':' + (doc.body.textContent || '').length;
}
function settleThenMeasure(cb) {
  var last = null, same = 0, waited = 0;
  (function poll() {
    var sig = domSignature();
    if (sig === last) same++; else { same = 0; last = sig; }
    if (same >= STABLE_READS || waited >= MAX_MS) {
      settleInfo = { ms: waited, settled: waited < MAX_MS };
      measure();
      if (cb) cb();
      return;
    }
    waited += POLL_MS;
    setTimeout(poll, POLL_MS);
  })();
}

function run() {
  // PIN THE UI LANGUAGE FIRST. B13 asks "how many visible strings are Italian while the
  // UI is English?", which is meaningless unless the language is fixed. Without this the
  // value reflects whatever language the PREVIOUS page load happened to leave in
  // localStorage — the SAME build measured 3 and then 16 purely from that, and the 16
  // looked exactly like a regression. apply() releases its internal guard on
  // requestAnimationFrame, so give it a frame before measuring.
  //
  // ITALIAN FIRST — as a POSITIVE CONTROL, not as a reading. The most expensive lesson
  // of this audit: a 0 from a detector that has never been shown to find anything is not
  // evidence of anything. B13 reported a clean page for weeks while four Italian strings
  // sat in it, because the detector skipped bare text nodes AND clipped to the viewport.
  // So every language sweep now runs TWICE — once in Italian, to prove it can see
  // Italian, and once in English, which is the actual reading. A sweep whose Italian pass
  // finds nothing is reported as a failure of the TEST, not a pass of the page.
  if (win && win.I18n && win.I18n.setLang) {
    win.I18n.setLang('it');
    setTimeout(function () {
      settleThenMeasure(function () {
        win.I18n.setLang('en');
        setTimeout(function () { settleThenMeasure(); }, 600);
      });
    }, 600);
    return;
  }
  settleThenMeasure();
}

function measure(compareWith) {
  // Reset first. measure() fires again on every iframe load, and because `rows` lives at
  // script scope it would otherwise ACCUMULATE — producing a table with every row
  // duplicated (seen: 12 rows instead of 6) and a misleading pass count.
  rows = [];
  errs = [];

  /* ── CALIBRATION CONTROL ───────────────────────────────────────────────────────
     RULE 2. If this returns 0 we know nothing, because a working query would find it.
     The control must be present on every run or every other negative is meaningless. */
  var control = doc.querySelectorAll('body *').length;
  if (control === 0) {
    errs.push('CALIBRATION FAILED: body has 0 elements — the harness is blind, all negatives void.');
  }

  /* ── B1 · icon spans without aria-hidden ──────────────────────────────────────── */
  var spans = doc.querySelectorAll('.material-symbols-outlined, .material-symbols-rounded');
  var b1 = 0;
  for (var i = 0; i < spans.length; i++) if (spans[i].getAttribute('aria-hidden') !== 'true') b1++;
  row('B1', 'Icon spans without aria-hidden="true"', BASELINE.B1 + ' / ' + BASELINE.B1t,
      b1 + ' / ' + spans.length, b1 <= BASELINE.B1 ? 'pass' : 'fail',
      'decorative icons only; icons that ARE the label need aria-label instead');

  /* ── B8 · horizontal overflow in the current theme ────────────────────────────── */
  var theme = doc.documentElement.getAttribute('data-theme') || '(none)';
  var over = doc.documentElement.scrollWidth > win.innerWidth + 1;
  row('B8', 'Horizontal overflow · theme ' + theme, BASELINE.B8 + ' / 4',
      over ? '1' : '0', over ? 'fail' : 'pass',
      'run once per theme: modern, modern-light, genz, genz-dark');

  /* ── B9 · elements wider than the viewport (375px check is separate) ──────────── */
  var wide = 0;
  var all = doc.querySelectorAll('body *');
  for (var j = 0; j < all.length; j++) {
    var el = all[j];
    if (!visible(el)) continue;                       // RULE 1
    if (el.getBoundingClientRect().width > win.innerWidth + 2) wide++;
  }
  row('B9', 'Visible elements wider than the viewport', '0',
      String(wide), wide === 0 ? 'pass' : 'fail',
      'at 375px this must stay 0');

  /* ── B10 · uncaught JS errors from the measured page ─────────────────────────────
     This row used to read: String(errs.length + (win.__guardErrs || []).length)
     with a HARDCODED verdict of 'pass'. So it could not fail, and it counted only
     what the app chose to volunteer. A real uncaught error was invisible to it —
     which is how a change of mine shipped a page that threw on every single load
     while this row stayed green at 0. It now counts real error/unhandledrejection
     events from the frame, on a load where the listeners were armed first. */
  var _pe = pageErrors.length;
  row('B10', 'Uncaught JS errors in the measured page', BASELINE.B10,
      String(errs.length + _pe),
      (errs.length + _pe) <= BASELINE.B10 ? 'pass' : 'fail',
      _pe ? 'THROWN BY THE PAGE: ' + pageErrors.slice(0, 3).join('  |  ')
          : 'armed before load, so a load-time throw would be caught here');

  /* ── B16 · sidebar nav items that are href="#" ───────────────────────────────── */
  var navLinks = doc.querySelectorAll('nav a[href], [class*="side"] a[href]');
  var hash = 0, counted = 0;
  for (var k = 0; k < navLinks.length; k++) {
    var l = navLinks[k];
    if (!visible(l)) continue;                        // RULE 1
    if ((l.textContent || '').trim().length < 2) continue;
    counted++;
    if (l.getAttribute('href') === '#') hash++;
  }
  row('B16', 'Sidebar items that are href="#"', BASELINE.B16 + ' / ' + BASELINE.B16t,
      hash + ' / ' + counted, hash <= BASELINE.B16 ? 'pass' : 'fail',
      'target: real hash routes (O-5). 8 is the corrected baseline; 9 was an over-count.');

  /* ── B13 family · Italian leaked into an English UI ──────────────────────────────
     Two detectors, because they fail in different ways, and each carries its own
     POSITIVE CONTROL so that a 0 is falsifiable.

     B13  — the ORIGINAL, kept for continuity with 16-BASELINE.md. Walks leaf ELEMENTS
            and applies visible(). Both restrictions hid real leaks: a bare text node
            (the word "parole" sitting directly in a span's parent) is not a leaf
            element, and anything below the fold was skipped entirely. Its historical 0
            was therefore not evidence of anything.
     B13x — the CORRECTED detector. Every text node in the body, no viewport limit.
            This is what a user's eye does. Baseline 0: any Italian in English mode is
            a leak, so the target is zero and not "no worse than last time".
     B13a — the ATTRIBUTE sweep. The chart-tooltip bug proved this is a separate survey:
            its text lived in a data-tip attribute, invisible to EVERY text-node sweep,
            so a page could score a perfect 0 and still show Italian tooltips. Attributes
            are not text, so they need their own detector — and their own control.

     Known DELIBERATE exception: the Italian-tab labels in the bank detail view
     (itTabNames / itTabSubs / itTabEmpties) are intentionally Italian in both languages,
     because they name an Italian-language surface. If this sweep flags them, they are
     not a defect.                                                                    */
  var IT = /\b(il|lo|la|gli|le|un|una|del|della|che|per|con|non|più|sono|questo|questa|tuo|tua|ancora|oggi|subito|tutti|tutte|come|dove|quando|solo|anche|già|senza|dopo|prima|parole|sessione|sessioni|impostazioni|salva|chiudi|crea|carica|nessun|nessuna|cerca|giorni|minuti|banca|banche|invita|copia|breve|ordine|apprendimento|riepilogo|colora|colorazione|cattura|sottotitoli|sottotitolo|ricomincia|ripartire|guadagna|guadagni|genera|profilo|rivedere|ripasso|ripassa|missioni|missione|consolida|spaziata|preferiti|tema|argomento|nuova|nuovo|invia|scrivi|conosci|dettagli|anagrafici|visibili|pubblico|obiettivo|obiettivi|miglioramento|completa|inizia|seleziona|modificare|filtra|lingua|lingue|traduzione|totale|ultime|sicure|sicurezza|avvia|apri)\b/i;
  var EN = /\b(the|you|your|and|of|to|in|is|are|with|for|from|this|that|create|cancel|save|close|no|not|new|start|settings|words|session|search|days|minutes|bank|word|add|copy|invite)\b/i;

  function classify(strings) {
    var seen = {}, itOnly = 0, enOnly = 0, total = 0, samples = [], enSamples = [];
    for (var i = 0; i < strings.length; i++) {
      var t = strings[i];
      if (!t || seen[t]) continue;
      seen[t] = 1; total++;
      if (IT.test(t) && !EN.test(t)) { itOnly++; if (samples.length < 400) samples.push(t); }
      // The MIRROR. Every B13 row asked one direction only — Italian leaking into
      // the English UI — so English leaking into the ITALIAN UI was structurally
      // invisible to this harness. Mode B then found seven real instances of it in
      // minutes: #wbDrawer's "Meaning" / "Bank membership" / "Add to bank" /
      // "Signals" headings (no data-i18n at all), #ssPopup's aria-label="Close",
      // the report picker's "Toggle favorite", and onboarding's English data-it
      // values. Same defect, opposite direction — so it gets the same treatment.
      else if (EN.test(t) && !IT.test(t)) { enOnly++; if (enSamples.length < 400) enSamples.push(t); }
    }
    return { itOnly: itOnly, enOnly: enOnly, total: total, samples: samples, enSamples: enSamples };
  }
  // Every text node, including ones whose parent also holds other text. Script and
  // style content is excluded so a regex literal or a CSS comment cannot be reported
  // as a leak.
  function textNodeStrings() {
    var out = [], showText = (win.NodeFilter && win.NodeFilter.SHOW_TEXT) || 4;
    var w = doc.createTreeWalker(doc.body, showText, null);
    var n;
    while ((n = w.nextNode())) {
      var parent = n.parentElement;
      if (!parent) continue;
      var tag = parent.tagName;
      if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT') continue;
      // ICON LIGATURES ARE NOT USER-VISIBLE TEXT.
      // Material Symbols render an icon from its NAME: <span class="material-symbols-outlined">
      // settings</span> contributes the text node "settings". The mirror sweep flagged
      // close / settings / search as English leaks in the Italian UI before this guard,
      // which is how 115 of the first 115 "leaks" were icon names. B13x never caught it
      // because icon names are English-ish, so they never matched the ITALIAN word list —
      // the asymmetry is exactly why the mirror needed its own tuning.
      var cls = (parent.className || '').toString();
      if (/material-symbols|material-icons|\bfa[sbr]?\b/.test(cls)) continue;
      if (parent.closest && parent.closest('.material-symbols-outlined, .material-symbols-rounded, svg')) continue;
      var t = (n.nodeValue || '').replace(/\s+/g, ' ').trim();
      if (t.length < 4 || !/[a-zA-Z]{3}/.test(t)) continue;
      out.push(t);
    }
    return out;
  }
  function attributeStrings() {
    var ATTRS = ['data-tip', 'title', 'aria-label', 'placeholder', 'alt'];
    var out = [], els = doc.querySelectorAll('[data-tip],[title],[aria-label],[placeholder],[alt]');
    for (var i = 0; i < els.length; i++) {
      for (var j = 0; j < ATTRS.length; j++) {
        var v = els[i].getAttribute(ATTRS[j]);
        if (v && v.length > 3) out.push(v.replace(/\s+/g, ' ').trim());
      }
    }
    return out;
  }

  // The original detector, preserved so its row keeps its meaning.
  var leaves = doc.querySelectorAll('h1,h2,h3,h4,p,span,div,button,label,option,li');
  var leafStrings = [];
  for (var m = 0; m < leaves.length; m++) {
    var e2 = leaves[m];
    if (e2.children.length !== 0) continue;
    if (!visible(e2)) continue;                       // RULE 1
    leafStrings.push(txt(e2));
  }
  var cLeaf = classify(leafStrings);
  row('B13', 'Italian-only strings · ORIGINAL detector (leaf elements, visible only)',
      BASELINE.B13 + ' / ' + BASELINE.B13t,
      cLeaf.itOnly + ' / ' + cLeaf.total, cLeaf.itOnly <= BASELINE.B13 ? 'pass' : 'fail',
      'kept for continuity; known to skip bare text nodes and everything below the fold, ' +
      'so its 0 is a weak signal. Read B13x instead.');

  var cText = classify(textNodeStrings());
  var cAttr = classify(attributeStrings());
  var lang = (win.I18n && win.I18n.getLang) ? win.I18n.getLang() : 'unknown';
  // Record what was found so the notes can show it.
  // ⚠️ GATED ON THE ENGLISH PASS. An earlier version populated these whenever the count was
  // non-zero, which meant the ITALIAN pass — whose job is to find Italian, where Italian is
  // correct — wrote 60 legitimate Italian labels into the "leaks" list. The English pass then
  // had zero hits, so the `if` was false and the stale Italian list survived. Reading it
  // produced a 60-string false leak report. Only the pass being READ may write these.
  if (lang === 'en') {
    lastHits.x = cText.samples;
    lastHits.a = cAttr.samples;
  }

  // Remember the Italian pass. This is the control, and it must not be overwritten by
  // the English pass that follows (or by the D6 second reading).
  if (lang === 'it') {
    itControl = { text: cText, attr: cAttr, leaf: cLeaf };
    if (cText.enOnly) lastHits.z = cText.enSamples;
    if (cAttr.enOnly) lastHits.z = lastHits.z.concat(cAttr.enSamples);
  } else {
    if (cText.enOnly) lastHits.zc = cText.enSamples;
    row('B13x', 'Italian-only strings · ALL text nodes, no viewport limit (lang=en)',
        String(BASELINE.B13x), cText.itOnly + ' / ' + cText.total,
        cText.itOnly <= BASELINE.B13x ? 'pass' : 'fail',
        cText.itOnly ? 'first samples: ' + cText.samples.join(' | ') :
        'target is 0 — any Italian in an English UI is a leak, not a regression budget');
    row('B13a', 'Italian-only ATTRIBUTE strings (data-tip/title/aria-label/placeholder/alt)',
        String(BASELINE.B13a), cAttr.itOnly + ' / ' + cAttr.total,
        cAttr.itOnly <= BASELINE.B13a ? 'pass' : 'fail',
        cAttr.itOnly ? 'first samples: ' + cAttr.samples.join(' | ') :
        'the chart-tooltip bug lived entirely in data-tip, invisible to every text sweep');

    // ── the controls ──
    if (!itControl) {
      row('B13c', 'CONTROL · could the detectors see Italian at all?', 'pass',
          'NOT RUN', 'fail',
          'the Italian pass never completed, so B13/B13x/B13a cannot be trusted');
    } else {
      var okText = itControl.text.itOnly > 0, okAttr = itControl.attr.itOnly > 0;
      row('B13c', 'CONTROL · text detector finds Italian when the UI IS Italian', '> 0',
          itControl.text.itOnly + ' / ' + itControl.text.total, okText ? 'pass' : 'fail',
          okText ? 'the detector is capable of seeing Italian, so a 0 above is meaningful'
                 : 'DETECTOR BLIND — it found no Italian even in Italian. Every 0 in the ' +
                   'B13 family is unfalsifiable until this passes.');
      row('B13ac', 'CONTROL · attribute detector finds Italian when the UI IS Italian', '> 0',
          itControl.attr.itOnly + ' / ' + itControl.attr.total, okAttr ? 'pass' : 'fail',
          okAttr ? 'the attribute sweep can see Italian, so a 0 above is meaningful'
                 : 'sweep found no Italian attributes in Italian mode — check it selects anything');
    }

    /* ── B13z · the MIRROR ────────────────────────────────────────────────────
       English leaking into an Italian UI. The READING comes from the Italian pass
       (stored in itControl); the CONTROL is the English pass, where English is
       correct and the count must be large. Same two-pass structure, read backwards,
       so the mirror costs one extra row and no extra page load.                     */
    var okMirrorCtl = cText.enOnly > 0;
    row('B13zc', 'CONTROL · does the mirror find English when the UI IS English?', '> 0',
        cText.enOnly + ' / ' + cText.total, okMirrorCtl ? 'pass' : 'fail',
        okMirrorCtl ? 'the mirror can see English, so B13z below is meaningful'
                    : 'MIRROR BLIND — it found no English even in English mode. If this ' +
                      'fails, B13z\'s 0 proves nothing and must not be read as clean.');
    if (!itControl) {
      row('B13z', 'MIRROR · English-only strings while the UI is Italian', String(BASELINE.B13z),
          'NOT RUN', 'fail',
          'the Italian pass never completed, so the mirror has no reading');
    } else {
      var mirT = itControl.text.enOnly, mirA = itControl.attr.enOnly;
      row('B13z', 'MIRROR · English-only text + attributes while the UI is Italian',
          String(BASELINE.B13z), (mirT + mirA) + ' = ' + mirT + ' text + ' + mirA + ' attr',
          (mirT + mirA) <= BASELINE.B13z ? 'pass' : 'fail',
          mirT ? 'first samples: ' + itControl.text.enSamples.join(' | ')
               : 'target is 0 — English in an Italian UI is the same defect, mirrored. ' +
                 'This row is what would have caught #wbDrawer and #ssPopup automatically.');

      /* ── B13zr · the ACTIONABLE mirror ────────────────────────────────────────
         B13z alone is not actionable: it counted 104, of which most were the vocabulary
         the app TEACHES ("Greetings, introductions and numbers.") and brand terms —
         correct as English in both languages — plus stale renders from the language
         switch itself. Deciding which is which by hand is a keyword list that rots.

         The two passes already answer it. A string that is English in the ITALIAN pass
         AND English in the ENGLISH pass is deliberately language-independent (or stale),
         because it does not change with the language. A string that is English ONLY in
         the Italian pass is a genuine mirror leak.

         So the allowlist IS the difference: no keywords to maintain, nothing to drift.
         Confirmed against a real run — the teaching topics and the tagline appeared in
         both lists; "Words to review", "Session", "No sessions found." and "Add to
         favorites" appeared only in the Italian one, and those are the real defects. */
      var zcSet = {};
      for (var zi = 0; zi < lastHits.zc.length; zi++) zcSet[lastHits.zc[zi]] = 1;
      lastHits.zr = lastHits.z.filter(function (s) { return !zcSet[s]; });
      row('B13zr', 'MIRROR · excluding strings that are ALSO English in the English UI',
          '0', String(lastHits.zr.length), lastHits.zr.length ? 'fail' : 'pass',
          lastHits.zr.length
            ? 'actionable: ' + lastHits.zr.slice(0, 8).join(' | ')
            : 'nothing left once intentional English and stale renders are subtracted');
    }
  }

  /* ── D6 · two settled readings, and flag any row that moved ────────────────
     Settling alone did NOT make this deterministic. Three runs on the same build
     with the settle loop already in place: B13 held at 72 every time, but B1 still
     moved 93 / 93 / 81 — AND still reported settled:true. The reason is that the
     page being measured is HIDDEN, and a hidden page has its timers throttled, so
     content keeps arriving long after any fixed settle window. No amount of waiting
     can be proved sufficient, so measure twice and believe neither reading when the
     two disagree. A row that moves is reported as 'unstable', not 'pass': a moving
     count is not evidence of a regression, but it IS proof the number cannot be
     trusted.                                                                */
  if (!compareWith) {
    var firstPass = rows;
    setTimeout(function () { measure(firstPass); }, POLL_MS * 2);
    return;
  }
  for (var ci = 0; ci < rows.length && ci < compareWith.length; ci++) {
    if (rows[ci].cur !== compareWith[ci].cur) {
      rows[ci].verdict = 'unstable';
      rows[ci].note = 'count moved between two settled readings (' + compareWith[ci].cur +
        ' → ' + rows[ci].cur + '); the measured page is hidden and its timers are ' +
        'throttled — re-run with this tab visible before believing this row. ' + rows[ci].note;
    }
  }

  /* ── render ─────────────────────────────────────────────────────────────────── */
  var tb = document.querySelector('#out tbody');
  tb.innerHTML = rows.map(function (r) {
    return '<tr><td class="num">' + r.id + '</td><td>' + r.name +
           (r.note ? '<br><span style="opacity:.5;font-size:11px">' + r.note + '</span>' : '') +
           '</td><td class="num">' + r.base + '</td><td class="num">' + r.cur +
           '</td><td class="' + r.verdict + '">' + r.verdict + '</td></tr>';
  }).join('');

  document.getElementById('notes').innerHTML =
    '<strong>Measured with UI language:</strong> <code>' + (win.I18n && win.I18n.getLang ? win.I18n.getLang() : 'unknown') +
    '</code> · page hidden: <code>' + (document.hidden || frame.contentDocument.hidden) + '</code><br>' +
    '<strong>Language passes:</strong> each sweep ran twice — Italian first as a POSITIVE ' +
      'CONTROL (proves the detectors can see Italian), then English, which is the reading. ' +
      'A control that fails invalidates every 0 in its family.<br>' +
    '<strong>DOM settled before measuring:</strong> <code>' + settleInfo.settled + '</code> after <code>' +
      settleInfo.ms + 'ms</code>' +
      (settleInfo.settled ? '' :
        ' — <strong style="color:#f87171">hit the 20s cap: a denominator may still have been ' +
        'moving when this ran, so treat the counts as UNVERIFIED</strong>') +
    '<br><br>' +
    '<strong>Not measured here — do NOT read as passing:</strong><br>' +
    '· <strong>Keyboard / focus order</strong> — this harness sends no key events ' +
      '(verified: a keydown listener saw 0). Needs a real browser or CDP <code>Input.dispatchKeyEvent</code>.<br>' +
    '· <strong>B2/B3/B4/B5/B6</strong> (accessible names per surface) — need the relevant panel open; ' +
      'run them with the panel focused, using the same <code>visible()</code> rule.<br>' +
    '· <strong>B7, B12, B14, B15, B17, B18</strong> — need Mode B (a signed-in session) or a populated bank.<br>' +
    '· <code>#wbDrawer</code> — needs a word saved in a bank.' +
    (errs.length ? '<br><br><strong style="color:#f87171">' + errs.join('<br>') + '</strong>' : '');

  /* The offending strings themselves. Collapsed by default so the notes stay readable,
     but present, because a count alone is unactionable: acting on "B13x 35" previously
     meant re-extracting by hand with a second script that had its own bug. The harness
     has passing controls, so let the harness say what it found. */
  (function () {
    function block(label, arr, colour) {
      if (!arr || !arr.length) return '';
      var safe = arr.map(function (s) {
        return '· ' + String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }).join('\n');
      return '<details style="margin-top:10px"><summary style="cursor:pointer;color:' + colour + '">' +
        '<strong>' + label + '</strong> — ' + arr.length + ' (click to expand)</summary>' +
        '<pre style="max-height:280px;overflow:auto;background:#14161a;border:1px solid #23262e;' +
        'border-radius:8px;padding:10px;font-size:11.5px;line-height:1.55;white-space:pre-wrap;' +
        'margin:6px 0 0">' + safe + '</pre></details>';
    }
    var extra =
      block('Italian shown in the English UI · text (B13x)', lastHits.x, '#f87171') +
      block('Italian shown in the English UI · attributes (B13a)', lastHits.a, '#f87171') +
      block('English shown in the Italian UI · mirror (B13z)', lastHits.z, '#fbbf24') +
      block('ACTIONABLE mirror · B13z minus the control (B13zr)', lastHits.zr, '#f87171') +
      block('control · English shown in the English UI (B13zc)', lastHits.zc, '#94a3b8');
    if (extra) document.getElementById('notes').innerHTML += extra;
  })();
}
</script>
</body>
</html>
