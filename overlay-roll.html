<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />
  <title>Sottotitoli Overlay (Roll)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    :root {
      --roll-bg: rgba(5, 12, 24, 0.96);
      --roll-line: rgba(148, 163, 184, 0.25);
      --roll-muted: #94a3b8;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top left, rgba(59, 130, 246, .22), transparent 50%),
                  linear-gradient(180deg, #020617, #020617);
      color: #e5edff;
      font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .overlay-root {
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 20px;
    }

    .roll-card {
      width: 100%;
      max-width: 1200px;
      background: var(--roll-bg);
      border-radius: 18px 18px 0 0;
      border-top: 1px solid rgba(148, 163, 184, .45);
      border-left: 1px solid rgba(30, 64, 175, .5);
      border-right: 1px solid rgba(30, 64, 175, .5);
      box-shadow:
        0 -18px 50px rgba(0, 0, 0, .55),
        0 -1px 0 rgba(15, 23, 42, 1);
      padding: 10px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .roll-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--roll-muted);
    }

    .roll-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .roll-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #f97316;
    }

    .roll-dot.connected {
      background: #22c55e;
    }

    .roll-room {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, .55);
      color: #dbeafe;
    }

    .roll-list {
      margin-top: 2px;
      max-height: 38vh;
      overflow: hidden;
      display: flex;
      flex-direction: column-reverse;
      gap: 4px;
    }

    .roll-line {
      font-size: 22px;
      line-height: 1.5;
      border-top: 1px solid rgba(148, 163, 184, .15);
      padding-top: 4px;
    }

    .roll-placeholder {
      font-size: 14px;
      color: var(--roll-muted);
    }

    #interimPreview {
      border-top: 1px solid rgba(96, 165, 250, 0.25);
      color: #93c5fd;
    }

    .pos-verb { color: #2563eb; }
    .pos-noun { color: #16a34a; }
    .pos-adj  { color: #f97316; }
    .pos-adv  { color: #7c3aed; }

    @media (max-width: 720px) {
      .roll-card {
        padding: 8px 12px 10px;
      }
      .roll-line {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="overlay-root">
    <div class="roll-card">
      <div class="roll-header">
        <div>Rolling captions</div>
        <div class="roll-status">
          <span class="roll-dot" id="rollDot"></span>
          <span id="rollStatusText">Connecting…</span>
          <span class="roll-room" id="rollRoomLabel"></span>
        </div>
      </div>
      <div class="roll-list" id="captionBox">
        <div class="roll-placeholder">Waiting for captions…</div>
      </div>
    </div>
  </div>

  <script src="js/jquery.min.js"></script>
  <script src="config.js"></script>
  <script src="ws-publisher.js"></script>
  <script src="js/lemma-pos-map.js"></script>
  <script src="js/pos-coloring.js"></script>

  <script>
    (function (w) {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const room = params.get("room");
      const modeFromQuery = params.get("mode") || "caption-en";

      const captionBox = document.getElementById("captionBox");
      const rollDot = document.getElementById("rollDot");
      const rollStatusText = document.getElementById("rollStatusText");
      const rollRoomLabel = document.getElementById("rollRoomLabel");

      function modeIsEnglishLesson(modeKey) {
        if (!modeKey) return false;
        return modeKey.indexOf("lesson") !== -1 && modeKey.indexOf("caption") === -1;
      }

      function tokenizeCaption(text) {
        const rawTokens = text.match(/[A-Za-z']+|\S/g) || [];
        return rawTokens.map(function (t) {
          const lemma = t.toLowerCase();
          const pos =
            (w.LEMMA_POS_MAP && w.LEMMA_POS_MAP[lemma]) || null;
          return {
            text: t,
            lemma,
            pos
          };
        });
      }

      function clearPlaceholder() {
        const ph = captionBox.querySelector(".roll-placeholder");
        if (ph) ph.remove();
      }

      function appendRollLine(payload) {
        if (!payload) return;

        const text = payload.final || payload.interim || "";
        const modeKey = payload.mode || modeFromQuery;

        if (!text) return;
        clearPlaceholder();

        const line = document.createElement("div");
        line.className = "roll-line";

        if (modeIsEnglishLesson(modeKey)) {
          const tokens = tokenizeCaption(text);
          if (w.SottotitoliPosColoring) {
            const temp = document.createElement("span");
            w.SottotitoliPosColoring.renderColoredCaption(temp, tokens);
            line.innerHTML = temp.innerHTML;
          } else {
            line.textContent = text;
          }
        } else {
          line.textContent = text;
        }

        captionBox.prepend(line);

        const maxLines = 10;
        while (captionBox.childNodes.length > maxLines) {
          captionBox.removeChild(captionBox.lastChild);
        }
      }

      function setRollState(state) {
        if (!rollDot || !rollStatusText) return;
        if (state === "connected") {
          rollDot.classList.add("connected");
          rollStatusText.textContent = "Connected";
        } else if (state === "connecting") {
          rollDot.classList.remove("connected");
          rollStatusText.textContent = "Connecting…";
        } else if (state === "error") {
          rollDot.classList.remove("connected");
          rollStatusText.textContent = "Error";
        } else {
          rollDot.classList.remove("connected");
          rollStatusText.textContent = "Disconnected";
        }
      }

      var reconnectTimer = null;
      var retryCount = 0;
      var manualClose = false;
      var socket = null;

      function getRetryDelay() {
        if (retryCount === 0) return 0;
        return Math.min(1000 * Math.pow(2, retryCount - 1), 30000);
      }

      function clearReconnectTimer() {
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      }

      function connect() {
        if (manualClose) return;
        clearReconnectTimer();

        const cfgRoot =
          w.SOTTOTITOLI_CONFIG ||
          w.SOTTOTITOLICONFIG ||
          w.SottotitoliConfig ||
          {};

        const wsUrl = cfgRoot.websocketUrl || cfgRoot.websocket_url || "";

        if (!wsUrl) {
          captionBox.innerHTML = '<div class="roll-placeholder">No websocket URL in config.</div>';
          setRollState("error");
          return;
        }

        try {
          setRollState("connecting");
          socket = new WebSocket(wsUrl + "?room=" + encodeURIComponent(room));
        } catch (err) {
          captionBox.innerHTML = '<div class="roll-placeholder">WebSocket error.</div>';
          setRollState("error");
          scheduleReconnect();
          return;
        }

        socket.onopen = function () {
          retryCount = 0;
          setRollState("connected");
          try {
            socket.send(JSON.stringify({ join: room }));
          } catch (err) {
            console.error("[Overlay-roll] Failed to join room", err);
          }
        };

        socket.onmessage = function (event) {
          try {
            const payload = JSON.parse(event.data);
            // Accept both new format (type: "caption") and legacy format (msg: true)
            if (payload && (payload.type === "caption" || payload.msg === true)) {
              if (payload.msg === true && !payload.type) {
                payload.type = "caption";
              }
              if (payload.final) {
                appendRollLine(payload);
                var interimPreview = document.getElementById("interimPreview");
                if (interimPreview) interimPreview.remove();
              } else if (payload.interim) {
                var interimPreview = document.getElementById("interimPreview");
                if (!interimPreview) {
                  interimPreview = document.createElement("div");
                  interimPreview.id = "interimPreview";
                  interimPreview.className = "roll-line";
                  interimPreview.style.opacity = "0.6";
                  interimPreview.style.fontStyle = "italic";
                  captionBox.prepend(interimPreview);
                }
                interimPreview.textContent = payload.interim;
              }
            }
          } catch (e) {
            console.error("[Overlay-roll] Failed to parse message", e);
          }
        };

        socket.onclose = function () {
          if (manualClose) { setRollState("disconnected"); return; }
          setRollState("disconnected");
          scheduleReconnect();
        };

        socket.onerror = function () {
          setRollState("error");
        };
      }

      function scheduleReconnect() {
        if (manualClose) return;
        var delay = getRetryDelay();
        retryCount += 1;
        reconnectTimer = setTimeout(connect, delay);
      }

      document.addEventListener("DOMContentLoaded", function () {
        if (rollRoomLabel) {
          rollRoomLabel.textContent = room ? ("room " + room) : "no room";
        }

        if (!room) {
          captionBox.innerHTML = '<div class="roll-placeholder">No room specified.</div>';
          return;
        }

        connect();
      });
    })(window);
  </script>
</body>
</html>
