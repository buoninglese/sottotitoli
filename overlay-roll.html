<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />
  <title>Sottotitoli Overlay (Roll)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      font-family: "Montserrat", system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .overlay-root {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 100vh;
      padding: 16px 24px;
    }

    .caption-box {
      max-width: 100%;
      width: 100%;
      font-size: 28px;
      line-height: 1.6;
      text-align: left;
      word-wrap: break-word;
      word-break: break-word;
    }

    .pos-verb {
      color: #2563eb;
    }

    .pos-noun {
      color: #16a34a;
    }

    .pos-adj {
      color: #f97316;
    }

    .pos-adv {
      color: #7c3aed;
    }
  </style>
</head>
<body>
  <div class="overlay-root">
    <div id="captionBox" class="caption-box"></div>
  </div>

  <!-- Core scripts from your app -->
  <script src="js/jquery.min.js"></script>
  <script src="config.js?v11"></script>
  <script src="ws-publisher.js?v11"></script>

  <!-- POS colouring and map -->
  <script src="js/lemma-pos-map.js?v1"></script>
  <script src="js/pos-coloring.js?v1"></script>

  <script>
  (function (w) {
    "use strict";

    const params = new URLSearchParams(window.location.search);
    const room = params.get("room");
    const modeFromQuery = params.get("mode") || "caption-en";

    const captionBox = document.getElementById("captionBox");

    function modeIsEnglishLesson(modeKey) {
      if (!modeKey) return false;
      return modeKey.indexOf("lesson") !== -1 && modeKey.indexOf("caption") === -1;
    }

    function tokenizeCaption(text) {
      const rawTokens = text.match(/[A-Za-z']+|\S/g) || [];
      return rawTokens.map(function (t) {
        const lemma = t.toLowerCase();
        const pos =
          (w.LEMMA_POS_MAP && w.LEMMA_POS_MAP[lemma]) || null;
        return {
          text: t,
          lemma: lemma,
          pos: pos
        };
      });
    }

    function handleCaptionPayload(payload) {
      if (!payload) return;

      const text = payload.final || payload.interim || "";
      const modeKey = payload.mode || modeFromQuery;

      if (!text) {
        captionBox.textContent = "";
        return;
      }

      if (modeIsEnglishLesson(modeKey)) {
        const tokens = tokenizeCaption(text);
        if (w.SottotitoliPosColoring) {
          w.SottotitoliPosColoring.renderColoredCaption(captionBox, tokens);
        } else {
          captionBox.textContent = text;
        }
      } else {
        captionBox.textContent = text;
      }
    }

    function handleOverlayState(state) {
      if (state === "disconnected" || state === "error") {
        captionBox.textContent = "Overlay connection lost.";
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (!room) {
        captionBox.textContent = "No room specified.";
        return;
      }

      const cfgRoot =
        w.SOTTOTITOLI_CONFIG ||
        w.SOTTOTITOLICONFIG ||
        w.SottotitoliConfig ||
        {};

      const wsUrl = cfgRoot.websocketUrl || cfgRoot.websocket_url || "";

      if (!wsUrl) {
        captionBox.textContent =
          "Overlay not connected (no websocket URL in config).";
        return;
      }

      let socket;
      try {
        socket = new WebSocket(wsUrl + "?room=" + encodeURIComponent(room));
      } catch (err) {
        captionBox.textContent =
          "Overlay not connected (websocket error).";
        return;
      }

      socket.onopen = function () {
        // optional: show a connected state somewhere if you add a status element
      };

      socket.onmessage = function (event) {
        try {
          const payload = JSON.parse(event.data);
          if (payload && payload.type === "caption") {
            handleCaptionPayload(payload);
          }
        } catch (e) {
          // ignore malformed messages
        }
      };

      socket.onclose = function () {
        handleOverlayState("disconnected");
      };

      socket.onerror = function () {
        handleOverlayState("error");
      };
    });
  })(window);
</script>
</body>
</html>
