<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Index BG · 20 Slide Transitions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--card:#12121a;--line:#1e1e2a;--text:#e8eaed;--t2:#8b93a5;--t3:#4e5566;--accent:#a78bfa}
[data-theme="light"]{--bg:#f5f5f7;--card:#fff;--line:#e5e7eb;--text:#111827;--t2:#6b7280;--t3:#9ca3af;--accent:#7c3aed}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:24px}
h1{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:-.5px;margin-bottom:2px}
h1 em{color:var(--accent);font-style:normal}
.sub{font-size:13px;color:var(--t2);margin-bottom:20px}
.top-row{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.top-row button{padding:8px 16px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.top-row button:hover{border-color:var(--accent);color:var(--accent)}
.top-row button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.top-row .sep{color:var(--t3);font-size:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1500px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
.bg-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:all .3s;position:relative;cursor:pointer}
.bg-card:hover{border-color:rgba(167,139,250,.25);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.bg-card canvas{display:block;width:100%;height:180px}
.bg-card .info{padding:8px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.bg-card .info .name{font-size:11px;font-weight:700;color:var(--text)}
.bg-card .info .num{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);padding:2px 7px;border-radius:100px;background:rgba(167,139,250,.1)}
.bg-card .hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:8px;color:rgba(255,255,255,.3);pointer-events:none;text-transform:uppercase;letter-spacing:.1em;transition:opacity .3s}
.bg-card:hover .hint{opacity:0}
.legend{display:flex;gap:16px;justify-content:center;margin-top:20px;font-size:10px;color:var(--t3);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend .dot{width:8px;height:8px;border-radius:2px}
.back{display:inline-block;margin-bottom:18px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:500}
.back:hover{text-decoration:underline}
</style>
</head>
<body>
<a href="index.html" class="back">← Back to Index</a>
<h1>Slide <em>Transitions</em></h1>
<p class="sub">20 transition effects on 2 base backgrounds. Click any card to trigger. Each card = one slide-to-slide transition concept.</p>
<div class="top-row">
  <button class="active" data-theme="dark" onclick="setTheme('dark',this)">🌙 Dark</button>
  <button data-theme="light" onclick="setTheme('light',this)">☀️ Light</button>
  <span class="sep">|</span>
  <button onclick="triggerAll()">▶ Trigger All (staggered)</button>
  <button onclick="resetAll()">↺ Reset All</button>
</div>
<div class="grid" id="grid"></div>
<div class="legend">
  <span><span class="dot" style="background:var(--accent)"></span> Dot Grid base</span>
  <span><span class="dot" style="background:#34d399"></span> Particles base</span>
  <span>Click any card to trigger its transition</span>
</div>
<script>
function setTheme(t,btn){
  document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('[data-theme]').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
}
function mono(a){var L=document.documentElement.getAttribute('data-theme')==='light';return L?'rgba(0,0,0,'+a+')':'rgba(255,255,255,'+a+')';}

var transitions=[
  {name:'Scatter Burst',desc:'Explode outward from center'},
  {name:'Shockwave Ring',desc:'Concentric ring pulses outward'},
  {name:'Swirl Vortex',desc:'Particles spiral and tighten'},
  {name:'Gravity Drop',desc:'Everything falls, new rises from bottom'},
  {name:'Fountain Rise',desc:'Particles shoot up from bottom edge'},
  {name:'Crossfade Morph',desc:'Grid fades out as particles fade in'},
  {name:'Wind Sweep',desc:'Horizontal gust sweeps all particles right'},
  {name:'Shatter Rebuild',desc:'Grid breaks apart then snaps back reformed'},
  {name:'Kaleidoscope',desc:'4-way symmetric rotation from center'},
  {name:'Ripple Drop',desc:'Multiple raindrop ripples across surface'},
  {name:'Flash Pulse',desc:'Bright flash then settle into new pattern'},
  {name:'Tornado Column',desc:'Rotating column sweeps across the field'},
  {name:'Bubble Float',desc:'Large slow bubbles drift upward and pop'},
  {name:'Dissolve Reappear',desc:'Everything dissolves then re-crystallizes'},
  {name:'Elastic Snap',desc:'Grid stretches then snaps back with overshoot'},
  {name:'Sand Fall',desc:'Particles cascade like sand in an hourglass'},
  {name:'Disperse Converge',desc:'Scatter to edges then rush back to center'},
  {name:'Wave Roll',desc:'A rolling wave sweeps top to bottom'},
  {name:'Fractal Bloom',desc:'Branching tendrils grow outward from center'},
  {name:'Static Surge',desc:'Noise spike scrambles everything, then calm'}
];

var grid=document.getElementById('grid');
var instances=[];

transitions.forEach(function(t,i){
  var useGrid=i%2===0;
  var card=document.createElement('div');
  card.className='bg-card';
  card.innerHTML='<canvas></canvas><div class="hint">click to trigger</div><div class="info"><span class="name">#'+(i+1)+' · '+t.name+'</span><span class="num">'+(useGrid?'grid':'particles')+'</span></div>';
  card.addEventListener('click',function(){instances[i].trigger();});
  grid.appendChild(card);
  var canvas=card.querySelector('canvas');
  var ctx=canvas.getContext('2d');

  function resize(){
    var rect=canvas.parentElement.getBoundingClientRect();
    var w=rect.width,h=180,dpr=window.devicePixelRatio||1;
    canvas.width=w*dpr;canvas.height=h*dpr;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);
    return {w:w,h:h};
  }
  var dims=resize();

  var S={
    useGrid:useGrid,W:dims.w,H:dims.h,
    points:[],spacing:20,phase:0,amplitude:0,targetAmp:3.5,
    particles:[],pCount:60,
    transId:-1,transStart:0,transDur:1200,
    burst:0,swirl:0,sweep:0,sX:0,sY:0,scale:1,noise:0,
    flash:0,ripples:[],tornadoX:0,bubbles:[],waveY:0,
    dissolveAlpha:1,fAngle:0,fLen:0
  };

  // Init dot grid
  var cols=Math.floor(dims.w/S.spacing),rows=Math.floor(dims.h/S.spacing);
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)S.points.push({bx:c*S.spacing+S.spacing/2,by:r*S.spacing+S.spacing/2,x:0,y:0});
  // Init particles
  for(var pi=0;pi<S.pCount;pi++)S.particles.push({x:Math.random()*dims.w,y:Math.random()*dims.h,vx:(Math.random()-.5)*0.4,vy:-0.15-Math.random()*0.4,size:1+Math.random()*2.5,life:1});

  function trigger(){
    S.transStart=performance.now();S.transId=i;
    S.burst=0;S.swirl=0;S.sweep=0;S.sX=0;S.sY=0;S.scale=1;S.noise=0;S.flash=0;
    S.ripples=[];S.tornadoX=0;S.bubbles=[];S.waveY=0;S.dissolveAlpha=1;S.fAngle=0;S.fLen=0;
    if(i===0){S.burst=1;S.sX=(Math.random()-.5)*dims.w*.4;S.sY=(Math.random()-.5)*dims.h*.3;}
    if(i===1){S.ripples=[{x:dims.w/2,y:dims.h/2,r:0,life:1}];}
    if(i===2){S.swirl=1;}
    if(i===3){S.sY=dims.h*1.5;}
    if(i===4){S.sY=-dims.h*1.2;S.burst=0.5;}
    if(i===5){S.dissolveAlpha=0;S.amplitude=15;}
    if(i===6){S.sweep=1;}
    if(i===7){S.amplitude=20;S.noise=1;}
    if(i===8){S.swirl=0.6;S.scale=1.4;}
    if(i===9){for(var rp=0;rp<5;rp++)S.ripples.push({x:Math.random()*dims.w,y:Math.random()*dims.h,r:0,life:1});}
    if(i===10){S.flash=1;S.burst=0.6;}
    if(i===11){S.tornadoX=dims.w/2;S.swirl=0.8;}
    if(i===12){for(var bp=0;bp<15;bp++)S.bubbles.push({x:Math.random()*dims.w,y:dims.h+10+Math.random()*60,r:8+Math.random()*25,vy:-0.3-Math.random()*0.8,life:1});}
    if(i===13){S.dissolveAlpha=0;S.noise=0.8;}
    if(i===14){S.amplitude=30;}
    if(i===15){S.sY=dims.h*2;S.burst=0.3;}
    if(i===16){S.burst=-1;}
    if(i===17){S.waveY=-40;}
    if(i===18){S.fLen=dims.w*0.4;}
    if(i===19){S.noise=1.5;S.flash=0.4;}
  }

  function draw(now){
    var W=S.W,H=S.H;
    var t=(now-S.transStart),p=S.transId>=0?Math.min(1,t/S.transDur):0;
    var eo=1-Math.pow(1-p,3);
    S.amplitude+=(S.targetAmp-S.amplitude)*0.04;
    if(S.transId>=0&&p>=1){S.transId=-1;S.targetAmp=3.5;S.dissolveAlpha=1;S.flash=0;S.noise=0;S.swirl=0;S.sweep=0;S.scale=1;S.burst=0;}

    // Update per transition
    if(S.transId===0){S.burst=Math.max(0,1-p*1.3);S.sX*=(1-p*.02);S.sY*=(1-p*.02);}
    if(S.transId===1){S.ripples.forEach(function(r){r.r+=2.5;r.life-=.008;});S.ripples=S.ripples.filter(function(r){return r.life>0;});}
    if(S.transId===2){S.swirl=Math.max(0,1-p*1.2);}
    if(S.transId===3){S.sY=dims.h*1.5*(1-eo);}
    if(S.transId===4){S.sY=-dims.h*1.2*(1-eo);S.burst=0.5*(1-eo);}
    if(S.transId===5){S.dissolveAlpha=p;S.amplitude=15*(1-p)+3.5*p;}
    if(S.transId===6){S.sweep=1-eo;}
    if(S.transId===7){S.amplitude=3.5+16.5*(1-(p<.5?2*p*p:-1+(4-2*p)*p));S.noise=1-eo;}
    if(S.transId===8){S.swirl=0.6*(1-eo);S.scale=1+0.4*(1-eo);}
    if(S.transId===9){S.ripples.forEach(function(r){r.r+=1.8;r.life-=.006;});S.ripples=S.ripples.filter(function(r){return r.life>0;});}
    if(S.transId===10){S.flash=Math.max(0,1-p*1.5);S.burst=0.6*(1-eo);}
    if(S.transId===11){S.tornadoX=dims.w/2+Math.sin(now*.003)*dims.w*.35*(1-eo);S.swirl=0.8*(1-eo);}
    if(S.transId===12){S.bubbles.forEach(function(b){b.y+=b.vy;b.life-=.003;});S.bubbles=S.bubbles.filter(function(b){return b.life>0&&b.y>-60;});}
    if(S.transId===13){S.dissolveAlpha=p<.5?1-p*2:(p-.5)*2;S.noise=0.8*(1-Math.abs(p-.5)*2);}
    if(S.transId===14){var ep2=Math.sin(p*Math.PI*2.5)*(1-p);S.amplitude=3.5+ep2*18;}
    if(S.transId===15){S.sY=dims.h*2*(1-eo);}
    if(S.transId===16){S.burst=p<.5?-p*2:(p-.5)*2;S.scale=1+Math.abs(S.burst)*.3;}
    if(S.transId===17){S.waveY=-40+80*eo;}
    if(S.transId===18){S.fLen=dims.w*0.4*(1-eo);S.fAngle=now*.0008;}
    if(S.transId===19){S.noise=1.5*(1-eo);S.flash=0.4*(1-eo);}

    ctx.clearRect(0,0,W,H);

    if(S.useGrid){
      for(var pi2=0;pi2<S.points.length;pi2++){
        var p2=S.points[pi2];
        var wa=S.amplitude*(1+S.burst*0.5);
        var wv=Math.sin(p2.bx*0.018+now*0.0008+p2.by*0.012+S.phase)*wa;
        var wv2=Math.cos(p2.by*0.014+now*0.0006+S.phase*0.7)*wa*0.6;
        var dx=0,dy=0;
        if(S.swirl>0){var scx=p2.bx-W/2,scy=p2.by-H/2,sd=Math.sqrt(scx*scx+scy*scy);var sa=Math.atan2(scy,scx)+sd*0.003*S.swirl;dx=Math.cos(sa)*sd*0.08*S.swirl-scx*0.04;dy=Math.sin(sa)*sd*0.08*S.swirl-scy*0.04;}
        if(S.sweep>0)dx+=S.sweep*W*.6*(1-p2.by/H);
        if(Math.abs(S.sX)>0.1||Math.abs(S.sY)>0.1){dx+=S.sX*(p2.by/H);dy+=S.sY*(p2.by/H);}
        if(S.scale!==1){dx+=(p2.bx-W/2)*(S.scale-1);dy+=(p2.by-H/2)*(S.scale-1);}
        if(S.noise>0){dx+=(Math.random()-.5)*S.noise*20;dy+=(Math.random()-.5)*S.noise*20;}
        S.ripples.forEach(function(r){var rd=Math.sqrt((p2.bx-r.x)*(p2.bx-r.x)+(p2.by-r.y)*(p2.by-r.y));if(rd<r.r+15&&rd>r.r-15){var push=(rd-r.r)*.5;dx+=push*Math.cos(Math.atan2(p2.by-r.y,p2.bx-r.x));dy+=push*Math.sin(Math.atan2(p2.by-r.y,p2.bx-r.x));}});
        if(Math.abs(S.tornadoX)>1){dx+=Math.sin((p2.bx-S.tornadoX)*0.02+now*.004)*25*S.swirl;}
        if(S.waveY!==0)dy+=Math.sin(p2.bx*0.02+S.waveY*.05)*S.waveY*.4;
        if(S.fLen>0){var fcx=p2.bx-W/2,fcy=p2.by-H/2,fd=Math.sqrt(fcx*fcx+fcy*fcy),fa2=Math.atan2(fcy,fcx)+S.fAngle,fi=Math.sin(fd*0.04-S.fLen*0.02);dx+=Math.cos(fa2)*fi*S.fLen*.15;dy+=Math.sin(fa2)*fi*S.fLen*.15;}
        p2.x=p2.bx+wv+dx;p2.y=p2.by+wv2+dy;
        var al=S.dissolveAlpha;if(S.flash>0)al=Math.min(1,al+S.flash*(Math.random()*.5));
        var dst=Math.abs(wv+dx)+Math.abs(wv2+dy);
        ctx.fillStyle=mono(al*(dst>3?.22:.1));
        ctx.beginPath();ctx.arc(p2.x,p2.y,dst>3?2.5:1.8,0,Math.PI*2);ctx.fill();
      }
    }

    if(!S.useGrid){
      for(var pj=0;pj<S.particles.length;pj++){
        var pt=S.particles[pj];
        pt.x+=pt.vx+S.sweep*(1-pt.y/H)*2+S.sX*.01;
        pt.y+=pt.vy+S.sY*.01;
        if(S.swirl>0){var sx=pt.x-W/2,sy=pt.y-H/2,sd2=Math.sqrt(sx*sx+sy*sy),sa2=Math.atan2(sy,sx)+sd2*0.002*S.swirl;pt.x+=Math.cos(sa2)*sd2*0.02*S.swirl;pt.y+=Math.sin(sa2)*sd2*0.02*S.swirl;}
        if(S.burst>0){var bx=pt.x-W/2,by=pt.y-H/2,bd2=Math.sqrt(bx*bx+by*by)||1;pt.x+=bx/bd2*S.burst*4;pt.y+=by/bd2*S.burst*4;}
        if(S.burst<0){pt.x-=(pt.x-W/2)*.03*(-S.burst);pt.y-=(pt.y-H/2)*.03*(-S.burst);}
        if(S.noise>0){pt.x+=(Math.random()-.5)*S.noise*8;pt.y+=(Math.random()-.5)*S.noise*8;}
        if(Math.abs(S.tornadoX)>1)pt.x+=Math.sin((pt.x-S.tornadoX)*.03+now*.005)*18*S.swirl;
        if(S.waveY!==0)pt.y+=Math.sin(pt.x*0.02+S.waveY*.04)*S.waveY*.3;
        if(pt.y<-15){pt.y=H+15;pt.x=Math.random()*W;}if(pt.y>H+15){pt.y=-15;pt.x=Math.random()*W;}if(pt.x<-15)pt.x=W+15;if(pt.x>W+15)pt.x=-15;
        var pa=S.dissolveAlpha*(pt.life||1);if(S.flash>0)pa=Math.min(1,pa+S.flash*Math.random()*.6);
        ctx.fillStyle=mono(pa*(.15+S.flash*.3));
        ctx.beginPath();ctx.arc(pt.x,pt.y,pt.size+(S.burst>0?S.burst*5:0),0,Math.PI*2);ctx.fill();
      }
      for(var bk=0;bk<S.bubbles.length;bk++){
        var b=S.bubbles[bk];
        ctx.strokeStyle=mono(b.life*.15);ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
      }
    }
  }

  var inst={canvas:canvas,ctx:ctx,S:S,draw:draw,trigger:trigger,resize:resize};
  instances.push(inst);
});

function loop(ts){
  instances.forEach(function(inst){
    var dpr=window.devicePixelRatio||1,w=inst.canvas.width/dpr,h=inst.canvas.height/dpr;
    inst.ctx.save();inst.ctx.setTransform(1,0,0,1,0,0);inst.ctx.scale(dpr,dpr);
    inst.draw(ts);inst.ctx.restore();
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function triggerAll(){instances.forEach(function(inst,i){setTimeout(function(){inst.trigger();},i*80);});}
function resetAll(){location.reload();}

window.addEventListener('resize',function(){
  instances.forEach(function(inst){
    var rect=inst.canvas.parentElement.getBoundingClientRect();
    var w=rect.width,h=180,dpr=window.devicePixelRatio||1;
    inst.canvas.width=w*dpr;inst.canvas.height=h*dpr;
    inst.canvas.style.width=w+'px';inst.canvas.style.height=h+'px';
    inst.ctx.setTransform(1,0,0,1,0,0);inst.ctx.scale(dpr,dpr);
    inst.S.W=w;inst.S.H=h;
  });
});
</script>
</body>
</html>
