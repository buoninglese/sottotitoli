<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Index BG · Slide Background Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--card:#12121a;--line:#1e1e2a;--text:#e8eaed;--t2:#8b93a5;--t3:#4e5566;--accent:#a78bfa}
[data-theme="light"]{--bg:#f5f5f7;--card:#fff;--line:#e5e7eb;--text:#111827;--t2:#6b7280;--t3:#9ca3af;--accent:#7c3aed}

body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:24px}
h1{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:-.5px;margin-bottom:4px}
h1 em{color:var(--accent);font-style:normal}
.sub{font-size:13px;color:var(--t2);margin-bottom:24px}
.top-row{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.top-row button{padding:8px 18px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.top-row button:hover{border-color:var(--accent);color:var(--accent)}
.top-row button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.top-row .sep{color:var(--t3);font-size:10px;margin:0 2px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:1300px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}

.bg-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:all .3s;position:relative}
.bg-card:hover{border-color:rgba(167,139,250,.2);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.bg-card canvas{display:block;width:100%;height:260px}
.bg-card .info{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.bg-card .info h4{font-size:12px;font-weight:700}
.bg-card .info .tag{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);padding:2px 8px;border-radius:100px;background:rgba(167,139,250,.1)}
.bg-card .info .btns{display:flex;gap:4px}
.bg-card .info button{font-size:9px;padding:4px 10px;border-radius:100px;border:1px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .12s}
.bg-card .info button:hover{border-color:var(--accent);color:var(--accent)}
.bg-card .info button.playing{background:var(--accent);color:#fff;border-color:var(--accent)}

.legend{display:flex;gap:18px;justify-content:center;margin-top:24px;font-size:10px;color:var(--t3);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend .dot{width:8px;height:8px;border-radius:50%}
.legend .dot.rest{background:var(--t3)}
.legend .dot.trans{background:var(--accent)}

.back{display:inline-block;margin-bottom:18px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:500}
.back:hover{text-decoration:underline}
</style>
</head>
<body>
<a href="index.html" class="back">← Back to Index</a>
<h1>Slide <em>Backgrounds</em></h1>
<p class="sub">Monochrome canvas concepts for index hero slides. Each card shows rest state (idle) and can transition on command. Click "Next Slide →" to trigger a morph.</p>

<div class="top-row">
  <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-right:4px">Theme:</span>
  <button class="active" data-theme="dark" onclick="setTheme('dark',this)">🌙 Dark</button>
  <button data-theme="light" onclick="setTheme('light',this)">☀️ Light</button>
  <span class="sep">|</span>
  <button onclick="triggerAll()">▶ Trigger All Transitions</button>
  <button onclick="resetAll()">↺ Reset All</button>
</div>

<div class="grid" id="grid"></div>

<div class="legend">
  <span><span class="dot rest"></span> Rest state</span>
  <span><span class="dot trans"></span> Transition triggered</span>
  <span>Each concept = one slide background idea</span>
</div>

<script>
// ═══ THEME ═══
function setTheme(t,btn){
  document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('[data-theme]').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
}

// ═══ CONCEPTS ═══
var concepts=[
  {
    id:'dots-grid',
    name:'Dot Grid · Breathing',
    tag:'geometric',
    desc:'Points on a grid gently shift in waves. On transition, the wave amplitude surges then settles into a new phase.',
    init:function(c,ctx,W,H){
      this.points=[];this.phase=0;this.targetPhase=0;this.amplitude=0;this.targetAmp=0;
      var spacing=22,cols=Math.floor(W/spacing),rows=Math.floor(H/spacing);
      for(var r=0;r<rows;r++)for(var co=0;co<cols;co++){
        this.points.push({x:co*spacing+spacing/2,y:r*spacing+spacing/2,bx:co*spacing+spacing/2,by:r*spacing+spacing/2});
      }
    },
    draw:function(c,ctx,W,H,t){
      // Smooth amplitude
      this.amplitude+=(this.targetAmp-this.amplitude)*0.04;
      this.phase+=(this.targetPhase-this.phase)*0.03;
      var isLight=document.documentElement.getAttribute('data-theme')==='light';
      var dotColor=isLight?'rgba(0,0,0,.12)':'rgba(255,255,255,.1)';
      var activeColor=isLight?'rgba(0,0,0,.25)':'rgba(255,255,255,.22)';
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<this.points.length;i++){
        var p=this.points[i];
        var wave=Math.sin(p.bx*0.015+t*0.001+p.by*0.01+this.phase)*this.amplitude;
        var wave2=Math.cos(p.by*0.012+t*0.0008+this.phase*0.7)*this.amplitude*0.6;
        p.x=p.bx+wave;
        p.y=p.by+wave2;
        var dist=Math.abs(wave)+Math.abs(wave2);
        ctx.fillStyle=dist>2?activeColor:dotColor;
        ctx.beginPath();ctx.arc(p.x,p.y,dist>2?2.5:1.8,0,Math.PI*2);ctx.fill();
      }
    },
    trigger:function(){this.targetAmp=14;this.targetPhase=this.targetPhase+Math.PI*0.7;setTimeout(function(self){self.targetAmp=3.5;},800,this);}
  },
  {
    id:'flow-lines',
    name:'Flow Lines · Stream',
    tag:'organic',
    desc:'Horizontal flowing lines like gentle water. Transition sweeps a diagonal wave through the field.',
    init:function(c,ctx,W,H){
      this.lines=[];this.sweep=0;this.targetSweep=0;
      for(var i=0;i<40;i++){
        this.lines.push({y:Math.random()*H,amp:15+Math.random()*30,freq:0.003+Math.random()*0.006,speed:0.3+Math.random()*0.7,phase:Math.random()*Math.PI*2});
      }
    },
    draw:function(c,ctx,W,H,t){
      this.sweep+=(this.targetSweep-this.sweep)*0.06;
      var isLight=document.documentElement.getAttribute('data-theme')==='light';
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<this.lines.length;i++){
        var l=this.lines[i];
        ctx.strokeStyle=isLight?'rgba(0,0,0,.06)':'rgba(255,255,255,.05)';
        ctx.lineWidth=1;
        ctx.beginPath();
        for(var x=0;x<W;x+=4){
          var sweepWave=Math.sin(x*0.004+t*0.0005)*this.sweep*12;
          var y=l.y+Math.sin(x*l.freq+t*l.speed*0.001+l.phase)*l.amp+sweepWave;
          if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
    },
    trigger:function(){this.targetSweep=1;setTimeout(function(self){self.targetSweep=0;},900,this);}
  },
  {
    id:'particles-rise',
    name:'Particles · Rising',
    tag:'atmospheric',
    desc:'Tiny particles drift upward like dust in light. Transition spawns a burst from the bottom that fades.',
    init:function(c,ctx,W,H){
      this.particles=[];this.burst=0;
      for(var i=0;i<80;i++){
        this.particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*0.3,vy:-0.2-Math.random()*0.5,size:1+Math.random()*2,opacity:0.15+Math.random()*0.25});
      }
    },
    draw:function(c,ctx,W,H,t){
      this.burst*=0.97;
      var isLight=document.documentElement.getAttribute('data-theme')==='light';
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<this.particles.length;i++){
        var p=this.particles[i];
        p.x+=p.vx;p.y+=p.vy;
        if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
        if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
        var alpha=p.opacity+this.burst*0.3;
        ctx.fillStyle=isLight?'rgba(0,0,0,'+alpha+')':'rgba(255,255,255,'+alpha+')';
        ctx.beginPath();ctx.arc(p.x,p.y,p.size+this.burst*3,0,Math.PI*2);ctx.fill();
      }
    },
    trigger:function(){this.burst=1;setTimeout(function(self){self.burst=0;},600,this);}
  },
  {
    id:'rings-expand',
    name:'Rings · Expanding',
    tag:'geometric',
    desc:'Concentric rings gently pulse outward. Transition sends a strong ring wave from center.',
    init:function(c,ctx,W,H){
      this.rings=[{r:0,opacity:1}];this.baseR=40;this.pulse=0;this.targetPulse=0;
    },
    draw:function(c,ctx,W,H,t){
      this.pulse+=(this.targetPulse-this.pulse)*0.05;
      var isLight=document.documentElement.getAttribute('data-theme')==='light';
      ctx.clearRect(0,0,W,H);
      var cx=W/2,cy=H/2;
      // Spawn new rings
      if(this.rings.length<6&&(this.rings.length===0||this.rings[this.rings.length-1].r>this.baseR)){
        this.rings.push({r:0,opacity:0.5});
      }
      for(var i=this.rings.length-1;i>=0;i--){
        var r=this.rings[i];
        r.r+=0.35+this.pulse*1.5;
        r.opacity-=0.0015;
        if(r.opacity<=0||r.r>Math.max(W,H)*1.2){this.rings.splice(i,1);continue;}
        ctx.strokeStyle=isLight?'rgba(0,0,0,'+(r.opacity*0.6)+')':'rgba(255,255,255,'+(r.opacity*0.5)+')';
        ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(cx,cy,r.r,0,Math.PI*2);ctx.stroke();
      }
    },
    trigger:function(){this.targetPulse=8;setTimeout(function(self){self.targetPulse=0;},700,this);}
  },
  {
    id:'hex-morph',
    name:'Hex Grid · Morph',
    tag:'geometric',
    desc:'Hexagonal lattice with subtle vertex displacement. Transition shifts the displacement pattern.',
    init:function(c,ctx,W,H){
      this.cells=[];this.shiftX=0;this.shiftY=0;this.targetSX=0;this.targetSY=0;
      var size=28,rowH=size*Math.sqrt(3);
      for(var row=-1;row<H/rowH+1;row++){
        for(var col=-1;col<W/(size*1.5)+1;col++){
          var cx=(col*size*1.5)+(row%2===0?0:size*0.75);
          var cy=row*rowH*0.5;
          if(cx>-size&&cx<W+size&&cy>-size&&cy<H+size){
            this.cells.push({cx:cx,cy:cy,size:size});
          }
        }
      }
    },
    draw:function(c,ctx,W,H,t){
      this.shiftX+=(this.targetSX-this.shiftX)*0.04;
      this.shiftY+=(this.targetSY-this.shiftY)*0.04;
      var isLight=document.documentElement.getAttribute('data-theme')==='light';
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle=isLight?'rgba(0,0,0,.1)':'rgba(255,255,255,.08)';
      ctx.lineWidth=1;
      var size=28;
      for(var i=0;i<this.cells.length;i++){
        var cell=this.cells[i];
        var dx=Math.sin(cell.cy*0.02+t*0.0006+this.shiftX)*4;
        var dy=Math.cos(cell.cx*0.02+t*0.0007+this.shiftY)*3;
        var cx=cell.cx+dx,cy=cell.cy+dy;
        ctx.beginPath();
        for(var j=0;j<6;j++){
          var angle=Math.PI/3*j-Math.PI/6;
          var vx=cx+size*0.5*Math.cos(angle);
          var vy=cy+size*0.5*Math.sin(angle);
          if(j===0)ctx.moveTo(vx,vy);else ctx.lineTo(vx,vy);
        }
        ctx.closePath();ctx.stroke();
      }
    },
    trigger:function(){this.targetSX=Math.random()*8-4;this.targetSY=Math.random()*8-4;setTimeout(function(self){self.targetSX=0;self.targetSY=0;},1200,this);}
  },
  {
    id:'noise-grain',
    name:'Noise · Organic Grain',
    tag:'texture',
    desc:'Fine noise grain with slow large-scale drift. Transition increases grain density momentarily.',
    init:function(c,ctx,W,H){
      this.grain=1;this.targetGrain=1;this.offscreen=document.createElement('canvas');
      this.offscreen.width=W;this.offscreen.height=H;
      this.ctx2=this.offscreen.getContext('2d');
      this.frame=0;
    },
    draw:function(c,ctx,W,H,t){
      this.grain+=(this.targetGrain-this.grain)*0.08;
      this.frame++;
      if(this.frame%3!==0){return;} // only redraw every 3rd frame for perf
      var isLight=document.documentElement.getAttribute('data-theme')==='light';
      var imageData=ctx.createImageData(W,H);
      var data=imageData.data;
      for(var i=0;i<data.length;i+=4){
        var noise=(Math.random()-.5)*this.grain*35;
        var bx=((i/4)%W)/W*Math.PI*2+t*0.0003;
        var by=Math.floor((i/4)/W)/H*Math.PI*2+t*0.0004;
        var wave=Math.sin(bx)*Math.cos(by)*8;
        var v=isLight?245+noise+wave:10+noise+wave;
        v=Math.max(0,Math.min(255,v));
        data[i]=v;data[i+1]=v;data[i+2]=v;data[i+3]=255;
      }
      ctx.putImageData(imageData,0,0);
    },
    trigger:function(){this.targetGrain=3;setTimeout(function(self){self.targetGrain=1;},500,this);}
  },
  {
    id:'voronoi-cells',
    name:'Voronoi · Cells',
    tag:'organic',
    desc:'Cell-like voronoi tessellation slowly breathing. Transition shifts all seed points.',
    init:function(c,ctx,W,H){
      this.seeds=[];this.shift=0;this.targetShift=0;
      for(var i=0;i<24;i++){this.seeds.push({x:Math.random()*W,y:Math.random()*H,sx:0,sy:0});}
    },
    draw:function(c,ctx,W,H,t){
      this.shift+=(this.targetShift-this.shift)*0.04;
      var isLight=document.documentElement.getAttribute('data-theme')==='light';
      ctx.clearRect(0,0,W,H);
      var pxStep=3;
      for(var px=0;px<W;px+=pxStep){
        for(var py=0;py<H;py+=pxStep){
          var minDist=Infinity,minDist2=Infinity;
          for(var i=0;i<this.seeds.length;i++){
            var s=this.seeds[i];
            var sx=s.x+Math.sin(t*0.0004+s.y*0.01)*4+this.shift*10*Math.cos(s.y*0.03);
            var sy=s.y+Math.cos(t*0.0005+s.x*0.01)*3+this.shift*8*Math.sin(s.x*0.03);
            var dx=px-sx,dy=py-sy,dist=dx*dx+dy*dy;
            if(dist<minDist){minDist2=minDist;minDist=dist;}
            else if(dist<minDist2){minDist2=dist;}
          }
          var edge=Math.sqrt(minDist2)-Math.sqrt(minDist);
          var alpha=Math.max(0,Math.min(1,(edge-2)/4))*0.12;
          if(alpha>0.005){
            ctx.fillStyle=isLight?'rgba(0,0,0,'+alpha+')':'rgba(255,255,255,'+alpha+')';
            ctx.fillRect(px,py,pxStep,pxStep);
          }
        }
      }
    },
    trigger:function(){this.targetShift=1;setTimeout(function(self){self.targetShift=0;},1000,this);}
  },
  {
    id:'waves-interfere',
    name:'Waves · Interference',
    tag:'dynamic',
    desc:'Two circular wave sources create interference patterns. Transition moves the sources apart then back.',
    init:function(c,ctx,W,H){
      this.s1x=W*0.35;this.s1y=H*0.5;this.s2x=W*0.65;this.s2y=H*0.5;
      this.sep=0;this.targetSep=0;
    },
    draw:function(c,ctx,W,H,t){
      this.sep+=(this.targetSep-this.sep)*0.05;
      var isLight=document.documentElement.getAttribute('data-theme')==='light';
      ctx.clearRect(0,0,W,H);
      var cx1=this.s1x-this.sep*0.5,cy1=this.s1y;
      var cx2=this.s2x+this.sep*0.5,cy2=this.s2y;
      var pxStep=3;
      for(var px=0;px<W;px+=pxStep){
        for(var py=0;py<H;py+=pxStep){
          var d1=Math.sqrt((px-cx1)*(px-cx1)+(py-cy1)*(py-cy1));
          var d2=Math.sqrt((px-cx2)*(px-cx2)+(py-cy2)*(py-cy2));
          var interference=Math.sin(d1*0.04+t*0.003)*Math.cos(d2*0.04-t*0.002);
          var alpha=(interference+1)*0.04;
          if(alpha>0.005){
            ctx.fillStyle=isLight?'rgba(0,0,0,'+alpha+')':'rgba(255,255,255,'+alpha+')';
            ctx.fillRect(px,py,pxStep,pxStep);
          }
        }
      }
    },
    trigger:function(){this.targetSep=60;setTimeout(function(self){self.targetSep=0;},900,this);}
  }
];

// ═══ BUILD ═══
var grid=document.getElementById('grid');
var instances=[];

concepts.forEach(function(concept,i){
  var card=document.createElement('div');
  card.className='bg-card';
  card.innerHTML='<canvas></canvas><div class="info"><div><h4>#'+(i+1)+' · '+concept.name+'</h4><div style="font-size:10px;color:var(--t3);margin-top:1px">'+concept.desc+'</div></div><div class="btns"><span class="tag">'+concept.tag+'</span><button onclick="instances['+i+'].trigger()">Next Slide →</button></div></div>';
  grid.appendChild(card);

  var canvas=card.querySelector('canvas');
  var ctx=canvas.getContext('2d');

  function resize(){
    var rect=canvas.parentElement.getBoundingClientRect();
    var w=rect.width;
    var h=260;
    var dpr=window.devicePixelRatio||1;
    canvas.width=w*dpr;canvas.height=h*dpr;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr,dpr);
    return {w:w,h:h};
  }

  var dims=resize();
  concept.init(canvas,ctx,dims.w,dims.h);

  var inst={canvas:canvas,ctx:ctx,concept:concept,trigger:function(){concept.trigger();}};
  instances.push(inst);
});

// ═══ ANIMATION LOOP ═══
var startTime=performance.now();
function loop(ts){
  var elapsed=ts-startTime;
  instances.forEach(function(inst){
    var canvas=inst.canvas;
    var ctx=inst.ctx;
    var dpr=window.devicePixelRatio||1;
    var w=canvas.width/dpr;
    var h=canvas.height/dpr;
    ctx.save();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(dpr,dpr);
    inst.concept.draw(canvas,ctx,w,h,elapsed);
    ctx.restore();
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ═══ GLOBAL CONTROLS ═══
function triggerAll(){instances.forEach(function(inst,i){setTimeout(function(){inst.trigger();},i*120);});}
function resetAll(){location.reload();}

// ═══ RESIZE ═══
window.addEventListener('resize',function(){
  instances.forEach(function(inst){
    var canvas=inst.canvas;
    var rect=canvas.parentElement.getBoundingClientRect();
    var w=rect.width,h=260;
    var dpr=window.devicePixelRatio||1;
    canvas.width=w*dpr;canvas.height=h*dpr;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    inst.ctx.setTransform(1,0,0,1,0,0);
    inst.ctx.scale(dpr,dpr);
  });
});
</script>
</body>
</html>
