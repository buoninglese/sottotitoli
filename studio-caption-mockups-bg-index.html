<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Index BG · 27 Colored Transitions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--card:#12121a;--line:#1e1e2a;--text:#e8eaed;--t2:#8b93a5;--t3:#4e5566;--accent:#a78bfa}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;padding:24px}
h1{font-size:clamp(22px,4vw,32px);font-weight:900;letter-spacing:-.5px;margin-bottom:2px}
h1 em{background:linear-gradient(90deg,#a78bfa,#60a5fa,#34d399,#fbbf24,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-style:normal}
.sub{font-size:13px;color:var(--t2);margin-bottom:20px}
.top-row{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.top-row button{padding:8px 16px;border-radius:100px;font-size:11px;font-weight:600;border:1.5px solid var(--line);background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.top-row button:hover{border-color:var(--accent);color:var(--accent)}
.top-row button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1500px}
@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
.bg-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:all .35s;position:relative;cursor:pointer}
.bg-card:hover{border-color:rgba(167,139,250,.35);box-shadow:0 8px 32px rgba(0,0,0,.4);transform:translateY(-2px)}
.bg-card canvas{display:block;width:100%;height:190px}
.bg-card .info{padding:9px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.bg-card .info .name{font-size:11px;font-weight:700;color:var(--text)}
.bg-card .info .num{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);padding:2px 7px;border-radius:100px;background:rgba(167,139,250,.1)}
.bg-card .hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:8px;color:rgba(255,255,255,.25);pointer-events:none;text-transform:uppercase;letter-spacing:.1em;transition:opacity .3s}
.bg-card:hover .hint{opacity:0}
.back{display:inline-block;margin-bottom:18px;color:var(--accent);text-decoration:none;font-size:13px;font-weight:500}
.back:hover{text-decoration:underline}
</style>
</head>
<body>
<a href="index.html" class="back">← Back to Index</a>
<h1>Colored <em>Transitions</em></h1>
<p class="sub">27 slide background transitions with colored particles. Click any card. Hover for glow.</p>
<div class="top-row">
  <button onclick="triggerAll()">▶ Trigger All (staggered)</button>
  <button onclick="resetAll()">↺ Reset All</button>
</div>
<div class="grid" id="grid"></div>
<script>
// ═══ COLOR UTILS ═══
function hsl(h,s,l,a){return 'hsla('+h+','+s+'%,'+l+'%,'+a+')';}
function hueFor(p){return (p*37+180)%360;} // golden ratio hue spread

var transitions=[
  // --- KEPT (enhanced with color) ---
  {name:'Gravity Drop',hue:200},
  {name:'Kaleidoscope',hue:280},
  {name:'Tornado Column',hue:40},
  {name:'Dissolve Reappear',hue:160},
  {name:'Sand Fall',hue:30},
  {name:'Fractal Bloom',hue:320},
  {name:'Static Surge',hue:260},
  // --- NEW 20 ---
  {name:'Nebula Drift',hue:250},
  {name:'Firefly Swarm',hue:55},
  {name:'Aurora Curtain',hue:170},
  {name:'Ember Storm',hue:15},
  {name:'Crystal Shards',hue:200},
  {name:'Lava Lamp',hue:350},
  {name:'Rainfall',hue:210},
  {name:'Constellation',hue:280},
  {name:'Plasma Arc',hue:180},
  {name:'Petal Drift',hue:330},
  {name:'Spark Cascade',hue:45},
  {name:'Galaxy Spin',hue:260},
  {name:'Prism Refract',hue:0},
  {name:'Bioluminescence',hue:140},
  {name:'Stardust Trail',hue:290},
  {name:'Ink Bloom',hue:220},
  {name:'Voltage Surge',hue:60},
  {name:'Confetti Burst',hue:10},
  {name:'Northern Lights',hue:160}
];

var grid=document.getElementById('grid');
var instances=[];

transitions.forEach(function(t,i){
  var useGrid=i%2===0;
  var card=document.createElement('div');
  card.className='bg-card';
  card.innerHTML='<canvas></canvas><div class="hint">click to trigger</div><div class="info"><span class="name">#'+(i+1)+' \u00b7 '+t.name+'</span><span class="num">'+(useGrid?'grid':'particles')+'</span></div>';
  card.addEventListener('click',function(){instances[i].trigger();});
  grid.appendChild(card);
  var canvas=card.querySelector('canvas');
  var ctx=canvas.getContext('2d');

  function resize(){
    var rect=canvas.parentElement.getBoundingClientRect();
    var w=rect.width,h=190,dpr=window.devicePixelRatio||1;
    canvas.width=w*dpr;canvas.height=h*dpr;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);
    return {w:w,h:h};
  }
  var dims=resize();

  var S={
    useGrid:useGrid,W:dims.w,H:dims.h,hue:t.hue,
    points:[],spacing:22,phase:0,amplitude:0,targetAmp:3,
    particles:[],pCount:70,
    transId:-1,transStart:0,transDur:1400,
    burst:0,swirl:0,sweep:0,sX:0,sY:0,scale:1,noise:0,
    flash:0,ripples:[],tornadoX:0,bubbles:[],waveY:0,trails:[],
    dissolveAlpha:1,fAngle:0,fLen:0,extra:0
  };

  var cols=Math.floor(dims.w/S.spacing),rows=Math.floor(dims.h/S.spacing);
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)S.points.push({bx:c*S.spacing+S.spacing/2,by:r*S.spacing+S.spacing/2,x:0,y:0});
  for(var pi=0;pi<S.pCount;pi++)S.particles.push({x:Math.random()*dims.w,y:Math.random()*dims.h,vx:(Math.random()-.5)*0.3,vy:-0.1-Math.random()*0.5,size:1.5+Math.random()*3,life:1,hueOffset:Math.random()*60-30});

  function particleColor(pt,alpha,hue){
    var h=(hue+pt.hueOffset+360)%360;
    return hsl(h,70,65+pt.size*3,alpha);
  }

  function trigger(){
    S.transStart=performance.now();S.transId=i;
    S.burst=0;S.swirl=0;S.sweep=0;S.sX=0;S.sY=0;S.scale=1;S.noise=0;S.flash=0;
    S.ripples=[];S.tornadoX=0;S.bubbles=[];S.waveY=0;S.trails=[];S.dissolveAlpha=1;S.fAngle=0;S.fLen=0;S.extra=0;

    // KEPT transitions
    if(i===0){S.sY=dims.h*1.8;S.burst=0.4;} // Gravity Drop
    if(i===1){S.swirl=0.7;S.scale=1.5;S.burst=0.3;} // Kaleidoscope
    if(i===2){S.tornadoX=dims.w/2;S.swirl=1;S.burst=0.4;} // Tornado
    if(i===3){S.dissolveAlpha=0;S.noise=1;} // Dissolve
    if(i===4){S.sY=dims.h*2.5;S.burst=0.5;S.noise=0.3;} // Sand Fall
    if(i===5){S.fLen=dims.w*0.5;S.burst=0.3;S.swirl=0.3;} // Fractal
    if(i===6){S.noise=2;S.flash=0.6;S.burst=0.4;} // Static
    // NEW transitions
    if(i===7){S.burst=0.6;S.swirl=0.2;S.scale=1.2;S.extra=1;} // Nebula
    if(i===8){S.burst=-0.3;S.flash=0.5;S.noise=0.4;S.extra=2;} // Firefly
    if(i===9){S.waveY=-60;S.sweep=0.3;S.extra=3;} // Aurora
    if(i===10){S.burst=1.2;S.flash=0.7;S.noise=0.6;S.sY=-dims.h*.3;} // Ember
    if(i===11){S.burst=0.8;S.swirl=0.5;S.scale=0.7;S.extra=4;} // Crystal
    if(i===12){S.bubbles=[];for(var bp=0;bp<20;bp++)S.bubbles.push({x:Math.random()*dims.w,y:dims.h+Math.random()*80,r:15+Math.random()*30,vy:-0.2-Math.random()*1,life:1,hue:(S.hue+bp*18)%360});S.extra=5;} // Lava
    if(i===13){S.sY=dims.h*3;S.burst=0.2;S.noise=0.2;S.extra=6;} // Rainfall
    if(i===14){S.burst=-0.5;S.swirl=0.3;S.scale=0.8;S.extra=7;} // Constellation
    if(i===15){S.swirl=1.2;S.burst=0.5;S.flash=0.4;S.extra=8;} // Plasma
    if(i===16){S.sweep=0.5;S.burst=0.3;S.waveY=30;S.extra=9;} // Petal
    if(i===17){S.burst=1;S.sY=-dims.h*.5;S.flash=0.5;S.extra=10;} // Spark
    if(i===18){S.swirl=0.8;S.scale=1.3;S.burst=-0.2;S.extra=11;} // Galaxy
    if(i===19){S.burst=0.7;S.flash=0.6;S.noise=0.5;S.extra=12;} // Prism
    if(i===20){S.bubbles=[];for(var bp2=0;bp2<25;bp2++)S.bubbles.push({x:Math.random()*dims.w,y:Math.random()*dims.h,r:6+Math.random()*18,vy:-0.1-Math.random()*0.4,vx:(Math.random()-.5)*0.3,life:1,hue:(S.hue+bp2*14)%360});S.extra=13;} // Bioluminescence
    if(i===21){S.sweep=0.4;S.burst=0.5;S.flash=0.3;S.extra=14;} // Stardust
    if(i===22){S.burst=0.6;S.fLen=dims.w*0.3;S.swirl=0.4;S.extra=15;} // Ink
    if(i===23){S.noise=1.5;S.flash=0.8;S.burst=0.5;S.extra=16;} // Voltage
    if(i===24){S.burst=1.5;S.sY=-dims.h*.8;S.sX=(Math.random()-.5)*dims.w*.3;S.flash=0.6;S.extra=17;} // Confetti
    if(i===25){S.waveY=-80;S.swirl=0.2;S.sweep=0.3;S.extra=18;} // Northern Lights
    if(i===26){S.burst=0.4;S.swirl=0.6;S.flash=0.3;S.noise=0.3;S.extra=19;} // bonus
  }

  function draw(now){
    var W=S.W,H=S.H;
    var t=(now-S.transStart),p=S.transId>=0?Math.min(1,t/S.transDur):0;
    var eo=1-Math.pow(1-p,3);
    S.amplitude+=(S.targetAmp-S.amplitude)*0.04;

    if(S.transId>=0&&p>=0.98){S.transId=-1;S.targetAmp=3;S.dissolveAlpha=1;S.flash=0;S.noise=0;S.swirl=0;S.sweep=0;S.scale=1;S.burst=0;S.extra=0;}

    // Update per transition
    if(S.transId===0){S.sY=dims.h*1.8*(1-eo);S.burst=0.4*(1-eo);}
    if(S.transId===1){S.swirl=0.7*(1-eo);S.scale=1+0.5*(1-eo);S.burst=0.3*(1-eo);}
    if(S.transId===2){S.tornadoX=dims.w/2+Math.sin(now*.004)*dims.w*.4*(1-eo);S.swirl=1-eo;S.burst=0.4*(1-eo);}
    if(S.transId===3){S.dissolveAlpha=p<.5?1-p*2:(p-.5)*2;S.noise=1*(1-Math.abs(p-.5)*2);}
    if(S.transId===4){S.sY=dims.h*2.5*(1-eo);S.burst=0.5*(1-eo);}
    if(S.transId===5){S.fLen=dims.w*0.5*(1-eo);S.fAngle=now*.001;S.burst=0.3*(1-eo);S.swirl=0.3*(1-eo);}
    if(S.transId===6){S.noise=2*(1-eo);S.flash=0.6*(1-eo);S.burst=0.4*(1-eo);}
    // NEW
    if(S.transId===7){S.burst=0.6*(1-eo);S.swirl=0.2*eo;S.scale=1+0.2*eo;}
    if(S.transId===8){S.burst=-0.3*(1-eo);S.flash=0.5*(1-eo);S.noise=0.4*(1-eo);}
    if(S.transId===9){S.waveY=-60+120*eo;S.sweep=0.3*(1-eo);}
    if(S.transId===10){S.burst=1.2*(1-eo);S.flash=0.7*(1-eo);S.noise=0.6*(1-eo);S.sY=-dims.h*.3*(1-eo);}
    if(S.transId===11){S.burst=0.8*(1-eo);S.swirl=0.5*eo;S.scale=0.7+0.3*eo;}
    if(S.transId===12){S.bubbles.forEach(function(b){b.y+=b.vy;b.x+=b.vx||0;b.life-=.002;});S.bubbles=S.bubbles.filter(function(b){return b.life>0&&b.y>-100;});}
    if(S.transId===13){S.sY=dims.h*3*(1-eo);S.burst=0.2*(1-eo);}
    if(S.transId===14){S.burst=-0.5*(1-eo);S.swirl=0.3*eo;S.scale=0.8+0.2*eo;}
    if(S.transId===15){S.swirl=1.2*(1-eo);S.burst=0.5*(1-eo);S.flash=0.4*(1-eo);}
    if(S.transId===16){S.sweep=0.5*(1-eo);S.burst=0.3*(1-eo);S.waveY=30-60*eo;}
    if(S.transId===17){S.burst=1*(1-eo);S.sY=-dims.h*.5*(1-eo);S.flash=0.5*(1-eo);}
    if(S.transId===18){S.swirl=0.8*(1-eo);S.scale=1+0.3*eo;S.burst=-0.2*eo;}
    if(S.transId===19){S.burst=0.7*(1-eo);S.flash=0.6*(1-eo);S.noise=0.5*(1-eo);}
    if(S.transId===20){S.bubbles.forEach(function(b){b.y+=b.vy;b.x+=b.vx;b.life-=.002;});S.bubbles=S.bubbles.filter(function(b){return b.life>0&&b.y>-60&&b.y<H+60;});}
    if(S.transId===21){S.sweep=0.4*(1-eo);S.burst=0.5*(1-eo);S.flash=0.3*(1-eo);}
    if(S.transId===22){S.burst=0.6*(1-eo);S.fLen=dims.w*0.3*eo;S.swirl=0.4*eo;}
    if(S.transId===23){S.noise=1.5*(1-eo);S.flash=0.8*(1-eo);S.burst=0.5*(1-eo);}
    if(S.transId===24){S.burst=1.5*(1-eo);S.sY=-dims.h*.8*(1-eo);S.flash=0.6*(1-eo);}
    if(S.transId===25){S.waveY=-80+160*eo;S.swirl=0.2*eo;S.sweep=0.3*(1-eo);}
    if(S.transId===26){S.burst=0.4*(1-eo);S.swirl=0.6*eo;S.flash=0.3*(1-eo);S.noise=0.3*eo;}

    ctx.clearRect(0,0,W,H);

    // ═══ RENDER DOT GRID ═══
    if(S.useGrid){
      for(var pi2=0;pi2<S.points.length;pi2++){
        var p2=S.points[pi2];
        var wa=S.amplitude*(1+S.burst*0.6);
        var wv=Math.sin(p2.bx*0.018+now*0.0008+p2.by*0.012+S.phase)*wa;
        var wv2=Math.cos(p2.by*0.014+now*0.0006+S.phase*0.7)*wa*0.6;
        var dx=0,dy=0;
        if(S.swirl>0){var scx=p2.bx-W/2,scy=p2.by-H/2,sd=Math.sqrt(scx*scx+scy*scy);var sa=Math.atan2(scy,scx)+sd*0.003*S.swirl;dx=Math.cos(sa)*sd*0.08*S.swirl-scx*0.04;dy=Math.sin(sa)*sd*0.08*S.swirl-scy*0.04;}
        if(S.sweep>0)dx+=S.sweep*W*.6*(1-p2.by/H);
        if(Math.abs(S.sX)>0.1||Math.abs(S.sY)>0.1){dx+=S.sX*(p2.by/H);dy+=S.sY*(p2.by/H);}
        if(S.scale!==1){dx+=(p2.bx-W/2)*(S.scale-1);dy+=(p2.by-H/2)*(S.scale-1);}
        if(S.noise>0){dx+=(Math.random()-.5)*S.noise*22;dy+=(Math.random()-.5)*S.noise*22;}
        if(S.tornadoX){dx+=Math.sin((p2.bx-S.tornadoX)*0.02+now*.004)*25*S.swirl;}
        if(S.waveY!==0)dy+=Math.sin(p2.bx*0.02+S.waveY*.05)*S.waveY*.4;
        if(S.fLen>0){var fcx=p2.bx-W/2,fcy=p2.by-H/2,fd=Math.sqrt(fcx*fcx+fcy*fcy),fa2=Math.atan2(fcy,fcx)+S.fAngle,fi=Math.sin(fd*0.04-S.fLen*0.02);dx+=Math.cos(fa2)*fi*S.fLen*.15;dy+=Math.sin(fa2)*fi*S.fLen*.15;}
        p2.x=p2.bx+wv+dx;p2.y=p2.by+wv2+dy;
        var dst=Math.abs(wv+dx)+Math.abs(wv2+dy);
        var dotHue=(S.hue+dst*3+now*.01)%360;
        var al=S.dissolveAlpha*(dst>4?.35:.15);
        if(S.flash>0)al=Math.min(1,al+S.flash*.4);
        ctx.fillStyle=hsl(dotHue,60,65+Math.min(dst,10)*2,al);
        ctx.beginPath();ctx.arc(p2.x,p2.y,dst>4?3:2,0,Math.PI*2);ctx.fill();
      }
    }

    // ═══ RENDER PARTICLES ═══
    if(!S.useGrid){
      // Trails
      if(S.extra&&S.burst>0.1&&Math.random()<.3){
        S.trails.push({x:W/2+(Math.random()-.5)*W*.3,y:H/2+(Math.random()-.5)*H*.3,life:1,hue:S.hue+Math.random()*60});
      }
      S.trails=S.trails.filter(function(tr){tr.life-=.015;return tr.life>0;});
      S.trails.forEach(function(tr){
        ctx.fillStyle=hsl(tr.hue,80,70,tr.life*.2);
        ctx.beginPath();ctx.arc(tr.x,tr.y,4+tr.life*8,0,Math.PI*2);ctx.fill();
      });

      for(var pj=0;pj<S.particles.length;pj++){
        var pt=S.particles[pj];
        pt.x+=pt.vx+S.sweep*(1-pt.y/H)*2.5+S.sX*.012;
        pt.y+=pt.vy+S.sY*.012;
        if(S.swirl>0){var sx=pt.x-W/2,sy=pt.y-H/2,sd2=Math.sqrt(sx*sx+sy*sy),sa2=Math.atan2(sy,sx)+sd2*0.002*S.swirl;pt.x+=Math.cos(sa2)*sd2*0.02*S.swirl;pt.y+=Math.sin(sa2)*sd2*0.02*S.swirl;}
        if(S.burst>0){var bx=pt.x-W/2,by=pt.y-H/2,bd2=Math.sqrt(bx*bx+by*by)||1;pt.x+=bx/bd2*S.burst*5;pt.y+=by/bd2*S.burst*5;}
        if(S.burst<0){pt.x-=(pt.x-W/2)*.04*(-S.burst);pt.y-=(pt.y-H/2)*.04*(-S.burst);}
        if(S.noise>0){pt.x+=(Math.random()-.5)*S.noise*10;pt.y+=(Math.random()-.5)*S.noise*10;}
        if(S.tornadoX)pt.x+=Math.sin((pt.x-S.tornadoX)*.03+now*.005)*18*S.swirl;
        if(S.waveY!==0)pt.y+=Math.sin(pt.x*0.02+S.waveY*.04)*S.waveY*.3;
        if(pt.y<-20){pt.y=H+20;pt.x=Math.random()*W;}if(pt.y>H+20){pt.y=-20;pt.x=Math.random()*W;}if(pt.x<-20)pt.x=W+20;if(pt.x>W+20)pt.x=-20;
        var pa=S.dissolveAlpha*(pt.life||1);if(S.flash>0)pa=Math.min(1,pa+S.flash*.5);
        var sz=pt.size+(S.burst>0?S.burst*6:0);
        ctx.fillStyle=particleColor(pt,pa*(.2+S.flash*.35),S.hue);
        ctx.shadowColor=S.flash>0.3?particleColor(pt,.5,S.hue):'transparent';
        ctx.shadowBlur=S.flash>0.3?8:0;
        ctx.beginPath();ctx.arc(pt.x,pt.y,sz,0,Math.PI*2);ctx.fill();
        ctx.shadowBlur=0;
      }
      // Bubbles
      for(var bk=0;bk<S.bubbles.length;bk++){
        var b=S.bubbles[bk];
        ctx.strokeStyle=hsl(b.hue||S.hue,70,65,b.life*.4);
        ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();
        if(b.life>.5){ctx.fillStyle=hsl(b.hue||S.hue,60,70,b.life*.08);ctx.fill();}
      }
    }
  }

  var inst={canvas:canvas,ctx:ctx,S:S,draw:draw,trigger:trigger,resize:resize};
  instances.push(inst);
});

function loop(ts){
  instances.forEach(function(inst){
    var dpr=window.devicePixelRatio||1,w=inst.canvas.width/dpr,h=inst.canvas.height/dpr;
    inst.ctx.save();inst.ctx.setTransform(1,0,0,1,0,0);inst.ctx.scale(dpr,dpr);
    inst.draw(ts);inst.ctx.restore();
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function triggerAll(){instances.forEach(function(inst,i){setTimeout(function(){inst.trigger();},i*70);});}
function resetAll(){location.reload();}

window.addEventListener('resize',function(){
  instances.forEach(function(inst){
    var rect=inst.canvas.parentElement.getBoundingClientRect();
    var w=rect.width,h=190,dpr=window.devicePixelRatio||1;
    inst.canvas.width=w*dpr;inst.canvas.height=h*dpr;
    inst.canvas.style.width=w+'px';inst.canvas.style.height=h+'px';
    inst.ctx.setTransform(1,0,0,1,0,0);inst.ctx.scale(dpr,dpr);
    inst.S.W=w;inst.S.H=h;
  });
});
</script>
