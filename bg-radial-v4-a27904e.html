<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Thick Punchy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh;position:relative;transition:background .5s}
body.light{background:#fafaf8;color:#1a1a1a}
body.dark{background:#060610;color:#e8eaed}
#bgLayer{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .6s}
#bgLayer.on{opacity:1}
body.light #bgLayer.on{opacity:.88}
.bg-canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:10px;padding:40px}
#ui h1{font-size:clamp(24px,5vw,48px);font-weight:900;letter-spacing:-1.5px;transition:color .5s}
#ui p{font-size:12px;opacity:.5;max-width:440px;text-align:center;line-height:1.6}
.var-label{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.35;margin-top:2px}
.meter-row{display:flex;align-items:center;gap:8px}
.meter-bar{width:100px;height:2px;border-radius:1px;overflow:hidden}
body.light .meter-bar{background:rgba(0,0,0,.06)}
body.dark .meter-bar{background:rgba(255,255,255,.06)}
.meter-fill{height:100%;border-radius:1px;transition:width .1s;width:0%}
body.light .meter-fill{background:#5b7fc1}
body.dark .meter-fill{background:linear-gradient(90deg,#34d399,#a78bfa)}
.meter-label{font-family:'JetBrains Mono',monospace;font-size:8px;opacity:.3;min-width:40px}
.sens-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.sens-row label{font-size:8px;opacity:.3;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.sens-slider{-webkit-appearance:none;appearance:none;width:80px;height:3px;border-radius:2px;outline:none;cursor:pointer}
body.light .sens-slider{background:rgba(0,0,0,.08)}
body.dark .sens-slider{background:rgba(255,255,255,.08)}
.sens-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;cursor:pointer;border:1.5px solid}
body.light .sens-slider::-webkit-slider-thumb{background:#fff;border-color:#c5c0b8}
body.dark .sens-slider::-webkit-slider-thumb{background:#1a1a2e;border-color:rgba(255,255,255,.2)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{padding:9px 16px;border-radius:100px;border:1.5px solid;font-family:'Inter',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:all .2s}
body.light .btn{background:#fff;color:#666;border-color:#d9d5cc}
body.light .btn:hover{background:#f5f3ef;color:#1a1a1a;border-color:#c5c0b8}
body.dark .btn{background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.08)}
body.dark .btn:hover{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.15)}
.btn.on{background:rgba(52,211,153,.1)!important;border-color:rgba(52,211,153,.25)!important;color:#34d399!important}
.btn.mic-on{background:rgba(239,68,68,.15)!important;border-color:rgba(239,68,68,.3)!important;color:#ef4444!important;animation:micPulse 1.5s ease infinite}
.btn.var-nav{width:28px;height:28px;border-radius:50%;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
</style>
</head>
<body class="dark">
<div id="bgLayer" class="on">
  <canvas class="bg-canvas" id="canvasMain"></canvas>
</div>
<div id="ui">
  <h1 id="titleText">Thick Punchy</h1>
  <p id="descText">3.5px heavy · instant response · high contrast</p>
  <div class="meter-row">
    <span class="meter-label" id="meterLabel">— dB</span>
    <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
  </div>
  <div class="sens-row">
    <label for="sensSlider">sens</label>
    <input type="range" class="sens-slider" id="sensSlider" min="0.1" max="20" step="0.1" value="1" oninput="updateSensitivity(this.value)">
    <span class="meter-label" id="sensLabel">1.0x</span>
  </div>
  <!-- Behavior Sliders -->
  <div class="sens-row" style="margin-top:4px">
    <label style="font-size:9px;opacity:.5;min-width:36px">🕐 Decay</label>
    <input type="range" class="sens-slider" id="fxDecaySlider" min="0.5" max="0.995" step="0.005" value="0.90" oninput="setFXDecay(this.value)" style="width:60px">
    <span class="meter-label" id="fxDecayVal">0.90</span>
  </div>
  <div class="sens-row">
    <label style="font-size:9px;opacity:.5;min-width:36px">📈 Power</label>
    <input type="range" class="sens-slider" id="fxPowerSlider" min="0.2" max="3" step="0.1" value="2.5" oninput="setFXPower(this.value)" style="width:60px">
    <span class="meter-label" id="fxPowerVal">2.5</span>
  </div>
  <div class="sens-row">
    <label style="font-size:9px;opacity:.5;min-width:36px">🌊 Floor</label>
    <input type="range" class="sens-slider" id="fxFloorSlider" min="0.02" max="0.4" step="0.01" value="0.25" oninput="setFXFloor(this.value)" style="width:60px">
    <span class="meter-label" id="fxFloorVal">0.25</span>
  </div>
  <!-- Zoom -->
  <div class="sens-row" style="margin-top:6px">
    <label style="font-size:9px;opacity:.5;min-width:36px">🔍 Zoom</label>
    <input type="range" class="sens-slider" id="fxZoomSlider" min="0.5" max="1.6" step="0.05" value="1" oninput="setFXZoom(this.value)" style="width:60px">
    <span class="meter-label" id="fxZoomVal">1×</span>
  </div>
  <!-- Voice Range Indicator -->
  <div class="sens-row" style="margin-top:2px">
    <label style="font-size:8px;opacity:.25;min-width:36px">voice</label>
    <div style="display:flex;gap:2px;width:60px;height:4px;border-radius:2px;overflow:hidden">
      <div id="voiceBassBar" style="flex:1;background:rgba(239,68,68,.3);transition:opacity .3s"></div>
      <div id="voiceMidBar" style="flex:3;background:rgba(251,191,36,.3);transition:opacity .3s"></div>
      <div id="voiceTrebBar" style="flex:2;background:rgba(96,165,250,.3);transition:opacity .3s"></div>
    </div>
    <span class="meter-label" id="voiceLabel" style="font-size:7px;opacity:.25">—</span>
  </div>
  <!-- Particle Controls -->
  <div class="btn-row" style="margin-top:2px">
    <div style="background:rgba(15,18,30,.85);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center">
      <span style="font-size:9px;opacity:.4">● Dots</span>
      <span style="font-size:8px;opacity:.3">size</span>
      <input type="range" id="ptclSize" min="0.3" max="5" step="0.1" value="3" oninput="setPtclSize(this.value)" style="width:40px;height:3px">
      <span id="ptclSizeVal" style="font-size:8px;opacity:.3">3×</span>
      <select id="ptclShape" onchange="setPtclShape(this.value)" style="font-size:9px;padding:2px 4px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:inherit;font-family:inherit;cursor:pointer">
        <option value="circle">● circle</option>
        <option value="square">■ square</option>
        <option value="diamond">◆ diamond</option>
        <option value="star">★ star</option>
      </select>
      <select id="ptclBehavior" onchange="setPtclBehavior(this.value)" style="font-size:9px;padding:2px 4px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:inherit;font-family:inherit;cursor:pointer">
        <option value="static">static</option>
        <option value="pulse">pulse</option>
        <option value="trail">trail</option>
        <option value="spark">spark</option>
      </select>
    </div>
  </div>
  <!-- Flow Behavior (for Flow Field mode) -->
  <div class="btn-row" style="margin-top:2px" id="flowBehaviorRow">
    <div style="background:rgba(15,18,30,.85);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center">
      <span style="font-size:9px;opacity:.4">🌊 Flow</span>
      <select id="flowBehavSel" onchange="setFlowBehavior(this.value)" style="font-size:9px;padding:2px 4px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:inherit;font-family:inherit;cursor:pointer">
        <option value="flow">flow</option><option value="vortex">vortex</option><option value="rise">rise</option><option value="explode">explode</option><option value="orbit">orbit</option><option value="grid">grid</option><option value="swarm">swarm</option><option value="rain">rain</option><option value="pulse">pulse</option><option value="chaos">chaos</option>
      </select>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn" id="btnMic" onclick="toggleMic()">🎤 Start Mic</button>
    <button class="btn" id="btnFile" onclick="openAudioFile()">📄 Open Audio</button>
    <input type="file" id="audioFileInput" accept="audio/*" style="display:none" onchange="loadAudioFile(this.files[0])">
    <button class="btn" id="btnDark" onclick="setTheme('dark')">🌙 Dark</button>
    <button class="btn on" id="btnLight" onclick="setTheme('light')">☀️ Light</button>
  </div>
  <!-- Audio Player bar (hidden until file loaded) -->
  <div class="btn-row" id="audioPlayerRow" style="display:none;margin-top:2px">
    <div style="background:rgba(15,18,30,.85);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center">
      <span style="font-size:9px;opacity:.4">🎵</span>
      <span id="audioTrackName" style="font-size:9px;opacity:.6;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span>
      <button class="btn" id="btnAudioPlay" onclick="toggleAudioPlayback()" style="font-size:9px;padding:4px 8px">▶ Play</button>
      <button class="btn" id="btnAudioStop" onclick="stopAudioFile()" style="font-size:9px;padding:4px 6px">⏹</button>
      <input type="range" id="audioSeek" min="0" max="100" value="0" oninput="seekAudio(this.value)" style="width:40px;height:3px;cursor:pointer">
      <span id="audioTime" style="font-size:8px;opacity:.3;min-width:32px">0:00</span>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn var-nav" onclick="prevMode()" title="Previous mode">←</button>
    <span class="var-label" id="modeName">Thick Punchy</span>
    <button class="btn var-nav" onclick="nextMode()" title="Next mode">→</button>
  </div>
  <div id="configDisplay" style="font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.2);text-align:center;max-width:600px;line-height:1.8;word-break:break-all;padding:4px 8px;cursor:pointer;user-select:all" onclick="copyConfig()" title="Click to copy">—</div>
</div>
<script>
// ─── Audio ───
var audioCtx=null,analyser=null,micStream=null,micOn=false,fileOn=false,audioPlaying=false;
var audioSource=null,audioBuffer=null,audioStartTime=0,audioPauseOffset=0,audioSeekInterval=null;
var freqData=null,volume=0,smoothing=0,sensitivity=1.0;
var voiceBass=0,voiceMid=0,voiceTreble=0,voiceCentroid=0,voiceHue=0,voiceWidth=1;
var canvas,ctx,W,H,t=0,animFrame=null,currentMode=0;

// ─── Behavior Sliders ───
var fx={decay:0.90, power:2.5, floor:0.25, zoom:1};
// ─── Particle Settings ───
var ptcl={size:3, shape:'circle', behavior:'static'};
var flowBehavior='flow'; // flow field particle behavior
function setFXDecay(val){
  fx.decay=parseFloat(val);
  if(analyser)analyser.smoothingTimeConstant=fx.decay;
  document.getElementById('fxDecayVal').textContent=fx.decay.toFixed(3);
  updateConfigDisplay();
}
function setFXPower(val){
  fx.power=parseFloat(val);
  document.getElementById('fxPowerVal').textContent=fx.power.toFixed(1);
  updateConfigDisplay();
}
function setFXFloor(val){
  fx.floor=parseFloat(val);
  document.getElementById('fxFloorVal').textContent=fx.floor.toFixed(2);
  updateConfigDisplay();
}
function setFXZoom(val){
  fx.zoom=parseFloat(val);
  document.getElementById('fxZoomVal').textContent=fx.zoom.toFixed(2)+'×';
  updateConfigDisplay();
}
function setPtclSize(val){
  ptcl.size=parseFloat(val);
  document.getElementById('ptclSizeVal').textContent=ptcl.size.toFixed(1)+'×';
}
function setPtclShape(val){ptcl.shape=val}
function setPtclBehavior(val){ptcl.behavior=val}
function setFlowBehavior(val){flowBehavior=val}

function updateSensitivity(val){
  sensitivity=parseFloat(val);
  document.getElementById('sensLabel').textContent=sensitivity.toFixed(1)+'x';
  updateConfigDisplay();
}

function initAudio(){
  if(audioCtx)return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=512;
  analyser.smoothingTimeConstant=fx.decay;
  freqData=new Uint8Array(analyser.frequencyBinCount);
}

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W;canvas.height=H;
  if(flowParticles)initFlowParticles();
}

function stopAllAudio(){
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}
  if(audioSource){try{audioSource.stop()}catch(e){};audioSource=null}
  if(audioSeekInterval){clearInterval(audioSeekInterval);audioSeekInterval=null}
  micOn=false;fileOn=false;audioPlaying=false;
  audioPauseOffset=0;audioStartTime=0;
  document.getElementById('audioPlayerRow').style.display='none';
  document.getElementById('btnMic').textContent='🎤 Start Mic';
  document.getElementById('btnMic').classList.remove('mic-on');
  var btnF=document.getElementById('btnFile');if(btnF){btnF.textContent='📄 Open Audio';btnF.classList.remove('mic-on')}
}
function toggleMic(){
  if(micOn||fileOn){stopAllAudio();return}
  stopAllAudio();
  initAudio();
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(s){
    micStream=s;var src=audioCtx.createMediaStreamSource(s);src.connect(analyser);
    micOn=true;document.getElementById('btnMic').textContent='⏹ Stop Mic';
    document.getElementById('btnMic').classList.add('mic-on');
    document.getElementById('bgLayer').classList.add('on');
    if(!animFrame)animate();
  }).catch(function(){startDemoMode()});
}

// ── Audio File Playback ──
function openAudioFile(){
  if(fileOn){stopAllAudio();return}
  document.getElementById('audioFileInput').click();
}
function loadAudioFile(file){
  if(!file)return;
  stopAllAudio();initAudio();
  var btnF=document.getElementById('btnFile');btnF.textContent='⏳ Loading…';btnF.classList.add('mic-on');
  var reader=new FileReader();
  reader.onload=function(e){
    audioCtx.decodeAudioData(e.target.result,function(buffer){
      audioBuffer=buffer;
      var row=document.getElementById('audioPlayerRow');row.style.display='flex';
      document.getElementById('audioTrackName').textContent=file.name;
      document.getElementById('audioSeek').max=buffer.duration;
      document.getElementById('audioSeek').value=0;
      audioPauseOffset=0;
      btnF.textContent='✅ Loaded';btnF.classList.add('mic-on');
      setTimeout(function(){btnF.textContent='📄 Open Audio';btnF.classList.remove('mic-on')},1500);
      startAudioPlayback();
    },function(err){alert('Could not decode. Try .mp3 or .wav');console.error(err);btnF.textContent='📄 Open Audio';btnF.classList.remove('mic-on')});
  };
  reader.readAsArrayBuffer(file);
}
function startAudioPlayback(){
  if(!audioBuffer)return;
  if(audioSource){try{audioSource.stop()}catch(e){}}
  audioSource=audioCtx.createBufferSource();
  audioSource.buffer=audioBuffer;
  audioSource.loop=true;
  audioSource.connect(analyser);
  audioSource.connect(audioCtx.destination);
  audioSource.start(0,audioPauseOffset);
  audioStartTime=audioCtx.currentTime-audioPauseOffset;
  audioPlaying=true;fileOn=true;micOn=true;
  document.getElementById('btnAudioPlay').textContent='⏸ Pause';
  document.getElementById('btnAudioPlay').classList.add('mic-on');
  document.getElementById('bgLayer').classList.add('on');
  if(audioSeekInterval)clearInterval(audioSeekInterval);
  audioSeekInterval=setInterval(updateAudioSeek,250);
  if(!animFrame)animate();
}
function toggleAudioPlayback(){if(audioPlaying){pauseAudio();}else{resumeAudio();}}
function pauseAudio(){
  if(!audioSource||!audioPlaying)return;
  audioPauseOffset=audioCtx.currentTime-audioStartTime;
  try{audioSource.stop()}catch(e){};audioSource=null;audioPlaying=false;
  document.getElementById('btnAudioPlay').textContent='▶ Play';
  document.getElementById('btnAudioPlay').classList.remove('mic-on');
  if(audioSeekInterval){clearInterval(audioSeekInterval);audioSeekInterval=null}
}
function resumeAudio(){if(!audioBuffer)return;startAudioPlayback();}
function stopAudioFile(){stopAllAudio();audioBuffer=null;document.getElementById('audioPlayerRow').style.display='none';}
function seekAudio(val){audioPauseOffset=parseFloat(val);if(audioPlaying){try{audioSource.stop()}catch(e){};audioSource=null;startAudioPlayback();}else{document.getElementById('audioSeek').value=audioPauseOffset;updateAudioTimeDisplay(audioPauseOffset)}}
function updateAudioSeek(){if(!audioPlaying||!audioSource)return;var pos=audioCtx.currentTime-audioStartTime;var dur=audioBuffer.duration;if(pos>=dur){audioStartTime=audioCtx.currentTime-(pos%dur);pos=pos%dur}document.getElementById('audioSeek').value=pos;updateAudioTimeDisplay(pos)}
function updateAudioTimeDisplay(sec){var m=Math.floor(sec/60),s=Math.floor(sec%60);document.getElementById('audioTime').textContent=m+':'+(s<10?'0':'')+s}

function startDemoMode(){
  micOn=true;document.getElementById('btnMic').textContent='🎤 Demo Mic';
  document.getElementById('btnMic').classList.add('mic-on');
  document.getElementById('bgLayer').classList.add('on');
  if(!animFrame)animate();
}

function readAudio(){
  if(!analyser)return;
  analyser.getByteFrequencyData(freqData);
  var sum=0;for(var i=0;i<freqData.length;i++)sum+=freqData[i];
  volume=Math.min(1,sum/freqData.length/200*sensitivity);
  var d=fx.decay;
  smoothing=smoothing*d+volume*(1-d);
  // ── Voice analysis: bass/mid/treble bands + spectral centroid ──
  var len=freqData.length,bassEnd=Math.floor(len*0.05),midEnd=Math.floor(len*0.4);
  var bSum=0,mSum=0,tSum=0,wSum=0,wTotal=0;
  for(var i=0;i<len;i++){
    var val=freqData[i];
    wSum+=val*i;wTotal+=val;
    if(i<bassEnd)bSum+=val;
    else if(i<midEnd)mSum+=val;
    else tSum+=val;
  }
  voiceBass=bSum/(bassEnd||1)/255;
  voiceMid=mSum/((midEnd-bassEnd)||1)/255;
  voiceTreble=tSum/((len-midEnd)||1)/255;
  voiceCentroid=wTotal>0?wSum/wTotal/len:0.5;
  // Map centroid (0=deep,1=bright) to hue shift and bar width
  voiceHue=voiceCentroid*180-90; // -90 (warm) to +90 (cool)
  voiceWidth=0.7+voiceCentroid*0.8; // 0.7 (thin for high voice) to 1.5 (thick for low voice)
}

// ─── Color helpers ───
function c(h,s,l,a){return'hsla('+h+','+s+'%,'+l+'%,'+a+')';}
function themeHue(dark){return dark?250:215;}
function themeSat(dark){return dark?65:55;}
function themeLum(dark,bright){return dark?(bright?78:65):(bright?42:35);}
function themeAlpha(dark,base){return dark?base:base*0.7;}

// ══════════════════════════════════════
// 7 VARIATIONS — 2 Thickness + 5 Direction
// ══════════════════════════════════════

var variations=[

  // ── Thick Punchy ──
  {
    name:'Thick Punchy', type:'radial',
    desc:'3.5px heavy · instant response · high contrast',
    p:{rings:2, bars:100, lineW:3.5, lwVol:4.0, smoothMul:0.35, ringGap:0.22, startR:0.25, glow:0.14, orbMul:0.14, dotR:4.0}
  }

];

// ─── Direction renderers (non-circular layouts) ───
function drawDirection(ctx,v,isDark,params,colorMul){
  colorMul=colorMul||1;
  var hue=themeHue(isDark),sat=themeSat(isDark)*colorMul;
  var prm=params.p;
  var sv=Math.pow(v,prm.smoothMul||1);
  var nBars=prm.bars||60;
  var brightLum=Math.min(95,themeLum(isDark,true)*colorMul);
  ctx.fillStyle=isDark?'rgba(6,6,20,1)':'rgba(250,250,248,1)';
  ctx.fillRect(0,0,W,H);
  var dir=prm.dir||'topdown';
  var gap=8*(prm.gapMul||0.8);
  var baseLw=prm.lineW||2,lwVol=prm.lwVol||4;

  for(var i=0;i<nBars;i++){
    var fi=0.15;
    if(freqData&&micOn){var fidx=Math.floor(i*freqData.length/nBars);fi=freqData[fidx%freqData.length]/255;}
    else{fi=0.1+Math.sin(i*0.5+t/1200)*0.3;}
    if(fi<0.03)continue;
    var sh=(hue+i*360/nBars)%360;
    var lw=baseLw+fi*(lwVol-baseLw)*sv;
    var barLen=fi*0.8;
    var alpha=themeAlpha(isDark,0.15+sv*0.5)*colorMul;

    if(dir==='topdown'){
      var y=i*(H/nBars)*prm.gapMul;
      var barW=W*barLen*0.7,x=(W-barW)/2;
      var g=ctx.createLinearGradient(x,y,x+barW,y);
      g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.3,c(sh,sat,brightLum,alpha));g.addColorStop(0.7,c(sh,sat,brightLum,alpha));g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.fillRect(x,y,barW,lw);
    }else if(dir==='leftright'){
      var x=i*(W/nBars)*prm.gapMul;
      var barH=H*barLen*0.6,y=(H-barH)/2;
      var g=ctx.createLinearGradient(x,y,x,y+barH);
      g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.3,c(sh,sat,brightLum,alpha));g.addColorStop(0.7,c(sh,sat,brightLum,alpha));g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.fillRect(x,y,lw,barH);
    }else if(dir==='corner'){
      var angle=(i/nBars)*Math.PI/2;
      var maxR=Math.sqrt(W*W+H*H),r0=maxR*0.1,r1=maxR*(0.1+barLen*0.7);
      ctx.save();ctx.translate(W,H);ctx.rotate(-Math.PI/2+angle);
      var g=ctx.createLinearGradient(0,r0,0,r1);
      g.addColorStop(0,c(sh,sat,brightLum,alpha*0.1));g.addColorStop(0.5,c(sh,sat,brightLum,alpha));g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.fillRect(-lw/2,r0,lw,r1-r0);
      ctx.restore();
    }else if(dir==='spiral'){
      var turns=3,spR=Math.min(W,H)*0.05;
      var a=(i/nBars)*Math.PI*2*turns;
      var r=spR+(i/nBars)*Math.min(W,H)*0.45;
      var sx=W/2+Math.cos(a+t/15000)*r,sy=H/2+Math.sin(a+t/15000)*r;
      var tang=a+Math.PI/2;
      ctx.save();ctx.translate(sx,sy);ctx.rotate(tang);
      var sl=fi*Math.min(W,H)*0.15+10;
      var sg=ctx.createLinearGradient(0,0,0,sl);
      sg.addColorStop(0,c(sh,sat,brightLum,alpha));sg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=sg;ctx.fillRect(-lw/2,0,lw,sl);
      ctx.restore();
    }else if(dir==='columns'){
      var x=i*(W/nBars)*prm.gapMul+gap/2;
      var colW=(W/nBars)*prm.gapMul-gap;
      var colH=H*barLen*0.8;
      var g=ctx.createLinearGradient(x,H-colH,x,H);
      g.addColorStop(0,c(sh,sat,brightLum,alpha));g.addColorStop(0.6,c(sh,sat,brightLum,alpha*0.5));g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.fillRect(x,H-colH,colW,colH);
      if(fi>0.3){ctx.fillStyle=c(sh,80,brightLum,alpha*0.8);ctx.fillRect(x,H-colH,colW,Math.max(2,lw*0.5));}
    }
  }
  if(sv>0.1){
    var orbR=Math.min(W,H)*0.03+sv*Math.min(W,H)*0.02;
    var og=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,orbR*3);
    og.addColorStop(0,c(hue,60,brightLum,themeAlpha(isDark,0.6+sv*0.3)*colorMul));
    og.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=og;ctx.fillRect(W/2-orbR*3,H/2-orbR*3,orbR*6,orbR*6);
  }
}

// ─── Main render ───
function drawRadial(ctx,v,isDark,params,colorMul){
  colorMul=colorMul||1;
  // Route to direction renderer if not radial
  if(params.type==='direction'){drawDirection(ctx,v,isDark,params,colorMul);return;}

  var cx=W/2,cy=H/2,hue=themeHue(isDark)+voiceHue,sat=themeSat(isDark)*colorMul;
  var maxR=Math.min(W,H)*0.49*fx.zoom;
  var prm=params.p;
  var sv=Math.pow(v,prm.smoothMul||1);
  var nRings=prm.rings||3;

  // Space gradient
  var spaceGrad=ctx.createRadialGradient(cx,cy,maxR*0.1,cx,cy,maxR*1.3);
  spaceGrad.addColorStop(0,isDark?'rgba(6,6,20,0)':'rgba(250,250,248,0)');
  spaceGrad.addColorStop(0.5,isDark?'rgba(6,6,20,0.12)':'rgba(250,250,248,0.08)');
  spaceGrad.addColorStop(1,isDark?'rgba(6,6,20,0.40)':'rgba(250,250,248,0.20)');
  ctx.fillStyle=spaceGrad;ctx.fillRect(0,0,W,H);

  // Outer ring guides
  ctx.beginPath();ctx.arc(cx,cy,maxR*0.92,0,Math.PI*2);
  ctx.strokeStyle=c(hue,sat,themeLum(isDark,true)*colorMul,themeAlpha(isDark,0.10)*colorMul);ctx.lineWidth=0.5;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,maxR*0.95,0,Math.PI*2);
  ctx.strokeStyle=c(hue+60,sat,themeLum(isDark,true)*colorMul,themeAlpha(isDark,0.06)*colorMul);ctx.lineWidth=1;ctx.stroke();

  for(var ring=0;ring<nRings;ring++){
    var ringR=maxR*(prm.startR+(ring*(prm.ringGap||0.2)));
    var sc=prm.bars-(ring*30);
    if(sc<20)sc=20;

    for(var i=0;i<sc;i++){
      var fi=0.15;
      if(freqData&&micOn){
        var fidx=Math.floor(i*freqData.length/sc);
        fi=freqData[fidx%freqData.length]/255;
      }else{
        fi=0.1+Math.sin(i*0.5+t/1200+ring)*0.3;
      }
      if(fi<0.04)continue;

      var angle=(i/sc)*Math.PI*2+t/15000*(ring+1)*0.5;
      var barLen=fi*maxR*0.55*(0.6+ring*0.2);

      var baseLw=prm.lineW*voiceWidth;
      if(prm.feather){
        baseLw=prm.lineW*voiceWidth+ring*(prm.lwVol*voiceWidth-prm.lineW*voiceWidth)/(nRings-1);
      }
      var lw=baseLw;
      if(prm.dynamicW){
        lw=prm.lineW*voiceWidth+fi*(prm.lwVol*voiceWidth-prm.lineW*voiceWidth);
      }
      lw+=sv*(prm.lwVol*voiceWidth-baseLw)*0.4;

      ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);

      var sg=ctx.createLinearGradient(0,ringR,0,ringR+barLen);
      var sh=(hue+i*2.5+ring*40)%360;
      var brightLum=Math.min(95,themeLum(isDark,true)*colorMul);
      sg.addColorStop(0,c(sh,sat,brightLum,themeAlpha(isDark,0.02)*colorMul));
      sg.addColorStop(0.4,c(sh,sat,brightLum,themeAlpha(isDark,0.30+sv*0.30)*colorMul));
      sg.addColorStop(1,c(sh,sat,brightLum,0));
      ctx.fillStyle=sg;
      ctx.fillRect(-lw/2,ringR,lw,barLen);

      if(fi>0.25&&prm.dotR>0){
        var dr=(prm.dotR+fi*1.5)*ptcl.size;
        var pulse=ptcl.behavior==='pulse'?0.7+0.3*Math.sin(t/400+angle*3):1;
        var spark=ptcl.behavior==='spark'?0.5+Math.random()*0.5:1;
        var trail=ptcl.behavior==='trail'?0.5+fi*0.5:1;
        var sizeMul=pulse*spark*trail*(0.7+sv*0.3);
        dr=Math.max(1,dr*sizeMul);
        ctx.beginPath();
        if(ptcl.shape==='square'){ctx.rect(-dr/2,-dr/2,dr,dr)}
        else if(ptcl.shape==='diamond'){ctx.moveTo(0,-dr);ctx.lineTo(dr,0);ctx.lineTo(0,dr);ctx.lineTo(-dr,0);ctx.closePath()}
        else if(ptcl.shape==='star'){for(var s=0;s<5;s++){var sa=s*Math.PI*2/5-Math.PI/2;var sr=s%2===0?dr:dr*0.4;var sx=sr*Math.cos(sa),sy=sr*Math.sin(sa);if(s===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy)}ctx.closePath()}
        else{ctx.arc(0,ringR+barLen-((ptcl.shape!=='circle')?dr*0.5:0),dr,0,Math.PI*2)}
        ctx.fillStyle=c(sh,80*colorMul,brightLum,themeAlpha(isDark,0.6+sv*0.3)*colorMul);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // ── Central orb ──
  var orbR=maxR*prm.orbMul+sv*maxR*0.04;
  var brightLumOrb=Math.min(95,themeLum(isDark,true)*colorMul);
  var og=ctx.createRadialGradient(cx,cy,0,cx,cy,orbR);
  og.addColorStop(0,c(hue,60*colorMul,brightLumOrb,themeAlpha(isDark,0.85+sv*0.15)*colorMul));
  og.addColorStop(0.5,c(hue,sat,brightLumOrb,themeAlpha(isDark,0.25)*colorMul));
  og.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=og;ctx.fillRect(cx-orbR,cy-orbR,orbR*2,orbR*2);

  var pr=orbR*1.5+sv*maxR*0.25*Math.sin(t/2500);
  ctx.beginPath();ctx.arc(cx,cy,pr,0,Math.PI*2);
  ctx.strokeStyle=c(hue,sat,brightLumOrb,themeAlpha(isDark,0.12+sv*0.08)*colorMul);
  ctx.lineWidth=0.6+sv*0.8;ctx.stroke();

  if(prm.glow>0&&sv>0.1){
    var glowR=orbR*2+sv*maxR*0.3;
    var gg=ctx.createRadialGradient(cx,cy,orbR*0.5,cx,cy,glowR);
    gg.addColorStop(0,c(hue,70*colorMul,brightLumOrb,themeAlpha(isDark,prm.glow*sv)*colorMul));
    gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gg;ctx.fillRect(cx-glowR,cy-glowR,glowR*2,glowR*2);
  }
}

// ══════════════════════════════════════
// MODE 1 — Plasma (organic lava blobs)
// ══════════════════════════════════════
var plasmaNodes=[];
function initPlasma(){plasmaNodes=[];for(var i=0;i<12;i++)plasmaNodes.push({x:Math.random()*W,y:Math.random()*H,r:30+Math.random()*60,vx:0,vy:0})}
function drawPlasma(ctx,v,isDark){
  if(!plasmaNodes.length)initPlasma();
  ctx.fillStyle=isDark?'rgba(6,6,20,0.2)':'rgba(250,250,248,0.18)';ctx.fillRect(0,0,W,H);
  var sv=Math.pow(v,0.5);
  for(var i=0;i<plasmaNodes.length;i++){
    var n=plasmaNodes[i];
    n.vx+=(Math.random()-0.5)*0.5;n.vy+=(Math.random()-0.5)*0.5;
    n.vx*=0.95;n.vy*=0.95;
    n.x+=n.vx*sv*2;n.y+=n.vy*sv*2;
    if(n.x<0)n.x=W;if(n.x>W)n.x=0;if(n.y<0)n.y=H;if(n.y>H)n.y=0;
    var hue=(voiceHue+t/50+i*30)%360;
    var r=n.r*(0.7+sv*0.6)*(0.8+voiceBass*1.5);
    var grad=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r);
    grad.addColorStop(0,c(hue,80,80,0.35+sv*0.3));
    grad.addColorStop(0.5,c(hue,60,60,0.15+sv*0.15));
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;ctx.fillRect(n.x-r,n.y-r,r*2,r*2);
  }
}
// ══════════════════════════════════════
// MODE 2 — Spiral Tunnel (rotating vortex)
// ══════════════════════════════════════
function drawSpiralTunnel(ctx,v,isDark){
  ctx.fillStyle=isDark?'rgba(6,6,20,0.25)':'rgba(250,250,248,0.2)';ctx.fillRect(0,0,W,H);
  var cx=W/2,cy=H/2,sv=Math.pow(v,0.5),maxR=Math.min(W,H)*0.55*fx.zoom;
  var rings=20,rotSpeed=t/3000*(0.5+sv*2)*(0.5+voiceBass*2);
  for(var r=0;r<rings;r++){
    var ringR=maxR*(0.1+(r/rings)*0.9);
    var hue=(t/40+r*15+voiceHue)%360;
    var segments=Math.floor(40+r*5);
    ctx.beginPath();
    for(var s=0;s<=segments;s++){
      var angle=(s/segments)*Math.PI*2+rotSpeed*(1+r*0.3)+Math.sin(t/1500+r)*0.3*sv;
      var rr=ringR+Math.sin(angle*6+t/800+r)*15*sv;
      var x=cx+Math.cos(angle)*rr,y=cy+Math.sin(angle)*rr;
      if(s===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=c(hue,70,75,0.15+sv*0.2*(1-r/rings));
    ctx.lineWidth=1+sv*2*(1-r/rings*0.5);ctx.stroke();
  }
}
// ══════════════════════════════════════
// MODE 3 — Waveform (raw audio signal scroll)
// ══════════════════════════════════════
function drawWaveform(ctx,v,isDark){
  ctx.fillStyle=isDark?'rgba(6,6,20,0.35)':'rgba(250,250,248,0.3)';ctx.fillRect(0,0,W,H);
  var sv=Math.pow(v,0.5);
  // Draw scrolling waveform from frequency data
  for(var row=0;row<5;row++){
    var y=H*(0.15+row*0.18);
    var hue=(t/40+row*50+voiceHue)%360;
    ctx.beginPath();
    for(var i=0;i<W;i+=2){
      var fidx=Math.floor((i/W)*freqData.length);
      var fi=freqData&&micOn?freqData[fidx%freqData.length]/255:0.1+Math.sin(i*0.02+t/800+row)*0.15;
      var waveY=y+Math.sin(i*0.03+t/600+row*1.5)*fi*H*0.12*fx.zoom;
      if(i===0)ctx.moveTo(i,waveY);else ctx.lineTo(i,waveY);
    }
    ctx.strokeStyle=c(hue,80,80,0.3+sv*0.4);
    ctx.lineWidth=1.2+sv*1.5;ctx.stroke();
    // Mirror
    ctx.beginPath();
    for(var i=0;i<W;i+=2){
      var fidx=Math.floor((i/W)*freqData.length);
      var fi=freqData&&micOn?freqData[fidx%freqData.length]/255:0.1+Math.sin(i*0.02+t/800+row)*0.15;
      var waveY=H-y+Math.sin(i*0.03+t/600+row*1.5)*fi*H*0.12*fx.zoom;
      if(i===0)ctx.moveTo(i,waveY);else ctx.lineTo(i,waveY);
    }
    ctx.strokeStyle=c(hue+30,60,75,0.2+sv*0.3);
    ctx.lineWidth=0.8+sv;ctx.stroke();
  }
}
// ══════════════════════════════════════
// MODE 4 — Geometric (spinning morph shapes)
// ══════════════════════════════════════
function drawGeometric(ctx,v,isDark){
  ctx.fillStyle=isDark?'rgba(6,6,20,0.3)':'rgba(250,250,248,0.25)';ctx.fillRect(0,0,W,H);
  var cx=W/2,cy=H/2,sv=Math.pow(v,0.5),maxR=Math.min(W,H)*0.4*fx.zoom;
  var shapes=5;
  for(var s=0;s<shapes;s++){
    var hue=(t/30+s*50+voiceHue)%360;
    var sides=Math.floor(3+sv*5+voiceBass*4);
    var rot=t/4000*(s+1)*0.5+sv*2;
    var r=maxR*(0.4+s*0.12);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
    ctx.beginPath();
    for(var i=0;i<=sides;i++){
      var angle=(i/sides)*Math.PI*2-Math.PI/2;
      var rr=r*(0.8+0.2*Math.sin(angle*3+t/600+s));
      var x=Math.cos(angle)*rr,y=Math.sin(angle)*rr;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=c(hue,75,80,0.2+sv*0.4*(1-s/shapes*0.5));
    ctx.lineWidth=1.5+sv*2;ctx.stroke();
    ctx.restore();
  }
}
// ══════════════════════════════════════
// MODE 5 — Starfield (hyperspace fly-through)
// ══════════════════════════════════════
var stars=[];
function initStars(){stars=[];for(var i=0;i<200;i++)stars.push({x:(Math.random()-0.5)*W*2,y:(Math.random()-0.5)*H*2,z:Math.random()*500+10})}
function drawStarfield(ctx,v,isDark){
  if(!stars.length)initStars();
  ctx.fillStyle=isDark?'rgba(6,6,20,0.25)':'rgba(250,250,248,0.2)';ctx.fillRect(0,0,W,H);
  var sv=Math.pow(v,0.5),cx=W/2,cy=H/2;
  var speed=2+sv*15+voiceBass*10;
  for(var i=0;i<stars.length;i++){
    var st=stars[i];
    st.z-=speed;
    if(st.z<1){st.x=(Math.random()-0.5)*W*2;st.y=(Math.random()-0.5)*H*2;st.z=500}
    var sx=cx+st.x/(st.z*0.01),sy=cy+st.y/(st.z*0.01);
    if(sx<0||sx>W||sy<0||sy>H)continue;
    var hue=(t/30+st.z*0.5+voiceHue)%360;
    var alpha=Math.min(1,(500-st.z)/500);
    var sz=Math.max(0.5,3*alpha*ptcl.size);
    ctx.beginPath();ctx.arc(sx,sy,sz,0,Math.PI*2);
    ctx.fillStyle=c(hue,60,90,alpha*0.7);ctx.fill();
    // Speed trail
    if(st.z<200&&sv>0.3){
      ctx.beginPath();ctx.moveTo(sx,sy);
      ctx.lineTo(sx-st.x*0.02,sy-st.y*0.02);
      ctx.strokeStyle=c(hue,80,95,alpha*0.3);ctx.lineWidth=sz*0.5;ctx.stroke();
    }
  }
}

// ══════════════════════════════════════
// MODE 3 — Flow Field (flowing particle waves, spectral ribbons)
// ══════════════════════════════════════
var flowParticles=null;
function initFlowParticles(){
  flowParticles=[];
  var count=300;
  for(var i=0;i<count;i++){
    flowParticles.push({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5,
      hue:Math.random()*360, life:Math.random(), size:1+Math.random()*2
    });
  }
}
function drawFlowField(ctx,v,isDark){
  if(!flowParticles||flowParticles.length===0)initFlowParticles();
  var sv=Math.pow(v,0.5);
  // Fade trail (semi-transparent clear)
  ctx.fillStyle=isDark?'rgba(6,6,20,0.15)':'rgba(250,250,248,0.12)';
  ctx.fillRect(0,0,W,H);
  // Get frequency influence
  var bassInfluence=voiceBass*2,midInfluence=voiceMid*1.5,trebInfluence=voiceTreble*1.2;
  var flowSpeed=0.3+sv*1.5;
  var flowAngle=t/8000;
  var hueShift=t/100;
  for(var i=0;i<flowParticles.length;i++){
    var fp=flowParticles[i];
    var freqIdx=Math.floor((fp.x/W)*freqData.length);
    var fq=freqData&&micOn?freqData[Math.min(freqIdx,freqData.length-1)]/255:0.15;
    var angle, force=0.1*fq*flowSpeed;
    // ── 10 Flow Behaviors ──
    switch(flowBehavior){
      case'flow':angle=flowAngle+Math.sin(fp.x*0.005+t/2000)*2+Math.cos(fp.y*0.005+t/1500)*2;fp.vx+=Math.cos(angle)*force;fp.vy+=Math.sin(angle)*force;break;
      case'vortex':var dx=fp.x-W/2,dy=fp.y-H/2,dist=Math.sqrt(dx*dx+dy*dy)+1;fp.vx+=-dy/dist*force*3-dx/dist*0.1;fp.vy+=dx/dist*force*3-dy/dist*0.1;break;
      case'rise':fp.vy-=force*2;fp.vx+=(Math.sin(t/2000+fp.x*0.01))*force*0.5;break;
      case'explode':var dx=fp.x-W/2,dy=fp.y-H/2,dist=Math.sqrt(dx*dx+dy*dy)+1;fp.vx+=dx/dist*force*2;fp.vy+=dy/dist*force*2;if(dist<20){fp.vx+=(Math.random()-0.5)*2;fp.vy+=(Math.random()-0.5)*2}break;
      case'orbit':var ox=fp.x-W/2,oy=fp.y-H/2,od=Math.sqrt(ox*ox+oy*oy)+1;fp.vx+=-oy/od*force*2;fp.vy+=ox/od*force*2;fp.vx-=ox/od*0.02;fp.vy-=oy/od*0.02;break;
      case'grid':var gx=Math.round(fp.x/40)*40,gy=Math.round(fp.y/40)*40;fp.vx+=(gx-fp.x)*0.01*force;fp.vy+=(gy-fp.y)*0.01*force;break;
      case'swarm':if(i>0){var prev=flowParticles[i-1];fp.vx+=(prev.x-fp.x)*0.005;fp.vy+=(prev.y-fp.y)*0.005}fp.vx+=(Math.random()-0.5)*force;fp.vy+=(Math.random()-0.5)*force;break;
      case'rain':fp.vy+=force*1.5;fp.vx+=Math.sin(t/1500+fp.x*0.01)*force*0.3;if(fp.y>H){fp.y=0;fp.x=Math.random()*W;fp.vy=0}break;
      case'pulse':var px=fp.x-W/2,py=fp.y-H/2,pd=Math.sqrt(px*px+py*py)+1;fp.vx+=px/pd*force*Math.sin(t/500)*2;fp.vy+=py/pd*force*Math.sin(t/500)*2;break;
      case'chaos':fp.vx+=(Math.random()-0.5)*force*3;fp.vy+=(Math.random()-0.5)*force*3;break;
    }
    fp.vx*=0.96;fp.vy*=0.96;
    fp.x+=fp.vx;fp.y+=fp.vy;
    if(fp.x<0)fp.x=W;if(fp.x>W)fp.x=0;
    if(fp.y<0)fp.y=H;if(fp.y>H)fp.y=0;
    var ph=(fp.hue+hueShift+fp.x*0.3+fp.y*0.2+fq*60)%360;
    var alpha=0.15+sv*0.25+fq*0.3;
    var sz=fp.size*(0.6+fq*0.8)*ptcl.size;
    ctx.beginPath();ctx.arc(fp.x,fp.y,sz,0,Math.PI*2);
    ctx.fillStyle=c(ph,70,75,alpha);ctx.fill();
    if(i%3===0&&i+1<flowParticles.length){
      var np=flowParticles[i+1];
      var dx=np.x-fp.x,dy=np.y-fp.y,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<60){ctx.beginPath();ctx.moveTo(fp.x,fp.y);ctx.lineTo(np.x,np.y);ctx.strokeStyle=c(ph,50,70,alpha*0.3);ctx.lineWidth=0.5;ctx.stroke()}
    }
    if(fq>0.4&&Math.random()<0.05){fp.vx+=(Math.random()-0.5)*2;fp.vy+=(Math.random()-0.5)*2}
  }
}

// ─── Animation loop ───
function animate(ts){
  animFrame=requestAnimationFrame(animate);
  var rawT=ts||Date.now();
  t=rawT;

  if(micOn){readAudio();}else{
    smoothing=smoothing*fx.decay+0.04;
    volume=0.08+Math.sin(rawT/1800)*0.06+Math.sin(rawT/3100)*0.05+Math.sin(rawT/5200)*0.03;
  }
  var v=smoothing||volume;
  v=Math.pow(Math.max(0.001,v),fx.power);
  v=Math.max(fx.floor,v);

  var isDark=document.body.classList.contains('dark');
  ctx.clearRect(0,0,W,H);
  switch(currentMode){
    case 0:drawRadial(ctx,v,isDark,variations[0],1);break;
    case 1:drawPlasma(ctx,v,isDark);break;
    case 2:drawSpiralTunnel(ctx,v,isDark);break;
    case 3:drawWaveform(ctx,v,isDark);break;
    case 4:drawGeometric(ctx,v,isDark);break;
    case 5:drawStarfield(ctx,v,isDark);break;
    case 6:drawFlowField(ctx,v,isDark);break;
  }

  var displayV=Math.min(1,v*2.5*sensitivity);
  document.getElementById('meterFill').style.width=(displayV*100)+'%';
  document.getElementById('meterLabel').textContent=Math.round(displayV*100-50)+' dB';
  // Voice indicator
  var bAlpha=0.4+voiceBass*0.6,mAlpha=0.4+voiceMid*0.6,tAlpha=0.4+voiceTreble*0.6;
  document.getElementById('voiceBassBar').style.opacity=bAlpha;
  document.getElementById('voiceMidBar').style.opacity=mAlpha;
  document.getElementById('voiceTrebBar').style.opacity=tAlpha;
  var vl=voiceCentroid<0.3?'low':voiceCentroid<0.6?'mid':'high';
  document.getElementById('voiceLabel').textContent=vl;
}

// ─── Controls ───
function setTheme(t){
  document.body.className=t;
  document.getElementById('btnDark').className='btn'+(t==='dark'?' on':'');
  document.getElementById('btnLight').className='btn'+(t==='light'?' on':'');
  document.getElementById('titleText').style.color=t==='dark'?'#e8eaed':'#1a1a1a';
}
var modeNames=['Thick Punchy','Plasma','Spiral Tunnel','Waveform','Geometric','Starfield','Flow Field'];
var modeDescs=['Radial bars · instant response','Organic lava blobs · bass-driven','Rotating tunnel · hypnotic','Raw waveform scroll · live signal','Spinning morph shapes · symmetric','Hyperspace fly-through · speed lines','Particle waves · spectral ribbons'];
var totalModes=7;
function nextMode(){currentMode=(currentMode+1)%totalModes;updateModeLabel()}
function prevMode(){currentMode=(currentMode+totalModes-1)%totalModes;updateModeLabel()}
function updateModeLabel(){
  document.getElementById('modeName').textContent=modeNames[currentMode];
  document.getElementById('descText').textContent=modeDescs[currentMode];
  document.getElementById('titleText').textContent=modeNames[currentMode];
  updateConfigDisplay();
}
function updateVarLabel(){
  updateModeLabel();
}

function updateConfigDisplay(){
  var parts=[
    'mode:'+modeNames[currentMode],
    'sens:'+sensitivity.toFixed(1),
    'decay:'+fx.decay.toFixed(3),
    'power:'+fx.power.toFixed(1),
    'floor:'+fx.floor.toFixed(2)
  ];
  var cfg=parts.join(' | ');
  document.getElementById('configDisplay').textContent=cfg;
  document.getElementById('configDisplay').style.color=document.body.classList.contains('dark')?'rgba(255,255,255,.22)':'rgba(0,0,0,.22)';
}

function copyConfig(){
  var el=document.getElementById('configDisplay');
  var txt=el.textContent;
  if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){
    el.style.color='#34d399';setTimeout(function(){updateConfigDisplay();},1200);
  })}else{
    var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    el.style.color='#34d399';setTimeout(function(){updateConfigDisplay();},1200);
  }
}

// ─── Init ───
canvas=document.getElementById('canvasMain');
ctx=canvas.getContext('2d');
resize();
window.addEventListener('resize',resize);
updateVarLabel();
setTheme('dark');
animate();
setTimeout(function(){if(!micOn)startDemoMode();},600);
</script>
