<!DOCTYPE html>
<html lang="it" data-theme="dark" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Grammatica · Sottotitoli</title>

  <!-- ═══ Security ═══ -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://qzqmuegbpmvqrjrlfbgk.supabase.co; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://qzqmuegbpmvqrjrlfbgk.supabase.co; frame-src 'self'; media-src 'self'; worker-src 'self'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f6f8;
      --card: rgba(255,255,255,0.92);
      --line: rgba(0,0,0,.08);
      --text: #0b151c;
      --text-soft: #3a4d58;
      --text-faint: #7a8b96;
      --accent: #06b6d4;
      --accent-2: #8b5cf6;
      --good: #10b981;
      --warn: #f59e0b;
      --obs: #ef4444;
      --pill-bg: rgba(0,0,0,.04);
      --pill-sel: rgba(6,182,212,.12);
      --pill-sel-border: rgba(6,182,212,.4);
      --shadow: 0 10px 40px rgba(0,0,0,.12);
    }
    [data-theme="dark"] {
      --bg: #0b151c;
      --card: rgba(18,36,46,0.94);
      --line: rgba(255,255,255,.08);
      --text: #dbe7ed;
      --text-soft: #8aa4b2;
      --text-faint: #5c7380;
      --accent: #35c2c9;
      --accent-2: #a78bfa;
      --good: #34d399;
      --warn: #fbbf24;
      --obs: #f87171;
      --pill-bg: rgba(255,255,255,.05);
      --pill-sel: rgba(53,194,201,.14);
      --pill-sel-border: rgba(53,194,201,.4);
      --shadow: 0 10px 40px rgba(0,0,0,.5);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── top bar ── */
    .gi-top {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 20px;
      max-width: 760px; margin: 0 auto;
    }
    .gi-top a.gi-back {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-soft); text-decoration: none; font-size: 13px; font-weight: 600;
      border: 1px solid var(--line); border-radius: 100px; padding: 8px 14px;
      transition: border-color .15s, color .15s;
    }
    .gi-top a.gi-back:hover { border-color: var(--accent); color: var(--text); }
    .gi-top .gi-brand { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; flex: 1; }
    .gi-top .gi-brand span { color: var(--accent); }
    .gi-top button.gi-theme {
      border: 1px solid var(--line); background: transparent; color: var(--text-soft);
      border-radius: 100px; padding: 8px 12px; cursor: pointer; font-size: 14px;
    }
    .gi-top button.gi-theme:hover { border-color: var(--accent); color: var(--text); }

    /* ── stage ── */
    #giStage { max-width: 760px; margin: 0 auto; padding: 8px 20px 80px; }

    .gi-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 20px;
      padding: 28px; box-shadow: var(--shadow);
    }
    .gi-center { text-align: center; }
    .gi-kicker { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    .gi-title { font-family: 'Manrope', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 10px 0 8px; }
    .gi-sub { font-size: 14px; color: var(--text-soft); line-height: 1.6; }
    .gi-meta { margin: 18px 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .gi-chip { font-size: 12px; font-weight: 600; color: var(--text-soft); background: var(--pill-bg); border: 1px solid var(--line); border-radius: 100px; padding: 5px 12px; }

    .gi-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .gi-progress-bar { flex: 1; height: 8px; background: var(--pill-bg); border-radius: 100px; overflow: hidden; }
    .gi-progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .25s; }
    .gi-progress > span { font-size: 12px; font-weight: 700; color: var(--text-faint); min-width: 42px; text-align: right; }

    .gi-qnum { font-size: 12px; font-weight: 700; color: var(--text-faint); margin-bottom: 10px; }
    .gi-qtext { font-family: 'Manrope', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; }
    .gi-prompt { font-size: 26px; font-family: 'JetBrains Mono', monospace; letter-spacing: -0.01em; }

    .gi-opts { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
    .gi-opt {
      text-align: left; font: inherit; font-size: 15px; font-weight: 500; color: var(--text-soft);
      background: var(--pill-bg); border: 1.5px solid var(--line); border-radius: 14px;
      padding: 14px 18px; cursor: pointer; transition: border-color .15s, color .15s, background .15s;
    }
    .gi-opt:hover { border-color: var(--accent); color: var(--text); }
    .gi-opt.gi-opt-sel { border-color: var(--pill-sel-border); background: var(--pill-sel); color: var(--accent); font-weight: 700; }

    .gi-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
    .gi-nav-end { justify-content: center; }
    .gi-btn {
      font: inherit; font-weight: 700; font-size: 14px; border-radius: 100px;
      padding: 12px 24px; cursor: pointer; transition: filter .15s, border-color .15s, color .15s;
    }
    .gi-btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: #fff; border: none; }
    .gi-btn-primary:hover { filter: brightness(1.08); }
    .gi-btn-primary:disabled { opacity: .4; cursor: not-allowed; filter: none; }
    .gi-btn-ghost { background: transparent; border: 1.5px solid var(--line); color: var(--text-soft); }
    .gi-btn-ghost:hover { border-color: var(--accent); color: var(--text); }

    .gi-select-wrap { margin: 22px auto 0; max-width: 320px; }
    .gi-select {
      width: 100%; font: inherit; font-size: 15px; color: var(--text);
      background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 16px;
    }

    /* ── result ── */
    .gi-result { display: flex; flex-direction: column; gap: 16px; }
    .gi-result-head { text-align: center; margin-bottom: 6px; }
    .gi-badges { margin-top: 12px; }
    .gi-badge { display: inline-block; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--pill-sel); border: 1px solid var(--pill-sel-border); border-radius: 100px; padding: 7px 16px; }

    .gi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .gi-grid { grid-template-columns: 1fr; } }

    .gi-h { font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 12px; }
    .gi-h-sp { margin-top: 20px; }
    .gi-kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--line); }
    .gi-kv:last-child { border-bottom: none; }
    .gi-kv span { color: var(--text-soft); }
    .gi-kv b { color: var(--text); font-weight: 700; text-align: right; }

    .gi-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .gi-tag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--text-soft); background: var(--pill-bg); border: 1px solid var(--line); border-radius: 100px; padding: 4px 10px; }
    .gi-tag-obj { color: var(--warn); border-color: rgba(245,158,11,.4); background: rgba(245,158,11,.08); }
    .gi-tag-obs { color: var(--obs); border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.08); }
    .gi-tag-pred { color: var(--accent); border-color: var(--pill-sel-border); }

    .gi-ladder { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .gi-ladder-row { display: flex; gap: 14px; align-items: flex-start; }
    .gi-ladder-n {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    }
    .gi-ladder-body { flex: 1; padding-top: 3px; }
    .gi-ladder-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .gi-ladder-id { font-weight: 700; font-size: 14px; color: var(--text); }
    .gi-ladder-cefr { font-size: 11px; font-weight: 800; color: var(--accent); background: var(--pill-sel); border-radius: 6px; padding: 2px 7px; }
    .gi-ladder-dur { font-size: 12px; color: var(--text-faint); }
    .gi-ladder-stones { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .gi-stone { font-size: 11px; color: var(--text-soft); background: var(--pill-bg); border: 1px dashed var(--line); border-radius: 100px; padding: 3px 9px; }

    .gi-review { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
    .gi-review-row { border-left: 3px solid var(--obs); padding-left: 14px; }
    .gi-review-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .gi-review-item { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 3px 0; }
    .gi-review-wrong { color: var(--obs); text-decoration: line-through; font-weight: 600; }
    .gi-review-arrow { color: var(--text-faint); }
    .gi-review-right { color: var(--good); font-weight: 700; }

    /* ── drill (grammar-drill.js) ── */
    .gi-ladder-go, .gi-review-go { padding: 7px 14px; font-size: 12px; margin-top: 8px; }
    .gd-wrap { display: flex; flex-direction: column; gap: 14px; }
    .gd-back { align-self: flex-start; background: none; border: none; color: var(--text-soft); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .gd-back:hover { color: var(--text); }
    .gd-theory { padding: 22px; }
    .gd-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .gd-kicker { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    .gd-badge { font-size: 13px; font-weight: 700; color: var(--text); }
    .gd-cefr { font-size: 11px; font-weight: 800; color: var(--accent); background: var(--pill-sel); border-radius: 6px; padding: 2px 7px; }
    .gd-explanation { font-size: 14px; color: var(--text-soft); line-height: 1.7; white-space: pre-line; }
    .gd-progress { display: flex; align-items: center; gap: 12px; }
    .gd-progress-bar { flex: 1; height: 8px; background: var(--pill-bg); border-radius: 100px; overflow: hidden; }
    .gd-progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .25s; }
    .gd-progress > span { font-size: 12px; font-weight: 700; color: var(--text-faint); }
    .gd-prompt { margin-bottom: 16px; }
    .gd-prompt-label { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    .gd-prompt-text { font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 600; line-height: 1.4; }
    .gd-opts { display: flex; flex-direction: column; gap: 9px; }
    .gd-opt { text-align: left; font: inherit; font-size: 15px; font-weight: 500; color: var(--text-soft); background: var(--pill-bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 17px; cursor: pointer; transition: border-color .15s, color .15s; }
    .gd-opt:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
    .gd-opt:disabled { cursor: default; }
    .gd-opt-correct { border-color: var(--good); background: rgba(16,185,129,.12); color: var(--good); font-weight: 700; }
    .gd-opt-wrong { border-color: var(--obs); background: rgba(239,68,68,.1); color: var(--obs); }
    .gd-input-row { display: flex; gap: 10px; }
    .gd-input { flex: 1; font: inherit; font-size: 15px; font-family: 'JetBrains Mono', monospace; color: var(--text); background: var(--pill-bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 16px; }
    .gd-input:focus { outline: none; border-color: var(--accent); }
    .gd-input:disabled { opacity: .7; }
    .gd-btn { font: inherit; font-weight: 700; font-size: 14px; border-radius: 100px; padding: 12px 22px; cursor: pointer; transition: filter .15s, border-color .15s, color .15s; }
    .gd-btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); color: #fff; border: none; }
    .gd-btn-primary:hover { filter: brightness(1.08); }
    .gd-btn-ghost { background: transparent; border: 1.5px solid var(--line); color: var(--text-soft); }
    .gd-btn-ghost:hover { border-color: var(--accent); color: var(--text); }
    .gd-feedback { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-top: 14px; }
    .gd-ok { color: var(--good); }
    .gd-no { color: var(--obs); }
    .gd-nav { display: flex; gap: 10px; margin-top: 16px; }
    .gd-summary { text-align: center; }
    .gd-title { font-family: 'Manrope', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 8px 0; }
    .gd-score { font-size: 16px; font-weight: 700; color: var(--text-soft); margin-top: 6px; }
    .gd-meter { height: 10px; background: var(--pill-bg); border-radius: 100px; overflow: hidden; margin: 18px 0; }
    .gd-meter > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
    .gd-summary .gd-nav { justify-content: center; }

    @media (max-width: 480px) {
      .gi-card { padding: 22px 18px; }
      .gi-title { font-size: 24px; }
      .gi-qtext { font-size: 20px; }
      .gi-prompt { font-size: 22px; }
    }
  </style>
</head>
<body>

  <div class="gi-top">
    <a class="gi-back" href="panoramica.html"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    <div class="gi-brand">sottotitoli<span>.pro</span></div>
    <button class="gi-theme" id="giTheme" type="button" aria-label="Cambia tema"><i class="fa-solid fa-circle-half-stroke"></i></button>
  </div>

  <main id="giStage" aria-live="polite"></main>

  <script>
    // Apply persisted theme before paint (same key the app uses).
    (function () {
      try {
        var t = localStorage.getItem('sottotitoli-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=8"></script>
  <script src="js/auth.js?v=27"></script>

  <!-- ═══ Grammar databank + planner engine ═══ -->
  <script src="js/grammar-bank.js?v=1"></script>
  <script src="js/grammar-journey.js?v=1"></script>
  <script src="js/grammar-profile.js?v=1"></script>
  <script src="js/grammar-planner.js?v=1"></script>
  <script src="js/grammar-profile-store.js?v=1"></script>
  <script src="js/passive-signals.js?v=1"></script>
  <script src="js/grammar-drill.js?v=1"></script>
  <script src="js/grammar-intake.js?v=1"></script>

  <script>
    (function () {
      var btn = document.getElementById('giTheme');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var html = document.documentElement;
        var t = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', t);
        try { localStorage.setItem('sottotitoli-theme', t); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
