<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AI Voice · Sottotitoli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
    }
    [data-theme="light"] {
      --bg: #f0f2f5;
      --text: #111827;
      --text-dim: #6b7280;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.3s;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 780px;
      margin-bottom: 16px;
      padding: 0 4px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dim);
      text-decoration: none;
      letter-spacing: 0.01em;
    }
    .brand:hover { color: var(--text); }
    .brand-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px rgba(16,185,129,.5);
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .theme-toggle {
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;
      background: transparent;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
    }
    .theme-toggle:hover { color: var(--text); border-color: rgba(255,255,255,.2); }

    .voice-card {
      width: 100%;
      max-width: 780px;
      background: #111827;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
      transition: background .3s, border-color .3s;
    }
    [data-theme="light"] .voice-card {
      background: #fff;
      border-color: #e2e8f0;
      box-shadow: 0 4px 24px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }

    .voice-frame {
      display: block;
      width: 100%;
      height: 92vh;
      max-height: 820px;
      min-height: 600px;
      border: none;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 12px;
      color: var(--text-dim);
      background: rgba(255,255,255,.02);
      border-top: 1px solid rgba(255,255,255,.05);
    }
    [data-theme="light"] .status-bar {
      background: #f8fafc;
      border-top-color: #e2e8f0;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
    }
    .status-dot.off { background: #ef4444; }

    .footer {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-dim);
      opacity: 0.6;
    }
    .footer a { color: inherit; }

    @media (max-width: 820px) {
      body { padding: 8px; }
      .voice-card { border-radius: 16px; }
      .voice-frame { height: 85vh; max-height: none; min-height: 500px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-dot"></span>
      sottotitoli.ai — AI Voice
    </a>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">☀️</button>
  </div>

  <div class="voice-card">
    <iframe
      class="voice-frame"
      src="hugging-voice/index.html"
      title="AI Voice Conversation"
      allow="microphone; camera"
      loading="eager"
    ></iframe>
    <div class="status-bar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Server AI Voice: ws://localhost:8765</span>
    </div>
  </div>

  <p class="footer">
    Powered by <a href="https://github.com/huggingface/speech-to-speech" target="_blank" rel="noopener">huggingface/speech-to-speech</a>
    &nbsp;·&nbsp; <a href="panoramica.html">Panoramica</a>
  </p>

  <script>
    (function() {
      var t = localStorage.getItem('sottotitoli-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
      var btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
    })();
    function toggleTheme() {
      var cur = document.documentElement.getAttribute('data-theme');
      var next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('sottotitoli-theme', next);
      var btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
    }

    (function checkServer() {
      var txt = document.getElementById('statusText');
      if (txt) txt.textContent = 'Server AI Voice — ws://localhost:8765/v1/realtime';
    })();
  </script>

</body>
</html>
