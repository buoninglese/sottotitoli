<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Report AI · Sottotitoli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0f1e;--text:#f1f5f9;--text-dim:#94a3b8;--card:#111827;--line:rgba(255,255,255,.08);--accent:#8b5cf6;--accent-bg:rgba(139,92,246,.1)}
    [data-theme="light"]{--bg:#f0f2f5;--text:#111827;--text-dim:#6b7280;--card:#fff;--line:#e2e8f0}
    body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;transition:background .3s}
    .topbar{display:flex;align-items:center;justify-content:space-between;max-width:1000px;margin:0 auto 12px;padding:0 4px}
    .brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text-dim);text-decoration:none}
    .brand:hover{color:var(--text)}
    .brand-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px rgba(139,92,246,.5);animation:pulse-dot 2s infinite}
    @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}
    .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--accent-bg);color:var(--accent);margin-left:6px}
    .main-card{max-width:1000px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.4)}
    [data-theme="light"] .main-card{box-shadow:0 4px 24px rgba(0,0,0,.08)}
    .report-frame{display:block;width:100%;height:88vh;max-height:900px;min-height:600px;border:none}
    .status-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;font-size:12px;color:var(--text-dim);background:rgba(255,255,255,.02);border-top:1px solid var(--line)}
    .status-dot{width:6px;height:6px;border-radius:50%;background:#10b981;flex-shrink:0}
    .footer{text-align:center;margin-top:16px;font-size:12px;color:var(--text-dim);opacity:.6}
    .footer a{color:inherit}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="brand" href="index.html"><span class="brand-dot"></span>sottotitoli.ai — Report AI<span class="badge">MULTI-AGENT</span></a>
    <span style="font-size:12px;color:var(--text-dim)">6 report types · coaching engine</span>
  </div>

  <div class="main-card">
    <iframe class="report-frame" src="http://localhost:8771/" title="Sottotitoli Report AI" allow="clipboard-write" loading="eager" id="reportFrame"></iframe>
    <div class="status-bar"><span class="status-dot"></span><span id="statusText">Report AI · ws://localhost:8771</span></div>
  </div>

  <p class="footer">Powered by <a href="https://github.com/huggingface/speech-to-speech" target="_blank" rel="noopener">self-plan</a> · cloned from <a href="https://huggingface.co/spaces/lvwerra/self-plan" target="_blank" rel="noopener">lvwerra/self-plan</a></p>
</body>
</html>
