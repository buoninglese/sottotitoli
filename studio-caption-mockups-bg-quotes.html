<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sottotitoli · Serif Quotation Mark Spirals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;overflow:hidden;height:100vh;position:relative;background:#060610;color:#e8eaed;transition:background .5s}
body.light{background:#fafaf8;color:#1a1a1a}
#bgLayer{position:fixed;inset:0;z-index:0}
.bg-canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:8px;padding:40px;pointer-events:none}
#ui>*{pointer-events:auto}
h1{font-size:clamp(22px,5vw,36px);font-weight:900;letter-spacing:-1px}
p.sub{font-size:11px;opacity:.4;max-width:500px;text-align:center}
.meter-row{display:flex;align-items:center;gap:8px}
.meter-bar{width:100px;height:2px;border-radius:1px;overflow:hidden;background:rgba(255,255,255,.06)}
.meter-fill{height:100%;border-radius:1px;background:linear-gradient(90deg,#34d399,#a78bfa);transition:width .1s;width:0%}
.meter-label{font-family:'JetBrains Mono',monospace;font-size:8px;opacity:.3;min-width:36px}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn{padding:8px 16px;border-radius:100px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);font-family:'Inter',sans-serif;font-size:10px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:hover{border-color:#a78bfa;color:#a78bfa}
.btn.on{background:rgba(52,211,153,.1)!important;border-color:rgba(52,211,153,.25)!important;color:#34d399!important}
.btn.mic-on{background:rgba(239,68,68,.15)!important;border-color:rgba(239,68,68,.3)!important;color:#ef4444!important;animation:micPulse 1.5s ease infinite}
.btn.var-nav{width:28px;height:28px;border-radius:50%;padding:0;font-size:14px;display:flex;align-items:center;justify-content:center}
.var-label{font-family:'JetBrains Mono',monospace;font-size:9px;opacity:.35}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
</style>
</head>
<body class="dark">
<div id="bgLayer">
  <canvas class="bg-canvas" id="canvasMain"></canvas>
</div>
<div id="ui">
  <h1>Serif Quotation Spirals</h1>
  <p class="sub">5 variations · spiral line evoking the serif " character</p>
  <div class="meter-row">
    <span class="meter-label" id="meterLabel">— dB</span>
    <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
  </div>
  <div class="btn-row">
    <button class="btn" id="btnMic" onclick="toggleMic()">🎤 Start Mic</button>
    <button class="btn" id="btnDark" onclick="setTheme('dark')">🌙 Dark</button>
    <button class="btn on" id="btnLight" onclick="setTheme('light')">☀️ Light</button>
  </div>
  <div class="btn-row">
    <button class="btn var-nav" onclick="prevVar()">←</button>
    <span class="var-label" id="varName">1/5 · Double Quotation</span>
    <button class="btn var-nav" onclick="nextVar()">→</button>
  </div>
</div>
<script>
var audioCtx=null,analyser=null,micStream=null,micOn=false;
var freqData=null,volume=0,smoothing=0;
var animFrame=null,currentVar=0;
var canvas,ctx,W,H,t=0;

function initAudio(){
  if(audioCtx)return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=0.65;
  freqData=new Uint8Array(analyser.frequencyBinCount);
}
function resize(){W=window.innerWidth;H=window.innerHeight;canvas.width=W;canvas.height=H;}

function toggleMic(){
  if(micOn){stopMic();return}
  initAudio();
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(s){
    micStream=s;audioCtx.createMediaStreamSource(s).connect(analyser);
    micOn=true;document.getElementById('btnMic').textContent='⏹ Stop Mic';
    document.getElementById('btnMic').classList.add('mic-on');
    if(!animFrame)animate();
  }).catch(function(){startDemoMode()});
}
function stopMic(){
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}
  micOn=false;document.getElementById('btnMic').textContent='🎤 Start Mic';
  document.getElementById('btnMic').classList.remove('mic-on');
}
function startDemoMode(){
  micOn=true;document.getElementById('btnMic').textContent='🎤 Demo Mic';
  document.getElementById('btnMic').classList.add('mic-on');
  if(!animFrame)animate();
}
function readAudio(){
  if(!analyser)return;
  analyser.getByteFrequencyData(freqData);
  var sum=0;for(var i=0;i<freqData.length;i++)sum+=freqData[i];
  volume=Math.min(1,sum/freqData.length/200);
  smoothing=smoothing*0.7+volume*0.3;
}

function c(h,s,l,a){return'hsla('+h+','+s+'%,'+l+'%,'+a+')';}

// ══════════════════════════════════════
// 5 QUOTATION MARK SPIRAL VARIATIONS
// Real serif " shapes — teardrop lobes, bulbous bottoms, thin curved stems
// ══════════════════════════════════════

var variations=[

  // 1. Double Teardrop — two filled teardrop spirals (most like serif ")
  {
    name:'Double Teardrop',
    draw:function(ctx,v,isDark){
      var hue=isDark?250:215,sat=isDark?65:55;
      var cy=H/2, maxR=Math.min(W,H)*0.38;
      // Two teardrop lobes
      var lobes=[
        {cx:W/2-W*0.09, dir:1},  // left lobe
        {cx:W/2+W*0.09, dir:-1}  // right lobe
      ];
      lobes.forEach(function(lobe){
        var cx=lobe.cx;
        // Multiple spiral arms for density
        for(var arm=0;arm<6;arm++){
          var armOff=(arm/6)*Math.PI*2;
          ctx.beginPath();
          for(var i=0;i<250;i++){
            var frac=i/250;
            // Teardrop shape: bulb at bottom (large r), stem at top (small r)
            var r=3+frac*maxR*(0.4+v*0.4);
            // The bulb: wider at bottom, tapering up
            var a=armOff+frac*Math.PI*1.6; // spiral wraps ~1.6 turns
            // Compress X for teardrop, shift angle so bulb is at bottom
            var xScale=0.5+frac*0.5; // narrow at top, wide at bottom
            var x=cx+Math.cos(a+t/2000)*r*xScale*lobe.dir;
            var y=cy+Math.sin(a+t/2000)*r+maxR*0.2; // shift down so bulb at center
            if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
          }
          ctx.strokeStyle=c((hue+arm*15)%360,sat,isDark?78:42,0.25+v*0.3);
          ctx.lineWidth=0.6+v*2.5;ctx.stroke();
        }
        // Solid bulb fill at base
        var bulbR=maxR*0.18+v*maxR*0.08;
        var grad=ctx.createRadialGradient(cx,cy+maxR*0.15,0,cx,cy+maxR*0.15,bulbR);
        grad.addColorStop(0,c(hue,60,isDark?80:45,0.6+v*0.3));
        grad.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.arc(cx,cy+maxR*0.15,bulbR,0,Math.PI*2);ctx.fill();
      });
    }
  },

  // 2. Serif Comma — each lobe is a comma shape (thick head, thin tail curling inward)
  {
    name:'Serif Comma',
    draw:function(ctx,v,isDark){
      var hue=isDark?250:215,sat=isDark?65:55;
      var cy=H/2,maxR=Math.min(W,H)*0.4;
      var lobes=[
        {cx:W/2-W*0.1, dir:1},
        {cx:W/2+W*0.1, dir:-1}
      ];
      lobes.forEach(function(lobe){
        var cx=lobe.cx;
        // Comma = large circular head + thin curved tail
        // Head spiral (dense at center)
        for(var arm=0;arm<5;arm++){
          ctx.beginPath();
          var armOff=(arm/5)*Math.PI*2;
          for(var i=0;i<200;i++){
            var frac=i/200;
            var r=2+frac*maxR*0.35*(1+v*0.6);
            // As spiral goes outward, it curves like a comma tail
            var a=armOff+frac*Math.PI*2.2+Math.sin(frac*Math.PI)*0.8*lobe.dir;
            var x=cx+Math.cos(a+t/1800)*r;
            var y=cy+Math.sin(a+t/1800)*r*0.8+maxR*0.1;
            if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
          }
          ctx.strokeStyle=c((hue+arm*18)%360,sat,isDark?78:42,0.3+v*0.3);
          ctx.lineWidth=0.7+v*2.8;ctx.stroke();
        }
        // Comma head (filled circle)
        var headR=maxR*0.12+v*maxR*0.06;
        ctx.fillStyle=c(hue,55,isDark?80:45,0.55+v*0.35);
        ctx.beginPath();ctx.arc(cx,cy+maxR*0.08,headR,0,Math.PI*2);ctx.fill();
        // Small serif foot
        ctx.fillStyle=c(hue,50,isDark?75:40,0.4+v*0.3);
        ctx.fillRect(cx-headR*1.2,cy+maxR*0.12+headR,headR*2.4,3+v*5);
      });
    }
  },

  // 3. Calligraphic " — variable thickness line that thickens at the bulb
  {
    name:'Calligraphic',
    draw:function(ctx,v,isDark){
      var hue=isDark?250:215,sat=isDark?65:55;
      var cy=H/2,maxR=Math.min(W,H)*0.38;
      var lobes=[
        {cx:W/2-W*0.1, dir:1},
        {cx:W/2+W*0.1, dir:-1}
      ];
      lobes.forEach(function(lobe){
        var cx=lobe.cx;
        ctx.beginPath();
        for(var i=0;i<400;i++){
          var frac=i/400;
          // Teardrop path
          var a=lobe.dir*(Math.PI*0.2+frac*Math.PI*2.2);
          var r=3+frac*maxR*0.5*(1+v*0.45);
          var x=cx+Math.cos(a+t/1900)*r*0.6;
          var y=cy+Math.sin(a+t/1900)*r+maxR*0.15;
          if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        }
        // Thick at base, thin at tip
        var lw=1.5+v*4;
        ctx.strokeStyle=c(hue,sat,isDark?78:42,0.35+v*0.3);
        ctx.lineWidth=lw;ctx.stroke();
        // Bottom serif bracket
        ctx.fillStyle=c(hue,50,isDark?70:38,0.35+v*0.3);
        ctx.fillRect(cx-maxR*0.12,cy+maxR*0.28,lw*6,2+v*4);
      });
      // Connecting baseline
      ctx.strokeStyle=c(hue,sat,isDark?60:35,0.15+v*0.15);
      ctx.lineWidth=1+v*2;
      ctx.beginPath();ctx.moveTo(W/2-W*0.15,cy+maxR*0.45);ctx.lineTo(W/2+W*0.15,cy+maxR*0.45);ctx.stroke();
    }
  },

  // 4. Double Quotation Echo — two teardrop spirals with radiating echo rings
  {
    name:'Quotation Echo',
    draw:function(ctx,v,isDark){
      var hue=isDark?250:215,sat=isDark?65:55;
      var cy=H/2,maxR=Math.min(W,H)*0.37;
      var lobes=[
        {cx:W/2-W*0.09, dir:1},
        {cx:W/2+W*0.09, dir:-1}
      ];
      // Echo layers
      for(var echo=0;echo<4;echo++){
        var echoScale=0.5+echo*0.18+v*(0.3+echo*0.12);
        var echoAlpha=0.5-echo*0.1;
        lobes.forEach(function(lobe){
          var cx=lobe.cx;
          ctx.beginPath();
          for(var i=0;i<220;i++){
            var frac=i/220;
            var r=2+frac*maxR*echoScale;
            var a=lobe.dir*(Math.PI*0.3+frac*Math.PI*2+Math.sin(t/1500+echo)*0.3);
            var x=cx+Math.cos(a)*r*0.6;
            var y=cy+Math.sin(a)*r+maxR*0.1*echoScale;
            if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
          }
          ctx.strokeStyle=c((hue+echo*25)%360,sat,isDark?78:42,echoAlpha+v*0.15);
          ctx.lineWidth=0.5+v*2;ctx.stroke();
        });
      }
      // Solid bulbs
      lobes.forEach(function(lobe){
        var bulbR=maxR*0.1+v*maxR*0.05;
        ctx.fillStyle=c(hue,55,isDark?78:42,0.5+v*0.3);
        ctx.beginPath();ctx.arc(lobe.cx,cy+maxR*0.08,bulbR,0,Math.PI*2);ctx.fill();
      });
    }
  },

  // 5. Serif Bloom — spirals that bloom outward from the quotation bulb
  {
    name:'Serif Bloom',
    draw:function(ctx,v,isDark){
      var hue=isDark?250:215,sat=isDark?65:55;
      var cy=H/2,maxR=Math.min(W,H)*0.4;
      var lobes=[
        {cx:W/2-W*0.1, dir:1},
        {cx:W/2+W*0.1, dir:-1}
      ];
      lobes.forEach(function(lobe){
        var cx=lobe.cx;
        // Blooming petals = multiple spiral arms from the bulb
        var petals=8+Math.floor(v*6);
        for(var p=0;p<petals;p++){
          var pAngle=(p/petals)*Math.PI*2;
          ctx.beginPath();
          for(var i=0;i<180;i++){
            var frac=i/180;
            var r=3+frac*maxR*0.45*(1+v*0.5);
            // Petal curves outward from bulb
            var a=pAngle+frac*lobe.dir*1.8+Math.sin(frac*Math.PI)*0.6*lobe.dir;
            var x=cx+Math.cos(a+t/2000)*r*0.55;
            var y=cy+Math.sin(a+t/2000)*r+maxR*0.08;
            if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
          }
          ctx.strokeStyle=c((hue+p*20)%360,sat,isDark?78:42,0.2+v*0.3);
          ctx.lineWidth=0.4+v*2;ctx.stroke();
        }
        // Dense bulb core
        var coreR=maxR*0.08+v*maxR*0.06;
        var cg=ctx.createRadialGradient(cx,cy+maxR*0.05,0,cx,cy+maxR*0.05,coreR*2);
        cg.addColorStop(0,c(hue,70,isDark?85:50,0.8+v*0.2));
        cg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy+maxR*0.05,coreR*2,0,Math.PI*2);ctx.fill();
      });
    }
  }

];

// ─── Animation loop ───
function animate(ts){
  animFrame=requestAnimationFrame(animate);
  t=ts||Date.now();
  if(micOn){readAudio();}else{
    smoothing=smoothing*0.92+0.04;
    volume=0.08+Math.sin(t/1800)*0.06+Math.sin(t/3100)*0.05+Math.sin(t/5200)*0.03;
  }
  var v=smoothing||volume;
  var isDark=document.body.classList.contains('dark');
  ctx.clearRect(0,0,W,H);

  // Subtle background
  ctx.fillStyle=isDark?'rgba(6,6,20,0.3)':'rgba(250,250,248,0.3)';
  ctx.fillRect(0,0,W,H);

  variations[currentVar].draw(ctx,v,isDark);

  var displayV=Math.min(1,v*2.5);
  document.getElementById('meterFill').style.width=(displayV*100)+'%';
  document.getElementById('meterLabel').textContent=Math.round(displayV*100-50)+' dB';
}

// ─── Controls ───
function setTheme(t){
  document.body.className=t;
  document.getElementById('btnDark').className='btn'+(t==='dark'?' on':'');
  document.getElementById('btnLight').className='btn'+(t==='light'?' on':'');
}
function nextVar(){currentVar=(currentVar+1)%variations.length;updateVarLabel();}
function prevVar(){currentVar=(currentVar+variations.length-1)%variations.length;updateVarLabel();}
function updateVarLabel(){
  document.getElementById('varName').textContent=(currentVar+1)+'/'+variations.length+' · '+variations[currentVar].name;
}

// ─── Init ───
canvas=document.getElementById('canvasMain');
ctx=canvas.getContext('2d');
resize();window.addEventListener('resize',resize);
updateVarLabel();setTheme('dark');
animate();
setTimeout(function(){if(!micOn)startDemoMode();},600);
</script>
</body>
</html>
