<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sottotitoli · Topbar Mockups (50) — Index Style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@300;400;500;600;700&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#e8eaed;padding:24px;-webkit-font-smoothing:antialiased}

.page-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.page-header h1{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;color:#a78bfa;margin-bottom:2px}
.sub{font-size:13px;color:#71717a}
.header-actions{display:flex;gap:8px;align-items:center}
.btn-action{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:rgba(255,255,255,.6);cursor:pointer;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap}
.btn-action:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.2)}

.section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;margin:36px 0 16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}
.section-title .count{font-family:'JetBrains Mono',monospace;font-size:11px;color:#52525b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(500px,1fr));gap:20px}
.card{background:#0f1117;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden;position:relative;min-height:180px}
.card-head{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04);font-size:10px;color:#52525b;font-family:'JetBrains Mono',monospace}
.card-body{padding:20px;display:flex;align-items:center;justify-content:center;min-height:130px;background:rgba(255,255,255,.01)}

/* ═══ TOPBAR BASE ═══ */
.tb{display:flex;align-items:center;gap:8px;padding:10px 18px;width:100%;max-width:700px;border-radius:12px;transition:all .3s}
.tb-logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;text-decoration:none;flex-shrink:0}
.tb-logo span{opacity:.3}
.tb-spacer{flex:1}
.tb-nav{display:flex;gap:4px;list-style:none}
.tb-nav a{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;padding:5px 10px;border-radius:6px;text-decoration:none;transition:all .2s;display:block}
.tb-nav a.active{font-weight:600}
.tb-hamburger{display:flex;flex-direction:column;gap:3px;cursor:pointer;padding:7px;border-radius:6px;transition:all .2s;flex-shrink:0}
.tb-hamburger span{display:block;width:16px;height:2px;border-radius:1px;transition:all .2s}

/* ═══ INDEX BASE COLORS ═══ */
.tb-logo{color:#a78bfa}
.tb-nav a{color:rgba(255,255,255,.5);background:transparent;border:1px solid transparent}
.tb-nav a:hover{color:rgba(255,255,255,.75);background:rgba(255,255,255,.04)}
.tb-nav a.active{color:#a78bfa;background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.15)}
.tb-hamburger{border:1px solid rgba(255,255,255,.08);background:transparent}
.tb-hamburger span{background:rgba(255,255,255,.5)}
.tb-hamburger:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.15)}
.tb-hamburger:hover span{background:rgba(255,255,255,.8)}

/* ═══ DEPTH TECHNIQUES ═══ */

/* 1 — Flat */
.d1 .tb{box-shadow:none;border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.01)}
.d1 .tb-nav a{box-shadow:none}
.d1 .tb-hamburger{box-shadow:none}

/* 2 — Subtle Shadow */
.d2 .tb{box-shadow:0 1px 3px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.02)}
.d2 .tb-nav a{box-shadow:0 1px 2px rgba(0,0,0,.15)}
.d2 .tb-nav a:hover{box-shadow:0 2px 6px rgba(0,0,0,.25)}
.d2 .tb-hamburger{box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* 3 — Elevated Card */
.d3 .tb{box-shadow:0 4px 16px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);border-radius:14px}
.d3 .tb-nav a{box-shadow:0 2px 4px rgba(0,0,0,.2)}
.d3 .tb-nav a:hover{box-shadow:0 4px 12px rgba(167,139,250,.15);transform:translateY(-1px)}
.d3 .tb-hamburger{box-shadow:0 2px 6px rgba(0,0,0,.3)}

/* 4 — Floating */
.d4 .tb{box-shadow:0 8px 32px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08);background:rgba(20,22,30,.95);border-radius:16px;backdrop-filter:blur(20px)}
.d4 .tb-nav a:hover{box-shadow:0 4px 16px rgba(167,139,250,.2);transform:translateY(-2px)}
.d4 .tb-hamburger{box-shadow:0 4px 12px rgba(0,0,0,.4)}

/* 5 — Inset / Sunken */
.d5 .tb{box-shadow:inset 0 2px 4px rgba(0,0,0,.3),0 1px 2px rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.2);border-radius:12px}
.d5 .tb-nav a{box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.d5 .tb-nav a.active{box-shadow:inset 0 1px 3px rgba(167,139,250,.1)}
.d5 .tb-hamburger{box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}

/* 6 — Layered */
.d6 .tb{box-shadow:0 1px 2px rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.2),0 4px 8px rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02)}
.d6 .tb-nav a{box-shadow:0 1px 2px rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.1)}
.d6 .tb-hamburger{box-shadow:0 1px 2px rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.15)}

/* 7 — Glow Border */
.d7 .tb{box-shadow:0 0 20px rgba(167,139,250,.08),0 4px 16px rgba(0,0,0,.3);border:1px solid rgba(167,139,250,.15);background:rgba(255,255,255,.02)}
.d7 .tb-nav a.active{box-shadow:0 0 12px rgba(167,139,250,.15);border-color:rgba(167,139,250,.25)}
.d7 .tb-hamburger{border-color:rgba(167,139,250,.12);box-shadow:0 0 8px rgba(167,139,250,.06)}

/* 8 — Double Border */
.d8 .tb{box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 0 3px rgba(167,139,250,.06),0 4px 16px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02)}
.d8 .tb-nav a{border:1px solid rgba(255,255,255,.06)}
.d8 .tb-nav a.active{box-shadow:0 0 0 2px rgba(167,139,250,.1)}
.d8 .tb-hamburger{box-shadow:0 0 0 1px rgba(167,139,250,.08)}

/* 9 — Neumorphic Dark */
.d9 .tb{box-shadow:4px 4px 8px rgba(0,0,0,.4),-2px -2px 4px rgba(255,255,255,.02);border:none;background:rgba(20,22,30,.6);border-radius:14px}
.d9 .tb-nav a{box-shadow:2px 2px 4px rgba(0,0,0,.3),-1px -1px 2px rgba(255,255,255,.02)}
.d9 .tb-nav a:active{box-shadow:inset 2px 2px 4px rgba(0,0,0,.4),inset -1px -1px 2px rgba(255,255,255,.02)}
.d9 .tb-hamburger{box-shadow:2px 2px 4px rgba(0,0,0,.3),-1px -1px 2px rgba(255,255,255,.02)}

/* 10 — Glass Morphism */
.d10 .tb{box-shadow:0 8px 32px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);backdrop-filter:blur(24px);border-radius:16px}
.d10 .tb-nav a{backdrop-filter:blur(4px);background:rgba(255,255,255,.02)}
.d10 .tb-nav a:hover{background:rgba(255,255,255,.06);backdrop-filter:blur(8px)}
.d10 .tb-hamburger{backdrop-filter:blur(4px)}

/* 11 — Gradient Edge */
.d11 .tb{box-shadow:0 4px 20px rgba(0,0,0,.3);border:1px solid transparent;background:rgba(255,255,255,.02);background-clip:padding-box;position:relative}
.d11 .tb::before{content:'';position:absolute;inset:-1px;border-radius:13px;background:linear-gradient(135deg,rgba(167,139,250,.15),rgba(167,139,250,.03),rgba(167,139,250,.08));z-index:-1}
.d11 .tb-nav a.active{background:linear-gradient(135deg,rgba(167,139,250,.12),rgba(167,139,250,.04))}

/* 12 — Perspective Lift */
.d12 .tb{box-shadow:0 6px 20px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);transform:perspective(800px) rotateX(1deg);transition:all .3s}
.d12 .tb:hover{transform:perspective(800px) rotateX(0);box-shadow:0 12px 32px rgba(0,0,0,.5)}
.d12 .tb-hamburger{box-shadow:0 3px 8px rgba(0,0,0,.3)}

/* 13 — Etched */
.d13 .tb{box-shadow:0 1px 0 rgba(255,255,255,.03),inset 0 1px 3px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.04);background:rgba(0,0,0,.15)}
.d13 .tb-nav a{border-bottom:2px solid transparent}
.d13 .tb-nav a.active{border-bottom-color:rgba(167,139,250,.4);box-shadow:none;background:transparent}

/* 14 — Shadow Spread */
.d14 .tb{box-shadow:0 2px 4px rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.3),0 16px 32px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02)}
.d14 .tb-nav a:hover{box-shadow:0 4px 12px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.2)}

/* 15 — Emboss */
.d15 .tb{box-shadow:inset 0 -2px 4px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02)}
.d15 .tb-nav a{box-shadow:inset 0 -1px 2px rgba(0,0,0,.15)}
.d15 .tb-nav a:hover{box-shadow:inset 0 -2px 4px rgba(167,139,250,.1)}

/* 16 — Soft Press */
.d16 .tb{box-shadow:0 0 0 1px rgba(255,255,255,.03),0 2px 4px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.3);border:none;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01))}

/* 17 — Outline Glow */
.d17 .tb{box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 30px rgba(167,139,250,.06);border:1px solid rgba(255,255,255,.05);background:transparent}

/* 18 — Ring Accent */
.d18 .tb{box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 0 4px rgba(167,139,250,.04);border-radius:14px;border:1px solid transparent;background:rgba(255,255,255,.02)}

/* 19 — Paper Stack */
.d19 .tb{box-shadow:0 1px 1px rgba(0,0,0,.2),0 2px 2px rgba(0,0,0,.2),0 4px 4px rgba(0,0,0,.2),0 8px 8px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02)}

/* 20 — Aurora Edge */
.d20 .tb{box-shadow:0 0 20px rgba(167,139,250,.1),0 0 40px rgba(167,139,250,.04),0 4px 16px rgba(0,0,0,.3);border:1px solid rgba(167,139,250,.12);background:rgba(167,139,250,.02)}

/* 21 — Chisel */
.d21 .tb{box-shadow:0 1px 0 rgba(255,255,255,.04),0 -1px 0 rgba(0,0,0,.3),inset 0 1px 2px rgba(0,0,0,.2);border:none;background:rgba(255,255,255,.02)}

/* 22 — Hover Lift */
.d22 .tb{box-shadow:0 1px 3px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.01);transition:all .3s}
.d22 .tb:hover{box-shadow:0 8px 30px rgba(0,0,0,.4);transform:translateY(-2px)}
.d22 .tb-nav a{transition:all .3s}
.d22 .tb-nav a:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}

/* 23 — Inner Glow */
.d23 .tb{box-shadow:inset 0 0 20px rgba(167,139,250,.04),0 2px 8px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02)}

/* 24 — Bevel */
.d24 .tb{box-shadow:inset 0 1px 0 rgba(255,255,255,.03),inset 0 -1px 0 rgba(0,0,0,.2),0 4px 12px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02)}

/* 25 — Translucent Depth */
.d25 .tb{box-shadow:0 4px 20px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);background:rgba(10,12,18,.85);backdrop-filter:blur(16px) saturate(1.2)}

/* 26 — Hard Edge */
.d26 .tb{box-shadow:3px 3px 0 rgba(167,139,250,.15);border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.02);border-radius:8px}
.d26 .tb-nav a{border-radius:4px}
.d26 .tb-nav a.active{box-shadow:2px 2px 0 rgba(167,139,250,.15)}

/* 27 — Mist */
.d27 .tb{box-shadow:0 0 40px rgba(0,0,0,.4),0 0 80px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.04);background:rgba(20,22,30,.7)}

/* 28 — Pill Bar */
.d28 .tb{border-radius:100px;box-shadow:0 4px 24px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);background:rgba(20,22,30,.95);padding:6px 20px}
.d28 .tb-nav a{border-radius:100px}
.d28 .tb-hamburger{border-radius:50%}

/* 29 — Light Ray */
.d29 .tb{box-shadow:0 0 60px rgba(167,139,250,.05),0 4px 16px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);background:linear-gradient(135deg,rgba(167,139,250,.04),rgba(255,255,255,.01))}

/* 30 — Micro Interaction */
.d30 .tb{box-shadow:0 2px 6px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02)}
.d30 .tb-nav a{position:relative}
.d30 .tb-nav a::after{content:'';position:absolute;bottom:0;left:50%;width:0;height:1px;background:#a78bfa;transition:all .3s;transform:translateX(-50%)}
.d30 .tb-nav a:hover::after{width:60%}

/* 31 — Triple Ring */
.d31 .tb{box-shadow:0 0 0 1px rgba(255,255,255,.03),0 0 0 3px rgba(167,139,250,.04),0 0 0 6px rgba(167,139,250,.02);border-radius:14px;border:none;background:rgba(255,255,255,.02)}

/* 32 — Frost */
.d32 .tb{box-shadow:0 4px 20px rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);backdrop-filter:blur(30px)}

/* 33 — Split Shadow */
.d33 .tb{box-shadow:-4px 0 8px rgba(0,0,0,.2),4px 0 8px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.02)}

/* 34 — Canvas Texture */
.d34 .tb{box-shadow:0 2px 4px rgba(0,0,0,.2),inset 0 0 40px rgba(255,255,255,.01);border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.015)}

/* 35 — Jewel */
.d35 .tb{box-shadow:0 0 0 1px rgba(167,139,250,.08),0 0 0 4px rgba(167,139,250,.03),0 8px 24px rgba(0,0,0,.3);border-radius:16px;border:none;background:linear-gradient(135deg,rgba(167,139,250,.06),rgba(255,255,255,.02))}

/* 36 — Dark Plate */
.d36 .tb{box-shadow:0 4px 0 rgba(0,0,0,.3),0 8px 16px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);background:rgba(20,22,30,.95);border-radius:12px}

/* 37 — Animated Border */
.d37 .tb{box-shadow:0 4px 16px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);position:relative;overflow:hidden}
.d37 .tb::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,.4),transparent);animation:tbShimmer 3s infinite}
@keyframes tbShimmer{0%{left:-100%}100%{left:100%}}

/* 38 — Pressable */
.d38 .tb{box-shadow:0 3px 0 rgba(0,0,0,.3),0 6px 12px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.03);border-radius:12px;transition:all .15s;cursor:pointer}
.d38 .tb:active{box-shadow:0 1px 0 rgba(0,0,0,.3),0 2px 4px rgba(0,0,0,.2);transform:translateY(2px)}

/* 39 — Vignette */
.d39 .tb{box-shadow:inset 0 0 60px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.015)}

/* 40 — Metallic */
.d40 .tb{box-shadow:0 2px 4px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}

/* 41 — Halo */
.d41 .tb{box-shadow:0 0 0 1px rgba(255,255,255,.04),0 0 40px rgba(167,139,250,.08),0 8px 20px rgba(0,0,0,.3);border-radius:14px;border:none;background:rgba(255,255,255,.02)}

/* 42 — Stage Light */
.d42 .tb{box-shadow:0 -2px 20px rgba(0,0,0,.3),0 8px 16px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.05);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}

/* 43 — Carbon Fiber */
.d43 .tb{box-shadow:0 2px 6px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);background:repeating-linear-gradient(90deg,rgba(255,255,255,.01),rgba(255,255,255,.01) 2px,transparent 2px,transparent 4px)}

/* 44 — Orb Shadow */
.d44 .tb{box-shadow:0 10px 30px -5px rgba(0,0,0,.5),0 20px 50px -10px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02)}

/* 45 — Prism Edge */
.d45 .tb{box-shadow:0 0 0 1px rgba(255,255,255,.04);border:none;background:rgba(255,255,255,.02);position:relative}
.d45 .tb::after{content:'';position:absolute;bottom:0;left:10%;width:80%;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,.3),transparent)}

/* 46 — Suspended */
.d46 .tb{box-shadow:0 20px 40px -10px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.06);background:rgba(20,22,30,.95);transform:translateY(-4px)}

/* 47 — Recessed Panel */
.d47 .tb{box-shadow:inset 0 2px 8px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.04);background:rgba(0,0,0,.15);border-radius:10px}

/* 48 — Spotlight */
.d48 .tb{box-shadow:0 0 0 1px rgba(255,255,255,.03),0 0 80px rgba(167,139,250,.05);border-radius:14px;border:none;background:radial-gradient(ellipse at 30% 50%,rgba(167,139,250,.06),transparent 70%)}

/* 49 — Lacquer */
.d49 .tb{box-shadow:0 2px 4px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01))}

/* 50 — Zenith */
.d50 .tb{box-shadow:0 0 0 1px rgba(255,255,255,.05),0 4px 20px rgba(0,0,0,.3),0 0 50px rgba(167,139,250,.06);border-radius:16px;border:none;background:linear-gradient(180deg,rgba(167,139,250,.04),rgba(255,255,255,.02))}

@media(max-width:600px){.grid{grid-template-columns:1fr}.tb{padding:8px 12px;gap:4px}.tb-logo{font-size:14px}.tb-nav a{font-size:9px;padding:3px 6px}}
</style>
</head>
<body>

<div class="page-header">
  <div>
    <h1>⬆ Topbar Mockups</h1>
    <p class="sub">50 depth techniques for the Index page topbar — borders · shadows · gradients · glass · perspective</p>
  </div>
</div>

<div id="mockupGrid"></div>

<script>
var techniques=[
  'Flat','Subtle Shadow','Elevated Card','Floating','Inset / Sunken',
  'Layered','Glow Border','Double Border','Neumorphic Dark','Glass Morphism',
  'Gradient Edge','Perspective Lift','Etched','Shadow Spread','Emboss',
  'Soft Press','Outline Glow','Ring Accent','Paper Stack','Aurora Edge',
  'Chisel','Hover Lift','Inner Glow','Bevel','Translucent Depth',
  'Hard Edge','Mist','Pill Bar','Light Ray','Micro Interaction',
  'Triple Ring','Frost','Split Shadow','Canvas Texture','Jewel',
  'Dark Plate','Animated Border','Pressable','Vignette','Metallic',
  'Halo','Stage Light','Carbon Fiber','Orb Shadow','Prism Edge',
  'Suspended','Recessed Panel','Spotlight','Lacquer','Zenith'
];

var grid=document.getElementById('mockupGrid'),h='';
techniques.forEach(function(t,i){
  var n=i+1,cls='d'+n;
  h+='<div class="card '+cls+'"><div class="card-head"><span>#'+n+'</span><span>'+t+'</span></div>';
  h+='<div class="card-body"><div class="tb"><a class="tb-logo">Sotto<span>titoli</span></a><ul class="tb-nav"><li><a href="#">Home</a></li><li><a href="#">Start</a></li><li><a class="active" href="#">Profilo</a></li><li><a href="#">AI Reports</a></li></ul><div class="tb-spacer"></div><div class="tb-hamburger"><span></span><span></span><span></span></div></div></div></div>';
});
grid.innerHTML=h;
</script>
</body>
</html>
