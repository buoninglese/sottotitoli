<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aurora Curtain · Fullscreen Word Particles</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif}
body{background:#060610}
#auroraCanvas{position:fixed;inset:0;width:100%;height:100%}

/* Trigger box */
#triggerBox{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
#triggerBtn{
  padding:14px 36px;border-radius:100px;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:-.3px;
  border:2px solid rgba(52,211,153,.4);
  background:rgba(52,211,153,.08);color:#34d399;
  cursor:pointer;transition:all .3s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
#triggerBtn:hover{border-color:#34d399;background:rgba(52,211,153,.18);box-shadow:0 0 40px rgba(52,211,153,.15)}
#triggerBtn.active{border-color:rgba(239,68,68,.4);color:#ef4444;background:rgba(239,68,68,.08)}
#triggerBtn.active:hover{border-color:#ef4444;background:rgba(239,68,68,.18);box-shadow:0 0 40px rgba(239,68,68,.15)}
#wordCount{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.25)}
</style>
</head>
<body>
<canvas id="auroraCanvas"></canvas>

<div id="triggerBox">
  <button id="triggerBtn" onclick="toggleAurora()">✦ Scatena Aurora</button>
  <span id="wordCount">0 parole nel campo</span>
</div>

<script>
// ─── Canvas setup ───
var canvas=document.getElementById('auroraCanvas');
var ctx=canvas.getContext('2d');
var W,H;

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W;canvas.height=H;
}
resize();window.addEventListener('resize',resize);

// ─── Wordbank ───
var WORDBANK=[
  'sottotitoli','trascrizione','traduzione','simultanea','live','caption',
  'voce','parlato','lingua','audio','segnale','frequenza','modulazione',
  'risonanza','vibrazione','acustica','decibel','armonica','onda','spettro',
  'fonetica','sillaba','vocale','consonante','dittongo','iato','elisione',
  'intonazione','prosodia','ritmo','pausa','respiro','emissione','articolare',
  'comprendere','ascoltare','parlare','comunicare','esprimere','dialogo',
  'monologo','conversazione','discorso','oratoria','eloquio','fluenza',
  'chiarezza','nitidezza','precisione','accuratezza','qualità','eccellenza',
  'apprendere','studiare','migliorare','crescere','evolvere','trasformare'
];

// ─── Particle system ───
var particles=[];
var active=false;
var fadeOut=false;
var globalAlpha=1;
var t=0;

function createParticles(){
  particles=[];
  WORDBANK.forEach(function(word,i){
    var angle=Math.random()*Math.PI*2;
    var dist=50+Math.random()*Math.min(W,H)*0.8;
    var baseX=W/2+Math.cos(angle)*dist;
    var baseY=H/2+Math.sin(angle)*dist*0.6; // wider than tall (aurora curtain shape)
    particles.push({
      word:word,
      x:baseX,
      y:baseY,
      baseX:baseX,
      baseY:baseY,
      vx:(Math.random()-.5)*0.8,
      vy:-0.3-Math.random()*1.2,
      size:14+Math.random()*28,
      hue:160+Math.random()*60, // teal-to-green Aurora colors
      life:0.6+Math.random()*0.4,
      phase:Math.random()*Math.PI*2,
      freq:0.3+Math.random()*1.5,
      amplitude:20+Math.random()*80
    });
  });
}

function toggleAurora(){
  if(!active){
    active=true;fadeOut=false;globalAlpha=1;
    createParticles();
    document.getElementById('triggerBtn').textContent='✕ Dissolvi';
    document.getElementById('triggerBtn').classList.add('active');
    document.getElementById('wordCount').textContent=WORDBANK.length+' parole nel campo';
  }else{
    fadeOut=true;
    document.getElementById('triggerBtn').textContent='✦ Scatena Aurora';
    document.getElementById('triggerBtn').classList.remove('active');
    document.getElementById('wordCount').textContent='0 parole nel campo';
  }
}

function hsl(h,s,l,a){return'hsla('+h+','+s+'%,'+l+'%,'+a+')';}

function draw(ts){
  requestAnimationFrame(draw);
  t=ts||Date.now();
  ctx.clearRect(0,0,W,H);

  if(!active&&particles.length===0)return;

  // Fade out logic
  if(fadeOut){
    globalAlpha=Math.max(0,globalAlpha-0.015);
    if(globalAlpha<=0){
      active=false;fadeOut=false;globalAlpha=1;
      particles=[];
      return;
    }
  }

  // Aurora curtain background glow
  if(active&&globalAlpha>0.1){
    var grad=ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,Math.max(W,H)*0.7);
    grad.addColorStop(0,'rgba(52,211,153,'+(0.03*globalAlpha)+')');
    grad.addColorStop(0.4,'rgba(20,180,160,'+(0.02*globalAlpha)+')');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  }

  // Wave curtain effect (subtle horizontal bands)
  if(active&&globalAlpha>0.2){
    for(var band=0;band<8;band++){
      var by=H*0.1+band*H*0.1;
      var bw=W*0.6+Math.sin(t*0.0005+band)*W*0.2;
      var bx=(W-bw)/2;
      ctx.fillStyle='rgba(52,211,153,'+(0.015*globalAlpha)+')';
      ctx.fillRect(bx,by,bw,H*0.06);
    }
  }

  // Update and draw word particles
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    if(!active&&!fadeOut)continue;

    // Aurora curtain motion: gentle upward drift + horizontal wave
    p.y+=p.vy*0.4;
    p.x+=Math.sin(t*0.001+p.phase)*p.amplitude*0.03;

    // Sweep effect (left-to-right gentle push)
    p.x+=0.15*(1-p.y/H)*0.5;

    // Wave Y effect
    p.y+=Math.sin(p.x*0.004+t*0.0008)*0.3;

    // Wrap around
    if(p.y<-80){p.y=H+80;p.x=Math.random()*W;}
    if(p.y>H+80){p.y=-80;p.x=Math.random()*W;}

    // Alpha from global + individual life
    var alpha=globalAlpha*p.life*0.8;
    if(alpha<0.02)continue;

    // Draw word
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.font='bold '+p.size+'px "Inter",system-ui,sans-serif';
    ctx.fillStyle=hsl(p.hue,70,65+Math.sin(t*0.002+p.phase)*15,1);
    ctx.textAlign='center';ctx.textBaseline='middle';

    // Subtle glow behind word
    ctx.shadowColor=hsl(p.hue,80,60,0.4);
    ctx.shadowBlur=8+Math.sin(t*0.003+p.phase)*4;
    ctx.fillText(p.word,p.x,p.y);
    ctx.shadowBlur=0;
    ctx.restore();

    // Occasional highlight streak
    if(Math.sin(t*0.002+p.phase)>0.85&&alpha>0.3){
      ctx.save();ctx.globalAlpha=alpha*0.3;
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.font='bold '+p.size+'px "Inter",system-ui,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(p.word,p.x,p.y);
      ctx.restore();
    }
  }
}
requestAnimationFrame(draw);
createParticles(); // pre-create but don't show until triggered
active=false;particles=[]; // reset
</script>
</body>
</html>
