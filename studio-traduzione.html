<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sottotitoli · Traduzione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --bg: #0a0f14; --card: rgba(255,255,255,.02); --line: rgba(255,255,255,.06);
  --text: rgba(255,255,255,.85); --muted: rgba(255,255,255,.45); --muted2: rgba(255,255,255,.18);
  --accent: #34d399; --accent2: #6ee7b7; --warn: #fbbf24; --danger: #f87171;
}
body {
  font-family: 'Work Sans', system-ui, sans-serif;
  background: #0a0f14; color: var(--text);
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  -webkit-font-smoothing: antialiased; padding: 0 0 40px;
}

/* ═══ MAIN LAYOUT — centered, max-width ═══ */
.main-layout {
  width: 100%; max-width: 1200px; display: flex;
  margin-top: 12px; gap: 0;
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 24px rgba(0,0,0,.3);
}

/* ═══ LEFT SIDEBAR — Speaker tags ═══ */
.sidebar-left {
  width: 170px; min-width: 150px; flex-shrink: 0;
  background: #0c1118;
  display: flex; flex-direction: column;
  border-right: 1px solid rgba(255,255,255,.04);
  min-height: 480px;
}
.sidebar-left-head {
  padding: 14px 12px 10px; border-bottom: 1px solid var(--line);
  font-family: 'Bebas Neue', sans-serif; font-size: 16px;
  letter-spacing: 1px; color: var(--accent);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-left-head .spk-count-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: var(--muted2); background: rgba(255,255,255,.03);
  padding: 2px 8px; border-radius: 4px;
}
.sidebar-left-body {
  flex: 1; overflow-y: auto; padding: 8px;
  display: flex; flex-direction: column; gap: 4px;
}
.spk-tag-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 10px; border-radius: 8px; cursor: pointer;
  transition: all .2s; border: 1px solid transparent;
  position: relative; user-select: none;
}
.spk-tag-pill:hover { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.08); }
.spk-tag-pill.active { background: rgba(52,211,153,.06); border-color: rgba(52,211,153,.2); }
.spk-tag-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
}
.spk-tag-name {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
  color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
.spk-tag-edit {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
  color: var(--text); padding: 4px 6px; border-radius: 4px; width: 100%;
  outline: none; display: none;
}
.spk-tag-pill.editing .spk-tag-name { display: none; }
.spk-tag-pill.editing .spk-tag-edit { display: block; }
.spk-tag-pill .spk-tag-actions { display: none; }
.spk-tag-pill:hover .spk-tag-actions { display: flex; gap: 4px; }
.spk-tag-actions button {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 12px; padding: 2px 4px; border-radius: 3px;
}
.spk-tag-actions button:hover { background: rgba(255,255,255,.08); color: var(--text); }

/* ═══ CENTER STAGE — fills remaining width ═══ */
.stage-wrapper {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
  background: linear-gradient(180deg, #0d1117 0%, #0a0e13 100%);
}
.stage {
  display: flex; flex-direction: column;
  width: 100%; min-height: 480px;
}

/* ═══ RIGHT SIDEBAR ═══ */
.sidebar-right {
  width: 220px; min-width: 200px; flex-shrink: 0;
  background: #0c1118;
  display: flex; flex-direction: column;
  border-left: 1px solid rgba(255,255,255,.04);
  min-height: 480px;
}
.sidebar-right-top {
  padding: 16px 14px; border-bottom: 1px solid rgba(255,255,255,.04);
  display: flex; flex-direction: column; gap: 6px;
}
.sidebar-right-top .share-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 13px;
  letter-spacing: 1px; color: var(--muted); margin-bottom: 6px;
  text-transform: uppercase;
}
.share-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 9px 12px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,.05); background: transparent;
  color: rgba(255,255,255,.55); font-family: 'Inter', sans-serif; font-size: 11px;
  font-weight: 500; cursor: pointer; transition: all .2s; text-align: left;
}
.share-btn:hover { background: rgba(255,255,255,.04); color: rgba(255,255,255,.85); border-color: rgba(255,255,255,.1); }
.share-btn .share-svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .5; transition: opacity .2s; }
.share-btn:hover .share-svg { opacity: .8; }
.share-btn .share-label { flex: 1; }
.share-btn.copied { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.25); color: #6ee7b7; }
.share-btn.copied .share-svg { opacity: 1; color: #6ee7b7; }

.sidebar-right-bottom {
  padding: 16px 14px; display: flex; flex-direction: column; gap: 0;
}
.sidebar-right-bottom .room-title {
  font-family: 'Bebas Neue', sans-serif; font-size: 13px;
  letter-spacing: 1px; color: var(--muted); margin-bottom: 8px;
  text-transform: uppercase;
}
.room-stat {
  display: flex; align-items: center; justify-content: space-between;
  font-family: 'Inter', sans-serif; font-size: 11px;
  color: rgba(255,255,255,.35); padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.03);
}
.room-stat:last-child { border-bottom: none; }
.room-stat .stat-val { color: rgba(255,255,255,.7); font-weight: 500; font-size: 11px; }
.room-stat .status-connected { color: #34d399; }
.room-stat .status-offline { color: #f87171; }
.q-bar { display: inline-block; width: 10px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.08); margin-right: 2px; }
.q-bar.fill { background: var(--accent); }

/* ═══ TOP BAR ═══ */
.topbar {
  position: relative; z-index: 100; flex-shrink: 0; width: 100%; max-width: 1200px;
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: #0c1118; border-bottom: 1px solid rgba(255,255,255,.04);
}
.topbar .logo {
  font-family: 'Bebas Neue', sans-serif; font-size: 18px;
  letter-spacing: 1px; color: var(--accent); text-decoration: none;
}
.topbar .logo span { color: rgba(255,255,255,.25); }
.topbar .badge {
  font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 700;
  padding: 3px 8px; border-radius: 4px; letter-spacing: 1px;
  background: rgba(52,211,153,.12); color: var(--accent);
  border: 1px solid rgba(52,211,153,.2);
}
.topbar .spacer { flex: 1; }
.topbar button {
  font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 500;
  padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.03); color: rgba(255,255,255,.5);
  cursor: pointer; transition: all .2s;
}
.topbar button:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.75); }
.topbar button.active { background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.25); color: var(--accent); }
.topbar .live-dot {
  display: flex; align-items: center; gap: 5px; cursor: pointer;
  font-family: 'Inter', sans-serif; font-size: 9px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .5px; color: var(--accent);
}
.topbar .live-dot::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px rgba(52,211,153,.5);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ═══ HAMBURGER MENU ═══ */
.hamburger-btn {
  font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
  color: rgba(255,255,255,.5); width: 32px; height: 32px; border-radius: 6px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .2s; padding: 0; line-height: 1;
}
.hamburger-btn:hover { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.15); }
.hamburger-dropdown {
  position: absolute; top: 100%; right: 0; margin-top: 6px;
  background: #161e28; border: 1px solid rgba(255,255,255,.08);
  border-radius: 8px; padding: 6px; min-width: 180px; z-index: 200;
  box-shadow: 0 8px 32px rgba(0,0,0,.3);
  display: none; flex-direction: column;
}
.hamburger-dropdown.open { display: flex; }
.hamburger-dropdown a {
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
  padding: 8px 12px; border-radius: 6px; color: #d4d4d8;
  text-decoration: none; transition: all .15s;
}
.hamburger-dropdown a:hover { background: rgba(255,255,255,.06); color: #fff; }
.hamburger-dropdown hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }

/* ═══ MAIN STAGE ═══ */
/* (redefined above in layout) */
@keyframes fadeInUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
@keyframes spkPop { 0%{opacity:0;transform:scale(.7)} 60%{transform:scale(1.1)} 100%{opacity:1;transform:scale(1)} }
@keyframes lineSlideIn { from{opacity:0;transform:translateX(-16px)} to{opacity:1;transform:translateX(0)} }
@keyframes transMorph { 0%{opacity:0;filter:blur(4px)} 50%{opacity:.6} 100%{opacity:1;filter:blur(0)} }
@keyframes particleBurst {
  0%{transform:scale(0);opacity:1}
  100%{transform:scale(1.5);opacity:0}
}
@keyframes glowPulse {
  0%,100%{box-shadow:0 0 4px var(--accent)}
  50%{box-shadow:0 0 16px var(--accent),0 0 32px rgba(52,211,153,.3)}
}
.sim-particle {
  position: absolute; width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent); pointer-events: none; z-index: 10;
  animation: particleBurst .6s ease-out forwards;
}
.sim-glow { animation: glowPulse .6s ease-out; }
.sim-slide-in { animation: lineSlideIn .35s cubic-bezier(.4,0,.2,1) both; }
.sim-trans-morph { animation: transMorph .5s ease-out both; }

/* ═══ HEADER ═══ */
.studio-hdr {
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  padding: 16px 24px; background: rgba(255,255,255,.015);
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.studio-hdr .st-name {
  font-family: 'Bebas Neue', sans-serif; font-size: 22px;
  letter-spacing: 1px; color: var(--accent); line-height: 1;
  cursor: pointer; user-select: none; position: relative;
  transition: color .2s;
}
.studio-hdr .st-name:hover { opacity: .8; }
.studio-hdr .st-name::after {
  content: ' ▾'; font-size: 14px; opacity: .5;
}
.studio-hdr .spk-count {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: var(--muted2); background: rgba(255,255,255,.03);
  padding: 3px 8px; border-radius: 4px;
}

/* ═══ CAPTION LINES ═══ */
.studio-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 0; min-height: 320px; }
.studio-line {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px; border-left: 3px solid transparent;
  border-radius: 0 6px 6px 0; margin-bottom: 2px;
  transition: background .2s; animation: fadeInUp .4s both;
}
.studio-line:hover { background: rgba(255,255,255,.015); }
.studio-line:nth-child(1) { animation-delay: 0s; }
.studio-line:nth-child(2) { animation-delay: .05s; }
.studio-line:nth-child(3) { animation-delay: .1s; }
.studio-line:nth-child(4) { animation-delay: .15s; }
.studio-line:nth-child(5) { animation-delay: .2s; }
.studio-line:nth-child(6) { animation-delay: .25s; }
.studio-line.new-speaker { animation: spkPop .4s cubic-bezier(.4,0,.2,1); }

.studio-spk {
  flex-shrink: 0; min-width: 40px; font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px;
  text-align: center; letter-spacing: .5px;
}
.studio-ts {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--muted2); flex-shrink: 0; padding-top: 4px; min-width: 56px;
}
.studio-content { flex: 1; min-width: 0; }
.studio-orig {
  font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 400;
  line-height: 1.5; color: var(--text);
}
.studio-trans {
  font-family: 'Work Sans', sans-serif; font-size: 13px; font-weight: 400;
  line-height: 1.5; color: var(--muted); font-style: italic; margin-top: 3px;
}

/* Speaker color assignments */
.spk-en { border-left-color: rgba(107,157,255,.35); }
.spk-en .studio-spk { background: rgba(107,157,255,.12); color: #8ab4ff; }
.spk-it { border-left-color: rgba(248,113,113,.35); }
.spk-it .studio-spk { background: rgba(248,113,113,.12); color: #f99; }
.spk-fr { border-left-color: rgba(96,165,250,.35); }
.spk-fr .studio-spk { background: rgba(96,165,250,.12); color: #93c5fd; }
.spk-de { border-left-color: rgba(52,211,153,.35); }
.spk-de .studio-spk { background: rgba(52,211,153,.12); color: #6ee7b7; }
.spk-es { border-left-color: rgba(251,191,36,.35); }
.spk-es .studio-spk { background: rgba(251,191,36,.12); color: #fcd34d; }
.spk-zh { border-left-color: rgba(244,114,182,.35); }
.spk-zh .studio-spk { background: rgba(244,114,182,.12); color: #f9a8d4; }
.spk-ar { border-left-color: rgba(167,139,250,.35); }
.spk-ar .studio-spk { background: rgba(167,139,250,.12); color: #c4b5fd; }

/* ═══ MODE PICKER DROPDOWN ═══ */
.mode-picker { position: relative; display: inline-flex; align-items: center; gap: 10px; }
.mode-dropdown {
  position: absolute; top: 100%; left: 0; margin-top: 8px;
  background: #121620; border: 1px solid #1e2430; border-radius: 12px;
  padding: 6px; min-width: 210px; z-index: 200;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  display: none; animation: slideUp .2s cubic-bezier(.4,0,.2,1);
}
.mode-dropdown.open { display: block; }
.mode-dropdown button {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 14px; border: none; border-radius: 8px;
  background: transparent; color: rgba(255,255,255,.6);
  font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all .15s; text-align: left;
}
.mode-dropdown button:hover { background: rgba(255,255,255,.04); color: #fff; }
.mode-dropdown button.active { background: rgba(52,211,153,.08); color: var(--accent); font-weight: 600; }
.mode-dropdown .mode-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.mode-dropdown .mode-badge { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: rgba(255,255,255,.25); margin-left: auto; }

/* Empty state */
.studio-empty {
  font-family: 'Work Sans', sans-serif; font-size: 15px;
  color: var(--muted); padding: 60px 20px; text-align: center;
  font-style: italic;
}

/* ═══ CONTROLS ═══ */
.studio-ctrl {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  padding: 14px 24px; border-top: 1px solid rgba(255,255,255,.04);
  background: rgba(255,255,255,.01); flex-wrap: wrap;
}
.ctrl-label {
  font-family: 'JetBrains Mono', monospace; font-size: 8px;
  color: var(--muted2); text-transform: uppercase;
  letter-spacing: 2px; margin-right: 4px;
}
.lang-btn {
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05);
  color: rgba(255,255,255,.35); padding: 6px 12px; border-radius: 6px;
  cursor: pointer; font-family: 'Inter', sans-serif; font-size: 10px;
  font-weight: 500; transition: all .2s;
}
.lang-btn:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.6); }
.lang-btn.active {
  background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.25);
  color: var(--accent); font-weight: 700;
}

.action-btn {
  padding: 10px 24px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1);
  cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 15px;
  letter-spacing: 1.5px; transition: all .25s; margin-left: auto;
  background: rgba(255,255,255,.06); color: rgba(255,255,255,.7);
}
.action-btn:hover {
  background: rgba(255,255,255,.1); transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(0,0,0,.3);
}
.action-btn.primary {
  background: var(--accent); color: #000; border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(52,211,153,.25);
}
.action-btn.primary:hover { box-shadow: 0 6px 24px rgba(52,211,153,.35); }
.action-btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.sim-btn {
  background: rgba(52,211,153,.08); border: 1px solid rgba(52,211,153,.2);
  color: var(--accent2); font-family: 'Work Sans', sans-serif;
  font-size: 10px; font-weight: 600; padding: 6px 14px; border-radius: 6px;
  cursor: pointer; transition: all .2s;
}
.sim-btn:hover { background: rgba(52,211,153,.15); }

/* ═══ MODAL ═══ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 999;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal-panel {
  background: #121620; border: 1px solid #1e2430; border-radius: 16px;
  width: 480px; max-width: 94vw; max-height: 85vh; overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,.6);
  animation: slideUp .25s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px; border-bottom: 1px solid #1e2430;
}
.modal-head h3 {
  font-family: 'Bebas Neue', sans-serif; font-size: 20px;
  letter-spacing: 1px; color: #e8eaed;
}
.modal-close {
  background: none; border: none; color: #555; font-size: 20px;
  cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all .2s;
}
.modal-close:hover { background: rgba(248,113,113,.1); color: var(--danger); }
.modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 16px 22px; border-top: 1px solid #1e2430;
}
.modal-foot button {
  padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer;
  font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px;
}
.btn-cancel { background: transparent; color: rgba(255,255,255,.4); }
.btn-cancel:hover { color: rgba(255,255,255,.7); background: rgba(255,255,255,.03); }
.btn-apply { background: #7c3aed; color: #fff; }
.btn-apply:hover { background: #6d28d9; box-shadow: 0 4px 16px rgba(124,58,237,.3); }

/* Mode toggle */
.mode-toggle { display: flex; background: #0a0d14; border-radius: 10px; padding: 3px; gap: 2px; }
.mode-opt {
  flex: 1; padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer;
  font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 600;
  transition: all .25s; text-align: center; color: rgba(255,255,255,.35);
  background: transparent;
}
.mode-opt:hover { color: rgba(255,255,255,.6); }
.mode-opt.active { background: #1a1f2e; color: #e8eaed; box-shadow: 0 2px 8px rgba(0,0,0,.3); }

/* Speaker row in modal */
.spk-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: #0a0d14; border-radius: 10px; border: 1px solid #1a1f2e;
}
.spk-row input {
  width: 56px; padding: 6px 8px; border-radius: 6px; border: 1px solid #1e2430;
  background: #0f1219; color: #e8eaed; font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700; text-align: center; outline: none;
}
.spk-row select {
  flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #1e2430;

<script>
// ═══ Speaker data ═══
var SPK_COLORS = ['#6b9dff','#f87171','#34d399','#fbbf24','#f472b6','#a78bfa','#60a5fa','#fb923c'];
var SPK_TAGS = ['EN','IT','FR','DE','ES','ZH','AR','NL'];
var SPK_CLASSES = ['en','it','fr','de','es','zh','ar','nl'];
var LANGS = ['Auto-detect','English','Italiano','Français','Deutsch','Español','Português','Nederlands','中文','日本語','العربية','Русский','한국어'];
var LANG_CODES = ['auto','en','it','fr','de','es','pt','nl','zh','ja','ar','ru','ko'];

var speakers = [
  { tag: 'SPK1', native: 'auto', color: '#6b9dff' }
];
var isLive = true;
var sessionActive = false;
var lineCounter = 0;

// ═══ Persistent line data (survives across speaker changes) ═══
var _lineData = [];

// ═══ Sample data (used only for initial population) ═══
var SAMPLES = [
  { en: 'we are discussing the future of real‑time translation',

    pt: 'os avanços na tradução automática neural são notáveis',
    nl: 'de vooruitgang in neurale machinevertaling is opmerkelijk' },
  { en: 'let us begin this roundtable on language technology',
    it: 'iniziamo questa tavola rotonda sulla tecnologia linguistica',
    fr: 'commençons cette table ronde sur la technologie du langage',
    de: 'beginnen wir diese Gesprächsrunde über Sprachtechnologie',
    es: 'comencemos esta mesa redonda sobre tecnología del lenguaje',
    pt: 'vamos começar esta mesa redonda sobre tecnologia da linguagem',
    nl: 'laten we deze rondetafel over taaltechnologie beginnen' },
];

// ═══ Render caption lines (preserves existing text!) ═══
function renderLines() {
  var container = document.getElementById('captionLines');
  if (!container) return;
  if (speakers.length === 0) {
    container.innerHTML = '<div class="studio-empty">Nessuno speaker configurato. Clicca ⚙ Setup.</div>';
    _lineData = [];
    return;
  }

  // If no stored data, initialise from samples
  if (_lineData.length === 0) {
    var targetLines = speakers.length;
    for (var i = 0; i < targetLines; i++) {
      _lineData.push({ en: SAMPLES[i].en, tr: SAMPLES[i][currentTargetLang] || SAMPLES[i].it });
    }
  }

  // Ensure we have at least speakers.length lines
  var targetLines2 = speakers.length;
  while (_lineData.length < targetLines2) {
    var si2 = _lineData.length % SAMPLES.length;
    _lineData.push({ en: SAMPLES[si2].en, tr: SAMPLES[si2][currentTargetLang] || SAMPLES[si2].it });
  }

  var html = '';
  var baseTime = new Date();
  baseTime.setHours(3, 42, 0);

  for (var i = 0; i < _lineData.length; i++) {
    var si = i % speakers.length;
    var spk = speakers[si];
    var spkClass = SPK_CLASSES[SPK_TAGS.indexOf(spk.tag)] || spk.tag.toLowerCase();
    var ts = new Date(baseTime.getTime() + i * 3000);
    var tsStr = ts.toTimeString().substring(0,8);
    var line = _lineData[i];

    html += '<div class="studio-line spk-'+spkClass+'">';
    html += '<span class="studio-spk" style="background:'+hexToRgba(spk.color,.12)+';color:'+lighten(spk.color,1.3)+'">'+spk.tag+'</span>';
    html += '<span class="studio-ts">'+tsStr+'</span>';
    html += '<div class="studio-content">';
    html += '<div class="studio-orig">'+line.en+'</div>';
    html += '<div class="studio-trans">'+line.tr+'</div>';
    html += '</div></div>';
  }
  container.innerHTML = html;
  document.getElementById('spkCount').textContent = speakers.length + ' SPK';
  updateSpeakerSidebar();
  updateRoomInfo();
  
  // ═══ Attach speaker badge click handlers ═══
  setTimeout(function() {
    container.querySelectorAll('.studio-spk').forEach(function(badge) {
      badge.style.cursor = 'pointer';
      badge.title = 'Click to rename, double-click for full setup';
      badge.addEventListener('click', function(e) {
        e.stopPropagation();
        var oldName = this.textContent.trim();
        var newName = prompt('Rename speaker "' + oldName + '":', oldName);
        if (newName && newName !== oldName) {
          // Update speaker data
          for (var s = 0; s < speakers.length; s++) {
            if (speakers[s].tag === oldName) { speakers[s].tag = newName; break; }
          }
          renderLines();
          showToast('Speaker: ' + oldName + ' → ' + newName);
        }
      });
      badge.addEventListener('dblclick', function(e) {
        e.stopPropagation();
        openSpeakerConfig();
      });
    });
    
    // ═══ Line hover highlights ═══
    container.querySelectorAll('.studio-line').forEach(function(line) {
      line.addEventListener('mouseenter', function() { this.style.background = 'rgba(255,255,255,.02)'; });
      line.addEventListener('mouseleave', function() { this.style.background = ''; });
    });
  }, 50);
}

function hexToRgba(hex, a) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function lighten(hex, f) {
  var r = Math.min(255,Math.round(parseInt(hex.slice(1,3),16)*f));
  var g = Math.min(255,Math.round(parseInt(hex.slice(3,5),16)*f));
  var b = Math.min(255,Math.round(parseInt(hex.slice(5,7),16)*f));
  return '#'+[r,g,b].map(function(x){var h=x.toString(16);return h.length===1?'0'+h:h;}).join('');
}

// ═══ Speaker Config Modal ═══
function openSpeakerConfig() {
  var existing = document.querySelector('.modal-overlay');
  if (existing) existing.remove();
  
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  
  var modeNameEl = document.getElementById('modeName');
  var currentModeName = modeNameEl ? modeNameEl.textContent : 'Speakers';
  var html = '<div class="modal-panel">';
  html += '<div class="modal-head"><h3>⚙ Speaker Setup — '+currentModeName+'</h3><button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">✕</button></div>';
  html += '<div class="modal-body">';
  
  // Speakers list — no Auto/Manual toggle, always manual mode
  html += '<div style="display:flex;flex-direction:column;gap:8px">';
  html += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px">Speakers ('+speakers.length+')</span>';
  speakers.forEach(function(spk, i) {
    html += '<div class="spk-row">';
    html += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:rgba(255,255,255,.15);width:20px">#'+(i+1)+'</span>';
    html += '<input value="'+spk.tag+'" maxlength="6" onchange="updateSpeaker('+i+',\'tag\',this.value)">';
    html += '<select onchange="updateSpeaker('+i+',\'native\',this.value)">';
    LANG_CODES.forEach(function(lc, li) {
      html += '<option value="'+lc+'"'+(spk.native===lc?' selected':'')+'>'+LANGS[li]+'</option>';
    });
    html += '</select>';
    html += '<span class="color-dot" style="background:'+spk.color+'" onclick="cycleSpeakerColor('+i+',this)"></span>';
    html += '<button onclick="removeSpeaker('+i+')">✕</button>';
    html += '</div>';
  });
  html += '<button class="add-spk-btn" onclick="addSpeaker()">+ Add Speaker</button>';
  html += '</div>';
  
  html += '</div>';
  html += '<div class="modal-foot">';
  html += '<button class="btn-cancel" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>';
  html += '<button class="btn-apply" onclick="applyConfig();this.closest(\'.modal-overlay\').remove()">Apply</button>';
  html += '</div>';
  html += '</div>';
  
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
}

function updateSpeaker(idx, field, value) {
  if (field === 'tag') speakers[idx].tag = value;
  if (field === 'native') speakers[idx].native = value;
}

function cycleSpeakerColor(idx, dot) {
  var current = speakers[idx].color;
  var ci = SPK_COLORS.indexOf(current);
  var next = SPK_COLORS[(ci + 1) % SPK_COLORS.length];
  speakers[idx].color = next;
  dot.style.background = next;
}

function addSpeaker() {
  var newColor = SPK_COLORS[speakers.length % SPK_COLORS.length];
  var newTag = SPK_TAGS[speakers.length % SPK_TAGS.length];
  speakers.push({ tag: newTag, native: 'auto', color: newColor });
  // Rebuild modal
  var overlay = document.querySelector('.modal-overlay');
  if (overlay) overlay.remove();
  openSpeakerConfig();
}

function removeSpeaker(idx) {
  if (speakers.length <= 1) { showToast('Need at least 1 speaker'); return; }
  speakers.splice(idx, 1);
  var overlay = document.querySelector('.modal-overlay');
  if (overlay) overlay.remove();
  openSpeakerConfig();
}

function applyConfig() {
  renderLines();
  // Auto-detect mode from speaker count
  var count = speakers.length;
  var detectedMode;
  if (count <= 2) detectedMode = 'w2';
  else if (count === 3) detectedMode = 'w3';
  else if (count === 4) detectedMode = 'w4';
  else if (count === 5) detectedMode = 'w5';
  else detectedMode = 'wx';
  
  if (detectedMode !== currentMode) {
    switchMode(detectedMode);
  }
  showToast('✓ Speaker config applied — ' + speakers.length + ' speakers');
}

// ═══ Elaborate Simulation — staggered animations ═══
var _simRunning = false;

function runSimulation() {
  if (_simRunning) return;
  _simRunning = true;
  var btn = document.querySelector('.sim-btn');
  var origText = btn.textContent;
  btn.textContent = '⏳ Simulating…';
  btn.style.pointerEvents = 'none';
  
  // Add a new speaker if possible
  var usedTags = speakers.map(function(s) { return s.tag; });
  var available = SPK_TAGS.filter(function(t) { return usedTags.indexOf(t) === -1; });
  var newSpeakerAdded = false;
  if (available.length > 0) {
    var newTag = available[Math.floor(Math.random() * available.length)];
    var newColor = SPK_COLORS[speakers.length % SPK_COLORS.length];
    speakers.push({ tag: newTag, native: 'auto', color: newColor });
    newSpeakerAdded = true;
  }
  
  // Add 3 new lines with staggered animation
  var newLines = [];
  for (var n = 0; n < 3; n++) {
    var si = _lineData.length % SAMPLES.length;
    newLines.push({ en: SAMPLES[si].en, tr: SAMPLES[si][currentTargetLang] || SAMPLES[si].it });
    _lineData.push({ en: SAMPLES[si].en, tr: SAMPLES[si][currentTargetLang] || SAMPLES[si].it });
  }
  
  // Re-render with speaker sidebar
  renderLines();
  updateSpeakerSidebar();
  updateRoomInfo();
  
  // Animate new lines with staggered delays
  setTimeout(function() {
    var allLines = document.querySelectorAll('.studio-line');
    var container = document.getElementById('captionLines');
    // Animate last 3 lines
    var start = Math.max(0, allLines.length - 3);
    for (var i = start; i < allLines.length; i++) {
      (function(line, delay) {
        setTimeout(function() {
          line.classList.add('sim-slide-in');
          // Particle burst on the speaker badge
          var badge = line.querySelector('.studio-spk');
          if (badge) spawnParticles(badge);
        }, delay);
      })(allLines[i], (i - start) * 200);
    }
    // Scroll to bottom
    if (container) {
      container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
    }
    // Glow effect on the stage
    var stage = document.querySelector('.stage');
    if (stage) {
      stage.classList.add('sim-glow');
      setTimeout(function() { stage.classList.remove('sim-glow'); }, 600);
    }
    
    // Flash the new speaker tag in sidebar
    if (newSpeakerAdded) {
      var lastTag = document.querySelector('.spk-tag-pill:last-child');
      if (lastTag) {
        lastTag.style.background = 'rgba(52,211,153,.15)';
        lastTag.style.borderColor = 'var(--accent)';
        setTimeout(function() { lastTag.style.background = ''; lastTag.style.borderColor = ''; }, 800);
      }
      showToast('🎙 New voice: ' + speakers[speakers.length-1].tag);
    } else {
      showToast('🎙 Simulation complete — 3 new lines');
    }
    
    btn.textContent = origText;
    btn.style.pointerEvents = '';
    _simRunning = false;
  }, 600);
}

function spawnParticles(el) {
  var rect = el.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;
  var colors = ['#34d399','#6ee7b7','#a7f3d0','#fbbf24'];
  for (var p = 0; p < 8; p++) {
    var particle = document.createElement('div');
    particle.className = 'sim-particle';
    var angle = (Math.PI * 2 * p) / 8;
    var dist = 20 + Math.random() * 30;
    particle.style.left = (cx + Math.cos(angle) * dist) + 'px';
    particle.style.top = (cy + Math.sin(angle) * dist) + 'px';
    particle.style.background = colors[p % colors.length];
    particle.style.width = (2 + Math.random() * 4) + 'px';
    particle.style.height = particle.style.width;
    particle.style.animationDuration = (0.4 + Math.random() * 0.4) + 's';
    document.body.appendChild(particle);
    setTimeout(function() { particle.remove(); }, 800);
  }
}

// ═══ Speaker sidebar ═══
function updateSpeakerSidebar() {
  var list = document.getElementById('speakerTagList');
  if (!list) return;
  var html = '';
  speakers.forEach(function(spk, i) {
    html += '<div class="spk-tag-pill" onclick="startEditSpeakerTag('+i+',this)" data-idx="'+i+'">';
    html += '<span class="spk-tag-dot" style="background:'+spk.color+';color:'+spk.color+'"></span>';
    html += '<span class="spk-tag-name">'+spk.tag+'</span>';
    html += '<input class="spk-tag-edit" value="'+spk.tag+'" maxlength="8" onblur="finishEditSpeakerTag('+i+',this)" onkeydown="if(event.key===\'Enter\')this.blur()">';
    html += '</div>';
  });
  list.innerHTML = html;
  document.getElementById('sidebarSpkCount').textContent = speakers.length;
}

function startEditSpeakerTag(idx, el) {
  el.classList.add('editing');
  var input = el.querySelector('.spk-tag-edit');
  input.focus();
  input.select();
}

function finishEditSpeakerTag(idx, input) {
  var newName = input.value.trim();
  if (!newName || newName === speakers[idx].tag) {
    // revert
    input.closest('.spk-tag-pill').classList.remove('editing');
    return;
  }
  var oldName = speakers[idx].tag;
  speakers[idx].tag = newName;
  // Update all _lineData to reflect new speaker assignment — actually just re-render
  renderLines();
  updateSpeakerSidebar();
  updateRoomInfo();
  showToast('✏ ' + oldName + ' → ' + newName);
}

// ═══ Room info ═══
function updateRoomInfo() {
  var modeLabels = { w2: 'Duet', w3: 'Triad', w4: 'Quad', w5: 'Quintet', wx: 'Universal' };
  var elMode = document.getElementById('roomMode');
  var elSpk = document.getElementById('roomSpeakers');
  var elTarget = document.getElementById('roomTarget');
  var elStatus = document.getElementById('roomStatus');
  var elMic = document.getElementById('roomMicState');
  var elQuality = document.getElementById('roomQuality');
  if (elMode) elMode.textContent = modeLabels[currentMode] || 'Universal';
  if (elSpk) elSpk.textContent = speakers.length;
  if (elTarget) elTarget.textContent = currentTargetLang.toUpperCase();
  if (elStatus) {
    elStatus.textContent = '● Connected';
    elStatus.className = 'stat-val status-connected';
  }
  if (elMic) {
    elMic.textContent = isLive ? 'Live' : 'Muted';
    elMic.style.color = isLive ? '' : '#f87171';
  }
  if (elQuality) {
    elQuality.innerHTML = '<span class="q-bar fill"></span><span class="q-bar fill"></span><span class="q-bar fill"></span>';
  }
}

// ═══ Share room ═══
function shareRoom(channel) {
  var url = window.location.href;
  var text = 'Join my Sottotitoli translation room';
  var shareUrl;
  switch(channel) {
    case 'whatsapp':
      shareUrl = 'https://wa.me/?text=' + encodeURIComponent(text + ' ' + url);
      break;
    case 'email':
      shareUrl = 'mailto:?subject=' + encodeURIComponent(text) + '&body=' + encodeURIComponent(url);
      break;
    case 'telegram':
      shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
      break;
    case 'copy':
      navigator.clipboard.writeText(url).then(function() {
        var btn = document.getElementById('copyLinkBtn');
        btn.classList.add('copied');
        var svg = btn.querySelector('.share-svg');
        if (svg) svg.style.color = '#6ee7b7';
        setTimeout(function() { btn.classList.remove('copied'); if (svg) svg.style.color = ''; }, 2000);
        showToast('📋 Link copied!');
      }).catch(function() {
        showToast('⚠ Copy failed');
      });
      return;
  }
  if (shareUrl) window.open(shareUrl, '_blank');
}

// ═══ Language toggle — switches translation language ═══
document.querySelectorAll('.lang-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
    var lang = this.getAttribute('data-lang');
    currentTargetLang = lang.toLowerCase();
    // Update all _lineData translations to new target language
    for (var i = 0; i < _lineData.length; i++) {
      var sidx = i % SAMPLES.length;
      _lineData[i].tr = SAMPLES[sidx][currentTargetLang] || SAMPLES[sidx].it;
    }
    // Update room info
    document.getElementById('roomTarget').textContent = lang;
    // Flash all translations to indicate refresh with morph animation
    document.querySelectorAll('.studio-trans').forEach(function(t) {
      t.classList.add('sim-trans-morph');
      setTimeout(function() { t.classList.remove('sim-trans-morph'); }, 500);
    });
    // Re-render
    renderLinesKeepScroll();
    showToast('🌐 Target: ' + lang);
  });
});

// Render without resetting scroll
function renderLinesKeepScroll() {
  var container = document.getElementById('captionLines');
  var scrollTop = container ? container.scrollTop : 0;
  renderLines();
  if (container) container.scrollTop = scrollTop;
}

// ═══ Session toggle with real mic ═══
function toggleSession() {
  sessionActive = !sessionActive;
  var btn = document.getElementById('startBtn');
  if (sessionActive) {
    startRealMic().then(function(ok) {
      if (!ok) { sessionActive = false; btn.textContent = '▶ START'; btn.classList.add('primary'); btn.classList.remove('danger'); return; }
      btn.textContent = '⏹ STOP'; btn.classList.add('danger'); btn.classList.remove('primary');
      showToast('▶ Session started — mic live');
    });
  } else {
    stopRealMic();
    btn.textContent = '▶ START'; btn.classList.add('primary'); btn.classList.remove('danger');
    showToast('⏹ Session stopped');
  }
}
if (typeof updateMicUI === 'function') updateMicUI('idle');
_realMic.onFinal = function(text) {
  if (speakers.length === 0) return;
  _lineData.push({ en: text, tr: '' });
  if (currentMode === 'wx' && _lineData.length > speakers.length * 3 && speakers.length < 10) {
    var n = speakers.length + 1;
    speakers.push({ tag: 'SPK'+n, native: 'auto', color: SPK_COLORS[(n-1)%SPK_COLORS.length] });
    updateSpeakerSidebar();
  }
  renderLines();
  updateRoomInfo();
};
// Fix room mic state
var _origUpdateRoomInfo = updateRoomInfo;
updateRoomInfo = function() {
  _origUpdateRoomInfo();
  var elMic = document.getElementById('roomMicState');
  if (elMic) { elMic.textContent = _realMic.state === 'live' ? 'Live' : 'Off'; elMic.style.color = _realMic.state === 'live' ? '' : '#f87171'; }
};

// ═══ LIVE toggle ═══
function toggleLive() {
  isLive = !isLive;
  var el = document.getElementById('liveIndicator');
  if (isLive) {
    el.textContent = 'LIVE';
    el.style.color = '';
  } else {
    el.textContent = 'PAUSED';
    el.style.color = '#f87171';
  }
}

// ═══ Toast ═══
function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function() { t.remove(); }, 300); }, 2000);
}

// ═══ Mode Picker ═══
var currentTargetLang = 'it'; // default target language

var currentMode = 'wx';
var MODE_CONFIGS = {
  w2: { name: 'W2 · Duet', accent: '#6b9dff', accent2: '#8ab4ff', bg: '#0a0f1a',
    speakers: [{tag:'EN',native:'en',color:'#6b9dff'},{tag:'IT',native:'it',color:'#f87171'}] },
  w3: { name: 'W3 · Triad', accent: '#a78bfa', accent2: '#c4b5fd', bg: '#0f0a1a',
    speakers: [{tag:'A',native:'auto',color:'#a78bfa'},{tag:'B',native:'auto',color:'#60a5fa'},{tag:'C',native:'auto',color:'#34d399'}] },
  w4: { name: 'W4 · Quad', accent: '#34d399', accent2: '#6ee7b7', bg: '#050a08',
    speakers: [{tag:'EN',native:'en',color:'#6b9dff'},{tag:'IT',native:'it',color:'#f87171'},{tag:'FR',native:'fr',color:'#60a5fa'},{tag:'DE',native:'de',color:'#34d399'}] },
  w5: { name: 'W5 · Quintet', accent: '#fbbf24', accent2: '#fcd34d', bg: '#0f0a05',
    speakers: [{tag:'EN',native:'en',color:'#6b9dff'},{tag:'IT',native:'it',color:'#f87171'},{tag:'ES',native:'es',color:'#fbbf24'},{tag:'ZH',native:'zh',color:'#f472b6'},{tag:'AR',native:'ar',color:'#34d399'}] },
  wx: { name: 'WX · Universal', accent: '#34d399', accent2: '#6ee7b7', bg: '#0a0f14',
    speakers: [{tag:'SPK1',native:'auto',color:'#6b9dff'}] }
};

function switchMode(modeId) {
  currentMode = modeId;
  var cfg = MODE_CONFIGS[modeId];
  if (!cfg) return;
  
  // Update accent CSS variables
  var root = document.documentElement;
  root.style.setProperty('--accent', cfg.accent);
  root.style.setProperty('--accent2', cfg.accent2);
  document.body.style.background = cfg.bg;
  
  // Update speakers (preserve line data if content exists)
  var hadContent = _lineData.length > 0;
  speakers = JSON.parse(JSON.stringify(cfg.speakers));
  if (hadContent) {
    // Re-assign speakers to existing lines and regenerate
    // _lineData is preserved, renderLines will use it
  }
  
  // Update UI
  document.getElementById('modeName').textContent = cfg.name;
  var badge = document.getElementById('modeBadge');
  var modeLabels = { w2: 'Duet', w3: 'Triad', w4: 'Quad', w5: 'Quintet', wx: 'Universal' };
  if (badge) { badge.textContent = modeLabels[modeId] || 'Universal'; badge.className = 'badge'; }
  
  // Update dropdown active state
  document.querySelectorAll('.mode-dropdown button').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-mode') === modeId);
  });
  
  // Close dropdown
  document.getElementById('modeDropdown').classList.remove('open');
  
  // Update speaker colors for language buttons
  document.querySelectorAll('.lang-btn.active').forEach(function(b) {
    b.style.background = hexToRgba(cfg.accent, .12);
    b.style.borderColor = hexToRgba(cfg.accent, .25);
    b.style.color = cfg.accent2;
  });
  
  renderLines();
  updateRoomInfo();
  showToast('✓ Switched to ' + cfg.name);
}

function toggleModePicker() {
  var dd = document.getElementById('modeDropdown');
  dd.classList.toggle('open');
}

// Close mode dropdown when clicking outside
document.addEventListener('click', function(e) {
  var dd = document.getElementById('modeDropdown');
  if (!dd || !dd.classList.contains('open')) return;
  var picker = document.querySelector('.mode-picker');
  if (picker && !picker.contains(e.target)) {
    dd.classList.remove('open');
  }
});

// ═══ Keyboard shortcuts ═══
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { var m = document.querySelector('.modal-overlay'); if (m) m.remove(); }
  if (e.key === ' ' && e.ctrlKey) { e.preventDefault(); toggleSession(); }
});

// ═══ Hamburger menu ═══
function toggleHamburger() {
  var dd = document.getElementById('hamburgerDropdown');
  if (!dd) return;
  dd.classList.toggle('open');
}
document.addEventListener('click', function(e) {
  var menu = document.querySelector('.hamburger-menu');
  if (!menu) return;
  if (!menu.contains(e.target)) {
    var dd = document.getElementById('hamburgerDropdown');
    if (dd && dd.classList.contains('open')) dd.classList.remove('open');
  }
});

// ═══ Theme toggle ═══
function toggleTheme() {
  var h = document.documentElement;
  var t = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', t);
  updateThemeUI(t);
  localStorage.setItem('sottotitoli-traduzione-theme', t);
}
function updateThemeUI(t) {
  var hamburgerLink = document.querySelector('.hamburger-dropdown a[href="#"]');
  if (hamburgerLink) hamburgerLink.textContent = t === 'dark' ? '☀️ Light mode' : '🌙 Dark mode';
  var body = document.body;
  var sidebars = document.querySelectorAll('.sidebar-left, .sidebar-right');
  var topbar = document.querySelector('.topbar');
  if (t === 'light') {
    body.style.background = '#f8f6f2';
    body.style.color = '#1a1a1a';
    if (topbar) topbar.style.background = '#fff';
    sidebars.forEach(function(el) { el.style.background = '#f5f3ef'; });
    // Fix share buttons readable in light mode
    document.querySelectorAll('.share-btn').forEach(function(el) {
      el.style.color = '#444'; el.style.borderColor = '#d9d5cc';
    });
    document.querySelectorAll('.share-btn .share-svg').forEach(function(el) { el.style.opacity = '0.6'; });
    document.querySelectorAll('.room-stat .stat-val').forEach(function(el) { el.style.color = '#1a1a1a'; });
    document.querySelectorAll('.room-stat').forEach(function(el) { el.style.color = '#666'; });
    document.querySelectorAll('.room-title,.share-title').forEach(function(el) { el.style.color = '#555'; });
    // Stage wrapper
    var sw = document.querySelector('.stage-wrapper');
    if (sw) sw.style.background = '#faf8f5';
    document.querySelectorAll('.studio-orig').forEach(function(el) { el.style.color = '#1a1a1a'; });
    document.querySelectorAll('.studio-trans').forEach(function(el) { el.style.color = '#555'; });
    document.querySelectorAll('.st-name').forEach(function(el) { el.style.color = '#1a1a1a'; });
    document.querySelectorAll('.hamburger-btn').forEach(function(el) { el.style.color = '#555'; el.style.borderColor = '#d9d5cc'; });
    document.querySelectorAll('.hamburger-dropdown a').forEach(function(el) { el.style.color = '#555'; });
    document.querySelectorAll('.spk-tag-name').forEach(function(el) { el.style.color = '#1a1a1a'; });
    document.querySelectorAll('.sidebar-left-head').forEach(function(el) { el.style.color = '#1a1a1a'; });
    document.querySelectorAll('.ctrl-label').forEach(function(el) { el.style.color = '#999'; });
    document.querySelectorAll('.lang-btn').forEach(function(el) { el.style.color = '#555'; el.style.borderColor = '#d9d5cc'; });
  } else {
    body.style.background = '#0a0f14';
    body.style.color = '#d4d4d8';
    if (topbar) topbar.style.background = '#0c1118';
    sidebars.forEach(function(el) { el.style.background = '#0c1118'; });
    // Reset all light-mode overrides
    document.querySelectorAll('.share-btn').forEach(function(el) { el.style.color = ''; el.style.borderColor = ''; });
    document.querySelectorAll('.share-btn .share-svg').forEach(function(el) { el.style.opacity = ''; });
    document.querySelectorAll('.room-stat .stat-val,.room-stat,.room-title,.share-title').forEach(function(el) { el.style.color = ''; });
    var sw = document.querySelector('.stage-wrapper');
    if (sw) sw.style.background = '';
    document.querySelectorAll('.studio-orig,.studio-trans,.st-name').forEach(function(el) { el.style.color = ''; });
    document.querySelectorAll('.hamburger-btn,.hamburger-dropdown a').forEach(function(el) { el.style.color = ''; el.style.borderColor = ''; });
    document.querySelectorAll('.spk-tag-name,.sidebar-left-head,.ctrl-label,.lang-btn').forEach(function(el) { el.style.color = ''; el.style.borderColor = ''; });
  }
}
(function() {
  var t = localStorage.getItem('sottotitoli-traduzione-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  updateThemeUI(t);
})();

// ═══ Init ═══
renderLines();
updateSpeakerSidebar();
updateRoomInfo();
</script>
