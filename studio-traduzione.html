<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sottotitoli · Traduzione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Bebas+Neue&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Geist+Mono:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --bg: #0a0f14; --card: rgba(255,255,255,.02); --line: rgba(255,255,255,.06);
  --text: rgba(255,255,255,.85); --muted: rgba(255,255,255,.45); --muted2: rgba(255,255,255,.18);
  --accent: #34d399; --accent2: #6ee7b7; --warn: #fbbf24; --danger: #f87171;
}
body {
  font-family: 'Work Sans', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}

/* ═══ TOP BAR ═══ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; gap: 12px; padding: 10px 20px;
  background: rgba(10,15,20,.9); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar .logo {
  font-family: 'Bebas Neue', sans-serif; font-size: 20px;
  letter-spacing: 1px; color: var(--accent); text-decoration: none;
}
.topbar .logo span { color: var(--muted2); }
.topbar .badge {
  font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 700;
  padding: 3px 8px; border-radius: 4px; letter-spacing: 1px;
  background: rgba(52,211,153,.12); color: var(--accent);
  border: 1px solid rgba(52,211,153,.2);
}
.topbar .badge.manual {
  background: rgba(251,191,36,.12); color: var(--warn);
  border-color: rgba(251,191,36,.2);
}
.topbar .spacer { flex: 1; }
.topbar button {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600;
  padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line);
  background: rgba(255,255,255,.03); color: var(--muted);
  cursor: pointer; transition: all .2s;
}
.topbar button:hover { background: rgba(255,255,255,.06); color: var(--text); }
.topbar button.active { background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.25); color: var(--accent); }
.topbar .live-dot {
  display: flex; align-items: center; gap: 6px;
  font-family: 'Work Sans', sans-serif; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 1px; color: var(--accent);
}
.topbar .live-dot::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px rgba(52,211,153,.5);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ═══ MAIN STAGE ═══ */
.stage {
  width: 100%; max-width: 1000px; margin-top: 50px;
  background: linear-gradient(180deg,#0d1117,#0a0e13);
  border: 1px solid var(--line); border-radius: 16px;
  overflow: hidden; animation: fadeInUp .6s cubic-bezier(.4,0,.2,1) both;
}
@keyframes fadeInUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
@keyframes spkPop { 0%{opacity:0;transform:scale(.7)} 60%{transform:scale(1.1)} 100%{opacity:1;transform:scale(1)} }

/* ═══ HEADER ═══ */
.studio-hdr {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 24px; background: rgba(255,255,255,.02);
  border-bottom: 1px solid var(--line);
}
.studio-hdr .st-name {
  font-family: 'Bebas Neue', sans-serif; font-size: 22px;
  letter-spacing: 1px; color: var(--accent); line-height: 1;
  cursor: pointer; user-select: none; position: relative;
  transition: color .2s;
}
.studio-hdr .st-name:hover { opacity: .8; }
.studio-hdr .st-name::after {
  content: ' ▾'; font-size: 14px; opacity: .5;
}
.studio-hdr .spk-count {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: var(--muted2); background: rgba(255,255,255,.03);
  padding: 3px 8px; border-radius: 4px;
}

/* ═══ CAPTION LINES ═══ */
.studio-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 0; min-height: 320px; }
.studio-line {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px; border-left: 3px solid transparent;
  border-radius: 0 6px 6px 0; margin-bottom: 2px;
  transition: background .2s; animation: fadeInUp .4s both;
}
.studio-line:hover { background: rgba(255,255,255,.015); }
.studio-line:nth-child(1) { animation-delay: 0s; }
.studio-line:nth-child(2) { animation-delay: .05s; }
.studio-line:nth-child(3) { animation-delay: .1s; }
.studio-line:nth-child(4) { animation-delay: .15s; }
.studio-line:nth-child(5) { animation-delay: .2s; }
.studio-line:nth-child(6) { animation-delay: .25s; }
.studio-line.new-speaker { animation: spkPop .4s cubic-bezier(.4,0,.2,1); }

.studio-spk {
  flex-shrink: 0; min-width: 40px; font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px;
  text-align: center; letter-spacing: .5px;
}
.studio-ts {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--muted2); flex-shrink: 0; padding-top: 4px; min-width: 56px;
}
.studio-content { flex: 1; min-width: 0; }
.studio-orig {
  font-family: 'Work Sans', sans-serif; font-size: 15px; font-weight: 400;
  line-height: 1.5; color: var(--text);
}
.studio-trans {
  font-family: 'Work Sans', sans-serif; font-size: 13px; font-weight: 400;
  line-height: 1.5; color: var(--muted); font-style: italic; margin-top: 3px;
}

/* Speaker color assignments */
.spk-en { border-left-color: rgba(107,157,255,.35); }
.spk-en .studio-spk { background: rgba(107,157,255,.12); color: #8ab4ff; }
.spk-it { border-left-color: rgba(248,113,113,.35); }
.spk-it .studio-spk { background: rgba(248,113,113,.12); color: #f99; }
.spk-fr { border-left-color: rgba(96,165,250,.35); }
.spk-fr .studio-spk { background: rgba(96,165,250,.12); color: #93c5fd; }
.spk-de { border-left-color: rgba(52,211,153,.35); }
.spk-de .studio-spk { background: rgba(52,211,153,.12); color: #6ee7b7; }
.spk-es { border-left-color: rgba(251,191,36,.35); }
.spk-es .studio-spk { background: rgba(251,191,36,.12); color: #fcd34d; }
.spk-zh { border-left-color: rgba(244,114,182,.35); }
.spk-zh .studio-spk { background: rgba(244,114,182,.12); color: #f9a8d4; }
.spk-ar { border-left-color: rgba(167,139,250,.35); }
.spk-ar .studio-spk { background: rgba(167,139,250,.12); color: #c4b5fd; }

/* ═══ MODE PICKER DROPDOWN ═══ */
.mode-picker { position: relative; display: inline-flex; align-items: center; gap: 10px; }
.mode-dropdown {
  position: absolute; top: 100%; left: 0; margin-top: 8px;
  background: #121620; border: 1px solid #1e2430; border-radius: 12px;
  padding: 6px; min-width: 210px; z-index: 200;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  display: none; animation: slideUp .2s cubic-bezier(.4,0,.2,1);
}
.mode-dropdown.open { display: block; }
.mode-dropdown button {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 14px; border: none; border-radius: 8px;
  background: transparent; color: rgba(255,255,255,.6);
  font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all .15s; text-align: left;
}
.mode-dropdown button:hover { background: rgba(255,255,255,.04); color: #fff; }
.mode-dropdown button.active { background: rgba(52,211,153,.08); color: var(--accent); font-weight: 600; }
.mode-dropdown .mode-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.mode-dropdown .mode-badge { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: rgba(255,255,255,.25); margin-left: auto; }

/* Empty state */
.studio-empty {
  font-family: 'Work Sans', sans-serif; font-size: 15px;
  color: var(--muted); padding: 60px 20px; text-align: center;
  font-style: italic;
}

/* ═══ CONTROLS ═══ */
.studio-ctrl {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 24px; border-top: 1px solid var(--line);
  background: rgba(255,255,255,.01); flex-wrap: wrap;
}
.ctrl-label {
  font-family: 'JetBrains Mono', monospace; font-size: 8px;
  color: var(--muted2); text-transform: uppercase;
  letter-spacing: 2px; margin-right: 4px;
}
.lang-btn {
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.05);
  color: rgba(255,255,255,.35); padding: 6px 12px; border-radius: 6px;
  cursor: pointer; font-family: 'Inter', sans-serif; font-size: 10px;
  font-weight: 500; transition: all .2s;
}
.lang-btn:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.6); }
.lang-btn.active {
  background: rgba(52,211,153,.12); border-color: rgba(52,211,153,.25);
  color: var(--accent); font-weight: 700;
}

.action-btn {
  padding: 10px 24px; border-radius: 8px; border: 1px solid rgba(255,255,255,.1);
  cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 15px;
  letter-spacing: 1.5px; transition: all .25s; margin-left: auto;
  background: rgba(255,255,255,.06); color: rgba(255,255,255,.7);
}
.action-btn:hover {
  background: rgba(255,255,255,.1); transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(0,0,0,.3);
}
.action-btn.primary {
  background: var(--accent); color: #000; border-color: var(--accent);
  box-shadow: 0 4px 16px rgba(52,211,153,.25);
}
.action-btn.primary:hover { box-shadow: 0 6px 24px rgba(52,211,153,.35); }
.action-btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.sim-btn {
  background: rgba(52,211,153,.08); border: 1px solid rgba(52,211,153,.2);
  color: var(--accent2); font-family: 'Work Sans', sans-serif;
  font-size: 10px; font-weight: 600; padding: 6px 14px; border-radius: 6px;
  cursor: pointer; transition: all .2s;
}
.sim-btn:hover { background: rgba(52,211,153,.15); }

/* ═══ MODAL ═══ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 999;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn .2s;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal-panel {
  background: #121620; border: 1px solid #1e2430; border-radius: 16px;
  width: 480px; max-width: 94vw; max-height: 85vh; overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,.6);
  animation: slideUp .25s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 22px; border-bottom: 1px solid #1e2430;
}
.modal-head h3 {
  font-family: 'Bebas Neue', sans-serif; font-size: 20px;
  letter-spacing: 1px; color: #e8eaed;
}
.modal-close {
  background: none; border: none; color: #555; font-size: 20px;
  cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all .2s;
}
.modal-close:hover { background: rgba(248,113,113,.1); color: var(--danger); }
.modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 16px 22px; border-top: 1px solid #1e2430;
}
.modal-foot button {
  padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer;
  font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px;
}
.btn-cancel { background: transparent; color: rgba(255,255,255,.4); }
.btn-cancel:hover { color: rgba(255,255,255,.7); background: rgba(255,255,255,.03); }
.btn-apply { background: #7c3aed; color: #fff; }
.btn-apply:hover { background: #6d28d9; box-shadow: 0 4px 16px rgba(124,58,237,.3); }

/* Mode toggle */
.mode-toggle { display: flex; background: #0a0d14; border-radius: 10px; padding: 3px; gap: 2px; }
.mode-opt {
  flex: 1; padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer;
  font-family: 'Work Sans', sans-serif; font-size: 12px; font-weight: 600;
  transition: all .25s; text-align: center; color: rgba(255,255,255,.35);
  background: transparent;
}
.mode-opt:hover { color: rgba(255,255,255,.6); }
.mode-opt.active { background: #1a1f2e; color: #e8eaed; box-shadow: 0 2px 8px rgba(0,0,0,.3); }

/* Speaker row in modal */
.spk-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: #0a0d14; border-radius: 10px; border: 1px solid #1a1f2e;
}
.spk-row input {
  width: 56px; padding: 6px 8px; border-radius: 6px; border: 1px solid #1e2430;
  background: #0f1219; color: #e8eaed; font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 700; text-align: center; outline: none;
}
.spk-row select {
  flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid #1e2430;
  background: #0f1219; color: #c4c8d0; font-family: 'Work Sans', sans-serif;
  font-size: 11px; outline: none; cursor: pointer;
}
.spk-row .color-dot {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.1);
  flex-shrink: 0; cursor: pointer;
}
.spk-row button {
  background: none; border: none; color: #555; cursor: pointer; font-size: 16px;
  padding: 2px 6px; border-radius: 4px;
}
.spk-row button:hover { background: rgba(248,113,113,.1); color: var(--danger); }
.add-spk-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px; background: transparent; border: 1px dashed #1e2430;
  border-radius: 10px; color: rgba(255,255,255,.25); cursor: pointer;
  font-family: 'Work Sans', sans-serif; font-size: 11px; font-weight: 500;
}
.add-spk-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(52,211,153,.04); }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1a1e2e; color: #e8eaed; padding: 10px 24px; border-radius: 10px;
  font-size: 12px; font-weight: 600; z-index: 9999;
  animation: fadeInUp .25s ease; box-shadow: 0 8px 32px rgba(0,0,0,.5);
  border: 1px solid #2a2e3e; pointer-events: none;
}

@media(max-width:600px) {
  body { padding: 8px; padding-top: 60px; }
  .stage { border-radius: 12px; }
  .studio-body { padding: 14px 12px; }
  .studio-ctrl { gap: 4px; padding: 10px 12px; }
  .studio-spk { min-width: 32px; font-size: 9px; }
  .studio-ts { font-size: 8px; min-width: 44px; }
}
</style>
</head>
<body>

<!-- ═══ TOP BAR ═══ -->
<header class="topbar">
  <a href="studio-caption-mockups-10.html" class="logo">SOTTO<span>TITOLI</span></a>
  <span class="badge" id="modeBadge">Universal</span>
  <span class="spacer"></span>
  <span class="live-dot" id="liveIndicator" onclick="toggleLive()">LIVE</span>
  <button onclick="openSpeakerConfig()" title="Configura speakers">⚙ Speaker Setup</button>
  <button onclick="simulateVoice()" title="Simula nuova voce">🎙 +Voice</button>
</header>

<!-- ═══ MAIN STAGE ═══ -->
<div class="stage">
  <div class="studio-hdr" onclick="if(!event.target.closest('.mode-picker')&&!event.target.closest('button'))openSpeakerConfig()" title="Click background for speaker setup">
    <div class="mode-picker">
      <span class="st-name" id="modeName" onclick="event.stopPropagation();toggleModePicker()">WX · Universal</span>
      <div class="mode-dropdown" id="modeDropdown">
        <button data-mode="w2" onclick="switchMode('w2')"><span class="mode-dot" style="background:#6b9dff"></span>W2 · Duet<span class="mode-badge">2 SPK</span></button>
        <button data-mode="w3" onclick="switchMode('w3')"><span class="mode-dot" style="background:#a78bfa"></span>W3 · Triad<span class="mode-badge">3 SPK</span></button>
        <button data-mode="w4" onclick="switchMode('w4')"><span class="mode-dot" style="background:#34d399"></span>W4 · Quad<span class="mode-badge">4 SPK</span></button>
        <button data-mode="w5" onclick="switchMode('w5')"><span class="mode-dot" style="background:#fbbf24"></span>W5 · Quintet<span class="mode-badge">5 SPK</span></button>
        <button data-mode="wx" class="active" onclick="switchMode('wx')"><span class="mode-dot" style="background:#34d399"></span>WX · Universal<span class="mode-badge">auto</span></button>
      </div>
    </div>
    <span class="spk-count" id="spkCount">3 SPK</span>
    <button onclick="event.stopPropagation();openSpeakerConfig()" style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);cursor:pointer;transition:all .2s" onmouseenter="this.style.background='rgba(255,255,255,.08)';this.style.color='#fff'" onmouseleave="this.style.background='rgba(255,255,255,.04)';this.style.color='rgba(255,255,255,.5)'">⚙ Speaker Setup</button>
  </div>
  <div class="studio-body" id="captionLines">
    <!-- Dynamically populated -->
  </div>
  <div class="studio-ctrl">
    <span class="ctrl-label">Target</span>
    <button class="lang-btn active" data-lang="IT">IT</button>
    <button class="lang-btn" data-lang="FR">FR</button>
    <button class="lang-btn" data-lang="DE">DE</button>
    <button class="lang-btn" data-lang="ES">ES</button>
    <button class="lang-btn" data-lang="PT">PT</button>
    <button class="lang-btn" data-lang="NL">NL</button>
    <button class="sim-btn" onclick="simulateVoice()">🎙 Simulate</button>
    <button class="action-btn primary" id="startBtn" onclick="toggleSession()">▶ START</button>
  </div>
</div>

<script>
// ═══ Speaker data ═══
var SPK_COLORS = ['#6b9dff','#f87171','#34d399','#fbbf24','#f472b6','#a78bfa','#60a5fa','#fb923c'];
var SPK_TAGS = ['EN','IT','FR','DE','ES','ZH','AR','NL'];
var SPK_CLASSES = ['en','it','fr','de','es','zh','ar','nl'];
var LANGS = ['Auto-detect','English','Italiano','Français','Deutsch','Español','Português','Nederlands','中文','日本語','العربية','Русский','한국어'];
var LANG_CODES = ['auto','en','it','fr','de','es','pt','nl','zh','ja','ar','ru','ko'];

var speakers = [
  { tag: 'EN', native: 'auto', color: '#6b9dff' },
  { tag: 'IT', native: 'auto', color: '#f87171' },
  { tag: 'FR', native: 'auto', color: '#34d399' }
];
var isLive = true;
var sessionActive = false;
var lineCounter = 0;

// ═══ Persistent line data (survives across speaker changes) ═══
var _lineData = [];

// ═══ Sample data (used only for initial population) ═══
var SAMPLES = [
  { en: 'we are discussing the future of real‑time translation', it: 'stiamo discutendo il futuro della traduzione in tempo reale' },
  { en: 'and how these systems can bridge language barriers', it: 'e come questi sistemi possono superare le barriere linguistiche' },
  { en: 'deployment at scale remains our biggest challenge', it: 'la distribuzione su larga scala rimane la nostra sfida più grande' },
  { en: 'we are seeing unprecedented accuracy in real‑time systems', it: 'stiamo vedendo una precisione senza precedenti' },
  { en: 'the advances in neural machine translation are remarkable', it: 'i progressi nella traduzione automatica neurale sono notevoli' },
  { en: 'let us begin this roundtable on language technology', it: 'iniziamo questa tavola rotonda sulla tecnologia linguistica' },
];

// ═══ Render caption lines (preserves existing text!) ═══
function renderLines() {
  var container = document.getElementById('captionLines');
  if (!container) return;
  if (speakers.length === 0) {
    container.innerHTML = '<div class="studio-empty">Nessuno speaker configurato. Clicca ⚙ Setup.</div>';
    _lineData = [];
    return;
  }

  // If no stored data, initialise from samples
  if (_lineData.length === 0) {
    var initCount = Math.min(speakers.length * 2, SAMPLES.length);
    for (var i = 0; i < initCount; i++) {
      _lineData.push({ en: SAMPLES[i].en, it: SAMPLES[i].it });
    }
  }

  // Ensure we have at least speakers.length lines
  var minLines = Math.min(speakers.length * 2, 8);
  while (_lineData.length < minLines) {
    var si2 = _lineData.length % SAMPLES.length;
    _lineData.push({ en: SAMPLES[si2].en, it: SAMPLES[si2].it });
  }

  var html = '';
  var baseTime = new Date();
  baseTime.setHours(3, 42, 0);

  for (var i = 0; i < _lineData.length; i++) {
    var si = i % speakers.length;
    var spk = speakers[si];
    var spkClass = SPK_CLASSES[SPK_TAGS.indexOf(spk.tag)] || spk.tag.toLowerCase();
    var ts = new Date(baseTime.getTime() + i * 3000);
    var tsStr = ts.toTimeString().substring(0,8);
    var line = _lineData[i];

    html += '<div class="studio-line spk-'+spkClass+'">';
    html += '<span class="studio-spk" style="background:'+hexToRgba(spk.color,.12)+';color:'+lighten(spk.color,1.3)+'">'+spk.tag+'</span>';
    html += '<span class="studio-ts">'+tsStr+'</span>';
    html += '<div class="studio-content">';
    html += '<div class="studio-orig">'+line.en+'</div>';
    html += '<div class="studio-trans">'+line.it+'</div>';
    html += '</div></div>';
  }
  container.innerHTML = html;
  document.getElementById('spkCount').textContent = speakers.length + ' SPK';
  
  // ═══ Attach speaker badge click handlers ═══
  setTimeout(function() {
    container.querySelectorAll('.studio-spk').forEach(function(badge) {
      badge.style.cursor = 'pointer';
      badge.title = 'Click to rename, double-click for full setup';
      badge.addEventListener('click', function(e) {
        e.stopPropagation();
        var oldName = this.textContent.trim();
        var newName = prompt('Rename speaker "' + oldName + '":', oldName);
        if (newName && newName !== oldName) {
          // Update speaker data
          for (var s = 0; s < speakers.length; s++) {
            if (speakers[s].tag === oldName) { speakers[s].tag = newName; break; }
          }
          renderLines();
          showToast('Speaker: ' + oldName + ' → ' + newName);
        }
      });
      badge.addEventListener('dblclick', function(e) {
        e.stopPropagation();
        openSpeakerConfig();
      });
    });
    
    // ═══ Line hover highlights ═══
    container.querySelectorAll('.studio-line').forEach(function(line) {
      line.addEventListener('mouseenter', function() { this.style.background = 'rgba(255,255,255,.02)'; });
      line.addEventListener('mouseleave', function() { this.style.background = ''; });
    });
  }, 50);
}

function hexToRgba(hex, a) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function lighten(hex, f) {
  var r = Math.min(255,Math.round(parseInt(hex.slice(1,3),16)*f));
  var g = Math.min(255,Math.round(parseInt(hex.slice(3,5),16)*f));
  var b = Math.min(255,Math.round(parseInt(hex.slice(5,7),16)*f));
  return '#'+[r,g,b].map(function(x){var h=x.toString(16);return h.length===1?'0'+h:h;}).join('');
}

// ═══ Speaker Config Modal ═══
function openSpeakerConfig() {
  var existing = document.querySelector('.modal-overlay');
  if (existing) existing.remove();
  
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  
  var modeNameEl = document.getElementById('modeName');
  var currentModeName = modeNameEl ? modeNameEl.textContent : 'Speakers';
  var html = '<div class="modal-panel">';
  html += '<div class="modal-head"><h3>⚙ Speaker Setup — '+currentModeName+'</h3><button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">✕</button></div>';
  html += '<div class="modal-body">';
  
  // Speakers list — no Auto/Manual toggle, always manual mode
  html += '<div style="display:flex;flex-direction:column;gap:8px">';
  html += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:2px;margin-bottom:4px">Speakers ('+speakers.length+')</span>';
  speakers.forEach(function(spk, i) {
    html += '<div class="spk-row">';
    html += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:rgba(255,255,255,.15);width:20px">#'+(i+1)+'</span>';
    html += '<input value="'+spk.tag+'" maxlength="6" onchange="updateSpeaker('+i+',\'tag\',this.value)">';
    html += '<select onchange="updateSpeaker('+i+',\'native\',this.value)">';
    LANG_CODES.forEach(function(lc, li) {
      html += '<option value="'+lc+'"'+(spk.native===lc?' selected':'')+'>'+LANGS[li]+'</option>';
    });
    html += '</select>';
    html += '<span class="color-dot" style="background:'+spk.color+'" onclick="cycleSpeakerColor('+i+',this)"></span>';
    html += '<button onclick="removeSpeaker('+i+')">✕</button>';
    html += '</div>';
  });
  html += '<button class="add-spk-btn" onclick="addSpeaker()">+ Add Speaker</button>';
  html += '</div>';
  
  html += '</div>';
  html += '<div class="modal-foot">';
  html += '<button class="btn-cancel" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>';
  html += '<button class="btn-apply" onclick="applyConfig();this.closest(\'.modal-overlay\').remove()">Apply</button>';
  html += '</div>';
  html += '</div>';
  
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
}

function updateSpeaker(idx, field, value) {
  if (field === 'tag') speakers[idx].tag = value;
  if (field === 'native') speakers[idx].native = value;
}

function cycleSpeakerColor(idx, dot) {
  var current = speakers[idx].color;
  var ci = SPK_COLORS.indexOf(current);
  var next = SPK_COLORS[(ci + 1) % SPK_COLORS.length];
  speakers[idx].color = next;
  dot.style.background = next;
}

function addSpeaker() {
  var newColor = SPK_COLORS[speakers.length % SPK_COLORS.length];
  var newTag = SPK_TAGS[speakers.length % SPK_TAGS.length];
  speakers.push({ tag: newTag, native: 'auto', color: newColor });
  // Rebuild modal
  var overlay = document.querySelector('.modal-overlay');
  if (overlay) overlay.remove();
  openSpeakerConfig();
}

function removeSpeaker(idx) {
  if (speakers.length <= 1) { showToast('Need at least 1 speaker'); return; }
  speakers.splice(idx, 1);
  var overlay = document.querySelector('.modal-overlay');
  if (overlay) overlay.remove();
  openSpeakerConfig();
}

function applyConfig() {
  renderLines();
  // Auto-detect mode from speaker count
  var count = speakers.length;
  var detectedMode;
  if (count <= 2) detectedMode = 'w2';
  else if (count === 3) detectedMode = 'w3';
  else if (count === 4) detectedMode = 'w4';
  else if (count === 5) detectedMode = 'w5';
  else detectedMode = 'wx';
  
  if (detectedMode !== currentMode) {
    switchMode(detectedMode);
  }
  showToast('✓ Speaker config applied — ' + speakers.length + ' speakers');
}

// ═══ Simulate voice detection (always available) ═══
function simulateVoice() {
  var usedTags = speakers.map(function(s) { return s.tag; });
  var available = SPK_TAGS.filter(function(t) { return usedTags.indexOf(t) === -1; });
  if (available.length === 0) { showToast('All speaker slots filled'); return; }
  var newTag = available[Math.floor(Math.random() * available.length)];
  var newColor = SPK_COLORS[speakers.length % SPK_COLORS.length];
  speakers.push({ tag: newTag, native: 'auto', color: newColor });
  renderLines();
  // Highlight new speaker
  var lines = document.querySelectorAll('.studio-line');
  if (lines.length) {
    var last = lines[lines.length-1];
    last.classList.add('new-speaker');
    setTimeout(function() { last.classList.remove('new-speaker'); }, 600);
  }
  showToast('🎙 New voice detected: ' + newTag);
}

// ═══ Language toggle with translation flash ═══
document.querySelectorAll('.lang-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
    var lang = this.getAttribute('data-lang');
    showToast('Translating to: ' + lang + ' (live)');
    // Flash all translations to indicate refresh
    document.querySelectorAll('.studio-trans').forEach(function(t) {
      t.style.opacity = '0.3';
      t.style.transition = 'opacity .15s';
      setTimeout(function() { t.style.opacity = ''; t.style.transition = ''; }, 150);
    });
  });
});

// ═══ Session toggle ═══
function toggleSession() {
  sessionActive = !sessionActive;
  var btn = document.getElementById('startBtn');
  if (sessionActive) {
    btn.textContent = '⏹ STOP';
    btn.classList.add('danger');
    btn.classList.remove('primary');
    showToast('▶ Session started');
  } else {
    btn.textContent = '▶ START';
    btn.classList.add('primary');
    btn.classList.remove('danger');
    showToast('⏹ Session stopped');
  }
}

// ═══ LIVE toggle ═══
function toggleLive() {
  isLive = !isLive;
  var el = document.getElementById('liveIndicator');
  if (isLive) {
    el.textContent = 'LIVE';
    el.style.color = '';
  } else {
    el.textContent = 'PAUSED';
    el.style.color = '#f87171';
  }
}

// ═══ Toast ═══
function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function() { t.remove(); }, 300); }, 2000);
}

// ═══ Mode Picker ═══
var currentMode = 'wx';
var MODE_CONFIGS = {
  w2: { name: 'W2 · Duet', accent: '#6b9dff', accent2: '#8ab4ff', bg: '#0a0f1a',
    speakers: [{tag:'EN',native:'en',color:'#6b9dff'},{tag:'IT',native:'it',color:'#f87171'}] },
  w3: { name: 'W3 · Triad', accent: '#a78bfa', accent2: '#c4b5fd', bg: '#0f0a1a',
    speakers: [{tag:'A',native:'auto',color:'#a78bfa'},{tag:'B',native:'auto',color:'#60a5fa'},{tag:'C',native:'auto',color:'#34d399'}] },
  w4: { name: 'W4 · Quad', accent: '#34d399', accent2: '#6ee7b7', bg: '#050a08',
    speakers: [{tag:'EN',native:'en',color:'#6b9dff'},{tag:'IT',native:'it',color:'#f87171'},{tag:'FR',native:'fr',color:'#60a5fa'},{tag:'DE',native:'de',color:'#34d399'}] },
  w5: { name: 'W5 · Quintet', accent: '#fbbf24', accent2: '#fcd34d', bg: '#0f0a05',
    speakers: [{tag:'EN',native:'en',color:'#6b9dff'},{tag:'IT',native:'it',color:'#f87171'},{tag:'ES',native:'es',color:'#fbbf24'},{tag:'ZH',native:'zh',color:'#f472b6'},{tag:'AR',native:'ar',color:'#34d399'}] },
  wx: { name: 'WX · Universal', accent: '#34d399', accent2: '#6ee7b7', bg: '#0a0f14',
    speakers: [{tag:'EN',native:'auto',color:'#6b9dff'},{tag:'IT',native:'auto',color:'#f87171'},{tag:'FR',native:'auto',color:'#34d399'}] }
};

function switchMode(modeId) {
  currentMode = modeId;
  var cfg = MODE_CONFIGS[modeId];
  if (!cfg) return;
  
  // Update accent CSS variables
  var root = document.documentElement;
  root.style.setProperty('--accent', cfg.accent);
  root.style.setProperty('--accent2', cfg.accent2);
  document.body.style.background = cfg.bg;
  
  // Update speakers (preserve line data if content exists)
  var hadContent = _lineData.length > 0;
  speakers = JSON.parse(JSON.stringify(cfg.speakers));
  if (hadContent) {
    // Re-assign speakers to existing lines and regenerate
    // _lineData is preserved, renderLines will use it
  }
  
  // Update UI
  document.getElementById('modeName').textContent = cfg.name;
  var badge = document.getElementById('modeBadge');
  var modeLabels = { w2: 'Duet', w3: 'Triad', w4: 'Quad', w5: 'Quintet', wx: 'Universal' };
  if (badge) { badge.textContent = modeLabels[modeId] || 'Universal'; badge.className = 'badge'; }
  
  // Update dropdown active state
  document.querySelectorAll('.mode-dropdown button').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-mode') === modeId);
  });
  
  // Close dropdown
  document.getElementById('modeDropdown').classList.remove('open');
  
  // Update speaker colors for language buttons
  document.querySelectorAll('.lang-btn.active').forEach(function(b) {
    b.style.background = hexToRgba(cfg.accent, .12);
    b.style.borderColor = hexToRgba(cfg.accent, .25);
    b.style.color = cfg.accent2;
  });
  
  renderLines();
  showToast('✓ Switched to ' + cfg.name);
}

function toggleModePicker() {
  var dd = document.getElementById('modeDropdown');
  dd.classList.toggle('open');
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
  var dd = document.getElementById('modeDropdown');
  var picker = document.querySelector('.mode-picker');
  if (dd && picker && !picker.contains(e.target)) {
    dd.classList.remove('open');
  }
});

// ═══ Keyboard shortcuts ═══
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { var m = document.querySelector('.modal-overlay'); if (m) m.remove(); }
  if (e.key === 'n' && e.ctrlKey) { e.preventDefault(); simulateVoice(); }
  if (e.key === ' ' && e.ctrlKey) { e.preventDefault(); toggleSession(); }
});

// ═══ Init ═══
renderLines();
</script>
