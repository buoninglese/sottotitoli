name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate panoramica build script
        run: |
          python build_panoramica.py
          test -s panoramica.html || { echo "❌ panoramica.html is empty or missing"; exit 1; }

      - name: Check voice backends are synced
        run: python sync_voice.py --check

      - name: Stage deployable files
        run: |
          mkdir _deploy
          # Copy everything, then remove what shouldn't be public
          cp -r ./* _deploy/ 2>/dev/null || true
          cp .nojekyll _deploy/ 2>/dev/null || true
          # Remove internal / sensitive directories
          rm -rf _deploy/dev _deploy/docs _deploy/extra-help _deploy/backups
          rm -rf _deploy/supabase _deploy/voice-core
          rm -rf _deploy/hf-image-studio _deploy/mockups _deploy/test _deploy/tmp _deploy/scripts _deploy/tools
          rm -rf _deploy/.github _deploy/.git
          # Remove internal / sensitive files
          rm -f _deploy/build_panoramica.py _deploy/sync_voice.py
          rm -f _deploy/config.example.js _deploy/AGENTS.md _deploy/CLAUDE.md
          rm -f _deploy/*.backup-*
          echo "✅ Staged $(ls _deploy/*.html 2>/dev/null | wc -l) HTML files"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
