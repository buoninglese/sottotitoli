name: Deploy to GitHub Pages (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check voice backends are synced
        run: python sync_voice.py --check

      - name: Stage deployable files
        run: |
          mkdir _deploy
          cp -r ./* _deploy/ 2>/dev/null || true
          cp .nojekyll _deploy/ 2>/dev/null || true
          rm -rf _deploy/dev _deploy/docs _deploy/extra-help _deploy/backups
          rm -rf _deploy/supabase _deploy/voice-core
          rm -rf _deploy/hf-image-studio _deploy/mockups _deploy/test _deploy/tmp _deploy/scripts _deploy/tools
          rm -rf _deploy/.github _deploy/.git
          for vdir in hugging-voice hugging-voice-base hugging-voice-kokoro; do
            rm -f _deploy/$vdir/server.py _deploy/$vdir/auth.py _deploy/$vdir/limiter.py
            rm -f _deploy/$vdir/Dockerfile _deploy/$vdir/requirements.txt _deploy/$vdir/.dockerignore
            rm -rf _deploy/$vdir/docs
          done
          rm -f _deploy/build_panoramica.py _deploy/sync_voice.py
          rm -f _deploy/config.example.js _deploy/AGENTS.md _deploy/CLAUDE.md
          rm -f _deploy/*.backup-*
          echo "✅ Staged $(ls _deploy/*.html 2>/dev/null | wc -l) HTML files"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
          publish_branch: gh-pages
          force_orphan: true
